मा।"}],"loc":"Section 2 · Column 1 · #1","c":"#2e7d32"},{"w":"Sable","hi":"काला (रंग)/मूल्यवान फ़र","en":"black; expensive dark fur","ex":"A small furry animal whose dark pelt is prized; the colour black, especially in poetry and heraldry — 'night spread her sable cloak'. Noun/adjective.","xs":"The knight rode through the sable darkness of the forest.","xh":"योद्धा जंगल की काली अंधेरी रात से गुज़रा।","t":"BLACK LABEL ≈ SABLE — गहरा काला.","note":"","s":[{"en":"He wore a sable coat.","hi":"उसने काला फ़र कोट पहना।"}],"loc":"Section 2 · Column 1 · #1","c":"#6d4c41"},{"w":"Pertinent","hi":"प्रासंगिक","en":"relevant to the matter","ex":"Directly related to the subject being discussed; relevant and to the point — a pertinent question. Formal adjective (opposite: impertinent).","xs":"The lawyer asked one pertinent question that broke the case open.","xh":"वकील ने एक सटीक सवाल पूछा जिसने पूरा मामला खोल दिया।","t":"PERTAIN से — विषय से \"जुड़ा हुआ\".","note":"","s":[{"en":"Ask pertinent questions.","hi":"प्रासंगिक प्रश्न पूछो।"}],"loc":"Section 2 · Column 1 · #1","c":"#e63980"},{"w":"Bust","hi":"अर्ध-प्रतिमा / फट जाना","en":"head-and-chest statue; to break","ex":"Broken — 'the vase is bust' (informal British); a sculpture of a person's head and shoulders; a sudden failure, especially of a business (go bust = go bankrupt); a police raid. Noun/verb/adjective.","xs":"The police busted the gang that was making fake currency.","xh":"पुलिस ने नक़ली करेंसी बनाने वाले गिरोह का पर्दाफ़ाश कर दिया।","t":"सर-कंधे तक की मूर्ति = bust; \"सब BUST (फट) गया\".","note":"","s":[{"en":"A bust of Gandhi stands there.","hi":"वहाँ गांधीजी की अर्ध-प्रतिमा है।"}],"loc":"Section 2 · Column 1 · #1","c":"#7c4dff"},{"w":"Appalled","hi":"स्तब्ध, आहत","en":"shocked (Part 1 #2 Appal देखें)","ex":"Shocked and horrified by something very bad or cruel — past form of appal; 'appalled by/by the news'. Also used as an adjective: deeply dismayed.","xs":"We were appalled to see the river black with factory waste.","xh":"कारख़ानों के कचरे से काली बहती नदी देखकर हम स्तब्ध रह गए।","t":"दोस्त की हरकत देखकर \"अप्पा!\" चौंक जाना.","note":"","s":[{"en":"She was appalled by the violence.","hi":"हिंसा देखकर वह स्तब्ध रह गई।"}],"loc":"Section 2 · Column 1 · #1","c":"#00897b"},{"w":"Licit","hi":"वैध","en":"legal, permitted","ex":"Allowed by law or the rules; lawful and legitimate. A formal adjective, the direct opposite of illicit; common in legal and moral discussion.","xs":"Only licit trade in medicines is permitted across the border.","xh":"सीमा पार दवाओं का केवल क़ानूनी व्यापार ही अनुमत है।","t":"L-L: LICIT = LEGAL; ILLICIT = illegal.","note":"","s":[{"en":"Licit trade needs no hiding.","hi":"वैध व्यापार छिपाने की ज़रूरत नहीं रखता।"}],"loc":"Section 2 · Column 1 · #1","c":"#ef6c00"},{"w":"Berserk","hi":"अत्यंत उन्मादी","en":"wild, frenzied","ex":"In a wild, violent frenzy, out of all control — 'go berserk' (from Old Norse berserker, a frenzied warrior); crowds go berserk, machines go berserk. Adjective/adverb.","xs":"The crowd went berserk when their team won in the last second.","xh":"आख़िरी सेकंड में अपनी टीम की जीत होते ही भीड़ पागलों की तरह झूम उठी।","t":"VIKING \"Berserker\" योद्धा — कवच के बिना पागलों की तरह लड़ते थे.","note":"","s":[{"en":"Fans went berserk at the concert.","hi":"कॉन्सर्ट में फैंस पागल हो गए।"}],"loc":"Section 2 · Column 1 · #1","c":"#3949ab"},{"w":"Taut","hi":"तना हुआ","en":"stretched tight","ex":"Pulled tight, with no slack — a taut rope, taut skin; also tense and controlled — taut muscles, a taut thriller plot. Adjective.","xs":"The sailor kept the rope taut so the sail would not flap.","xh":"मल्लाह ने रस्सी को कसकर खींच रखी थी ताकि पाल लहरा न जाए।","t":"TAUT ≈ TIGHT: \"टाइट\" तनी रस्सी.","note":"","s":[{"en":"Keep the rope taut.","hi":"रस्सी तनी रखो।"}],"loc":"Section 2 · Column 1 · #1","c":"#c62828"},{"w":"Flaccid","hi":"शिथिल, ढीला","en":"limp, soft","ex":"Soft, loose and lacking firmness — flaccid muscles, flaccid cheeks; figuratively weak and feeble, as a flaccid argument. Adjective.","xs":"After the cast was removed, his arm muscles were flaccid and weak.","xh":"प्लास्टर हटने के बाद उसके हाथ की मांसपेशियाँ ढीली और कमज़ोर हो गई थीं।","t":"FLAP + FLACCID: ढीला-पुराना जूते का जिव्हा जैसा.","note":"","s":[{"en":"Flaccid muscles need exercise.","hi":"शिथिल मांसपेशियों को व्यायाम चाहिए।"}],"loc":"Section 2 · Column 1 · #1","c":"#2e7d32"},{"w":"Etiquette","hi":"शिष्टाचार","en":"polite social behaviour","ex":"The polite, accepted rules of behaviour in a society or profession — table etiquette, email etiquette; the unwritten code of good manners. Noun.","xs":"He apologized for arriving late, mindful of Japanese business etiquette.","xh":"जापानी व्यावसायिक शिष्टाचार का ध्यान रखते हुए उसने देर से आने पर माफ़ी माँगी।","t":"\"A-TICKET\": शिष्ट समाज में घुसने का TICKET = शिष्टाचार.","note":"","s":[{"en":"Learn dining etiquette.","hi":"भोजन का शिष्टाचार सीखो।"}],"loc":"Section 2 · Column 1 · #1","c":"#6d4c41"},{"w":"Strife","hi":"कलह, संघर्ष","en":"bitter conflict","ex":"Bitter and often violent conflict between people, groups or nations — political strife, domestic strife. A formal, literary noun.","xs":"Years of strife between the two villages ended with a shared well.","xh":"दोनों गाँवों के बीच सालों चले झगड़े का अंत एक साझा कुएँ से हुआ।","t":"STRIKE + FIGHT = STRIFE — लगातार झगड़ा.","note":"","s":[{"en":"The country is torn by strife.","hi":"देश कलह से बँटा है।"}],"loc":"Section 2 · Column 1 · #1","c":"#e63980"},{"w":"Discern","hi":"भेद जानना","en":"recognize clearly","ex":"To notice or recognize something with effort, when it is faint, distant or unclear — discern a shape in the fog; to understand a subtle difference or truth. Formal verb; adjective: discernible; noun: discernment.","xs":"In the fading light, I could barely discern the path through the hills.","xh":"मंद होती रोशनी में मुझे पहाड़ों से गुज़रता रास्ता मुश्किल से ही दिखाई दे रहा था।","t":"DIS + CERN (छानना): छान-छान कर पहचानना.","note":"","s":[{"en":"I discerned sadness in her voice.","hi":"उसकी आवाज़ में उदासी भाँप ली।"}],"loc":"Section 2 · Column 1 · #1","c":"#7c4dff"},{"w":"Evade","hi":"बच निकलना","en":"escape by trickery","ex":"To escape or avoid something by a clever or dishonest move — evade a question, evade taxes, evade capture. Verb; nouns: evasion, evasiveness.","xs":"The minister cleverly evaded every question about the scam.","xh":"मंत्री ने घोटाले से जुड़े हर सवाल को चतुराई से टाल दिया।","t":"EVADE ≈ AVOID का भाई — चालाकी से टालना.","note":"","s":[{"en":"He evaded the question.","hi":"उसने सवाल टाल दिया।"}],"loc":"Section 2 · Column 1 · #1","c":"#00897b"},{"w":"Dingy","hi":"धुँधला-मैला","en":"dark and dirty","ex":"Dark, dirty and shabby; lacking brightness because of age, smoke or neglect — a dingy hotel room, dingy curtains. Adjective.","xs":"He rented a small dingy room above the old bookshop.","xh":"उसने पुरानी किताबों की दुकान के ऊपर एक छोटा, मैला-कुचैला कमरा किराए पर लिया।","t":"\"धुँधला\" = DINGY — ध ध्वनि से याद रखो.","note":"","s":[{"en":"A dingy alley led to his shop.","hi":"धुँधली गली उसकी दुकान तक जाती थी।"}],"loc":"Section 2 · Column 1 · #1","c":"#ef6c00"},{"w":"Ignoramus","hi":"अनजान/जाहिल","en":"very ignorant person","ex":"An ignorant, stupid person who knows nothing — an insulting word for someone hopelessly uninformed. Noun, plural: ignoramuses.","xs":"Call me an ignoramus if you like, but I truly can't fix engines.","xh":"मुझे जाहिल कह दो, पर सच पूछो तो मैं इंजन ठीक नहीं कर सकता।","t":"IGNORE + US: हमें (US) ignore करने वाला मूर्ख.","note":"","s":[{"en":"Don't be an ignoramus; read daily.","hi":"मूर्ख मत बनो; रोज़ पढ़ो।"}],"loc":"Section 2 · Column 1 · #1","c":"#3949ab"},{"w":"Vanquish","hi":"पराजित करना","en":"defeat completely","ex":"To defeat an enemy or opponent completely in battle, competition or argument; to conquer thoroughly. A formal, literary verb.","xs":"The young boxer vanquished the reigning champion in three rounds.","xh":"युवा मुक्केबाज़ ने तीन राउंड में मौजूदा चैंपियन को बुरी तरह हरा दिया।","t":"\"वन-VANQUISH\" — युद्ध में विजय.","note":"","s":[{"en":"Rama vanquished Ravana.","hi":"राम ने रावण को पराजित किया।"}],"loc":"Section 2 · Column 1 · #1","c":"#c62828"},{"w":"Concordant","hi":"सामंजस्यपूर्ण","en":"in agreement","ex":"In agreement; matching and harmonious — views concordant with the evidence; in music, making a pleasing combination of sounds. Formal adjective (opposite: discordant).","xs":"Both witnesses gave statements concordant with the CCTV footage.","xh":"दोनों गवाहों ने सीसीटीवी फुटेज से मेल खाते बयान दिए।","t":"CONCORD = एक सुर (chord) — मेल खाता हुआ.","note":"","s":[{"en":"Their views are concordant.","hi":"उनके विचार मेल खाते हैं।"}],"loc":"Section 2 · Column 1 · #1","c":"#2e7d32"},{"w":"Fondant","hi":"शक्कर-पेस्ट (केक आवरण)","en":"smooth sugar paste","ex":"A soft, sweet paste of sugar and water used to cover cakes or make fancy sweets; also sweets made from it. Noun.","xs":"The wedding cake was covered in smooth white fondant.","xh":"शादी की केक को चिकने सफ़ेद फंडेंट से ढका गया था।","t":"FOND (पसंद) केक की चिकनी परत.","note":"","s":[{"en":"She baked a fondant cake.","hi":"उसने फंडेंट केक बनाया।"}],"loc":"Section 2 · Column 1 · #1","c":"#6d4c41"},{"w":"Quandary","hi":"दुविधा","en":"a state of confusion over choice","ex":"A state of not knowing what to do because all choices seem difficult; a dilemma — 'be in a quandary about something'. Noun.","xs":"She was in a quandary: accept the abroad offer or stay with her ailing mother?","xh":"वह दुविधा में थी: विदेश वाली नौकरी चुने या बीमार माँ के पास रहे?","t":"QUANDARY = \"क्या-करूँ?!\" की उलझन.","note":"","s":[{"en":"He was in a quandary about the offer.","hi":"प्रस्ताव को लेकर वह दुविधा में था।"}],"loc":"Section 2 · Column 1 · #1","c":"#e63980"},{"w":"Intransigent","hi":"अडिग, हठी","en":"refusing to compromise","ex":"Refusing completely to change your opinion or to compromise, however reasonable the other side may be. Formal adjective; noun: intransigence.","xs":"The intransigent union leader refused every offer, so talks collapsed.","xh":"अडिय़न की चढ़ी हुई यूनियन नेता ने हर पेशकश ठुकरा दी, इसलिए बातचीत टूट गई।","t":"IN + TRANSIT: रास्ते से हटने को तैयार नहीं.","note":"","s":[{"en":"The intransigent union refused talks.","hi":"हठी संगठन वार्ता से मना कर गया।"}],"loc":"Section 2 · Column 1 · #1","c":"#7c4dff"},{"w":"Abnegate","hi":"त्याग देना","en":"renounce, deny oneself","ex":"To give up or deny yourself something, especially rights or pleasures; to reject or renounce — abnegate one's own desires. A very formal, literary verb; noun: abnegation.","xs":"The monk abnegated every worldly comfort for his spiritual goal.","xh":"साधु ने अपने आध्यात्मिक लक्ष्य के लिए हर सांसारिक सुख का त्याग किया।","t":"AB + NEGATE: अपनी इच्छाओं को NEGATE कर देना.","note":"","s":[{"en":"Monks abnegate worldly pleasures.","hi":"साधु सांसारिक सुखों का त्याग करते हैं।"}],"loc":"Section 2 · Column 1 · #1","c":"#00897b"},{"w":"Deleterious","hi":"हानिकारक","en":"causing harm","ex":"Causing harm or damage — deleterious effects of smoking, deleterious to health. A formal adjective, common in scientific writing.","xs":"Late-night screen time has a deleterious effect on children's sleep.","xh":"देर रात तक स्क्रीन देखने से बच्चों की नींद पर बुरा असर पड़ता है।","t":"DELETE + IOUS: सेहत DELETE कर देने वाला.","note":"","s":[{"en":"Smoking has deleterious effects.","hi":"धूम्रपान हानिकारक है।"}],"loc":"Section 2 · Column 1 · #1","c":"#ef6c00"},{"w":"Apogee","hi":"चरम शिखर","en":"the highest point","ex":"The highest, most successful point of something — the apogee of his career; in astronomy, the point in an orbit farthest from Earth. Formal noun (opposite: perigee).","xs":"The empire reached its apogee under Emperor Akbar.","xh":"सम्राट अकबर के शासन में साम्राज्य अपनी चरम सीमा पर पहुँचा।","t":"APO + GEO: पृथ्वी से सबसे दूर का बिंदु (चाँद की कक्षा का) = चरम.","note":"","s":[{"en":"This was the apogee of his career.","hi":"यह उसके करियर की चरम सीमा थी।"}],"loc":"Section 2 · Column 1 · #1","c":"#3949ab"},{"w":"Feud","hi":"खानदानी दुश्मनी","en":"long bitter quarrel between families/groups","ex":"A long, bitter quarrel between two families, groups or persons, often marked by revenge — the famous Montague–Capulet feud. Noun/verb.","xs":"The two families have been locked in a feud over land for decades.","xh":"दोनों परिवार दशकों से ज़मीन को लेकर लड़ाई में उलझे हुए हैं।","t":"TV शो \"FAMILY FEUD\" — घरानों की लड़ाई.","note":"","s":[{"en":"The feud lasted two generations.","hi":"दुश्मनी दो पीढ़ियों तक चली।"}],"loc":"Section 2 · Column 1 · #1","c":"#c62828"},{"w":"Quiver","hi":"काँपना / तरकश","en":"tremble; arrow-case","ex":"To shake slightly and quickly, from cold, fear or strong feeling — lips quiver, leaves quiver in the wind; also a case for carrying arrows. Verb/noun.","xs":"Her voice quivered as she read out her farewell speech.","xh":"विदाई भाषण पढ़ते समय उसकी आवाज़ काँप रही थी।","t":"ठंड में \"क्विवर-क्विवर\" काँपना; श्रीराम का तरकश.","note":"","s":[{"en":"Her lips quivered with fear.","hi":"डर से उसके होंठ काँपे।"}],"loc":"Section 2 · Column 1 · #1","c":"#2e7d32"},{"w":"Infatuation","hi":"आसक्ति, अंधा-मोह","en":"intense but short-lived passion","ex":"A strong but usually short-lived passion or admiration for someone or something, based more on fantasy than knowledge; intense but foolish love. Noun; adjective: infatuated.","xs":"His infatuation with the pop star faded after a few months.","xh":"पॉप स्टार के प्रति उसका दीवानापन कुछ ही महीनों में उतर गया।","t":"\"फालतू-नेशन\": फालतू प्यार = विवेकहीन मोह.","note":"","s":[{"en":"It was infatuation, not love.","hi":"वह प्रेम नहीं, आसक्ति थी।"}],"loc":"Section 2 · Column 2 · #1","c":"#6d4c41"},{"w":"Enervate","hi":"शक्तिहीन कर देना","en":"weaken (⚠️ energize नहीं!)","ex":"To drain someone of energy, strength or vitality — heat, illness or worry can enervate; NOT the same as energize, though it looks similar. Formal verb; adjective: enervating/enervated.","xs":"The enervating humidity of the coast sapped the soldiers' strength.","xh":"तट की थका देने वाली उमस ने सैनिकों की शक्ति समाप्त कर दी।","t":"ENERGY-खाऊ: ऊर्जा निगल जाने वाला = कमज़ोर करना.","note":"","s":[{"en":"The heat enervated the soldiers.","hi":"गर्मी ने सैनिकों को सुस्त कर दिया।"}],"loc":"Section 2 · Column 2 · #1","c":"#e63980"},{"w":"Displease","hi":"नाराज़ करना","en":"make unhappy","ex":"To make someone unhappy or annoyed, especially someone in authority — displease the boss, displease the gods. Verb (opposite: please); noun: displeasure.","xs":"The delayed report displeased the managing director.","xh":"देर से आई रिपोर्ट से प्रबंध निदेशक नाराज़ हो गए।","t":"DIS + PLEASE = खुश नहीं.","note":"","s":[{"en":"Loud music displeases neighbours.","hi":"तेज़ संगीत से पड़ोसी नाराज़ होते हैं।"}],"loc":"Section 2 · Column 2 · #1","c":"#7c4dff"},{"w":"Solitary","hi":"अकेला, एकांत","en":"done or existing alone","ex":"Alone, with no companions; done or had alone — a solitary walk, solitary confinement in prison; of plants or things: single and standing apart. Adjective.","xs":"He enjoys a solitary morning walk along the river.","xh":"उसे नदी किनारे अकेली सुबह की सैर करना पसंद है।","t":"SOLO trip — अकेली यात्रा.","note":"","s":[{"en":"He enjoys solitary walks.","hi":"वह अकेली सैर का आनंद लेता है।"}],"loc":"Section 2 · Column 2 · #1","c":"#00897b"},{"w":"Teleological","hi":"उद्देश्यात्मक","en":"explained by purpose/end-goal","ex":"Explaining things by their purpose or end goal rather than by cause — 'the eye exists so that we can see' is a teleological view. Philosophical adjective; noun: teleology.","xs":"A teleological explanation says the heart exists to pump blood.","xh":"उद्देश्यवादी (टेलियोलॉजिकल) व्याख्या कहती है कि दिल खून पंप करने के लिए ही है।","t":"TELOS = लक्ष्य (Greek): \"अंत में क्या मिलेगा\" वाला सिद्धांत.","note":"","s":[{"en":"A teleological view sees purpose in nature.","hi":"उद्देश्यवाद प्रकृति में उद्देश्य देखता है।"}],"loc":"Section 2 · Column 2 · #1","c":"#ef6c00"},{"w":"Quixotic","hi":"आदर्शवादी पर अव्यावहारिक","en":"wildly idealistic, unrealistic","ex":"Wildly idealistic and impractical; chasing grand dreams without regard for reality — like Don Quixote fighting windmills, a quixotic plan can be noble but is doomed. Adjective.","xs":"His quixotic mission to end world hunger alone won admiration but no results.","xh":"अकेले विश्व भूख मिटाने का उसका व्यर्थ आदर्शवादी मिशन सराहना तो लाया, पर कुछ हासिल नहीं हुआ।","t":"DON QUIXOTE — पवन-चक्कियों से लड़ने वाला राजपूत.","note":"","s":[{"en":"A quixotic plan to end poverty.","hi":"गरीबी मिटाने की अव्यावहारिक योजना।"}],"loc":"Section 2 · Column 2 · #1","c":"#3949ab"},{"w":"Proclivity","hi":"झुकाव, प्रवृत्ति","en":"natural tendency (esp. bad)","ex":"A natural tendency or liking to behave in a particular way, often something undesirable — a proclivity for lying, for violence. Formal noun.","xs":"His proclivity for exaggeration made his stories hard to believe.","xh":"बात बढ़ा-चढ़ाकर कहने की उसकी प्रवृत्ति के कारण उसकी कहानियों पर यक़ीन करना मुश्किल था।","t":"CLIVUS = ढाल: ढाल की तरह नीचे झुकाव.","note":"","s":[{"en":"He has a proclivity for lying.","hi":"उसमें झूठ बोलने की प्रवृत्ति है।"}],"loc":"Section 2 · Column 2 · #1","c":"#c62828"},{"w":"Munch","hi":"चबाना","en":"chew steadily","ex":"To eat steadily and noisily, crunching with the teeth — munch on popcorn, munch an apple. Verb.","xs":"The children munched popcorn all through the movie.","xh":"बच्चे पूरी फ़िल्म के दौरान पॉपकॉर्न चबाते रहे।","t":"चिप्स \"मंच-मंच\" आवाज़ करती है.","note":"","s":[{"en":"He munched peanuts.","hi":"वह मूँगफली चबा रहा था।"}],"loc":"Section 2 · Column 2 · #1","c":"#2e7d32"},{"w":"Spur","hi":"प्रोत्साहन देना","en":"urge on; incentive","ex":"A spiked wheel worn by a rider to urge a horse forward; anything that pushes someone to act — an incentive or stimulus ('the spur of hunger'); to encourage strongly (spur growth); a short side road or mountain projection. Noun/verb.","xs":"Fear of failing spurred him to study all night.","xh":"फेल होने का डर उसे रात भर पढ़ने के लिए उकसाता रहा।","t":"घोड़े के पेट में स्पर (काँटा) = दौड़ाने वाला.","note":"","s":[{"en":"Competition spurs growth.","hi":"प्रतिस्पर्धा विकास को प्रेरित करती है।"}],"loc":"Section 2 · Column 2 · #1","c":"#6d4c41"},{"w":"Dazed","hi":"हक्का-बक्का","en":"stunned and confused","ex":"Confused and unable to think clearly, usually after a blow, shock or surprise — a dazed expression; often a result of being dazed by something. Adjective; verb: daze.","xs":"The batsman looked dazed after the ball hit his helmet.","xh":"गेंद हेलमेट से टकराने के बाद बल्लेबाज़ भोंचक सा खड़ा रहा।","t":"धड़ाम! सिर घूम गया = dazed.","note":"","s":[{"en":"He was dazed by the blow.","hi":"चोट से वह हक्का-बक्का रह गया।"}],"loc":"Section 2 · Column 2 · #1","c":"#e63980"},{"w":"Ragged","hi":"चिथड़ों वाला","en":"torn; rough-edged","ex":"Of clothes: old, torn and uneven at the edges; of people: dressed in such clothes; uneven and rough — ragged breathing, a ragged line. Adjective; also ragged edge, run ragged.","xs":"The beggar's ragged clothes offered little protection from the cold.","xh":"भिखारिन के फटे-पुराने कपड़े ठंड से ज़्यादा बचाव नहीं कर पा रहे थे।","t":"फटे (RAG) कपड़े — बेढंगे.","note":"","s":[{"en":"The beggar wore ragged clothes.","hi":"भिखारी चिथड़ों में था।"}],"loc":"Section 2 · Column 2 · #1","c":"#7c4dff"},{"w":"Inclusive","hi":"समावेशी","en":"including everyone/everything","ex":"Including everything stated within the limits — 'Tuesday to Friday inclusive' counts both days; welcoming and involving all kinds of people without discrimination — an inclusive school. Adjective (opposite: exclusive); noun: inclusiveness.","xs":"The resort charges $200 a night, meals inclusive.","xh":"रिसॉर्ट की रात की फ़ीस $200 है, भोजन सहित।","t":"INCLUDE से — सबको शामिल करने वाला.","note":"","s":[{"en":"An inclusive policy helps all.","hi":"समावेशी नीति सबकी मदद करती है।"}],"loc":"Section 2 · Column 2 · #1","c":"#00897b"},{"w":"Snub","hi":"अनदेखा करना","en":"rebuff coldly","ex":"To insult someone by pointedly ignoring or rejecting them — snub a handshake, snub an invitation; the insult itself is also a snub. Verb/noun.","xs":"The actress snubbed the reporter by walking away mid-interview.","xh":"अभिनेत्री ने साक्षात्कार के बीच में चली जाकर रिपोर्टर को ठुकरा दिया।","t":"सनकी (SNUB) ने मुँह मोड़ लिया.","note":"","s":[{"en":"She snubbed me at the party.","hi":"उसने पार्टी में मेरी अनदेखी की।"}],"loc":"Section 2 · Column 2 · #1","c":"#ef6c00"},{"w":"Refractory","hi":"ज़िद्दी, अकड़ू","en":"stubbornly disobedient","ex":"Stubbornly resisting control, authority or treatment — a refractory child, refractory symptoms that ignore medicine; in industry, able to bear high heat (refractory bricks). Formal adjective.","xs":"The refractory mule refused to move even an inch uphill.","xh":"ज़िद्दी खच्चर चढ़ाई की ओर एक इंच भी बढ़ने को तैयार नहीं हुआ।","t":"REFRACT (मोड़ना) से इनकार — न मानने वाला.","note":"","s":[{"en":"A refractory mule refused to move.","hi":"ज़िद्दी खच्चर हिलने से मना कर गया।"}],"loc":"Section 2 · Column 2 · #1","c":"#3949ab"},{"w":"Intractable","hi":"जटिल, न सुलझने वाला","en":"hard to control or solve","ex":"Very hard to control, manage, solve or deal with — an intractable problem, intractable pain; also stubborn and unmanageable (of a person). Formal adjective (opposite: tractable).","xs":"Corruption in the department proved intractable despite every reform.","xh":"हर सुधार के बावजूद विभाग का भ्रष्टाचार सुलझाने में न आने वाला साबित हुआ।","t":"IN + TRACT (खींचना/संभालना): संभालना कठिन.","note":"","s":[{"en":"Poverty is an intractable problem.","hi":"गरीबी जटिल समस्या है।"}],"loc":"Section 2 · Column 2 · #1","c":"#c62828"},{"w":"Tractable","hi":"काबू में आने वाला","en":"easily managed","ex":"Easily controlled, managed or taught — a tractable horse, a tractable student; also (of problems) easily solvable. Formal adjective (opposite: intractable).","xs":"The new intern was tractable and learned the work in a week.","xh":"नया ट्रेनी आज्ञाकारी था और एक हफ़्ते में काम सीख गया।","t":"IN हटाओ — बन गया संभलने वाला.","note":"","s":[{"en":"The tractable pup learned fast.","hi":"सुशील पिल्ला जल्दी सीखा।"}],"loc":"Section 2 · Column 2 · #1","c":"#2e7d32"},{"w":"Coy","hi":"शर्मीला (दिखावटी)","en":"pretending shy modesty","ex":"Pretending to be shy or modest, especially about love or a compliment, often to tease; evasive and reluctant to give straight information — 'the minister was coy about his plans'. Adjective.","xs":"She gave a coy smile and refused to name her fiancé.","xh":"वह लज़ीली मुस्कुराई और अपने मंगेतर का नाम बताने से मना कर दिया।","t":"\"कॉय-कॉय\" शरमाकर इशारा करना.","note":"","s":[{"en":"She gave a coy smile.","hi":"उसने शर्माती हुई मुस्कान दी।"}],"loc":"Section 2 · Column 2 · #1","c":"#6d4c41"},{"w":"Pusillanimous","hi":"बुज़दिल","en":"cowardly, faint-hearted","ex":"Cowardly; lacking courage and determination, especially shrinking from danger or responsibility out of fear. A formal, literary adjective; noun: pusillanimity.","xs":"The pusillanimous manager let his staff take the blame for his own mistake.","xh":"कायर मैनेजर ने अपनी गलती का दोष अपने स्टाफ़ पर डाल दिया।","t":"PUSILLI (छोटा) + ANIMUS (दिल): छोटा दिल = कायर.","note":"","s":[{"en":"A pusillanimous surrender shocked all.","hi":"कायराना समर्पण ने सब चौंकाया।"}],"loc":"Section 2 · Column 2 · #1","c":"#e63980"},{"w":"Sclerotic","hi":"कठोर/कठिबद्ध","en":"hardened; rigid","ex":"Becoming hard, rigid and stiff — in medicine, hardened tissue (arteriosclerosis); figuratively, an organization or system that has become inflexible and unable to adapt. Adjective.","xs":"Years of the same leadership left the company sclerotic and slow to change.","xh":"सालों तक एक ही नेतृत्व ने कंपनी को कठोर और बदलाव के लिए सुस्त बना दिया।","t":"ARTERIO-SCLEROSIS: नसों का कठोर हो जाना.","note":"","s":[{"en":"Sclerotic arteries raise BP.","hi":"कठोर धमनियाँ BP बढ़ाती हैं।"}],"loc":"Section 2 · Column 2 · #1","c":"#7c4dff"},{"w":"Ossified","hi":"अस्थिमय, पथराया","en":"turned to bone; stuck in old ways","ex":"Turned into bone (medical: tissue ossifies); figuratively, become rigid, fixed and unable to change — ossified traditions, an ossified bureaucracy. Adjective; verb: ossify.","xs":"The ossified exam system resisted every attempt at reform.","xh":"जकड़ चुकी परीक्षा व्यवस्था ने सुधार की हर कोशिश को नाकाम किया।","t":"अस्थि = bone → OSSIFIED = हड्डी जैसा जमा हुआ.","note":"","s":[{"en":"Ossified minds resist change.","hi":"पथराया सोच बदलाव से इनकार करती है।"}],"loc":"Section 2 · Column 2 · #1","c":"#00897b"},{"w":"Crepuscular","hi":"गोधूलि-कालीन","en":"of twilight (dawn/dusk)","ex":"Relating to or active during twilight — the dim light just after sunset or before sunrise. In biology, describes animals (bats, moths, deer) that come out at dusk rather than day or night. Technical adjective.","xs":"Crepuscular animals like bats begin hunting just after sunset.","xh":"चमगादड़ जैसे सांझ-चरे जानवर सूर्यास्त के तुरंत बाद शिकार करने निकलते हैं।","t":"CREPUSCULE = साँझ — चाय-पकौड़े वाला अरसा.","note":"","s":[{"en":"Bats are crepuscular animals.","hi":"चमगादड़ सांध्यकालीन जीव हैं।"}],"loc":"Section 2 · Column 2 · #1","c":"#ef6c00"},{"w":"Vespertine","hi":"सायंकालीन","en":"of the evening","ex":"Of, relating to, or occurring in the evening; blooming or opening in the evening hours — vespertine flowers, vespertine habits. A scholarly adjective from Latin vesper (evening star).","xs":"The garden's vespertine flowers open only when the evening cools.","xh":"बगीचे के सांझ खिलने वाले फूल तभी खुलते हैं जब शाम ठंडी होती है।","t":"VESPER = शाम की घंटी/प्रार्थना.","note":"","s":[{"en":"Jasmine is a vespertine flower.","hi":"चमेली शाम खिलने वाला फूल है।"}],"loc":"Section 2 · Column 2 · #1","c":"#3949ab"},{"w":"Matutinal","hi":"प्रातःकालीन","en":"of the morning","ex":"Of or happening in the early morning; belonging to morning hours — matutinal prayers, matutinal walks. A formal, literary adjective from Latin matuta (morning).","xs":"His matutinal jog before dawn keeps him fresh all day.","xh":"सुबह-सुबह, भोर से पहले की उसकी दौड़ उसे सारा दिन तरोताज़ा रखती है।","t":"\"मात\" = सुबह की माता — मॉर्निंग शब्द.","note":"","s":[{"en":"He enjoys matutinal walks.","hi":"वह सुबह की सैर का शौकीन है।"}],"loc":"Section 2 · Column 2 · #1","c":"#c62828"},{"w":"Diurnal","hi":"दैनिक, दिवाचर","en":"daily; active in daytime","ex":"Active or occurring during the daytime rather than night — diurnal animals, diurnal rhythms; happening once a day or daily — a diurnal cycle. Technical adjective (opposite: nocturnal).","xs":"Squirrels are diurnal, so you never see them out at midnight.","xh":"गिलहरियाँ दिनचर होती हैं, इसलिए उन्हें कभी आधी रात को नहीं देखा जाता।","t":"DIARY रोज़ लिखो = दैनिक; दिन में जागने वाले जीव.","note":"","s":[{"en":"Squirrels are diurnal.","hi":"गिलहरी दिवाचर हैं।"}],"loc":"Section 2 · Column 3 · #1","c":"#2e7d32"},{"w":"Recondite","hi":"गूढ़, दुर्बोध","en":"little-known, hard to grasp","ex":"(Of knowledge or a subject) little known, obscure and understood only by specialists; deep and difficult — recondite theories of physics. Formal adjective.","xs":"The lecture was full of recondite philosophy that baffled most students.","xh":"व्याख्यान ऐसे गूढ़ दर्शन से भरा था जिसने ज़्यादातर छात्रों को उलझा दिया।","t":"RECONDITE = \"RECORD HIDDEN\" — छिपा हुआ गहरा ज्ञान.","note":"","s":[{"en":"Quantum physics is recondite.","hi":"क्वांटम भौतिकी गूढ़ है।"}],"loc":"Section 2 · Column 3 · #1","c":"#6d4c41"},{"w":"Peregrinate","hi":"भ्रमण करना","en":"travel about","ex":"To travel or journey about, especially on foot and over a long distance; to wander from place to place. A formal, humorous or literary verb; noun: peregrination.","xs":"After retirement, he spent years peregrinating through the Himalayan valleys.","xh":"रिटायरमेंट के बाद वर्षों वह हिमालय की घाटियों में भ्रमण करता रहा।","t":"PEREGRINE बाज़ — प्रवास भरने वाला पक्षी.","note":"","s":[{"en":"They peregrinated across Asia.","hi":"वे एशिया भर घूमते रहे।"}],"loc":"Section 2 · Column 3 · #1","c":"#e63980"},{"w":"Perambulate","hi":"टहलते हुए चक्कर लगाना","en":"walk around","ex":"To walk about, especially in a leisurely, formal or inspecting way — perambulate the grounds; also (legal) to officially walk the boundaries of land. Formal verb; noun: perambulation.","xs":"The inspector perambulated the entire campus before signing the report.","xh":"रिपोर्ट पर दस्तख़त करने से पहले निरीक्षक ने पूरे परिसर का भ्रमण किया।","t":"PER + AMBLE (टहलना) — चारों ओर टहलना.","note":"","s":[{"en":"We perambulated the old city.","hi":"हम पुराने शहर का चक्कर लगाते रहे।"}],"loc":"Section 2 · Column 3 · #1","c":"#7c4dff"},{"w":"Sojourn","hi":"अल्पकालिक ठहराव","en":"a brief stay","ex":"A short, temporary stay in a place away from home; to stay somewhere for a while — a sojourn in Paris. Formal noun/verb.","xs":"During her sojourn in Japan, she mastered basic conversation in Japanese.","xh":"जापान में अपने कुछ दिन के प्रवास के दौरान वह जापानी में बुनियादी बातचीत सीख गई।","t":"SO + JOURNEY: यात्रा में बीच का ठहराव.","note":"","s":[{"en":"A sojourn in the hills refreshed him.","hi":"पहाड़ों में अल्प ठहराव ने तरोताज़ा किया।"}],"loc":"Section 2 · Column 3 · #1","c":"#00897b"},{"w":"Traverse","hi":"पार करना","en":"cross over","ex":"To travel across, over or through a large area — traverse a desert, a bridge traverses the river; also to move across a slope sideways in mountaineering; in law, to dispute formally. Formal verb/noun.","xs":"The camel caravan took two weeks to traverse the vast desert.","xh":"ऊँटों के काफ़िले को विशाल मरुस्थल पार करने में दो हफ़्ते लगे।","t":"TRANSVERSE = आर-पार — काटकर जाना.","note":"","s":[{"en":"They traversed the desert.","hi":"उन्होंने रेगिस्तान पार किया।"}],"loc":"Section 2 · Column 3 · #1","c":"#ef6c00"},{"w":"Nugatory","hi":"निरर्थक, रद्द","en":"of no value","ex":"Worthless; of no value, force or effect — a nugatory promise, nugatory efforts. A very formal, legal-flavoured adjective.","xs":"Without the signature, the contract was nugatory.","xh":"दस्तख़त के बिना अनुबंध निरर्थक था।","t":"\"NO-GO\": रास्ता NO-GO है = बेकार/रद्द.","note":"","s":[{"en":"The clause was nugatory.","hi":"उपबंध निरर्थक था।"}],"loc":"Section 2 · Column 3 · #1","c":"#3949ab"},{"w":"Nominal","hi":"नाममात्र का","en":"tiny; in name only","ex":"Existing in name only, not in reality — a nominal head of state; very small compared to real value — a nominal fee; also the stated amount without adjustment. Adjective.","xs":"The park charges a nominal entry fee of just two rupees.","xh":"पार्क में प्रवेश की नाममात्र फ़ीस है, बस दो रुपये।","t":"NOMINAL फीस = बस नाम की फीस.","note":"","s":[{"en":"They charged a nominal fee.","hi":"उन्होंने नाममात्र शुल्क लिया।"}],"loc":"Section 2 · Column 3 · #1","c":"#c62828"},{"w":"Propinquity","hi":"निकटता","en":"nearness (place or blood)","ex":"Nearness in place or time — the propinquity of the two houses; closeness of blood relationship or kinship. A formal, scholarly noun.","xs":"The propinquity of the factory to the school worried the parents.","xh":"स्कूल के समीप कारख़ाना होने से अभिभावक चिंतित थे।","t":"PROXIMITY का भाई — पास-पास होना.","note":"","s":[{"en":"The propinquity of the metro helps.","hi":"मेट्रो की निकटता सहायक है।"}],"loc":"Section 2 · Column 3 · #1","c":"#2e7d32"},{"w":"Contiguity","hi":"सीमा से लगा होना","en":"touching, adjacent","ex":"The state of touching or being physically next to each other; adjacency — the contiguity of India and Nepal. Formal noun; adjective: contiguous.","xs":"The contiguity of the two plots made combined construction easy.","xh":"दोनों प्लॉटों का आपस में जुड़ा होना संयुक्त निर्माण आसान बना गया।","t":"CONTIGUOUS राज्य = सीमा से जुड़े राज्य.","note":"","s":[{"en":"The contiguity of the two plots matters.","hi":"दोनों प्लॉटों का लगा होना मायने रखता है।"}],"loc":"Section 2 · Column 3 · #1","c":"#6d4c41"},{"w":"Consanguinity","hi":"रक्त-संबंध","en":"blood relationship","ex":"Blood relationship; descent from the same ancestor — siblings have close consanguinity; in law, kinship by blood as opposed to marriage. Formal noun; adjective: consanguineous.","xs":"The court needed proof of consanguinity to settle the inheritance dispute.","xh":"विरासत का विवाद सुलझाने के लिए अदालत को ख़ून के रिश्ते का प्रमाण चाहिए था।","t":"CON + SANGUINE (खून): एक ही खून का होना.","note":"","s":[{"en":"Marriage within consanguinity is prohibited.","hi":"सगे संबंधियों में विवाह वर्जित है।"}],"loc":"Section 2 · Column 3 · #1","c":"#e63980"},{"w":"Perspicacious","hi":"तीक्ष्णदर्शी, दूरदर्शी","en":"mentally sharp","ex":"Having sharp insight; able to notice and understand things that others miss — a perspicacious critic sees through fake claims. Formal adjective; noun: perspicacity (do not confuse with perspiration = sweat).","xs":"The perspicacious detective noticed the fake signature within minutes.","xh":"तीक्ष्ण बुद्धि वाले जासूस ने मिनटों में जाली दस्तख़त पकड़ लिया।","t":"SPEC (आँख) तेज़ — एक झलक में समझ जाने वाला.","note":"","s":[{"en":"A perspicacious reader caught the hint.","hi":"तीक्ष्ण पाठक ने इशारा पकड़ लिया।"}],"loc":"Section 2 · Column 3 · #1","c":"#7c4dff"},{"w":"Archaistic","hi":"प्राचीन-शैली अपनाने वाला","en":"deliberately old-style","ex":"Deliberately imitating the style of an older age; made to look ancient on purpose — archaistic statues, archaistic language in a modern novel. Adjective (different from archaic, which is simply old).","xs":"The filmmaker used archaistic dialogue to give the scene an ancient feel.","xh":"फ़िल्मकार ने दृश्य को प्राचीन दिखाने के लिए पुराने ढंग की भाषा की नकल की।","t":"ARCHAIC (प्राचीन) + ISTIC — पुरानी शैली की नकल.","note":"","s":[{"en":"The archaistic painting imitated Mughal art.","hi":"प्राचीन-शैली का चित्र मुगल कला की नकल था।"}],"loc":"Section 2 · Column 3 · #1","c":"#00897b"},{"w":"Antiquarian","hi":"पुरातत्व-प्रेमी","en":"collector of antiques","ex":"Related to the study or collection of old and rare things — an antiquarian bookseller; a person who studies or collects antiques (an antiquarian). Adjective/noun.","xs":"The antiquarian paid a fortune for a 400-year-old manuscript.","xh":"पुरातत्व-संग्राहक ने चार सौ साल पुरानी पांडुलिपि के लिए खूब पैसे दिए।","t":"ANTIQUE चीज़ों का शौकीन.","note":"","s":[{"en":"An antiquarian sold me old coins.","hi":"पुरातत्व-प्रेमी ने पुराने सिक्के बेचे।"}],"loc":"Section 2 · Column 3 · #1","c":"#ef6c00"},{"w":"Tenable","hi":"टिकाऊ (तर्क/पद)","en":"defensible, reasonable","ex":"(Of an opinion, position or theory) able to be defended and maintained against criticism; also (of a job) able to be held — a tenable argument. Formal adjective (opposite: untenable).","xs":"His claim collapsed because it was no longer tenable.","xh":"उसका दावा गिर गया, क्योंकि अब उसे बचाना संभव नहीं था।","t":"TEN + ABLE: दस हाथों तक टिकने लायक.","note":"","s":[{"en":"His claim is tenable.","hi":"उसका दावा तर्कसंगत है।"}],"loc":"Section 2 · Column 3 · #1","c":"#3949ab"},{"w":"Apodictic","hi":"अकाट्य, निश्चित","en":"necessarily true; beyond doubt","ex":"Expressing something with absolute certainty, beyond dispute — an apodictic statement, apodictic proof in logic. A philosophical and legal adjective.","xs":"The fingerprint evidence made his guilt apodictic.","xh":"फ़िंगरप्रिंट के सबूत ने उसका अपराध असंदिग्ध बना दिया।","t":"DICT (कहना): \"हुक्म\" जैसा पक्का-पक्का कथन.","note":"","s":[{"en":"Geometry has apodictic proofs.","hi":"ज्यामिति के प्रमाण अकाट्य होते हैं।"}],"loc":"Section 2 · Column 3 · #1","c":"#c62828"},{"w":"Tendentious","hi":"पक्षपातपूर्ण","en":"favouring one view","ex":"Written or said to push one particular view or cause, showing clear bias rather than neutrality — a tendentious report, tendentious headlines. Formal adjective (opposite: dispassionate).","xs":"The tendentious article blamed only one side for the clash.","xh":"पक्षपाती लेख ने टकराव का दोष सिर्फ़ एक पक्ष पर लगाया।","t":"TENDENCY: एक ही तरफ झुका हुआ.","note":"","s":[{"en":"The tendentious article ignored facts.","hi":"पक्षपाती लेख ने तथ्यों को नज़रअंदाज़ किया।"}],"loc":"Section 2 · Column 3 · #1","c":"#2e7d32"},{"w":"Partisan","hi":"पक्षपाती, दलबद्ध","en":"blindly devoted to a party","ex":"Strongly supporting one party, group or side and unable to judge fairly — partisan politics, partisan media; also a member of an armed resistance group. Adjective/noun.","xs":"The referee's partisan decisions angered the visiting team.","xh":"रेफ़री के पक्षपातपूर्ण फ़ैसलों से आने वाली टीम नाराज़ हो गई।","t":"PARTY + AN = पार्टी का पक्का कार्यकर्ता.","note":"","s":[{"en":"Partisan debates rarely inform.","hi":"पक्षपाती बहसें जानकारी नहीं देतीं।"}],"loc":"Section 2 · Column 3 · #1","c":"#6d4c41"},{"w":"Dispassionate","hi":"निष्पक्ष, शांत","en":"free from emotion/bias","ex":"Judging or speaking without being influenced by strong emotion; calm, fair and impartial — a dispassionate analysis. Adjective.","xs":"The judge gave a dispassionate ruling based purely on the evidence.","xh":"जज ने पूरी तरह सबूतों के आधार पर भावशून्य और निष्पक्ष फ़ैसला सुनाया।","t":"DIS + PASSION: जज़्बा हटाओ = ठंडे दिमाग़ से विचार.","note":"","s":[{"en":"A dispassionate judge weighs facts.","hi":"निष्पक्ष न्यायाधीश तथ्यों को तौलता है।"}],"loc":"Section 2 · Column 3 · #1","c":"#e63980"},{"w":"Chronicled","hi":"इतिवृत्त में दर्ज","en":"recorded in order of time","ex":"Recorded as a series of events in history or in a story — a chronicle is a written record; 'chronicled' means its events have been written down in order. Adjective/verb (to chronicle).","xs":"The village's 200-year history is chronicled in the temple's stone records.","xh":"गाँव के दो सौ साल के इतिहास का लेखा मंदिर के पत्थरों पर दर्ज है।","t":"CHRONO = समय — समय के साथ लिखी घटनाएँ.","note":"","s":[{"en":"The war was chronicled by monks.","hi":"युद्ध का विवरण साधुओं ने दर्ज किया।"}],"loc":"Section 2 · Column 3 · #1","c":"#7c4dff"},{"w":"Perspicuous","hi":"सुस्पष्ट (भाषा)","en":"clearly expressed","ex":"Clearly expressed and easy to understand; transparent in meaning — a perspicuous explanation. Formal adjective (opposite: obscure; not to be confused with perspicacious, which means sharp-minded).","xs":"The teacher's perspicuous diagrams made digestion easy to learn.","xh":"शिक्षक की सुस्पष्ट आकृतियों ने पाचन तंत्र समझना आसान बना दिया।","t":"याद रखो: PERSPICACIOUS = तेज़ व्यक्ति; PERSPICUOUS = स्पष्ट लेखन.","note":"","s":[{"en":"Her perspicuous notes helped everyone.","hi":"उसकी सुस्पष्ट नोट्स ने सबकी मदद की।"}],"loc":"Section 2 · Column 3 · #1","c":"#00897b"},{"w":"Sesquipedalian","hi":"लंबे-लंबे शब्दों वाला","en":"using very long words","ex":"Given to using long, heavy words — a sesquipedalian writer; also, of words themselves: very long, having many syllables ('sesquipedalian' is itself such a word). Adjective (humorous); noun: sesquipedalianism.","xs":"The sesquipedalian lawyer confused the jury with never-ending jargon.","xh":"लंबे-लंबे शब्दों वाले वकील ने अपनी बिना सिरे की भाषा से ज्यूरी को उलझा दिया।","t":"SESQUI (डेढ़) + PED (पैर): डेढ़ फीट लंबे शब्द!","note":"","s":[{"en":"Sesquipedalian essays tire readers.","hi":"लंबे शब्दों भरे निबंध पाठकों को थकाते हैं।"}],"loc":"Section 2 · Column 3 · #1","c":"#ef6c00"},{"w":"Elliptical","hi":"दीर्घवृत्तीय / अस्पष्ट-अल्प","en":"oval; skipping words","ex":"Shaped like an ellipse (a flattened circle) — planetary orbits are elliptical; of speech or writing: leaving words out so the meaning must be inferred — an elliptical reply. Adjective; noun: ellipsis.","xs":"The earth travels around the sun in an elliptical path.","xh":"पृथ्वी सूर्य की परिक्रमा दीर्घवृत्ताकार (अंडाकार) पथ में करती है।","t":"ELLIPSE आकृति; बात घुमा-फिराकर अधूरी कहना.","note":"","s":[{"en":"Earth has an elliptical orbit.","hi":"पृथ्वी की कक्षा दीर्घवृत्तीय है।"}],"loc":"Section 2 · Column 4 · #1","c":"#3949ab"},{"w":"Epigrammatic","hi":"छोटे-चटीले वाक्यों वाला","en":"terse and witty","ex":"Expressing much in few clever, pointed words; short and witty like an epigram — an epigrammatic style. Formal adjective; noun: epigram (a witty saying).","xs":"His epigrammatic reply — 'Silence speaks' — ended the debate.","xh":"उसका छोटा-सा चुटीला उत्तर — 'मौन बोलता है' — बहस ख़त्म कर गया।","t":"EPIGRAM = छोटा तीखा-मीठा कथन.","note":"","s":[{"en":"His epigrammatic style impressed all.","hi":"उसकी संक्षिप्त-चटीली शैली ने सब प्रभावित किया।"}],"loc":"Section 2 · Column 4 · #1","c":"#c62828"},{"w":"Aposiopetic","hi":"बात अधूरी छोड़ने वाला","en":"breaking off mid-sentence","ex":"Of a sentence that suddenly breaks off unfinished, leaving the thought hanging — 'If you do that again, I swear…'. From the rhetorical device aposiopesis. Technical adjective.","xs":"Her aposiopetic threat — 'If you ever dare…' — frightened him more than any full sentence.","xh":"उसकी अधूरी छोड़ी गई धमकी — 'अगर तूने दोबारा हिम्मत की…' — ने उसे पूरे वाक्य से ज़्यादा डरा दिया।","t":"APOSIOPESIS = \"...बस, छोड़ो!\" — वाक्य वहीं अटक जाना.","note":"","s":[{"en":"His aposiopetic plea moved her.","hi":"उसकी अधूरी विनती ने उसे भावुक किया।"}],"loc":"Section 2 · Column 4 · #1","c":"#2e7d32"},{"w":"Prolix","hi":"लंबा-बतंगड़","en":"tediously wordy","ex":"Using far too many words; tediously long in speech or writing — a prolix report that says in 50 pages what 5 would say. Formal adjective; noun: prolixity.","xs":"The prolix minister took twenty minutes to answer a simple question.","xh":"बिना सिरे की बातें करने वाले मंत्री ने एक सीधे सवाल का जवाब देने में बीस मिनट ले लिए।","t":"PRO + LIKES: लाइक के चक्कर में लंबा भाषण.","note":"","s":[{"en":"A prolix report bores readers.","hi":"लंबा-चौड़ा रिपोर्ट पाठकों को बोर करता है।"}],"loc":"Section 2 · Column 4 · #1","c":"#6d4c41"},{"w":"Lucent","hi":"चमकदार, स्पष्ट","en":"shining; translucent","ex":"Glowing with light; shining through and clear — lucent water, lucent skin. A literary adjective from Latin lux (light).","xs":"The moon's lucent glow silvered the whole lake.","xh":"चाँद की चमकती रोशनी ने पूरी झील को चाँदी जैसा बना दिया।","t":"LUCID का भाई — जगमगाता स्पष्ट.","note":"","s":[{"en":"The lucent stream glittered.","hi":"चमकती धारा चमचमाई।"}],"loc":"Section 2 · Column 4 · #1","c":"#e63980"},{"w":"Luculent","hi":"सुबोध, स्पष्ट","en":"clear in expression","ex":"Very clear and easy to understand — a luculent argument leaves no doubt. A rare, formal adjective from Latin luculentus.","xs":"The professor's luculent lecture made quantum theory feel simple.","xh":"प्रोफेसर की सुस्पष्ट क्लास ने क्वांटम सिद्धांत को आसान बना दिया।","t":"LUCULENT = LUCID + ELOQUENT: स्पष्ट-प्रतिभाशाली भाषा.","note":"","s":[{"en":"A luculent answer wins marks.","hi":"स्पष्ट उत्तर नंबर दिलाता है।"}],"loc":"Section 2 · Column 4 · #1","c":"#7c4dff"},{"w":"Didactic","hi":"उपदेशात्मक","en":"meant to teach, moralizing","ex":"Intended to teach, often with a moral lesson — didactic literature; sometimes used negatively for speech that sounds preachy and lecture-like. Adjective.","xs":"Aesop's didactic tales end with a clear moral for children.","xh":"ईसप की शिक्षाप्रद कहानियाँ बच्चों के लिए साफ़ सीख के साथ ख़त्म होती हैं।","t":"दीदी-का-उपदेश: बड़ी बहन की तरह सिखाता रहना.","note":"","s":[{"en":"Panchatantra tales are didactic.","hi":"पंचतंत्र की कहानियाँ शिक्षाप्रद हैं।"}],"loc":"Section 2 · Column 4 · #1","c":"#00897b"},{"w":"Chthonic","hi":"पाताल-संबंधी","en":"of the underworld/earth","ex":"Belonging to or dwelling under the earth — in mythology, chthonic gods are deities of the underworld rather than the sky; also anything dark, deep and earthbound. Scholarly adjective (from Greek chthon, earth).","xs":"Ancient Greeks offered dark sacrifices to their chthonic gods of the underworld.","xh":"प्राचीन यूनानी पाताल के अपने छाया-देवताओं को काले पशुबलि अर्पित करते थे।","t":"CHTHON ≈ \"पाताल\": धरती के भीतर के देवता.","note":"","s":[{"en":"Greeks worshipped chthonic gods.","hi":"यूनानी पाताल-देवताओं की पूजा करते थे।"}],"loc":"Section 2 · Column 4 · #1","c":"#ef6c00"},{"w":"Subterranean","hi":"भूमिगत","en":"underground","ex":"Under the ground; existing, occurring or moving beneath the earth's surface — subterranean streams, subterranean passages; also hidden and secret in activity — a subterranean movement. Adjective.","xs":"Farmers found a subterranean spring while digging the well.","xh":"कुआँ खोदते समय किसानों को ज़मीन के नीचे बहता एक स्रोत मिला।","t":"SUB (नीचे) + TERRAIN (भूमि).","note":"","s":[{"en":"A subterranean stream flows here.","hi":"यहाँ भूमिगत धारा बहती है।"}],"loc":"Section 2 · Column 4 · #1","c":"#3949ab"},{"w":"Littoral","hi":"तटीय","en":"of the seashore","ex":"Relating to the shore of a sea, lake or river — the littoral zone is the coastal strip where land meets water; also (noun) that coastal region. Technical adjective/noun.","xs":"Mangrove forests protect the littoral zone from big waves.","xh":"मैंग्रोव के जंगल तटीय क्षेत्र को बड़ी लहरों से बचाते हैं।","t":"LITTORE = तट: समुद्र-किनारे का.","note":"","s":[{"en":"Littoral states depend on fishing.","hi":"तटीय राज्य मछली पकड़ने पर निर्भर हैं।"}],"loc":"Section 2 · Column 4 · #1","c":"#c62828"},{"w":"Cathartic","hi":"भाव-विसर्जन देने वाला","en":"releasing emotions; cleansing","ex":"Bringing a strong release of pent-up emotions — a cathartic cry, a cathartic film; also a medicine that purges the bowels. Adjective; noun: catharsis.","xs":"Crying at the sad film's end felt strangely cathartic.","xh":"दुखद फ़िल्म के अंत में रोना अजीब तरह मन हल्का करने वाला लगा।","t":"रोने के बाद की राहत = catharsis.","note":"","s":[{"en":"A cathartic cry healed her.","hi":"भाव-विसर्जन भरे रोने ने उसे राहत दी।"}],"loc":"Section 2 · Column 4 · #1","c":"#2e7d32"},{"w":"Libidinal","hi":"वासनात्मक ऊर्जा का","en":"relating to libido/ desire","ex":"Relating to libido — sexual desire and psychic energy, in Freudian psychology; libidinal urges are drives of desire. Technical adjective.","xs":"The novel explores how art channels libidinal energy into creativity.","xh":"उपन्यास दिखाता है कि कला कामुक ऊर्जा को रचनात्मकता में कैसे बदलती है।","t":"LIBIDO = इच्छा-शक्ति (फ्रॉयड की थ्योरी).","note":"","s":[{"en":"Libidinal drives shape behaviour.","hi":"वासनात्मक प्रेरणाएँ व्यवहार बनाती हैं।"}],"loc":"Section 2 · Column 4 · #1","c":"#6d4c41"},{"w":"Somatic","hi":"शारीरिक","en":"of the body","ex":"Relating to the body, as distinct from the mind — somatic symptoms are physical complaints; in genetics, somatic cells are all body cells except eggs and sperm. Technical adjective.","xs":"His worry produced somatic complaints — headaches and stomach pain with no disease.","xh":"उसकी चिंता ने शारीरिक शिकायतें पैदा कीं — बिना बीमारी के सिरदर्द और पेट दर्द।","t":"SOMA = शरीर (PSYCHO-somatic: मन की बीमारी शरीर में).","note":"","s":[{"en":"Somatic exercises calm nerves.","hi":"शारीरिक अभ्यास नसें शांत करते हैं।"}],"loc":"Section 2 · Column 4 · #1","c":"#e63980"},{"w":"Empirical","hi":"प्रयोग-सिद्ध, अनुभवजन्य","en":"based on observation","ex":"Based on observation, experiment and real evidence rather than theory or pure reasoning — empirical research, empirical proof. Adjective.","xs":"The medicine's effect was confirmed by empirical studies on patients.","xh":"दवा का असर मरीज़ों पर अनुभवजन्य अध्ययनों से पुष्ट हुआ।","t":"EXPERIENCE ≈ EMPIRICAL: आँखों देखा आँकड़ा.","note":"","s":[{"en":"Empirical evidence supports the claim.","hi":"प्रयोगसिद्ध साक्ष्य दावे को पुष्ट करते हैं।"}],"loc":"Section 2 · Column 4 · #1","c":"#7c4dff"},{"w":"Axiomatic","hi":"स्वयंसिद्ध","en":"self-evident","ex":"Taken as obviously true and needing no proof — 'the whole is greater than the part' is axiomatic; also used to mean self-evident in argument. Adjective; noun: axiom.","xs":"It is axiomatic that a player must practise to improve.","xh":"यह स्वयंसिद्ध है कि बेहतर होने के लिए खिलाड़ी को अभ्यास करना ही पड़ेगा।","t":"AXIOM = सिद्धांत जिसे साबित करने की ज़रूरत नहीं.","note":"","s":[{"en":"It is axiomatic that practice improves skill.","hi":"यह स्वयंसिद्ध है कि अभ्यास से निपुणता बढ़ती है।"}],"loc":"Section 2 · Column 4 · #1","c":"#00897b"},{"w":"Metanoiac","hi":"पश्चाताप से बदला हुआ","en":"transformed through repentance","ex":"Relating to metanoia — a profound change of mind and heart, repentance, a complete spiritual conversion; a metanoiac experience transforms a person's outlook. Rare, scholarly adjective; noun: metanoia.","xs":"Prison became a metanoiac turning point; he emerged a changed man.","xh":"जेल उसके मन के पूर्ण परिवर्तन की घड़ी बनी; वह बदला हुआ इंसान बनकर लौटा।","t":"METANOIA = मन-परिवर्तन: नया जीवन शुरू करने वाला.","note":"","s":[{"en":"His metanoiac turn surprised friends.","hi":"उसका पश्चाताप-भरा मोड़ दोस्तों को चौंकाया।"}],"loc":"Section 2 · Column 4 · #1","c":"#ef6c00"},{"w":"Polemic","hi":"विवादास्पद आक्रमण (लिखित/वाचिक)","en":"strong attack in words","ex":"A strong verbal or written attack on someone's opinions; argumentative controversy — a polemic against capitalism. Noun; adjective: polemical; a polemicist writes such attacks.","xs":"His polemic against junk food sparked a national debate.","xh":"जंक फ़ूड के खिलाफ़ उसकी आक्रामक टिप्पणी ने देशव्यापी बहस छेड़ दी।","t":"POLE + MIC: माइक उठाकर बहस छेड़ना.","note":"","s":[{"en":"He wrote a polemic against censorship.","hi":"उसने सेंसरशिप के विरुद्ध वाद-विवाद भरा लेख लिखा।"}],"loc":"Section 2 · Column 4 · #1","c":"#3949ab"},{"w":"Sacral","hi":"पवित्र / त्रिक-संबंधी","en":"sacred; of the sacrum bone","ex":"Relating to sacred things or religious rites — sacral art, sacral architecture; in anatomy, the sacral vertebrae are the five bones at the base of the spine. Adjective.","xs":"Candles and chants filled the temple's sacral atmosphere.","xh":"मोमबत्तियों और भजनों ने मंदिर का पवित्र माहौल भर दिया।","t":"SACRED से — पूजा-संबंधी.","note":"","s":[{"en":"Sacral rites were performed at dawn.","hi":"पवित्र अनुष्ठान भोर में किए गए।"}],"loc":"Section 2 · Column 4 · #1","c":"#c62828"},{"w":"Meretricious","hi":"भड़कीला-दिखावटी","en":"attractive but worthless","ex":"Attractively showy but actually worthless or dishonest — meretricious glitter, meretricious arguments that impress but mislead. Formal adjective (do not confuse with meritorious = deserving praise).","xs":"The film's meretricious glamour hid a hollow story.","xh":"फ़िल्म की ठाठ-बाठ चमक के पीछे कहानी बिल्कुल खोखली थी।","t":"MERETRIX (वेश्या) — बाहर चमक, भीतर फ़र्जी.","note":"","s":[{"en":"The film is meretricious trash.","hi":"फ़िल्म भड़कीली किंतु घटिया है।"}],"loc":"Section 2 · Column 4 · #1","c":"#2e7d32"},{"w":"Puissant","hi":"पराक्रमी, शक्तिशाली","en":"powerful","ex":"Powerful and mighty, with great force or influence — a puissant king, puissant arguments. A literary, old-fashioned adjective.","xs":"The puissant emperor commanded armies across three continents.","xh":"शक्तिशाली सम्राट की आज्ञा तीन महाद्वीपों की सेनाओं पर चलती थी।","t":"PUISSANCE (घुड़सवारी में शक्ति-प्रदर्शन).","note":"","s":[{"en":"A puissant empire ruled here.","hi":"यहाँ शक्तिशाली साम्राज्य रहा।"}],"loc":"Section 2 · Column 4 · #1","c":"#6d4c41"},{"w":"Potent","hi":"असरदार, प्रबल","en":"strong and effective","ex":"Having great power, strength or effect — a potent drug acts strongly even in tiny doses; a potent argument, potent memories. Adjective; noun: potency.","xs":"A few drops of this potent medicine are enough for the dose.","xh":"इस तीव्र प्रभावी दवा की कुछ बूँदें ही खुराक के लिए काफ़ी हैं।","t":"POTENT दवा = तेज़ असर वाली.","note":"","s":[{"en":"A potent argument silenced critics.","hi":"प्रबल तर्क ने आलोचकों को चुप करा दिया।"}],"loc":"Section 2 · Column 4 · #1","c":"#e63980"},{"w":"Benign","hi":"सौम्य, अहानिकर","en":"kind; harmless (tumor)","ex":"Kind, gentle and harmless — a benign smile, benign climate; in medicine, a benign tumour is not cancerous and does not spread. Adjective (opposite: malignant).","xs":"The doctor confirmed the tumour was benign and needed no surgery.","xh":"डॉक्टर ने पुष्टि की कि गाँठ सौम्य (बिना कैंसर वाली) थी और ऑपरेशन की ज़रूरत नहीं।","t":"BENE (अच्छा): BENIGN ट्यूमर = अहानिकर गांठ.","note":"","s":[{"en":"The doctor said it was benign.","hi":"डॉक्टर ने कहा कि यह अहानिकर है।"}],"loc":"Section 2 · Column 4 · #1","c":"#7c4dff"},{"w":"Subaltern","hi":"अधीनस्थ","en":"of lower rank","ex":"Of lower rank or position; a junior officer in the army below captain; in postcolonial studies, subaltern groups are those outside the power structure — the poor, the colonized. Adjective/noun.","xs":"As a young subaltern, he led only twenty soldiers at the frontier post.","xh":"युवा जूनियर अधिकारी के रूप में सीमा चौकी पर उसके पास सिर्फ़ बीस सैनिक थे।","t":"SUB (नीचे) + ALTERNATE: फ़ौज का \"सबाल्टर्न\" जूनियर अफ़सर.","note":"","s":[{"en":"Subaltern officers saluted the colonel.","hi":"अधीनस्थ अधिकारियों ने कर्नल को सैल्यूट किया।"}],"loc":"Section 2 · Column 4 · #1","c":"#00897b"},{"w":"Lugubrious","hi":"शोकमग्न, रीझा हुआ","en":"mournful, exaggeratedly sad","ex":"Looking sad and gloomy, often in an exaggerated or comic way — a lugubrious face, lugubrious music. Adjective.","xs":"The dog's lugubrious eyes begged for a piece of cake.","xh":"कुत्ते की उदास आँखों ने केक का टुकड़ा माँगा।","t":"\"उहू-उहू\" (LUGUBRIOUS) सिसकियाँ.","note":"","s":[{"en":"His lugubrious face spoilt the party.","hi":"उसका रीझा चेहरा पार्टी खराब कर गया।"}],"loc":"Section 2 · Column 4 · #1","c":"#ef6c00"},{"w":"Dolorous","hi":"विषादमय","en":"sorrowful","ex":"Full of sorrow; mournful and sad — dolorous songs of parting, dolorous cries. A literary adjective; noun: dolor.","xs":"The widow's dolorous lament echoed through the village.","xh":"विधवा की शोकपूर्ण विलाप गाँव में गूँजती रही।","t":"DOLOR = दर्द (दर्द भरे गीत).","note":"","s":[{"en":"She sang a dolorous ballad.","hi":"उसने शोकाकुल गीत गाया।"}],"loc":"Section 2 · Column 4 · #1","c":"#3949ab"},{"w":"Vivacious","hi":"चुस्त, जीवंत","en":"lively, spirited","ex":"Lively, energetic and attractively cheerful — a vivacious hostess, a vivacious laugh; full of life and animation. Adjective.","xs":"The vivacious girl kept the whole party laughing with her stories.","xh":"जोशीली लड़की ने अपनी कहानियों से पूरी पार्टी को हँसाते रखा।","t":"VIVA = \"जी लंबा\" — जोश से भरपूर.","note":"","s":[{"en":"The vivacious hostess lit up the room.","hi":"जीवंत मेज़बान ने कमरा रौशन कर दिया।"}],"loc":"Section 2 · Column 4 · #1","c":"#c62828"},{"w":"Jovial","hi":"हँसमुख","en":"cheerful and friendly","ex":"Cheerful, friendly and full of good humour — a jovial uncle, jovial banter. Adjective (from Jove, the god of mirth).","xs":"Our jovial neighbour greets everyone with a loud 'good morning'.","xh":"हमारा खुशमिज़ाज पड़ोसी सबको ऊँची आवाज़ में 'गुड मॉर्निंग' कहकर जगमगाता है।","t":"JOVE = बृहस्पति (Jupiter): \"गुरुवार\" के स्वभाव जैसा खुशमिजाज.","note":"","s":[{"en":"His jovial nature attracts friends.","hi":"उसका हँसमुख स्वभाव मित्र खींचता है।"}],"loc":"Section 2 · Column 4 · #1","c":"#2e7d32"},{"w":"Buoyant","hi":"तैरने वाला / उमंगी","en":"floating; cheerful","ex":"Able to float — buoyant wood; cheerful and confident — a buoyant mood; (of markets) active and rising — a buoyant stock market. Adjective.","xs":"She stayed buoyant even after failing the first attempt.","xh":"पहली कोशिश में असफल होने के बाद भी वह उत्साह से भरी रही।","t":"BUOY = पानी में तैरता लाल निशान.","note":"","s":[{"en":"She felt buoyant after the win.","hi":"जीत के बाद वह उमंग से भरी थी।"}],"loc":"Section 2 · Column 4 · #1","c":"#6d4c41"},{"w":"Sequestered","hi":"एकांत, अलग-थलग","en":"hidden away, isolated","ex":"Kept apart and hidden away from other people — a sequestered cottage in the woods; in law, to sequester property means to take it into legal custody; in chemistry, to bind ions apart. Adjective/verb.","xs":"He wrote his novel in a sequestered hut far from any road.","xh":"उसने अपना उपन्यास किसी सड़क से बहुत दूर एक अकेली झोपड़ी में लिखा।","t":"SEQUEST (अलग करना): दुनिया से अलग करके रखा हुआ.","note":"","s":[{"en":"They lived in a sequestered valley.","hi":"वे एक एकांत घाटी में रहते थे।"}],"loc":"Section 3 · Column 1 · #1","c":"#e63980"},{"w":"Inevitably","hi":"अनिवार्यतः","en":"unavoidably, certain to happen","ex":"In a way that cannot be avoided or prevented; certainly, as a natural result — prices will inevitably rise; adverb form of inevitable.","xs":"Rush the work and you will inevitably make mistakes.","xh":"काम में जल्दबाज़ी करोगे तो ग़लतियाँ होना तय है।","t":"IN + EVIT (बचना) + ABLY: बच नहीं सकते = ज़रूर होगा.","note":"","s":[{"en":"Taxes inevitably rise.","hi":"कर अनिवार्यतः बढ़ते हैं।"}],"loc":"Section 3 · Column 1 · #1","c":"#7c4dff"},{"w":"Ostentatious","hi":"दिखावटी","en":"showy, meant to impress","ex":"Deliberately showing off wealth, learning or importance in a way that attracts attention and often annoys — an ostentatious mansion, ostentatious jewellery. Adjective; noun: ostentation.","xs":"His ostentatious gold watch screamed for attention at the meeting.","xh":"बैठक में उसकी दिखावटी सोने की घड़ी ने सबका ध्यान खींच लिया।","t":"OSTENTATION = दिखावा — \"देखो मेरी गाड़ी!\" वाला स्वभाव.","note":"","s":[{"en":"He wore an ostentatious gold watch.","hi":"उसने दिखावटी सोने की घड़ी पहनी।"}],"loc":"Section 3 · Column 1 · #1","c":"#00897b"},{"w":"Shaky","hi":"अस्थिर","en":"trembling, unsteady","ex":"Trembling or unsteady — shaky hands, a shaky ladder; weak and unreliable — shaky evidence, a shaky start to a match. Adjective.","xs":"His hands were shaky as he signed the apology letter.","xh":"माफ़ीनामे पर दस्तख़त करते समय उसके हाथ काँप रहे थे।","t":"ठंड में हाथ SHAKE करना = अस्थिर.","note":"","s":[{"en":"Her voice was shaky with fear.","hi":"डर से उसकी आवाज़ काँप रही थी।"}],"loc":"Section 3 · Column 1 · #1","c":"#ef6c00"},{"w":"Saucy","hi":"धृष्ट, चुलबुला","en":"cheeky, boldly rude","ex":"Boldly rude in a playful, cheeky way — a saucy reply to the teacher; also lively and slightly sexually suggestive in style — saucy banter. Old-fashioned adjective.","xs":"The saucy waiter's witty answers had the whole café laughing.","xh":"नटखट वेटर के चुटीले जवाबों से पूरा कैफ़े हँसता रहा।","t":"SAUCE ज़्यादा वाला मुँह — तीखा-टेढ़ा जवाब.","note":"","s":[{"en":"The saucy reply made everyone laugh.","hi":"धृष्ट जवाब से सब हँस पड़े।"}],"loc":"Section 3 · Column 1 · #1","c":"#3949ab"},{"w":"Imbue","hi":"भर देना, रंगना","en":"soak or fill with a quality","ex":"To fill or soak something thoroughly with a quality or feeling — imbue the students with discipline; cloth imbued with dye. Formal verb, usually 'imbue with'.","xs":"Her mother imbued her with a deep love of music.","xh":"माँ ने उसके भीतर संगीत का गहरा प्रेम भर दिया था।","t":"\"IM-BREW\": चाय में दूध BREW होने जैसा — पूरी तरह भर जाना.","note":"","s":[{"en":"Parents imbue children with values.","hi":"माता-पिता बच्चों में संस्कार भरते हैं।"}],"loc":"Section 3 · Column 1 · #1","c":"#c62828"},{"w":"Amble","hi":"टहलना","en":"walk slowly, relaxed","ex":"To walk in a slow, relaxed, unhurried way; a leisurely stroll — an amble along the beach. Verb/noun.","xs":"They ambled through the market, pausing at every stall.","xh":"वे बाज़ार में सुस्त गति से चलते रहे, हर दुकान पर रुकते हुए।","t":"AMBLE ≈ आराम से घूमना (RAMBLE का भाई, पर शांत चाल).","note":"","s":[{"en":"We ambled along the beach.","hi":"हम समुद्र तट पर टहले।"}],"loc":"Section 3 · Column 1 · #1","c":"#2e7d32"},{"w":"Bustle","hi":"भागदौड़","en":"busy, energetic movement","ex":"To move busily and energetically, full of activity — bustle about the kitchen; also noisy, busy activity (the bustle of the city). Verb/noun.","xs":"Mother bustled about the kitchen preparing the festival feast.","xh":"त्योहार का दावत तैयार करने के लिए माँ रसोई में जुटी-भटी रहीं।","t":"BUS + TLE: व्यस्त (busy) बाज़ार की चहल-पहल.","note":"","s":[{"en":"The kitchen bustled before the feast.","hi":"दावत से पहले रसोई में भागदौड़ थी।"}],"loc":"Section 3 · Column 1 · #1","c":"#6d4c41"},{"w":"Impassion","hi":"भावुक कर देना","en":"fill with strong feeling","ex":"To fill with strong emotion or passion; to rouse deeply — impassioned means showing intense feeling. Rare verb; the adjective impassioned is common.","xs":"The coach impassioned the team with his fiery speech.","xh":"कोच के जोशीले भाषण ने टीम को जोश से भर दिया।","t":"IM + PASSION: भीतर जुनून भरना.","note":"","s":[{"en":"His speech impassioned the crowd.","hi":"उसके भाषण ने भीड़ भावुक कर दी।"}],"loc":"Section 3 · Column 1 · #1","c":"#e63980"},{"w":"Fleck","hi":"कण, धब्बा","en":"tiny speck or spot","ex":"A tiny spot or small piece of something — flecks of paint, a fleck of dust in the eye; to mark with such spots. Noun/verb.","xs":"White flecks of snow dotted the mountain's dark rocks.","xh":"बर्फ़ के छोटे-छोटे कतरे पहाड़ के काले चट्टानों पर बिखरे थे।","t":"FLAKE (कतरा) का भाई — छोटा-सा टुकड़ा.","note":"","s":[{"en":"Flecks of paint fell on the floor.","hi":"रंग के कण फ़र्श पर गिरे।"}],"loc":"Section 3 · Column 1 · #1","c":"#7c4dff"},{"w":"Ravenous","hi":"क्षुधातुर","en":"extremely hungry","ex":"Extremely hungry, as if starving; greedy for food — ravenous after the match, a ravenous appetite. Adjective.","xs":"After the marathon, the runners were ravenous and ate everything in sight.","xh":"मैराथन के बाद दौड़ने वाले इतने भूखे थे कि सब कुछ खा गए।","t":"RAVEN (काला कौआ) जैसा भूका — सब खा जाता है.","note":"","s":[{"en":"After the trek I was ravenous.","hi":"यात्रा के बाद मैं बहुत भूखा था।"}],"loc":"Section 3 · Column 1 · #1","c":"#00897b"},{"w":"Iniquitous","hi":"अन्यायपूर्ण","en":"very wicked, unjust","ex":"Very wicked and unjust, often describing unfair systems — iniquitous taxes, an iniquitous law. Formal adjective; noun: iniquity.","xs":"The iniquitous system kept the workers in debt for life.","xh":"अत्याचारी व्यवस्था ने मज़दूरों को ज़िंदगी भर के़र्ज़ में डुबो रखा था।","t":"INIQUITY (अन्याय) से — धर्म के विरुद्ध कर्म.","note":"","s":[{"en":"The iniquitous tax broke the poor.","hi":"अन्यायपूर्ण कर ने गरीबों को तोड़ दिया।"}],"loc":"Section 3 · Column 1 · #1","c":"#ef6c00"},{"w":"Incumber (Encumber)","hi":"बाधा डालना","en":"burden, weigh down","ex":"To weigh down or burden someone or something; to block or hamper freedom of movement or action — encumbered by debt, by heavy bags, by rules. Formal verb; noun: encumbrance.","xs":"The soldiers were encumbered by their heavy packs in the climb.","xh":"भारी बोरे से लदे सैनिक चढ़ाई में दबे-कुचले जा रहे थे।","t":"भारी-भरकम बोझ (cumber) लेकर चलना = रुक-रुक कर चलना.","note":"","s":[{"en":"He was encumbered by heavy luggage.","hi":"भारी सामान ने उसे जकड़ रखा था।"}],"loc":"Section 3 · Column 1 · #1","c":"#3949ab"},{"w":"Bafflement","hi":"हैरानी, भ्रम","en":"total confusion","ex":"A state of complete confusion and puzzlement; being unable to understand — the bafflement on his face. Noun; verb: baffle.","xs":"The strange exam question caused bafflement across the class.","xh":"अजीब परीक्षा प्रश्न ने पूरी कक्षा को हैरान-परेशान कर दिया।","t":"BAFFLE = बफ़र जैसे \"अटका देना\" — सिर पकड़ लेना.","note":"","s":[{"en":"The riddle caused pure bafflement.","hi":"पहेली से पूरी हैरानी छा गई।"}],"loc":"Section 3 · Column 1 · #1","c":"#c62828"},{"w":"Confront","hi":"सामना करना","en":"face boldly","ex":"To face someone or something directly and boldly — confront a bully, confront the truth; to deal with a problem head-on; to make someone face facts (confront him with the evidence). Verb.","xs":"She finally confronted her friend about the stolen money.","xh":"आख़िरकार उसने चोरी के पैसों को लेकर दोस्त का सामना किया।","t":"CON + FRONT: मोर्चे (front) पर आमने-सामने.","note":"","s":[{"en":"She confronted the bully.","hi":"उसने गुंडे का सामना किया।"}],"loc":"Section 3 · Column 1 · #1","c":"#2e7d32"},{"w":"Perturb","hi":"घबरा देना","en":"disturb mentally","ex":"To worry and disturb someone's peace of mind — perturbed by the strange phone call; in science, to disturb the normal state of a system. Formal verb; adjective: perturbed; noun: perturbation.","xs":"The sudden dip in sales perturbed the company's directors.","xh":"बिक्री में अचानक गिरावट ने कंपनी के निदेशकों को घबरा दिया।","t":"PER + TURB (तूफ़ान): मन में तूफ़ान भर देना.","note":"","s":[{"en":"The news perturbed him.","hi":"खबर ने उसे घबरा दिया।"}],"loc":"Section 3 · Column 1 · #1","c":"#6d4c41"},{"w":"Sibilance","hi":"सी-सी की आवाज़","en":"hissing sound (s, sh)","ex":"A hissing or hushing sound; the repeated s, sh or z sounds that create a whispering effect in poetry — 'the sibilance of the leaves'. Noun; adjective: sibilant.","xs":"The snake's sibilance warned us not to step closer.","xh":"साँप की फुसफुसाहट ने चेतावनी दी कि पास मत जाओ।","t":"साँप \"सि-सि\" करता है — S sounds = sibilance.","note":"","s":[{"en":"The snake's sibilance scared us.","hi":"साँप की सरसराहट ने डरा दिया।"}],"loc":"Section 3 · Column 1 · #1","c":"#e63980"},{"w":"Surreptitious","hi":"छिपकर किया गया","en":"done secretly, stealthy","ex":"Done secretly and quietly so that nobody notices, usually because it is not allowed — a surreptitious glance, surreptitious snacks in class. Formal adjective; adverb: surreptitiously.","xs":"He took a surreptitious photo of the celebrity from behind the newspaper.","xh":"उसने अख़बार के पीछे छिपकर सेलिब्रिटी की तस्वीर खींच ली।","t":"\"SUR-REPT\" = रेप्टाइल की तरह चुपके-चुपके.","note":"","s":[{"en":"He took a surreptitious glance at the answer sheet.","hi":"उसने चुपके से उत्तर-पुस्तिका पर नज़र डाली।"}],"loc":"Section 3 · Column 1 · #1","c":"#7c4dff"},{"w":"Startle","hi":"चौंका देना","en":"shock suddenly","ex":"To make someone suddenly surprised or frightened with a quick shock — startle a cat, a loud bang startled the baby. Verb; adjective: startling.","xs":"The honking horn startled the deer crossing the road.","xh":"हॉर्न की आवाज़ ने सड़क पार कर रहे हिरण को भयभीत कर दिया।","t":"नींद में \"स्टार्ट!\" कह दो — कूद उठेगा.","note":"","s":[{"en":"The firework startled the baby.","hi":"पटाखे ने बच्चे को चौंका दिया।"}],"loc":"Section 3 · Column 1 · #1","c":"#00897b"},{"w":"Slander","hi":"निंदा (मौखिक कलंक)","en":"false spoken attack on someone/  \"slender women\" Homonym","ex":"A false spoken statement that damages someone's reputation — a serious legal wrong (written defamation is libel). Verb/noun.","xs":"He sued his neighbour for slander after the false accusations at the meeting.","xh":"बैठक में झूठे आरोपों के बाद उसने पड़ोसी पर अपमानजनक बयान (मानहानि) का मुक़दमा किया।","t":"SPOKEN + SLANDER (दोनों S): बोलकर बदनाम करना; लिखा हो तो Libel.","note":"","s":[{"en":"He sued them for slander.","hi":"उसने निंदा के लिए मुक़दमा किया।"}],"loc":"Section 3 · Column 1 · #1","c":"#ef6c00"},{"w":"Plunk","hi":"धम्म से गिरना","en":"drop with a heavy sound","ex":"To put or drop something down heavily with a short hollow sound — plunk the bag on the table; to pay money (plunk down fifty rupees); the sound itself. Verb/noun; also plonk.","xs":"She plunked the heavy suitcase on the bed with a thud.","xh":"उसने भारी सूटकेस धड़ाम से बिस्तर पर रख दिया।","t":"गिटार की तार \"प्लंक!\" या पत्थर कूएँ में \"धम्म!\"","note":"","s":[{"en":"She plunked the bag on the table.","hi":"उसने थैला टेबल पर धम्म से रखा।"}],"loc":"Section 3 · Column 1 · #1","c":"#3949ab"},{"w":"Reconnoitre","hi":"टोह लेना","en":"scout an area first","ex":"To go ahead and survey an area to gain information, especially about the enemy's position or about a route — military scouts reconnoitre. British spelling (American: reconnoiter). Verb/noun.","xs":"The captain sent two soldiers to reconnoitre the enemy camp.","xh":"कैप्टन ने दुश्मन के शिविर की जाँच के लिए दो सैनिकों को भेजा।","t":"RE + CONNOITRE (\"जान-पहचान\"): पहले जाँच-परख.","note":"","s":[{"en":"The soldiers reconnoitred the enemy camp.","hi":"सैनिकों ने दुश्मन शिविर की टोह ली।"}],"loc":"Section 3 · Column 1 · #1","c":"#c62828"},{"w":"Unsettled","hi":"अशांत / अनिर्णीत","en":"disturbed; not decided","ex":"Not calm or certain — unsettled weather keeps changing; feeling anxious and unquiet — an unsettled mind; not yet decided or paid — an unsettled dispute, unsettled bills. Adjective.","xs":"The boundary row remains unsettled even after years of talks.","xh":"सालों की बातचीत के बाद भी सीमा विवाद अनसुलझा है।","t":"UN + SETTLED: बसा हुआ नहीं — मन या मामला.","note":"","s":[{"en":"The dispute remains unsettled.","hi":"विवाद अनिर्णीत है।"}],"loc":"Section 3 · Column 1 · #1","c":"#2e7d32"},{"w":"Arraign","hi":"अदालत में अभियुक्त करना","en":"formally charge in court","ex":"To formally charge someone with a crime in court and call them to answer it; to accuse or criticize severely in public. Legal/formal verb.","xs":"The accused was arraigned before the magistrate on theft charges.","xh":"आरोपी को चोरी के आरोपों पर मजिस्ट्रेट की अदालत में पेश किया गया।","t":"A + RAIN: आरोपों की बारिश कर देना.","note":"","s":[{"en":"He was arraigned for fraud.","hi":"उस पर धोखाधड़ी का अभियोग चलाया गया।"}],"loc":"Section 3 · Column 1 · #1","c":"#6d4c41"},{"w":"Festive","hi":"उत्सवपूर्ण","en":"joyful, celebratory","ex":"Full of the cheerful, colourful atmosphere of a festival or celebration — festive lights, a festive mood; dressed up for a special occasion. Adjective.","xs":"Diwali lamps and rangoli gave the street a festive look.","xh":"दीवाली के दीयों और रंगोली ने गली को उत्सवपूर्ण बना दिया।","t":"FESTIVAL से — दिवाली जैसा माहौल.","note":"","s":[{"en":"The house had a festive look.","hi":"घर उत्सव जैसा सजा था।"}],"loc":"Section 3 · Column 1 · #1","c":"#e63980"},{"w":"Sagging","hi":"झूलता, धँसा","en":"drooping, sinking down","ex":"Hanging or sinking down in the middle because of weight, age or weakness — sagging shelves, sagging trousers, sagging spirits. Adjective; verb: sag.","xs":"The old rope bridge was sagging dangerously under our weight.","xh":"पुरानी रस्सी का पुल हमारे वज़न से ख़तरनाक ढंग से झूल रहा था।","t":"SAG = धँस जाना — पुरानी सोफ़े की सीट.","note":"","s":[{"en":"The sagging roof needs repair.","hi":"झुकी छत की मरम्मत चाहिए।"}],"loc":"Section 3 · Column 1 · #1","c":"#7c4dff"},{"w":"Stymie","hi":"रोक ठोकना","en":"block progress","ex":"To prevent someone from doing what they are trying to do; to block progress completely — stymied by paperwork, stymied at every turn. Formal verb.","xs":"Lack of funds stymied the hospital's expansion plan.","xh":"धन की कमी ने अस्पताल की विस्तार योजना को रोक दिया।","t":"\"STY-me\" — STand in the WAY मतlab रास्ता रोकना.","note":"","s":[{"en":"Budget cuts stymied the project.","hi":"बजट कटौती ने परियोजना रोक दी।"}],"loc":"Section 3 · Column 1 · #1","c":"#00897b"},{"w":"Exuberant","hi":"उद्यत, जोश से भरा","en":"overflowing with energy","ex":"Full of lively energy, excitement and joy — exuberant children, exuberant celebration; also lush and abundant — exuberant foliage. Adjective; noun: exuberance.","xs":"The exuberant fans flooded the streets after the World Cup win.","xh":"विश्व कप जीतने के बाद जोशीले प्रशंसकों ने गलियों में उमड़-घुमड़ ली।","t":"EX + तूफ़ान: जोश का तूफ़ान बाहर.","note":"","s":[{"en":"Exuberant fans cheered the team.","hi":"जोशीले फैंस ने टीम को हौसला दिया।"}],"loc":"Section 3 · Column 1 · #1","c":"#ef6c00"},{"w":"Abrogate","hi":"निरस्त करना","en":"abolish a law formally","ex":"To officially end or cancel a law, agreement or arrangement by authority — the government abrogated the treaty. Formal, legal verb; noun: abrogation.","xs":"Parliament voted to abrogate the century-old land law.","xh":"संसद ने सदी पुराने भूमि क़ानून को निरस्त करने का मत दिया।","t":"AB + ROGATE (माँगना): क़ानून को वापस माँग लेना.","note":"","s":[{"en":"The court abrogated the old act.","hi":"अदालत ने पुराना अधिनियम निरस्त किया।"}],"loc":"Section 3 · Column 2 · #1","c":"#3949ab"},{"w":"Resolute","hi":"दृढ़","en":"firm and determined","ex":"Firm and determined in purpose; not wavering once a decision is made — a resolute leader, resolute refusal. Adjective; noun: resolution, resoluteness.","xs":"She remained resolute despite constant threats to her campaign.","xh":"अपने आंदोलन को लगातार धमकियों के बावजूद वह दृढ़ रही।","t":"RE-SOLUTE = SOLID जैसा पक्का इरादा.","note":"","s":[{"en":"She remained resolute despite failures.","hi":"असफलताओं के बावजूद वह दृढ़ रही।"}],"loc":"Section 3 · Column 2 · #1","c":"#c62828"},{"w":"Quintessential","hi":"परम उत्कृष्ट नमूना","en":"the purest example of something","ex":"Being the most perfect, typical example of its kind — the quintessential English gentleman, the quintessential street food of Mumbai. Adjective; noun: quintessence.","xs":"Chai with samosas is the quintessential Indian evening snack.","xh":"चाय के साथ समोसा भारतीय शाम का सर्वाधिक ठेठ नाश्ता है।","t":"QUINT (पाँचवाँ/सार) + ESSENCE: चाय में अदरक — जो उसे \"चाय\" बनाता है.","note":"","s":[{"en":"Mumbai locals are the quintessential Mumbai experience.","hi":"मुंबई की लोकल ट्रेन उसका असली नमूना है।"}],"loc":"Section 3 · Column 2 · #1","c":"#2e7d32"},{"w":"Stenchy","hi":"दुर्गंधयुक्त","en":"stinking","ex":"Having a strong, foul smell; reeking. An informal, non-dictionary variant adjective formed from stench — commonly understood but rare in formal writing.","xs":"The stenchy air of the fish market hit us at the gate.","xh":"मछली बाज़ार की बदबूदार हवा दरवाज़े पर ही नाक में लग गई।","t":"STENCH (बदबू) से — नाले जैसी गंध.","note":"","s":[{"en":"The stenchy dump fouled the air.","hi":"दुर्गंधयुक्त कचरा हवा खराब कर रहा था।"}],"loc":"Section 3 · Column 2 · #1","c":"#6d4c41"},{"w":"Incapacitation","hi":"अक्षम बनाना","en":"making unable to act","ex":"The state of being made unable to work, move or function normally — injury, illness or drugs can cause incapacitation. Formal noun; verb: incapacitate.","xs":"The cricket rule counts players' incapacitation before declaring a substitute.","xh":"क्रिकेट नियम में प्रतिस्थापन घोषित करने से पहले खिलाड़ी की असमर्थता देखी जाती है।","t":"IN + CAPACITY: क्षमता ही हटा देना.","note":"","s":[{"en":"The injury led to his incapacitation.","hi":"चोट से वह काम-अक्षम हो गया।"}],"loc":"Section 3 · Column 2 · #1","c":"#e63980"},{"w":"Impeach","hi":"महाभियोग चलाना","en":"charge a public official with misconduct","ex":"To formally charge a public official with serious misconduct, starting a trial to remove them from office; figuratively, to question or cast doubt on someone's honesty — impeach his motives. Verb.","xs":"The parliament moved to impeach the president over the bribery scandal.","xh":"रिश्वत कांड के चलते संसद ने राष्ट्रपति पर महाभियोग चलाने की पहल की।","t":"IM + PEACH: आड़ू (peach) जितना दाग़ लगा देना.","note":"","s":[{"en":"Parliament may impeach the governor.","hi":"संसद राज्यपाल पर महाभियोग चला सकती है।"}],"loc":"Section 3 · Column 2 · #1","c":"#7c4dff"},{"w":"Imputation","hi":"आरोप","en":"accusation; blame attached","ex":"A claim or suggestion that someone is guilty of something bad; an accusation or blame — 'he resented the imputation of dishonesty'. Formal noun; verb: impute.","xs":"He bristled at the imputation that he had leaked the secret.","xh":"यह आरोप कि उसने राज़ लीक किया, सुनकर वह चिढ़ गया।","t":"IMPUTE + TION: लगाया गया आरोप.","note":"","s":[{"en":"The imputation hurt his reputation.","hi":"आरोप ने उसकी प्रतिष्ठा पर दाग़ लगाया।"}],"loc":"Section 3 · Column 2 · #1","c":"#00897b"},{"w":"Exorcise","hi":"भूत भगाना","en":"drive out an evil spirit","ex":"To drive out an evil spirit from a person or place by prayer or ritual; figuratively, to free the mind from a painful memory or fear — exorcise old demons. Verb (also spelled exorcize).","xs":"The priest performed a ritual to exorcise the haunted house.","xh":"पुजारी ने भूत-बाधित घर से बुरी आत्मा निकालने का अनुष्ठान किया।","t":"\"एक्सोर्सिस्ट\" फ़िल्म — पादरी भूत भगाता है.","note":"","s":[{"en":"The priest exorcised the haunted house.","hi":"पुरोहित ने भूतिया घर से भूत भगाया।"}],"loc":"Section 3 · Column 2 · #1","c":"#ef6c00"},{"w":"Scrumptious","hi":"बेहद स्वादिष्ट","en":"delicious","ex":"Extremely delicious and enjoyable to eat; wonderfully tasty — a scrumptious cake. Informal adjective.","xs":"Grandmother's scrumptious laddoos vanished within minutes.","xh":"दादी के लाजवाब स्वादिष्ट लड्डू मिनटों में ख़त्म हो गए।","t":"SCRUMPTIOUS ≈ SCRUNCH: कुरकुरा-मीठा, मुँह में पानी.","note":"","s":[{"en":"Grandma made scrumptious laddoos.","hi":"दादी ने लजीज़ लड्डू बनाए।"}],"loc":"Section 3 · Column 2 · #1","c":"#3949ab"},{"w":"Ludicrous","hi":"हास्यास्पद","en":"absurd, laughably silly","ex":"Absurd and ridiculous; so unreasonable that it makes you laugh — a ludicrous excuse, ludicrous prices. Formal adjective; noun: ludicrousness.","xs":"The idea of climbing Everest in slippers is plainly ludicrous.","xh":"चप्पलें पहनकर एवरेस्ट चढ़ने का ख़याल बिल्कुल हास्यास्पद है।","t":"LUDIC (खेलप्रिय) से — हँसी-मज़ाक वाला पागलपन.","note":"","s":[{"en":"A cat as bodyguard? Ludicrous!","hi":"बिल्ली अंगरक्षक? हास्यास्पद!"}],"loc":"Section 3 · Column 2 · #1","c":"#c62828"},{"w":"Revamp","hi":"नया रूप देना","en":"renovate, give new style","ex":"To improve, modernize or rebuild something by giving it a new look or form — revamp a website, revamp the syllabus. Verb/noun.","xs":"The railway station was revamped with new platforms and lifts.","xh":"रेलवे स्टेशन को नए प्लेटफ़ॉर्म और लिफ़्टों के साथ नए सिरे से सँवारा गया।","t":"RE + VAMP: पुराने जूते (vamp) की फिर से सिलाई.","note":"","s":[{"en":"They revamped the school website.","hi":"उन्होंने स्कूल वेबसाइट का रूप बदला।"}],"loc":"Section 3 · Column 2 · #1","c":"#2e7d32"},{"w":"Frowning","hi":"त्योरियाँ चढ़ाए","en":"scowling, displeased look","ex":"Bringing the eyebrows together in anger, worry or deep thought — a frowning face; of a landscape: dark and threatening — frowning cliffs. Adjective; verb: frown.","xs":"The frowning teacher asked who had broken the window.","xh":"भौंहें चढ़ाए शिक्षक ने पूछा कि खिड़की किसने तोड़ी।","t":"गुस्से में FROWN — \"गुस्सा क्यों कर रहे हो?\"","note":"","s":[{"en":"The frowning judge scared witnesses.","hi":"त्योरियाँ चढ़ाए जज ने गवाहों को डरा दिया।"}],"loc":"Section 3 · Column 2 · #1","c":"#6d4c41"},{"w":"Abhorrence","hi":"घृणा","en":"intense hatred","ex":"A feeling of intense hatred or disgust towards something considered utterly wrong — a deep abhorrence of violence. Formal noun; verb: abhor.","xs":"Her abhorrence of cruelty made her volunteer at the animal shelter.","xh":"क्रूरता से उसकी गहरी घृणा ने उसे पशु-आश्रय में सेवा करने के लिए प्रेरित किया।","t":"AB + HORROR: भय+घृणा की हद.","note":"","s":[{"en":"We feel abhorrence for cruelty.","hi":"हम क्रूरता से घृणा करते हैं।"}],"loc":"Section 3 · Column 2 · #1","c":"#e63980"},{"w":"Indiscreet","hi":"बेलगाम ज़बान","en":"careless in speech/act","ex":"Careless in speech or behaviour, saying or doing things that should stay private — an indiscreet remark, indiscreet friends. Adjective (opposite: discreet); noun: indiscretion.","xs":"Her indiscreet post about the client cost the firm a contract.","xh":"ग्राहक को लेकर उसकी बेपरवाह पोस्ट ने कंपनी से एक ठेका छिनवा दिया।","t":"IN + DISCREET (समझदार-चुप्पा): जो बोलना चाहिए वह भी बोल देना.","note":"","s":[{"en":"Indiscreet tweets cost him the job.","hi":"असावधान ट्वीट ने नौकरी दिला दी (गँवा दी)।"}],"loc":"Section 3 · Column 2 · #1","c":"#7c4dff"},{"w":"Peril","hi":"गंभीर खतरा","en":"serious danger","ex":"Serious and immediate danger — in peril of drowning; the risk of loss or harm in an activity — the perils of mountain climbing. Formal noun; adjective: perilous.","xs":"The fishermen's boat was in peril as the storm grew fierce.","xh":"तूफ़ान तेज़ होते ही मछुआरों की नाव ख़तरे में आ गई।","t":"\"PARROT के पीर\": Peril ≈ खतरे का पीर.","note":"","s":[{"en":"The climbers faced great peril.","hi":"आरोहियों के सामने बड़ा खतरा था।"}],"loc":"Section 3 · Column 2 · #1","c":"#00897b"},{"w":"Impasse","hi":"गतिरोध","en":"deadlock, no way out","ex":"A situation in which progress is impossible because both sides firmly refuse to move — the peace talks reached an impasse; a deadlock. Noun.","xs":"The wage talks hit an impasse as neither side would compromise.","xh":"कोई भी पक्ष समझौते को तैयार नहीं हुआ, और वेतन वार्ता गतरोधन में फँस गई।","t":"IM + PASS: रास्ता (pass) बंद = आगे नहीं.","note":"","s":[{"en":"Talks ended in an impasse.","hi":"वार्ता गतिरोध में खत्म हुई।"}],"loc":"Section 3 · Column 2 · #1","c":"#ef6c00"},{"w":"Innocence","hi":"मासूमियत","en":"purity, guiltlessness","ex":"The state of being free from guilt or wrongdoing (legal innocence); childlike purity and lack of knowledge of evil — the innocence of childhood. Noun; adjective: innocent.","xs":"After ten years in pris
