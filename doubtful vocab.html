ning (skin/mood)","ex":"Softening and soothing the skin — an emollient cream; figuratively, gentle words that calm anger — emollient diplomacy. Adjective/noun.","xs":"The doctor prescribed an emollient lotion for the dry, itchy skin.","xh":"डॉक्टर ने रूखी, खुजलाती त्वचा के लिए मुलायम करने वाला लोशन दिया।","t":"E + MOLLIFY: नरम कर देने वाला क्रीम.","note":"","s":[{"en":"An emollient cream soothed the rash.","hi":"मुलायम करने वाली क्रीम ने राहत दी।"}],"loc":"Section 4 · Column 4 · #1","c":"#3949ab"},{"w":"Morbid","hi":"रोग-मग्न, रुग्ण","en":"unhealthy, gloomy (mind/body)","ex":"Relating to disease or unhealthy conditions — morbid obesity; unnaturally interested in death, illness or dark subjects — a morbid curiosity. Adjective.","xs":"His morbid fascination with crime novels began in college.","xh":"अपराध उपन्यासों के प्रति उसकी रुचि कॉलेज के दिनों से अस्वाभाविक रूप से बढ़ी।","t":"MORBID ≈ मृत्यु (mortal) की दुनिया से — रुग्ण दिमाग़.","note":"","s":[{"en":"Morbid thoughts disturb sleep.","hi":"रुग्ण विचार नींद भगाते हैं।"}],"loc":"Section 4 · Column 4 · #1","c":"#c62828"},{"w":"Salutiferous","hi":"स्वास्थ्यकर","en":"health-giving","ex":"Bringing health and well-being; healthful — salutiferous mountain air. A rare, literary adjective (from Latin salus, health).","xs":"Doctors of the past praised the salutiferous breezes of hill stations.","xh":"पुराने डॉक्टर पहाड़ों की स्वास्थ्यवर्धक हवाओं की प्रशंसा करते थे।","t":"SALUT (स्वास्थ्य) + FEROUS (देने वाला).","note":"","s":[{"en":"Salutiferous air of hills heals.","hi":"पहाड़ों की स्वास्थ्यकर हवा निरामय करती है।"}],"loc":"Section 4 · Column 4 · #1","c":"#2e7d32"},{"w":"Pestilential","hi":"महामारीजन्य/घोर कष्टकारक","en":"causing disease; very annoying","ex":"Causing or spreading deadly epidemic disease — pestilential vapours; figuratively, extremely annoying — pestilential mosquitoes, a pestilential noise. Formal adjective; noun: pestilence.","xs":"The pestilential swamps drained the soldiers' health within weeks.","xh":"रोग फैलाने वाले दलदलों ने हफ़्तों में सैनिकों की सेहत बर्बाद कर दी।","t":"PESTILENCE (प्लेग) से — बीमारी फैलाने वाला.","note":"","s":[{"en":"Pestilential mosquitoes bred in drains.","hi":"मच्छरों की महामारी नालों में पली।"}],"loc":"Section 4 · Column 4 · #1","c":"#6d4c41"},{"w":"Noxious","hi":"हानिकारक","en":"harmful to health","ex":"Harmful to health or poisonous — noxious fumes from the factory; morally harmful — noxious ideas. Formal adjective.","xs":"Workers wore masks against the noxious gases in the plant.","xh":"कारख़ाने में हानिकारक गैसों से बचने को मज़दूरों ने मास्क लगाए।","t":"NOXIOUS गैस = ज़हरीली गैस.","note":"","s":[{"en":"Noxious fumes filled the factory.","hi":"कारखाने में हानिकारक धुआँ भरा।"}],"loc":"Section 4 · Column 4 · #1","c":"#e63980"},{"w":"Tenebrous","hi":"अंधकारमय","en":"dark, shadowy","ex":"Dark, shadowy and gloomy — a tenebrous cellar, tenebrous corridors. A literary adjective from Latin tenebrae (darkness).","xs":"Owls glide through the tenebrous forest at midnight.","xh":"आधी रात को उल्लू अंधेरे जंगल में उड़ते हैं।","t":"TENEBRAE = अँधेरे — दीये-बुझी गली.","note":"","s":[{"en":"A tenebrous alley scared me.","hi":"अंधेरी गली ने डरा दिया।"}],"loc":"Section 4 · Column 4 · #1","c":"#7c4dff"},{"w":"Noctivagant","hi":"रात में भटकने वाला","en":"wandering at night","ex":"Wandering in the night; going about after dark. A rare, learned adjective from Latin nox (night) + vagari (to wander).","xs":"Noctivagant cats own these empty streets after midnight.","xh":"आधी रात के बाद इन सूनी गलियों पर रात भ्रमण करने वाली बिल्लियों का राज है।","t":"पक्का-पक्का निश्चित कथन.","note":"","s":[{"en":"Noctivagant cats roam the roofs.","hi":"रात-भटकू बिल्लियाँ छतों पर घूमती हैं।"},{"en":"Crepuscular light fades fast.","hi":"गोधूलि का प्रकाश जल्दी बुझता है।"},{"en":"An apodictic proof convinces all.","hi":"अकाट्य प्रमाण सब मना लेता है।"}],"loc":"Section 4 · Column 4 · #1","c":"#00897b"},{"w":"Peremptory","hi":"आदेशात्मक, बिना बहस के","en":"brooking no delay or refusal","ex":"Commanding in a way that brooks no refusal or delay — a peremptory order; (law) final and unappealable — a peremptory challenge; also arrogantly bossy. Formal adjective.","xs":"The captain's peremptory 'Move now!' sent the crew rushing.","xh":"कैप्टन का अटल आदेश 'अभी हटो!' सुनकर चालक दल भागा।","t":"PER + EMPTY: बहस की जगह खाली — \"बस करो!\"","note":"","s":[{"en":"A peremptory order silenced debate.","hi":"करारा आदेश बहस बंद कर गया।"}],"loc":"Section 4 · Column 4 · #1","c":"#ef6c00"},{"w":"Eleemosynary","hi":"दान-संबंधी","en":"charitable, funded by alms","ex":"Relating to charity or supported by charitable giving — an eleemosynary institution, eleemosynary funds. A rare, formal adjective (from Greek eleemosyne, alms).","xs":"The eleemosynary trust runs free schools for slum children.","xh":"दानमूलक ट्रस्ट झुग्गी-बस्ती के बच्चों के लिए मुफ़्त स्कूल चलाता है।","t":"ELEEMOSYNE = ग्रीक \"भिक्षा\" — दान-धर्म से चलने वाला.","note":"","s":[{"en":"Eleemosynary trusts run the school.","hi":"दान से चलने वाला ट्रस्ट स्कूल चलाता है।"}],"loc":"Section 4 · Column 4 · #1","c":"#3949ab"},{"w":"Churlish","hi":"अभद्र, साहसे-गाँव का","en":"rude, coarse-mannered","ex":"Rude, sullen and bad-tempered; unmannerly — a churlish reply to a simple question. Adjective; from churl (a rude peasant).","xs":"It was churlish of him not to thank the volunteers.","xh":"स्वयंसेवकों को धन्यवाद न देना उसकी रूखाई थी।","t":"CHURL = गँवार (Old English: free man of low rank).","note":"","s":[{"en":"Churlish behaviour spoils impressions.","hi":"अभद्र व्यवहार छाप बिगाड़ता है।"}],"loc":"Section 4 · Column 4 · #1","c":"#c62828"},{"w":"Ungracious","hi":"असभ्य, कृतघ्न-सा","en":"discourteous","ex":"Not polite or friendly; lacking grace in receiving or giving — an ungracious host, ungracious in defeat. Adjective (opposite: gracious); noun: ungraciousness.","xs":"She was ungracious in defeat, blaming everyone but herself.","xh":"हार के बाद वह असभ्य रही और स्वयं को छोड़ सब पर दोष डाला।","t":"UN + GRACIOUS: नम्रता गायब.","note":"","s":[{"en":"An ungracious refusal hurt her.","hi":"असभ्य इनकार ने ठेस पहुँचाई।"}],"loc":"Section 4 · Column 4 · #1","c":"#2e7d32"},{"w":"Cogent","hi":"ठोस तर्क देने वाला","en":"convincing, forceful","ex":"Clear, logical and convincing; powerful in argument — a cogent case, cogent reasons. Formal adjective.","xs":"She presented a cogent argument that changed the committee's decision.","xh":"उसने इतना ठोस तर्क दिया कि समिति का फ़ैसला बदल गया।","t":"COG-in-machine: मशीन जैसे फिट बैठता तर्क.","note":"","s":[{"en":"A cogent argument won the debate.","hi":"ठोस तर्क ने बहस जीती।"}],"loc":"Section 4 · Column 4 · #1","c":"#6d4c41"},{"w":"Specious","hi":"दिखावटी तर्क, फ़र्जी चमक","en":"plausible but wrong","ex":"Seeming right or good at first glance but actually wrong — a specious argument, specious logic that hides a flaw. Formal adjective (do not confuse with spurious = fake).","xs":"The salesman's specious claim that the oil 'cures all diseases' fooled many.","xh":"दलाल का यह दिखावटी दावा कि तेल 'सब रोग मिटाता है', बहुतों को बेवकूफ़ बना गया।","t":"SPECIES (दिखावा): चमक ऊपर, भीतर खोखला.","note":"","s":[{"en":"Specious logic fooled the audience.","hi":"दिखावटी तर्क ने भीड़ बहला दी।"}],"loc":"Section 4 · Column 4 · #1","c":"#e63980"},{"w":"Precarious","hi":"अस्थिर, खतरनाक ढंग का","en":"dangerously unstable","ex":"Uncertain, unstable and likely to fall or fail — a precarious ladder, a precarious income, precarious peace. Formal adjective; noun: precariousness.","xs":"The climbers balanced on a precarious ledge above the valley.","xh":"पर्वतारोही घाटी के ऊपर एक ख़तरनाक, बेचैन बरामदे पर संतुलन बनाए खड़े थे।","t":"PRAY + CURIOUS: काँटे पर टँगी चीज़ — प्रार्थना करो!","note":"","s":[{"en":"Climbers stood on precarious rocks.","hi":"आरोही अस्थिर चट्टानों पर थे।"}],"loc":"Section 4 · Column 4 · #1","c":"#7c4dff"},{"w":"Caducous","hi":"शीघ्र-झड़ने वाला","en":"falling off early (leaves); fleeting","ex":"Falling off early or at maturity — in botany, caducous leaves or sepals drop before the flower fully opens; generally, transient. Technical adjective.","xs":"The poppy's caducous petals fall the very morning they open.","xh":"पोस्त के झड़ने वाले पंखुड़ियाँ खिलने की ही सुबह गिर जाती हैं।","t":"CADUCEUS नहीं — CADUC = गिरना: शीघ्र गिर जाने वाली पत्तियाँ.","note":"","s":[{"en":"Caducous petals fell by noon.","hi":"कलियाँ दोपहर तक झड़ गईं।"}],"loc":"Section 4 · Column 4 · #1","c":"#00897b"},{"w":"Semipernal → Semipermanent","hi":"अर्ध-स्थायी","en":"lasting long but not forever","ex":"Lasting a very long time but not literally forever — semipermanent hair dye fades after weeks; from Latin semi (half) + perennis (everlasting). Adjective; also written semipermanent.","xs":"The mark on the wall was semipermanent — three washes and it was gone.","xh":"दीवार पर वह निशान अर्ध-स्थायी था — तीन पोंछने में ही जाता रहा।","t":"SEMI + PERMANENT: थोड़ा लंबा, फिर गायब.","note":"","s":[{"en":"The ink left a semipermanent mark.","hi":"स्याही ने आधा-पक्का दाग़ छोड़ा।"}],"loc":"Section 4 · Column 4 · #1","c":"#ef6c00"},{"w":"Fallacious","hi":"त्रुटिपूर्ण (तर्कदोष)","en":"based on false reasoning","ex":"Based on a mistaken belief or faulty logic; misleadingly wrong — a fallacious argument, fallacious reasoning. Adjective; noun: fallacy.","xs":"His conclusion is fallacious — the data says the opposite.","xh":"उसका निष्कर्ष तर्कदोषपूर्ण है — आँकड़े उलटी बात कहते हैं।","t":"FALLACY से — गलत तर्क.","note":"","s":[{"en":"Fallacious claims mislead voters.","hi":"त्रुटिपूर्ण दावे वोटरों को गुमराह करते हैं।"}],"loc":"Section 4 · Column 4 · #1","c":"#3949ab"},{"w":"Erroneous","hi":"गलत","en":"mistaken, incorrect","ex":"Incorrect; based on error rather than fact — erroneous information, an erroneous conclusion. Formal adjective; noun: erratum/error.","xs":"The newspaper issued a correction for the erroneous headline.","xh":"अख़बार ने ग़लत सुर्ख़ी के लिए संशोधन छापा।","t":"ERROR से.","note":"","s":[{"en":"The report contained erroneous data.","hi":"रिपोर्ट में गलत आँकड़े थे।"}],"loc":"Section 4 · Column 4 · #1","c":"#c62828"},{"w":"Voluble","hi":"बातों की होड़ लगाने वाला","en":"talking fluently and fast","ex":"Talking a great deal, rapidly and fluently — a voluble salesman who never pauses for breath. Adjective; noun: volubility.","xs":"The voluble guide never stopped narrating tales through the whole tour.","xh":"बातूनी गाइड ने पूरे टूर में कहानियाँ सुनाना नहीं रोका।","t":"VOLUME + BLE: आवाज़ की \"वॉल्यूम\" पूरी खुली — बोलता जाए.","note":"","s":[{"en":"The voluble salesman talked for an hour.","hi":"वाचाल बेचने वाला घंटा भर बोला।"}],"loc":"Section 4 · Column 4 · #1","c":"#2e7d32"},{"w":"Eruptive","hi":"फटने वाला/विस्फोटक","en":"bursting out (volcano, rash)","ex":"Relating to or liable to eruption — eruptive volcanoes; breaking out suddenly, as a skin rash or angry temper. Technical adjective; verb: erupt.","xs":"The volcano's eruptive activity forced the village to evacuate.","xh":"ज्वालामुखी की विस्फोटक गतिविधि से गाँव को खाली करना पड़ा।","t":"ERUPT से — ज्वालामुखी फटना.","note":"","s":[{"en":"The eruptive volcano scared villagers.","hi":"फटने वाले ज्वालामुखी से गाँव डरे।"}],"loc":"Section 4 · Column 4 · #1","c":"#6d4c41"},{"w":"Effulgent","hi":"तेजस्वी, चमकता हुआ","en":"radiantly bright","ex":"Shining brightly; radiant — effulgent sunlight on snow, an effulgent smile. Literary adjective; noun: effulgence.","xs":"The bride looked effulgent in her golden lehenga.","xh":"सुनहरी लहंगा में दुल्हन दमकती हुई लग रही थी।","t":"EX + FULGENT: चमक बाहर निकलती हुई.","note":"","s":[{"en":"The effulgent sunrise lit the lake.","hi":"तेजस्वी सूर्योदय झील रौशन कर गया।"}],"loc":"Section 4 · Column 4 · #1","c":"#e63980"},{"w":"Obscurant","hi":"अंधकारमय ठेकेदार","en":"one who opposes knowledge/enlightenment","ex":"One who opposes the spread of knowledge and enlightenment; also (adjective) deliberately making things obscure — obscurant policies, obscurant language. Noun/adjective; noun: obscurantism.","xs":"The regime acted as an obscurant, banning books to keep people ignorant.","xh":"शासन ने अज्ञानता फैलाने वाले की तरह किताबों पर रोक लगाकर जनता को अनजान रखा।","t":"OBSCURE से — ज्ञान छिपाने वाला.","note":"","s":[{"en":"Obscurant forces resisted reform.","hi":"अंधविश्वासी ताकतें सुधारों के विरुद्ध थीं।"}],"loc":"Section 4 · Column 4 · #1","c":"#7c4dff"},{"w":"Resplendent","hi":"विलासी चमक से भरा","en":"dazzlingly splendid","ex":"Dazzlingly impressive and rich in appearance — resplendent in a silk saree, resplendent palace halls. Formal adjective; noun: resplendence.","xs":"The hall looked resplendent with marigold garlands and brass lamps.","xh":"गेंदे की मालाओं और पीतल के दीपों से सजा हॉल चमक रहा था।","t":"RE + SPLENDID: दूल्हे का शेरवानी-शान.","note":"","s":[{"en":"The bride looked resplendent.","hi":"दुल्हन अद्भुत चमक रही थी।"}],"loc":"Section 4 · Column 4 · #1","c":"#00897b"},{"w":"Lambent","hi":"कोमल झिलमिलाता प्रकाश","en":"glowing softly; witty (style)","ex":"Gliding softly over a surface with a flickering glow — lambent moonlight on water; also (of wit) gentle and brilliant. Literary adjective.","xs":"A lambent glow played over the lake at dusk.","xh":"सांझ के समय झील पर मंद चमकती रोशनी लहराती रही।","t":"LAMB जैसा कोमल — हल्की चमक.","note":"","s":[{"en":"Lambent moonlight kissed the waves.","hi":"कोमल चाँदनी लहरों को चूम रही थी।"}],"loc":"Section 4 · Column 4 · #1","c":"#ef6c00"},{"w":"Mellifluous","hi":"मधुर-कंठ, शहद जैसी आवाज़","en":"sweetly flowing (sound)","ex":"Pleasing to hear; sweet and smooth as flowing honey — a mellifluous voice, mellifluous singing. Adjective (from Latin mel, honey).","xs":"The radio anchor's mellifluous voice soothed late-night listeners.","xh":"रेडियो एंकर की मधुर आवाज़ देर रात के श्रोताओं को शांत कर देती थी।","t":"MELLI (शहद) + FLU (बहना): शहद बहती आवाज़.","note":"","s":[{"en":"Her mellifluous voice hypnotized the hall.","hi":"उसकी मधुर आवाज़ ने सभा मोह ली।"}],"loc":"Section 4 · Column 4 · #1","c":"#3949ab"},{"w":"Ostensible","hi":"प्रतीतमान / दिखावटी","en":"apparent, stated but maybe not real","ex":"Apparent and stated, but perhaps not the real one — the ostensible reason for the visit was business. Formal adjective; adverb: ostensibly.","xs":"The ostensible purpose of the trip was sightseeing, but he met the minister.","xh":"यात्रा का दिखावटी उद्देश्य घूमना था, पर वह मंत्री से मिला।","t":"OSTE ≈ \"अद्भुत SHOW\": दिखावे की बात — असली नहीं.","note":"","s":[{"en":"His ostensible reason was health, really money.","hi":"उसका प्रतीतमान कारण स्वास्थ्य था, असल में पैसा।"}],"loc":"Section 5 · Column 1 · #5","c":"#c62828"},{"w":"Apologue","hi":"नीतिकथा","en":"moral fable with animals/characters","ex":"A moral fable; a short story with animals or objects as characters that teaches a lesson — Aesop's tales are apologues. Literary noun; related: apologue (fable).","xs":"The teacher told an apologue about an ant and a lazy grasshopper.","xh":"शिक्षक ने चींटी और आलसी टिड्डे की एक नीतिकथा सुनाई।","t":"APPOLO + LOGUE: Panchatantra जैसी कहानी जिससे सीख मिले.","note":"","s":[{"en":"The old man told an apologue about honesty.","hi":"बुज़ुर्ग ने ईमानदारी की नीतिकथा सुनाई।"}],"loc":"Section 5 · Column 1 · #5","c":"#2e7d32"},{"w":"Prenatal","hi":"गर्भकालीन","en":"before birth","ex":"Occurring or existing before birth — prenatal vitamins, prenatal check-ups, prenatal development. Adjective (also antenatal).","xs":"Regular prenatal check-ups keep both mother and baby healthy.","xh":"नियमित गर्भकालीन जाँचें माँ और शिशु दोनों को स्वस्थ रखती हैं।","t":"PRE (पहले) + NATAL (जन्म): जन्म से पहले की देखभाल.","note":"","s":[{"en":"She attended prenatal classes.","hi":"वह गर्भकालीन कक्षाओं में गई।"}],"loc":"Section 5 · Column 1 · #5","c":"#6d4c41"},{"w":"Proselyte","hi":"धर्मपरिवर्तित व्यक्ति","en":"person converted to a new religion/faith","ex":"A person who has converted from one religion, belief or party to another; a new convert. Formal noun; verb: proselytize.","xs":"The preacher welcomed every proselyte into the congregation.","xh":"उपदेशक ने हर धर्मांतरित व्यक्ति को सभा में स्वागत किया।","t":"PROSE + LYTE: नए धर्म का \"PRO-moter\" बनने वाला.","note":"","s":[{"en":"The preacher gained many a proselyte.","hi":"प्रचारक को कई धर्मपरिवर्तित मिले।"}],"loc":"Section 5 · Column 1 · #5","c":"#e63980"},{"w":"Persecute","hi":"सताना","en":"harass cruelly for belief/race","ex":"To treat someone cruelly and unfairly, especially for their race, religion or beliefs, over a period of time — persecuted minorities. Verb; noun: persecution.","xs":"The writer was persecuted for speaking against the regime.","xh":"शासन के विरुद्ध बोलने के कारण लेखक के साथ सतावट हुई।","t":"PERSECUTE ≈ POLICE-cute: पुलिस की तरह लगातार परेशान करना.","note":"","s":[{"en":"They persecuted him for his views.","hi":"उन्होंने उसे उसके विचारों के लिए सताया।"}],"loc":"Section 5 · Column 1 · #5","c":"#7c4dff"},{"w":"Perpetrate","hi":"अपराध करना","en":"commit (a crime/wrong)","ex":"To commit a crime, fraud or other harmful act — perpetrate a fraud; 'perpetrated' often carries an air of cold formality. Verb; noun: perpetrator.","xs":"The gang perpetrated one of the biggest bank frauds in history.","xh":"गिरोह ने इतिहास के सबसे बड़े बैंक धोखाधड़ी में से एक को अंजाम दिया।","t":"PETROL चोरी PERPETRATE करना — गंभीर अपराध.","note":"","s":[{"en":"The gang perpetrated a bank robbery.","hi":"गिरोह ने बैंक डकैती की।"}],"loc":"Section 5 · Column 1 · #5","c":"#00897b"},{"w":"Theism","hi":"ईश्वरवाद","en":"belief that God exists","ex":"Belief in the existence of a god or gods who created and govern the world — as distinct from atheism (no god) and often from deism (a distant creator). Noun; adjective: theistic.","xs":"Theism holds that God actively takes part in the world.","xh":"ईश्वरवाद मानता है कि ईश्वर संसार में सक्रिय रूप से भाग लेता है।","t":"THE (god) + ISM (वाद): ईश्वर है — मानने वाला वाद.","note":"","s":[{"en":"Theism differs from atheism.","hi":"ईश्वरवाद नास्तिकता से भिन्न है।"}],"loc":"Section 5 · Column 1 · #5","c":"#ef6c00"},{"w":"Firefight","hi":"गोलाबारी","en":"exchange of gunfire","ex":"An exchange of gunfire between soldiers or police and attackers — a three-hour firefight. Military noun.","xs":"The patrol came under a heavy firefight at the border post.","xh":"सीमा चौकी पर गश्ती दल भारी गोलाबारी में फँस गया।","t":"FIRE + FIGHT: आगे-पीछे गोलियों की लड़ाई.","note":"","s":[{"en":"Troops were caught in a firefight.","hi":"सैनिक गोलाबारी में फँस गए।"}],"loc":"Section 5 · Column 1 · #5","c":"#3949ab"},{"w":"Motel","hi":"मोटल","en":"roadside hotel for motorists","ex":"A hotel built for people travelling by car, usually beside a main road, where guests can park right outside their room — from 'motor' + 'hotel'. Noun.","xs":"We slept at a cheap motel near the highway during the road trip.","xh":"रोड ट्रिप के दौरान हम हाईवे के पास एक सस्ते मोटल में रुके।","t":"MOTOR + HOTEL = MOTEL — सड़क किनारे होटल.","note":"","s":[{"en":"We slept at a motel near the highway.","hi":"हम हाईवे के पास मोटल में रुके।"}],"loc":"Section 5 · Column 1 · #5","c":"#c62828"},{"w":"Sheaf","hi":"गट्ठर","en":"bundle of stalks/papers","ex":"A bundle of cut stalks of grain tied together after harvest; also a bundle of papers, arrows or other thin objects held together — a sheaf of notes. Noun.","xs":"He walked into the meeting clutching a sheaf of handwritten papers.","xh":"वह हस्तलिखित काग़ज़ों की गट्ठर लिए हुए बैठक में घुसा।","t":"SHEAF ≈ \"शीफ\": गेहूँ की गट्ठर जैसे कागज़ों का ढेर.","note":"","s":[{"en":"He held a sheaf of exam papers.","hi":"उसके हाथ में परीक्षा पत्रों की गट्ठर थी।"}],"loc":"Section 5 · Column 1 · #5","c":"#2e7d32"},{"w":"Lithe","hi":"लचीला, तना हुआ","en":"flexible and graceful","ex":"Flexible, supple and moving gracefully and easily — a lithe dancer, the lithe body of a cat or gymnast. Adjective.","xs":"The lithe gymnast bent backwards and touched the ground effortlessly.","xh":"लचीली जिम्नास्ट पीछे की ओर मुड़कर आसानी से ज़मीन छू लेती थी।","t":"LITHE ≈ SLITHE: साँप की तरह लचीला शरीर.","note":"","s":[{"en":"The lithe dancer amazed everyone.","hi":"लचीली नर्तकी ने सब चकित किया।"}],"loc":"Section 5 · Column 1 · #5","c":"#6d4c41"},{"w":"Willowy","hi":"पतली-सुडौल (विलो जैसी)","en":"slim and graceful like a willow tree","ex":"Tall, thin and graceful, like the slender bending branches of a willow tree — usually describing a woman's figure. Adjective.","xs":"The willowy model walked down the ramp in a flowing gown.","xh":"पतली-सुडौल मॉडल बहते हुए गाउन में रैंप पर चली।","t":"WILLOW पेड़ की टहनियाँ — लंबी-पतली लचीली.","note":"","s":[{"en":"She has a willowy figure.","hi":"उसका बदन पतला-सुडौल है।"}],"loc":"Section 5 · Column 1 · #5","c":"#e63980"},{"w":"Scullery","hi":"बर्तन धोने की छोटी रसोई","en":"small kitchen room for washing dishes","ex":"A small room next to the kitchen in older British houses, used for washing dishes and other messy kitchen jobs. British noun.","xs":"The maid washed the heavy pots in the scullery behind the kitchen.","xh":"नौकरानी ने रसोई के पीछे बर्तन-धुलाई के कमरे में भारी भगौने धोए।","t":"SCULLERY ≈ SCRUB: बर्तन SCRUB करने का कमरा.","note":"","s":[{"en":"Maids worked in the scullery.","hi":"नौकरानियाँ बर्तन-रसोई में काम करती थीं।"}],"loc":"Section 5 · Column 1 · #5","c":"#7c4dff"},{"w":"Flea","hi":"पिस्सू","en":"tiny jumping insect that bites","ex":"A very small, wingless jumping insect that bites animals and people and sucks their blood — flea bites itch badly; 'flea market' is a market selling old second-hand goods. Noun.","xs":"The stray dog was covered in fleas until the vet treated it.","xh":"आवारा कुत्ते में पिस्सू लगे थे, जब तक पशु-चिकित्सक ने इलाज न किया।","t":"FLEE (भागना): पिस्सू छूते ही भाग जाता है.","note":"","s":[{"en":"The dog has fleas.","hi":"कुत्ते में पिस्सू हैं।"}],"loc":"Section 5 · Column 1 · #5","c":"#00897b"},{"w":"Hart","hi":"बारहसिंगा (नर हिरण)","en":"adult male deer","ex":"An adult male deer, especially a red deer over five years old — a literary and hunting word, as in the old song 'The Hart of the Oak'. Literary noun.","xs":"The stag hart stood proudly on the hill, its antlers against the sky.","xh":"शाही नर हिरण पहाड़ी पर गर्व से खड़ा था, उसकी सींगें आसमान से टकरा रही थीं।","t":"HART ≈ \"हार्ट\": जंगल का सींग वाला शाही नर हिरण.","note":"","s":[{"en":"A hart grazed in the meadow.","hi":"घास मैदान में बारहसिंगा चर रहा था।"}],"loc":"Section 5 · Column 1 · #5","c":"#ef6c00"},{"w":"Hasp","hi":"कुँडी की पटरी","en":"metal fastening for a lock/hinge","ex":"A metal fastening with a slot or loop over which a padlock is shut — a hasp and staple on a gate, chest or door. Noun.","xs":"He slipped the padlock through the hasp of the garden gate.","xh":"उसने बगीचे के गेट की कुँडी की पटरी में ताला लगा दिया।","t":"HASP ≈ CLASP: गेट की कुँडी जिसमें ताला पड़ता है.","note":"","s":[{"en":"He shut the gate hasp with a padlock.","hi":"उसने गेट की कुँडी पर ताला लगाया।"}],"loc":"Section 5 · Column 1 · #5","c":"#3949ab"},{"w":"Haslet","hi":"अंग-पेशी का तला हुआ भोजन","en":"meat/offal dish (pork parts)","ex":"A dish made of minced or chopped pork offal (heart, liver etc.) pressed into a loaf and baked, traditional in parts of England and the US. Noun.","xs":"Grandmother fried thick slices of haslet for breakfast.","xh":"दादी ने नाश्ते में हैज़्लेट की मोटी तली हुई फ़ांकें तलीं।","t":"HASLET ≈ \"हस्त\": हाथ से बना तला मांस व्यंजन.","note":"","s":[{"en":"Haslet is a traditional pork dish.","hi":"हैज़्लेट सुअर के मांस की पारंपरिक डिश है।"}],"loc":"Section 5 · Column 1 · #5","c":"#c62828"},{"w":"Extradite","hi":"प्रत्यर्पण करना","en":"send an accused back to another country","ex":"To officially send someone accused or convicted of a crime back to the country or state where the crime was committed, so they can be tried there — extradite a fugitive to India. Formal verb; noun: extradition.","xs":"Britain agreed to extradite the fraudster to India to face trial.","xh":"ब्रिटेन ने धोखेबाज़ को मुक़दमे के लिए भारत को प्रत्यर्पित करने पर सहमति दी।","t":"EXTRA + DITE: देश से बाहर (EXTRA) पुलिस को सौंपना.","note":"","s":[{"en":"Britain extradited the criminal to India.","hi":"ब्रिटेन ने अपराधी भारत को प्रत्यर्पित किया।"}],"loc":"Section 5 · Column 1 · #5","c":"#2e7d32"},{"w":"Abduct","hi":"अपहरण करना","en":"kidnap, take away by force","ex":"To take someone away illegally by force, usually in order to demand money or gain something — abducted on his way home; in medicine, to abduct a limb means to move it away from the centre of the body. Verb; noun: abduction.","xs":"The gang abducted the businessman and demanded a huge ransom.","xh":"गिरोह ने व्यापारी का अपहरण कर भारी फिरौती माँगी।","t":"AB + DUCT (ले जाना): ज़बरदस्ती ले जाना.","note":"","s":[{"en":"Dacoits abducted the landlord.","hi":"डकैतों ने ज़मींदार का अपहरण किया।"}],"loc":"Section 5 · Column 1 · #5","c":"#6d4c41"},{"w":"Nudge","hi":"कोहनी से हल्का धक्का","en":"gentle push with elbow to alert","ex":"To push someone gently, especially with the elbow, to attract attention or warn them; figuratively, to push someone or something gently towards action — nudge him into making a decision. Verb/noun.","xs":"She nudged me with her elbow when the teacher looked our way.","xh":"शिक्षक हमारी ओर देखें तो उसने कोहनी से मुझे ढेला मारा।","t":"NU (नू) + DGE: \"आहा!\" कहने को कोहनी का थपथप.","note":"","s":[{"en":"She nudged me when the boss arrived.","hi":"मालिक आए तो उसने मुझे कोहनी मारी।"}],"loc":"Section 5 · Column 1 · #5","c":"#e63980"},{"w":"Graphology","hi":"हस्तलेख विज्ञान","en":"study of handwriting to judge character","ex":"The (pseudo)study of handwriting, claiming that a person's character and abilities can be judged from the way they write. Noun; adjective: graphological.","xs":"The firm hired a graphology expert to analyse the applicants' handwriting.","xh":"कंपनी ने आवेदकों की लिखावट का विश्लेषण करने के लिए हस्तलेख विज्ञान विशेषज्ञ रखा।","t":"GRAPH (लिखावट) + OLOGY (विज्ञान): लिखावट से चरित्र परख.","note":"","s":[{"en":"Graphology claims handwriting reveals personality.","hi":"हस्तलेख विज्ञान कहता है लिखावट स्वभाव बताती है।"}],"loc":"Section 5 · Column 1 · #5","c":"#7c4dff"},{"w":"Effusive","hi":"उमंग भरा, अत्यधिक अभिव्यक्त","en":"showing feelings too openly","ex":"Showing feelings of gratitude, praise or pleasure too openly and enthusiastically — effusive thanks, an effusive welcome. Adjective; noun: effusion.","xs":"The guest was effusive in her praise of the dinner.","xh":"मेहमान भोजन की प्रशंसा में बहुत उमंग भरी थी।","t":"EFFUSION (बहाव): भावनाएँ बहकर बाहर — ज़रा ज़्यादा.","note":"","s":[{"en":"She was effusive in her praise.","hi":"वह प्रशंसा में बहुत उमंग भरी थी।"}],"loc":"Section 5 · Column 1 · #5","c":"#00897b"},{"w":"Recuperate","hi":"स्वास्थ्य लाभ करना","en":"recover health after illness","ex":"To recover your health, strength or energy after illness, injury or hard work — recuperating at home after surgery. Verb; also 'recuperate costs' = get money back. Noun: recuperation.","xs":"He went to his village for a month to recuperate after the operation.","xh":"ऑपरेशन के बाद वह महीने भर के लिए अपने गाँव स्वास्थ्य लाभ करने गया।","t":"RE-COOP (मुर्गीखाना): पिंजरे में लौटकर आराम — ठीक होना.","note":"","s":[{"en":"He is recuperating after surgery.","hi":"ऑपरेशन के बाद वह स्वास्थ्य लाभ कर रहा है।"}],"loc":"Section 5 · Column 1 · #5","c":"#ef6c00"},{"w":"Epidemiology","hi":"महामारी विज्ञान","en":"study of disease spread in population","ex":"The branch of medicine that studies how diseases spread in populations, their causes, patterns and control — the epidemiology of malaria; an expert is an epidemiologist. Noun.","xs":"Epidemiology helped scientists track how the virus jumped between cities.","xh":"महामारी विज्ञान ने वैज्ञानिकों को यह पता लगाने में मदद की कि वायरस शहरों के बीच कैसे फैला।","t":"EPIDEMIC + OLOGY: महामारी का विज्ञान.","note":"","s":[{"en":"Epidemiology tracked the virus.","hi":"महामारी विज्ञान ने वायरस का पीछा किया।"}],"loc":"Section 5 · Column 1 · #5","c":"#3949ab"},{"w":"Chauffeur","hi":"निजी गाड़ी चालक","en":"person paid to drive a private car","ex":"A person whose job is to drive a private car for a rich or important person; as a verb, to drive someone around in this way. Noun/verb (pronounced 'show-fer').","xs":"The chauffeur opened the door of the limousine for the minister.","xh":"चालक ने मंत्री के लिए लिमोज़ीन का दरवाज़ा खोला।","t":"CHAUFFEUR: \"शॉफर\" — बॉस की गाड़ी चलाने वाला.","note":"","s":[{"en":"The chauffeur opened the car door.","hi":"चालक ने गाड़ी का दरवाज़ा खोला।"}],"loc":"Section 5 · Column 1 · #5","c":"#c62828"},{"w":"Lectern","hi":"भाषण-स्टैंड","en":"stand for notes while speaking","ex":"A tall sloped stand on which a speaker places notes or a book while talking — at church or in a lecture hall (do not confuse with 'podium', which you stand on). Noun.","xs":"The speaker adjusted her papers on the lectern before beginning.","xh":"शुरू करने से पहले वक्ता ने भाषण-स्टैंड पर अपनी परचियाँ संभालीं।","t":"LECTURE करते समय notes रखने का स्टैंड.","note":"","s":[{"en":"The speaker stood at the lectern.","hi":"वक्ता भाषण-स्टैंड पर खड़ा हुआ।"}],"loc":"Section 5 · Column 1 · #5","c":"#2e7d32"},{"w":"Jockey","hi":"घुड़सवार / दबाव डालना","en":"horse racer; to manoeuvre for advantage","ex":"A person whose job is riding horses in races; as a verb, to jockey for position means to manoeuvre cleverly to gain an advantage over others. Noun/verb; 'disc jockey' plays records.","xs":"The candidates were jockeying for the chairperson's post weeks before the vote.","xh":"वोट से हफ़्तों पहले ही उम्मीदवार अध्यक्ष पद के लिए अपनी दाल गलाने लगे थे।","t":"JOCKEY: घोड़े पर बैठकर रेस जीतने वाला — जगह बनाने वाला.","note":"","s":[{"en":"The jockey rode the winning horse.","hi":"घुड़सवार जीतने वाले घोड़े पर सवार था।"}],"loc":"Section 5 · Column 1 · #5","c":"#6d4c41"},{"w":"Polymathy","hi":"बहुज्ञता","en":"knowledge of many subjects","ex":"Knowledge of many different subjects; the condition of being a polymath — a person of great and varied learning, like Leonardo da Vinci. Formal noun; person: polymath.","xs":"His polymathy ranged from Sanskrit grammar to modern physics.","xh":"उसकी बहुज्ञता संस्कृत व्याकरण से लेकर आधुनिक भौतिकी तक फैली थी।","t":"POLY (कई) + MATHY (सीख): कई विद्याओं का ज्ञाता.","note":"","s":[{"en":"Da Vinci's polymathy is legendary.","hi":"दा विंची की बहुज्ञता प्रसिद्ध है।"}],"loc":"Section 5 · Column 1 · #5","c":"#e63980"},{"w":"Endogamy","hi":"अंतर्विवाह","en":"marriage within one's own group","ex":"The custom of marrying only within one's own community, caste, tribe or social group; the opposite of exogamy (marrying outside the group). Noun; adjective: endogamous.","xs":"Many villages still practise caste endogamy in marriage.","xh":"कई गाँव आज भी विवाह में जाति के भीतर ही अंतर्विवाह करते हैं।","t":"ENDO (अंदर) + GAMY (विवाह): अपने ही समुदाय में शादी.","note":"","s":[{"en":"The tribe practises endogamy.","hi":"जनजाति अंतर्विवाह करती है।"}],"loc":"Section 5 · Column 1 · #5","c":"#7c4dff"},{"w":"Ditch","hi":"गड्ढा/नाला","en":"narrow channel dug beside a road","ex":"A long narrow channel dug at the side of a road or field, usually to carry away water; as a verb, to throw something away, to abandon a plan or person, or to land a damaged aircraft on water — ditch the plan, ditch class. Noun/verb.","xs":"The car skidded and landed in a ditch full of rainwater.","xh":"गाड़ी फिसलकर बारिश के पानी से भरे नाले में जा गिरी।","t":"खाई (ditch) में गिरना = छोड़ देना (slang).","note":"","s":[{"en":"The car slid into the ditch.","hi":"गाड़ी नाले में फिसल गई।"}],"loc":"Section 5 · Column 1 · #5","c":"#00897b"},{"w":"Admiral","hi":"नौसेना अधिकारी","en":"high-ranking naval officer","ex":"A very high-ranking officer in the navy, commanding a fleet; 'admiral of the fleet' is the highest naval rank. Noun.","xs":"The admiral reviewed the fleet from the flagship's deck.","xh":"नौसेना अधिकारी ने मुख्य युद्धपोत के डेक से बेड़े का निरीक्षण किया।","t":"ADMIRAL ≈ AMIR: समुद्री सेना का सरदार.","note":"","s":[{"en":"The admiral inspected the fleet.","hi":"अधिकारी ने बेड़े का निरीक्षण किया।"}],"loc":"Section 5 · Column 1 · #5","c":"#ef6c00"},{"w":"Decanter","hi":"शराब/जल का सुंदर बर्तन","en":"glass vessel for serving wine/water","ex":"A decorative glass container with a stopper, used for serving wine, whisky or water at the table; also a bottle-shaped cut-glass vessel. Noun.","xs":"She poured water from the cut-glass decanter into his tumbler.","xh":"उसने कट-ग्लास के सुराही से उसके गिलास में पानी डाला।","t":"DECANT (धीरे उड़ेलना) से — उड़ेलने वाला काँच का घड़ा.","note":"","s":[{"en":"Pour water from the decanter.","hi":"डेकेन्टर से पानी डालो।"}],"loc":"Section 5 · Column 1 · #5","c":"#3949ab"},{"w":"Analepsis","hi":"अतीत दर्शन (flashback)","en":"jump back to earlier events in a story","ex":"A literary and film technique in which the story suddenly jumps back to events that happened earlier — commonly called a flashback; the opposite is prolepsis (flash-forward). Technical noun.","xs":"The film opens with an analepsis to the hero's childhood.","xh":"फ़िल्म नायक के बचपन के अतीत-दृश्य (फ्लैशबैक) से शुरू होती है।","t":"ANALyze PAST: कहानी अचानक पीछे — flashback.","note":"","s":[{"en":"The film opens with an analepsis.","hi":"फिल्म फ्लैशबैक से शुरू होती है।"}],"loc":"Section 5 · Column 1 · #5","c":"#c62828"},{"w":"Prolepsis","hi":"भविष्य झलक (flash-forward)","en":"jump ahead to future events; anticipating objection","ex":"A literary and film technique of jumping ahead to show future events — a flash-forward; in rhetoric, anticipating and answering an objection before it is raised. Technical noun; opposite: analepsis.","xs":"The novel uses prolepsis to reveal the hero's death in its first scene.","xh":"उपन्यास पहले ही दृश्य में नायक की मृत्यु दिखा देता है — भविष्य-झलक (प्रोलेप्सिस) की तकनीक से।","t":"PRO (आगे) + LEP (पकड़): कहानी आगे कूद जाती है.","note":"","s":[{"en":"The author used prolepsis to show the future.","hi":"लेखक ने भविष्य दिखाने हेतु फ्लैश-फॉरवर्ड लिया।"}],"loc":"Section 5 · Column 1 · #5","c":"#2e7d32"},{"w":"Dysphoria","hi":"अस्वस्थता, बेचैनी","en":"state of unease or dissatisfaction","ex":"A state of deep unease, dissatisfaction or anxiety; generalised misery and restlessness — the opposite of euphoria. Medical/psychological noun; adjective: dysphoric.","xs":"He felt a growing dysphoria in the days after losing his job.","xh":"नौकरी गँवाने के दिनों में उसके भीतर बेचैनी और अस्वस्थता बढ़ती जा रही थी।","t":"DYS (बुरा) + PHORIA (भाव): मन की खराब अवस्था — euphoria का उलटा.","note":"","s":[{"en":"He felt dysphoria after the bad news.","hi":"बुरी खबर के बाद वह बेचैन था।"}],"loc":"Section 5 · Column 1 · #5","c":"#6d4c41"},{"w":"Alexithymia","hi":"भाव-अनभिज्ञता","en":"inability to identify/express own emotions","ex":"Difficulty, or an inability, to identify, understand and describe one's own emotions — literally 'no words for feelings'. Psychological noun; adjective: alexithymic.","xs":"Alexithymia makes it hard for him to say whether he is sad or angry.","xh":"भाव-अनभिज्ञता के चलते उसे यह बताना मुश्किल होता है कि वह दुखी है या गुस्से में।","t":"A (नहीं) + LEXI (शब्द) + THYMIA (भाव): भावनाओं के शब्द न होना.","note":"","s":[{"en":"Alexithymia makes feelings hard to describe.","hi":"भाव-अनभिज्ञता में भावनाएँ कह पाना कठिन है।"}],"loc":"Section 5 · Column 1 · #5","c":"#e63980"},{"w":"Misnomer","hi":"ग़लत नाम","en":"wrong or unsuitable name","ex":"A name that is wrong or unsuitable for the thing it describes — 'koala bear' is a misnomer because the koala is a marsupial, not a bear. Noun.","xs":"Calling that thin soup a 'stew' is a complete misnomer.","xh":"उस पतले सूप को 'स्टू' कहना पूरी तरह ग़लत नाम है।","t":"MIS (गलत) + NOMER (नाम): नाम गलत पड़ गया.","note":"","s":[{"en":"\"Koala bear\" is a misnomer; it's a marsupial.","hi":"\"कोआला भालू\" गलत नाम है, वह थैलीधारी है।"}],"loc":"Section 5 · Column 1 · #5","c":"#7c4dff"},{"w":"Grunt","hi":"गुरगुराहट / सिपाही","en":"low rough sound; (US) foot soldier","ex":"A short, low, rough sound — made by a pig, or by a person answering while tired or unwilling; in US slang, a common foot soldier; as a verb, to say something with such a sound. Noun/verb.","xs":"'Whatever,' he grunted, and went back to his phone.","xh":"'जैसी तुम्हारी मर्ज़ी,' वह गुर्राया और फिर अपने फ़ोन में लग गया।","t":"सूअर की \"ग्रंट-ग्रंट\" आवाज़.","note":"","s":[{"en":"He grunted in reply.","hi":"उसने गुर्राकर जवाब दिया।"}],"loc":"Section 5 · Column 1 · #5","c":"#00897b"},{"w":"Honorary","hi":"मानद","en":"given as honour, without payment/duty","ex":"Given as an honour, without the usual payment or duties — an honorary degree, the honorary president of a club (also: holding a position without pay); a honorary title differs from an earned one. Adjective.","xs":"She was made an honorary member for her twenty years of service.","xh":"बीस साल की सेवा के लिए उसे मानद सदस्य बना लिया गया।","t":"HONOUR + ARY: सम्मान के लिए — वेतन/दायित्व बिना.","note":"","s":[{"en":"She is an honorary member.","hi":"वह मानद सदस्य है।"}],"loc":"Section 5 · Column 1 · #5","c":"#ef6c00"},{"w":"Inexorable","hi":"अटल, वश में न आने वाला","en":"impossible to stop or persuade","ex":"Impossible to stop, prevent or persuade; continuing unstoppably — the inexorable march of time, an inexorable judge who refuses mercy. Formal adjective; noun: inexorability.","xs":"Despite all appeals, the inexorable deadline arrived on schedule.","xh":"सारी अपीलों के बावजूद अटल समय-सीमा निर्धारित दिन आ गई।","t":"IN + EXORABLE (विनती मानने वाला): विनती को न टेढ़ा होने वाला.","note":"","s":[{"en":"Time is inexorable.","hi":"समय अटल है।"}],"loc":"Section 5 · Column 1 · #5","c":"#3949ab"},{"w":"Imp","hi":"छोटा शैतान","en":"little devil; mischievous child","ex":"A small demon or devil in old stories; figuratively, a mischievous child — 'you little imp!' Noun.","xs":"That little imp hid the TV remote again.","xh":"उस शैतान बच्चे ने फिर टीवी का रिमोट छिपा दिया।","t":"IMP = इंप — शरारती छोटा दानव.","note":"","s":[{"en":"That little imp hid my keys.","hi":"उस शैतान बच्चे ने चाबियाँ छिपा दीं।"}],"loc":"Section 5 · Column 1 · #5","c":"#c62828"},{"w":"Fiend","hi":"राक्षस / दुष्ट व्यक्ति","en":"evil person; cruel being","ex":"An evil spirit or demon; a very cruel or wicked person; an enthusiast — a fresh-air fiend (someone who loves something to excess); adjective 'fiendish' means extremely difficult or cruel. Noun.","xs":"He fought like a fiend and drove the intruders out of the house.","xh":"वह दुष्ट की तरह लड़ा और घुसपैठियों को घर से भगा दिया।","t":"FRIEND का बिना \"R\": दोस्त बना दुष्ट.","note":"","s":[{"en":"He fought like a fiend.","hi":"वह राक्षस की तरह लड़ा।"}],"loc":"Section 5 · Column 1 · #5","c":"#2e7d32"},{"w":"Ogre","hi":"दैत्य","en":"frightening giant in tales; cruel person","ex":"A frightening giant who eats people, in fairy tales; figuratively, a very frightening or cruel person — 'the new boss is an ogre'. Noun; adjective: ogreish.","xs":"To the children, the strict hostel warden was a real ogre.","xh":"बच्चों के लिए सख़्त हॉस्टल वार्डन सचमुच एक दैत्य था।","t":"श्रापित शक्ति (Shrek) जैसा भयानक दानव.","note":"","s":[{"en":"The ogre guarded the bridge.","hi":"दैत्य पुल की रखवाली करता था।"}],"loc":"Section 5 · Column 1 · #5","c":"#6d4c41"},{"w":"Ellipsis","hi":"तीन बिंदु (…)","en":"mark (…) showing omitted words","ex":"A mark of three dots (…) showing that words have been left out or a thought trails off; in grammar, the omission of words that are understood from context — 'She can and she will' omits 'come'. Noun.","xs":"The tense scene ended in an ellipsis: 'I never thought you would…'","xh":"तनाव भरा दृश्य तीन बिंदुओं पर ख़त्म हुआ: 'मैंने कभी नहीं सोचा था कि तुम…'","t":"ELLIPSIS = \"…\" — कहानी या वाक्य में छोड़ दिया हुआ हिस्सा.","note":"","s":[{"en":"Use an ellipsis to show a pause.","hi":"ठहराव दिखाने हेतु तीन बिंदु लगाओ।"}],"loc":"Section 5 · Column 1 · #5","c":"#e63980"},{"w":"Assignee","hi":"अधिकार प्राप्तकर्ता","en":"person to whom rights/property are assigned","ex":"The person to whom a right, property or duty is legally transferred — in a patent, the company or person who owns it; the one who assigns it is the assignor. Noun.","xs":"The assignee of the patent earns a royalty on every unit sold.","xh":"पेटेंट के अधिकार प्राप्तकर्ता को बिकी हर इकाई पर रॉयल्टी मिलती है।","t":"ASSIGN (सौंपना) + EE: जिसे काम/अधिकार सौंपा गया.","note":"","s":[{"en":"The assignee received the patent rights.","hi":"अधिकार प्राप्तकर्ता को पेटेंट अधिकार मिले।"}],"loc":"Section 5 · Column 1 · #5","c":"#7c4dff"},{"w":"Pagoda","hi":"पैगोडा (एशियाई मंदिर)","en":"Asian temple with tiered tower","ex":"A Hindu or Buddhist temple in Asia, built in the form of a tower with several storeys and curving, upswept roofs. Noun.","xs":"The golden pagoda glittered above the misty hills at sunset.","xh":"सूर्यास्त में धुंधली पहाड़ियों के ऊपर सुनहरी पैगोडा चमक रही थी।","t":"PAGODA — चीन/जापान का झुकी छत वाला मंदिर.","note":"","s":[{"en":"The golden pagoda shone at sunset.","hi":"सूर्यास्त में सुनहरी पैगोडा चमकी।"}],"loc":"Section 5 · Column 1 · #5","c":"#00897b"},{"w":"Ebullient","hi":"उत्साह से भरपूर","en":"cheerful and full of energy","ex":"Cheerful, full of energy and enthusiasm, bubbling over with excitement — an ebullient host, ebullient laughter. Formal adjective; noun: ebullience.","xs":"The team's ebullient captain lifted everyone's spirits after the defeat.","xh":"हार के बाद टीम के उत्साही कप्तान ने सबका हौसला बढ़ा दिया।","t":"BOIL: चाय की तरह उबलता जोश.","note":"","s":[{"en":"Her ebullient nature lifts the team.","hi":"उसकी उमंग भरी प्रकृति टीम को ऊर्जा देती है।"}],"loc":"Section 5 · Column 1 · #5","c":"#ef6c00"},{"w":"Parole","hi":"अवधि पूर्व रिहाई (शब्द पर)","en":"early release on promise of good conduct","ex":"The conditional, early release of a prisoner who promises to behave well and report regularly for the rest of the sentence — released on parole; the board that grants it is the parole board. Noun/verb.","xs":"After serving ten years, he was released on parole for good behaviour.","xh":"दस साल की सज़ा काटने के बाद अच्छे आचरण पर उसे शब्द-बंधन पर रिहा किया गया।","t":"PAROLE ≈ WORD: अपने शब्द (कायदा मानूँगा) पर छूट.","note":"","s":[{"en":"He was released on parole.","hi":"उसे शब्द पर रिहा किया गया।"}],"loc":"Section 5 · Column 1 · #5","c":"#3949ab"},{"w":"Audite","hi":"(लिखित) ऑडिट संबंधी शब्द","en":"relating to an official audit","ex":"A rare term relating to or arising from an official audit; in older English, an audite is the closing statement of accounts. Formal noun/adjective (from audit).","xs":"The clerk filed the audite records with the accounts department.","xh":"क्लर्क ने ऑडिट संबंधी अभिलेख लेखा विभाग में दर्ज किए।","t":"AUDIT + E: हिसाब-किताब जाँच से जुड़ा.","note":"","s":[{"en":"Keep audite records ready.","hi":"ऑडिट संबंधी अभिलेख तैयार रखो।"}],"loc":"Section 5 · Column 1 · #5","c":"#c62828"},{"w":"Luddite","hi":"तकनीक-विरोधी","en":"person opposing new technology","ex":"One of the 19th-century English workers who destroyed new machinery they feared would take their jobs; today, anyone who opposes new technology. Noun; adjective: Luddite, Luddite-like.","xs":"Call me a Luddite, but I still write letters by hand.","xh":"मुझे तकनीक-विरोधी कह लो, पर मैं आज भी चिट्ठियाँ हाथ से लिखता हूँ।","t":"LUDdite: लुड के बुनकर — मशीन तोड़ने वाले.","note":"","s":[{"en":"Grandpa is a Luddite — no smartphone!","hi":"दादाजी तकनीक-विरोधी हैं — स्मार्टफोन नहीं!"}],"loc":"Section 5 · Column 1 · #5","c":"#2e7d32"},{"w":"Elegy","hi":"शोक-काव्य","en":"sad poem for the dead","ex":"A sad, thoughtful poem or song, especially one mourning a dead person or reflecting on loss — Gray's 'Elegy Written in a Country Churchyard'. Noun; adjective: elegiac.","xs":"He composed an elegy for his friend who died in the accident.","xh":"उसने दुर्घटना में मारे गए मित्र के लिए शोक-काव्य रचा।","t":"ELE + GY: विदा का दुख — विरह गीत.","note":"","s":[{"en":"He wrote an elegy for his friend.","hi":"उसने मित्र के लिए शोक-काव्य लिखा।"}],"loc":"Section 5 · Column 1 · #5","c":"#6d4c41"},{"w":"Mason","hi":"राजमिस्त्री","en":"worker who builds with stone/brick","ex":"A worker who builds with stone, brick or concrete blocks — walls, arches, buildings; 'Freemason' is a member of a secret fraternal society. Noun; the trade is masonry.","xs":"The mason laid the bricks wall by wall through the summer.","xh":"राजमिस्त्री ने पूरी गर्मी दीवार-दर-दीवार ईंटें रखीं।","t":"MASON ≈ MASALDAAR पत्थर जोड़ने वाला कारीगर.","note":"","s":[{"en":"The mason laid the bricks.","hi":"राजमिस्त्री ने ईंटें रखीं।"}],"loc":"Section 5 · Column 1 · #5","c":"#e63980"},{"w":"Pretentious","hi":"दिखावटी, आडंबरी","en":"trying to appear important","ex":"Trying to appear more important, clever or cultured than you really are; showy and full of false claims — a pretentious accent, a pretentious art film. Adjective; noun: pretence/pretension.","xs":"His pretentious French phrases only made his colleagues laugh.","xh":"उसके दिखावटी फ़्रेंच वाक्यांशों पर सहकर्मी केवल हँसे।","t":"PRETEND (दिखावा) से — बनावटी शान.","note":"","s":[{"en":"His pretentious accent annoyed us.","hi":"उसकी दिखावटी बोली ने चिढ़ाया।"}],"loc":"Section 5 · Column 1 · #5","c":"#7c4dff"},{"w":"Imperious","hi":"आज्ञाकारी तानाशाह जैसा","en":"domineering, commanding like an emperor","ex":"Behaving as if you have absolute power; domineering and commanding, like an emperor — an imperious wave of the hand, an imperious tone. Adjective; related: imperial, imperiously.","xs":"The imperious manager snapped her fingers to summon the clerk.","xh":"तानाशाह स्वभाव वाली प्रबंधक ने क्लर्क को बुलाने के लिए उँगलियाँ चटकाईं।","t":"IMPERIAL जैसा — बादशाह वाला रवैया.","note":"","s":[{"en":"The imperious officer barked orders.","hi":"अहंकारी अधिकारी ने आदेश चिल्लाए।"}],"loc":"Section 5 · Column 1 · #5","c":"#00897b"},{"w":"Pyromaniac","hi":"अग्निविक्षिप्त","en":"person obsessed with setting fires","ex":"A person who has a strong, uncontrollable impulse to set things on fire; in casual use, anyone who loves fire a bit too much. Noun; the condition is pyromania.","xs":"The abandoned warehouses were the pyromaniac's favourite targets.","xh":"खंडहर गोदाम अग्निविक्षिप्त के पसंदीदा निशाने थे।","t":"PYRO (आग) + MANIAC (पागल): आग लगाने की बीमारी.","note":"","s":[{"en":"The pyromaniac set bins on fire.","hi":"अग्निविक्षिप्त ने कूड़ेदानों में आग लगाई।"}],"loc":"Section 5 · Column 1 · #5","c":"#ef6c00"},{"w":"Incendiary","hi":"आग लगाने वाला / भड़काऊ","en":"designed to cause fire; inflaming passions","ex":"Designed to set things on fire — an incendiary bomb; figuratively, likely to cause anger or violence — an incendiary speech. Adjective; as a noun, an incendiary is a bomb or a person who starts trouble. Noun/adjective.","xs":"Police arrested the speaker for his incendiary comments on the community.","xh":"समुदाय पर भड़काऊ टिप्पणियों के लिए पुलिस ने वक्ता को गिरफ़्तार कर लिया।","t":"INCENDIARY ≈ INCENSE: अगरबत्ती की आग — भड़काऊ बयान भी जलाता है.","note":"","s":[{"en":"Police detained the incendiary speaker.","hi":"पुलिस ने भड़काऊ वक्ता को हिरासत में लिया।"}],"loc":"Section 5 · Column 2 · #5","c":"#3949ab"},{"w":"Tautology","hi":"व्यर्थ-पुनरुक्ति","en":"saying the same thing twice in different words","ex":"Saying the same thing twice in different words — 'free gift', 'silent silence'; in logic, a statement that is true in every case by its very form. Noun; adjective: tautological.","xs":"'ATM machine' is a tautology — the M already stands for machine.","xh":"'ATM मशीन' व्यर्थ-पुनरुक्ति है — M पहले से ही मशीन के लिए है।","t":"TAU + TOLOGY: \"पूर्ण स्वयं सिद्ध\" जैसी दोहराई बात — बेकार रिपीट.","note":"","s":[{"en":"\"Free gift\" is a tautology.","hi":"\"मुफ्त उपहार\" व्यर्थ-पुनरुक्ति है।"}],"loc":"Section 5 · Column 2 · #5","c":"#c62828"},{"w":"Saboteur","hi":"तोड़-फोड़ करने वाला","en":"one who deliberately destroys property/plans","ex":"A person who deliberately destroys property, machines or plans, often secretly, to cause damage or delay. Noun; verb: sabotage.","xs":"The saboteur loosened the bolts so the machine would break mid-shift.","xh":"तोड़-फोड़ करने वाले ने बोल्ट ढीले कर दिए ताकि मशीन ड्यूटी के बीच ही टूट जाए।","t":"SABOTAGE से — चुपके से काम बिगाड़ने वाला.","note":"","s":[{"en":"A saboteur cut the power lines.","hi":"तोड़-फोड़ करने वाले ने बिजली की लाइनें काट दीं।"}],"loc":"Section 5 · Column 2 · #5","c":"#2e7d32"},{"w":"Soliloquy","hi":"आत्मभाषण","en":"talking to oneself aloud (drama)","ex":"A speech in a play in which a character, alone on stage, speaks their thoughts aloud for the audience to hear — Hamlet's 'To be or not to be'. Noun; verb: soliloquize.","xs":"The villain revealed his whole plan in a soliloquy in Act Three.","xh":"तीसरे अंक के आत्मभाषण में खलनायक ने अपनी पूरी योजना खोल दी।","t":"SOLI (अकेला) + LOQUY (बोलना): अकेले-अकेले बोलना.","note":"","s":[{"en":"Hamlet's soliloquy is famous.","hi":"हैमलेट का आत्मभाषण प्रसिद्ध है।"}],"loc":"Section 5 · Column 2 · #5","c":"#6d4c41"},{"w":"Allegory","hi":"रूपक कथा","en":"story with hidden moral/political meaning","ex":"A story, poem or picture in which the characters and events stand for deeper moral, religious or political meanings — 'Animal Farm' as an allegory of revolution. Noun; adjective: allegorical.","xs":"The novel is an allegory of colonial rule told through forest animals.","xh":"यह उपन्यास जंगली जानवरों के ज़रिए बताई गई औपनिवेशिक शासन की रूपक कथा है।","t":"ALLE + GORY ≈ गल्प: ऊपर कहानी, अंदर सीख — Panchatantra जैसा.","note":"","s":[{"en":"\"Animal Farm\" is a political allegory.","hi":"\"एनिमल फार्म\" राजनीतिक रूपक कथा है।"}],"loc":"Section 5 · Column 2 · #5","c":"#e63980"},{"w":"Peroration","hi":"भाषण का समापन प्रभावशाली भाग","en":"grand concluding part of a speech","ex":"The concluding part of a long speech, especially a grand, rousing finish; formally, the whole of a lawyer's closing argument. Formal noun; verb: perorate.","xs":"His peroration brought the crowd to its feet, cheering.","xh":"उसके भाषण के समापन भाग पर भीड़ तालियों के साथ खड़ी हो गई।","t":"PER + ORATION: भाषण का आखिरी जोरदार भाग.","note":"","s":[{"en":"His peroration drew loud applause.","hi":"उसके समापन भाषण पर ज़ोरदार तालियाँ बजीं।"}],"loc":"Section 5 · Column 2 · #5","c":"#7c4dff"},{"w":"Enthymeme","hi":"संक्षिप्त न्यायवाक्य","en":"syllogism with one premise left unsaid","ex":"A shortened syllogism in which one premise is left unstated because it is obvious — 'He lies, so he is a thief' (unstated: liars steal). Rhetorical noun.","xs":"'Everyone is doing it, so it must be right' is a classic enthymeme.","xh":"'सब यही कर रहे हैं, इसलिए यही सही है' — यह एक प्रसिद्ध संक्षिप्त न्यायवाक्य है।","t":"EN + THYMEME ≈ THEME: छोटा तर्क — एक कड़ी छिपी हो.","note":"","s":[{"en":"\"He lies, so he's a thief\" is an enthymeme.","hi":"\"झूठा है, इसलिए चोर है\" संक्षिप्त न्यायवाक्य है।"}],"loc":"Section 5 · Column 2 · #5","c":"#00897b"},{"w":"Paralogism","hi":"तर्कदोष","en":"illogical/false reasoning","ex":"Faulty or illogical reasoning; an argument that seems sound but breaks a rule of logic — a formal fallacy. Formal noun; adjective: paralogistic.","xs":"The detective exposed the paralogism hidden in the witness's story.","xh":"जासूस ने गवाह की कहानी में छिपे तर्कदोष को उजागर कर दिया।","t":"PARA (गलत) + LOGISM (तर्क): बिगड़ा हुआ तर्क.","note":"","s":[{"en":"His claim rests on a paralogism.","hi":"उसका दावा तर्कदोष पर टिका है।"}],"loc":"Section 5 · Column 2 · #5","c":"#ef6c00"},{"w":"Anomie","hi":"सामाजिक उन्मुखता-हीनता / विभ्रम","en":"breakdown of social norms; aimlessness","ex":"A state of society in which social norms are confused, unclear or absent, leaving people aimless and disconnected; personal aimlessness arising from this — Durkheim's famous concept. Sociological noun; adjective: anomic.","xs":"Anomie spread through the mining towns after the factories closed.","xh":"कारख़ाने बंद होने के बाद खनन कस्बों में सामाजिक विभ्रम फैल गया।","t":"A + NOMIE (कानून): नियमहीनता की खालीपन-भरी अवस्था.","note":"","s":[{"en":"Anomie spread after the war.","hi":"युद्ध के बाद सामाजिक विभ्रम फैल गया।"}],"loc":"Section 5 · Column 2 · #5","c":"#3949ab"},{"w":"Catharsis","hi":"भाव-विसर्जन","en":"release of pent-up emotions","ex":"The release of strong, pent-up emotions — through crying, art, drama or talking — that brings relief and cleansing; originally the purging of pity and fear in Greek tragedy. Noun; adjective: cathartic.","xs":"Writing letters to her late father gave her a deep catharsis.","xh":"अपने स्वर्गीय पिता को पत्र लिखने से उसका भाव-विसर्जन हुआ और गहरी राहत मिली।","t":"CATHAR ≈ \"कैथरीन\": दिल साफ करने वाला आँसुओं का बहाव.","note":"","s":[{"en":"Crying gave her catharsis.","hi":"रोने से उसका भाव-विसर्जन हुआ।"}],"loc":"Section 5 · Column 2 · #5","c":"#c62828"},{"w":"Ennui","hi":"जीवन से ऊब","en":"feeling of boredom and dissatisfaction","ex":"A feeling of deep boredom, weariness and dissatisfaction arising from a dull, unexciting life — French origin, pronounced 'on-wee'. Literary noun.","xs":"Retirement brought him a strange ennui he could not shake off.","xh":"सेवानिवृत्ति ने उसे एक अजीब ऊब दी, जिससे वह छुटकारा नहीं पा रहा था।","t":"ENNUI ≈ \"अन-वी\": कुछ न आने-जाने वाली ऊब.","note":"","s":[{"en":"Long holidays brought him ennui.","hi":"लंबी छुट्टियों ने उसे ऊब दी।"}],"loc":"Section 5 · Column 2 · #5","c":"#2e7d32"},{"w":"Nescience","hi":"अज्ञान","en":"lack of knowledge; ignorance","ex":"Complete lack of knowledge or awareness; ignorance — often in a philosophical sense of not even knowing what one does not know. Formal/literary noun; adjective: nescient.","xs":"His nescience of basic traffic rules led to the accident.","xh":"यातायात के बुनियादी नियमों के अज्ञान के कारण ही दुर्घटना हुई।","t":"NE + SCIENCE: विज्ञान से दूर = पूरा अज्ञान.","note":"","s":[{"en":"His nescience of law surprised the judge.","hi":"क़ानून के अज्ञान ने जज को चकित किया।"}],"loc":"Section 5 · Column 2 · #5","c":"#6d4c41"},{"w":"Insouciance","hi":"बेफ़िक्री","en":"cheerful lack of worry","ex":"Cheerful unconcern; a relaxed lack of worry about things others would fret over — answered the judges with easy insouciance. Formal noun; adjective: insouciant.","xs":"She shrugged off the criticism with her usual insouciance.","xh":"उसने अपनी मामूली बेफ़िक्री से आलोचना को हँसी में उड़ा दिया।","t":"IN-SOUCI ≈ \"इन सोचना\": सोचना तक नहीं — बेपरवाही.","note":"","s":[{"en":"She faced the exam with insouciance.","hi":"उसने परीक्षा बेफ़िक्री से दी।"}],"loc":"Section 5 · Column 2 · #5","c":"#e63980"},{"w":"Innocuousness","hi":"अहानिकरता","en":"quality of being harmless","ex":"The quality of being completely harmless — a remark, substance or activity that cannot hurt anyone. Formal noun; adjective: innocuous.","xs":"The lab confirmed the powder's innocuousness before reopening the school.","xh":"स्कूल फिर से खोलने से पहले प्रयोगशाला ने पाउडर की अहानिकरता की पुष्टि की।","t":"IN + NOXIOUS (हानिकारक): हानि से मुक्त.","note":"","s":[{"en":"The medicine's innocuousness was proven.","hi":"दवा की अहानिकरता सिद्ध हुई।"}],"loc":"Section 5 · Column 2 · #5","c":"#7c4dff"},{"w":"Callousness","hi":"निर्दयता / संवेदनहीनता","en":"unfeeling cruelty; hardened insensitivity","ex":"Cruel indifference to the suffering of others; emotional hardness — as if the skin of the heart had grown a callus. Noun; adjective: callous.","xs":"The judge was shocked by the callousness of the hit-and-run driver.","xh":"गाड़ी चढ़ाकर भागने वाले चालक की निर्दयता देखकर जज सकते में आ गए।","t":"CALLUS (अंगूठे की दबी चमड़ी): दिल पर फुंसी — कोमलता नहीं.","note":"","s":[{"en":"His callousness shocked the court.","hi":"उसकी निर्दयता ने अदालत को सकते कर दिए।"}],"loc":"Section 5 · Column 2 · #5","c":"#00897b"},{"w":"Etymology","hi":"शब्द-व्युत्पत्ति विज्ञान","en":"study of word origins","ex":"The study of the origins and historical development of words — how their form and meaning changed over time; also the origin-story of one particular word. Noun; adjective: etymological.","xs":"The etymology of 'salary' traces back to Roman soldiers' salt allowance.","xh":"'सैलरी' शब्द की व्युत्पत्ति रोमन सैनिकों के नमक-भत्ते तक जाती है।","t":"ETYM (सच) + OLOGY: शब्दों की जड़ों का विज्ञान.","note":"","s":[{"en":"Etymology links \"father\" to Latin pater.","hi":"शब्द-व्युत्पत्ति \"father\" को लैटिन pater से जोड़ती है।"}],"loc":"Section 5 · Column 2 · #5","c":"#ef6c00"},{"w":"Semantics","hi":"अर्थ-विज्ञान","en":"study of meaning in language","ex":"The branch of linguistics that studies meaning in language — how words, phrases and sentences carry sense; informally, quibbling over the meaning of words — 'that's just semantics'. Noun; adjective: semantic.","xs":"Lawyers argued about the semantics of the clause for weeks.","xh":"वकील हफ़्तों तक उपबंध के अर्थ-विज्ञान पर बहस करते रहे।","t":"SEMANTIC = MEANING: शब्दों के अर्थ का विज्ञान.","note":"","s":[{"en":"Legally, the semantics matter here.","hi":"क़ानूनी रूप से यहाँ अर्थ का विज्ञान मायने रखता है।"}],"loc":"Section 5 · Column 2 · #5","c":"#3949ab"},{"w":"Philology","hi":"भाषा-विज्ञान","en":"study of languages and literature together","ex":"The old-fashioned, broader study of language in written historical sources — literature, history and grammar together; the ancestor of modern linguistics and comparative language study. Noun; scholar: philologist.","xs":"Philology revealed how Sanskrit, Greek and Latin share a common ancestor.","xh":"भाषा-विज्ञान ने पता लगाया कि संस्कृत, यूनानी और लैटिन एक ही मूल भाषा से निकले हैं।","t":"PHILO (प्रेम) + LOGY (विद्या): भाषा-प्रेमी की विद्या.","note":"","s":[{"en":"Philology traces old scripts.","hi":"भाषा-विज्ञान पुरानी लिपियों का पता लगाता है।"}],"loc":"Section 5 · Column 2 · #5","c":"#c62828"},{"w":"Atavism","hi":"पुर्खाई लक्षणों का लौटना","en":"return of ancestral traits","ex":"The reappearance, after several generations, of an ancestral trait that had disappeared — a throwback; figuratively, a return to a primitive, old way of behaving. Noun; adjective: atavistic.","xs":"His sudden violent temper felt like an atavism from a barbaric age.","xh":"उसका अचानक उफनता गुस्सा किसी बर्बर युग के पुर्खाई लक्षण जैसा लगा।","t":"ATAV ≈ \"आतव\": पुरखों का गुण पीढ़ियों बाद फिर दिखना.","note":"","s":[{"en":"The boy's extra toe is an atavism.","hi":"लड़के की अतिरिक्त उँगली पुर्खाई लक्षण है।"}],"loc":"Section 5 · Column 2 · #5","c":"#2e7d32"},{"w":"Neoteny","hi":"किशोर लक्षण बने रहना","en":"retention of youthful traits in adulthood","ex":"In biology, the retention of juvenile features into adulthood — adult humans keeping baby-like features, or axolotls keeping their larval gills. Technical noun; adjective: neotenic.","xs":"Pandas' round faces and playful ways are examples of neoteny.","xh":"पांडा का गोल चेहरा और शावकों जैसी चुलबुली आदतें नियोटेनी के उदाहरण हैं।","t":"NEO (नया) + TENY (टेंशन): बचपन की चमक बड़ी उम्र तक टिकना.","note":"","s":[{"en":"Pandas show neoteny — playful like cubs.","hi":"पांडा नियोटेनी दिखाते हैं — शावकों जैसे खिलाड़ी।"}],"loc":"Section 5 · Column 2 · #5","c":"#6d4c41"},{"w":"Pedant","hi":"दंभी पंडित","en":"one who shows off small learning, obsessed with rules","ex":"A person who annoys others by showing off small points of learning, correcting tiny errors and insisting on minor rules. Noun; adjective: pedantic; noun: pedantry.","xs":"The pedant spent the meeting correcting everyone's pronunciation.","xh":"वह दंभी पंडित पूरी बैठक भर सबका उच्चारण सुधाराता रहा।","t":"PANDIT जो सिर्फ नियमों की बात करें — दंभी विद्वान.","note":"","s":[{"en":"The pedant corrected every typo.","hi":"दंभी पंडित ने हर टाइपो सुधारा।"}],"loc":"Section 5 · Column 2 · #5","c":"#e63980"},{"w":"Martinet","hi":"सख़्त नियमवादी","en":"strict disciplinarian demanding obedience","ex":"A person who demands strict, exact obedience to rules — especially a harsh disciplinarian boss, teacher or officer; from General Martinet of Louis XIV's army. Noun.","xs":"Our new PE teacher is a martinet who makes us run laps for whispering.","xh":"हमारा नया फ़िज़िकल ट्रेनर सख़्त नियमवादी है — फुसफुसाने पर लैप दौड़ा देता है।","t":"MARTINET: फौजी मार्टिन — हर नियम कड़ाई से मानवाने वाला.","note":"","s":[{"en":"Our maths teacher is a martinet.","hi":"हमारे गणित अध्यापक सख़्त नियमवादी हैं।"}],"loc":"Section 5 · Column 2 · #5","c":"#7c4dff"},{"w":"Eva","hi":"एवा (नाम / जीवन-स्रोत)","en":"name (Eve/Grace); life-giver sense in names","ex":"A female given name, from Hebrew Chava ('life' or 'living one') — the name of the first woman in the Bible; also used for the sense 'life-giver' in names and titles. Proper noun.","xs":"Eva greeted every guest at the door with a warm smile.","xh":"एवा दरवाज़े पर हर मेहमान को गर्मजोशी भरी मुस्कान से मिली।","t":"EVA ≈ EVE: सृष्टि की पहली आद्या — जीवन देने वाली.","note":"","s":[{"en":"Eva greeted everyone warmly.","hi":"एवा सबको हँसकर मिली।"}],"loc":"Section 5 · Column 2 · #5","c":"#00897b"},{"w":"Eavesdropper","hi":"चुगली कान","en":"one who secretly listens to others","ex":"A person who secretly listens to other people's private conversations — from the old custom of standing under the eaves (roof edge) to hear inside. Noun; verb: eavesdrop.","xs":"The eavesdropper at the thin wall heard every word of the deal.","xh":"पतली दीवार के पास लगा चुगली कान सौदे की हर बात सुन गया।","t":"EAVES (छत की ओस) + DROPPER: छत के नीचे टिककर नुकसुककान.","note":"","s":[{"en":"An eavesdropper heard our secret.","hi":"चुगली कान ने हमारा राज़ सुन लिया।"}],"loc":"Section 5 · Column 2 · #5","c":"#ef6c00"},{"w":"Interlocutor","hi":"वार्तावाही (बातचीत में दूसरा पक्ष)","en":"person taking part in a dialogue","ex":"A person who takes part in a conversation or dialogue — the other party in a discussion; also a host who questions guests on a show. Formal noun.","xs":"The interviewer proved a skilful interlocutor, drawing out quiet guests.","xh":"साक्षात्कारकर्ता निपुण वार्तावाही साबित हुए, चुप गेस्टों को भी बोल पड़ा।","t":"INTER (बीच) + LOCUTOR (बोलने वाला): संवाद का साझेदार.","note":"","s":[{"en":"The anchor is a skilled interlocutor.","hi":"एंकर निपुण वार्तावाही है।"}],"loc":"Section 5 · Column 2 · #5","c":"#3949ab"},{"w":"Emissary","hi":"दूत","en":"envoy sent on a special mission","ex":"A person officially sent on a mission as the representative of a ruler, government or organization — a peace emissary. Formal noun; related: emit.","xs":"The king sent an emissary to negotiate peace with the rebels.","xh":"राजा ने बग़ावत करने वालों से शांति की बातचीत के लिए दूत भेजा।","t":"EMIT (भेजना) से: भेजा हुआ दूत.","note":"","s":[{"en":"The king sent an emissary for peace.","hi":"राजा ने शांति हेतु दूत भेजा।"}],"loc":"Section 5 · Column 2 · #5","c":"#c62828"},{"w":"Epicurean","hi":"सुख-सामग्री प्रेमी / एपिक्योरस-अनुयायी","en":"devoted to pleasure; refined eater","ex":"Devoted to the enjoyment of good food, comfort and pleasure; also relating to Epicurus, whose philosophy actually taught simple pleasure and absence of pain. Adjective/noun (an epicurean = a pleasure-lover).","xs":"He lived the epicurean life of long lunches and vintage wine.","xh":"वह लंबे भोज और पुरानी शराब वाला भोगवादी जीवन बिताता था।","t":"EPIC + UREAN: जिंदगी को EPIC खाना-पीना ही मानने वाला.","note":"","s":[{"en":"He lives an epicurean life of fine food.","hi":"वह सुख-भोगों का जीवन बिताता है।"}],"loc":"Section 5 · Column 2 · #5","c":"#2e7d32"},{"w":"Obsequious","hi":"ख़ुशामदी भरा","en":"excessively eager to please, servile","ex":"Excessively eager to please or obey someone important; servile and fawning — obsequious smiles, obsequious waiters who bow too much. Formal adjective; noun: obsequiousness.","xs":"The manager's obsequious tone towards the owner disgusted the staff.","xh":"मालिक के प्रति प्रबंधक की ख़ुशामदी भरी ढंग से बात करने पर स्टाफ घृणा करने लगा।","t":"OBSEQUIOUS ≈ \"आपके सेवक\": हाथ जोड़े घुटने टेकने वाला.","note":"","s":[{"en":"The manager's obsequious smile fooled no one.","hi":"प्रबंधक की ख़ुशामदी भरी मुस्कान ने किसी को नहीं बेचा।"}],"loc":"Section 5 · Column 2 · #5","c":"#6d4c41"},{"w":"Sybarite","hi":"भोगी आरामपरस्त","en":"person devoted to luxury and pleasure","ex":"A person devoted to luxury and sensual pleasure — named after the ancient Greek city of Sybaris, famous for its soft living. Noun; adjective: sybaritic.","xs":"A true sybarite, he holidayed only in five-star spas.","xh":"सच्चा भोगी था — छुट्टियाँ केवल पाँच-सितारा स्पा में ही बिताता था।","t":"SYBARITE ≈ \"सितारे\": शहर सिबारिस के भोगी नागरिक जैसा.","note":"","s":[{"en":"A true sybarite, he booked a five-star suite.","hi":"सच्चा भोगी, उसने पाँच-सितारा सुइट बुक किया।"}],"loc":"Section 5 · Column 2 · #5","c":"#e63980"},{"w":"Agoraphobe","hi":"भीड़/खुले स्थान का डरने वाला","en":"one who fears open/crowded places","ex":"A person who has an intense fear of open spaces, crowds or public places from which escape seems difficult; the condition is agoraphobia. Noun; adjective: agoraphobic.","xs":"The agoraphobe ordered everything online rather than enter a mall.","xh":"भीड़ से डरने वाला व्यक्ति मॉल में जाने के बजाय सब कुछ ऑनलाइन मँगवाता था।","t":"AGORA (बाज़ार) + PHOBE: बाज़ार जैसे भीड़भाड़ से घबराने वाला.","note":"","s":[{"en":"The agoraphobe shopped online only.","hi":"भीड़-डरने वाला केवल ऑनलाइन खरीदता था।"}],"loc":"Section 5 · Column 2 · #5","c":"#7c4dff"},{"w":"Mysophobe","hi":"गंदगी का डरने वाला","en":"one with an obsessive fear of germs/dirt","ex":"A person with an obsessive fear of germs, dirt and contamination — washing hands again and again, avoiding touching door handles; the condition is mysophobia. Noun; adjective: mysophobic.","xs":"The mysophobe carried hand sanitizer in every pocket.","xh":"गंदगी से डरने वाला हर जेब में हैंड सैनिटाइज़र रखता था।","t":"MY (मयला) + PHOBE: मयला-से घबराने वाला.","note":"","s":[{"en":"A mysophobe, she washes hands twenty times.","hi":"गंदगी-डरने वाली बीस बार हाथ धोती है।"}],"loc":"Section 5 · Column 2 · #5","c":"#00897b"},{"w":"Neologism","hi":"नवीन शब्द","en":"newly coined word","ex":"A newly coined word or expression — 'selfie', 'google' as a verb; sometimes a new sense given to an old word. Noun; adjective: neological.","xs":"'Rizz' is the latest neologism to enter the dictionary.","xh":"'रिज़' शब्दकोश में दर्ज होने वाला नवीनतम शब्द है।","t":"NEO (नया) + LOGISM (शब्द): नया गढ़ा शब्द.","note":"","s":[{"en":"\"Selfie\" is a popular neologism.","hi":"\"सेल्फी\" प्रचलित नवीन शब्द है।"}],"loc":"Section 5 · Column 2 · #5","c":"#ef6c00"},{"w":"Misoneist","hi":"परिवर्तन-द्वेषी","en":"one who hates new things/change","ex":"A person who dislikes or resists anything new — new ideas, fashions or inventions; the opposite of a neophile. Rare noun; the trait is misoneism.","xs":"The misoneists in the office refused to abandon paper files for software.","xh":"ऑफ़िस के परिवर्तन-द्वेषियों ने काग़ज़ी फ़ाइलें छोड़कर सॉफ़्टवेयर अपनाने से मना कर दिया।","t":"MIS (नफ़रत) + NEO (नया): नए का शत्रु.","note":"","s":[{"en":"Misoneists resisted the new system.","hi":"परिवर्तन-द्वेषियों ने नई व्यवस्था का विरोध किया।"}],"loc":"Section 5 · Column 2 · #5","c":"#3949ab"},{"w":"Solipsism","hi":"केवल आत्म अस्तित्ववाद","en":"belief that only one's own mind exists","ex":"The philosophical belief that only one's own mind is sure to exist — the outside world and other minds cannot be proven; figuratively, extreme self-absorption. Noun; adjective: solipsistic.","xs":"The novel drifts into solipsism — the narrator doubts everyone but himself.","xh":"उपन्यास केवल-आत्म अस्तित्ववाद की ओर जाता है — कथावाचक स्वयं को छोड़ सब पर संदेह करता है।","t":"SOLI (अकेला) + IPSIM (स्वयं): मैं ही सब कुछ हूँ.","note":"","s":[{"en":"The novel explores solipsism.","hi":"उपन्यास केवल-आत्म अस्तित्ववाद छूता है।"}],"loc":"Section 5 · Column 2 · #5","c":"#c62828"},{"w":"Beatitude","hi":"परम सुख-अवस्था","en":"supreme blessedness; bliss","ex":"Supreme blessedness; a state of perfect happiness and peace; in Christianity, any of the eight blessings spoken by Jesus in the Sermon on the Mount. Noun; adjective: beatific.","xs":"A look of pure beatitude settled on the monk's face as he meditated.","xh":"ध्यान करते समय साधु के चेहरे पर निर्विकार परम सुख उतर आया।","t":"BEAT + ITUDE: हार (beat) खाए बिना आत्मा की खुशी.","note":"","s":[{"en":"The monk's face showed beatitude.","hi":"साधु के चेहरे पर परम सुख झलक रहा था।"}],"loc":"Section 5 · Column 2 · #5","c":"#2e7d32"},{"w":"Tergiversation","hi":"कपट-वंचन / रास्ता बदलना","en":"evasive talk; switching sides","ex":"The deliberate avoidance of a clear answer; evasive, twisting talk; also the act of abandoning a cause or changing sides — political tergiversation. Formal noun; verb: tergiversate.","xs":"Voters grew tired of the minister's endless tergiversation on the dam issue.","xh":"बाँध मुद्दे पर मंत्री की बार-बार कपट-वंचन से मतदाता थक गए।","t":"TERG ≈ TURN: बार-बार करवट लेता जवाब.","note":"","s":[{"en":"The minister's tergiversation annoyed journalists.","hi":"मंत्री की कपट-वंचन ने पत्रकारों को चिढ़ाया।"}],"loc":"Section 5 · Column 2 · #5","c":"#6d4c41"},{"w":"Perspicuity","hi":"स्पष्टता (भाषा की)","en":"clarity of expression","ex":"The quality of being clear and easy to understand — clear expression in speech or writing; related to 'perspicacious' (which means sharp-minded — do not confuse them). Formal noun; adjective: perspicuous.","xs":"Teachers praised the essay's perspicuity — every point was crystal clear.","xh":"शिक्षकों ने निबंध की स्पष्टता की सराहना की — हर बात साफ़-साफ़ समझ आती थी।","t":"PERSPECTIVE जैसा साफ — जो सीधा दिखे.","note":"","s":[{"en":"Write with perspicuity.","hi":"स्पष्टता से लिखो।"}],"loc":"Section 5 · Column 2 · #5","c":"#e63980"},{"w":"Paroxysm","hi":"तीव्र दौरा (क्रोध/दर्द का)","en":"sudden violent outburst/attack","ex":"A sudden, violent attack or outburst of emotion, pain, coughing or laughter — a paroxysm of rage, coughing fits in paroxysms. Formal noun.","xs":"The audience burst into paroxysms of laughter at his mimicry.","xh":"उसकी नकल पर दर्शक हँसी के तेज़ दौरों में लोटने लगे।","t":"PARA + OXYSM ≈ OXYGEN: साँस रुकने जैसा झटका-दौरा.","note":"","s":[{"en":"She fell into a paroxysm of coughing.","hi":"वह खाँसी के तीव्र दौरे में फँस गई।"}],"loc":"Section 5 · Column 2 · #5","c":"#7c4dff"},{"w":"Trepidation","hi":"घबराहट","en":"trembling fear; anxiety","ex":"A feeling of fear, dread or nervous anxiety about something that may happen — opened the letter with trepidation. Formal noun; adjective: trepidatious.","xs":"She opened the exam result with trepidation, hands trembling.","xh":"उसने हाथ काँपते हुए, घबराहट के साथ परीक्षा का नतीजा खोला।","t":"TREMBLE जैसा: पैर काँपते चढ़ने वाला डर.","note":"","s":[{"en":"He opened the letter with trepidation.","hi":"उसने घबराहट से चिट्ठी खोली।"}],"loc":"Section 5 · Column 2 · #5","c":"#00897b"},{"w":"Psaltery","hi":"प्साल्टरी (बीणा-सा बाजा)","en":"ancient stringed musical instrument","ex":"An ancient and medieval stringed musical instrument, played with fingers or a plectrum, with strings stretched over a flat soundboard — ancestor of the zither family. Noun.","xs":"The illustration shows an angel playing a psaltery.","xh":"चित्र में एक देवदूत सालतरी (स्ट्रिंग वाद्य) बजाता दिख रहा है।","t":"PSALM (भजन) + ERY: भजन बजाने वाला बाजा.","note":"","s":[{"en":"David played the psaltery.","hi":"दाऊद ने प्साल्टरी बजाई।"}],"loc":"Section 5 · Column 2 · #5","c":"#ef6c00"},{"w":"Skittery","hi":"फुदकता हुआ","en":"moving quickly and lightly; jumpy","ex":"Nervous, restless and apt to dart about suddenly — a skittery horse, skittery footsteps; also moving lightly and quickly over a surface. Informal/literary adjective.","xs":"The skittery colt shied at every falling leaf.","xh":"घबराया हुआ बछेड़ा गिरती हर पत्ती पर चौंक जाता था।","t":"SKITTER: छिपकली जैसी झटकेदार दौड़.","note":"","s":[{"en":"The skittery kitten chased light dots.","hi":"फुदकती बिल्ली का बच्चा रोशनी पीछा करती थी।"}],"loc":"Section 5 · Column 2 · #5","c":"#3949ab"},{"w":"Compere","hi":"कार्यक्रम संचालक","en":"host/MC of a show","ex":"A person who introduces performers and keeps a show or event moving — the host/emcee of a show; British usage (US: emcee/MC). Noun/verb; from French 'compter'.","xs":"The compere kept the audience laughing between acts.","xh":"एंकर ने कार्यक्रम के बीच दर्शकों को हँसाते रखा।","t":"COMPARE जैसा: तुलना करके शो चलाने वाला.","note":"","s":[{"en":"The compere announced the next act.","hi":"संचालक ने अगला प्रदर्शन घोषित किया।"}],"loc":"Section 5 · Column 2 · #5","c":"#c62828"},{"w":"Soothsayer","hi":"भविष्यवक्ता","en":"one who predicts the future","ex":"A person who claims to predict the future — a fortune-teller or prophet, as in Shakespeare's soothsayer who warns Caesar: 'Beware the ides of March.' Noun.","xs":"The soothsayer warned the king of disaster in a dream.","xh":"भविष्यवक्ता ने सपने में राजा को आपदा की चेतावनी दी।","t":"SOOTH (सच) + SAYER: सच बताने वाला — ज्योतिषी.","note":"","s":[{"en":"The soothsayer warned the king.","hi":"भविष्यवक्ता ने राजा को चेताया।"}],"loc":"Section 5 · Column 2 · #5","c":"#2e7d32"},{"w":"Benefaction","hi":"परोपकारी दान","en":"gift or good deed for others","ex":"A donation or gift of money for a good cause; an act of charity — the hospital was built by a rich man's benefaction. Formal noun; verb: benefact; person: benefactor.","xs":"The library was built from the benefaction of an industrialist.","xh":"पुस्तकालय एक उद्योगपति के दान से बना था।","t":"BENE (अच्छा) + FACT (काम): भलाई का काम/दान.","note":"","s":[{"en":"His benefaction built the library.","hi":"उसके दान से पुस्तकालय बना।"}],"loc":"Section 5 · Column 2 · #5","c":"#6d4c41"},{"w":"Apiary","hi":"मधुमक्खी फार्म","en":"place where beehives are kept","ex":"A place where beehives are kept and bees are raised for honey — a bee-yard; the keeper is an apiarist/beekeeper. Noun.","xs":"The farm's apiary produces twenty jars of honey every summer.","xh":"खेत के मधुमक्खी-फ़ार्म से हर गर्मी में बीस शहद के जार निकलते हैं।","t":"API (मधुमक्खी) + ARY: मधुमक्खियों का घर.","note":"","s":[{"en":"The apiary produces sweet honey.","hi":"मधुमक्खी फार्म मीठा शहद देता है।"}],"loc":"Section 5 · Column 2 · #5","c":"#e63980"},{"w":"Aviary","hi":"पक्षीघर","en":"large cage/enclosure for birds","ex":"A large enclosure, cage or building for keeping birds — often in zoos, parks or private gardens, big enough for them to fly. Noun.","xs":"Flamingos and macaws share the zoo's huge walk-through aviary.","xh":"चिड़ियाघर के विशाल पक्षी-गृह में फ्लेमिंगो और मकाव एक साथ रहते हैं।","t":"AVI (पक्षी) + ARY: पक्षियों का घर.","note":"","s":[{"en":"Parrots chirp in the aviary.","hi":"पक्षीघर में तोते चहचहाते हैं।"}],"loc":"Section 5 · Column 2 · #5","c":"#7c4dff"},{"w":"Palpable","hi":"स्पष्ट अनुभव होने वाला","en":"so obvious it can be \"touched\"","ex":"So obvious that you can almost feel or touch it — palpable tension in the room; technical sense: able to be felt by touch — a palpable lump. Adjective; noun: palpability.","xs":"Fear was palpable in the dark, silent street after the siren.","xh":"सायरन के बाद अंधेरी, सन्नाटे भरी गली में डर साफ़ महसूस हो रहा था।","t":"PALPATE (हाथ से जाँचना): छूने लायक स्पष्ट.","note":"","s":[{"en":"Tension was palpable in the room.","hi":"कमरे में तनाव स्पष्ट था।"}],"loc":"Section 5 · Column 2 · #5","c":"#00897b"},{"w":"Satyromania","hi":"अति-कामोत्तेजना (पुरुष)","en":"excessive male sexual desire","ex":"Excessive, uncontrollable sexual desire in a man — from satyr, the lustful goat-man of Greek myth; the female counterpart is nymphomania. Rare/medical noun.","xs":"In old novels, villains were often written as sufferers of satyromania.","xh":"पुराने उपन्यासों में खलनायक अक्सर सत्यरोमेनिया से पीड़ित दिखाए जाते थे।","t":"SATYR (बकरी-पैर वाला वासना-देव) + MANIA: वासना की उन्माद.","note":"","s":[{"en":"The tale mocks the villain's satyromania.","hi":"कहानी खलनायक की अति-वासना का मज़ाक उड़ाती है।"}],"loc":"Section 5 · Column 2 · #5","c":"#ef6c00"},{"w":"Clique","hi":"चांदी गुट / अंतरंग दल","en":"small exclusive group","ex":"A small, closed group of people who spend time together and often keep others out — the school's popular clique, a clique within the party. Noun (pronounced 'kleek').","xs":"The seniors formed a clique that no first-year could enter.","xh":"सीनियर्स ने एक अलग टोली बना ली, जिसमें फ़र्स्ट-ईयर किसी को घुसने नहीं देते थे।","t":"CLICK: एक-दूसरे के साथ \"click\" होने वाला छोटा गिरोह.","note":"","s":[{"en":"The school clique never let outsiders in.","hi":"स्कूल का गुट बाहरी को कभी घुसने नहीं देता था।"}],"loc":"Section 5 · Column 2 · #5","c":"#3949ab"},{"w":"Quay","hi":"जहाज़ों का घाट","en":"dock/wharf where ships load","ex":"A stone or concrete platform beside water where ships load and unload goods — a busy quay; pronounced exactly like 'key'. Noun.","xs":"Dockers unloaded crates of spices along the old stone quay.","xh":"मज़दूरों ने पुराने पत्थर के जेटी किनारे मसालों के बक्से उतारे।","t":"QUAY ≈ \"की\": की-वेस्ट के घाट जैसा.","note":"","s":[{"en":"Cargo was unloaded at the quay.","hi":"जहाज़ का माल घाट पर उतरा।"}],"loc":"Section 5 · Column 2 · #5","c":"#c62828"},{"w":"Inferno","hi":"भयानक अग्नि / नरक","en":"huge fire; hell","ex":"A huge, uncontrollable fire — 'the warehouse became an inferno'; in Dante, Hell itself ('Inferno' is the first part of the Divine Comedy). Noun; Italian for 'hell'.","xs":"Within minutes the whole floor of the factory was an inferno.","xh":"मिनटों में कारख़ाने का पूरा तल ज़बरदस्त अग्निकांड बन गया।","t":"DANTE का INFERNO — नरक की ज्वाला.","note":"","s":[{"en":"The factory became an inferno.","hi":"कारखाना भयानक अग्नि बन गया।"}],"loc":"Section 6 · Column 1 · #6","c":"#2e7d32"},{"w":"Dystopia","hi":"दुःख-समाज (कल्पित बुरा देश)","en":"imagined bad society; opposite of utopia","ex":"An imagined society that is terrible and unjust — the opposite of utopia; a novel or film showing such a world ('1984', 'The Hunger Games'). Noun; adjective: dystopian.","xs":"The novel paints a dystopia where every citizen is watched round the clock.","xh":"उपन्यास एक ऐसी दुश्चित्र दुनिया दिखाता है जहाँ हर नागरिक पर चौबीसों घंटे निगरानी होती है।","t":"DYS (बुरा) + TOPIA (देश): बुरे देश की कल्पना.","note":"","s":[{"en":"\"1984\" shows a chilling dystopia.","hi":"\"1984\" भयावह दुःख-समाज दिखाती है।"}],"loc":"Section 6 · Column 1 · #6","c":"#6d4c41"},{"w":"Optophobia","hi":"खोलने/देखने का डर","en":"fear of opening one's eyes","ex":"A rare, persistent fear of opening one's eyes — a dread of vision/light exposure. Rare psychological noun (opto = eye/vision + phobia).","xs":"The patient's optophobia made even daylight unbearable to him.","xh":"रोगी की आँख खोलने का डर उसके लिए दिन की रोशनी को भी असहनीय बना देता था।","t":"OPTO (आँख) + PHOBIA: आँख खोलने से डर.","note":"","s":[{"en":"Rare optophobia makes light painful.","hi":"दुर्लभ ओप्टोफोबिया में रोशनी दुखती है।"}],"loc":"Section 6 · Column 1 · #6","c":"#e63980"},{"w":"Agoraphobia","hi":"खुले स्थान की फोबिया","en":"fear of open/crowded public spaces","ex":"An intense fear of open spaces, crowds, or public places from which escape might be difficult or embarrassing — often keeping sufferers indoors. Noun; person: agoraphobe; adjective: agoraphobic.","xs":"Her agoraphobia grew so severe that she stopped leaving the house.","xh":"उसका खुली जगह का डर इतना बढ़ गया कि वह घर छोड़ना बंद कर देती थी।","t":"AGORA (बाज़ार) + PHOBIA: भीड़-बाज़ार का डर.","note":"","s":[{"en":"Her agoraphobia kept her indoors.","hi":"खुले स्थान की फोबिया उसे घर में रखती थी।"}],"loc":"Section 6 · Column 1 · #6","c":"#7c4dff"},{"w":"Paraphrase","hi":"भावानुवाद","en":"restate in your own words","ex":"To say or write something in different words, keeping the same meaning — paraphrase a poem in simple prose; also the reworded version itself. Verb/noun.","xs":"Paraphrase this legal paragraph in plain Hindi for the villagers.","xh":"इस क़ानूनी अनुच्छेद को गाँव वालों के लिए सरल हिंदी में अपने शब्दों में कहो।","t":"PARA (साथ) + PHRASE: वही बात, अपने शब्दों में.","note":"","s":[{"en":"Paraphrase the poem in simple English.","hi":"कविता को सरल अंग्रेज़ी में भावानुवाद करो।"}],"loc":"Section 6 · Column 1 · #6","c":"#00897b"},{"w":"Pique","hi":"अभिमान-क्षोभ / उकसाना","en":"irritated pride; to provoke","ex":"A feeling of wounded pride or irritation — left in a fit of pique; as a verb, to pique someone's curiosity/interest means to arouse it; also to annoy. Noun/verb.","xs":"The old map piqued the archaeologist's curiosity immediately.","xh":"पुराने नक्शे ने पुरातत्वविद् की जिज्ञासा तुरंत जगा दी।","t":"\"पीक\" निकलना
