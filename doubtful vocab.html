on, DNA evidence proved his innocence.","xh":"दस साल की क़ैद के बाद डीएनए सबूत ने उसकी बेगुनाही साबित कर दी।","t":"NO-CENCE (ना-कोई-पाप): बच्चे की साफ़ आँखें.","note":"","s":[{"en":"Her innocence charmed everyone.","hi":"उसकी मासूमियत ने सब मोह लिया।"}],"loc":"Section 3 · Column 2 · #1","c":"#3949ab"},{"w":"Diminishment","hi":"ह्रास, कमी","en":"the act of becoming smaller","ex":"The process or fact of becoming smaller, weaker or less valuable; reduction in size, power or importance. Formal noun; verb: diminish.","xs":"Age brought a gradual diminishment in the boxer's reflexes.","xh":"उम्र ने मुक्केबाज़ की प्रतिवर्त क्षमता को धीरे-धीरे कम कर दिया।","t":"DIMINISH (घटना) से — धीमे-धीमे घटाव.","note":"","s":[{"en":"There was a diminishment of trust.","hi":"भरोसे में कमी आई।"}],"loc":"Section 3 · Column 2 · #1","c":"#c62828"},{"w":"Impute","hi":"आरोपित करना","en":"lay blame/quality on someone","ex":"To say or believe that something — usually something bad — belongs to or was caused by a person; to attribute responsibility or blame. Formal verb; noun: imputation.","xs":"The auditor imputed the loss to careless accounting.","xh":"लेखा-परीक्षक ने नुक़सान की ज़िम्मेदारी लापरवाह हिसाब-किताब पर डाली।","t":"IM + PUT: कसूर \"डाल देना\" (put) किसी पर.","note":"","s":[{"en":"Don't impute bad motives to her.","hi":"उसे बुरे मक़सद वाला मत ठहराओ।"}],"loc":"Section 3 · Column 2 · #1","c":"#2e7d32"},{"w":"Amputate","hi":"अंग काटना","en":"surgically cut off a limb","ex":"To cut off a limb — an arm, leg, finger — surgically, usually because of disease or severe injury. Medical verb; noun: amputation.","xs":"Gangrene forced the surgeons to amputate his left foot.","xh":"गैंग्रीन ने सर्जनों को उसका बायाँ पैर काटने पर मजबूर किया।","t":"AMPUTE ≈ \"अम्पा-कट\": डॉक्टर की कैंची से कटान.","note":"","s":[{"en":"The wound forced doctors to amputate.","hi":"घाव ने डॉक्टरों को अंग काटने पर मजबूर किया।"}],"loc":"Section 3 · Column 2 · #1","c":"#6d4c41"},{"w":"Earmark","hi":"निर्धारित कर रखना","en":"set aside for a specific use","ex":"To set money or resources aside for one specific purpose — funds earmarked for schools; to mark animals by notching the ear; to recognize a quality as typical. Verb/noun.","xs":"The government earmarked ₹500 crore for rural roads.","xh":"सरकार ने ग्रामीण सड़कों के लिए ₹500 करोड़ आरक्षित किए।","t":"गाय के कान में निशान (ear-mark) = पहचान के लिए अलग.","note":"","s":[{"en":"Funds are earmarked for roads.","hi":"धन सड़कों के लिए आरक्षित है।"}],"loc":"Section 3 · Column 2 · #1","c":"#e63980"},{"w":"Fluke","hi":"अचानक क़िस्मत की जीत","en":"lucky accident","ex":"A lucky result that happens by pure chance, not skill or plan — winning the lottery is a fluke; also a flatfish, or the barbed end of an anchor. Noun, informal.","xs":"His first-century was no fluke; he had trained for years.","xh":"उसका पहला शतक कोई संयोग नहीं था; वह बरसों से मेहनत कर रहा था।","t":"\"फ्लूक!\" — जब लट्टू गेंद पर छक्का लग जाए.","note":"","s":[{"en":"His win was a pure fluke.","hi":"उसकी जीत पूरी क़िस्मत थी।"}],"loc":"Section 3 · Column 2 · #1","c":"#7c4dff"},{"w":"Inscrutable","hi":"रहस्यमय, पढ़ा न जा सकने वाला","en":"impossible to understand","ex":"Impossible to understand or read; hiding thoughts and feelings behind a blank face — an inscrutable smile, inscrutable motives. Adjective.","xs":"The poker champion kept an inscrutable face through every hand.","xh":"पोकर चैंपियन ने हर हाथ में अपाठ्य चेहरा बनाए रखा।","t":"IN + SCRUTABLE (जाँच योग्य): पोकर खिलाड़ी का बेअसर चेहरा.","note":"","s":[{"en":"Her inscrutable smile hid everything.","hi":"उसकी रहस्यमय मुस्कान सब छुपा गई।"}],"loc":"Section 3 · Column 2 · #1","c":"#00897b"},{"w":"Foul","hi":"गंदा, बुरा, ग़लत","en":"dirty; against rules","ex":"Dirty, filthy and disgusting — foul water, a foul smell; morally bad — foul language; in sport, an illegal move; in weather, stormy. Adjective/verb/noun (opposite: fair).","xs":"The referee called a foul when the defender tripped the striker.","xh":"जब डिफेंडर ने स्ट्राइकर का पैर फँसाया तो रेफ़री ने फाउल दिया।","t":"फुटबॉल का FOUL + दूध का फटना (foul smell).","note":"","s":[{"en":"The pond water was foul.","hi":"तालाब का पानी गंदा था।"}],"loc":"Section 3 · Column 2 · #1","c":"#ef6c00"},{"w":"Squawk","hi":"तेज़ चीख","en":"harsh loud cry","ex":"To make a loud, harsh cry like a parrot or chicken; to complain loudly and rudely — customers squawking about the price. Verb/noun.","xs":"The parrot squawked loudly when its cage was moved.","xh":"पिंजरा हिलाया गया तो तोता ज़ोर से चीखा।","t":"तोता \"स्क्वॉक!\" चिल्लाता है.","note":"","s":[{"en":"The hen squawked loudly.","hi":"मुर्गी ने तेज़ चीख मारी।"}],"loc":"Section 3 · Column 2 · #1","c":"#3949ab"},{"w":"Lull","hi":"ठहराव / सुलाना","en":"quiet pause; to soothe","ex":"A quiet, calm period in the middle of activity — a lull in the storm, a lull in the fighting; to soothe someone to sleep (lull a baby); to make someone feel falsely safe (lull into complacency). Noun/verb.","xs":"There was a brief lull in the rain, and we rushed to the car.","xh":"बारिश थोड़ी देर ठहर गई, और हम भागकर गाड़ी में बैठ गए।","t":"\"लोरी-लुल्लबी\" से सुला देना.","note":"","s":[{"en":"A lull fell over the market.","hi":"बाज़ार में ठहराव छा गया।"}],"loc":"Section 3 · Column 2 · #1","c":"#c62828"},{"w":"Livid","hi":"गुस्से से लाल-नीला","en":"furiously angry; bruise-coloured","ex":"Extremely angry, furious — livid with rage; also bruised, showing a dark blue-grey colour — livid marks on the skin. Adjective.","xs":"Father was livid when he saw the dented new car.","xh":"नई गाड़ी पर मरोड़ देखकर पिता आग-बबूला हो गए।","t":"LIVE + ID: गुस्से से \"जी उठना\" — चेहरा नीला पड़ जाना.","note":"","s":[{"en":"Dad was livid at the broken window.","hi":"टूटी खिड़की पर पिता गुस्से से लाल हो उठे।"}],"loc":"Section 3 · Column 3 · #1","c":"#2e7d32"},{"w":"Gloom","hi":"अंधेरा, उदासी","en":"darkness; low spirits","ex":"Partial darkness and shadow — the gloom of the forest; a feeling of sadness and hopelessness — the gloom that follows bad news. Noun; adjective: gloomy.","xs":"Bankruptcy news cast a gloom over the entire factory floor.","xh":"दिवालियेपन की खबर ने पूरी फैक्ट्री में उदासी फैला दी।","t":"GLOOMY weather = बादल-साया मन.","note":"","s":[{"en":"Gloom spread after the defeat.","hi":"हार के बाद उदासी छा गई।"}],"loc":"Section 3 · Column 3 · #1","c":"#6d4c41"},{"w":"Boredom","hi":"ऊब","en":"dullness, weariness","ex":"The state of being weary and restless because something is dull and uninteresting; lack of excitement. Noun; adjective: boring/bored.","xs":"A five-hour layover turned into pure boredom for the passengers.","xh":"पाँच घंटे का रुकना यात्रियों के लिए ख़री-ख़री उबाऊ बन गया।","t":"BORE + KINGDOM: बोरियत का साम्राज्य.","note":"","s":[{"en":"Sunday afternoon boredom hit hard.","hi":"रविवार की दोपहर की ऊब भारी थी।"}],"loc":"Section 3 · Column 3 · #1","c":"#e63980"},{"w":"Intrepidity","hi":"निडरता","en":"fearless courage","ex":"Fearless courage; the quality of facing danger calmly and without flinching — the intrepidity of the fire crew. Formal, literary noun; adjective: intrepid.","xs":"The mountaineer's intrepidity won him the highest honour.","xh":"पर्वतारोही के निडर साहस ने उसे सर्वोच्च सम्मान दिलाया।","t":"IN + TREPID (काँपना): काँपना तक नहीं = बहादुरी.","note":"","s":[{"en":"The firefighter's intrepidity saved lives.","hi":"दमकल कर्मी की निडरता ने जानें बचाईं।"}],"loc":"Section 3 · Column 3 · #1","c":"#7c4dff"},{"w":"Perusal","hi":"ध्यानपूर्वक अध्ययन","en":"careful reading","ex":"Careful, detailed reading and study of something — after a perusal of the contract; often loosely used to mean a quick look. Formal noun; verb: peruse.","xs":"The lawyer's perusal of the agreement revealed a hidden clause.","xh":"समझौते का वकील द्वारा बारीकी से अध्ययन करने पर एक छिपा उपबंध सामने आया।","t":"PER + USE: दस्तावेज़ का \"इस्तेमाल\" — बारीकी से पढ़ना.","note":"","s":[{"en":"After perusal, sign the contract.","hi":"बारीकी से पढ़कर ठेका पर हस्ताक्षर करें।"}],"loc":"Section 3 · Column 3 · #1","c":"#00897b"},{"w":"Incongruence","hi":"बेमेल","en":"lack of harmony or fit","ex":"A mismatch between things that should agree — words and actions, inner feelings and outer expression; lack of harmony. Formal noun; adjective: incongruent (also incongruous).","xs":"His cheerful words sat in incongruence with his trembling hands.","xh":"उसके खुशहाल बोल और काँपते हाथ आपस में बेमेल लग रहे थे।","t":"IN + CONGRUENT (मेल खाता): जुता-मोज़ा जैसा मिलन.","note":"","s":[{"en":"There is incongruence in his words and deeds.","hi":"उसके कथन-कर्म में बेमेल है।"}],"loc":"Section 3 · Column 3 · #1","c":"#ef6c00"},{"w":"Incise","hi":"नक्काशी/काटना","en":"cut into","ex":"To cut into a surface with a sharp tool, making clean lines — incise a design into stone, incise a wound surgically. Formal verb; noun: incision.","xs":"The sculptor incised the king's name deep into the granite.","xh":"मूर्तिकार ने राजा का नाम ग्रेनाइट में गहरा उत्कीर्ण किया।","t":"IN + SCISSORS: अंदर से कैंची चलाना.","note":"","s":[{"en":"Artists incised patterns on stone.","hi":"कारीगरों ने पत्थर पर नक्काशी की।"}],"loc":"Section 3 · Column 3 · #1","c":"#3949ab"},{"w":"Chary","hi":"सतर्क, संकोच करने वाला","en":"cautiously reluctant","ex":"Cautiously careful and unwilling to take risks — chary of strangers, chary of lending money; unwilling because of suspicion. Formal adjective.","xs":"After the fraud, he grew chary of every phone offer.","xh":"धोखे के बाद वह हर फ़ोन ऑफ़र से सावधान हो गया।","t":"CHARY ≈ \"चैरी (चेरी)\" — कीचड़ से बचकर उठाना.","note":"","s":[{"en":"Be chary of too-good offers.","hi":"बहुत आकर्षक प्रस्तावों से सावधान रहो।"}],"loc":"Section 3 · Column 3 · #1","c":"#c62828"},{"w":"Fervent","hi":"तपस्वी जुनून वाला","en":"burning with passion","ex":"Showing very strong, burning feeling — fervent hope, fervent prayer, a fervent supporter. Adjective; noun: fervour.","xs":"The fans gave a fervent welcome to their returning team.","xh":"प्रशंसकों ने लौटती टीम का उत्साहपूर्ण, दिल से उठा स्वागत किया।","t":"FERVour = ताप — भीतर की आग.","note":"","s":[{"en":"A fervent fan waited hours.","hi":"दीवाना प्रशंसक घंटों इंतज़ार करता रहा।"}],"loc":"Section 3 · Column 3 · #1","c":"#2e7d32"},{"w":"Morose","hi":"रीझा, मुँहफट","en":"gloomy and silent","ex":"Sullen, gloomy and bad-tempered; silent and ill-humoured — a morose old man who never smiles. Adjective.","xs":"Losing the final match left the captain morose for days.","xh":"फ़ाइनल हार के बाद कप्तान कई दिनों तक चिड़चिड़ा और खिन्न रहा।","t":"MOROSE ≈ \"मोर-उदास\": मोर भी उदास दिखे जैसा.","note":"","s":[{"en":"He turned morose after the setback.","hi":"झटके के बाद वह रीझ गया।"}],"loc":"Section 3 · Column 3 · #1","c":"#6d4c41"},{"w":"Jocund","hi":"हँसमुख, विनोदी","en":"cheerful, merry","ex":"Cheerful and lighthearted; full of merry good humour — a jocund group of friends, jocund laughter. Literary adjective (famous from Wordsworth's 'Daffodils').","xs":"The jocund boys whistled their way home from school.","xh":"खुशमिज़ाज लड़के स्कूल से लौटते हुए सीटियाँ बजाते रहे।","t":"JOKE + UND: हर बात में जोक!","note":"","s":[{"en":"The jocund poet made us smile.","hi":"विनोदी कवि ने हमें हँसाया।"}],"loc":"Section 3 · Column 3 · #1","c":"#e63980"},{"w":"Prosodic","hi":"छंद/लय संबंधी","en":"relating to rhythm in language","ex":"Relating to prosody — the rhythm, stress and intonation patterns of speech or verse; how a poem or sentence sounds when spoken. Technical adjective; noun: prosody.","xs":"Reading aloud teaches the prosodic music of Shakespeare's lines.","xh":"ज़ोर से पढ़ने से शेक्सपियर की पंक्तियों की लय और संगीत समझ आता है।","t":"PROSE + ODE का संगम — छंदोबद्ध लय.","note":"","s":[{"en":"Prosodic patterns shape poetry.","hi":"लयबद्ध ढंग कविता को रूप देते हैं।"}],"loc":"Section 3 · Column 3 · #1","c":"#7c4dff"},{"w":"Auspice","hi":"शुभ संकेत/संरक्षण","en":"favourable sign; protection","ex":"A sign or omen of what will happen — historically, bird-flight read by Roman priests; modern pattern: 'under the auspices of' = with the approval, support or protection of an organization. Noun.","xs":"The science fair was held under the auspices of the district council.","xh":"विज्ञान प्रदर्शनी ज़िला परिषद के संरक्षण में आयोजित हुई।","t":"ऑगर (पक्षियों से शकुन देखने वाला) पक्षी उड़ान देखे = auspice.","note":"","s":[{"en":"The event began under good auspices.","hi":"शुभ संकेतों के साथ कार्यक्रम शुरू हुआ।"}],"loc":"Section 3 · Column 3 · #1","c":"#00897b"},{"w":"Ordain","hi":"विधिवत् आदेश/नियुक्त करना","en":"decree; officially appoint","ex":"To officially make someone a priest or religious minister; to order or decree something by authority; (of fate/God) to destine — 'it was ordained that they would meet'. Verb.","xs":"He was ordained as a priest after twelve years of training.","xh":"बारह साल की तालीम के बाद उसे पुजारी पद पर नियुक्त किया गया।","t":"ORDER + IN: हुक्म \"अंदर\" उतार देना.","note":"","s":[{"en":"He was ordained a priest.","hi":"उसे पुरोहित पद दिया गया।"}],"loc":"Section 3 · Column 3 · #1","c":"#ef6c00"},{"w":"Hefty","hi":"भारी-भरकम","en":"large and heavy","ex":"Large, heavy and powerful — a hefty man, a hefty fine, a hefty bill; imposing in size or amount. Informal adjective.","xs":"He carried the hefty sack of cement up the stairs alone.","xh":"उसने सीमेंट की भारी बोरी अकेले ही सीढ़ियाँ चढ़ा दी।","t":"हेफ्टी बैग — उठाने में दम लगे.","note":"","s":[{"en":"A hefty fine was imposed.","hi":"भारी जुर्माना लगाया गया।"}],"loc":"Section 3 · Column 3 · #1","c":"#3949ab"},{"w":"Gladden","hi":"हर्षित करना","en":"make happy","ex":"To make someone glad; to bring joy — 'my heart gladdens at the news'; also to become cheerful. Verb (opposite: sadden).","xs":"The sight of the full harvest gladdened every farmer's heart.","xh":"पूरी फ़सल के दर्शन ने हर किसान का हृदय हर्ष से भर दिया।","t":"GLAD + DEN: खुशी की घाटी.","note":"","s":[{"en":"Your letter gladdened my heart.","hi":"तुम्हारे पत्र ने मन हर्षित किया।"}],"loc":"Section 3 · Column 3 · #1","c":"#c62828"},{"w":"Omen","hi":"शकुन/अपशकुन","en":"sign of what will happen","ex":"An event believed to be a sign of good or evil to come — a crow cawing, a black cat, a rainbow; 'an omen of success' or 'a bad omen'. Noun; adjective: ominous.","xs":"The sudden rainbow was taken as a good omen for the wedding.","xh":"अचानक दिखा इंद्रधनुष शादी के लिए शुभ संकेत माना गया।","t":"उल्लू की डाक = अशुभ OMEN.","note":"","s":[{"en":"The black cat is seen as a bad omen.","hi":"काली बिल्ली को अपशकुन माना जाता है।"}],"loc":"Section 3 · Column 3 · #1","c":"#2e7d32"},{"w":"Apparel","hi":"पोशाक","en":"clothing","ex":"Clothes, especially of a particular kind or for a particular purpose — sports apparel, winter apparel. A somewhat formal or commercial noun for clothing.","xs":"The new store sells branded sports apparel for cricketers.","xh":"नई दुकान क्रिकेटरों के लिए ब्रांडेड खेल-पोशाकें बेचती है।","t":"APPAREL store = कपड़ों की दुकान.","note":"","s":[{"en":"Festive apparel filled the shop.","hi":"दुकान उत्सव की पोशाकों से भरी थी।"}],"loc":"Section 3 · Column 3 · #1","c":"#6d4c41"},{"w":"Vice","hi":"दुर्व्यसन","en":"immoral bad habit","ex":"Immoral or wicked behaviour and habits — gambling, lying; a moral fault or weakness in character; a bad practice ('smoking is my only vice'); also a secondary officer (vice-captain). Noun (opposite: virtue).","xs":"Lying had become such a vice with him that friends stopped trusting him.","xh":"झूठ उसकी इतनी बुरी आदत बन गया था कि दोस्तों ने भरोसा करना छोड़ दिया।","t":"VISA-card नहीं — VICE squad = बुराई विभाग.","note":"","s":[{"en":"Gambling is a vice.","hi":"जुआ एक दुर्व्यसन है।"}],"loc":"Section 3 · Column 3 · #1","c":"#e63980"},{"w":"Stifling","hi":"दमघोंटू","en":"suffocating, oppressive","ex":"So hot, airless and close that breathing feels difficult — a stifling afternoon; also suppressing or choking free action or speech — stifling rules, a stifling regime. Adjective; verb: stifle.","xs":"The stifling heat in the packed bus made everyone irritable.","xh":"भरी बस की घुटन भरी गर्मी ने सबको चिड़चिड़ा कर दिया।","t":"STIFLE = दम रोकना — बंद कमरे की गर्मी.","note":"","s":[{"en":"The stifling heat exhausted us.","hi":"दमघोंटू गर्मी ने हमें थका दिया।"}],"loc":"Section 3 · Column 3 · #1","c":"#7c4dff"},{"w":"Aplomb","hi":"आत्मविश्वास भरा संयम","en":"calm confidence","ex":"Self-confident calm and sureness, especially in a difficult situation — answered with aplomb; poise under pressure. Noun.","xs":"The young anchor handled the live telecast glitch with aplomb.","xh":"युवा एंकर ने लाइव प्रसारण की तकनीकी गड़बड़ को पूरे आत्मविश्वास से सँभाला।","t":"\"A-PLUMB\": प्लंब-लाइन जैसा सीधा-संतुलित.","note":"","s":[{"en":"She answered with great aplomb.","hi":"उसने बड़े आत्मविश्वास से उत्तर दिया।"}],"loc":"Section 3 · Column 3 · #1","c":"#00897b"},{"w":"Unkempt","hi":"बेढंगा","en":"untidy hair/clothes","ex":"Not neat or cared for; messy in appearance — unkempt hair, an unkempt garden, an unkempt beard. Adjective.","xs":"After weeks of illness, his hair and beard were unkempt.","xh":"हफ़्तों की बीमारी के बाद उसके बाल और दाढ़ी बेढंगी थीं।","t":"UN + KEMPT (सँवरा हुआ): कंघी न की हुई.","note":"","s":[{"en":"His unkempt beard shocked mother.","hi":"उसकी बेढंगी दाढ़ी से माँ चौंकी।"}],"loc":"Section 3 · Column 3 · #1","c":"#ef6c00"},{"w":"Chimerical","hi":"हवाई कल्पना जैसा","en":"wildly imaginary, unrealistic","ex":"Wildly fanciful and imaginary; existing only in the mind like a chimera (a mythical monster) — chimerical schemes that can never come true. Literary adjective.","xs":"His chimerical dream of building a palace on the moon made everyone laugh.","xh":"चाँद पर महल बनाने का उसका ख़याली पुलाऊ सपना सबको हँसा देता था।","t":"CHIMERA — सिंह+बकरी+साँप वाली पौराणिक काल्पनिक प्राणी.","note":"","s":[{"en":"Chimerical schemes waste money.","hi":"हवाई योजनाएँ धन बर्बाद करती हैं।"}],"loc":"Section 3 · Column 3 · #1","c":"#3949ab"},{"w":"Cherubic","hi":"फ़रिश्ता सा","en":"angelically sweet-faced","ex":"Sweet, innocent and angelically pretty, like a cherub — a baby's cherubic face, cherubic smile. Adjective.","xs":"The cherubic baby giggled in her mother's lap.","xh":"फ़रिश्तों जैसा मासूम शिशु माँ की गोद में खिलखिलाया।","t":"CHERUB = नन्हा फ़रिश्ता.","note":"","s":[{"en":"The cherubic baby slept peacefully.","hi":"फ़रिश्ता सा शिशु सो रहा था।"}],"loc":"Section 3 · Column 3 · #1","c":"#c62828"},{"w":"Sabbatical","hi":"अध्ययन अवकाश","en":"extended leave for study/rest","ex":"A long paid or unpaid leave from work, usually every few years, for study, travel or rest — a professor's sabbatical year. Noun/adjective.","xs":"She took a six-month sabbatical to write her book.","xh":"किताब लिखने के लिए वह छह महीने के अवकाश पर गई।","t":"SABBATH (विश्राम-दिन) से — लंबा आराम-अवकाश.","note":"","s":[{"en":"Prof. Rao took a sabbatical year.","hi":"राव साहब ने एक वर्ष का अवकाश लिया।"}],"loc":"Section 3 · Column 3 · #1","c":"#2e7d32"},{"w":"Fret","hi":"चिंतित होना","en":"worry constantly","ex":"To worry continuously about small things; to feel or show anxiety — don't fret over trifles; also to wear away by rubbing (metal frets on wood). Verb/noun.","xs":"The mother fretted all night while her son travelled in the storm.","xh":"बेटे के तूफ़ान में सफ़र करते रहने पर माँ रात भर चिंतित रही।","t":"FRET ≈ \"फिरेट\": चिंता में फेरे लगाना.","note":"","s":[{"en":"Don't fret over small things.","hi":"छोटी बातों पर मत तनाव लो।"}],"loc":"Section 3 · Column 3 · #1","c":"#6d4c41"},{"w":"Arteriole","hi":"सूक्ष्म धमनी","en":"tiny artery branch","ex":"A very small branch of an artery that carries blood from arteries into the tiniest vessels, the capillaries. Technical anatomy noun.","xs":"High blood pressure first damages the delicate arterioles of the kidneys.","xh":"हाई ब्लड प्रेशर सबसे पहले गुर्दों की बारीक धमनियों को नुक़सान पहुँचाता है।","t":"ARTERY का \"छोटा भाई\" (-ole = छोटा).","note":"","s":[{"en":"Arterioles control blood flow.","hi":"सूक्ष्म धमनियाँ रक्त-प्रवाह नियंत्रित करती हैं।"}],"loc":"Section 3 · Column 3 · #1","c":"#e63980"},{"w":"Torment","hi":"यंत्रणा","en":"severe suffering; torture","ex":"Severe physical or mental suffering; to cause such suffering by cruelty or teasing — tormented by guilt, tormenting a classmate. Noun/verb.","xs":"The constant bullying became a daily torment for the shy boy.","xh":"लगातार रैगिंग शर्मीले लड़के के लिए रोज़ की यातना बन गई थी।","t":"TORMENT ≈ तड़प — मन या शरीर की पीड़ा.","note":"","s":[{"en":"Mosquitoes tormented us all night.","hi":"मच्छरों ने रात भर यंत्रणा दी।"}],"loc":"Section 3 · Column 3 · #1","c":"#7c4dff"},{"w":"Pursuit","hi":"पीछा / शौक","en":"chasing; favourite activity","ex":"The act of chasing someone or something — the pursuit of the thief; an activity one devotes time to — outdoor pursuits; the effort to achieve a goal — the pursuit of happiness. Noun.","xs":"The police gave up their pursuit when the thief jumped into the canal.","xh":"चोर नहर में छलाँग लगाते ही पुलिस ने पीछा छोड़ दिया।","t":"PURSUE से — किसी के पीछे-पीछे.","note":"","s":[{"en":"Police chased him in hot pursuit.","hi":"पुलिस ने ताबड़तोड़ पीछा किया।"}],"loc":"Section 3 · Column 3 · #1","c":"#00897b"},{"w":"Renitent","hi":"ज़िद्दी विरोधी","en":"stubbornly resistant","ex":"Resisting pressure or force; pushing back against what presses on it; stubbornly opposed. A rare, formal adjective.","xs":"The renitent witness refused to change his statement despite pressure.","xh":"दबाव के बावजूद अडिग गवाह ने अपना बयान बदलने से मना कर दिया।","t":"RE-NIT: बार-बार (RE) नाकारने वाला.","note":"","s":[{"en":"The renitent horse refused the bridge.","hi":"ज़िद्दी घोड़े ने पुल ठुकरा दिया।"}],"loc":"Section 3 · Column 3 · #1","c":"#ef6c00"},{"w":"Despotic","hi":"निरंकुश","en":"ruling like a tyrant","ex":"Ruling like a despot — with absolute, uncontrolled and often cruel power — a despotic king, despotic rule; behaving like a tyrant. Adjective; noun: despot, despotism.","xs":"The despotic ruler jailed anyone who criticized him.","xh":"निरंकुश शासक ने जो भी उसकी आलोचना की, उसे जेल में डाल दिया।","t":"DESPOT = तानाशाह — \"मेरी हुकूमत, मेरी मर्ज़ी\".","note":"","s":[{"en":"The despotic king crushed dissent.","hi":"निरंकुश राजा ने विरोध कुचल दिया।"}],"loc":"Section 3 · Column 4 · #1","c":"#3949ab"},{"w":"Phoneme","hi":"स्वनिम","en":"smallest unit of sound in language","ex":"The smallest unit of sound in a language that can change meaning — 'bat' vs 'pat' differ by one phoneme. Technical linguistics noun.","xs":"English has about forty-four phonemes but only twenty-six letters.","xh":"अंग्रेज़ी में लगभग चौंतालीस ध्वनियाँ (फ़ोनीम) हैं, पर अक्षर सिर्फ़ छब्बीस।","t":"PHONE + ME: फ़ोन पर सबसे छोटी सुनाई देने वाली इकाई.","note":"","s":[{"en":"\"P\" and \"B\" are different phonemes.","hi":"\"प\" और \"ब\" अलग स्वनिम हैं।"}],"loc":"Section 3 · Column 4 · #1","c":"#c62828"},{"w":"Panache","hi":"बाँकपन, शैली","en":"flamboyant confidence","ex":"A stylish, confident and flamboyant manner; doing things with flair and dash — performed with panache. Noun.","xs":"She wore her grandfather's old jacket with tremendous panache.","xh":"उसने दादा की पुरानी जैकेट बड़े ही ठाठ-अंदाज़ से पहनी।","t":"French \"पैनाचे\" — रोहित शर्मा का पुल-शॉट = panache.","note":"","s":[{"en":"She danced with panache.","hi":"उसने शानदार शैली से नृत्य किया।"}],"loc":"Section 3 · Column 4 · #1","c":"#2e7d32"},{"w":"Oblivion","hi":"विस्मृति","en":"total forgetfulness","ex":"The state of being completely forgotten — a writer rescued from oblivion; also unconsciousness or total unawareness — sank into oblivion after the fall. Noun.","xs":"Time had buried the fort's name in oblivion until the stone inscription surfaced.","xh":"पत्थर का लेख सामने आने तक समय ने क़िले के नाम को भुला दिया था।","t":"OBLIVIATE (हैरी पॉटर का भुला-देने वाला जादू).","note":"","s":[{"en":"The village fell into oblivion.","hi":"गाँव विस्मृति में खो गया।"}],"loc":"Section 3 · Column 4 · #1","c":"#6d4c41"},{"w":"Poke","hi":"भोंचना","en":"prod with a finger/point","ex":"To jab or prod someone or something with a finger, stick or pointed object — poke the fire, poke someone in the ribs; to push out or appear — the elbow poked through the torn sleeve. Verb/noun.","xs":"He poked the campfire with a stick to wake the flames.","xh":"उसने लकड़ी से आग को छेड़कर जलाया।","t":"FACEBOOK का \"POKE\" = हल्का भोंचना.","note":"","s":[{"en":"He poked the fire to revive it.","hi":"उसने आग भोंचकर जगाई।"}],"loc":"Section 3 · Column 4 · #1","c":"#e63980"},{"w":"Unheedful","hi":"अवहेलनकारी","en":"not paying attention","ex":"Not paying attention; ignoring warnings or advice — unheedful of the alarm bells. A literary adjective; related: heedless, unheeding.","xs":"Unheedful of the doctor's advice, he kept smoking.","xh":"डॉक्टर की सलाह की अनसुनी करते हुए वह धूम्रपान जारी रखे रहा।","t":"UN + HEED (ध्यान): कान बंद.","note":"","s":[{"en":"Unheedful of warnings, he went ahead.","hi":"चेतावनी न सुनते हुए वह आगे बढ़ा।"}],"loc":"Section 3 · Column 4 · #1","c":"#7c4dff"},{"w":"Pompous","hi":"आडंबरी","en":"self-important, grandiose","ex":"Thinking and behaving as if you are very important; using grand words and a swollen manner — a pompous speech, a pompous official. Adjective; noun: pomposity.","xs":"The pompous inspector loved quoting rules nobody cared about.","xh":"आडंबरपूर्ण निरीक्षक को ऐसे नियम उद्धृत करना भाता था जिन्हें कोई परवाह नहीं करता था।","t":"POMP (शान-दिखावा) + OUS.","note":"","s":[{"en":"The pompous manager loved long speeches.","hi":"आडंबरी मैनेजर लंबे भाषण पसंद करता था।"}],"loc":"Section 3 · Column 4 · #1","c":"#00897b"},{"w":"Substantiated","hi":"प्रमाणों से सिद्ध","en":"backed by evidence","ex":"Proved or supported with solid evidence — a substantiated claim, substantiated by documents. Adjective/past verb; verb: substantiate.","xs":"Only one of the five complaints was substantiated by the inquiry.","xh":"जाँच में पाँच शिकायतों में से केवल एक ही सबूतों से सिद्ध हुई।","t":"SUBSTANCE (ठोस सामग्री) से — ठोस सबूत के साथ.","note":"","s":[{"en":"Claims were substantiated by data.","hi":"दावे आँकड़ों से सिद्ध हुए।"}],"loc":"Section 3 · Column 4 · #1","c":"#ef6c00"},{"w":"Makeshift","hi":"जुगाड़ (अस्थायी)","en":"temporary substitute","ex":"A temporary substitute used until the proper thing is available — a makeshift bed of chairs, a makeshift clinic in a school. Adjective/noun.","xs":"Refugees slept on makeshift beds made of cardboard sheets.","xh":"शरणार्थी कार्डबोर्ड की बनी अस्थायी चारपाइयों पर सोए।","t":"MAKE + SHIFT: बस \"काम चलाऊ\" बना दिया.","note":"","s":[{"en":"They slept on a makeshift bed.","hi":"वे जुगाड़ से बने बिस्तर पर सोए।"}],"loc":"Section 3 · Column 4 · #1","c":"#3949ab"},{"w":"Grumpy","hi":"चिड़चिड़ा","en":"bad-tempered, sulky","ex":"Bad-tempered and irritable, especially in a small, everyday way — grumpy in the morning, a grumpy old man. Informal adjective.","xs":"Nobody talks to Dad before his morning tea — he's too grumpy.","xh":"सुबह की चाय से पहले कोई पापा से बात नहीं करता — वह बहुत चिड़चिड़े रहते हैं।","t":"\"गुरगुराता\" (grumble) करता बूढ़ा.","note":"","s":[{"en":"The grumpy guard shouted at kids.","hi":"चिड़चिड़ा चौकीदार बच्चों पर चिल्लाया।"}],"loc":"Section 3 · Column 4 · #1","c":"#c62828"},{"w":"Inquisitiveness","hi":"जिज्ञासा","en":"eagerness to learn/ask","ex":"Eager curiosity; a strong desire to know or learn — the inquisitiveness of a child asking 'why' a hundred times. Noun; adjective: inquisitive.","xs":"Her inquisitiveness about stars led her to become an astronomer.","xh":"तारों के प्रति उसकी जिज्ञासा ने उसे खगोलविद बना दिया।","t":"INQUIRY + NESS: सवालों की भूख.","note":"","s":[{"en":"A child's inquisitiveness is a gift.","hi":"बच्चे की जिज्ञासा एक वरदान है।"}],"loc":"Section 3 · Column 4 · #1","c":"#2e7d32"},{"w":"Apprehension","hi":"आशंका","en":"anxiety about the future; (also: arrest)","ex":"Anxiety or fear about something that may happen — a feeling of apprehension before results; also the act of catching an offender (police apprehension); and understanding — 'quick apprehension'. Noun.","xs":"She waited for the interview call with rising apprehension.","xh":"वह इंटरव्यू कॉल का इंतज़ार बढ़ती बेचैनी के साथ कर रही थी।","t":"PRE-HEND = पहले से \"पकड़\" लेना — बुरा डर.","note":"","s":[{"en":"She waited with apprehension for results.","hi":"वह नतीजों की आशंका से बैठी थी।"}],"loc":"Section 3 · Column 4 · #1","c":"#6d4c41"},{"w":"Recusation","hi":"आत्म-अलगाव (कोर्ट में)","en":"a judge stepping aside from a case (recusal)","ex":"The act of a judge or official stepping aside from a case because of possible bias or conflict of interest; a formal objection to such a person. Legal, technical noun; related: recuse.","xs":"The lawyer sought the judge's recusation, citing old ties to the accused.","xh":"वकील ने आरोपी से पुराने रिश्ते का हवाला देते हुए जज के हटने की माँग की।","t":"RE-CUSE (\"excuse\") — \"मैं excuse करता हूँ, इस केस से हटता हूँ.\"","note":"","s":[{"en":"The judge filed for recusation.","hi":"न्यायाधीश ने मामले से खुद को अलग किया।"}],"loc":"Section 3 · Column 4 · #1","c":"#e63980"},{"w":"Quell","hi":"दबा देना","en":"crush, put down","ex":"To put an end to something violent by force — quell a riot, quell the uprising; to calm a feeling — quell one's fears. Formal verb.","xs":"Rapid police action quelled the campus riot before nightfall.","xh":"पुलिस की तेज़ कार्रवाई ने शाम होने से पहले ही कैंपस की दंगे-फ़साद को दबा दिया।","t":"\"क्वेल\" = जेल (जैसे दबा देना).","note":"","s":[{"en":"Police quelled the riot.","hi":"पुलिस ने दंगा दबा दिया।"}],"loc":"Section 3 · Column 4 · #1","c":"#7c4dff"},{"w":"Motifs","hi":"आवर्ती प्रतीक/रूपक","en":"recurring theme or design","ex":"Recurring designs, images or themes in art, literature or music — the rose motif in poetry, a paisley motif on cloth. Plural of motif.","xs":"The film repeats water motifs to suggest memory and loss.","xh":"फ़िल्म में पानी की छवियाँ बार-बार आती हैं, जो स्मृति और विरह दर्शाती हैं।","t":"MOTIF = मोटिफ़ (कढ़ाई का बार-बार आने वाला फूल).","note":"","s":[{"en":"The lotus motif recurs in his poems.","hi":"उसकी कविताओं में कमल-प्रतीक बार-बार आता है।"}],"loc":"Section 3 · Column 4 · #1","c":"#00897b"},{"w":"Manacle","hi":"हथ-बेड़ी","en":"handcuff","ex":"A metal ring and chain for binding a prisoner's wrists or ankles — usually in pairs, 'manacles'; figuratively, anything that chains the mind — manacles of superstition. Noun/verb.","xs":"The prisoner's manacles clanked as he walked to the van.","xh":"वैन तक चलते समय क़ैदी की बेड़ियाँ खनकती रहीं।","t":"MAN (हाथ) + ACLE: हाथ की बेड़ी.","note":"","s":[{"en":"The thief's hands were in manacles.","hi":"चोर के हाथ बेड़ी में थे।"}],"loc":"Section 3 · Column 4 · #1","c":"#ef6c00"},{"w":"Gridlock","hi":"पूर्ण जाम/गतिरोध","en":"total standstill","ex":"A traffic jam so complete that vehicles cannot move in any direction; figuratively, a total deadlock in negotiations or government — budget gridlock. Noun.","xs":"Heavy rain left the city centre in total gridlock.","xh":"भारी बारिश से शहर के केंद्र में यातायात पूरी तरह ठप हो गया।","t":"GRID (सड़क-जाल) + LOCK: सारे रास्ते ताले में.","note":"","s":[{"en":"Rain caused gridlock in Delhi.","hi":"बारिश ने दिल्ली में पूरा जाम किया।"}],"loc":"Section 3 · Column 4 · #1","c":"#3949ab"},{"w":"Viable","hi":"व्यवहार्य","en":"capable of working/surviving","ex":"Able to work successfully; practical and capable of surviving — a viable business plan; (of a fetus) able to live outside the womb. Adjective.","xs":"Only a shop near a busy road is commercially viable here.","xh":"यहाँ व्यावसायिक रूप से चलने योग्य दुकान सिर्फ़ व्यस्त सड़क के पास ही हो सकती है।","t":"VIE (जीना) + ABLE: जीने-टिकने योग्य.","note":"","s":[{"en":"Is the startup financially viable?","hi":"क्या स्टार्टअप आर्थिक रूप से टिक सकता है?"}],"loc":"Section 3 · Column 4 · #1","c":"#c62828"},{"w":"Kernel","hi":"गिरी, मूल सार","en":"the core essence","ex":"The edible seed inside a nut or the soft part of a grain — a kernel of corn; the core or most important part of an idea — the kernel of truth in every rumour; the central program of an operating system. Noun.","xs":"Every rumour carries a kernel of truth buried under exaggeration.","xh":"हर अफ़वाह में बढ़ा-चढ़ाए बयानों के नीचे सच का एक दाना छिपा होता है।","t":"कोकोनट का KERNEL (अंदर की गिरी).","note":"","s":[{"en":"There is truth in the kernel of his story.","hi":"उसकी कहानी की गिरी में सच है।"}],"loc":"Section 3 · Column 4 · #1","c":"#2e7d32"},{"w":"Droopy","hi":"लटकता हुआ","en":"hanging loosely","ex":"Hanging down limply; sagging from tiredness or weakness — droopy eyes after a sleepless night, a droopy plant. Informal adjective.","xs":"The pup's droopy ears made everyone want to cuddle it.","xh":"पिल्ला के झूलते कानों ने सबको उसे गले लगाने पर मजबूर कर दिया।","t":"थके कुत्ते के द्रोपी कान.","note":"","s":[{"en":"Droopy eyelids betrayed his sleepiness.","hi":"झुके पलकों ने नींद बता दी।"}],"loc":"Section 3 · Column 4 · #1","c":"#6d4c41"},{"w":"Mundane","hi":"रोज़मर्रा का, नीरस","en":"ordinary, worldly","ex":"Ordinary and dull; belonging to everyday life rather than the spiritual or extraordinary — mundane chores like washing dishes. Adjective.","xs":"He finds joy in mundane routines — morning chai, evening walks.","xh":"उसे रोज़मर्रा के कामों में ही ख़ुशी मिलती है — सुबह की चाय, शाम की सैर।","t":"MONDAY + NE: सोमवार जैसा फीका दिन.","note":"","s":[{"en":"Mundane chores eat up weekends.","hi":"रोज़मर्रा के काम छुट्टी खा जाते हैं।"}],"loc":"Section 3 · Column 4 · #1","c":"#e63980"},{"w":"Vitiate","hi":"बिगाड़ देना","en":"spoil, corrupt, invalidate","ex":"To spoil, weaken or corrupt something, making it defective or invalid — an error vitiated the experiment; a contract vitiated by fraud. Formal verb; noun: vitiation.","xs":"Bias vitiated the survey's results from the very first question.","xh":"पहले ही सवाल से पक्षपात ने सर्वे के नतीजों को बिगाड़ दिया।","t":"VICE से — दूषित करना; \"विटामिन\" नहीं, दुषितमिन!","note":"","s":[{"en":"Bias vitiates a fair trial.","hi":"पक्षपात निष्पक्ष मुक़दमे को बिगाड़ देता है।"}],"loc":"Section 3 · Column 4 · #1","c":"#7c4dff"},{"w":"Scantily","hi":"थोड़े-थोड़े से","en":"barely, insufficiently","ex":"In a way that provides less than is needed or expected; barely — a room scantily furnished; scantily clad means wearing very little clothing. Adverb; adjective: scanty.","xs":"The mountain hut was scantily stocked for the long winter.","xh":"पहाड़ की झोपड़ी में लंबी सर्दी के लिए बहुत थोड़ा सामान था।","t":"SCANT (नगण्य) + LY.","note":"","s":[{"en":"The room was scantily furnished.","hi":"कमरा कम फर्नीचर वाला था।"}],"loc":"Section 3 · Column 4 · #1","c":"#00897b"},{"w":"Gauge","hi":"मापना","en":"measure, judge","ex":"To measure or judge something — gauge the temperature, gauge public mood; an instrument that measures (a pressure gauge, fuel gauge); a standard measure of thickness or width (railway gauge). Verb/noun.","xs":"The teacher quickly gauged which students needed extra help.","xh":"शिक्षक ने तुरंत परख लिया कि किन छात्रों को अतिरिक्त मदद चाहिए।","t":"पेट्रोल का fuel GAUGE.","note":"","s":[{"en":"Gauge his mood before you speak.","hi":"बोलने से पहले उसका मूड माप लो।"}],"loc":"Section 3 · Column 4 · #1","c":"#ef6c00"},{"w":"Candour","hi":"खरी-खोटी खुली बात","en":"frank honesty","ex":"The quality of speaking honestly and openly, even when the truth is uncomfortable — 'I appreciate your candour'. British spelling (American: candor). Noun; adjective: candid.","xs":"The CEO won trust by speaking with unusual candour about the losses.","xh":"प्रमुख कार्यकारी अधिकारी ने नुक़सान के बारे में असाधारण खुलेआम बात करके भरोसा जीता।","t":"CANDID से — खुला-खुला बोलना.","note":"","s":[{"en":"I appreciate your candour.","hi":"मैं आपकी सच्चाई की कद्र करता हूँ।"}],"loc":"Section 3 · Column 4 · #1","c":"#3949ab"},{"w":"Reckon","hi":"गिनना/समझना","en":"calculate; consider","ex":"To calculate or count — reckon the cost; to think or suppose — 'I reckon it will rain'; to include in a count — reckon him among the greats. Verb.","xs":"I reckon the journey will take about five hours by train.","xh":"मेरा अनुमान है कि ट्रेन से सफ़र में पाँच घंटे लगेंगे।","t":"\"रेकन\" = काउंट करना — \"I reckon\" = मेरा हिसाब है.","note":"","s":[{"en":"I reckon it will rain today.","hi":"मेरा अनुमान है कि आज बारिश होगी।"}],"loc":"Section 3 · Column 4 · #1","c":"#c62828"},{"w":"Disenchantment","hi":"मोहभंग","en":"loss of illusions","ex":"Loss of the faith, hope or enthusiasm one once had; bitter disappointment after discovering things are not as good as believed — growing disenchantment with politics. Noun; verb: disenchant.","xs":"Repeated broken promises bred disenchantment among the voters.","xh":"बार-बार टूटे वादों ने मतदाताओं में मोहभंग कर दिया।","t":"DIS + ENCHANT (जादू): जादू टूट जाना.","note":"","s":[{"en":"Fans felt disenchantment after the scandal.","hi":"घोटाले बाद फैंस का मोहभंग हुआ।"}],"loc":"Section 3 · Column 4 · #1","c":"#2e7d32"},{"w":"Disenchanted","hi":"मोहभंग हुआ","en":"disillusioned","ex":"No longer believing in or enthusiastic about something you once admired or supported; disappointed after losing illusions — disenchanted fans, disenchanted employees. Adjective.","xs":"Disenchanted by the delays, half the volunteers quit the project.","xh":"लगातार देरी से मायूस होकर आधे स्वयंसेवकों ने प्रोजेक्ट छोड़ दिया।","t":"ENCHANTED से निकला हुआ — \"औक़ात में आ गया\".","note":"","s":[{"en":"She is disenchanted with politics.","hi":"राजनीति से उसका मोहभंग हो गया।"}],"loc":"Section 3 · Column 4 · #1","c":"#6d4c41"},{"w":"Stout","hi":"हट्टा-कट्टा / मज़बूत","en":"strong; rather fat (Part 1 #117 देखें)","ex":"Rather fat and heavy-built — a stout old gentleman; also strong, thick and sturdy — stout shoes, stout walls; and brave, determined — a stout heart. Adjective. Also a dark, strong beer.","xs":"The stout old watchman guarded the gate all night with a stout stick.","xh":"मोटा-तंदुरुस्त बूढ़ा चौकीदार मोटी लाठी लिए सारी रात गेट पर पहरा देता रहा।","t":"STOUT बोतल = भरा हुआ-मज़बूत.","note":"","s":[{"en":"A stout fellow lifted the box.","hi":"हट्टा-कट्टा आदमी बक्सा उठा गया।"}],"loc":"Section 4 · Column 1 · #1","c":"#e63980"},{"w":"Brazen","hi":"बेशर्म","en":"bold and shameless","ex":"Bold and shameless, without any attempt to hide wrongdoing — brazen lying, a brazen robbery in daylight; also made of brass. Adjective (also verb: brazen it out).","xs":"The thief walked out of the shop with brazen confidence in front of everyone.","xh":"चोर सबके सामने बेशर्मी भरे आत्मविश्वास से दुकान से बाहर निकल गया।","t":"BRAZE = पीतल (brass): पीतल का चेहरा = नाक नहीं जुकती.","note":"","s":[{"en":"His brazen lie shocked us.","hi":"उसकी बेशर्मी भरी झूठ ने चौंका दिया।"}],"loc":"Section 4 · Column 1 · #1","c":"#7c4dff"},{"w":"Imbecile","hi":"बुद्धू, मूर्ख","en":"very stupid person","ex":"A stupid person; old medical term for a person of very low intelligence — now offensive; as an adjective, idiotic. Noun/adjective.","xs":"Only an imbecile would leave the stove on before leaving town.","xh":"शहर से निकलने से पहले चूल्हा जलता छोड़ना बुद्धू ही का काम है।","t":"\"IM-BE-SILLY\": बेसिली (सिली) इंसान.","note":"","s":[{"en":"Don't act like an imbecile.","hi":"बुद्धू जैसा मत बनो।"}],"loc":"Section 4 · Column 1 · #1","c":"#00897b"},{"w":"Muggy","hi":"उमस भरा","en":"warm and damp (weather)","ex":"Unpleasantly warm and humid, with air so moist that sweating brings no relief — a muggy July afternoon. Informal adjective.","xs":"The muggy weather before the monsoon makes everyone lazy.","xh":"मानसून से पहले की उमस भरी गर्मी सबको सुस्त कर देती है।","t":"MUG की गर्म चाय जैसी हवा — चिपचिपी उमस.","note":"","s":[{"en":"Delhi is muggy in August.","hi":"दिल्ली में अगस्त की उमस होती है।"}],"loc":"Section 4 · Column 1 · #1","c":"#ef6c00"},{"w":"Badger","hi":"परेशान करते रहना","en":"nag repeatedly; (बड़की जानवर)","ex":"To keep asking or nagging someone repeatedly until they give in — badgered by phone calls; also a burrowing mammal with a black-and-white striped face. Verb/noun.","xs":"The children badgered their father for a puppy until he agreed.","xh":"बच्चों ने पिता को इतना तंग किया कि वह पिल्ला लाने को मान गए।","t":"BADGER (जानवर) चिड़ाते रहता है — बार-बार तंग करना.","note":"","s":[{"en":"Don't badger me for sweets!","hi":"मिठाई के लिए तंग मत करो!"}],"loc":"Section 4 · Column 1 · #1","c":"#3949ab"},{"w":"Decadent","hi":"पतनशील / भव्य-आत्ममग्न","en":"morally declining; luxuriously indulgent","ex":"Morally decaying, indulging in pleasure and luxury while standards fall — a decadent empire; also richly pleasurable in food — a decadent chocolate cake. Adjective.","xs":"Critics called the late-Roman court decadent and self-indulgent.","xh":"आलोचकों ने देर रोमन दरबार को पतनोन्मुख और भोग-विलासी कहा।","t":"DECAY से — गिरावट; चॉकलेट \"decadent\" = लग्ज़री में डूबा.","note":"","s":[{"en":"A decadent chocolate cake tempts all.","hi":"मलाईदार चॉकलेट केक सबको लुभाता है।"}],"loc":"Section 4 · Column 1 · #1","c":"#c62828"},{"w":"Enflamed","hi":"भड़का हुआ","en":"set on fire; made angry","ex":"Set on fire or made red and hot; made more angry, excited or inflamed — enflamed passions, enflamed skin around a wound. Adjective/past verb (variant of inflamed); verb: enflame.","xs":"The politician's speech enflamed the crowd's old grievances.","xh":"नेता के भाषण ने भीड़ की पुरानी फरियादों की आग भड़का दी।","t":"FLAME में डाल देना.","note":"","s":[{"en":"The speech enflamed the crowd.","hi":"भाषण ने भीड़ भड़का दी।"}],"loc":"Section 4 · Column 1 · #1","c":"#2e7d32"},{"w":"Obscurity","hi":"अंधकार, अज्ञातता","en":"darkness; being unknown","ex":"The state of being unknown or little noticed — a poet who died in obscurity; something hard to understand — obscurity of meaning; darkness. Noun; adjective: obscure.","xs":"The singer spent years in obscurity before her first hit.","xh":"पहली हिट से पहले गायिका वर्षों तक अनजानी रही।","t":"OB + SCURE (ढकना): ढका हुआ = छाया/अज्ञात.","note":"","s":[{"en":"He rose from obscurity to fame.","hi":"वह अनजाने से शोहरत तक पहुँचा।"}],"loc":"Section 4 · Column 1 · #1","c":"#6d4c41"},{"w":"Copious","hi":"बहुतायत में","en":"abundant, plentiful","ex":"Existing or produced in large amounts; plentiful and abundant — copious notes, copious tears, copious rainfall. Formal adjective.","xs":"She took copious notes during the three-hour seminar.","xh":"तीन घंटे के सेमिनार के दौरान उसने बहुत विस्तृत नोट्स लिए।","t":"COPY की ढेर-सारी प्रतियाँ = भरपूर.","note":"","s":[{"en":"She took copious notes.","hi":"उसने खूब नोट्स बनाए।"}],"loc":"Section 4 · Column 1 · #1","c":"#e63980"},{"w":"Hail","hi":"ओलावृष्टि / देश-व्यापी स्वागत","en":"ice pellets; to greet loudly","ex":"Frozen raindrops that fall as small hard balls of ice — a hailstorm; to greet or call out — hail a taxi, hail a hero; to come from — 'she hails from Jaipur'. Noun/verb.","xs":"Hailstones the size of marbles battered the mango orchard.","xh":"कंचे जितने बड़े ओलों ने आम के बाग को खूब पीटा।","t":"आसमान से ओले (hail) गिरें या \"राजा की हो!\" नारा.","note":"","s":[{"en":"Hail stones damaged the crops.","hi":"ओलों ने फसल बर्बाद की।"}],"loc":"Section 4 · Column 1 · #1","c":"#7c4dff"},{"w":"Broody","hi":"चिंतनशील / अंडे सेने वाली","en":"deep in gloomy thought","ex":"Quietly thinking a lot, often with a gloomy or serious air — a broody silence; of a hen: ready to sit on eggs; of a person: wanting a baby. Adjective.","xs":"He sat in a broody silence all evening after the argument.","xh":"बहस के बाद वह पूरी शाम उदास ख़यालों में डूबा चुप बैठा रहा।","t":"BROOD (गहरी गड़बड़ सोच) + Y — माँ मुर्गी जैसा घुटन भरा चेहरा.","note":"","s":[{"en":"He sat broody in the corner.","hi":"वह कोने में निराश विचारों में बैठा था।"}],"loc":"Section 4 · Column 1 · #1","c":"#00897b"},{"w":"Enumerate","hi":"गिनकर बताना","en":"list one by one","ex":"To name things one by one; to count off or list item by item — enumerate the reasons. Formal verb; noun: enumeration.","xs":"The report enumerates twelve reasons for the project's failure.","xh":"रिपोर्ट प्रोजेक्ट की असफलता के बारह कारणों की सूची बनाती है।","t":"COUCH पर पालथी मारकर.","note":"","s":[{"en":"Enumerate your reasons clearly.","hi":"अपने कारण गिनाकर स्पष्ट बताओ।"},{"en":"The tiger crouched in the grass.","hi":"बाघ घास में दुबका था।"}],"loc":"Section 4 · Column 1 · #1","c":"#ef6c00"},{"w":"Gnawing","hi":"खाते-जाने वाली (चिंता)","en":"constantly troubling pain/worry","ex":"Biting or chewing persistently; a pain or worry that steadily eats at you — a gnawing hunger, gnawing guilt. Adjective/verb; verb: gnaw.","xs":"A gnawing fear that he had chosen the wrong career kept him awake.","xh":"यह खट-खटाता डर कि उसने ग़लत करियर चुना है, उसे सोने नहीं देता था।","t":"चूहा रात-रात भर खाता रहता है — भीतर चबाती टीस.","note":"","s":[{"en":"A gnawing guilt troubled him.","hi":"भीतर चबाता अपराध-बोध सताता रहा।"}],"loc":"Section 4 · Column 1 · #1","c":"#3949ab"},{"w":"Sneak","hi":"चुपके-चुपके जाना","en":"move secretly","ex":"To go somewhere quietly and secretly so as not to be seen — sneak out of the house; to take or bring secretly — sneak snacks into class; to tell tales secretly (informal British). Verb/noun.","xs":"The cat sneaked into the kitchen and stole a piece of fish.","xh":"बिल्ली चुपके से रसोई में घुसी और मछली का टुकड़ा चुरा लाई।","t":"चोर की \"नींद हराम\" चुपके चलना = sneak.","note":"","s":[{"en":"He sneaked out past midnight.","hi":"वह आधी रात चुपके निकल गया।"}],"loc":"Section 4 · Column 1 · #1","c":"#c62828"},{"w":"Hush","hi":"शांत करना/सन्नाटा","en":"silence, calm","ex":"To make or become quiet and still — hush a crying baby, hush the crowd; a deep, sudden silence — a hush fell over the hall. Verb/noun.","xs":"A hush fell over the auditorium as the curtain rose.","xh":"पर्दा उठते ही ऑडिटोरियम में सन्नाटा छा गया।","t":"\"हुश-श-श!\" — माँ का बच्चे को सुलाना.","note":"","s":[{"en":"A hush fell over the class.","hi":"कक्षा में सन्नाटा छा गया।"}],"loc":"Section 4 · Column 1 · #1","c":"#2e7d32"},{"w":"Fetter","hi":"बेड़ी/बंधन","en":"chain; something that restrains","ex":"A chain put round a prisoner's feet; figuratively, anything that restricts freedom — fetters of tradition; to bind with such chains — fettered by fear. Noun/verb.","xs":"Outdated laws still fetter the growth of small businesses.","xh":"पुराने क़ानून अब भी छोटे कारोबार की तरक़्क़ी में बेड़ी बने हुए हैं।","t":"शीशा-प्रेमी + व्यर्थ प्रयास.","note":"","s":[{"en":"Old customs fetter progress.","hi":"पुरानी रूढ़ियाँ प्रगति की बेड़ी हैं।"},{"en":"She is vain about her looks.","hi":"वह अपने रूप का अहंकार करती है।"}],"loc":"Section 4 · Column 1 · #1","c":"#6d4c41"},{"w":"Depose","hi":"पदच्युत करना","en":"remove from power; give testimony","ex":"To remove a ruler or official from power by force or legal process; also to give sworn evidence in writing before a court (deposition). Verb.","xs":"The army deposed the king and declared a republic.","xh":"सेना ने राजा को पदच्युत कर गणतंत्र घोषित कर दिया।","t":"DE + POSE: गद्दी से उतार देना.","note":"","s":[{"en":"The army deposed the king.","hi":"सेना ने राजा को गद्दी से उतारा।"}],"loc":"Section 4 · Column 1 · #1","c":"#e63980"},{"w":"Slimy","hi":"लीज़ली, घिनौना","en":"covered in slime; disgustingly smarmy","ex":"Covered with a thick, slippery, unpleasant wet substance — slimy fish, slimy steps; figuratively, unpleasantly flattering and untrustworthy — a slimy salesman. Adjective.","xs":"We slipped on the slimy rocks near the pond.","xh":"तालाब के पास की कीचड़ से फिसलन भरी चट्टानों पर हम लुढ़क गए।","t":"घोंघे की लाइन पीछे — चिकना-चिपचिपा व्यक्ति.","note":"","s":[{"en":"His slimy compliments disgusted her.","hi":"उसका घिनौना तारीफ़ उसे नापसंद लगा।"}],"loc":"Section 4 · Column 1 · #1","c":"#7c4dff"},{"w":"Amenable","hi":"आज्ञाकारी, सहमत होने वाला","en":"willing to agree/obey","ex":"Willing to agree, cooperate or be persuaded — amenable to suggestions; also answerable to authority — amenable to the court. Formal adjective.","xs":"The landlord was amenable to lowering the rent after our polite request.","xh":"हमारे विनम्र अनुरोध पर मकान मालिक किराया कम करने को राज़ी हो गया।","t":"\"A-MEND\": सुधारने को तैयार = आसानी से मानने वाला.","note":"","s":[{"en":"He is amenable to reason.","hi":"वह तर्क मानने को तैयार है।"}],"loc":"Section 4 · Column 1 · #1","c":"#00897b"},{"w":"Boisterous","hi":"गुलज़ार-शोरगुल भरा","en":"noisy and energetic","ex":"Noisy, energetic and rowdy in a rough but usually cheerful way — boisterous children, a boisterous crowd; also (of wind, sea) rough and stormy. Adjective.","xs":"The boisterous students filled the corridor with laughter and shouts.","xh":"शोरगुल करते छात्रों ने गलियारा हँसी और शोर से भर दिया।","t":"BOIST ≈ \"बवंडर\": उछलते-कूदते शोरगुल वाले बच्चे.","note":"","s":[{"en":"Boisterous children filled the garden.","hi":"शोरगुल करते बच्चों से बगीचा भर गया।"}],"loc":"Section 4 · Column 1 · #1","c":"#ef6c00"},{"w":"Lascivious","hi":"कामुक","en":"showing crude sexual desire","ex":"Showing strong, crude sexual desire; lustful — lascivious remarks, lascivious dancing. Formal, disapproving adjective.","xs":"The film was banned for its lascivious dance numbers.","xh":"फ़िल्म पर कामुक डांस नंबरों के कारण रोक लगा दी गई।","t":"LASCIVIOUS ≈ लचकती निगाहें — गंदी इच्छा.","note":"","s":[{"en":"Lascivious songs are banned.","hi":"कामुक गाने वर्जित हैं।"}],"loc":"Section 4 · Column 1 · #1","c":"#3949ab"},{"w":"Vile","hi":"घटिया, नीच","en":"extremely unpleasant, wicked","ex":"Extremely unpleasant and disgusting — a vile smell, vile weather; morally shameful and wicked — a vile crime. Adjective.","xs":"The open drain spread a vile smell across the whole colony.","xh":"खुला नाला पूरे कॉलोनी में घिनौनी बदबू फैला रहा था।","t":"VILE ≈ \"वाईल्ड\" नहीं — DEVIL से \"वाइल\" = शैतानी बुराई.","note":"","s":[{"en":"A vile smell filled the room.","hi":"कमरे में घिनौनी बदबू थी।"}],"loc":"Section 4 · Column 1 · #1","c":"#c62828"},{"w":"Tumult","hi":"उपद्रव/तूफ़ानी शोर","en":"loud chaos; riot","ex":"A loud, confused noise made by a crowd; a state of violent disorder; also inner emotional turmoil — a tumult of feelings. Formal noun; adjective: tumultuous.","xs":"The verdict was drowned in the tumult inside the courtroom.","xh":"कोर्ट रूम के शोरगुल में फ़ैसला सुनाई ही नहीं दिया गया।","t":"TUMULT ≈ TURMOIL — भीड़ का शोर-गुल.","note":"","s":[{"en":"The tumult subsided at midnight.","hi":"आधी रात उपद्रव शांत हुआ।"}],"loc":"Section 4 · Column 1 · #1","c":"#2e7d32"},{"w":"Impede","hi":"अड़ंगा लगाना","en":"hinder, slow down","ex":"To delay or block the progress of someone or something; to get in the way of movement or success — impeded by heavy traffic. Formal verb; noun: impediment.","xs":"Dense fog impeded the rescue team's climb up the mountain.","xh":"घने कोहरे ने बचाव दल की पहाड़ चढ़ाई धीमी कर दी।","t":"IM + PEDE (पैर): पैरों में बेड़ी = रफ़्तार रोकना.","note":"","s":[{"en":"Don't impede the investigation.","hi":"जाँच में अड़ंगा मत लगाओ।"}],"loc":"Section 4 · Column 1 · #1","c":"#6d4c41"},{"w":"Commute","hi":"रोज़ का सफ़र","en":"travel daily to work; reduce sentence","ex":"To travel regularly between home and work — an hour-long commute; to reduce a judicial sentence to a less severe one — commuted to life imprisonment; in maths, to interchange. Verb/noun.","xs":"Thousands of office workers commute to Delhi by train every morning.","xh":"हज़ारों दफ़्तरी कर्मचारी हर सुबह ट्रेन से दिल्ली आते-जाते हैं।","t":"INQUIRY = जाँच.","note":"","s":[{"en":"She commutes by metro.","hi":"वह मेट्रो से रोज़ आती-जाती है।"},{"en":"Inquisitive students excel.","hi":"जिज्ञासु छात्र आगे बढ़ते हैं।"}],"loc":"Section 4 · Column 1 · #1","c":"#e63980"},{"w":"Comforting","hi":"दिलासा देने वाला","en":"soothing, consoling","ex":"Making someone feel less sad, worried or pained; soothing — comforting words, the comforting smell of home food. Adjective; verb: comfort.","xs":"The nurse's comforting smile calmed the frightened patient.","xh":"नर्स की हौसला अफ़्ज़ाई मुस्कान ने डरे हुए मरीज़ को शांत कर दिया।","t":"COMFORT से — गोद में सुलाने जैसा आराम.","note":"","s":[{"en":"Her comforting words calmed him.","hi":"उसके दिलासे ने उसे शांत किया।"}],"loc":"Section 4 · Column 1 · #1","c":"#7c4dff"},{"w":"Wither","hi":"मुरझाना","en":"dry up, shrivel","ex":"To dry up and shrink, losing freshness — flowers wither in the heat; to decline gradually — his influence withered. Verb.","xs":"Without water, the potted plants withered within days.","xh":"पानी के बिना गमले के पौधे कुछ ही दिनों में मुरझा गए।","t":"धूप में फूल WITHER (सूख) जाता है.","note":"","s":[{"en":"Flowers withered in the heat.","hi":"गर्मी में फूल मुरझा गए।"}],"loc":"Section 4 · Column 2 · #1","c":"#00897b"},{"w":"Giddy","hi":"चक्कर खाता","en":"dizzy; lightheartedly silly","ex":"Dizzy and unsteady, as if everything is spinning — giddy heights, feeling giddy; also lighthearted, silly and excited — giddy laughter. Adjective.","xs":"Looking down from the 30th floor balcony made me giddy.","xh":"तीसवें फ़्लोर की बालकनी से नीचे देखते ही मेरा सिर घूमने लगा।","t":"झूले से उतरते ही \"घुम्मी\" चक्कर!","note":"","s":[{"en":"She felt giddy on the merry-go-round.","hi":"मरी-गो-राउंड पर उसे चक्कर आया।"}],"loc":"Section 4 · Column 2 · #1","c":"#ef6c00"},{"w":"Forsake","hi":"त्याग देना","en":"abandon completely","ex":"To leave someone or something completely, especially when loyalty is expected; to abandon — forsake one's family, forsake old habits. Literary verb; past: forsook.","xs":"He never forsook his village even after becoming rich.","xh":"अमीर बनने के बाद भी उसने अपने गाँव को कभी नहीं छोड़ा।","t":"FOR + SAKE: अपने स्वार्थ (sake) के लिए छोड़ देना.","note":"","s":[{"en":"Never forsake a true friend.","hi":"सच्चे मित्र को कभी मत छोड़ो।"}],"loc":"Section 4 · Column 2 · #1","c":"#3949ab"},{"w":"Skittish","hi":"भयभीत, उद्विग्न","en":"nervous, easily frightened","ex":"Nervous, easily frightened and ready to run away — a skittish horse, skittish deer; also playfully restless or (of markets) easily unsettled. Adjective.","xs":"The skittish colt bolted at the sound of thunder.","xh":"गरज की आवाज़ सुनते ही घबराया हुआ घोड़े का बछेदा भाग खड़ा हुआ।","t":"बिल्ली जैसी — छोटी-सी आवाज़ से कूद जाए.","note":"","s":[{"en":"The skittish horse shied away.","hi":"घबराया हुआ घोड़ा चौंककर हट गया।"}],"loc":"Section 4 · Column 2 · #1","c":"#c62828"},{"w":"Trundle","hi":"लुढ़काना","en":"roll slowly along","ex":"To move slowly and heavily, often on wheels with a rumbling sound — a cart trundles along; to push such a thing. Verb.","xs":"The old milk cart trundled through the sleepy lanes at dawn.","xh":"भोर में पुरानी दूध की ठेला सुस्त गति से सोई हुई गलियों से गुज़रा।","t":"TRUNDLE बेड के नीचे लुढ़कते पहिए.","note":"","s":[{"en":"He trundled the cart uphill.","hi":"उसने ठेला लुढ़काते हुए ऊपर धकेला।"}],"loc":"Section 4 · Column 2 · #1","c":"#2e7d32"},{"w":"Ally","hi":"मित्र, सहयोगी","en":"partner in a cause","ex":"A person, group or nation that joins with another for a common purpose — allies in war, a political ally; to join or unite (ally with/against). Noun/verb.","xs":"France was Britain's strongest ally in the Second World War.","xh":"द्वितीय विश्व युद्ध में फ़्रांस ब्रिटेन का सबसे मज़बूत सहयोगी था।","t":"\"ALL-Y\": सबका साथ — गठबंधन.","note":"","s":[{"en":"India found allies in the war.","hi":"भारत को युद्ध में सहयोगी मिले।"}],"loc":"Section 4 · Column 2 · #1","c":"#6d4c41"},{"w":"Cognisance","hi":"जानकारी/ध्यान लेना","en":"awareness, formal notice","ex":"Knowledge, awareness or notice of something — take cognisance of a complaint; in law, a court taking cognisance means formally accepting a case for hearing. British spelling (American: cognizance). Noun.","xs":"The court took cognisance of the newspaper report on illegal mining.","xh":"अदालत ने अवैध खनन पर अख़बारी खबर का संज्ञान लिया।","t":"COG (गाड़ी) चलने से पहले \"जान-बूझ\" के देखो.","note":"","s":[{"en":"The court took cognisance of the case.","hi":"अदालत ने मामले का संज्ञान लिया।"}],"loc":"Section 4 · Column 2 · #1","c":"#e63980"},{"w":"Prolong","hi":"बढ़ा देना","en":"lengthen in time","ex":"To make something last longer than usual or expected — prolong the meeting, prolong life. Verb (noun: prolongation; opposite: shorten).","xs":"The doctor's treatment prolonged the patient's life by a decade.","xh":"डॉक्टर के इलाज ने मरीज़ की उम्र दस साल बढ़ा दी।","t":"PUISSANCE = शक्ति-प्रदर्शन.","note":"","s":[{"en":"Don't prolong the meeting.","hi":"मीटिंग लंबी मत करो।"},{"en":"A puissant chief commanded respect.","hi":"पराक्रमी सरदार को आदर मिला।"}],"loc":"Section 4 · Column 2 · #1","c":"#7c4dff"},{"w":"Panegyric","hi":"बड़ी तारीफ़ (प्रशस्ति)","en":"formal high praise","ex":"A speech or piece of writing full of elaborate praise, often public and formal — a panegyric to the founder. Formal noun; adjective: panegyric(al).","xs":"The retiring principal was honoured with a warm panegyric by the staff.","xh":"सेवानिवृत्त प्रधानाचार्य को स्टाफ़ की ओर से भावपूर्ण प्रशस्ति पढ़कर सम्मान दिया गया।","t":"PAN (सब) + GYRIC: सबके सामने प्रशंसा-गीत.","note":"","s":[{"en":"The book is a panegyric of the leader.","hi":"पुस्तक नेता की प्रशस्ति है।"}],"loc":"Section 4 · Column 2 · #1","c":"#00897b"},{"w":"Incandescent","hi":"दमकता हुआ","en":"glowing brilliantly","ex":"Glowing white-hot with heat — incandescent metal; brilliantly bright — incandescent lights; also (of a person) shining with passion or anger — incandescent rage. Adjective.","xs":"The filament turns incandescent and glows inside the bulb.","xh":"बल्ब के भीतर फिलामेंट तपकर प्रज्वलित हो उठता है।","t":"INCA-DESCENT बल्ब — तपकर चमकने वाला.","note":"","s":[{"en":"The incandescent bulb lit the room.","hi":"जलता बल्ब कमरा रौशन कर गया।"}],"loc":"Section 4 · Column 2 · #1","c":"#ef6c00"},{"w":"Glistening","hi":"चमकता-भीगा हुआ","en":"shining wetly","ex":"Shining with a soft, wet or polished light — glistening sweat, glistening wet streets after rain. Adjective; verb: glisten.","xs":"Her eyes were glistening with tears of joy at the reunion.","xh":"पुनर्मिलन पर ख़ुशी के आँसुओं से उसकी आँखें चमक रही थीं।","t":"GLISTEN = चमक — ओस से भीगी घास.","note":"","s":[{"en":"Glistening dew covered the lawn.","hi":"चमकती ओस लॉन पर थी।"}],"loc":"Section 4 · Column 2 · #1","c":"#3949ab"},{"w":"Fulgent","hi":"झलमलाता","en":"dazzlingly bright","ex":"Shining brightly; dazzling and radiant. A rare, literary adjective from Latin fulgere (to flash).","xs":"The noon sun was fulgent on the temple's golden dome.","xh":"दोपहर का सूरज मंदिर के सुनहरे गुंबद पर चमक रहा था।","t":"REFULGENT का भाई — सूरज जैसा चमकीला.","note":"","s":[{"en":"Fulgent gold plates shone.","hi":"झलमलाती सोने की थालियाँ चमकीं।"}],"loc":"Section 4 · Column 2 · #1","c":"#c62828"},{"w":"Eulogy","hi":"प्रशंसा-भाषण (श्रद्धांजलि)","en":"speech of high praise, esp. for the dead","ex":"A speech or writing praising someone, usually delivered at a funeral; more broadly, high formal praise of a person or thing. Noun; adjective: eulogistic; verb: eulogize.","xs":"His eldest son gave a moving eulogy at the funeral.","xh":"फ़्यूनरल में उसके सबसे बड़े बेटे ने दिल छू लेने वाला श्रद्धांजलि भाषण दिया।","t":"EU (अच्छा) + LOGY (वचन): विदाई में अच्छाई बयाँ करना.","note":"","s":[{"en":"The son gave a moving eulogy.","hi":"बेटे ने हृदयस्पर्शी श्रद्धांजलि दी।"}],"loc":"Section 4 · Column 2 · #1","c":"#2e7d32"},{"w":"Turpitude","hi":"घोर चरित्रहीनता","en":"vile, shameful behaviour","ex":"Wicked, shameful behaviour that violates morality — moral turpitude, a crime of turpitude. A formal, legal-flavoured noun.","xs":"The officer was dismissed for acts of moral turpitude.","xh":"अधिकारी को नैतिक अधःपतन के कृत्यों के लिए नौकरी से हटा दिया गया।","t":"TURPITUDE ≈ \"टरपूड\" — गंदगी भरा आचरण.","note":"","s":[{"en":"Moral turpitude costs the job.","hi":"चरित्रहीनता नौकरी खा जाती है।"}],"loc":"Section 4 · Column 2 · #1","c":"#6d4c41"},{"w":"Depravity","hi":"पापप्रवणता","en":"moral corruption","ex":"Extreme moral corruption; wickedness so deep it shocks — the depravity of the crime shocked the nation. Noun; adjective: depraved.","xs":"The novel portrays the slow depravity of a once-honest judge.","xh":"उपन्यास एक कभी ईमानदार जज के धीमे चरित्र-पतन का चित्रण करता है।","t":"DE + PRAVITY (गिरावट): चरित्र का गहरा पतन.","note":"","s":[{"en":"The crime revealed his depravity.","hi":"अपराध ने उसकी चरित्रहीनता दिखाई।"}],"loc":"Section 4 · Column 2 · #1","c":"#e63980"},{"w":"Pulverize","hi":"चूरा-चूरा करना","en":"crush to powder","ex":"To crush or grind something into fine powder or tiny pieces — pulverized stone; to defeat completely — the team was pulverized 5–0. Verb (also pulverise).","xs":"The machine pulverizes the dried chillies into fine powder.","xh":"मशीन सूखी मिर्चों को पीसकर महीन पाउडर बना देती है।","t":"SPOKEN + SLANDER: बोलकर बदनाम.","note":"","s":[{"en":"The mixer pulverized the spices.","hi":"मिक्सी ने मसाले पीस दिए।"},{"en":"Slander is punishable in law.","hi":"निंदा (मौखिक) क़ानूनन दंडनीय है।"}],"loc":"Section 4 · Column 2 · #1","c":"#7c4dff"},{"w":"Knave","hi":"धूर्त, कपटी","en":"dishonest man","ex":"A dishonest, unscrupulous man; a cunning cheat — 'a knave in a lawyer's robe'; in cards, the jack. Old-fashioned noun.","xs":"The knave sold the widow a fake diamond ring.","xh":"धूर्त दुष्ट ने विधवा को नक़ली हीरे की अंगूठी बेच दी।","t":"PLAYING CARD का \"KNAVE\" (जैक) — चालबाज़.","note":"","s":[{"en":"Beware the knave who flatters.","hi":"धूर्त से सावधान जो चापलूसी करे।"}],"loc":"Section 4 · Column 2 · #1","c":"#00897b"},{"w":"Paragon","hi":"आदर्श नमूना","en":"perfect model of excellence","ex":"A person or thing that is a perfect example of excellence — a paragon of virtue, a paragon of patience. Noun.","xs":"Students call Mrs. Rao a paragon of patience and kindness.","xh":"छात्र श्रीमती राव को धैर्य और दया का आदर्श उदाहरण मानते हैं।","t":"PARAM + GUN: गुणों की पराकाष्ठा.","note":"","s":[{"en":"She is a paragon of virtue.","hi":"वह सद्गुण की प्रतिमूर्ति है।"}],"loc":"Section 4 · Column 2 · #1","c":"#ef6c00"},{"w":"Conspicuous","hi":"दिखने में साफ़, चटकीला","en":"easily seen, noticeable","ex":"Easily seen; standing out so clearly that it attracts attention — a conspicuous red flag, conspicuous by his absence. Formal adjective.","xs":"The minister was conspicuous by his absence at the flood-relief meeting.","xh":"बाढ़ राहत बैठक में मंत्री अपनी अनुपस्थिति से सब पर हावी थे।","t":"CON + SPIC (देखना): एक नज़र में दिख जाए.","note":"","s":[{"en":"His red car was conspicuous in traffic.","hi":"उसकी लाल गाड़ी ट्रैफ़िक में चटकी।"}],"loc":"Section 4 · Column 2 · #1","c":"#3949ab"},{"w":"Connive","hi":"मिलकर साज़िश/आँख बंद करना","en":"secretly plot; ignore wrongdoing","ex":"To secretly help or allow something wrong to happen by pretending not to notice — officials connived at the smuggling; also to plot together. Verb; noun: connivance.","xs":"The warehouse manager connived with the thieves to steal the stock.","xh":"गोदाम प्रबंधक ने चोरों के साथ मिलकर माल चुराने की साज़िश रची।","t":"CON + NIVE (\"नज़र बंद\"): जानते हुए भी न देखना.","note":"","s":[{"en":"Managers connived at the fraud.","hi":"प्रबंधकों ने घोटाले में मिलीभगत की।"}],"loc":"Section 4 · Column 2 · #1","c":"#c62828"},{"w":"Fussy","hi":"बहुत नखरेबाज़","en":"overly picky","ex":"Easily worried by small details; hard to please — a fussy eater, fussy about cleanliness; over-decorated — a fussy dress design. Adjective.","xs":"My grandmother is fussy about serving tea at exactly five o'clock.","xh":"मेरी दादी पाँच बजे ठीक-ठीक चाय परोसने को लेकर बहुत ख़ास हैं।","t":"CAN + DID = खुलकर बोलना.","note":"","s":[{"en":"A fussy eater won't try new dishes.","hi":"नखरेबाज़ खाने वाला नई डिश नहीं खाता।"},{"en":"Candid feedback helps growth.","hi":"ईमानदार फीडबैक विकास कराता है।"}],"loc":"Section 4 · Column 2 · #1","c":"#2e7d32"},{"w":"Evasive","hi":"टालमटोल करने वाला","en":"avoiding direct answers","ex":"Deliberately avoiding giving a direct answer or commitment — an evasive reply; also hard to catch — an evasive thief. Adjective; noun: evasiveness.","xs":"The witness gave evasive answers to every pointed question.","xh":"गवाह ने हर सीधे सवाल का टालमटोल भरा जवाब दिया।","t":"EVADE से — सवाल से बचना.","note":"","s":[{"en":"His evasive reply raised doubts.","hi":"टालमटोल भरे जवाब ने शक बढ़ाया।"}],"loc":"Section 4 · Column 2 · #1","c":"#6d4c41"},{"w":"Derelict","hi":"छोड़ा हुआ / ड्यूटी से गायब","en":"abandoned; neglecting duty","ex":"Abandoned and left to decay — a derelict factory; failing badly in one's duty — derelict guards; a person without home or job. Adjective/noun.","xs":"They turned the derelict mill into an art gallery.","xh":"उन्होंने वीरान पड़ी मिल को कला दीर्घा में बदल दिया।","t":"DE + RELICT (छूटा हुआ): चलता-फिरता खंडहर.","note":"","s":[{"en":"A derelict building stood nearby.","hi":"पास ही छोड़ी हुई इमारत थी।"}],"loc":"Section 4 · Column 2 · #1","c":"#e63980"},{"w":"Abyss","hi":"अतल गहराई","en":"bottomless pit","ex":"A deep, bottomless hole or chasm; figuratively, a vast depth of despair, evil or difference — an abyss of sorrow, the abyss between rich and poor. Noun.","xs":"He stared into the abyss beneath the cliff and stepped back.","xh":"उसने चट्टान के नीचे की अथाह गहराई में झाँका और पीछे हट गया।","t":"\"अबिस\" — ABYSSAL समुद्र की अंधेरी गहराई.","note":"","s":[{"en":"He stared into the abyss.","hi":"उसने अतल गर्त को देखा।"}],"loc":"Section 4 · Column 2 · #1","c":"#7c4dff"},{"w":"Profundity","hi":"गहराई, गंभीरता","en":"deep seriousness/insight","ex":"Deep intellectual insight or wisdom — remarks of great profundity; great depth of feeling or (literally) of water. Noun; adjective: profound.","xs":"The old monk spoke with quiet profundity about happiness.","xh":"बूढ़े साधु ने ख़ुशी के बारे में गहरी अंतर्दृष्टि से बात की।","t":"PROFOUND से — भीतर की गहराई.","note":"","s":[{"en":"The guru spoke with profundity.","hi":"गुरु ने गंभीरता से उपदेश दिया।"}],"loc":"Section 4 · Column 2 · #1","c":"#00897b"},{"w":"Regression","hi":"पीछे हटना/ह्रास","en":"return to an earlier (worse) state","ex":"A return to an earlier, less developed state — regression to childhood habits; in statistics, a method for predicting values (regression analysis); in psychology, reverting under stress. Noun; verb: regress.","xs":"The child showed regression after the family moved to a new city.","xh":"परिवार के नए शहर जाने के बाद बच्चे में पुराने बचपने वाले व्यवहार लौट आए।","t":"FAMILY FEUD शो.","note":"","s":[{"en":"The exam stress caused regression in his speech.","hi":"परीक्षा के तनाव से उसकी बोली पीछे खिसक गई।"},{"en":"Thieves ransacked the study.","hi":"चोरों ने स्टडी उलट दी।"},{"en":"The feud split the village.","hi":"दुश्मनी ने गाँव बाँट दिया।"}],"loc":"Section 4 · Column 3 · #1","c":"#ef6c00"},{"w":"Spat","hi":"छोटी-सी खीझ","en":"brief petty quarrel","ex":"A short, petty quarrel between people — a spat over the remote; past tense of spit; the soft shell of an oyster. Noun (also verb).","xs":"The couple had a brief spat over where to eat dinner.","xh":"दोपहर का खाना कहाँ खाएँ, इसी को लेकर दोनों के बीच छोटी सी तकरार हुई।","t":"गूँगे जी और पत्नी की फुसफुसाती लड़ाई = spat.","note":"","s":[{"en":"The spat was over in minutes.","hi":"कहासुनी मिनटों में खत्म हुई।"}],"loc":"Section 4 · Column 3 · #1","c":"#3949ab"},{"w":"Nitpick","hi":"महीन दोष ढूँढना","en":"criticize tiny faults","ex":"To criticize trivial, unimportant details; to find tiny faults instead of judging the whole — a nitpicking editor. Verb; noun: nitpicking.","xs":"Stop nitpicking over the font size and review the report's real errors.","xh":"फ़ॉन्ट के साइज़ पर लाड़-लाड़ बंद करो और रिपोर्ट की असली ग़लतियाँ देखो।","t":"खोपड़ी के निट (निट्स) चुनना — बेकार की बारीकियाँ.","note":"","s":[{"en":"Stop nitpicking my essay!","hi":"मेरे निबंध की छोटी-छोटी गलतियाँ मत पकड़ो!"}],"loc":"Section 4 · Column 3 · #1","c":"#c62828"},{"w":"Lacunae","hi":"खाली जगहें, अंतराल","en":"gaps, missing parts","ex":"Missing parts or gaps in a book, argument, knowledge or record — lacunae in the historical record. Plural of lacuna; singular also lacunae in older use.","xs":"Reviewers pointed out serious lacunae in the author's sources.","xh":"समीक्षकों ने लेखक के स्रोतों में बड़ी-बड़ी खाली जगहें (लाकून) बताईं।","t":"LACUNA = तालाब-सा खाली स्थान (पाठ में छूटा हिस्सा).","note":"","s":[{"en":"The report has lacunae.","hi":"रिपोर्ट में कमियाँ (खाली जगहें) हैं।"}],"loc":"Section 4 · Column 3 · #1","c":"#2e7d32"},{"w":"Succour","hi":"सहारा, राहत","en":"help in difficulty","ex":"Help and relief given to someone in difficulty or distress — succour for flood victims; to give such help. British spelling (American: succor). Noun/verb.","xs":"Relief trucks brought succour to the marooned village.","xh":"राहत ट्रकों ने कटौती से कटे गाँव को मदद पहुँचाई।","t":"छिपा हुआ गहरा ज्ञान.","note":"","s":[{"en":"Relief teams brought succour.","hi":"राहत टीमों ने सहारा दिया।"},{"en":"Sanskrit prosody is recondite.","hi":"संस्कृत छंद शास्त्र गूढ़ है।"}],"loc":"Section 4 · Column 3 · #1","c":"#6d4c41"},{"w":"Motto","hi":"ध्येय-वाक्य","en":"guiding slogan","ex":"A short sentence or phrase expressing a guiding belief or aim — 'Satyameva Jayate' is India's motto; a phrase on a coat of arms. Noun; plural: mottoes/mottos.","xs":"The school's motto is 'Knowledge is Light'.","xh":"स्कूल का ध्येय वाक्य है — 'ज्ञान ही प्रकाश है'।","t":"स्कूल बैज पर लिखा आदर्श-वाक्य.","note":"","s":[{"en":"Our motto is \"Service before self.\"","hi":"हमारा ध्येय है \"स्वार्थ से पहले सेवा\"।"}],"loc":"Section 4 · Column 3 · #1","c":"#e63980"},{"w":"Intransmutable","hi":"अपरिवर्तनीय","en":"impossible to change form","ex":"Not able to be changed into something else; unalterable in nature. A rare, learned adjective (opposite of transmutable); related: immutable.","xs":"The alchemists failed because lead is intransmutable by chemistry alone.","xh":"कीमियागर असफल रहे, क्योंकि केवल रसायन से सीसा बदलाव के योग्य नहीं है।","t":"IN + TRANSMUTE (रूप बदलना): अल्केमिस्ट भी बदल न सके.","note":"","s":[{"en":"Gold is intransmutable in ordinary reactions.","hi":"साधारण क्रियाओं में सोना अपरिवर्तनीय है।"}],"loc":"Section 4 · Column 3 · #1","c":"#7c4dff"},{"w":"Evanescent","hi":"क्षणभंगुर, वाष्पशील","en":"fading quickly","ex":"Fleeting; vanishing quickly like mist or a rainbow — evanescent fame, evanescent dew. Formal, literary adjective; verb: evanesce.","xs":"Fame on social media is often evanescent, gone within weeks.","xh":"सोशल मीडिया की शोहरत अक्सर क्षणभंगुर होती है, हफ़्तों में ग़ायब।","t":"E-VAPORATE: भाप बनकर गायब.","note":"","s":[{"en":"Fame is evanescent.","hi":"शोहरत क्षणभंगुर है।"}],"loc":"Section 4 · Column 3 · #1","c":"#00897b"},{"w":"Fugacious","hi":"तुरंत फूँक गया","en":"fleeting, short-lived","ex":"Tending to disappear quickly; short-lived — fugacious blossoms, fugacious spring. A rare, literary adjective (from Latin fugax, fleeting).","xs":"The fugacious beauty of cherry blossoms draws crowds for barely a week.","xh":"चेरी फूलों की क्षणिक सुंदरता को देखने भीड़ बमुश्किल एक हफ़्ते आती है।","t":"FUGITIVE से — भाग जाने वाला.","note":"","s":[{"en":"Youth is fugacious.","hi":"जवानी छिन-भर की है।"}],"loc":"Section 4 · Column 3 · #1","c":"#ef6c00"},{"w":"Perdurable","hi":"अत्यंत टिकाऊ","en":"extremely lasting","ex":"Extremely lasting; enduring through time without decay — perdurable marble monuments, perdurable fame. Literary adjective; noun: perdurability.","xs":"The perdurable granite walls have stood for eight centuries.","xh":"अटूट ग्रेनाइट की दीवारें आठ सदियों से खड़ी हैं।","t":"PER + DURABLE: सदियों तक डेरा डाले रहने वाला.","note":"","s":[{"en":"The temple's perdurable walls stand tall.","hi":"मंदिर की टिकाऊ दीवारें आज भी खड़ी हैं।"}],"loc":"Section 4 · Column 3 · #1","c":"#3949ab"},{"w":"Curt","hi":"रूखा-रूठा","en":"rudely brief","ex":"Rudely brief in speech; so short and quick that it sounds impolite — a curt 'no', a curt reply. Adjective.","xs":"His curt 'ask someone else' hurt the new intern.","xh":"उसका रूखा-सा 'किसी और से पूछो' सुनकर नए ट्रेनी को चोट लगी।","t":"करारा जवाब — \"CUT!\" जैसा सिनेमा-कट.","note":"","s":[{"en":"His curt reply ended the chat.","hi":"उसके रूखे जवाब ने बात बंद कर दी।"}],"loc":"Section 4 · Column 3 · #1","c":"#c62828"},{"w":"Hermetic","hi":"हवाबंद","en":"airtight; sealed from outside","ex":"Completely sealed so that no air can escape or enter — a hermetic seal; figuratively, isolated from outside influences — living a hermetic life. Adjective.","xs":"The hermetic packaging keeps the coffee fresh for months.","xh":"पूरी तरह एयरटाइट पैकेजिंग कॉफ़ी को महीनों तक ताज़ा रखती है।","t":"पाठक को साफ़-साफ़ दिखने वाला.","note":"","s":[{"en":"The jar is hermetically sealed.","hi":"जार हवाबंद बंद है।"},{"en":"Perspicuous writing wins readers.","hi":"सुस्पष्ट लेखन पाठक जीतता है।"}],"loc":"Section 4 · Column 3 · #1","c":"#2e7d32"},{"w":"Mendacious","hi":"झूठा","en":"lying habitually","ex":"Habitually lying; untrue — mendacious politicians, a mendacious account of events. Formal adjective; noun: mendacity.","xs":"The court rejected the mendacious testimony of the key witness.","xh":"अदालत ने मुख्य गवाह की झूठी गवाही रद्द कर दी।","t":"MEND + ACIOUS: बात बनाकर (mend करके) बोलने वाला.","note":"","s":[{"en":"Mendacious ads cheat buyers.","hi":"झूठे विज्ञापन ग्राहकों को ठगते हैं।"}],"loc":"Section 4 · Column 3 · #1","c":"#6d4c41"},{"w":"Apocryphal","hi":"काल्पनिक, अप्रामाणिक","en":"of doubtful authenticity","ex":"Of a story: widely told but probably not true — an apocryphal tale about the founder; of religious writings: not accepted into the official canon. Adjective; noun: apocrypha.","xs":"The story that Newton was hit by an apple may be apocryphal.","xh":"न्यूटन के सिर पर सेब गिरने वाली कहानी शायद केवल किंवदंती है।","t":"APO + CRYPTO: छिपी/घड़ी-घड़ी की गढ़ी कहानी.","note":"","s":[{"en":"Most anecdotes about him are apocryphal.","hi":"उसके बारे में ज़्यादातर किस्से झूठे हैं।"}],"loc":"Section 4 · Column 3 · #1","c":"#e63980"},{"w":"Obdurate","hi":"ज़िद्दी-अड़ियल","en":"stubbornly refusing to change","ex":"Stubbornly refusing to change one's opinion or course of action; hardened in resistance — obdurate refusal. Formal adjective; noun: obduracy.","xs":"The obdurate landlord refused every request to repair the roof.","xh":"ज़िद्दी मकान मालिक ने छत मरम्मत की हर अपील ठुकरा दी।","t":"\"OB-ड्योर\": दरवाज़ा (door) बंद रखने वाला.","note":"","s":[{"en":"The obdurate mule won't move.","hi":"अड़ियल खच्चर हिलता नहीं।"}],"loc":"Section 4 · Column 3 · #1","c":"#7c4dff"},{"w":"Recalcitrant","hi":"विद्रोही ज़िद्दी","en":"defiantly disobedient","ex":"Stubbornly disobedient to authority; resisting control — recalcitrant students, recalcitrant states. Formal adjective; noun: recalcitrance.","xs":"The recalcitrant horse threw off every rider that mounted it.","xh":"अवज्ञाकारी घोड़े ने हर सवार को फेंक दिया।","t":"RE-CALC (पीछे हटने से भी इनकार) — अड़ंगेबाज़ बच्चा.","note":"","s":[{"en":"Recalcitrant students disrupt class.","hi":"विद्रोही छात्र कक्षा बिगाड़ते हैं।"}],"loc":"Section 4 · Column 3 · #1","c":"#00897b"},{"w":"Prevaricatory","hi":"घुमाफिराकर जवाब देने वाला","en":"evasive, dodging the truth","ex":"Involving or marked by prevarication — speaking or acting evasively, dodging the truth without outright lying. Rare adjective; noun: prevarication; verb: prevaricate.","xs":"The minister's prevaricatory answers convinced no one.","xh":"मंत्री के टालमटोल भरे जवाबों पर किसी को यक़ीन नहीं हुआ।","t":"PRE-VARY: बात घुमाकर बोलना.","note":"","s":[{"en":"His prevaricatory answers annoyed the judge.","hi":"घुमावदार जवाबों से जज नाराज़ हुए।"}],"loc":"Section 4 · Column 3 · #1","c":"#ef6c00"},{"w":"Veridical","hi":"सत्यदर्शी, यथार्थ","en":"truthful, accurate","ex":"Truthful and in agreement with reality or fact — veridical testimony, veridical dreams that later come true. Scholarly adjective (opposite: illusory).","xs":"Only veridical reports were included in the final investigation.","xh":"अंतिम जाँच में केवल सत्यपूर्ण रिपोर्टें ही शामिल की गईं।","t":"VERI (सच) + DICT (कथन): \"सच बोलना\".","note":"","s":[{"en":"Her dream proved veridical.","hi":"उसका स्वप्न सच निकला।"}],"loc":"Section 4 · Column 3 · #1","c":"#3949ab"},{"w":"Sophistic","hi":"तर्कविद्या का पोंगापंगी","en":"clever but false reasoning","ex":"Plausible but false and misleading in reasoning, like the arguments of sophists — a sophistic reply that sounds clever but cheats. Formal adjective; related: sophistry, sophist.","xs":"His sophistic defence twisted every plain fact of the case.","xh":"उसकी दिखावटी चतुर बहस ने मामले के हर साफ़ तथ्य को घुमा दिया।","t":"SOPHIST — एथेंस के चालाक शिक्षक (प्लेटो के विरोधी).","note":"","s":[{"en":"Sophistic arguments sound clever but mislead.","hi":"तर्क-चातुर्य चमकता है पर भ्रमित करता है।"}],"loc":"Section 4 · Column 3 · #1","c":"#c62828"},{"w":"Tergiversatory","hi":"रास्ते बदलता हुआ","en":"evasive, turning from side to side","ex":"Marked by tergiversation — evasive shifting between opinions, deliberately turning away from the truth. Very rare adjective; noun: tergiversation; verb: tergiversate.","xs":"The witness's tergiversatory statements slowed the trial for months.","xh":"गवाह के बार-बार रुख बदलने वाले बयानों ने मुक़दमे को महीनों धीमा कर दिया।","t":"TERGIVERSATE: बार-बार मोड़ लेना — कथनी करनी से इनकार.","note":"","s":[{"en":"His tergiversatory stance lost trust.","hi":"उसकी घुमावदार नीति ने भरोसा तोड़ा।"}],"loc":"Section 4 · Column 3 · #1","c":"#2e7d32"},{"w":"Pretextual","hi":"बहानेबाज़ी वाला","en":"serving as a false excuse","ex":"Serving as or based on a pretext — a false reason offered to hide the real motive — a pretextual audit used to harass a rival. Formal adjective; noun: pretext.","xs":"The court found the search was pretextual, masking a personal vendetta.","xh":"अदालत ने पाया कि छापा केवल बहाना था, जिसके पीछे निजी दुश्मनी थी।","t":"सवाल से बचना.","note":"","s":[{"en":"The search was pretextual.","hi":"तलाशी का बहाना था।"},{"en":"Evasive leaders lose trust.","hi":"टालमटोल करने वाले नेता भरोसा खोते हैं।"}],"loc":"Section 4 · Column 3 · #1","c":"#6d4c41"},{"w":"Aporetic","hi":"दुविधा में उलझा","en":"expressing puzzlement, stuck in doubt","ex":"Involving aporia — a state of puzzlement where a problem seems to have no solution; expressing doubt that blocks all conclusions. Scholarly adjective; noun: aporia.","xs":"The chapter ends in an aporetic silence — every answer opens a new doubt.","xh":"अध्याय एक उलझे हुए सन्नाटे में ख़त्म होता है — हर जवाब नया सवाल खोलता है।","t":"APORIA = दुविधा-जन्य उलझन (कोई रास्ता नहीं).","note":"","s":[{"en":"The aporetic ending leaves readers thinking.","hi":"उलझा हुआ अंत पाठकों को सोचने पर मजबूर करता है।"}],"loc":"Section 4 · Column 3 · #1","c":"#e63980"},{"w":"Dogmatic","hi":"कट्टर आडंबरहीन दमभरा","en":"asserting opinions as facts","ex":"Asserting opinions as if they were unchallengeable facts; unwilling to consider other views — a dogmatic boss. Adjective; noun: dogma, dogmatism.","xs":"He is so dogmatic that he never admits any other view could be right.","xh":"वह इतना हठधर्मी है कि कभी यह नहीं मानता कि दूसरा दृष्टिकोण भी सही हो सकता है।","t":"DOGMA (पक्का सिद्धांत) + IC: \"मैंने कहा, तो कहा!\"","note":"","s":[{"en":"Dogmatic teachers invite doubt.","hi":"दमभरी शिक्षक शक जन्मते हैं।"}],"loc":"Section 4 · Column 3 · #1","c":"#7c4dff"},{"w":"Protean","hi":"रूप बदलता हुआ","en":"constantly changing shape","ex":"Able to keep changing form or character easily, like Proteus of Greek myth — a protean actor, protean talents. Formal adjective.","xs":"Her protean acting career spans comedy, horror and classical drama.","xh":"उसका बहुरूपदर्शी अभिनय करियर कॉमेडी, हॉरर और शास्त्रीय नाटक तक फैला है।","t":"PROTEUS (समुद्री देवता) — क्षण-क्षण रूप बदलता.","note":"","s":[{"en":"A protean artist masters many styles.","hi":"रूप-बदलू कलाकार कई शैलियाँ सीखता है।"}],"loc":"Section 4 · Column 3 · #1","c":"#00897b"},{"w":"Palliative","hi":"दर्द-निवारक (राहत देने वाला)","en":"easing pain without curing","ex":"Relieving pain or symptoms without curing the disease — palliative care for cancer patients; anything that soothes a problem without solving it. Adjective/noun.","xs":"Palliative care keeps terminal patients comfortable in their last months.","xh":"गतिरोधक देखभाल (पैलिएटिव केयर) अंतिम महीनों में असाध्य रोगियों को आराम देती है।","t":"PALLIATE: दवा दर्द ढकती है, बीमारी नहीं.","note":"","s":[{"en":"Palliative care comforts terminal patients.","hi":"दर्द-निवारक देखभाल अंतिम मरीजों को राहत देती है।"}],"loc":"Section 4 · Column 4 · #1","c":"#ef6c00"},{"w":"Emollient","hi":"निरामय/चिकनाहट देने वाला","en":"softe
