<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kajubadam Vocabulary — Click any word</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #fff; color: #222; padding: 8px 10px; }
  h1 { font-size: 14px; margin-bottom: 0; display: inline; }
  .sub { color: #666; font-size: 11px; margin-bottom: 6px; display: inline; margin-left: 8px; }
  #search {
    width: 100%; max-width: 300px; padding: 4px 12px; font-size: 13px;
    border: 1.5px solid #ddd; border-radius: 16px; outline: none; margin: 8px 0 6px; display: block;
  }
  #search:focus { border-color: #7c4dff; }
  .chips { display: flex; flex-wrap: wrap; gap: 0 4px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center;
    background: none; border: none; cursor: pointer;
    font-size: 14.5px; padding: 0; color: inherit; font-family: inherit;
  }
  .chip:hover .label { text-decoration: underline; }
  .label { line-height: 1.35; padding: 0 4px; border: 1px solid transparent; border-radius: 6px; }
  .chip.open { outline: none; }
  .chip.open .label { border-color: #b39ddb; background: #faf8ff; }
  /* Mastery marks */
  .label.m-weak { background: #ffe1e1; border-color: #ffb0b0; }
  .label.m-done { background: #d9f2e2; border-color: #a5d6a7; opacity: .55; text-decoration: line-through; }
  /* Mastery filter bar */
  #masterybar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0 0 6px; }
  .mbtn {
    border: 1.5px solid #e0e0e0; background: #fff; border-radius: 14px;
    font-size: 12px; padding: 2px 10px; cursor: pointer; font-family: inherit; color: #444;
  }
  .mbtn.active { border-color: #7c4dff; background: #f3ecff; color: #4a148c; }
  .mbtn .n { font-weight: 700; }
  #reset { border: none; background: none; color: #bbb; font-size: 11px; cursor: pointer; font-family: inherit; text-decoration: underline; }
  /* Popup mastery buttons */
  #p-actions { display: flex; gap: 8px; margin-top: 12px; }
  .pbtn { flex: 1; border: 1.5px solid #e0e0e0; background: #fff; border-radius: 8px; padding: 5px 4px; cursor: pointer; font-size: 12.5px; font-family: inherit; color: #444; }
  .pbtn.p-weak.active { background: #ffe1e1; border-color: #e57373; }
  .pbtn.p-learn.active { background: #f0f0f0; border-color: #9e9e9e; }
  .pbtn.p-done.active { background: #d9f2e2; border-color: #66bb6a; }
  /* Popup */
  #popup {
    position: fixed; z-index: 100; max-width: 380px; width: min(92vw, 380px);
    background: #fff; border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,.22); border: 1px solid #eee;
    display: none; font-size: 14px;
    max-height: calc(100vh - 16px); overflow-y: auto;
  }
  #popup.show { display: block; animation: pop .16s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
  #popup .pw { font-size: 19px; font-weight: 700; color: var(--pc, #e63980); }
  #popup .close {
    position: absolute; top: 8px; right: 12px; border: none; background: none;
    font-size: 20px; cursor: pointer; color: #999; line-height: 1;
  }
  #popup .hi { font-size: 16px; font-weight: 600; margin-top: 2px; }
  #popup .en { color: #555; margin-top: 4px; }
  #popup .ex {
    margin-top: 8px; font-size: 13px; line-height: 1.55; color: #333;
    background: #f6f4fc; border-left: 3px solid var(--pc, #7c4dff);
    border-radius: 0 8px 8px 0; padding: 8px 10px;
  }
  #popup .exsent { margin-top: 8px; font-size: 13px; line-height: 1.5; display: none; }
  #popup .exsent .xe { display: block; }
  #popup .exsent .xh { color: #777; display: block; }
  #popup .trick { background: #fff8e1; border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 13px; }
  #popup .sent { margin-top: 8px; font-size: 13px; line-height: 1.5; }
  /* Free note space (below Hindi & English meaning): text + pen ink + image in one card */
  #popup .mynote {
    background: #fffde7; border: 1.5px solid #eee59a; border-radius: 8px;
    padding: 7px 9px; margin-top: 10px; font-size: 13px; line-height: 1.5;
    color: #333; white-space: pre-wrap; word-break: break-word; cursor: text;
  }
  #popup .mynote:empty { display: none; }
  #popup .mynote.addnote { background: #fcfbf4; border: 1.5px dashed #d9c95c; color: #8a7c1a; font-size: 12px; padding: 6px 9px; }
  #popup .mynoteimg { max-width: 100%; max-height: 260px; border-radius: 8px; margin-top: 6px; border: 1.5px solid #eee59a; background: #fff; cursor: pointer; }
  #popup.editing .mynote, #popup.editing .mynoteimg { display: none; }
  .notebar { display: flex; gap: 6px; align-items: center; margin: 2px 0 6px; flex-wrap: wrap; }
  .notebar .tool { border: 1px solid #e0e0e0; background: #fff; border-radius: 10px; font-size: 11px; padding: 3px 9px; cursor: pointer; font-family: inherit; color: #444; }
  .notebar .tool.active { border-color: #7c4dff; background: #f3ecff; color: #4a148c; }
  #notepad { width: 100%; height: 120px; border: 1.5px solid #e0d98f; border-radius: 8px; background: #fff; touch-action: none; cursor: crosshair; display: block; resize: vertical; min-height: 80px; max-height: 300px; overflow: hidden; }
  #notepad.noink { display: none; }
  .notetools { display: none; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .notetools.show { display: flex; }
  .notetools input[type=range] { width: 80px; }
  .notetools input[type=color] { width: 26px; height: 22px; padding: 0; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
  .notedrop { margin-top: 6px; font-size: 10.5px; color: #a09532; text-align: center; }
  .notedrop.drag { color: #7c4dff; font-weight: 600; }
  .nsave { font-size: 10.5px; color: #2e7d32; margin-top: 4px; display: block; height: 14px; }

  #popup .sent .en-s { display: block; }
  #popup .sent .hi-s { color: #777; display: block; }
  #popup .loc { margin-top: 10px; font-size: 11px; color: #aaa; }
  /* Edit option in popup */
  .pw-row { display: flex; align-items: flex-start; gap: 8px; padding-right: 22px; }
  .pw-row .pw { flex: 1; }
  .editbtn {
    border: 1px solid #e0e0e0; background: #fafafa; border-radius: 12px;
    font-size: 11.5px; padding: 2px 9px; cursor: pointer; color: #666;
    font-family: inherit; white-space: nowrap; margin-top: 2px;
  }
  .editbtn:hover { border-color: #7c4dff; background: #f3ecff; color: #4a148c; }
  .pform { display: none; margin-top: 8px; }
  #popup.editing .pform { display: block; }
  #popup.editing .hi, #popup.editing .en, #popup.editing .ex, #popup.editing .exsent,
  #popup.editing .trick, #popup.editing .sent, #popup.editing .editbtn { display: none; }
  .pform .flabel { display: block; font-size: 11px; color: #888; margin-top: 8px; }
  .pform textarea {
    width: 100%; font-family: inherit; font-size: 13px; padding: 6px 8px;
    border: 1.5px solid #ddd; border-radius: 8px; outline: none; resize: vertical;
    margin-top: 3px; display: block; background: #fff; color: #222;
  }
  .pform textarea:focus { border-color: #7c4dff; }
  /* Sticky save bar — pinned to the bottom of the popup while editing */
  .esave { position: sticky; bottom: 0; z-index: 5; margin: 12px -18px -16px; padding: 8px 18px 12px; background: #fff; border-top: 1.5px solid #f0f0f0; border-radius: 0 0 14px 14px; }
  .ebar { display: flex; gap: 8px; }
  .ebtn { flex: 1; border: 1.5px solid #e0e0e0; background: #fff; border-radius: 8px; padding: 6px 4px; cursor: pointer; font-size: 12.5px; font-family: inherit; color: #444; }
  .ebtn.save { background: #7c4dff; border-color: #7c4dff; color: #fff; font-weight: 600; }
  .ebtn.save:hover { background: #6939d6; }
  .enote { margin-top: 6px; font-size: 10.5px; color: #aaa; }
  #overlay { position: fixed; inset: 0; z-index: 90; display: none; }
  #overlay.show { display: block; }
  #count { color: #888; font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>
<h1>Kajubadam Vocabulary</h1>
<div class="sub">639 words · Click any word for meaning · set 🔴/✅ mastery · ✏️ edit content in popup (auto-save)</div>
<div id="masterybar">
  <button class="mbtn active" data-f="all">All <span class="n" id="n-all"></span></button>
  <button class="mbtn" data-f="weak">🔴 Weak <span class="n" id="n-weak"></span></button>
  <button class="mbtn" data-f="learn">⚪ Learning <span class="n" id="n-learn"></span></button>
  <button class="mbtn" data-f="done">✅ Mastered <span class="n" id="n-done"></span></button>
  <button id="reset">reset</button>
  <span style="width:10px"></span>
  <button class="mbtn" onclick="downloadMd()" title="Download vocab-master.md with your edits baked in — replace your original and run: node generate-html.js">📝 Edited .md</button>
  <button class="mbtn" onclick="openSyncPanel()" title="Move marks, notes and comments between iPad and desktop (JSON)">☁️ Sync</button>
</div>
<input id="search" type="text" placeholder="Search word… (type & click)" autocomplete="off">
<div class="chips" id="chips"></div>
<div id="count"></div>

<div id="overlay"></div>
<div id="popup" role="dialog">
  <button class="close" onclick="closePop()">✕</button>
  <div class="pw-row">
    <div class="pw" id="p-word"></div>
    <button class="editbtn" onclick="openEdit()">✏️ Edit</button>
  </div>
  <div class="hi" id="p-hi"></div>
  <div class="ex" id="p-ex"></div>
  <div class="exsent" id="p-exsent"></div>
  <div class="mynote addnote" id="p-note" title="Your note space: write, draw, or add an image — saved in this browser">✏️ + Add your note…</div>
  <img class="mynoteimg" id="note-img" alt="" style="display:none">
  <div class="trick" id="p-trick"></div>
  <div class="sent" id="p-sent"></div>
  <div class="pform" id="p-form">
    <label class="flabel">Hindi meaning</label>
    <textarea id="e-hi" rows="2"></textarea>
    <label class="flabel">Your notes ✏️ — text · ink · image in one place</label>
    <textarea id="e-note" rows="4" placeholder="Write anything here…"></textarea>
    <span class="nsave" id="e-note-saved"></span>
    <div class="notebar">
      <button class="tool" id="np-draw" onclick="toggleNotePad()">✍️ Draw</button>
      <button class="tool" id="np-pen" onclick="setNoteTool('pen')" style="display:none">✏️ Pen</button>
      <button class="tool" id="np-erase" onclick="setNoteTool('eraser')" style="display:none">🧽 Eraser</button>
      <button class="tool" id="np-undo" onclick="undoNotePad()" style="display:none">↩️ Undo</button>
      <button class="tool" id="np-clear" onclick="clearNotePad()" style="display:none">🗑️ Clear</button>
      <button class="tool" id="np-imgbtn" onclick="document.getElementById('noteimgfile').click()">🖼️ Image</button>
      <button class="tool" id="np-imgdel" onclick="removeNoteImg()" style="display:none" title="Remove the note image">🚫 Remove img</button>
    </div>
    <div class="notetools" id="notetools">
      <input type="color" id="notecolor" value="#1a1a1a" title="Ink color">
      <input type="range" id="notesize" min="1" max="24" value="3" title="Brush size">
      <span style="font-size:11px;color:#999" id="notesizeval">3px</span>
    </div>
    <canvas id="notepad" class="noink"></canvas>
    <div class="notedrop" id="notedrop">📋 paste (Ctrl+V) · 🖱️ drop · 🖼️ pick an image — ink writes right on it</div>
    <input type="file" id="noteimgfile" accept="image/*" style="display:none">
    <label class="flabel">Memory trick 🧠</label>
    <textarea id="e-trick" rows="3"></textarea>
    <label class="flabel">Example sentence (one per line: English · Hindi — Hindi optional)</label>
    <textarea id="e-sent" rows="4"></textarea>
    <div class="esave">
      <div class="ebar">
        <button class="ebtn save" onclick="saveEdit()">💾 Save</button>
        <button class="ebtn" onclick="cancelEdit()">✖ Cancel</button>
      </div>
      <div class="enote">Saved in this browser (localStorage) · survives page reload</div>
    </div>
  </div>
  <div id="p-actions">
    <button class="pbtn p-weak" onclick="markFromPop('weak')">🔴 Weak</button>
    <button class="pbtn p-learn" onclick="markFromPop('learn')">⚪ Learning</button>
    <button class="pbtn p-done" onclick="markFromPop('done')">✅ Mastered</button>
  </div>
  <div class="loc" id="p-loc"></div>
</div>

<script>
const DATA = [{"w":"Thwart","hi":"विफल करना","en":"stop a plan from succeeding","ex":"To thwart means to stop someone from doing what they want, or to prevent a plan from succeeding. It implies active, deliberate opposition — the plan is not merely delayed, it is defeated by someone working against it. Verb.","xs":"The security guard's quick thinking thwarted the thieves' plan to rob the bank.","xh":"सिक्योरिटी गार्ड की तेज़ सोच ने बैंक लूटने की चोरों की योजना को नाकाम कर दिया।","t":"THWART = \"THE-WART\": दाना चेहरे की खूबसूरती रोकता है → plan रोकना.","note":"","s":[{"en":"The rain thwarted our picnic.","hi":"बारिश ने हमारी पिकनिक विफल कर दी।"}],"loc":"Section 1 · Column 1 · #1","c":"#e63980"},{"w":"Appal","hi":"चौंका देना","en":"shock, horrify","ex":"To appal (British; American: appall) means to shock and upset someone deeply, usually by something cruel, disgusting or morally wrong. Past forms: appalled / appalled. It expresses strong horror, not mere surprise. Verb.","xs":"The judge was appalled by the cruelty shown to the helpless animals.","xh":"बेबस जानवरों के साथ हुई निर्ममता देखकर जज स्तब्ध रह गया।","t":"AAP + PAL: अपना (AAP) दोस्त (PAL) गलत काम करे तो चौंक जाओ.","note":"","s":[{"en":"The cruelty appalled the judge.","hi":"क्रूरता ने जज को स्तब्ध कर दिया।"}],"loc":"Section 1 · Column 1 · #1","c":"#7c4dff"},{"w":"Resent","hi":"नाराज़ होना","en":"feel bitter about something","ex":"To resent means to feel angry or bitter about something you think is unfair, especially something you must accept unwillingly — being ignored, insulted, or treated unfairly. Verb; the feeling is quiet bitterness rather than open anger.","xs":"She quietly resents the way her boss takes credit for her work.","xh":"वह चुपचाप खीझती है कि उसका बॉस उसके काम का श्रेय खुद ले लेता है।","t":"RE-SENT: गुस्से में message बार-बार RE-SEND किया = बितर (bitterness).","note":"","s":[{"en":"She resents being ignored.","hi":"वह अनदेखा किए जाने से नाराज़ है।"}],"loc":"Section 1 · Column 1 · #1","c":"#00897b"},{"w":"Precocious","hi":"समय से पहले विकसित","en":"unusually advanced for age","ex":"Describes a child who has developed certain abilities — intelligence, speech, talent — much earlier than usual, in a way that seems surprisingly advanced for their age. It can carry a slight hint that the child is too forward or self-assured. Adjective.","xs":"The precocious girl could solve difficult maths problems at the age of five.","xh":"उम्र से आगे बढ़ी हुई लड़की पाँच साल की उम्र में कठिन गणित की समस्याएँ हल कर लेती थी।","t":"PRE + COCO: छोटा बच्चा coco (कॉफी) जल्दी पीने लगे = उम्र से आगे.","note":"","s":[{"en":"The precocious child read at age three.","hi":"समय से आगे बढ़ा बच्चा तीन साल में पढ़ने लगा।"}],"loc":"Section 1 · Column 1 · #1","c":"#ef6c00"},{"w":"Profane","hi":"अपवित्र","en":"disrespectful to religion","ex":"Showing disrespect towards God, religion or sacred things; not holy. It also describes rude, obscene language that many people find offensive. Adjective (also a verb: to profane something sacred).","xs":"He was punished for using profane language inside the temple.","xh":"मंदिर के अंदर अपवित्र भाषा बोलने के लिए उसे दंड मिला।","t":"PRO + FANE (\"fane\" = मंदिर): मंदिर के खिलाफ = अपवित्र.","note":"","s":[{"en":"He used profane language in the temple.","hi":"उसने मंदिर में अपवित्र भाषा बोली।"}],"loc":"Section 1 · Column 1 · #1","c":"#3949ab"},{"w":"Maniacal","hi":"पागलपन भरा","en":"wild, crazy","ex":"Behaving like a maniac; wild, crazy and uncontrolled, often with violent or obsessive energy. A maniacal laugh or look suggests madness or frightening excitement. Adjective.","xs":"The villain let out a maniacal laugh as the building burned.","xh":"इमारत जलते समय खलनायक पागलपन भरी हँसी हँसा।","t":"MANIAC + AL: पागल (maniac) जैसी हँसी/हरकत.","note":"","s":[{"en":"He gave a maniacal laugh.","hi":"वह पागलपन भरी हँसी हँसा।"}],"loc":"Section 1 · Column 1 · #1","c":"#c62828"},{"w":"Rubble","hi":"मलबा","en":"broken pieces of a building","ex":"The broken pieces of stone, brick and concrete left when a building is destroyed or falls down. Uncountable noun — we speak of piles of rubble, not 'a rubble'.","xs":"After the earthquake, rescuers dug through the rubble to find survivors.","xh":"भूकंप के बाद बचाव दल ने जीवित लोगों को खोजने के लिए मलबे में खुदाई की।","t":"RUB + BLE: मलबे से हाथ RUB (रगड़) कर साफ करना पड़ता है.","note":"","s":[{"en":"The earthquake left only rubble.","hi":"भूकंप ने केवल मलबा छोड़ा।"}],"loc":"Section 1 · Column 1 · #1","c":"#2e7d32"},{"w":"Vain","hi":"व्यर्थ / खुद पर मोहित","en":"useless; too proud of looks","ex":"Too proud of your own appearance, abilities or importance; always thinking about how you look. A second important sense is 'useless' or 'unsuccessful' — efforts made in vain bring no result. Adjective; the noun is vanity.","xs":"He was so vain that he checked his hair in every mirror he passed.","xh":"वह इतना आत्ममुग्ध था कि रास्ते के हर शीशे में अपने बाल देखता जाता था।","t":"VAIN = mirror के आगे खड़ा \"वेन\" — दोनों अर्थ: शीशा (आत्ममुग्ध) + व्यर्थ.","note":"","s":[{"en":"All his efforts were in vain.","hi":"उसकी सारी मेहनत व्यर्थ गई।"}],"loc":"Section 1 · Column 1 · #1","c":"#6d4c41"},{"w":"Siege","hi":"घेराबंदी","en":"surrounding a place to capture it","ex":"The act of surrounding a fortified place — a city, fort or building — for a long time to force the people inside to surrender, usually by cutting off food and supplies. Also used figuratively, as in 'a siege of questions'. Noun.","xs":"The enemy army laid siege to the fort for three months.","xh":"दुश्मन की सेना ने तीन महीने तक किले की घेराबंदी की।","t":"SIEGE ≈ SEIZE: किले को घेरकर SEIZE (कब्जा) करना.","note":"","s":[{"en":"The army laid siege to the fort.","hi":"सेना ने किले की घेराबंदी की।"}],"loc":"Section 1 · Column 1 · #1","c":"#e63980"},{"w":"Trance","hi":"सम्मोहन अवस्था","en":"half-conscious dreamy state","ex":"A half-conscious mental state in which you are not aware of what is happening around you, as if in a dream — caused by hypnosis, deep thought, drugs or religious ecstasy. Noun.","xs":"The hypnotist put the whole audience into a deep trance.","xh":"सम्मोहक ने पूरे दर्शकों को गहरे सम्मोहन में डाल दिया।","t":"TRANCE ≈ ENTRANCE: जादू \"entrance\" करके trance में डाल दे.","note":"","s":[{"en":"The magician put him in a trance.","hi":"जादूगर ने उसे सम्मोहन में डाल दिया।"}],"loc":"Section 1 · Column 1 · #1","c":"#7c4dff"},{"w":"Deference","hi":"आदर","en":"respectful submission","ex":"Polite, respectful behaviour towards someone because you accept their higher age, rank, knowledge or wishes — letting them decide, listening before speaking, bowing to their opinion. Noun; the verb is 'defer to someone'.","xs":"Out of deference to the senior professor, the young teacher stayed silent in the meeting.","xh":"वरिष्ठ प्रोफेसर के प्रति आदर प्रकट करते हुए युवा शिक्षक बैठक में चुप रहे।","t":"DEFER = आगे बढ़ने से रुकना: बड़ों की बात टालकर झुकना = आदर.","note":"","s":[{"en":"He bowed in deference to his teacher.","hi":"उसने शिक्षक के आदर में सिर झुकाया।"}],"loc":"Section 1 · Column 1 · #1","c":"#00897b"},{"w":"Inference","hi":"अनुमान","en":"conclusion from evidence","ex":"A conclusion that you reach by reasoning from evidence or facts, rather than from anything directly stated — reading between the lines. Noun; the verb is infer.","xs":"From her wet umbrella, we made the inference that it had rained heavily.","xh":"उसके गीले छाते को देखकर हमने यह अनुमान निकाला कि भारी बारिश हुई थी।","t":"INFER + ENCE: जो आप INFER (निकालें) वही अनुमान.","note":"","s":[{"en":"His inference proved correct.","hi":"उसका अनुमान सही निकला।"}],"loc":"Section 1 · Column 1 · #1","c":"#ef6c00"},{"w":"Exquisite","hi":"अत्यंत सुंदर","en":"extremely beautiful, delicate","ex":"Extremely beautiful, delicate, and made or done with great skill and care; so fine that it gives intense pleasure. It can describe looks, taste, craftsmanship, or even feelings such as exquisite pain. Adjective.","xs":"The bride wore an exquisite saree embroidered with golden thread.","xh":"दुल्हन ने सोने के धागे से कढ़ाई वाली अत्यंत सुंदर साड़ी पहनी थी।","t":"EXTRA + SUITE: होटल का extra-खूबसूरत सुइट.","note":"","s":[{"en":"She wore an exquisite saree.","hi":"उसने अत्यंत सुंदर साड़ी पहनी।"}],"loc":"Section 1 · Column 1 · #1","c":"#3949ab"},{"w":"Indolent","hi":"आलसी","en":"lazy","ex":"Lazy; avoiding activity and effort, preferring to rest and do nothing. It usually describes a habit or temperament rather than one lazy act. Adjective; the noun is indolence.","xs":"The indolent servant slept in the garden instead of doing his work.","xh":"आलसी नौकर ने काम करने की बजाय बगीचे में सो लिया।","t":"IDLE + LENT: \"आइडल\" (खाली) बैठा रहना = आलस.","note":"","s":[{"en":"The indolent student failed.","hi":"आलसी छात्र फेल हो गया।"}],"loc":"Section 1 · Column 1 · #1","c":"#c62828"},{"w":"Glutted","hi":"अत्यधिक भरा हुआ","en":"overfilled, oversupplied","ex":"Filled or supplied far beyond what is needed; overfull. A market glutted with goods has too much supply, so prices fall. Also used for overeating. Adjective/verb (to glut).","xs":"The market is glutted with cheap toys, so sellers cannot raise prices.","xh":"बाज़ार सस्ते खिलौनों से भरा पड़ा है, इसलिए विक्रेता दाम नहीं बढ़ा सकते।","t":"GLUT ≈ \"गट\" (gut): पेट गट-भर भर गया.","note":"","s":[{"en":"The market is glutted with cheap toys.","hi":"बाज़ार सस्ते खिलौनों से भरा पड़ा है।"}],"loc":"Section 1 · Column 1 · #1","c":"#2e7d32"},{"w":"Succumb","hi":"झुक जाना / दम तोड़ना","en":"fail to resist; die of","ex":"To fail to resist a strong force, temptation, illness or attack, and finally give in to it; in serious cases, to die from a disease or injury. Formal verb.","xs":"After fighting the illness for months, he finally succumbed to pneumonia.","xh":"महीनों बीमारी से लड़ने के बाद आख़िरकार वह निमोनिया के आगे झुक गया (उसकी मृत्यु हो गई)।","t":"SUCCUMB = \"SUCK + UMBRELLA\": तूफान छाता उड़ा ले गया — हार मान ली.","note":"","s":[{"en":"He succumbed to his injuries.","hi":"चोटों के आगे वह झुक गया (उसकी मृत्यु हुई)।"}],"loc":"Section 1 · Column 1 · #1","c":"#6d4c41"},{"w":"Impetuous","hi":"जल्दबाज़","en":"acting fast without thinking","ex":"Doing things suddenly and without thinking about the results; acting on strong feeling in a hurry. An impetuous decision or person is rash and impulsive. Adjective; noun: impetuosity.","xs":"It was impetuous of him to quit his job after one small argument.","xh":"एक छोटी सी बहस के बाद ही नौकरी छोड़ देना उसकी जल्दबाज़ी थी।","t":"IMPETUS (झटका/force): झटके में फैसला = जल्दबाज़ी.","note":"","s":[{"en":"It was impetuous to quit in anger.","hi":"गुस्से में इस्तीफ़ा देना जल्दबाज़ी थी।"}],"loc":"Section 1 · Column 1 · #1","c":"#e63980"},{"w":"Latter","hi":"दूसरा / उत्तरार्ध","en":"the second of two","ex":"The second of two things or people just mentioned (the first is 'the former'); also means 'near the end' of a period — the latter half of the year. Adjective/noun.","xs":"Tea and coffee were offered; I chose the latter.","xh":"चाय और कॉफ़ी दोनों पेश की गईं; मैंने दूसरी (कॉफ़ी) चुनी।","t":"LaTTer = lisT का बाद वाला (TT = Two things).","note":"","s":[{"en":"Of tea and coffee, I prefer the latter.","hi":"चाय-कॉफी में मुझे दूसरा (कॉफी) पसंद है।"}],"loc":"Section 1 · Column 1 · #1","c":"#7c4dff"},{"w":"Retinue","hi":"अनुचर दल","en":"group of attendants","ex":"A group of assistants, servants or followers who travel with an important person such as a king, a queen or a celebrity. Formal noun.","xs":"The minister arrived with a large retinue of bodyguards and clerks.","xh":"मंत्री अंगरक्षकों और क्लर्कों के बड़े दल के साथ पहुँचे।","t":"RETINUE ≈ RETAIN: जो सेवक RETAIN (रखे) जाएँ, वही दल.","note":"","s":[{"en":"The king moved with a large retinue.","hi":"राजा बड़े अनुचर दल के साथ चला।"}],"loc":"Section 1 · Column 1 · #1","c":"#00897b"},{"w":"Flummoxed","hi":"असमंजस में","en":"totally confused","ex":"Completely confused and unable to understand or decide what to do; bewildered. Informal adjective, usually in the pattern 'be flummoxed by something'.","xs":"The tricky final question left the champion completely flummoxed.","xh":"मुश्किल आख़िरी सवाल ने चैंपियन को पूरी तरह असमंजस में डाल दिया।","t":"FULL + MOCKS: पूरे mocks (टेस्ट) के बाद सिर घूम जाए = भ्रमित.","note":"","s":[{"en":"I was flummoxed by the puzzle.","hi":"पहेली ने मुझे असमंजस में डाल दिया।"}],"loc":"Section 1 · Column 1 · #1","c":"#ef6c00"},{"w":"Clamour","hi":"शोरगुल","en":"loud noise or demand","ex":"A loud, continuous noise made by many people shouting together; also a strong public demand or protest. British spelling (American: clamor). Noun; verb: to clamour for something.","xs":"The crowd raised a great clamour, demanding the minister's resignation.","xh":"भीड़ ने मंत्री के इस्तीफ़े की माँग करते हुए भारी शोरगुल मचाया।","t":"CLAIM + OUR: भीड़ चिल्लाती है \"यह OUR हक CLAIM है!\"","note":"","s":[{"en":"The clamour of the crowd grew.","hi":"भीड़ का शोरगुल बढ़ गया।"}],"loc":"Section 1 · Column 1 · #1","c":"#3949ab"},{"w":"Babble","hi":"बड़बड़ाना","en":"talk without meaning","ex":"To talk quickly in a confused, meaningless way, like a baby learning to make sounds; of flowing water, to make a gentle repeated bubbling sound. Verb/noun.","xs":"The baby babbled happily while playing with her toys.","xh":"खिलौनों से खेलते हुए शिशु खुशी से बड़बड़ाया।","t":"\"बा-बा-बा\" — शिशु की आवाज़.","note":"","s":[{"en":"The baby babbled happily.","hi":"शिशु खुशी से बड़बड़ाया।"}],"loc":"Section 1 · Column 1 · #1","c":"#c62828"},{"w":"Impotence","hi":"शक्तिहीनता","en":"powerlessness","ex":"Complete lack of power, strength or ability to change a situation; helplessness. It also has a medical sense — the inability to perform sexually. Noun; adjective: impotent.","xs":"People were angry at the government's impotence in the face of rising prices.","xh":"बढ़ती कीमतों के सामने सरकार की बेबसी से लोग गुस्सा हुए।","t":"IM (नहीं) + POTENT (शक्तिशाली) = बेबसी.","note":"","s":[{"en":"The committee's impotence angered people.","hi":"समिति की बेबसी से लोग गुस्सा हुए।"}],"loc":"Section 1 · Column 1 · #1","c":"#2e7d32"},{"w":"Impudent","hi":"धृष्ट","en":"shamelessly rude","ex":"Rude and showing no respect towards someone older or more important; shamelessly bold in a way that annoys people. Adjective; noun: impudence.","xs":"The impudent boy answered back even when the principal scolded him.","xh":"धृष्ट लड़के ने प्रधानाचार्य की डाँट खाकर भी जवाब दे दिया।","t":"IMP (शैतान बच्चा) + DENT: शैतान ने आदर में \"dent\" (खोद) दी.","note":"","s":[{"en":"The impudent boy talked back.","hi":"धृष्ट लड़के ने जवाब दे दिया।"}],"loc":"Section 1 · Column 1 · #1","c":"#6d4c41"},{"w":"Fallacy","hi":"भ्रांति","en":"false belief; faulty logic","ex":"A false idea or belief that many people think is true; also a weakness or mistake in the logic of an argument. Noun; adjective: fallacious.","xs":"It is a common fallacy that we use only ten percent of our brain.","xh":"यह एक आम भ्रांति है कि हम अपने दिमाग का केवल दस प्रतिशत इस्तेमाल करते हैं।","t":"FALL + ACY: तर्क FALL (गिर) जाए = तर्कदोष.","note":"","s":[{"en":"That superstition is a fallacy.","hi":"वह अंधविश्वास एक भ्रांति है।"}],"loc":"Section 1 · Column 1 · #1","c":"#e63980"},{"w":"Flex","hi":"मोड़ना / अड़ाना","en":"bend muscles; show off","ex":"To bend a limb, or to tighten a muscle so it stands out, often to show strength (flex your muscles). Figuratively, to show off your power, wealth or abilities. Verb.","xs":"The wrestler flexed his muscles to frighten his opponent.","xh":"पहलवान ने प्रतिद्वंद्वी को डराने के लिए अपनी मांसपेशियाँ तन दीं।","t":"GYM में biceps FLEX करना = दिखावा.","note":"","s":[{"en":"He flexed his biceps.","hi":"उसने बाहें मोड़ीं (फ्लेक्स कीं)।"}],"loc":"Section 1 · Column 1 · #1","c":"#7c4dff"},{"w":"Nibble","hi":"कुतरना","en":"eat in small bites","ex":"To eat something with very small bites, taking tiny amounts at a time; also to take away a little of something bit by bit. Verb/noun.","xs":"The mouse nibbled a hole through the sack of grain.","xh":"चूहे ने अनाज की बोरी कुतरकर उसमें छेद कर दिया।","t":"चूहे की तरह NIB-NIB छोटे कौर.","note":"","s":[{"en":"She nibbled the biscuit.","hi":"उसने बिस्कुट कुतरा।"}],"loc":"Section 1 · Column 1 · #1","c":"#00897b"},{"w":"Gobble","hi":"निगल जाना","en":"eat fast and hungrily","ex":"To eat something very quickly, swallowing large pieces hungrily (gobble up/down); also the noisy throat sound a turkey makes. Verb.","xs":"The hungry boy gobbled down his dinner in five minutes.","xh":"भूखे लड़के ने पाँच मिनट में अपना खाना गटक दिया।","t":"टर्की \"गोबल-गोबल\" कहकर खाना तेज़ी से निगलती है.","note":"","s":[{"en":"He gobbled down his lunch.","hi":"उसने खाना गटक दिया।"}],"loc":"Section 1 · Column 1 · #1","c":"#ef6c00"},{"w":"Muzzle","hi":"मुहरा / थूथन","en":"mouth cover for animal; gun mouth","ex":"A cover strapped over an animal's mouth (especially a dog's) to stop it biting or barking; also the open end of a gun barrel. As a verb, to muzzle someone means to stop them expressing opinions freely. Noun/verb.","xs":"The angry dog was fitted with a muzzle so that it could not bite anyone.","xh":"गुस्सैल कुत्ते पर मुहरा लगा दिया गया ताकि वह किसी को काट न सके।","t":"MUZZLE मुँह (MOUTH) ढकता है — \"मुँह बंद!\"","note":"","s":[{"en":"Put a muzzle on the dog.","hi":"कुत्ते पर मुहरा लगाओ।"}],"loc":"Section 1 · Column 2 · #1","c":"#3949ab"},{"w":"Sprint","hi":"तेज़ दौड़","en":"run at full speed","ex":"To run at top speed over a short distance; a short, very fast race such as the 100-metre sprint. Verb/noun.","xs":"He had to sprint to catch the departing bus.","xh":"छूटती बस पकड़ने के लिए उसे पूरी रफ़्तार से दौड़ना पड़ा।","t":"SPRINT = SPeeD + RUN + TIME = फटाफट दौड़.","note":"","s":[{"en":"He sprinted for the bus.","hi":"वह बस के लिए तेज़ दौड़ा।"}],"loc":"Section 1 · Column 2 · #1","c":"#c62828"},{"w":"Indecent","hi":"अश्लील / अनुचित","en":"offensive to modesty","ex":"Morally shocking or offensive according to accepted standards of behaviour, especially regarding sex or clothing; 'indecent haste' means unacceptably fast. Adjective.","xs":"He was fined for making indecent gestures at women in the bus.","xh":"बस में महिलाओं के साथ अश्लील इशारे करने पर उस पर जुर्माना हुआ।","t":"IN + DECENT = DECENT (शालीन) नहीं.","note":"","s":[{"en":"Indecent jokes are not allowed.","hi":"अश्लील मज़ाक मना है।"}],"loc":"Section 1 · Column 2 · #1","c":"#2e7d32"},{"w":"Weary","hi":"थका हुआ","en":"very tired","ex":"Very tired, especially after long work, travel or effort; also having lost patience or interest in something (weary of excuses). Adjective; as a verb, to weary someone means to tire them out.","xs":"After the twelve-hour journey, the weary travellers just wanted to sleep.","xh":"बारह घंटे के सफ़र के बाद थके हारे यात्री सिर्फ़ सोना चाहते थे।","t":"WEAR: कपड़े की तरह थकान से \"wear out\" हो जाना.","note":"","s":[{"en":"After the trek he was weary.","hi":"लंबी यात्रा बाद वह थक गया।"}],"loc":"Section 1 · Column 2 · #1","c":"#6d4c41"},{"w":"Ramble","hi":"भटकना / बिना-सिरे की बातें","en":"wander or talk aimlessly","ex":"To walk for pleasure without a fixed direction; of speech or writing, to go on at length in a confused, unorganized way without a clear point. Verb/noun.","xs":"The old professor rambled from one topic to another during his lecture.","xh":"व्याख्यान के दौरान बूढ़े प्रोफेसर एक विषय से दूसरे विषय पर बिना सिरे के बढ़ते रहे।","t":"RAMBLE ≈ ROAM: ज़बान ROAM (घूमती) रहे = बकबक.","note":"","s":[{"en":"Grandpa rambles about old days.","hi":"दादाजी पुरानी बातें बिना सिरे की करते हैं।"}],"loc":"Section 1 · Column 2 · #1","c":"#e63980"},{"w":"Prosecution","hi":"अभियोजन","en":"legal action against accused","ex":"The legal process of charging someone with a crime and trying to prove their guilt in court; also the lawyers and officials who do this (the prosecution), opposite of the defence. Noun.","xs":"The prosecution presented strong evidence against the accused.","xh":"अभियोजन पक्ष ने आरोपी के खिलाफ़ पुख्ता सबूत पेश किए।","t":"PRO + SECUTE: अदालत में PROVE करना कि अपराधी है.","note":"","s":[{"en":"The prosecution presented evidence.","hi":"अभियोजन ने सबूत पेश किए।"}],"loc":"Section 1 · Column 2 · #1","c":"#7c4dff"},{"w":"Debile","hi":"कमज़ोर","en":"weak, feeble","ex":"Weak and lacking physical or mental strength; frail. A formal, literary adjective.","xs":"The long illness left the old man debile and unable to walk without help.","xh":"लंबी बीमारी ने बूढ़े आदमी को दुर्बल कर दिया, अब वह बिना सहारे चल नहीं सकता था।","t":"DEBILITY (कमज़ोरी) से — DEBILE = दुर्बल.","note":"","s":[{"en":"The debile old man walked slowly.","hi":"कमज़ोर बुज़ुर्ग धीरे चला।"}],"loc":"Section 1 · Column 2 · #1","c":"#00897b"},{"w":"Squalid","hi":"गंदा-मैला","en":"filthy, miserable","ex":"Extremely dirty and unpleasant, especially because of poverty or neglect; also used for shameful, immoral behaviour or conditions. Adjective.","xs":"The workers lived in squalid rooms with no clean water.","xh":"मज़दूर बिना साफ़ पानी वाले गंदे कमरों में रहते थे।","t":"SQUALOR (गंदगी) से — SQUALID = मैला-कुचैला.","note":"","s":[{"en":"They lived in a squalid hut.","hi":"वे गंदी झोपड़ी में रहते थे।"}],"loc":"Section 1 · Column 2 · #1","c":"#ef6c00"},{"w":"Contemptuous","hi":"तिरस्कारपूर्ण","en":"showing contempt (deep dislike)","ex":"Feeling or showing that you have no respect for someone or something and consider them worthless or beneath you. Adjective, often 'contemptuous of something'; noun: contempt.","xs":"She gave a contemptuous glance at his cheap imitation watch.","xh":"उसकी सस्ती नकली घड़ी की ओर उसने तिरस्कार भरी नज़र डाली।","t":"CONTEMPT ≈ \"कंटेंट नहीं\" — घृणा भरा रवैया.","note":"","s":[{"en":"He gave a contemptuous laugh.","hi":"उसने घृणा भरी हँसी हँसी।"}],"loc":"Section 1 · Column 2 · #1","c":"#3949ab"},{"w":"Cease","hi":"रुकना","en":"stop","ex":"To stop happening or doing something; to come to an end. A formal word (opposite: commence); 'ceasefire' means an agreement to stop fighting. Verb.","xs":"The two armies agreed to cease fire at midnight.","xh":"दोनों सेनाओं ने आधी रात को गोलाबारी बंद करने पर सहमति दी।","t":"CEASEFIRE = युद्ध CEASE (रुकना).","note":"","s":[{"en":"The rain ceased at noon.","hi":"दोपहर में बारिश रुक गई।"}],"loc":"Section 1 · Column 2 · #1","c":"#c62828"},{"w":"Usher","hi":"सूत्रधार / मार्गदर्शक","en":"person who guides to seats","ex":"To politely show someone where to go, leading them into a place (usher someone in/into); also a person who guides people to their seats at weddings, concerts or court. Verb/noun.","xs":"An attendant ushered the guests to their seats in the hall.","xh":"एक कर्मचारी ने मेहमानों को हॉल में उनकी सीटों तक पहुँचाया।","t":"\"YOU-SHER\": आपको (YOU) अंदर ले जाने वाला शेरपा.","note":"","s":[{"en":"The usher showed us our seats.","hi":"सूत्रधार ने हमें सीट दिखाई।"}],"loc":"Section 1 · Column 2 · #1","c":"#2e7d32"},{"w":"Inquisitive","hi":"जिज्ञासु","en":"curious, always asking","ex":"Curious and eager to learn or know things; sometimes too eager, asking many questions about other people's private matters. Adjective.","xs":"The inquisitive child kept asking how the aeroplane stayed in the sky.","xh":"जिज्ञासु बच्चा बार-बार पूछता रहा कि हवाई जहाज़ आसमान में कैसे रुकता है।","t":"INQUIRY = जाँच-पड़ताल — सवालों की झड़ी लगाने वाला.","note":"","s":[{"en":"Children are inquisitive by nature.","hi":"बच्चे स्वभाव से जिज्ञासु हैं।"}],"loc":"Section 1 · Column 2 · #1","c":"#6d4c41"},{"w":"Expedient","hi":"सुविधाजनक उपाय","en":"convenient (though maybe improper)","ex":"Useful and helpful for achieving a purpose, even if it is not fair or moral; a quick, convenient means that may involve compromise. Adjective/noun.","xs":"Lying to the press seemed politically expedient, but it damaged his honesty.","xh":"प्रेस से झूठ बोलना राजनीतिक रूप से फ़ायदेमंद लगा, पर इससे उसकी ईमानदारी को नुकसान हुआ।","t":"EXPEDITE (जल्दी निपटाना) से — काम जल्दी निपटाने वाला उपाय.","note":"","s":[{"en":"Lying seemed expedient but was wrong.","hi":"झूठ सुविधाजनक लगा पर गलत था।"}],"loc":"Section 1 · Column 2 · #1","c":"#e63980"},{"w":"Asperity","hi":"कठोरता","en":"harshness of tone/manner","ex":"Harshness or roughness of manner or tone; sharp unfriendliness in speech. It can also mean the roughness of a surface in technical use. Formal noun.","xs":"'Mind your own business,' she said with asperity.","xh":"'अपने काम से काम रखो,' उसने कड़वाहट भरे स्वर में कहा।","t":"ASPERIN कड़वा होता है — ज़ुबान का कड़वापन = कठोरता.","note":"","s":[{"en":"He spoke with asperity.","hi":"वह कठोर स्वर में बोला।"}],"loc":"Section 1 · Column 2 · #1","c":"#7c4dff"},{"w":"Virility","hi":"पौरुष शक्ति","en":"manly strength","ex":"Manliness; the physical and sexual strength and energy traditionally considered typical of a man; also vigour or forcefulness, as of writing or speech. Noun; adjective: virile.","xs":"In old cultures, a deep voice was seen as a sign of virility.","xh":"पुरानी संस्कृतियों में गहरी आवाज़ को पुरुषत्व की निशानी माना जाता था।","t":"VIRat Kohli जैसी ताकत-ऊर्जा.","note":"","s":[{"en":"Exercise boosts virility.","hi":"व्यायाम पौरुष शक्ति बढ़ाता है।"}],"loc":"Section 1 · Column 2 · #1","c":"#00897b"},{"w":"Spry","hi":"फुर्तीला","en":"active and lively (esp. old people)","ex":"Especially of an old person: active, lively and able to move quickly and easily despite age. Adjective.","xs":"The spry old man still cycles to the market every morning.","xh":"चुस्त-फुर्तीला बूढ़ा आदमी अब भी हर सुबह साइकिल से बाज़ार जाता है।","t":"SPRY ≈ SPRING: उछलता-कूदता.","note":"","s":[{"en":"The spry old man climbed the stairs.","hi":"फुर्तीला बुज़ुर्ग सीढ़ियाँ चढ़ गया।"}],"loc":"Section 1 · Column 2 · #1","c":"#ef6c00"},{"w":"Sleuth","hi":"जासूस","en":"detective","ex":"A detective; a person who investigates and solves crimes or mysteries. Noun, slightly playful or literary; also a verb meaning to track down.","xs":"The young sleuth solved the mystery before the police did.","xh":"युवा जासूस ने पुलिस से पहले ही रहस्य सुलझा लिया।","t":"STEALTH (चुपके-चुपके) जाँच करने वाला — Sherlock जैसा.","note":"","s":[{"en":"The sleuth solved the case.","hi":"जासूस ने मामला सुलझा लिया।"}],"loc":"Section 1 · Column 2 · #1","c":"#3949ab"},{"w":"Employ","hi":"नौकरी देना / इस्तेमाल करना","en":"hire; put to use","ex":"To pay someone to work for you; to use something such as a method, tool or skill for a particular purpose. Verb.","xs":"The factory employs two hundred workers from the nearby villages.","xh":"कारख़ाना आसपास के गाँवों के दो सौ मज़दूरों को नौकरी देता है।","t":"EMPLOY = काम में लगाना (रोज़गार).","note":"","s":[{"en":"The company employs 200 people.","hi":"कंपनी 200 लोगों को रोज़गार देती है।"}],"loc":"Section 1 · Column 2 · #1","c":"#c62828"},{"w":"Idyllic","hi":"सुखद-शांत (प्राकृतिक)","en":"charmingly peaceful","ex":"Extremely pleasant, simple and beautiful, like a peaceful scene from a story; perfect in a charming way — idyllic village life, an idyllic holiday. Adjective; noun: idyll.","xs":"They spent an idyllic week in a small cottage by the lake.","xh":"उन्होंने झील किनारे एक छोटी झोपड़ी में स्वर्ग जैसा सुखद हफ़्ता बिताया।","t":"IDLI-सम्बर की शांत गाँव की सुबह = idyllic जीवन.","note":"","s":[{"en":"They spent an idyllic week in the hills.","hi":"उन्होंने पहाड़ों में सुखद सप्ताह बिताया।"}],"loc":"Section 1 · Column 2 · #1","c":"#2e7d32"},{"w":"Stupendous","hi":"अद्भुत, विशाल","en":"amazingly great","ex":"Astonishingly large, great or impressive; amazingly good. Adjective.","xs":"The team made a stupendous comeback in the final minutes.","xh":"टीम ने आख़िरी मिनटों में अविश्वसनीय रूप से शानदार वापसी की।","t":"STUPEFY (स्तब्ध कर देना) से — जो देखकर सब STUN हो जाएँ.","note":"","s":[{"en":"The show was stupendous.","hi":"शो अद्भुत था।"}],"loc":"Section 1 · Column 2 · #1","c":"#6d4c41"},{"w":"Consummate","hi":"पूर्ण, निपुण","en":"perfect, masterly","ex":"Perfect and complete in every detail; showing total mastery of a skill — a consummate artist, actor or liar. Adjective. As a verb, to consummate means to complete or formalize something such as a marriage or agreement.","xs":"With consummate skill, the surgeon completed the ten-hour operation.","xh":"अपूर्व निपुणता के साथ सर्जन ने दस घंटे का ऑपरेशन पूरा किया।","t":"CONSUME पूरा करना — skill पूरी हो चुकी = दक्ष.","note":"","s":[{"en":"She is a consummate singer.","hi":"वह निपुण गायिका है।"}],"loc":"Section 1 · Column 2 · #1","c":"#e63980"},{"w":"Crouch","hi":"दुबकना","en":"bend low","ex":"To bend your legs and lower your body close to the ground, often to hide, to jump, or to avoid something. Verb/noun.","xs":"The tiger crouched low in the grass before attacking the deer.","xh":"हिरण पर हमला करने से पहले बाघ घास में झुककर दुबक गया।","t":"COUCH पर पालथी मारकर दुबक जाना.","note":"","s":[{"en":"The cat crouched before jumping.","hi":"छलाँग से पहले बिल्ली दुबकी।"}],"loc":"Section 1 · Column 2 · #1","c":"#7c4dff"},{"w":"Horrid","hi":"भयानक","en":"very unpleasant","ex":"Very unpleasant, nasty or disgusting; also (of children) badly behaved. Informal adjective.","xs":"The kitchen smelled of horrid, rotten eggs.","xh":"रसोई में बहुत बदबूदार, सड़े अंडों जैसी गंध आ रही थी।","t":"HORROR से — डरावना/घटिया.","note":"","s":[{"en":"The food tasted horrid.","hi":"खाना बेहद घटिया लगा।"}],"loc":"Section 1 · Column 2 · #1","c":"#00897b"},{"w":"Raunchy","hi":"अश्लील / घटिया","en":"vulgar, crude","ex":"Coarse and sexually explicit — raunchy jokes or films; also shabby or untidy in appearance. Informal adjective.","xs":"He was fired for sending raunchy jokes on the office email group.","xh":"ऑफ़िस के ईमेल ग्रुप पर अश्लील चुटकुले भेजने के लिए उसे नौकरी से निकाल दिया गया।","t":"RAUNCHY video = अश्लील/रफ्ती content.","note":"","s":[{"en":"He told a raunchy joke.","hi":"उसने अश्लील चुटकुला सुनाया।"}],"loc":"Section 1 · Column 2 · #1","c":"#ef6c00"},{"w":"Liable","hi":"उत्तरदायी / प्रवण","en":"legally responsible; likely to","ex":"Legally responsible for something (you are liable for the damage); or likely to suffer or do something unpleasant — liable to a fine, liable to catch cold. Adjective.","xs":"Drivers who break traffic rules are liable to pay a heavy fine.","xh":"यातायात नियम तोड़ने वाले चालकों पर भारी जुर्माना लग सकता है।","t":"LIABILITY (देयता) से — ज़िम्मेदारी.","note":"","s":[{"en":"Drivers are liable for accidents.","hi":"दुर्घटना के लिए चालक ज़िम्मेदार हैं।"}],"loc":"Section 1 · Column 2 · #1","c":"#3949ab"},{"w":"Indelible","hi":"अमिट","en":"permanent, cannot be erased","ex":"Impossible to remove, erase or forget — an indelible ink mark on cloth, an indelible memory. Adjective.","xs":"The trip to the Himalayas left an indelible impression on her mind.","xh":"हिमालय की यात्रा ने उसके मन पर अमिट छाप छोड़ी।","t":"IN + DELETE-able: DELETE न हो सकने वाला.","note":"","s":[{"en":"The trip left indelible memories.","hi":"यात्रा ने अमिट यादें दीं।"}],"loc":"Section 1 · Column 2 · #1","c":"#c62828"},{"w":"Groovy","hi":"शानदार / मस्त","en":"cool, enjoyable","ex":"Very fashionable, enjoyable and attractive — slang popular in the 1960s–70s; today usually used playfully or for retro style. Adjective.","xs":"The DJ played groovy old songs from the seventies.","xh":"डीजे ने सत्तर के दशक के मज़ेदार पुराने गाने बजाए।","t":"GROOVE (music की beat) पर झूमना = मस्ती.","note":"","s":[{"en":"That's a groovy song!","hi":"यह शानदार गाना है!"}],"loc":"Section 1 · Column 2 · #1","c":"#2e7d32"},{"w":"Camaraderie","hi":"मित्रता-भाव","en":"friendly trust in a group","ex":"A feeling of friendly trust and easy companionship among people who spend a lot of time or work together. Noun.","xs":"Long night shifts built a strong camaraderie among the nurses.","xh":"लंबी रात की ड्यूटियों ने नर्सों के बीच गहरी मित्रता और सहयोग की भावना बना दी।","t":"COMRADE (साथी) से — साथियों का भाईचारा.","note":"","s":[{"en":"The team's camaraderie was visible.","hi":"टीम की आपसी मित्रता झलकती थी।"}],"loc":"Section 1 · Column 2 · #1","c":"#6d4c41"},{"w":"Prey","hi":"शिकार","en":"animal hunted by another","ex":"An animal that is hunted and killed by another for food; any victim of an attack, deception or harm (fall prey to fraud). As a verb, to prey on someone means to hunt them or exploit their weakness. Noun/verb.","xs":"Deer and rabbits are the natural prey of the leopard.","xh":"हिरण और खरगोश तेंदुए का स्वाभाविक शिकार होते हैं।","t":"PREY ≈ PRAY: शिकार बचने के लिए प्रार्थना करता है.","note":"","s":[{"en":"The deer fell prey to the lion.","hi":"हिरण शेर का शिकार बन गया।"}],"loc":"Section 1 · Column 3 · #1","c":"#e63980"},{"w":"Devious","hi":"कपटपूर्ण / टेढ़ा","en":"dishonest; tricky","ex":"Using dishonest tricks and indirect plans to get what you want; cunning and misleading. It can also describe a route that is winding and not direct. Adjective.","xs":"The devious clerk secretly changed the accounts to hide his theft.","xh":"चालबाज़ क्लर्क ने अपनी चोरी छिपाने के लिए चुपके से हिसाब बदल दिया।","t":"DEVIATE (रास्ता भटकना) से — टेढ़ी चाल.","note":"","s":[{"en":"He took a devious route to cheat them.","hi":"उसने धोखा देने के लिए कपटपूर्ण रास्ता चुना।"}],"loc":"Section 1 · Column 3 · #1","c":"#7c4dff"},{"w":"Relay","hi":"आगे भेजना","en":"pass along; relay race","ex":"To pass something — a message, a signal, a ball — from one person or place to the next; a team race where runners take turns (relay race); an electrical switch; or a live broadcast of an event happening elsewhere. Verb/noun.","xs":"The news of the rescue was relayed to the families by the police.","xh":"बचाव की खबर पुलिस ने परिवारों तक पहुँचाई।","t":"RELAY race में बैटन आगे सौंपना = message आगे भेजना.","note":"","s":[{"en":"Please relay the message to him.","hi":"संदेश उसे आगे भेज दो।"}],"loc":"Section 1 · Column 3 · #1","c":"#00897b"},{"w":"Cramped","hi":"संकुचित","en":"small and tight","ex":"Not having enough space; squeezed and uncomfortable — a cramped room, a cramped train, even cramped handwriting. Adjective.","xs":"Five students shared one cramped hostel room.","xh":"पाँच छात्र एक तंग हॉस्टल कमरे में रहते थे।","t":"CRAMP (मरोड़) जैसी तंग जगह.","note":"","s":[{"en":"The room was cramped.","hi":"कमरा संकुचित था।"}],"loc":"Section 1 · Column 3 · #1","c":"#ef6c00"},{"w":"Smite","hi":"ज़ोर का प्रहार करना","en":"strike hard","ex":"To hit or strike hard, often as divine punishment; a literary or archaic verb (smite – smote – smitten). In modern English, 'smitten' usually means deeply in love with someone. Verb.","xs":"In the old stories, the gods smote the wicked city with fire.","xh":"पुरानी कथाओं में देवताओं ने दुष्ट नगरी पर आग बरसा दी थी।","t":"SMITE ≈ SMASH + BITE — गदा जैसा वार.","note":"","s":[{"en":"The hero smote the demon.","hi":"नायक ने राक्षस पर प्रहार किया।"}],"loc":"Section 1 · Column 3 · #1","c":"#3949ab"},{"w":"Allotment","hi":"आवंटन","en":"assigned share","ex":"An amount of something — money, land, time or work — officially given or assigned to a person, group or purpose. Noun; verb: allot.","xs":"Each student received a small allotment of land for the school garden.","xh":"स्कूल के बगीचे के लिए हर छात्र को थोड़ी ज़मीन आवंटित हुई।","t":"ALLOT = बाँटना → allotment = हिस्सा.","note":"","s":[{"en":"His land allotment was finalised.","hi":"उसकी भूमि का आवंटन तय हुआ।"}],"loc":"Section 1 · Column 3 · #1","c":"#c62828"},{"w":"Lacklustre","hi":"निरस, बेजान","en":"dull, without shine","ex":"Dull; without energy, brightness or excitement — a lacklustre performance, lacklustre eyes. British spelling (American: lackluster). Adjective.","xs":"The team gave a lacklustre performance and lost the match easily.","xh":"टीम ने बेजान प्रदर्शन किया और आसानी से मैच हार गई।","t":"LACK + LUSTRE (चमक): चमक की कमी.","note":"","s":[{"en":"The team gave a lacklustre show.","hi":"टीम का प्रदर्शन निरस था।"}],"loc":"Section 1 · Column 3 · #1","c":"#2e7d32"},{"w":"Deranged","hi":"असंतुलित मन का","en":"insane","ex":"Mentally ill in a wild, uncontrolled way; behaving completely irrationally. Also used loosely for anything thrown into disorder. Adjective.","xs":"The deranged man kept shouting at strangers on the road.","xh":"पागल आदमी सड़क पर अजनबियों पर चिल्लाता रहा।","t":"DE + RANGE: दिमाग़ RANGE से बाहर.","note":"","s":[{"en":"The deranged man shouted at walls.","hi":"असंतुलित आदमी दीवारों से चिल्लाता था।"}],"loc":"Section 1 · Column 3 · #1","c":"#6d4c41"},{"w":"Clade","hi":"वंश-शाखा","en":"group from one common ancestor (biology)","ex":"In biology, a group of species that all descend from one common ancestor — a natural 'branch' on the tree of life. Technical noun used in classification.","xs":"Birds belong to the same clade as certain meat-eating dinosaurs.","xh":"पक्षी कुछ मांसाहारी डायनासोर वाले ही वंश-समूह (क्लेड) में आते हैं।","t":"CLADE ≈ CLAN: एक पूर्वज का कुनबा.","note":"","s":[{"en":"Birds form a clade with dinosaurs.","hi":"पक्षी डायनासोर के वंश-समूह में हैं।"}],"loc":"Section 1 · Column 3 · #1","c":"#e63980"},{"w":"Vicinity","hi":"आस-पास","en":"nearby area","ex":"The area very close to a place; the surrounding neighbourhood — 'in the vicinity of the station'. Formal noun.","xs":"Police searched every house in the vicinity of the crime scene.","xh":"पुलिस ने अपराध स्थल के आसपास के हर घर की तलाशी ली।","t":"VICINITY ≈ TWENTY: बीस मीटर के दायरे में = नज़दीक.","note":"","s":[{"en":"There is a park in the vicinity.","hi":"आस-पास एक पार्क है।"}],"loc":"Section 1 · Column 3 · #1","c":"#7c4dff"},{"w":"Sedentary","hi":"बैठे रहने वाला","en":"sitting most of the time","ex":"Spending most of the time sitting down with little physical activity; also describes work done while sitting, or people who live in one place instead of moving around. Adjective.","xs":"Doctors say a sedentary lifestyle is the main cause of his obesity.","xh":"डॉक्टर कहते हैं कि बैठे रहने वाली जीवनशैली ही उसके मोटापे की मुख्य वजह है।","t":"SEDAN car में बैठे रहना = न हिलना.","note":"","s":[{"en":"A sedentary life harms health.","hi":"बैठे रहने वाली जिंदगी सेहत बिगाड़ती है।"}],"loc":"Section 1 · Column 3 · #1","c":"#00897b"},{"w":"Metonymy","hi":"उपनाम-अलंकार","en":"related name replaces the real one","ex":"A figure of speech in which the name of one thing stands for something closely connected with it — 'the Crown' for the monarchy, 'the pen' for writing and writers. Technical noun in rhetoric.","xs":"In 'the White House announced…', the building's name is metonymy for the US President's office.","xh":"'व्हाइट हाउस ने घोषणा की' में इमारत का नाम अमेरिकी राष्ट्रपति कार्यालय के लिए सांकेतिक नाम (मेटोनिमी) है।","t":"META + NYM (name): \"दिल्ली\" = सरकार; नाम की जगह संबंधित नाम.","note":"","s":[{"en":"\"The Crown\" means the monarchy.","hi":"\"सिंहासन\" से राजसत्ता बोध होती है।"}],"loc":"Section 1 · Column 3 · #1","c":"#ef6c00"},{"w":"Fetid","hi":"दुर्गंधयुक्त","en":"foul-smelling","ex":"Smelling extremely bad and stale, like rotting matter; having a strong, offensive odour. Literary adjective.","xs":"The fetid smell from the blocked drain filled the whole street.","xh":"जाम हो चुके नाले की दुर्गंध पूरी गली में फैल गई।","t":"FEET + ID: पैरों की बदबू जैसी दुर्गंध.","note":"","s":[{"en":"The fetid drain stank.","hi":"गंदी नाली बदबूदार थी।"}],"loc":"Section 1 · Column 3 · #1","c":"#3949ab"},{"w":"Paltry","hi":"नगण्य","en":"very small, worthless (amount)","ex":"Ridiculously small or worthless — a paltry sum of money, paltry excuses. Adjective.","xs":"After a month's work he was paid a paltry five hundred rupees.","xh":"महीने भर की मेहनत के बाद उसे मात्र पाँच सौ रुपये मिले, जो बहुत थोड़े थे।","t":"POULTRY के छोटे चूजे जितना = बहुत छोटा.","note":"","s":[{"en":"He got a paltry reward.","hi":"उसे नगण्य इनाम मिला।"}],"loc":"Section 1 · Column 3 · #1","c":"#c62828"},{"w":"Ransack","hi":"छानमारी/लूट","en":"search roughly; loot","ex":"To search a place thoroughly, turning everything upside down, often while stealing; also to search hard for information. Verb.","xs":"Burglars ransacked the house and took away all the jewellery.","xh":"चोरों ने पूरा घर उलट-पुलट कर सारे आभूषण ले गए।","t":"RAN + SACK: चोर भागते समय सब बोरियाँ (sack) उलट गए.","note":"","s":[{"en":"Thieves ransacked the house.","hi":"चोरों ने घर उलट-पुलट दिया।"}],"loc":"Section 1 · Column 3 · #1","c":"#2e7d32"},{"w":"Amorous","hi":"प्रेम/कामुक भाव का","en":"showing love or desire","ex":"Showing strong sexual desire or romantic love — amorous glances, an amorous couple. Formal or literary adjective.","xs":"The film's amorous scenes were cut before release.","xh":"फ़िल्म के प्रेम-प्रदर्शन वाले दृश्य रिलीज़ से पहले हटा दिए गए।","t":"AMOR = प्रेम (French: l'amour).","note":"","s":[{"en":"They exchanged amorous glances.","hi":"उन्होंने प्रेम भरी निगाहें बदलीं।"}],"loc":"Section 1 · Column 3 · #1","c":"#6d4c41"},{"w":"Ascribe","hi":"किसी को देना/आरोपित करना","en":"attribute to","ex":"To say or believe that something was caused by, created by, or belongs to a particular person or thing — ascribe X to Y. Formal verb.","xs":"Historians ascribe this painting to the artist's early period.","xh":"इतिहासकार इस चित्रकृति को कलाकार के शुरुआती दौर की रचना मानते हैं।","t":"A + SCRIBE: लेखक (scribe) के नाम रचना लिखना.","note":"","s":[{"en":"This quote is ascribed to Gandhi.","hi":"यह कथन गांधीजी को दिया जाता है।"}],"loc":"Section 1 · Column 3 · #1","c":"#e63980"},{"w":"Cupidity","hi":"धन-लालच","en":"greed for wealth","ex":"Greed for money or possessions; strong, selfish desire for wealth. Formal noun — do not confuse with Cupid, the god of love.","xs":"Cupidity drove the manager to forge the company's accounts.","xh":"धन के लोभ ने प्रबंधक को कंपनी के हिसाब फर्ज़ी बनाने पर उकसाया।","t":"CUP-idity: CUP (जेब/प्याला) पैसों से भरने की होड़.","note":"","s":[{"en":"Cupidity ruined his ethics.","hi":"लालच ने उसकी नैतिकता मिटा दी।"}],"loc":"Section 1 · Column 3 · #1","c":"#7c4dff"},{"w":"Largesse","hi":"उदार दान","en":"generous giving","ex":"Generous giving of money or gifts, especially to win favour or impress people; the money or gifts so given. British spelling (American: largess). Noun.","xs":"The minister's largesse before the election was seen as bribery.","xh":"चुनाव से पहले मंत्री की दान-बाँट को रिश्वत माना गया।","t":"LARGE + दिल = बड़े दिल का दान.","note":"","s":[{"en":"The king's largesse amazed all.","hi":"राजा की उदारता ने सब चकित कर दिया।"}],"loc":"Section 1 · Column 3 · #1","c":"#00897b"},{"w":"Approbation","hi":"अनुमोदन","en":"official approval, praise","ex":"Official or public approval and praise. Formal noun (opposite: disapprobation).","xs":"The new policy won the approbation of most citizens.","xh":"नई नीति को अधिकांश नागरिकों की स्वीकृति और सराहना मिली।","t":"APPROVAL + APPRECIATION = APPROBATION.","note":"","s":[{"en":"The plan won his approbation.","hi":"योजना को उसकी स्वीकृति मिली।"}],"loc":"Section 1 · Column 3 · #1","c":"#ef6c00"},{"w":"Inchoate","hi":"अधूरा, शुरुआती","en":"just begun, unformed","ex":"Just begun and not fully formed or developed; vague and unorganized — an inchoate plan, inchoate anger. Formal adjective.","xs":"His inchoate ideas slowly took the shape of a full novel.","xh":"उसके अधूरे-से विचार धीरे-धीरे एक पूरे उपन्यास का रूप लेने लगे।","t":"IN + CHOCOLATE: चॉकलेट अभी बन ही रही है = अधूरी.","note":"","s":[{"en":"The plan is still inchoate.","hi":"योजना अभी प्रारंभिक अवस्था में है।"}],"loc":"Section 1 · Column 3 · #1","c":"#3949ab"},{"w":"Improvident","hi":"फिज़ूलखर्च, अदूरदर्शी","en":"not saving for future","ex":"Not planning or saving for the future; careless with money and resources. Adjective (opposite: provident).","xs":"The improvident youth spent his entire inheritance within a year.","xh":"बेफ़िक्र युवक ने अपनी पूरी विरासत एक ही साल में उड़ा दी।","t":"IM + PROVIDENT FUND: PF न बनाने वाला = अदूरदर्शी.","note":"","s":[{"en":"Improvident spending broke him.","hi":"फिज़ूलखर्ची ने उसे कंगाल किया।"}],"loc":"Section 1 · Column 3 · #1","c":"#c62828"},{"w":"Adipose","hi":"चर्बी का","en":"relating to fat tissue","ex":"Relating to animal or body fat; adipose tissue is the fat that stores energy under the skin and around organs. Technical adjective.","xs":"Excess sugar in the diet is stored as adipose tissue in the body.","xh":"भोजन में अतिरिक्त चीनी शरीर में वसा ऊतक के रूप में जमा हो जाती है।","t":"\"अदि-पोसा\": हलवाई का तला पोसा = चर्बी.","note":"","s":[{"en":"Adipose tissue stores fat.","hi":"वसा ऊतक चर्बी जमा करता है।"}],"loc":"Section 1 · Column 3 · #1","c":"#2e7d32"},{"w":"Glutinous","hi":"चिपचिपा","en":"sticky like glue","ex":"Sticky like glue — glutinous rice is the sticky rice used in Asian sweets and dumplings. Adjective.","xs":"The chef used glutinous rice to make the sweet dumplings.","xh":"रसोइए ने मीठे पिठे बनाने के लिए चिपचिपा चावल इस्तेमाल किया।","t":"GLUE से GLUTINOUS — गोंद जैसा.","note":"","s":[{"en":"The glutinous rice was sticky.","hi":"चिपचिपा चावल गोंद जैसा था।"}],"loc":"Section 1 · Column 3 · #1","c":"#6d4c41"},{"w":"Rancour","hi":"पुराना द्वेष","en":"deep, lasting bitterness","ex":"A feeling of deep, long-lasting bitterness and ill will towards someone, kept alive after a quarrel or injury. Formal noun; adjective: rancorous.","xs":"Even after ten years, he felt no rancour towards the friend who betrayed him.","xh":"दस साल बाद भी उसे उस दोस्त से, जिसने उसे धोखा दिया था, कोई द्वेष नहीं था।","t":"RANCID (बासी घी) जैसी बासी नफ़रत.","note":"","s":[{"en":"He bore no rancour against critics.","hi":"वह आलोचकों से द्वेष नहीं रखता था।"}],"loc":"Section 1 · Column 3 · #1","c":"#e63980"},{"w":"Rabble","hi":"उपद्रवी भीड़","en":"disorderly crowd","ex":"A disorganized crowd of noisy, disorderly people; used (often insultingly) for the common masses regarded as worthless — 'the rabble'. Verb 'rabble-rouse' means to stir up such a crowd. Noun.","xs":"The king's guards drove the angry rabble away from the palace gate.","xh":"राजा के पहरेदारों ने महल के दरवाज़े से गुस्सैल भीड़ को खदेड़ दिया।","t":"RUBBLE जैसी बिखरी हुई भीड़.","note":"","s":[{"en":"The rabble broke the gates.","hi":"उपद्रवी भीड़ ने गेट तोड़ दिए।"}],"loc":"Section 1 · Column 3 · #1","c":"#7c4dff"},{"w":"Rubbish","hi":"कचरा / बकवास","en":"waste; nonsense","ex":"Things that are no longer wanted or useful — waste material, garbage, litter; also talk or ideas that are complete nonsense and deserve no respect. British English strongly prefers rubbish over garbage. Noun.","xs":"Please put the rubbish in the bin, not on the road.","xh":"कृपया कचरा बिन में डालें, सड़क पर नहीं।","t":"RUB + BISH — उठाकर फेंकने वाला कचरा.","note":"","s":[{"en":"Don't talk rubbish.","hi":"बकवास मत बोलो।"}],"loc":"Section 1 · Column 3 · #1","c":"#00897b"},{"w":"Havoc","hi":"तबाही","en":"widespread destruction","ex":"Widespread destruction, chaos and confusion; violent disorder. Common pattern: 'wreak havoc on something' — to cause great damage. Noun.","xs":"The cyclone wreaked havoc on the coastal villages.","xh":"चक्रवात ने तटीय गाँवों में भारी तबाही मचा दी।","t":"\"हवा-चक्कर\": आँधी का तांडव = havoc.","note":"","s":[{"en":"The storm wreaked havoc.","hi":"तूफान ने तबाही मचाई।"}],"loc":"Section 1 · Column 3 · #1","c":"#ef6c00"},{"w":"Imprudent","hi":"विवेकहीन","en":"unwise, rash","ex":"Not wise or careful; acting without thinking of the possible bad results. A formal adjective (opposite: prudent); noun: imprudence.","xs":"It was imprudent of him to lend all his savings to a stranger.","xh":"अपनी सारी बचत अजनबी को उधार देना उसकी बेवकूफ़ी थी।","t":"IM + PRUDENT (समझदार) = नासमझ.","note":"","s":[{"en":"It was imprudent to drive so fast.","hi":"इतनी तेज़ रफ़्तार विवेकहीनता थी।"}],"loc":"Section 1 · Column 3 · #1","c":"#3949ab"},{"w":"Competency","hi":"दक्षता","en":"ability to do a job well","ex":"The ability, skill or knowledge needed to do a job or task successfully; the legal authority of a court to hear a case. Noun; adjective: competent.","xs":"New teachers must prove their competency before getting a permanent post.","xh":"नए शिक्षकों को स्थायी पद मिलने से पहले अपनी योग्यता सिद्ध करनी होती है।","t":"COMPETITION लड़ने लायक = योग्यता.","note":"","s":[{"en":"Her competency in English grew.","hi":"उसकी अंग्रेज़ी दक्षता बढ़ी।"}],"loc":"Section 1 · Column 4 · #1","c":"#c62828"},{"w":"Propitious","hi":"शुभ, अनुकूल","en":"favorable","ex":"Giving a good sign of success; favourable and lucky — a propitious time to invest, propitious weather for sailing. Formal adjective (opposite: unpropitious).","xs":"The clouds and cool wind made it a propitious day for sowing.","xh":"बादल और ठंडी हवा ने बोआई के लिए शुभ दिन बना दिया।","t":"PROPER + AUSPICIOUS = शुभ अवसर.","note":"","s":[{"en":"It was a propitious moment to start.","hi":"शुरुआत के लिए शुभ क्षण था।"}],"loc":"Section 1 · Column 4 · #1","c":"#2e7d32"},{"w":"Benignant","hi":"कृपालु","en":"kind and gentle","ex":"Kind, gentle and favourable in effect; kindly in disposition. A literary cousin of benign — of a ruler, a climate, or a look. Adjective.","xs":"Under the queen's benignant rule, the poor were never left hungry.","xh":"रानी के दयालु शासन में ग़रीबों को कभी भूखा नहीं रहना पड़ता था।","t":"BE + NICE = अच्छे स्वभाव वाला.","note":"","s":[{"en":"The benignant teacher forgave us.","hi":"कृपालु शिक्षक ने क्षमा कर दी।"}],"loc":"Section 1 · Column 4 · #1","c":"#6d4c41"},{"w":"Senile","hi":"बुढ़ापे से दुर्बल मस्तिष्क","en":"mentally weak from old age","ex":"Showing the weakness, confusion and memory loss that can come with extreme old age; more loosely, worn out or feeble through age. Adjective; noun: senility.","xs":"The senile old woman often forgot her own children's names.","xh":"बुढ़ापे से कमज़ोर हो चुकी बुज़ुर्ग औरत अक्सर अपने बच्चों के नाम भी भूल जाती थी।","t":"SENIOR + WEAK: उम्र से दिमाग़ कमज़ोर.","note":"","s":[{"en":"The senile man forgot his son's name.","hi":"बुढ़ापे में वह बेटे का नाम भूल गया।"}],"loc":"Section 1 · Column 4 · #1","c":"#e63980"},{"w":"Supine","hi":"पीठ के बल लेटा","en":"lying face up; lazy/inactive","ex":"Lying flat on your back, face upwards (technical: the supine position); figuratively, showing a lazy, passive unwillingness to act — supine acceptance of injustice. Adjective.","xs":"The injured player lay supine on the field, waiting for help.","xh":"घायल खिलाड़ी मैदान पर पीठ के बल पड़ा रहा, मदद की राह देखते हुए।","t":"SOUP-पर-लेटा: सूप पीते हुए लेटा रहना.","note":"","s":[{"en":"He lay supine on the grass.","hi":"वह घास पर पीठ के बल लेटा था।"}],"loc":"Section 1 · Column 4 · #1","c":"#7c4dff"},{"w":"Lackadaisical","hi":"उदासीन, ऊर्जाहीन","en":"lacking enthusiasm","ex":"Lacking energy, enthusiasm and determination; listless and half-hearted — a lackadaisical reply, lackadaisical effort. Adjective.","xs":"His lackadaisical attitude to study cost him the scholarship.","xh":"पढ़ाई के प्रति उसका बेपरवाह, बिना जोश का रवैया उससे स्कॉलरशिप छिनवा गया।","t":"LACK + DAISY: फूल तक नहीं खिलते = बेजान रवैया.","note":"","s":[{"en":"His lackadaisical attitude cost him the job.","hi":"उदासीन रवैये से नौकरी गँवाई।"}],"loc":"Section 1 · Column 4 · #1","c":"#00897b"},{"w":"Asylum","hi":"शरण","en":"protection, shelter","ex":"Protection and shelter given to someone fleeing danger or persecution in their own country (political asylum); also an old word for a hospital or institution sheltering the mentally ill, and a safe refuge in general. Noun.","xs":"The fleeing journalist applied for political asylum in India.","xh":"भागा हुआ पत्रकार भारत में राजनीतिक शरण का आवेदन कर रहा था।","t":"ASYLUM ≈ AASHRAM: शरण देने वाली जगह.","note":"","s":[{"en":"He sought asylum abroad.","hi":"उसने विदेश में शरण माँगी।"}],"loc":"Section 1 · Column 4 · #1","c":"#ef6c00"},{"w":"Abide","hi":"पालन करना / टिके रहना","en":"obey; remain","ex":"To tolerate or bear something (usually negative: 'I can't abide rudeness'); to stay or remain somewhere; to keep faithfully to a rule or promise (abide by the decision); a literary sense of to live or dwell. Verb.","xs":"Every citizen must abide by the laws of the land.","xh":"हर नागरिक को देश के क़ानूनों का पालन करना चाहिए।","t":"ABIDE BY = नियम के साथ टिके रहना = मानना.","note":"","s":[{"en":"We must abide by the law.","hi":"हमें क़ानून मानना चाहिए।"}],"loc":"Section 1 · Column 4 · #1","c":"#3949ab"},{"w":"Dwell","hi":"निवास / अटककर सोचना","en":"live; keep thinking about","ex":"To live in a place (formal/literary: dwell in a forest); to keep thinking or talking about something, especially an unpleasant subject — dwell on the past. Verb; noun: dweller.","xs":"Try not to dwell on your old failures; look ahead instead.","xh":"अपनी पुरानी असफलताओं पर बार-बार सोचते न रहो; आगे देखो।","t":"DEW में रहने वाला (dwell) — बात पर ओस जैसे जम जाना.","note":"","s":[{"en":"Don't dwell on past mistakes.","hi":"बीती गलतियों पर मत रुको।"}],"loc":"Section 1 · Column 4 · #1","c":"#c62828"},{"w":"Primeval","hi":"आदिम","en":"of the earliest time","ex":"Belonging to the earliest age in history; extremely ancient, as if from the world's beginning — primeval forests, primeval instincts. Adjective.","xs":"Dense primeval forests covered the land before humans arrived.","xh":"इंसान के आने से पहले घने प्राचीन जंगल इस भूमि को ढके थे।","t":"PRIME + वाला = सबसे पहले वाला.","note":"","s":[{"en":"We trekked through a primeval forest.","hi":"हम आदिम जंगल से गुज़रे।"}],"loc":"Section 1 · Column 4 · #1","c":"#2e7d32"},{"w":"Autochthonous","hi":"मूल निवासी","en":"native to a place","ex":"Native to the very place where it is found; original inhabitants or things formed right where they lie — aboriginal, indigenous. A scholarly adjective; noun: autochthon.","xs":"The autochthonous tribes of the island lived there long before any settlers.","xh":"द्वीप के मूल निवासी कबीले वहाँ किसी बाहरी बसने वाले से बहुत पहले रहते थे।","t":"AUTO + CHTHON (मिट्टी): मिट्टी से खुद उपजा = देशज.","note":"","s":[{"en":"Tribes are autochthonous to this land.","hi":"जनजातियाँ यहाँ की मूल निवासी हैं।"}],"loc":"Section 1 · Column 4 · #1","c":"#6d4c41"},{"w":"Unfathomable","hi":"अथाह","en":"too deep to measure or understand","ex":"Impossible to measure or understand; too deep to sound, or so strange and complex that no one can get to the bottom of it — unfathomable grief, unfathomable mystery. Adjective; opposite: fathomable.","xs":"The ocean's unfathomable depths hide creatures no one has ever seen.","xh":"समुद्र की अथाह गहराइयों में ऐसे जीव छिपे हैं जिन्हें किसी ने कभी नहीं देखा।","t":"FATHOM = बाँह से नापना; UN-FATHOMABLE = नाप से परे.","note":"","s":[{"en":"Her grief was unfathomable.","hi":"उसका दुःख अथाह था।"}],"loc":"Section 1 · Column 4 · #1","c":"#e63980"},{"w":"Construe","hi":"व्याख्या करना","en":"interpret, understand in a way","ex":"To understand the meaning of words, actions or events in a particular way; to interpret — 'his silence was construed as agreement'. Formal verb; related: misconstrue (interpret wrongly).","xs":"Don't construe her silence as pride; she is just shy.","xh":"उसका चुप रहना घमंड न समझें; वह बस शर्मीली है।","t":"CON + STRUE: कथन का अर्थ \"construct\" करना.","note":"","s":[{"en":"Silence may be construed as consent.","hi":"मौन को सहमति समझा जा सकता है।"}],"loc":"Section 1 · Column 4 · #1","c":"#7c4dff"},{"w":"Tangle","hi":"उलझना","en":"twist into a mess","ex":"To twist things together into a confused knot — hair, wires, fishing lines; figuratively, a confused situation or a quarrel (get tangled in a dispute). Verb/noun.","xs":"The puppy got tangled in the wool and could not move.","xh":"पिल्ला ऊन में उलझ गया और हिल नहीं पा रहा था।","t":"TANGLEd earphones — हर बार उलझती हैं.","note":"","s":[{"en":"Her hair got tangled in the wind.","hi":"हवा में बाल उलझ गए।"}],"loc":"Section 1 · Column 4 · #1","c":"#00897b"},{"w":"Coagulate","hi":"जमना","en":"become thick/solid","ex":"To change from a thin liquid into a thick, semi-solid mass or clot — blood coagulates on a wound, milk coagulates when it sours. Technical and medical use; verb; noun: coagulation.","xs":"The doctor watched the blood coagulate and form a clot.","xh":"डॉक्टर ने खून का जमकर थक्का बनना देखा।","t":"गाढ़ा होकर जमना — दूध से दही जैसा.","note":"","s":[{"en":"Blood coagulated on the wound.","hi":"घाव पर खून जम गया।"}],"loc":"Section 1 · Column 4 · #1","c":"#ef6c00"},{"w":"Muddle","hi":"गड़बड़ाना","en":"confuse; mix up","ex":"To mix things up in a confused, disordered way; to make a situation confusing (muddle through = succeed despite confusion); a state of disorder or confusion. Verb/noun.","xs":"The late arrival of papers muddled the whole admission process.","xh":"काग़ज़ों के देर से आने ने पूरी प्रवेश प्रक्रिया उलझा दी।","t":"MUD (कीचड़): कीचड़ में कदम = गड़बड़.","note":"","s":[{"en":"Don't muddle the files.","hi":"फाइलें गड़बड़ा दो नहीं।"}],"loc":"Section 1 · Column 4 · #1","c":"#3949ab"},{"w":"Gloomy","hi":"उदास / अंधेरा","en":"dark and depressing","ex":"Dark, dim and depressing — a gloomy room, gloomy weather; also sad and without hope — a gloomy expression, gloomy news about the economy. Adjective.","xs":"Rainy skies made the whole town look gloomy and grey.","xh":"बरसाती आसमान ने पूरे शहर को उदास और धूसर बना दिया था।","t":"GLOOM = घना अंधेरा → GLOOMY mood = उदासी.","note":"","s":[{"en":"The sky looked gloomy.","hi":"आसमान उदास लग रहा था।"}],"loc":"Section 1 · Column 4 · #1","c":"#c62828"},{"w":"Dawdle","hi":"सुस्ती में वक़्त गँवाना","en":"waste time slowly","ex":"To waste time by moving or working too slowly; to take much longer than necessary over a task. Verb.","xs":"Stop dawdling over breakfast or you will miss the school bus.","xh":"नाश्ते में देर मत करो, वरना स्कूल की बस छूट जाएगी।","t":"DAD-walk: दादाजी की चाल से चलना = धीमेजी.","note":"","s":[{"en":"Stop dawdling; finish your work.","hi":"सुस्ती छोड़ो, काम पूरा करो।"}],"loc":"Section 1 · Column 4 · #1","c":"#2e7d32"},{"w":"Murmur","hi":"बुदबुदाना","en":"speak in a low voice","ex":"A soft, low, continuous sound; to speak very quietly, almost under the breath — murmur a prayer, murmur agreement; also the gentle sound of flowing water, or a heart murmur in medicine. Verb/noun.","xs":"The exhausted child murmured 'good night' and fell asleep.","xh":"थका हुआ बच्चा धीमी आवाज़ में 'गुड नाइट' बुदबुदाया और सो गया।","t":"\"मुर-मुर\" — हवा/पानी की धीमी आवाज़.","note":"","s":[{"en":"He murmured an apology.","hi":"उसने बुदबुदाकर माफी माँगी।"}],"loc":"Section 1 · Column 4 · #1","c":"#6d4c41"},{"w":"Pious","hi":"धार्मिक","en":"deeply religious","ex":"Deeply religious and dutiful towards God; showing religious devotion. It can also suggest hollow, showy goodness — a pious speech nobody believes. Adjective; noun: piety.","xs":"The pious old lady prayed at the temple every morning.","xh":"धार्मिक बुज़ुर्ग औरत हर सुबह मंदिर में प्रार्थना करती थी।","t":"PIOUS ≈ PUJA: पूजा-पाठ करने वाला.","note":"","s":[{"en":"The pious lady prays daily.","hi":"धार्मिक महिला रोज़ प्रार्थना करती है।"}],"loc":"Section 1 · Column 4 · #1","c":"#e63980"},{"w":"Impious","hi":"अधार्मिक","en":"not religious; disrespectful to god","ex":"Not showing respect towards God or religion; irreverent and wicked in matters of faith. Formal adjective (opposite: pious); noun: impiety.","xs":"His impious jokes about the sacred rituals offended the elders.","xh":"पवित्र अनुष्ठानों पर उसके अनादर भरे मज़ाक ने बड़ों को नाराज़ कर दिया।","t":"IM + PIOUS = पूजा न करने वाला.","note":"","s":[{"en":"His impious remarks hurt devotees.","hi":"उसकी अधार्मिक बातों ने भक्तों को दुखी किया।"}],"loc":"Section 1 · Column 4 · #1","c":"#7c4dff"},{"w":"Perfidious","hi":"विश्वासघाती","en":"betraying trust","ex":"Not able to be trusted; secretly betraying someone who trusted you — perfidious allies, a perfidious friend. A formal, literary adjective; noun: perfidy.","xs":"The perfidious general sold the battle plans to the enemy.","xh":"विश्वासघाती सेनापति ने युद्ध की योजनाएँ दुश्मन को बेच दीं।","t":"PERFUME छिड़ककर धोखा — मीठे बोल, काला दिल.","note":"","s":[{"en":"The perfidious friend leaked our secret.","hi":"विश्वासघाती मित्र ने राज़ बेच दिया।"}],"loc":"Section 1 · Column 4 · #1","c":"#00897b"},{"w":"Envious","hi":"ईर्ष्यालु","en":"wanting what others have","ex":"Wanting what someone else has — their luck, talent, possessions — and feeling discontented because of it; 'envious glances' show this longing or jealousy. Adjective; noun: envy; related: enviable (worth envying).","xs":"He cast an envious look at his neighbour's new car.","xh":"उसने पड़ोसी की नई कार की ओर ईर्ष्या भरी नज़र डाली।","t":"ENVY = \"IN-VISH (विष)\": भीतर ज़हर घोलना.","note":"","s":[{"en":"She was envious of my marks.","hi":"वह मेरे नंबरों से ईर्ष्यालु थी।"}],"loc":"Section 1 · Column 4 · #1","c":"#ef6c00"},{"w":"Decent","hi":"शालीन / उचित","en":"proper, respectable","ex":"Good and satisfactory in quality — a decent meal; kind and morally acceptable — a decent human being; also dressed or behaving in a way society considers proper. Adjective.","xs":"He is a decent man who always helps his neighbours.","xh":"वह एक सभ्य और अच्छा आदमी है जो हमेशा पड़ोसियों की मदद करता है।","t":"DECENCY = शालीनता — सभ्य आचरण.","note":"","s":[{"en":"He is a decent man.","hi":"वह शालीन आदमी है।"}],"loc":"Section 1 · Column 4 · #1","c":"#3949ab"},{"w":"Delectable","hi":"स्वादिष्ट, रुचिकर","en":"delicious; delightful","ex":"Extremely pleasant to taste, smell or experience; delicious and delightful — a delectable dessert, a delectable melody. A slightly formal or playful adjective.","xs":"Mother prepared a delectable kheer for the festival.","xh":"त्योहार पर माँ ने बेहद स्वादिष्ट खीर बनाई।","t":"DELICIOUS का भाई — मुँह में पानी लाए.","note":"","s":[{"en":"The cake was delectable.","hi":"केक स्वादिष्ट था।"}],"loc":"Section 1 · Column 4 · #1","c":"#c62828"},{"w":"Unremitting","hi":"लगातार, अविरल","en":"never stopping","ex":"Never stopping or weakening; continuing at the same strength all the time — unremitting pain, unremitting effort. Formal adjective.","xs":"Farmers' unremitting labour through the summer brought a golden harvest.","xh":"गर्मी भर किसानों की लगातार बिना रुके की मेहनत ने सुनहरी फ़सल दिलाई।","t":"UN + REMIT: REMIT (रुकना) तक नहीं = बिना रुके.","note":"","s":[{"en":"Unremitting rain flooded the town.","hi":"लगातार बारिश से कस्बा डूब गया।"}],"loc":"Section 1 · Column 4 · #1","c":"#2e7d32"},{"w":"Peevish","hi":"चिड़चिड़ा","en":"easily irritated","ex":"Easily annoyed and complaining, especially over small things; ill-tempered in a sulky, childish way. Adjective.","xs":"Lack of sleep made the toddler peevish all day.","xh":"नींद की कमी ने बच्चे को सारा दिन चिड़चिड़ा रखा था।","t":"PEEVE = चिढ़ाना — हमेशा चिढ़ा हुआ.","note":"","s":[{"en":"The peevish child kept crying.","hi":"चिड़चिड़ा बच्चा रोता रहा।"}],"loc":"Section 1 · Column 4 · #1","c":"#6d4c41"},{"w":"Chime","hi":"घंटी की आवाज़","en":"bell sound","ex":"To make a clear, ringing sound like a bell; a set of bells (door chimes, clock chimes); also to fit in well — 'his plan chimed with mine'. Verb/noun.","xs":"The temple bells chimed softly at sunrise.","xh":"सूर्योदय पर मंदिर की घंटियों की मधुर आवाज़ गूँजी।","t":"CHURCH की घंटी \"चाइम-चाइम\".","note":"","s":[{"en":"The clock chimed twelve.","hi":"घड़ी ने बारह बजाए।"}],"loc":"Section 1 · Column 4 · #1","c":"#e63980"},{"w":"Fortuitous","hi":"संयोगवश (अक्सर सुखद)","en":"happening by lucky chance","ex":"Happening by chance, without plan or cause; often with a lucky result — a fortuitous meeting that changed his life. Formal adjective. Strictly it means 'by chance', not necessarily 'lucky', but usage leans lucky.","xs":"A fortuitous meeting on the train brought him his first job.","xh":"ट्रेन में संयोगवश हुई मुलाक़ात से उसे पहली नौकरी मिली।","t":"FORTUNE + ITIOUS: किस्मत का खेल.","note":"","s":[{"en":"A fortuitous meeting changed his life.","hi":"संयोग से हुई मुलाक़ात ने जीवन बदल दिया।"}],"loc":"Section 1 · Column 4 · #1","c":"#7c4dff"},{"w":"Fiasco","hi":"पूरी तरह असफलता","en":"complete failure","ex":"A complete and embarrassing failure of a plan or event; a disaster of a show. Noun, informal in tone.","xs":"The award ceremony turned into a fiasco when the sound system failed.","xh":"साउंड सिस्टम खराब होने पर पुरस्कार समारोह पूरी तरह बेतुका तमाशा बन गया।","t":"\"फँस गया!\" — शो फ्लॉप = fiasco.","note":"","s":[{"en":"The launch was a fiasco.","hi":"लॉन्च पूरी तरह फ्लॉप रहा।"}],"loc":"Section 1 · Column 4 · #1","c":"#00897b"},{"w":"Sabotage","hi":"जानबूझकर तोड़-फोड़","en":"deliberate destruction","ex":"To secretly damage or destroy equipment, work or a plan, usually to obstruct an enemy or employer; also the act itself. Verb/noun; a person who does it is a saboteur.","xs":"Striking workers sabotaged the machines to stop production.","xh":"हड़ताली मज़दूरों ने उत्पादन रोकने के लिए मशीनों में छेड़छाड़ कर दी।","t":"SABOT = wooden shoe (जूता): जूतों से मशीन तोड़ना.","note":"","s":[{"en":"Enemies sabotaged the pipeline.","hi":"दुश्मनों ने पाइपलाइन में तोड़-फोड़ की।"}],"loc":"Section 1 · Column 4 · #1","c":"#ef6c00"},{"w":"Stout","hi":"हट्टा-कट्टा / मज़बूत","en":"strong and thick; rather fat","ex":"Rather fat and heavy-built — a stout old gentleman; also strong, thick and sturdy — stout shoes, stout walls; and brave, determined — a stout heart. Adjective. Also a dark, strong beer.","xs":"The stout old watchman guarded the gate all night with a stout stick.","xh":"मोटा-तंदुरुस्त बूढ़ा चौकीदार मोटी लाठी लिए सारी रात गेट पर पहरा देता रहा।","t":"STOUT बीयर की मोटी बोतल = मज़बूत-भरा हुआ.","note":"","s":[{"en":"He is a stout fellow.","hi":"वह हट्टा-कट्टा आदमी है।"}],"loc":"Section 1 · Column 4 · #1","c":"#3949ab"},{"w":"Candid","hi":"खरा, सीधा","en":"honest and direct","ex":"Truthful and straightforward, even when the truth is uncomfortable — a candid opinion, a candid photograph (unposed). Adjective; noun: candour.","xs":"To be candid, your essay needs a lot more research.","xh":"साफ़-साफ़ कहूँ तो आपके निबंध को बहुत ज़्यादा शोध की ज़रूरत है।","t":"CAN + DID: जो \"कर सकता है वही किया\" खुलकर बोलने वाला.","note":"","s":[{"en":"She gave a candid opinion.","hi":"उसने खरी राय दी।"}],"loc":"Section 2 · Column 1 · #1","c":"#c62828"},{"w":"Dainty","hi":"नाज़ुक एवं सुंदर","en":"delicately small and pretty","ex":"Delicately small and pretty — dainty porcelain cups; eating or moving in small, graceful steps; also (of appetite) choosy and delicate. Adjective.","xs":"She served tea in dainty cups painted with roses.","xh":"उसने गुलाब बने नाज़ुक-सुंदर प्यालों में चाय परोसी।","t":"DAINTY = छोटे-छोटे नाज़ुक हाथ-पैर वाली गुड़िया.","note":"","s":[{"en":"She held a dainty teacup.","hi":"उसने नाज़ुक चाय का कप था
