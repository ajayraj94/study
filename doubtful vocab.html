: अभिमान में मुँह बनाना.","note":"","s":[{"en":"She left in a fit of pique.","hi":"वह अभिमान-क्षोभ में चली गई।"}],"loc":"Section 6 · Column 1 · #6","c":"#ef6c00"},{"w":"Spectrograph","hi":"वर्णक्रम लेखी यंत्र","en":"instrument recording light spectra","ex":"An instrument that records and displays a spectrum — of light, sound or other waves — as a graph or photograph; also the record it produces. Noun; verb: spectrograph.","xs":"The spectrograph split the star's light into its chemical fingerprints.","xh":"स्पेक्ट्रोग्राफ़ ने तारे की रोशनी को उसके रासायनिक निशानों में बाँट दिया।","t":"SPECTRUM + GRAPH: रोशनी का रंग-चित्र बनाने वाला.","note":"","s":[{"en":"The spectrograph analysed the starlight.","hi":"वर्णक्रम लेखी ने तारकीय प्रकाश जाँचा।"}],"loc":"Section 6 · Column 1 · #6","c":"#3949ab"},{"w":"Agonist","hi":"संकल्प-व्यायामी / रसायन-अभिकर्ता","en":"one engaged in struggle; drug-receptor activator","ex":"A muscle that contracts to cause a movement (the prime mover), working against the antagonist muscle; in biochemistry, a drug or chemical that activates a receptor. Noun; adjective: agonistic.","xs":"During a bicep curl, the bicep is the agonist and the tricep the antagonist.","xh":"बाइसेप कर्ल में बाइसेप प्रमुख संकुचक मांसपेशी (एगोनिस्ट) और ट्राइसेप विरोधी होती है।","t":"AGONY से — संघर्ष करने वाला / दवा जो receptor जगाए.","note":"","s":[{"en":"The agonist drug mimicked dopamine.","hi":"अभिकर्ता दवा ने डोपामीन की नकल की।"}],"loc":"Section 6 · Column 1 · #6","c":"#c62828"},{"w":"Protagonist","hi":"मुख्य पात्र","en":"chief character in a story","ex":"The main character in a story, play or film — around whom the plot revolves; more broadly, a leading supporter of a cause. Noun; opposite (in drama): antagonist.","xs":"The protagonist, a shy village girl, slowly becomes a leader.","xh":"कहानी की नायिका, एक शर्मीली गाँव की लड़की, धीरे-धीरे नेता बन जाती है।","t":"PROTO (पहला) + AGONIST (संघर्ष करने वाला): पहला लड़ने वाला.","note":"","s":[{"en":"The protagonist fights the villain.","hi":"मुख्य पात्र खलनायक से लड़ता है।"}],"loc":"Section 6 · Column 1 · #6","c":"#2e7d32"},{"w":"Ophidiophobia","hi":"सर्प-भीति","en":"fear of snakes","ex":"An intense, persistent fear of snakes — from Greek ophis (snake). Psychological noun; a related word is herpetophobia (fear of reptiles).","xs":"His ophidiophobia began the day a snake slipped into his schoolbag.","xh":"जिस दिन साँप उसके बस्ते में घुस गया, उसी दिन से उसे साँपों का डर लगने लगा।","t":"OPHIS (साँप) + PHOBIA: साँप से डर.","note":"","s":[{"en":"His ophidiophobia began in childhood.","hi":"सर्प-भीति उसे बचपन से थी।"}],"loc":"Section 6 · Column 1 · #6","c":"#6d4c41"},{"w":"Necrophobia","hi":"शव/मृत्यु-भीति","en":"fear of death or corpses","ex":"An abnormal, intense fear of death, dead bodies or funerals — from Greek nekros (corpse). Psychological noun; adjective: necrophobic.","xs":"His necrophobia kept him away from funerals all his life.","xh":"मृत्यु का डर उसे जीवन भर अंत्येष्टियों से दूर रखा।","t":"NECRO (मृत) + PHOBIA: मृत से डर.","note":"","s":[{"en":"Necrophobia kept him from the funeral.","hi":"शव-भीति ने उसे अंत्येष्टि से रोका।"}],"loc":"Section 6 · Column 1 · #6","c":"#e63980"},{"w":"Xenophobia","hi":"विदेशी-द्वेष","en":"fear/hatred of foreigners","ex":"Fear, dislike or hatred of strangers, foreigners or people from other countries — often leading to discrimination. Noun; adjective: xenophobic.","xs":"The report condemned rising xenophobia against migrant workers.","xh":"रिपोर्ट ने प्रवासी मज़दूरों के प्रति बढ़ती विदेशी-द्वेष की निंदा की।","t":"XENO (परदेशी) + PHOBIA: अजनबी से द्वेष.","note":"","s":[{"en":"Xenophobia divides societies.","hi":"विदेशी-द्वेष समाज बाँटता है।"}],"loc":"Section 6 · Column 1 · #6","c":"#7c4dff"},{"w":"Nomophobia","hi":"नो-मोबाइल फोबिया","en":"fear of being without a mobile phone","ex":"Fear or anxiety of being without one's mobile phone or out of contact — short for 'no-mobile-phone phobia'. Informal psychological noun.","xs":"Nomophobia strikes when the battery hits one percent.","xh":"बैटरी एक प्रतिशत पर आते ही फ़ोन से दूर रहने की घबराहट शुरू हो जाती है।","t":"NO-MObile PHOBIA: फोन छूटने का डर.","note":"","s":[{"en":"Nomophobia spikes when battery hits 5%.","hi":"नोमोफोबिया 5% बैटरी पर चरम पर होता है।"}],"loc":"Section 6 · Column 1 · #6","c":"#00897b"},{"w":"Melophile","hi":"संगीत-प्रेमी","en":"lover of music","ex":"A person who loves music deeply; a music lover — from Greek melos (song) + philia (love). Noun; related: audiophile (lover of sound quality).","xs":"A true melophile, she collects vinyl records of every era.","xh":"सच्ची संगीत-प्रेमी है — हर दौर की वाइनिल रिकॉर्ड्स जमा करती है।","t":"MELODY + PHILE: धुनों का दीवाना.","note":"","s":[{"en":"A melophile, she collects vinyl records.","hi":"संगीत-प्रेमी है, वह रिकॉर्ड जमा करती है।"}],"loc":"Section 6 · Column 1 · #6","c":"#ef6c00"},{"w":"Discophile","hi":"ग्रामोफोन रिकॉर्ड-प्रेमी","en":"collector/student of music records","ex":"A collector and enthusiast of gramophone records/CDs — a record collector; related: discography (the list of a musician's records). Noun.","xs":"The discophile's shelf holds rare first-pressing LPs.","xh":"रिकॉर्ड-प्रेमी की अलमारी में दुर्लभ पहली प्रेसिंग की एलपी रखी हैं।","t":"DISCO (रिकॉर्ड) + PHILE: रिकॉर्डों का पागल.","note":"","s":[{"en":"The discophile owns rare 78s.","hi":"रिकॉर्ड-प्रेमी के पास दुर्लभ 78s हैं।"}],"loc":"Section 6 · Column 1 · #6","c":"#3949ab"},{"w":"Astrophile","hi":"तारा-प्रेमी","en":"lover of stars/astronomy","ex":"A person who loves stars and the night sky — an amateur astronomer or stargazer; from Greek astron (star) + philia (love). Noun.","xs":"The astrophile drove miles out of town just to watch meteor showers.","xh":"तारा-प्रेमी बस उल्का-वर्षा देखने के लिए शहर से मीलों दूर गाड़ी चलाता था।","t":"ASTRO (तारा) + PHILE: आसमान का दीवाना.","note":"","s":[{"en":"The astrophile never misses a meteor shower.","hi":"तारा-प्रेमी उल्का-दर्शन कभी नहीं छोड़ता।"}],"loc":"Section 6 · Column 1 · #6","c":"#c62828"},{"w":"Chromatophile","hi":"रंग-प्रेमी","en":"lover of colours","ex":"A person with a special love of colours (rare coinage); in biology, a chromatophile is a cell or tissue that stains easily with dyes. Noun (both senses rare).","xs":"As a chromatophile, she filled her sketchbook with the sunset's colours.","xh":"रंगों की प्रेमी होने के नाते उसने स्केचबुक सूर्यास्त के रंगों से भर दी।","t":"CHROMA (रंग) + PHILE: रंगों का दीवाना.","note":"","s":[{"en":"Holi delights every chromatophile.","hi":"होली हर रंग-प्रेमी को खुश करती है।"}],"loc":"Section 6 · Column 1 · #6","c":"#2e7d32"},{"w":"Dotage","hi":"बुढ़ापे की दुर्बलता","en":"period of senile weakness","ex":"The period of old age marked by weakening mind and judgement; 'in one's dotage' = senile, foolish with age. Noun; adjective: doting (devotedly affectionate, as a doting grandfather).","xs":"In his dotage, the old professor mixed up his students' names.","xh":"बुढ़ापे की दशा में बूढ़े प्रोफेसर छात्रों के नाम भी भूल जाते थे।","t":"DOTE (डोलता चाव): बुढ़ापे में दिमाग़ डोलना.","note":"","s":[{"en":"In his dotage, he repeats stories.","hi":"बुढ़ापे की दुर्बलता में वह कहानियाँ दोहराता है।"}],"loc":"Section 6 · Column 1 · #6","c":"#6d4c41"},{"w":"Supermarket","hi":"बड़ा स्वयंसेवी बाज़ार","en":"large self-service food/general store","ex":"A large self-service shop selling food, household goods and other items, arranged in aisles with trolleys and checkouts. Noun.","xs":"She bought a week's groceries from the supermarket in one trip.","xh":"उसने एक ही चक्कर में सुपरमार्केट से हफ़्ते भर का राशन खरीद लिया।","t":"SUPER + MARKET: सब कुछ एक ही छत के नीचे.","note":"","s":[{"en":"We bought groceries at the supermarket.","hi":"हमने सुपरमार्केट से राशन खरीदा।"}],"loc":"Section 6 · Column 1 · #6","c":"#e63980"},{"w":"Superannuation","hi":"सेवानिवृत्ति","en":"retirement (with pension)","ex":"The state of being too old to work; retirement from work with a pension — in India, the retirement benefit paid to employees. Noun; adjective: superannuated (old and no longer useful).","xs":"After superannuation, he takes home a monthly pension from the trust.","xh":"सेवानिवृत्ति के बाद वह ट्रस्ट से हर महीने पेंशन पाता है।","t":"SUPER + ANNUAL: सेवा की आयु पूरी — रिटायर.","note":"","s":[{"en":"He got a watch on superannuation.","hi":"सेवानिवृत्ति पर उसे घड़ी मिली।"}],"loc":"Section 6 · Column 1 · #6","c":"#7c4dff"},{"w":"Senescence","hi":"वृद्धावस्था-प्रक्रिया","en":"biological process of ageing","ex":"The process of growing old and showing the decline that comes with age — in organisms; in botany, the aging of leaves and flowers before they fall. Technical noun; adjective: senescent.","xs":"Yellowing of leaves in autumn is leaf senescence at work.","xh":"पतझड़ में पत्तियों का पीला पड़ना पत्तों की वृद्धावस्था (सेनेसेंस) का ही नतीजा है।","t":"SENILE जैसा — उम्र बढ़ने की जीव-प्रक्रिया.","note":"","s":[{"en":"Leaf senescence turns them yellow.","hi":"पत्तों का वृद्धत्व उन्हें पीला करता है।"}],"loc":"Section 6 · Column 1 · #6","c":"#00897b"},{"w":"Imbecility","hi":"मूर्खता / बुद्धिदोष","en":"extreme stupidity (also an old mental-age term)","ex":"Very great stupidity; a stupid act or remark; old medical term for severe intellectual disability (now offensive). Noun; adjective: imbecilic; person: imbecile.","xs":"The plan's sheer imbecility was obvious to everyone except its maker.","xh":"योजना की बेतुकता अपने बनाने वाले को छोड़ सबको साफ़ दिख रही थी।","t":"IMBECILE (बुद्धू) से — नासमझी.","note":"","s":[{"en":"Such imbecility caused the crash.","hi":"ऐसी मूर्खता से दुर्घटना हुई।"}],"loc":"Section 6 · Column 1 · #6","c":"#ef6c00"},{"w":"Indictment","hi":"अभियोग-पत्र / निंदा","en":"formal accusation; strong condemnation","ex":"A formal written accusation charging someone with a serious crime, issued by a grand jury; figuratively, strong evidence of something bad — 'the report is an indictment of our schools'. Noun; verb: indict (pronounced 'in-dite').","xs":"The court returned an indictment against the three accused officers.","xh":"अदालत ने तीनों आरोपी अधिकारियों के विरुद्ध अभियोग-पत्र दिया।","t":"INDICT ≈ IN-DICT(ate): दोष लिखकर सौंपना.","note":"","s":[{"en":"The report is an indictment of the system.","hi":"रिपोर्ट व्यवस्था की निंदा है।"}],"loc":"Section 6 · Column 1 · #6","c":"#3949ab"},{"w":"Desuetude","hi":"उपयोग में न आना","en":"disuse; state of no longer being used","ex":"The state of no longer being used or practised — a law fallen into desuetude, customs in desuetude. Formal/literary noun (from French, 'disuse').","xs":"The old water-sharing custom has fallen into desuetude.","xh":"पानी बाँटने की पुरानी परंपरा अब प्रचलन से बाहर हो चुकी है।","t":"DE + SUET ≈ CUSTOM: रिवायत छूट जाना.","note":"","s":[{"en":"The old law fell into desuetude.","hi":"पुराना क़ानून अनुपयोग में चला गया।"}],"loc":"Section 6 · Column 1 · #6","c":"#c62828"},{"w":"Hiatus","hi":"अंतराल / विराम","en":"break or gap in continuity","ex":"A break or gap in an activity, series or continuous stretch — a hiatus in talks, a summer hiatus; in phonetics, the meeting of two vowel sounds; in anatomy, a natural opening. Noun.","xs":"The band went on a five-year hiatus before reuniting.","xh":"बैंड फिर से मिलने से पहले पाँच साल के अंतराल पर चला गया।","t":"HIATUS ≈ HAYAT (जीवन) से गैप: कहानी में अटकाव.","note":"","s":[{"en":"The show returned after a two-year hiatus.","hi":"शो दो-साल के अंतराल बाद लौटा।"}],"loc":"Section 6 · Column 1 · #6","c":"#2e7d32"},{"w":"Interregnum","hi":"राज्य-विच्छेद (राजा के बीच का गैप)","en":"period between two reigns/governments","ex":"The period between the end of one ruler's reign and the beginning of the next — when there is no king, government or established authority; figuratively, any gap in authority. Formal noun (plural: interregnums/interregna).","xs":"An interregnum of two years followed the old king's death.","xh":"पुराने राजा की मृत्यु के बाद दो साल का अंतर्द्वंद्व काल (बिना शासक का अंतराल) रहा।","t":"INTER (बीच) + REGNUM (राज): दो राजाओं के बीच का खाली समय.","note":"","s":[{"en":"The interregnum lasted two months.","hi":"राज्य-विच्छेद दो महीने चला।"}],"loc":"Section 6 · Column 1 · #6","c":"#6d4c41"},{"w":"Abeyance","hi":"तत्परता-हीन रुकावट / ठहराव","en":"temporary inactivity or suspension","ex":"A state of temporary inactivity or suspension — a rule held in abeyance until the dispute ends; in law, property without an owner in the meantime. Formal noun.","xs":"Work on the highway is in abeyance until the monsoon ends.","xh":"मानसून ख़त्म होने तक हाईवे का काम रुका हुआ (स्थगित) है।","t":"AB + EYE-ance: \"आँख बंद\" — फिलहाल रुका हुआ.","note":"","s":[{"en":"The project is in abeyance.","hi":"परियोजना ठहराव में है।"}],"loc":"Section 6 · Column 1 · #6","c":"#e63980"},{"w":"Plutocracy","hi":"धनिक-शासन","en":"rule by the wealthy","ex":"Government or control of society by the wealthy; a country or class so ruled — critics call tax havens a plutocracy. Noun; adjective: plutocratic; adjective for members: plutocrats.","xs":"Voters complained that the country had become a plutocracy of tycoons.","xh":"मतदाताओं ने शिकायत की कि देश उद्योगपतियों की धनिक शासन-व्यवस्था बन गया है।","t":"PLUTO (धन-देव) + CRACY: पैसे वालों की हुकूमत.","note":"","s":[{"en":"Critics call the country a plutocracy.","hi":"आलोचक देश को धनिक-शासन कहते हैं।"}],"loc":"Section 6 · Column 1 · #6","c":"#7c4dff"},{"w":"Theocracy","hi":"धर्म-शासन","en":"rule by religious leaders/God's law","ex":"A system of government in which religious leaders rule, or the state is governed in the name of a god — Iran is often cited as a theocracy. Noun; adjective: theocratic.","xs":"In the theocracy, laws were drawn straight from scripture.","xh":"धर्मशासित राज्य में क़ानून सीधे धर्मग्रंथों से लिए जाते थे।","t":"THEO (ईश्वर) + CRACY: ईश्वर के नाम पर राज.","note":"","s":[{"en":"The theocracy banned dancing.","hi":"धर्म-शासन ने नृत्य प्रतिबंधित किया।"}],"loc":"Section 6 · Column 1 · #6","c":"#00897b"},{"w":"Sophist","hi":"कुतर्की","en":"clever but misleading arguer","ex":"In ancient Greece, a paid teacher of rhetoric and argument; today, a person who uses clever but false and misleading reasoning — a sophist twists words. Noun; adjective: sophistic; noun: sophistry.","xs":"The sophist could argue that black is white — for a fee.","xh":"दिखावटी तर्कबाज़ पैसे लेकर काले को सफ़ेद भी सिद्ध कर देता था।","t":"SOPHIA (बुद्धि) का दुरुपयोग करने वाला.","note":"","s":[{"en":"The sophist twisted every debate.","hi":"कुतर्की हर बहस बिगाड़ देता था।"}],"loc":"Section 6 · Column 1 · #6","c":"#ef6c00"},{"w":"Stasis","hi":"गतिहीनता / रुकावट","en":"state of no movement or change","ex":"A state of no movement or change; stagnation — economic stasis, the story is trapped in stasis; in medicine, stopping of blood flow. Formal noun; adjective: static.","xs":"The peace talks had reached stasis — nothing moved for months.","xh":"शांति वार्ता गतिरोध पर आ गई — महीनों कुछ आगे नहीं बढ़ा।","t":"STATIC जैसा: बिल्कुल ठहरा हुआ.","note":"","s":[{"en":"The nation was in stasis.","hi":"राष्ट्र गतिहीनता में था।"}],"loc":"Section 6 · Column 1 · #6","c":"#3949ab"},{"w":"Arachnophobia","hi":"मकड़ी-भीति","en":"fear of spiders","ex":"An intense, abnormal fear of spiders and other arachnids — one of the most common specific phobias. Noun; adjective: arachnophobic.","xs":"Her arachnophobia began after a tarantula fell on her desk.","xh":"मेज़ पर टारेंटुला गिरने के बाद से ही उसे मकड़ियों का डर लगने लगा।","t":"ARACHNE (मकड़ी) + PHOBIA: मकड़ी से डर.","note":"","s":[{"en":"Arachnophobia is very common.","hi":"मकड़ी-भीति बहुत आम है।"}],"loc":"Section 6 · Column 1 · #6","c":"#c62828"},{"w":"Masochist","hi":"आत्म-पीड़ा-प्रिय","en":"one who enjoys pain on self","ex":"A person who gets pleasure — especially sexual — from pain or humiliation; more loosely, someone who seems to enjoy situations that hurt them ('I'm a masochist for watching this team'). Noun; adjective: masochistic; opposite: sadist.","xs":"Call me a masochist, but I love running marathons in summer.","xh":"मुझे मसोचिस्ट कह लो, पर मुझे गर्मियों में मैराथन दौड़ना बहुत पसंद है।","t":"MASOCH साहित्यिक नाम से: दुख पर आनंद.","note":"","s":[{"en":"He's a masochist for spicy food.","hi":"तीखे खाने का मसोचिस्ट है।"}],"loc":"Section 6 · Column 1 · #6","c":"#2e7d32"},{"w":"Ode","hi":"स्तुतिगीत","en":"lyric poem of praise","ex":"A long, formal lyric poem praising a person, thing or idea — Keats's 'Ode to a Nightingale'; loosely, any enthusiastic praise ('an ode to street food'). Noun.","xs":"The poet wrote an ode to the monsoon's first rain.","xh":"कवि ने मानसून की पहली बारिश की स्तुति-गीत लिखा।","t":"\"ओ-दे!\" — आदर से पुकारने वाला गीत.","note":"","s":[{"en":"Keats wrote an ode to autumn.","hi":"कीट्स ने शरद का स्तुतिगीत लिखा।"}],"loc":"Section 6 · Column 1 · #6","c":"#6d4c41"},{"w":"Totem","hi":"गोत्र-चिह्न (पशु/वृक्ष)","en":"natural symbol of a tribe/clan","ex":"A natural object or animal adopted by a tribe or clan as its sacred emblem and ancestor; a person or thing regarded as the symbol of a group (' cricket is the totem of the village'). Noun; adjective: totemic.","xs":"The eagle was the clan's totem, carved above the village gate.","xh":"गिद्ध पक्षी वंश का प्रतीक-चिन्ह (टोटम) था, जो गाँव के द्वार के ऊपर उकेरा गया था।","t":"जनजाति का पवित्र चिन्ह — हाथी/पेड़.","note":"","s":[{"en":"The wolf is their totem.","hi":"भेड़िया उनका गोत्र-चिह्न है।"}],"loc":"Section 6 · Column 1 · #6","c":"#e63980"},{"w":"Epistle","hi":"पत्र (विशेषतः धार्मिक)","en":"formal/religious letter","ex":"A long, formal letter, especially one written on a serious or religious subject — St Paul's epistles in the New Testament; loosely, any lengthy letter. Literary noun.","xs":"He wrote a long epistle to the editor about civic corruption.","xh":"उसने नागरिक भ्रष्टाचार पर संपादक को एक लंबा पत्र लिखा।","t":"EPI (ऊपर) + STLE (भेजना): भेजा हुआ लंबा पत्र.","note":"","s":[{"en":"Paul's epistles guide many churches.","hi":"पौलुस के पत्र कई गिरजाघरों का मार्गदर्शन करते हैं।"}],"loc":"Section 6 · Column 1 · #6","c":"#7c4dff"},{"w":"Amnesty","hi":"राजक्षमा","en":"official pardon for offences","ex":"An official pardon granted to a group of people, wiping out offences — an amnesty for illegal weapons surrendered; also a tax amnesty. Noun.","xs":"The government declared an amnesty for prisoners on Republic Day.","xh":"सरकार ने गणतंत्र दिवस पर क़ैदियों के लिए आम माफ़ी घोषित की।","t":"A (नहीं) + MNEMON (याद): याद न रखना — भूलकर क्षमा.","note":"","s":[{"en":"Tax amnesty cleared old dues.","hi":"कर-क्षमा ने पुराने बकाया मिटाए।"}],"loc":"Section 6 · Column 1 · #6","c":"#00897b"},{"w":"Tenant","hi":"किरायेदार","en":"one who occupies rented property","ex":"A person who pays rent to live in or use a building, land or property owned by another; also a holder of an office ('the tenant of 10 Downing Street'). Noun; related: tenancy, landlord.","xs":"The landlord raised the rent, and the tenant refused to pay.","xh":"मकान मालिक ने किराया बढ़ा दिया और किरायेदार ने देने से मना कर दिया।","t":"TEN (पकड़): जो ज़मीन पकड़े बैठा है.","note":"","s":[{"en":"The tenant pays rent on the 5th.","hi":"किरायेदार 5 तारीख़ को किराया देता है।"}],"loc":"Section 6 · Column 1 · #6","c":"#ef6c00"},{"w":"Peregrination","hi":"विचरण-यात्रा","en":"long wandering journey","ex":"A long journey, especially one made on foot or full of wandering — years of peregrination across three continents. Formal/literary noun; verb: peregrinate.","xs":"His peregrinations through the Himalayas lasted seven years.","xh":"उसकी हिमालय भ्रमण यात्रा सात साल तक चलती रही।","t":"PEREGRINE बाज़ जैसा घुमक्कड़ सफ़र.","note":"","s":[{"en":"His peregrinations spanned three continents.","hi":"उसकी यात्राएँ तीन महाद्वीप छूती रहीं।"}],"loc":"Section 6 · Column 1 · #6","c":"#3949ab"},{"w":"Apostate","hi":"धर्म-त्यागी","en":"one who abandons his religion/party","ex":"A person who abandons or renounces a religion, party or belief they once held — treated as a traitor by those left behind. Noun; noun: apostasy; verb: apostatize.","xs":"The party expelled him as an apostate who had joined the rival camp.","xh":"पार्टी ने उसे विधर्मी कहकर निकाल दिया, जो प्रतिद्वंद्वी शिविर में चला गया था।","t":"APO (दूर) + STATE(एस्टेट/स्थिति): अपनी स्थिति छोड़ने वाला.","note":"","s":[{"en":"The party branded him an apostate.","hi":"दल ने उसे धर्म-त्यागी कहा।"}],"loc":"Section 6 · Column 1 · #6","c":"#c62828"},{"w":"Infidel","hi":"अधर्मी (दूसरे धर्म का)","en":"one without the (right) faith","ex":"A person who does not believe in a particular religion — used chiefly by believers of that religion, often with hostility. Noun/adjective (archaic/derogatory).","xs":"In the old chronicle, the crusaders called every outsider an infidel.","xh":"पुराने इतिहास-वृत्तांत में धर्मयोद्धाओं ने हर बाहरी व्यक्ति को अनीश्वरवादी कहा।","t":"IN + FIDEL (विश्वास): विश्वासहीन.","note":"","s":[{"en":"Crusaders called rivals infidels.","hi":"धर्मयोद्धा प्रतिद्वंद्वियों को अधर्मी कहते थे।"}],"loc":"Section 6 · Column 1 · #6","c":"#2e7d32"},{"w":"Pagan","hi":"मूर्तिपूजक / अनीश्वरवादी प्राचीन","en":"non-Abrahamic believer; nature-worshipper","ex":"A follower of a pre-Christian, nature-worshipping or polytheistic religion; loosely, an irreligious or hedonistic person. Noun/adjective.","xs":"The festival preserves many pagan customs of the harvest.","xh":"त्योहार में फ़सल कटाई की कई प्राचीन प्रकृति-पूजा परंपराएँ बची हुई हैं।","t":"गाँव (pagan/pagano) के पुराने देवी-देवता वाले.","note":"","s":[{"en":"Ancient pagans worshipped the oak.","hi":"प्राचीन मूर्तिपूजक बलूत की पूजा करते थे।"}],"loc":"Section 6 · Column 1 · #6","c":"#6d4c41"},{"w":"Morgue","hi":"मुर्दाघर","en":"place where dead bodies are kept","ex":"A building or room where dead bodies are kept until identification or burial — a hospital morgue; loosely, a dull, gloomy place; also a newspaper's file of reference material. Noun.","xs":"The bodies were taken to the hospital morgue for post-mortem.","xh":"शव पोस्टमॉर्टम के लिए अस्पताल के मुर्दाघर में ले जाए गए।","t":"MORGUE ≈ \"मुर्दा-g\": मुर्दों का ठंडा कमरा.","note":"","s":[{"en":"The body was taken to the morgue.","hi":"शव मुर्दाघर ले जाया गया।"}],"loc":"Section 6 · Column 1 · #6","c":"#e63980"},{"w":"Seer","hi":"द्रष्टा / भविष्यकथा करने वाला","en":"one who foresees; prophet","ex":"A person who claims to see the future — a prophet or visionary; also a wise person, and an Indian unit of weight (about a kilogram). Noun.","xs":"The village seer predicted good rains that year.","xh":"गाँव के भविष्य-द्रष्टा ने उस साल अच्छी बारिश की भविष्यवाणी की।","t":"SEE + ER: जो आगे देख लेता है.","note":"","s":[{"en":"The seer predicted drought.","hi":"द्रष्टा ने सूखे की बात की।"}],"loc":"Section 6 · Column 1 · #6","c":"#7c4dff"},{"w":"Oxymoron","hi":"विरोधाभासी संयोग","en":"two opposite words joined (\"deafening silence\")","ex":"A phrase that puts two contradictory words together for effect — 'deafening silence', 'bittersweet', 'open secret'. Noun; plural: oxymorons/oxymora; adjective: oxymoronic.","xs":"'Act naturally' is a famous oxymoron.","xh":"'स्वाभाविक रूप से अभिनय करो' एक प्रसिद्ध विरोधाभासी कहावत है।","t":"OXY (तीखा) + MORON (मूर्ख): तीखी मूर्खता — आपस में टकराते शब्द.","note":"","s":[{"en":"\"Bittersweet\" is an oxymoron.","hi":"\"बिटरस्वीट\" विरोधाभासी संयोग है।"}],"loc":"Section 6 · Column 1 · #6","c":"#00897b"},{"w":"Cinephile","hi":"सिनेमा-प्रेमी","en":"devoted film lover","ex":"A person who is passionate about cinema — watches films widely and seriously; a film lover. Noun (also cineaste, more maker-focused).","xs":"A lifelong cinephile, he has watched Satyajit Ray's films countless times.","xh":"जन्मजात सिनेप्रेमी उसने सत्यजीत रे की फ़िल्में अनगिनत बार देखी हैं।","t":"CINE (फिल्म) + PHILE: फिल्मों का दीवाना.","note":"","s":[{"en":"A cinephile watches a film every day.","hi":"सिनेमा-प्रेमी रोज़ फिल्म देखता है।"}],"loc":"Section 6 · Column 1 · #6","c":"#ef6c00"},{"w":"Pitcher","hi":"घड़ा / गेंदफेंक खिलाड़ी","en":"large jug; baseball thrower","ex":"A large container with a handle and spout for holding and pouring liquids — a pitcher of water; in baseball, the player who throws the ball to the batter; in plants, a pitcher-shaped leaf (pitcher plant). Noun.","xs":"The waiter refilled our glasses from a tall steel pitcher.","xh":"वेटर ने लंबे स्टील के जग से हमारे गिलास भरे।","t":"PITCH (उड़ेलना) से — पानी का बड़ा घड़ा.","note":"","s":[{"en":"She filled the pitcher with juice.","hi":"उसने घड़े में रस भरा।"}],"loc":"Section 6 · Column 1 · #6","c":"#3949ab"},{"w":"Lepidopterist","hi":"तितली-विज्ञानी","en":"student/collector of butterflies & moths","ex":"A scientist or collector who studies butterflies and moths — the order Lepidoptera. Noun.","xs":"The lepidopterist spent the summer cataloguing Himalayan butterflies.","xh":"तितली-विज्ञानी ने पूरी गर्मी हिमालय की तितलियों का सूचीकरण किया।","t":"LEPIDO (पैमाना-पंख) + PTER (पंख): पंखों का वैज्ञानिक.","note":"","s":[{"en":"The lepidopterist tagged the butterfly.","hi":"तितली-विज्ञानी ने तितली पर टैग लगाया।"}],"loc":"Section 6 · Column 1 · #6","c":"#c62828"},{"w":"Exodus","hi":"प्रस्थान (समूह का निकलना)","en":"mass departure","ex":"A mass departure of people, especially emigrants or refugees — an exodus from the villages to the cities; capital-E, the Biblical departure of Israelites from Egypt (Book of Exodus). Noun.","xs":"The exodus of workers before the festival empties the whole city.","xh":"त्योहार से पहले मज़दूरों के बड़े पलायन से पूरा शहर सूना हो जाता है।","t":"EX (बाहर) + ODUS (रास्ता): सब बाहर निकल गए.","note":"","s":[{"en":"The exam brought an exodus of students.","hi":"परीक्षा से छात्रों का प्रस्थान हुआ।"}],"loc":"Section 6 · Column 1 · #6","c":"#2e7d32"},{"w":"Savant","hi":"महाविद्वान","en":"learned person; gifted savant","ex":"A learned person, a scholar; also a person with a mental disability who shows an extraordinary ability in one field (an autistic savant). Noun (from French, 'one who knows').","xs":"The young savant could multiply six-digit numbers in seconds.","xh":"युवा प्रतिभाशाली छह अंकों की संख्याओं को सेकंडों में गुणा कर देता था।","t":"SAVANT = SATURDAY (French: savoir) — गहन ज्ञान.","note":"","s":[{"en":"He's a savant in mathematics.","hi":"वह गणित का महाविद्वान है।"}],"loc":"Section 6 · Column 1 · #6","c":"#6d4c41"},{"w":"Insurrection","hi":"विद्रोह","en":"violent rising against authority","ex":"A violent rising against an authority or government; an armed rebellion, usually smaller and less organised than a revolution. Formal noun; adjective: insurrectionary.","xs":"Troops were sent to crush the insurrection in the border province.","xh":"सीमावर्ती प्रांत के विद्रोह को कुचलने के लिए सेना भेजी गई।","t":"IN + SURGE: अंदर उठ खड़ा होने वाला तूफ़ान.","note":"","s":[{"en":"The insurrection toppled the governor.","hi":"विद्रोह ने राज्यपाल को हटा दिया।"}],"loc":"Section 6 · Column 2 · #6","c":"#e63980"},{"w":"Coup","hi":"तख़्तापलट","en":"sudden seizure of power","ex":"The sudden, often violent overthrow of a government by a small group — usually military (pronounced 'koo'); also a brilliant, unexpected success — 'getting that interview was a real coup' (from coup de maître). Noun.","xs":"The army seized the TV station on the night of the coup.","xh":"तख़्तापलट की रात सेना ने टीवी स्टेशन पर कब्ज़ा कर लिया।","t":"COUP d'état — एक झटके में गद्दी छीनना.","note":"","s":[{"en":"The army staged a coup.","hi":"सेना ने तख़्तापलट किया।"}],"loc":"Section 6 · Column 2 · #6","c":"#7c4dff"},{"w":"Somniloquist","hi":"नींद में बोलने वाला","en":"one who talks in sleep","ex":"A person who talks in their sleep; the habit is somniloquy — from Latin somnus (sleep) + loqui (to speak). Noun; related: somnambulist (sleepwalker).","xs":"My roommate is a somniloquist — full conversations at 3 a.m.!","xh":"मेरा रूममेट नींद में बोलता है — रात तीन बजे पूरी बातचीत!","t":"SOMNI (नींद) + LOQUIST (बोलने वाला): सोते-सोते भाषण.","note":"","s":[{"en":"The somniloquist murmured all night.","hi":"नींद में बोलने वाला रात भर बड़बड़ाया।"}],"loc":"Section 6 · Column 2 · #6","c":"#00897b"},{"w":"Somnambulist","hi":"नींद में चलने वाला","en":"sleepwalker","ex":"A person who walks about while asleep — a sleepwalker; the act is somnambulism. Noun; adjective: somnambulant (sleep-like, dazed).","xs":"The somnambulist once walked to the garden gate fast asleep.","xh":"नींद में चलने वाला एक बार सोते-सोते बगीचे के गेट तक चला गया।","t":"SOMNI (नींद) + AMBUL (चाल): सोते हुए टहलना.","note":"","s":[{"en":"The somnambulist walked to the garden asleep.","hi":"नींद में चलने वाला सोते हुए बगीचे तक गया।"}],"loc":"Section 6 · Column 2 · #6","c":"#ef6c00"},{"w":"Hypochondriac","hi":"रोग-भीरू","en":"one always imagining illness","ex":"A person who is constantly anxious about their health, imagining or exaggerating illness despite medical reassurance. Noun; the state is hypochondria; adjective: hypochondriacal.","xs":"Every small headache sends the hypochondriac rushing to three doctors.","xh":"सिर का हल्का-सा दर्द भी उस चिंताग्रस्त को तीन डॉक्टरों के पास भगा ले जाता है।","t":"HYPO (नीचे) + CHONDRIAC (पसली): पसलियों के नीचे बीमारी खोजता रहता है.","note":"","s":[{"en":"Every headache makes the hypochondriac panic.","hi":"हर सिरदर्द पर रोग-भीरू घबरा जाता है।"}],"loc":"Section 6 · Column 2 · #6","c":"#3949ab"},{"w":"Reverie","hi":"दिवास्वप्न","en":"daydream; pleasant lost-in-thought state","ex":"A state of dreamy, pleasant thinking, with attention drifting away from the present — lost in reverie; a daydream. Literary noun.","xs":"She sat by the window, lost in a reverie of old school days.","xh":"वह खिड़की पर बैठी पुराने स्कूली दिनों के सपनों में खोई थी।","t":"REVERIE ≈ \"रीवा\": दिन में सपनों में खोया.","note":"","s":[{"en":"She sat in a reverie by the window.","hi":"वह खिड़की पर दिवास्वप्न में डूबी थी।"}],"loc":"Section 6 · Column 2 · #6","c":"#c62828"},{"w":"Delirium","hi":"सन्नी अवस्था","en":"disturbed state with confusion/hallucinations","ex":"A disturbed mental state with fever, drugs or exhaustion — confused talking, hallucinations, restlessness; figuratively, wild excitement — the crowd was in a delirium of joy. Noun; adjective: delirious.","xs":"In high fever, he kept calling names in his delirium.","xh":"तेज़ बुखार की वख्त में वह प्रलाप में नाम ही पुकारता रहा।","t":"DELIRIUM TREMENS: बुखार में भटकना.","note":"","s":[{"en":"High fever put him in delirium.","hi":"तेज़ बुखार ने उसे सन्नी कर दिया।"}],"loc":"Section 6 · Column 2 · #6","c":"#2e7d32"},{"w":"Steward","hi":"प्रबंधक / सेवक","en":"one who manages property/arrangements","ex":"A person who manages or looks after property, events or passengers — a ship's steward, air stewards; in unions, a shop steward; as a verb, to manage responsibly. Noun/verb.","xs":"The air steward offered blankets as the plane grew cold.","xh":"हवाई जहाज़ के ठंडा होने पर केबिन क्रू ने कंबल दिए।","t":"ST-E-WARD: घर का ख़ज़ांची-रखवाला.","note":"","s":[{"en":"The steward arranged the feast.","hi":"प्रबंधक ने भोज तैयार किया।"}],"loc":"Section 6 · Column 2 · #6","c":"#6d4c41"},{"w":"Porter","hi":"दरवान / कुली","en":"doorkeeper; luggage carrier","ex":"A person whose job is carrying luggage — at stations, hotels or airports; a doorkeeper or gatekeeper; in hospitals, one who moves patients and goods. Noun.","xs":"The station porter carried our trunks to the taxi stand.","xh":"स्टेशन के कुली ने हमारे ट्रंक टैक्सी स्टैंड तक उठा ले गया।","t":"PORT (ढोना) से: सामान ढोने वाला.","note":"","s":[{"en":"The porter carried our bags.","hi":"कुली ने हमारे बैग उठाए।"}],"loc":"Section 6 · Column 2 · #6","c":"#e63980"},{"w":"Psephologist","hi":"चुनाव-विश्लेषक","en":"one who studies elections statistically","ex":"A person who studies elections and voting patterns statistically — an election analyst; from Greek psephos (pebble used in voting). Noun; the study: psephology.","xs":"TV channels interview psephologists on the eve of every election.","xh":"हर चुनाव से पहले टीवी चैनल चुनावी विश्लेषकों से बात करते हैं।","t":"PSEPHOS (यूनानी वोट-कंकड़): कंकड़-मतगणना का विज्ञानी.","note":"","s":[{"en":"The psephologist predicted the swing.","hi":"चुनाव-विश्लेषक ने बदलाव भर दिया।"}],"loc":"Section 6 · Column 2 · #6","c":"#7c4dff"},{"w":"Iridescent","hi":"रंग-बिरंगी चमक (इंद्रधनुषी)","en":"showing rainbow-like colours","ex":"Shining with shifting rainbow colours as the angle of view or light changes — iridescent soap bubbles, a peacock's iridescent neck, iridescent mother-of-pearl. Adjective; noun: iridescence.","xs":"The dragonfly's iridescent wings flashed green, blue and gold.","xh":"ड्रैगनफ्लाई के इंद्रधनुषी पंख हरे, नीले और सुनहरे रंग में चमके।","t":"IRIS (इंद्रधनुष देवी): सीप जैसी रंगीन चमक.","note":"","s":[{"en":"The oil formed an iridescent film.","hi":"तेल ने इंद्रधनुषी झिल्ली बनाई।"}],"loc":"Section 6 · Column 2 · #6","c":"#00897b"},{"w":"Toponym","hi":"स्थान-सूचक नाम","en":"place name","ex":"A place name — 'Jaipur', 'Silicon Valley'; also a word originally formed from a place name ('denim' from Nîmes). Noun; the study of place names is toponymy.","xs":"Every toponym on the map hides a story of rivers and rulers.","xh":"नक्शे पर हर स्थान-नाम में नदियों और शासकों की कोई कहानी छिपी है।","t":"TOPO (स्थान) + NYM (नाम): जगह का नाम.","note":"","s":[{"en":"\"Hyderabad\" is a toponym.","hi":"\"हैदराबाद\" एक स्थान-सूचक नाम है।"}],"loc":"Section 6 · Column 2 · #6","c":"#ef6c00"},{"w":"Haul","hi":"खींचना / लूट की माल","en":"pull hard; amount seized/won","ex":"To pull something heavy with effort — haul the net in, haul a sled; as a noun, the amount caught, stolen or won — a record haul of fish, a bank haul. Verb/noun.","xs":"Fishermen hauled in a record catch of sardines that morning.","xh":"उस सुबह मछुआरों ने रिकॉर्ड भरी मछलियों की फ़सल खींच लाए।","t":"धकेलना नहीं, HAUL = खींचना; पुलिस की बड़ी खेप.","note":"","s":[{"en":"The robbers escaped with a huge haul.","hi":"डाकुओं ने बड़ी खेप लेकर फरार होना।"}],"loc":"Section 6 · Column 2 · #6","c":"#3949ab"},{"w":"Heap","hi":"ढेर","en":"pile of things","ex":"A disordered pile of things — a heap of clothes, a heap of stones; as a verb, to pile up in a heap, often with a figurative sense — heaped with praise. Noun/verb; idiom: 'in a heap'.","xs":"After Holi, a heap of colour-stained clothes sat by the washing machine.","xh":"होली के बाद वॉशिंग मशीन के पास रंग-बिरंगे कपड़ों का ढेर लगा था।","t":"HEEP = ढेर — कूड़े का पहाड़.","note":"","s":[{"en":"Clothes lay in a heap.","hi":"कपड़े ढेर में पड़े थे।"}],"loc":"Section 6 · Column 2 · #6","c":"#c62828"},{"w":"Globetrotter","hi":"विश्व-भ्रमणकारी","en":"one who travels around the world often","ex":"A person who travels frequently around the world — a globe-trotting journalist; also a style of casual, versatile shoe/trainer (trademark in some countries). Noun.","xs":"The globetrotter has visited ninety countries in twenty years.","xh":"विश्वभ्रमण करने वाले ने बीस साल में नब्बे देश देखे हैं।","t":"GLOBE + TROT (दौड़ना): दुनिया दौड़ने वाला.","note":"","s":[{"en":"The globetrotter visited 40 countries.","hi":"विश्व-भ्रमणकारी 40 देश जा चुका था।"}],"loc":"Section 6 · Column 2 · #6","c":"#2e7d32"},{"w":"Gypsy","hi":"घुमंतू बंजारा","en":"member of a wandering people; wanderer","ex":"A member of the traditionally itinerant Romani people (now often considered offensive — preferred: Romani/Rroma); loosely, a wanderer or free-spirited traveller. Noun/adjective.","xs":"In old folk songs, the gypsy caravan is a symbol of freedom.","xh":"पुराने लोकगीतों में बंजारे डेरे को आज़ादी का प्रतीक कहा गया है।","t":"GYPSY ≈ गिप्सी — जुगुनु-जूनी बैला संगीत वाले घुमक्कड़.","note":"","s":[{"en":"Gypsy caravans crossed the plain.","hi":"बंजारों के डेरे मैदान पार करते थे।"}],"loc":"Section 6 · Column 2 · #6","c":"#6d4c41"},{"w":"Periscope","hi":"पनडुब्बी-दूरदर्शी","en":"tube with mirrors to see above (submarine)","ex":"A tube with mirrors or lenses for viewing above from below — submarines raise the periscope to see the surface; also similar viewing devices in trenches and tanks. Noun.","xs":"The submarine's periscope broke the waves for a brief scan.","xh":"पनडुब्बी का पेरिस्कोप क्षण भर के लिए लहरों को चीरकर ऊपर उमड़ा।","t":"PERI (चारों ओर) + SCOPE (देखना): पनडुब्बी की आँख.","note":"","s":[{"en":"The captain raised the periscope.","hi":"कैप्टन ने पनडुब्बी-दूरदर्शी उठाया।"}],"loc":"Section 6 · Column 2 · #6","c":"#e63980"},{"w":"Compeer","hi":"समकक्षी साथी","en":"person of equal status; companion","ex":"A person of equal rank or status; a companion or close associate — formal and now rare; related to 'peer' and French 'compère'. Formal noun.","xs":"He wrote fondly of his compeer and rival in the same college.","xh":"उसने उसी कॉलेज के अपने समकक्ष मित्र-प्रतिद्वंद्वी के बारे में स्नेह से लिखा।","t":"COM + PEER: अपने ही peer-जैसा साथी.","note":"","s":[{"en":"He honoured his old compeer.","hi":"उसने पुराने समकक्षी को सम्मान दिया।"}],"loc":"Section 6 · Column 2 · #6","c":"#7c4dff"},{"w":"Cypher","hi":"शून्य / सांकेतिक लेख","en":"zero; secret code; nonentity","ex":"British spelling of 'cipher': a secret code; a person of no importance ('a mere cypher'); a symbol combining letters (a monogram); in slang, a rap cypher is a circle of performers taking turns. Noun/verb.","xs":"The spies passed messages in a cypher the enemy never broke.","xh":"जासूसों ने ऐसे गुप्त कोड में संदेश भेजे, जिसे दुश्मन कभी सुलझा नहीं पाया।","t":"CIPHER = गुप्त-लेख + शून्य (ज़ीरो).","note":"","s":[{"en":"In that house he was a cypher.","hi":"उस घर में वह शून्य था।"}],"loc":"Section 6 · Column 2 · #6","c":"#00897b"},{"w":"Anemology","hi":"पवन-विज्ञान","en":"study of winds","ex":"The branch of science that deals with the study of winds — their origins, patterns and effects; from Greek anemos (wind). Rare technical noun.","xs":"Anemology helps wind-farm planners choose the right sites.","xh":"पवन-विज्ञान पवन-चक्की प्लानर्स को सही जगह चुनने में मदद करता है।","t":"ANEMOS (यूनानी हवा) + OLOGY: हवाओं का विज्ञान.","note":"","s":[{"en":"Anemology aids wind farms.","hi":"पवन-विज्ञान विंड फार्मों में काम आता है।"}],"loc":"Section 6 · Column 2 · #6","c":"#ef6c00"},{"w":"Stuckup","hi":"घमंडी, नाक ऊपर वाला","en":"conceited, snobbish","ex":"Informal for stuck-up: conceited and snobbish, acting superior to others — 'don't be so stuck up'. Adjective; noun: stuck-upness (informal).","xs":"The new manager was too stuck up to eat lunch with us.","xh":"नया मैनेजर इतना अहंकारी था कि हमारे साथ लंच तक नहीं खाता था।","t":"STUCK-UP: नाक STUCK-UP (ऊपर चढ़ी) हुई.","note":"","s":[{"en":"The stuckup star ignored fans.","hi":"घमंडी स्टार ने फैंस को नहीं देखा।"}],"loc":"Section 6 · Column 2 · #6","c":"#3949ab"},{"w":"Petrology","hi":"शैल-विज्ञान","en":"study of rocks","ex":"The branch of geology that studies rocks — their composition, structure and origin; from Greek petra (rock). Technical noun; a specialist is a petrologist.","xs":"Petrology traced the temple's stone to a quarry fifty miles away.","xh":"शैल-विज्ञान ने मंदिर के पत्थर का स्रोत पचास मील दूर की खान तक पता लगाया।","t":"PETRO (पत्थर) + OLOGY: चट्टानों का विज्ञान.","note":"","s":[{"en":"Petrology explains mountain rocks.","hi":"शैल-विज्ञान पहाड़ों की चट्टानें समझाता है।"}],"loc":"Section 6 · Column 2 · #6","c":"#c62828"},{"w":"Laurel","hi":"ताज (उपलब्धि का)","en":"honour/symbol of victory (laurel wreath)","ex":"An evergreen shrub with glossy leaves; in ancient Greece, wreaths of its leaves crowned victors — hence 'poet laureate', 'rest on one's laurels' (stop trying after success), 'look to one's laurels' (defend one's lead). Noun.","xs":"Don't rest on your laurels — the rivals are catching up fast.","xh":"पुरानी जीत पर सराहना तो नहीं बैठ जाओ — प्रतिद्वंद्वी तेज़ी से पहुँच रहे हैं।","t":"LAUREL = विजेता का पत्तों वाला ताज; \"rest on laurels\".","note":"","s":[{"en":"She won international laurels.","hi":"उसे अंतरराष्ट्रीय सम्मान मिले।"}],"loc":"Section 6 · Column 2 · #6","c":"#2e7d32"},{"w":"Democide","hi":"शासन-द्वारा नरसंहार","en":"murder of people by government","ex":"The murder of people by their own government — a broader term than genocide, covering mass killings by the state regardless of the victims' identity. Rare/academic noun (R. J. Rummel's term).","xs":"Historians debated whether the famine counted as democide.","xh":"इतिहासकारों में बहस थी कि क्या अकाल को राज्य-हत्या (डेमोसाइड) गिना जाए।","t":"DEMO (जनता) + CIDE (हत्या): राज्य की जन-हत्या.","note":"","s":[{"en":"Historians counted the regime's democide.","hi":"इतिहासकारों ने शासन का नरसंहार गिना।"}],"loc":"Section 6 · Column 2 · #6","c":"#6d4c41"},{"w":"Innumerate","hi":"गणित-अज्ञ","en":"lacking basic number skills","ex":"Unable to understand or work with basic numbers and mathematics — the numerical equivalent of illiterate. Adjective/noun; noun: innumeracy; opposite: numerate.","xs":"An innumerate voter cannot check a party's budget claims.","xh":"गणित में कमज़ोर मतदाता पार्टी के बजट के दावों की जाँच नहीं कर सकता।","t":"IN + NUMERATE: अंकों में अनपढ़.","note":"","s":[{"en":"An innumerate customer can't check the bill.","hi":"गणित-अज्ञ ग्राहक बिल नहीं जाँच सकता।"}],"loc":"Section 6 · Column 2 · #6","c":"#e63980"},{"w":"Coquette","hi":"छलछबी बहू-सी नारी","en":"woman who flirts to attract","ex":"A woman who flirts to attract attention without serious intent — also a verb, to coquette; the male form is 'coquet'; figuratively, to coquette with an idea = toy with it. Noun/verb.","xs":"In the novel, the coquette breaks hearts across three villages.","xh":"उपन्यास में छिछोरी नारी तीन गाँवों के दिल तोड़ देती है।","t":"COQUETTE: झाँकने वाली — अदाओं से खींचने वाली.","note":"","s":[{"en":"The coquette charmed the whole hall.","hi":"छलछबी ने पूरी सभा बाँध ली।"}],"loc":"Section 6 · Column 2 · #6","c":"#7c4dff"},{"w":"Strout","hi":"फुलाना / निकलना (फूला हुआ)","en":"to puff out, swell, protrude","ex":"A rare dialect word meaning to swell or puff out proudly; also to strut. Chiefly British dialect. Verb (very rare).","xs":"The rooster strouted about the yard as if he owned it.","xh":"मुर्गा आँगन में ऐसे फूला हुआ घूमता था जैसे सारा आँगन उसका हो।","t":"STR-OUT: बाहर (OUT) खिंचकर फूल जाना.","note":"","s":[{"en":"The peacock strutted, chest strouted.","hi":"मोर ने फूले हुए सीने से डोलना।"}],"loc":"Section 6 · Column 2 · #6","c":"#00897b"},{"w":"Romp","hi":"खेल-कूद में उछल-कूद","en":"playful frolic; easy win","ex":"To play roughly and energetically — puppies romp in the garden; to win a race very easily — romp home/romp to victory; as a noun, a lively, light-hearted play or film. Verb/noun.","xs":"The home team romped to a nine-wicket victory.","xh":"घरेलू टीम ने नौ विकेट से आसानी से जीत हासिल की।","t":"ROMP: पिल्लों जैसी उछल-कूद.","note":"","s":[{"en":"Puppies romped in the yard.","hi":"पिल्ले आँगन में खेले।"}],"loc":"Section 6 · Column 2 · #6","c":"#ef6c00"},{"w":"Atrium","hi":"गर्भगृह-आँगन / हृदय-कोष्ठ","en":"central hall; upper heart chamber","ex":"In architecture, a large open central hall, often with a glass roof, in a hotel or office; in anatomy, an upper chamber of the heart (left/right atrium); in Roman houses, the central hall. Noun (plural: atriums/atria).","xs":"Sunlight poured through the glass roof of the hotel atrium.","xh":"होटल के खुले केंद्रीय हॉल की काँच की छत से धूप उतर रही थी।","t":"ATRIUM: मंदिर/होटल का खुला आँगन; दिल का कक्ष.","note":"","s":[{"en":"Sunlight filled the atrium.","hi":"आँगन में धूप भर गई।"}],"loc":"Section 6 · Column 2 · #6","c":"#3949ab"},{"w":"Vase","hi":"फूलदान","en":"decorative container for flowers","ex":"An open container of glass, ceramic or metal, used to display cut flowers or as decoration — a Ming vase; pronounced 'vaaz' (UK) or 'vais' (US). Noun.","xs":"She arranged marigolds in a brass vase on the study table.","xh":"उसने पढ़ाई की मेज़ पर पीतल के गुलदान में गेंदे सजा दिए।","t":"VASE ≈ \"व्हाज़\": खिड़की का फूलदान.","note":"","s":[{"en":"Roses adorned the vase.","hi":"गुलाबों ने फूलदान सजाया।"}],"loc":"Section 6 · Column 2 · #6","c":"#c62828"},{"w":"Asphyxia","hi":"दमघुटी / साँस-रुकाव","en":"suffocation; lack of oxygen","ex":"A dangerous lack of oxygen in the body, caused by choking, drowning, gas or pressure — leading to unconsciousness or death; the verb is asphyxiate (suffocate). Medical noun; adjective: asphyxiated.","xs":"Smoke from the fire caused asphyxia in several trapped workers.","xh":"आग के धुएँ से फँसे कई मज़दूरों में ऑक्सीजन की कमी (श्वासावरोध) हो गई।","t":"A (नहीं) + SPHIX (नाड़ी/नब्ज): नाड़ी तक साँस नहीं.","note":"","s":[{"en":"Smoke caused asphyxia in the tunnel.","hi":"सुरंग में धुएँ से दमघुटी हुई।"}],"loc":"Section 6 · Column 2 · #6","c":"#2e7d32"},{"w":"Alopecia","hi":"गंजापन (रोगजन्य)","en":"hair loss condition","ex":"Loss of hair from the head or body — baldness; it may be patchy (alopecia areata) or total. Medical noun (from Greek alopex, fox — foxes' seasonal mange).","xs":"Alopecia took his hair in patches within a few months.","xh":"कुछ ही महीनों में उसके बाल झड़कर गंजेपन की धब्बे बना गए।","t":"ALO-PEECIA ≈ लोम-हीनता: बाल झड़ने की बीमारी.","note":"","s":[{"en":"Alopecia can strike teenagers too.","hi":"गंजापन किशोरों को भी होता है।"}],"loc":"Section 6 · Column 2 · #6","c":"#6d4c41"},{"w":"Girdle","hi":"कटि-पट्टा","en":"belt worn round the waist","ex":"A belt or band worn round the waist; a woman's elasticated undergarment shaping the waist and hips; technical uses: the ring of a cut gemstone, the ring of bark around a tree (to girdle a tree = kill it by cutting the bark ring). Noun/verb.","xs":"Grandmother's old saree was held by a broad silver girdle.","xh":"दादी की पुरानी साड़ी चौड़ी चाँदी की कमरबंद से बँधती थी।","t":"GIRTH (घेर) से: कमर का घेरा-पट्टा.","note":"","s":[{"en":"The saint wore a rope girdle.","hi":"साधु ने रस्सी की कटि-पट्टा पहनी।"}],"loc":"Section 6 · Column 2 · #6","c":"#e63980"},{"w":"Misconstrue","hi":"गलत अर्थ निकालना","en":"interpret wrongly","ex":"To understand something wrongly; to misinterpret words or actions — don't misconstrue my silence as agreement. Formal verb; noun: misconstruction.","xs":"His brief 'fine' was misconstrued as rudeness by the whole class.","xh":"उसका छोटा-सा 'ठीक है' पूरी कक्षा ने रूखाई समझ लिया।","t":"MIS + CONSTRUE (व्याख्या): व्याख्या बिगाड़ देना.","note":"","s":[{"en":"His silence was misconstrued as anger.","hi":"उसके मौन को गुस्सा समझ लिया गया।"}],"loc":"Section 6 · Column 2 · #6","c":"#7c4dff"},{"w":"Rover","hi":"घुमक्कड़","en":"wanderer; one who roves","ex":"A person who wanders from place to place — a sea rover (pirate); a vehicle for exploring distant places — the Mars rover; in sports, a position in some games. Noun; verb: rove (wander).","xs":"The Mars rover sends back pictures of red rocks and dust.","xh":"मंगल रोवर लाल चट्टानों और धूल की तस्वीरें भेजता है।","t":"ROAM + ER: इधर-उधर भटकने वाला.","note":"","s":[{"en":"The rover slept wherever dusk fell.","hi":"घुमक्कड़ जहाँ साँझ गिरी सो गया।"}],"loc":"Section 6 · Column 2 · #6","c":"#00897b"},{"w":"Dweller","hi":"निवासी","en":"one who lives in a place","ex":"A person or animal that lives in a particular place — a city dweller, cave dwellers, deep-sea dwellers. Noun; verb: dwell (live somewhere).","xs":"City dwellers often envy the quiet of hill villages.","xh":"शहरी बासियों को अक्सर पहाड़ी गाँवों की शांति से ईर्ष्या होती है।","t":"DWELL (रहना) + ER: कहाँ रहने वाला.","note":"","s":[{"en":"City dwellers miss the stars.","hi":"शहर के निवासी तारे मिस करते हैं।"}],"loc":"Section 6 · Column 2 · #6","c":"#ef6c00"},{"w":"Flyer","hi":"पर्चा / तेज़ दौड़ने वाला","en":"leaflet; fast runner","ex":"A small printed sheet advertising something, handed out or posted; a person or thing that flies — a high/low flyer; British informal, a flying leap. Noun.","xs":"Volunteers distributed flyers about the clean-up drive at the market.","xh":"स्वयंसेवकों ने बाज़ार में सफ़ाई अभियान के पर्चे बाँटे।","t":"FLY + ER: उड़न-खटोला; रंगीन पर्चा.","note":"","s":[{"en":"They distributed flyers for the concert.","hi":"कॉन्सर्ट के पर्चे बाँटे गए।"}],"loc":"Section 6 · Column 2 · #6","c":"#3949ab"},{"w":"Creche","hi":"शिशु-देखभाल केंद्र","en":"nursery for babies (day-care)","ex":"A place where babies and small children are cared for while parents work — a day nursery; British spelling of crèche (from French, 'manger'); also a model of the Nativity scene. Noun.","xs":"The office creche lets young mothers work without worry.","xh":"ऑफ़िस के डे-केयर से छोटे बच्चों की माएँ निश्चिंत काम कर पाती हैं।","t":"CRÈCHE ≈ क्रिसमस जन्म-तबका (crib): छोटों का ठिकाना.","note":"","s":[{"en":"Office creche eased young mothers.","hi":"दफ़्तर के शिशु-केंद्र से युवा माँएँ राहत पाईं।"}],"loc":"Section 6 · Column 2 · #6","c":"#c62828"},{"w":"Dagger","hi":"कटार","en":"short stabbing knife","ex":"A short, pointed knife used as a weapon for stabbing — 'cloak and dagger'; figuratively, hostile looks — 'they spoke with daggers drawn'; 'at daggers drawn' means openly hostile. Noun.","xs":"The two ministers were at daggers drawn over the water pact.","xh":"पानी के समझौते पर दोनों मंत्री एक-दूसरे के ख़िलाफ़ खुले युद्ध की स्थिति में थे।","t":"DAGGER: चाकू से बड़ा, तलवार से छोटा.","note":"","s":[{"en":"He drew a dagger from his cloak.","hi":"उसने चोगे से कटार निकाली।"}],"loc":"Section 6 · Column 2 · #6","c":"#2e7d32"},{"w":"Lance","hi":"भाला (घुड़सवारी वाला)","en":"long spear of a horseman","ex":"A long spear carried by mounted knights in battle or at tournaments; to lance a boil = cut it open with a sharp blade to drain it. Noun/verb; also a first name.","xs":"The knight lowered his lance and charged at his rival.","xh":"शूरवीर ने अपना भाला नीचे किया और प्रतिद्वंद्वी पर टूट पड़ा।","t":"LANCE ≈ लांस: रणभेरी का लंबा भाला.","note":"","s":[{"en":"Knights tilted their lances.","hi":"शूरवीरों ने भाले टेढ़े किए।"}],"loc":"Section 6 · Column 2 · #6","c":"#6d4c41"},{"w":"Hawker","hi":"फेरीवाला","en":"one who sells goods on the street","ex":"A person who sells goods in the street or goes from place to place selling things, often calling out; also a person who breeds and trains hawks (falconer). Noun; verb: hawk (peddle).","xs":"The chai hawker walked the train shouting 'garam chai!'.","xh":"चाय बेचने वाला 'गरम चाय!' चिल्लाता हुआ ट्रेन में चलता रहा।","t":"HAWK (शिकारी पक्षी) जैसा निगाह — हर गली फंदा डाले.","note":"","s":[{"en":"The hawker sold bangles and combs.","hi":"फेरीवाला चूड़ियाँ-कंघियाँ बेचता था।"}],"loc":"Section 6 · Column 2 · #6","c":"#e63980"},{"w":"Zootonic","hi":"पशु-चिकित्सा संबंधी","en":"relating to animal health/veterinary care","ex":"A very rare, apparently coined word relating to animals in a tonic/health sense; possibly a blend of zoo- (animal) + tonic — not a standard dictionary word. Rare/invented adjective.","xs":"The wellness centre advertised its 'zootonic' goat-yoga sessions.","xh":"वेलनेस केंद्र ने अपने पशु-आधारित 'ज़ूटॉनिक' बकरी-योग सत्रों का विज्ञापन किया।","t":"ZOO (पशु) + TONIC: पशुओं के स्वास्थ्य की विद्या.","note":"","s":[{"en":"The zootonic clinic vaccinated calves.","hi":"पशु-चिकित्सा क्लिनिक ने बछड़ों को टीका लगाया।"}],"loc":"Section 6 · Column 2 · #6","c":"#7c4dff"},{"w":"Ledger","hi":"खाता-बही","en":"book of final accounts","ex":"A large book or computer file in which a business records its accounts — debits and credits; in cryptocurrency, the blockchain acts as a distributed ledger. Noun.","xs":"Every rupee of the shop's income is entered in the ledger.","xh":"दुकान की हर रुपये की आमदनी बही-खाते में दर्ज होती है।","t":"LEDGER ≈ \"लेजर\": मोटा काला हिसाब-किताब की बही.","note":"","s":[{"en":"Enter the sale in the ledger.","hi":"बिक्री खाता-बही में दर्ज करो।"}],"loc":"Section 6 · Column 2 · #6","c":"#00897b"},{"w":"Untenable","hi":"अटल न टिकने वाला / खोखला","en":"(argument) impossible to defend","ex":"Impossible to defend or maintain — an untenable position, an untenable theory whose evidence has collapsed; also untenable housing (unfit to live in). Formal adjective.","xs":"With two witnesses against him, his alibi became untenable.","xh":"दो गवाहों के उलट होते ही उसका बहाना बेकार (असमर्थनीय) हो गया।","t":"UN + TENABLE (पकड़े रखने लायक): न पकड़े रखा जा सके.","note":"","s":[{"en":"His defence was untenable.","hi":"उसका बचाव खोखला था।"}],"loc":"Section 6 · Column 2 · #6","c":"#ef6c00"},{"w":"Comity","hi":"आपसी सौहार्द","en":"courtesy between groups/nations","ex":"Courteous and considerate behaviour towards others; in international law, comity of nations = mutual respect between legal systems. Formal noun; phrase: comity of nations.","xs":"The two courts exchanged judgments in a spirit of comity.","xh":"दोनों अदालतों ने आपसी सौहार्द के भाव से फ़ैसलों का आदान-प्रदान किया।","t":"COMITY ≈ COME-टी: \"मिलकर चलो\" वाली सहमति.","note":"","s":[{"en":"Courts respect comity between nations.","hi":"अदालतें देशों के आपसी सौहार्द का आदर करती हैं।"}],"loc":"Section 6 · Column 2 · #6","c":"#3949ab"},{"w":"Herpetology","hi":"सरीसृप-विज्ञान","en":"study of reptiles & amphibians","ex":"The branch of zoology that studies reptiles and amphibians — snakes, lizards, turtles, frogs; a specialist is a herpetologist. Technical noun.","xs":"Herpetology camps teach children to identify local snakes safely.","xh":"सरीसृप-विज्ञान शिविर बच्चों को स्थानीय साँपों को सुरक्षित पहचानना सिखाते हैं।","t":"HERPES (सर्प-रोग) से नहीं — HERPETO (सरीसृप): साँप-छिपकली का विज्ञान.","note":"","s":[{"en":"Herpetology fascinates snake-lovers.","hi":"सरीसृप-विज्ञान सर्प-प्रेमियों को मोहित करता है।"}],"loc":"Section 6 · Column 2 · #6","c":"#c62828"},{"w":"Hapology","hi":"अक्षर-दोहरा-हटाव (भाषाविज्ञान)","en":"omission of a doubled letter/sound","ex":"A rare, non-standard coinage: apparently 'the study of touch' (Greek haptein, to touch); the standard term is haptics. Not in most dictionaries — likely invented. Rare/invented noun.","xs":"The student's essay invented 'hapology' for the science of touch.","xh":"छात्र के निबंध ने स्पर्श के विज्ञान के लिए 'हैपोलॉजी' शब्द गढ़ा।","t":"HAPLO (एक) + LOGY: दोहराव को \"एक\" कर देना.","note":"","s":[{"en":"\"England\" < Engla-land by hapology.","hi":"\"England\" हपोलॉजी से Engla-land बना।"}],"loc":"Section 6 · Column 2 · #6","c":"#2e7d32"},{"w":"Herbing","hi":"जड़ी-बूटी लगाना","en":"planting/growing herbs","ex":"A non-standard, apparently coined word: the practice of planting or using herbs; standard alternatives are herb gardening or herbalism. Not a dictionary word — likely invented. Rare/invented noun.","xs":"Her weekend 'herbing' ritual fills the balcony with mint and basil.","xh":"उसकी सप्ताहांत 'हर्ब-लगाने' की दिनचर्या से बालकनी पुदीना-तुलसी से भर जाती है।","t":"HERB + ING: पत्तेदार मसालों की बागवानी.","note":"","s":[{"en":"Herbing along the kitchen wall began in spring.","hi":"रसोई की दीवार पर जड़ी-बूटी लगाना वसंत में शुरू हुआ।"}],"loc":"Section 6 · Column 2 · #6","c":"#6d4c41"},{"w":"Cynosure","hi":"ध्यान-खिंचाव का केंद्र","en":"centre of admiration/attention","ex":"A person or thing that attracts everyone's attention and admiration — 'the cynosure of all eyes'; originally the North Star (from Greek kynosoura, 'dog's tail'), which sailors steered by. Literary noun.","xs":"In her red lehenga, the bride was the cynosure of all eyes.","xh":"लाल लहंगे में दुल्हन सबकी निगाहों का केंद्र थी।","t":"CYNOSURE = POLARIS (ध्रुवतारा): सब नज़रें जैसे उसी पर.","note":"","s":[{"en":"The bride was the cynosure of all eyes.","hi":"दुल्हन सबकी नज़रों का केंद्र थी।"}],"loc":"Section 6 · Column 2 · #6","c":"#e63980"},{"w":"Sacramental","hi":"धार्मिक संस्कार संबंधी","en":"relating to sacred rites","ex":"Relating to a sacrament — a solemn religious rite believed to convey grace (baptism, communion); also sacred or binding like a rite. Adjective; noun: sacrament.","xs":"Baptism is a sacramental rite in most Christian churches.","xh":"बपतिस्मा अधिकांश ईसाई चर्चों में धार्मिक संस्कार की विधि है।","t":"SACRAMENT (पवित्र संस्कार) + AL: ईसाई रीति से जुड़ा.","note":"","s":[{"en":"Bread holds sacramental meaning.","hi":"रोटी का धार्मिक संस्कार-अर्थ है।"}],"loc":"Section 6 · Column 2 · #6","c":"#7c4dff"},{"w":"Antelope","hi":"हिरण-समान जंगली जानवर (नीलगाय/मृग)","en":"swift deer-like animal with horns","ex":"A swift, graceful, deer-like mammal of Africa and Asia with permanent hollow horns — blackbuck, gazelle, kudu. Noun.","xs":"A herd of blackbuck antelopes dashed across the dusty field.","xh":"काले हिरणों (एंटीलोप) का झुंड धूल भरे मैदान में से दौड़ गया।","t":"ANTELOPE ≈ \"अंतो-लोप\": बाग़-बगीचे में दौड़ता मृग.","note":"","s":[{"en":"Blackbuck is an Indian antelope.","hi":"काला हिरण भारतीय एंटीलोप है।"}],"loc":"Section 6 · Column 2 · #6","c":"#00897b"},{"w":"Venial","hi":"क्षमा-योग्य (छोटा पाप)","en":"forgivable, minor (sin)","ex":"A fault or sin that is minor and forgivable — venial sins (in Catholic theology, less serious than mortal sins); do not confuse with 'venal' (bribeable). Adjective; noun: veniality.","xs":"Lying about your age is a venial fault — not a crime.","xh":"उम्र छिपाना एक क्षुद्र (क्षमा-योग्य) दोष है — कोई अपराध नहीं।","t":"VENIAL ≈ VENUE-न-बदलना: छोटे दोष पर माफी; mortal का उलटा.","note":"","s":[{"en":"Skipping breakfast is a venial sin.","hi":"नाश्ता छोड़ना क्षमा-योग्य दोष है।"}],"loc":"Section 6 · Column 2 · #6","c":"#ef6c00"},{"w":"Claque","hi":"तालियों की हायर भीड़","en":"paid group of applauders","ex":"A group of people hired to applaud a performer; figuratively, a group of flatterers who clap along with a leader — 'surrounded by a claque of yes-men'. Noun (from French claque, a clap).","xs":"The minister's speech was cheered by a claque of party workers.","xh":"मंत्री के भाषण की तालियाँ पार्टी कार्यकर्ताओं की भीड़ ने बजाईं।","t":"CLAQUE ≈ CLAP + QUE: किराए के ताली-बाज़.","note":"","s":[{"en":"The claque clapped at every line.","hi":"हायर भीड़ हर संवाद पर ताली बजाती थी।"}],"loc":"Section 6 · Column 2 · #6","c":"#3949ab"},{"w":"Lecher","hi":"कामुक वृद्ध / व्यभिचारी","en":"man with excessive lust","ex":"A man given to excessive sexual desire and behaviour — a lecherous old man; the word is always negative. Noun; adjective: lecherous; noun: lechery.","xs":"In the play, the lecher finally gets his comeuppance.","xh":"नाटक में कामुक बूढ़े को आख़िरकार उसके कर्मों का फल मिला।","t":"LECHER ≈ LETCH: ललचाने वाला.","note":"","s":[{"en":"The old lecher winked at girls.","hi":"कामुक बुज़ुर्ग लड़कियों को ताकता था।"}],"loc":"Section 6 · Column 2 · #6","c":"#c62828"},{"w":"Deplorable","hi":"अत्यंत दुखद / घटिया","en":"deserving strong condemnation; very bad","ex":"Deserving strong condemnation — deplorable conditions, deplorable behaviour; also (informal, dated) feeling sad — 'in deplorable spirits'. Adjective; noun: deplorableness.","xs":"The report exposed the deplorable state of the district hospital.","xh":"रिपोर्ट ने ज़िला अस्पताल की निंदनीय हालत सबके सामने रख दी।","t":"DEPLORE (निंदा करना) से — जिस पर विलाप हो.","note":"","s":[{"en":"The refugees lived in deplorable conditions.","hi":"शरणार्थी भयानक हालात में रहते थे।"}],"loc":"Section 6 · Column 2 · #6","c":"#2e7d32"}];

const chipsEl = document.getElementById('chips');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
const popup = document.getElementById('popup');
const overlay = document.getElementById('overlay');
let openChip = null;
let curWord = null;
let curFilter = 'all';

// ---- Mastery tracking (auto-saved in browser) ----
const LS_KEY = 'vocabMasteryV1';
const LS_EDITS = 'vocabEditsV1';
let mastery = {};
let edits = {};
try { mastery = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { mastery = {}; }
try { edits = JSON.parse(localStorage.getItem(LS_EDITS) || '{}'); } catch (e) { edits = {}; }
function saveMastery() { try { localStorage.setItem(LS_KEY, JSON.stringify(mastery)); } catch (e) {} }
function saveEdits() { try { localStorage.setItem(LS_EDITS, JSON.stringify(edits)); } catch (e) {} }
function mergeEdits(d) {
  const e = edits[d.w];
  if (!e) return;
  if (typeof e.hi === 'string') d.hi = e.hi;
  if (typeof e.en === 'string') d.en = e.en;
  if (typeof e.t === 'string') d.t = e.t;
  if (typeof e.note === 'string') d.note = e.note;
  if (Array.isArray(e.s)) d.s = e.s;
  if (typeof e.noteImg === 'string') d.noteImg = e.noteImg;
}
function mClass(w) { const s = mastery[w]; return s === 'weak' ? 'm-weak' : (s === 'done' ? 'm-done' : ''); }
function chipMatchesFilter(d) {
  if (curFilter === 'weak' && mastery[d.w] !== 'weak') return false;
  if (curFilter === 'done' && mastery[d.w] !== 'done') return false;
  if (curFilter === 'learn' && mastery[d.w]) return false;
  return true;
}
function nEl(id) { return document.getElementById(id); }
function updateCounts() {
  let weak = 0, done = 0;
  DATA.forEach(d => { if (mastery[d.w] === 'weak') weak++; else if (mastery[d.w] === 'done') done++; });
  nEl('n-weak').textContent = weak;
  nEl('n-done').textContent = done;
  nEl('n-learn').textContent = DATA.length - weak - done;
  nEl('n-all').textContent = DATA.length;
}

function render() {
  chipsEl.innerHTML = '';
  const f = (searchEl.value || '').trim().toLowerCase();
  let shown = 0;
  DATA.forEach((d, i) => {
    const dv = Object.assign({}, d); mergeEdits(dv);
    if (f && !dv.w.toLowerCase().includes(f) && !dv.hi.includes(f)) return;
    if (!chipMatchesFilter(d)) return;
    shown++;
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.dataset.idx = i;
    const mc = mClass(d.w);
    btn.innerHTML = '<span class="label' + (mc ? ' ' + mc : '') + '" style="color:' + d.c + '">' + d.w + '</span>';
    btn.addEventListener('click', e => { e.stopPropagation(); togglePop(btn, d); });
    chipsEl.appendChild(btn);
  });
  countEl.textContent = shown + ' / ' + DATA.length + ' words' + ((f || curFilter !== 'all') ? ' (filtered)' : '');
  updateCounts();
}

function markFromPop(state) {
  if (!curWord) return;
  if (state === 'learn') delete mastery[curWord]; else mastery[curWord] = state;
  saveMastery();
  document.querySelectorAll('#chips .chip').forEach(ch => {
    const d = DATA[ch.dataset.idx];
    if (d.w !== curWord) return;

  download('vocab-master.md', new Blob([out.join('\n')], { type: 'text/markdown' }));
}
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Clear all Weak/Mastered marks?')) return;
  mastery = {};
  saveMastery();
  render();
});
render();
</script>
<!-- ===== Cross-device sync of marks, notes and comments ===== -->
<script>
/* The marks and notes made in this tracker are stored in this device's browser
   storage (localStorage), not inside the .html file, so a Git commit never
   carried them between iPad and desktop. This panel turns that state into one
   JSON blob you can move by copy/paste or by a file. */
(function () {
    var APP = 'vocab-tracker';
    var KEYS = ["vocabMasteryV1", "vocabEditsV1"];

    function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
    function isEmpty(v) { return v === '' || v === null || v === undefined || v === false || (Array.isArray(v) && v.length === 0); }
    function readKey(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

    function snapshot() {
        var data = {};
        for (var i = 0; i < KEYS.length; i++) {
            var v = readKey(KEYS[i]);
            if (v !== null && v !== undefined) data[KEYS[i]] = v;
        }
        return { app: APP, version: 1, exportedAt: new Date().toISOString(), data: data };
    }

    function mergeInto(local, incoming) {
        if (!isObj(local) || !isObj(incoming)) return isEmpty(incoming) ? local : incoming;
        var out = {}, k;
        for (k in local) if (Object.prototype.hasOwnProperty.call(local, k)) out[k] = local[k];
        for (k in incoming) if (Object.prototype.hasOwnProperty.call(incoming, k)) {
            if (isObj(out[k]) && isObj(incoming[k])) out[k] = mergeInto(out[k], incoming[k]);
            else if (isEmpty(incoming[k]) && !isEmpty(out[k])) continue;
            else out[k] = incoming[k];
        }
        return out;
    }

    function applyText(text) {
        var payload;
        try { payload = JSON.parse(text); } catch (e) { return 'That is not valid JSON. Copy the whole file, including the outer braces.'; }
        var data = payload && isObj(payload.data) ? payload.data : payload;
        if (!isObj(data)) return 'That does not look like a tracker backup.';
        var touched = 0;
        for (var i = 0; i < KEYS.length; i++) {
            var key = KEYS[i];
            if (!Object.prototype.hasOwnProperty.call(data, key)) continue;
            var incoming = data[key];
            var next = isObj(incoming) ? mergeInto(readKey(key) || {}, incoming) : incoming;
            try { localStorage.setItem(key, JSON.stringify(next)); touched++; } catch (e) {}
        }
        if (!touched) return 'Nothing in that file matched this tracker.';
        return '';
    }

    var css = '#syncOverlay{position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}'
        + '#syncOverlay .sbox{background:#fff;color:#0f172a;width:100%;max-width:780px;max-height:90vh;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 70px rgba(0,0,0,.4)}'
        + '#syncOverlay h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}'
        + '#syncOverlay .shelp{font-size:12px;line-height:1.5;color:#475569}'
        + '#syncOverlay textarea{width:100%;min-height:210px;flex:1;box-sizing:border-box;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;border:1px solid #cbd5e1;border-radius:10px;padding:10px;resize:vertical}'
        + '#syncOverlay .srow{display:flex;flex-wrap:wrap;gap:8px}'
        + '#syncOverlay button{cursor:pointer;border:1px solid #cbd5e1;background:#f8fafc;border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;color:#0f172a}'
        + '#syncOverlay button.primary{background:#0f766e;border-color:#0f766e;color:#fff}'
        + '#syncOverlay .sstatus{font-size:12px;min-height:16px;color:#0f766e}';

    function openSyncPanel() {
        if (document.getElementById('syncOverlay')) return;
        var style = document.createElement('style');
        style.textContent = css;
        document.head.appendChild(style);
        var wrap = document.createElement('div');
        wrap.id = 'syncOverlay';
        wrap.innerHTML = '<div class="sbox">'
            + '<h3><span>&#9729; Sync &mdash; marks, notes &amp; comments</span><button id="syncX" title="Close">&#10005;</button></h3>'
            + '<div class="shelp">This progress is saved in this device&#39;s browser storage, not inside the .html file, which is why a commit never carried it across. '
            + 'Copy the JSON below into the vault (for example <b>_sync/' + APP + '.json</b>), commit and push, pull on the other device, open this panel there, '
            + 'paste the file over the text and press <b>Apply pasted</b>. It keeps whatever is filled in on either side and adds anything new from the file.</div>'
            + '<textarea id="syncText" spellcheck="false"></textarea>'
            + '<div class="sstatus" id="syncMsg"></div>'
            + '<div class="srow">'
            + '<button class="primary" id="syncCopy">&#128203; Copy all</button>'
            + '<button id="syncDownload">&#128190; Download file</button>'
            + '<button id="syncPick">&#128193; Load file</button>'
            + '<button id="syncApply">&#128229; Apply pasted</button>'
            + '</div>'
            + '<input type="file" id="syncFile" accept=".json,application/json,text/plain" style="display:none">'
            + '</div>';
        document.body.appendChild(wrap);

        var ta = document.getElementById('syncText');
        var msg = document.getElementById('syncMsg');
        var file = document.getElementById('syncFile');
        ta.value = JSON.stringify(snapshot(), null, 2);

        function close() { wrap.remove(); }
        function say(t, ok) { msg.textContent = t; msg.style.color = ok === false ? '#b91c1c' : '#0f766e'; }

        document.getElementById('syncX').onclick = close;
        wrap.onclick = function (e) { if (e.target === wrap) close(); };
        document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });

        document.getElementById('syncCopy').onclick = function () {
            ta.focus(); ta.select();
            var done = false;
            try { done = document.execCommand('copy'); } catch (e) { done = false; }
            if (done) { say('Copied. Paste it into a note in the vault.', true); return; }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(ta.value).then(function () { say('Copied.', true); },
                    function () { say('Copy failed - hold the text, Select All, then Copy.', false); });
            } else say('Copy failed - hold the text, Select All, then Copy.', false);
        };

        document.getElementById('syncDownload').onclick = function () {
            try {
                var blob = new Blob([ta.value], { type: 'application/json' });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = APP + '-state.json';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
                say('Download attempted. If nothing was saved, use Copy all instead.', true);
            } catch (e) { say('Download is blocked here - use Copy all instead.', false); }
        };

        document.getElementById('syncPick').onclick = function () { file.click(); };
        file.onchange = function () {
            var f = file.files && file.files[0];
            if (!f) return;
            var rd = new FileReader();
            rd.onload = function () { ta.value = String(rd.result); say('File loaded - press Apply pasted.', true); };
            rd.readAsText(f);
            file.value = '';
        };

        function commit() {
            var err = applyText(ta.value);
            if (err) { say(err, false); return; }
            say('Applied. Reloading this tracker...', true);
            setTimeout(function () { try { location.reload(); } catch (e) { say('Reload the file (close and reopen it) to see the merged marks.', false); } }, 350);
        }
        document.getElementById('syncApply').onclick = commit;
    }

    window.openSyncPanel = openSyncPanel;
})();
</script>
</body>
