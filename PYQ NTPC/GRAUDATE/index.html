  const prunePopupClone = function(doc) {
    const keep = doc.querySelector(".drawer-panel") || doc.querySelector(".exam-panel") || doc.querySelector("#modalOverlay .modal");
    if (!keep) return;

    // Remove footer/control strips and unwanted overlays
    doc.querySelectorAll(".stealth-shell, .drawer-footer, .exam-qfoot, .exam-result, .modal-footer, .drawer-backdrop, .img-lightbox").forEach(el => el.remove());

    // Clean up drawer panel styles so it renders cleanly and fully expanded
    keep.style.position = "static";
    keep.style.top = "auto";
    keep.style.right = "auto";
    keep.style.left = "auto";
    keep.style.bottom = "auto";
    keep.style.height = "auto";
    keep.style.minHeight = "auto";
    keep.style.maxHeight = "none";
    keep.style.boxShadow = "none";
    keep.style.border = "none";
    keep.style.borderRadius = "12px";
    keep.style.background = "#ffffff";
    keep.style.overflow = "visible";
    keep.style.width = "780px";
    keep.style.maxWidth = "100%";
    keep.style.margin = "0";
    keep.style.transform = "none";

    const body = keep.querySelector(".drawer-body");
    if (body) {
      body.style.overflow = "visible";
      body.style.height = "auto";
      body.style.maxHeight = "none";
      body.style.padding = "20px 22px";
    }

    const examPanel = keep.classList.contains("exam-panel") ? keep : keep.querySelector(".exam-panel");
    if (examPanel) {
      examPanel.style.boxShadow = "none";
      examPanel.style.background = "#ffffff";
      examPanel.style.overflow = "visible";
    }

    // Now remove ALL siblings at every ancestor level up to body so only keep is rendered
    let curr = keep;
    while (curr && curr.parentElement && curr.parentElement !== doc.body) {
      const parent = curr.parentElement;
      Array.from(parent.children).forEach(sibling => {
        if (sibling !== curr && !sibling.contains(curr)) {
          sibling.remove();
        }
      });
      curr = parent;
    }
    Array.from(doc.body.children).forEach(el => {
      if (el !== curr && !el.contains(keep)) {
        el.remove();
      }
    });

    doc.body.style.background = "transparent";
    doc.body.style.margin = "0";

.exam-panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.exam-qhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.exam-qnum{font-size:12px;font-weight:800;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:3px 9px}
.exam-tag{font-size:11px;font-weight:800;letter-spacing:.03em;color:#6b7280;text-transform:uppercase}
.exam-qtext{font-size:15px;font-weight:700;line-height:1.65;white-space:pre-wrap}
.exam-options{display:flex;flex-direction:column;gap:10px}
.exam-qfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.exam-nav-btn{background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:9px 15px;font-weight:800;font-size:12.5px;color:#111827}
.exam-submit{margin-left:auto;background:#fff;border:1.5px solid #ef4444;color:#dc2626;border-radius:8px;padding:9px 16px;font-weight:800;font-size:12.5px} .exam-save{background:#16a34a;border-color:#16a34a;color:#fff} .exam-nav-btn:disabled,.exam-submit:disabled{opacity:.45;cursor:not-allowed}
.exam-result{padding:10px 14px;border-radius:8px;background:#ecfdf5;border:1px solid #86efac;color:#15803d;font-weight:800;font-size:13px}
.exam-palette{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;align-self:start;max-height:100%}
.exam-palette-title{font-size:12px;font-weight:800;color:#374151;letter-spacing:.04em}
.exam-palette-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.palette-btn{min-height:24px;border:1px solid #e5e7eb;background:#fff;border-radius:6px;font-weight:700;font-size:10.5px;color:#374151;padding:1px 0}
.palette-btn.answered{background:#ecfdf5;border-color:#86efac;color:#15803d}
.palette-btn.marked{background:#fffbeb;border-color:#fcd34d;color:#b45309}
.palette-btn.current{box-shadow:0 0 0 2px #2563eb inset;border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
.exam-legend{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:#6b7280;font-weight:700}
.exam-legend div{display:flex;align-items:center;gap:8px}
.lg{width:12px;height:12px;border-radius:50%;border:1px solid #d1d5db;background:#fff;display:inline-block}
.lg.answered{background:#22c55e;border-color:#22c55e}
.lg.marked{background:#f59e0b;border-color:#f59e0b}
.katex{font-size:1.08em}
.exam-qtext .katex,.q-prompt-box .katex{font-weight:inherit}
.opt-btn .katex{font-weight:600}
@media(max-width:900px){.exam-main{grid-template-columns:1fr;overflow-y:auto}.exam-palette{order:-1}}
</style>
