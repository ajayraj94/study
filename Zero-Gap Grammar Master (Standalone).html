6: Semicolons Joining Closely Linked Independent Clauses\r\n* **Principle:** A semicolon joins two independent clauses that are closely connected in meaning without requiring a coordinating conjunction; both sides of the semicolon must be structurally complete and syntactically independent.\r\n* **Formula:** `Independent Clause ; Independent Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The domestic manufacturing base has contracted significantly; because raw material imports were heavily taxed.*  \r\n    *(Second half is a subordinate clause fragment)*\r\n  * ✔️ *The domestic manufacturing base has contracted significantly**;** raw material imports were heavily taxed.*\r\n\r\n---\r\n\r\n#### Rule 7: Semicolons as 'Super-Commas' in Complex Internal Lists\r\n* **Principle:** When items in a coordinate list contain internal commas (such as cities with countries, names with titles, or complex clauses), semicolons must replace serial commas to prevent boundary ambiguity.\r\n* **Formula:** `Item 1 [with internal comma] ; Item 2 [with internal comma] ; and Item 3 [with internal comma]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The trade summits took place in Geneva, Switzerland, Tokyo, Japan, and Santiago, Chile.*  \r\n    *(Boundary ambiguity: implies six independent locations)*\r\n  * ✔️ *The trade summits took place in **Geneva, Switzerland; Tokyo, Japan; and Santiago, Chile**.*\r\n\r\n---\r\n\r\n#### Rule 8: The Colon Precedence Constraint (Complete Preceding Clause)\r\n* **Principle:** A colon introduces an explanation, an elaboration, an appositive noun, or a list, but the syntactic unit preceding the colon must be a grammatically complete independent clause; a colon must never separate a verb or preposition directly from its object.\r\n* **Formula:**\r\n  * `Independent Clause : [List / Explanation / Amplification]`\r\n  * ❌ `Subject + Verb / Preposition : [List / Object]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The fundamental requirements for the engineering expedition include: thermal gear, satellite transceivers, and emergency rations.*\r\n  * ✔️ *The fundamental requirements for the engineering expedition include thermal gear, satellite transceivers, and emergency rations.*\r\n  * ✔️ *The expedition requires **three fundamental assets: thermal gear, satellite transceivers, and emergency rations**.*\r\n\r\n---\r\n\r\n#### Rule 9: Conjunctive Adverb Boundary Mechanics\r\n* **Principle:** When an independent clause is linked to a succeeding independent clause by a conjunctive adverb (*however, therefore, nevertheless, moreover, consequently, furthermore*), the conjunctive adverb must be preceded by a semicolon (or period) and followed by a comma.\r\n* **Formula:** `Independent Clause ; + conjunctive adverb + , + Independent Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The council passed the zoning resolution, however, the mayor exercised his veto.*\r\n  * ✔️ *The council passed the zoning resolution**; however, the mayor exercised his veto**.*\r\n\r\n---\r\n\r\n### Category C: Parentheticals, Em-Dashes & Restrictive Delimiters\r\n\r\n#### Rule 10: Restrictive vs. Non-Restrictive Relative Clause Punctuation\r\n* **Principle:** Restrictive relative clauses (essential to identifying the noun) take no commas and use *that* or *who*; non-restrictive relative clauses (providing non-essential parenthetical commentary) require boundary commas and use *which* or *who*. Adding or omitting commas fundamentally alters meaning.\r\n* **Formula:**\r\n  * *Restrictive:* `Head Noun + [that / who + Verb] (No commas: Essential)`\r\n  * *Non-Restrictive:* `Head Noun + , [which / who + Verb] , + Predicate (Commas mandatory: Non-essential)`\r\n* **Diagnostic Contrast:**\r\n  * ✔️ *The laboratory samples **that were contaminated** were destroyed.*  \r\n    *(Only the contaminated samples were destroyed; others survived)*\r\n  * ✔️ *The laboratory samples**, which were contaminated,** were destroyed.*  \r\n    *(All the laboratory samples were destroyed; they were all contaminated)*\r\n\r\n---\r\n\r\n#### Rule 11: The Unpaired Parenthetical Comma Trap (Subject-Verb Separation)\r\n* **Principle:** An interrupting non-essential modifier, appositive, or parenthetical element within a sentence must be bounded by a pair of commas; using a single comma creates an ungrammatical barrier between a subject and its finite verb.\r\n* **Formula:**\r\n  * `Subject + , [Parenthetical Modifier] , + Verb`\r\n  * ❌ `Subject + , [Parenthetical Modifier] + Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The chief legal counsel, having reviewed the subpoena concluded that compliance was mandatory.*\r\n  * ✔️ *The chief legal counsel**, having reviewed the subpoena,** concluded that compliance was mandatory.*\r\n  * ❌ *The director of research, confirmed the discovery.*  \r\n    *(Single comma separating subject and predicate)*\r\n  * ✔️ *The director of research confirmed the discovery.*\r\n\r\n---\r\n\r\n#### Rule 12: Em-Dashes for Emphatic or Syntactically Abrupt Parentheses\r\n* **Principle:** Em-dashes (—) set off emphatic parenthetical material, abrupt shifts in thought, or internal lists within an appositive phrase. If an interrupting phrase is initiated with an em-dash, it must be closed with an em-dash before the main clause resumes.\r\n* **Formula:** `Independent Clause (Beginning) — [Parenthetical Interruption] — Independent Clause (Resumption)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The core assets of the portfolio—equities, municipal bonds, and precious metals, appreciated sharply.*  \r\n    *(Mismatched punctuation: opened with dash, closed with comma)*\r\n  * ✔️ *The core assets of the portfolio**—equities, municipal bonds, and precious metals—appreciated sharply**.*\r\n\r\n---\r\n\r\n#### Rule 13: Absolute Phrases and Introductory Modifier Comma Boundaries\r\n* **Principle:** Introductory adverbial clauses, long prepositional phrases, and nominative absolute constructions must be separated from the main independent clause by a comma.\r\n* **Formula:** `[Introductory Adverbial Clause / Absolute Phrase] , + Subject + Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The geopolitical tensions having escalated past the point of negotiation the security council declared an embargo.*\r\n  * ✔️ *The geopolitical tensions having escalated past the point of negotiation**, the security council declared an embargo**.*\r\n\r\n---\r\n\r\n### Category D: Compound Morphology, Hyphens & Possessives\r\n\r\n#### Rule 14: Compound Adjectives Before vs. After Nouns\r\n* **Principle:** When two or more words function as a single unit to modify an ensuing noun, they must be hyphenated to prevent reading ambiguity; when the same compound unit appears predicatively after the noun, hyphens are omitted.\r\n* **Formula:**\r\n  * *Attributive (Pre-nominal):* `[Word A - Word B] + Head Noun`\r\n  * *Predicative (Post-nominal):* `Head Noun + Linking Verb + [Word A + Word B]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The minister delivered a well constructed speech on macroeconomics.*\r\n  * ✔️ *The minister delivered a **well-constructed speech** on macroeconomics.*\r\n  * ✔️ *The speech on macroeconomics was **well constructed**.*\r\n\r\n---\r\n\r\n#### Rule 15: Prohibition of Hyphens with '-ly' Adverbs in Compound Modifiers\r\n* **Principle:** An adverb ending in *-ly* modifying an adjective or participle (*rapidly deteriorating, highly educated, widely recognized*) cannot take a hyphen, because the *-ly* suffix already clearly marks the word as an adverbial modifier.\r\n* **Formula:** `[-ly Adverb] + [Participle / Adjective] + Head Noun (Hyphen strictly prohibited)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The committee surveyed the highly-esteemed academic.*\r\n  * ✔️ *The committee surveyed the **highly esteemed academic**.*\r\n  * ❌ *They face a rapidly-diminishing supply of freshwater.*\r\n  * ✔️ *They face a **rapidly diminishing supply** of freshwater.*\r\n\r\n---\r\n\r\n#### Rule 16: Joint Possession vs. Separate Possession Apostrophe Mechanics\r\n* **Principle:** When two or more nouns jointly possess a single entity, the apostrophe-s (*'s*) is appended only to the final noun; when they possess separate, individual items, each coordinated noun takes an apostrophe-s.\r\n* **Formula:**\r\n  * *Joint Ownership:* `Noun A + and + Noun B's + Singular / Plural Head Noun`\r\n  * *Separate Ownership:* `Noun A's + and + Noun B's + Plural Head Noun`\r\n* **Diagnostic Contrast:**\r\n  * ✔️ * **Watson and Crick's** paper revolutionized molecular genetics.* [Joint collaboration]\r\n  * ❌ *Watson's and Crick's paper revolutionized molecular genetics.*  \r\n    *(Implies they wrote separate papers together)*\r\n  * ✔️ * **Picasso's and Dalí's styles** represent divergent surrealist traditions.* [Separate possessions]\r\n\r\n---\r\n\r\n#### Rule 17: Invariant Plurals & Singular Sibilant Apostrophe Mechanics\r\n* **Principle:** Regular plural nouns ending in *-s* indicate possession with an apostrophe alone (*the diplomats' credentials*); irregular plural nouns not ending in *-s* require an apostrophe-s (*the children's ward, the women's rights*). Singular proper nouns ending in sibilant sounds take *'s* in formal style (*Keats's poetry, Dickens's novels*).\r\n* **Formula:**\r\n  * `Plural Noun ending in -s + '`\r\n  * `Irregular Plural Noun not ending in -s + 's`\r\n  * `Singular Proper Noun ending in -s + 's`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The mens' locker room was renovated yesterday.*\r\n  * ✔️ *The **men's** locker room was renovated yesterday.*\r\n  * ❌ *The workers's union declared an indefinite general strike.*\r\n  * ✔️ *The **workers'** union declared an indefinite general strike.*\r\n\r\n---\r\n\r\n#### Rule 18: The Vocative (Direct Address) Comma vs. Syntactic Re-analysis\r\n* **Principle:** A noun of direct address (vocative) must be set off from the rest of the sentence with commas; omitting the vocative comma causes the addressed person to be misread as the subject or direct object of the verb.\r\n* **Formula:**\r\n  * `Noun of Address , + Imperative / Declarative Clause`\r\n  * `Clause , + Noun of Address , + Continuation`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Let us execute the general before sunset.*  \r\n    *(Without comma: Execute him as a condemned criminal)*\r\n  * ✔️ *Let us execute [the plan], **General,** before sunset.*  \r\n    *(With vocative commas: Direct address to the general)*\r\n  * ❌ *Call me inspector.*  \r\n    *(Without comma: Means \"Give me the title/name of inspector\")*\r\n  * ✔️ *Call me**, Inspector**.* [Vocative address]\r\n\r\n# Module 9: Voice, Modals & Ellipsis/Gapping\r\n**Total Micro-Rules:** 22  \r\n**Question Output Target:** 66 Questions (3 Questions per Rule: Direct Diagnostic, Embedded Distractor, Inversion/Boundary Trap)\r\n\r\n---\r\n\r\n### Category A: Voice Transformations & Ergative/Middle Mechanics\r\n\r\n#### Rule 1: Intransitive Verbs Prohibiting Passivization\r\n* **Principle:** Pure intransitive verbs (*occur, happen, arrive, appear, disappear, die, fall, deteriorate, exist*) do not take a direct object; transforming them into passive constructions (*be + V3*) is strictly ungrammatical.\r\n* **Formula:** `Subject + Intransitive Verb (Active Voice only; Passive forms prohibited)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomatic incident was occurred late in the evening.*\r\n  * ✔️ *The diplomatic incident **occurred** late in the evening.*\r\n  * ❌ *The financial crisis was happened without prior warning.*\r\n  * ✔️ *The financial crisis **happened** without prior warning.*\r\n\r\n---\r\n\r\n#### Rule 2: Ergative (Middle Voice) Verbs\r\n* **Principle:** Ergative verbs (*open, close, break, tear, melt, sell, read, wash*) can function in the active voice with an inanimate patient subject to describe an inherent quality or spontaneous process without requiring passive morphology.\r\n* **Formula:**\r\n  * *Inherent Quality / Middle:* `Inanimate Subject + Verb (Active Form) + Adverb of Manner`\r\n  * *Standard Passive (Action):* `Inanimate Subject + be + Past Participle (V3)`\r\n* **Diagnostic Contrast:**\r\n  * ✔️ *His debut historical monograph **is selling remarkably well**.* [Middle voice: active form]\r\n  * ✔️ *His debut historical monograph **was sold** at the auction.* [True passive]\r\n  * ❌ *This durable fabric is washed easily by anyone.*\r\n  * ✔️ *This durable fabric **washes easily**.* [Characteristic middle construction]\r\n\r\n---\r\n\r\n#### Rule 3: Prepositional Passives & Stranded Prepositions\r\n* **Principle:** When phrasal verbs or prepositional idioms (*look into, laugh at, send for, account for, rely on*) are passivized, the governing preposition must not be dropped; it remains attached directly to the past participle.\r\n* **Formula:** `Subject (Original Object) + be + Past Participle (V3) + Mandatory Preposition + [by Agent]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The unprecedented financial discrepancy was accounted by the auditor.*\r\n  * ✔️ *The unprecedented financial discrepancy was **accounted for by** the auditor.*\r\n  * ❌ *The physician was immediately sent when the sovereign collapsed.*\r\n  * ✔️ *The physician was immediately **sent for** when the sovereign collapsed.*\r\n\r\n---\r\n\r\n#### Rule 4: Ditransitive Passive Alternations (Direct vs. Indirect Object Promotion)\r\n* **Principle:** Verbs taking both an indirect object (recipient) and a direct object (theme) can form two passive constructions. When the theme (direct object) is promoted to subject, the recipient must be introduced by a preposition (*to* or *for*).\r\n* **Formula:**\r\n  * *Recipient Promoted:* `Recipient + be + Past Participle (V3) + Direct Object`\r\n  * *Theme Promoted:* `Direct Object + be + Past Participle (V3) + to / for + Recipient`\r\n* **Diagnostic Contrast:**\r\n  * ✔️ *The ambassador was awarded the honorary medal.* [Recipient promoted]\r\n  * ❌ *The honorary medal was awarded the ambassador.*\r\n  * ✔️ *The honorary medal was awarded **to the ambassador**.* [Theme promoted]\r\n\r\n---\r\n\r\n#### Rule 5: Unwarranted Voice Shifts Across Coordinate Clauses\r\n* **Principle:** Coordinating clauses within a single sentence that share the same logical agent must maintain a consistent grammatical voice; shifting abruptly from active to passive voice creates awkward syntactic asymmetry.\r\n* **Formula:**\r\n  * `Subject + Verb A (Active) + and + Verb B (Active) + Object`\r\n  * ❌ `Subject + Verb A (Active) + and + Object + was + Verb B (Passive)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The detectives secured the perimeter, and the suspect's vehicle was searched by them.*\r\n  * ✔️ *The detectives **secured the perimeter and searched the suspect's vehicle**.*\r\n\r\n---\r\n\r\n### Category B: Passive Complements & Non-Finite Voice Shifts\r\n\r\n#### Rule 6: Passive of Causatives and Perception Verbs (The Resurfacing of 'To')\r\n* **Principle:** Verbs of causation (*make, bid*) and sensory perception (*see, hear, watch*) take a bare infinitive in the active voice, but mandate a full to-infinitive when converted into the passive voice (with *let* remaining an exception).\r\n* **Formula:**\r\n  * *Active:* `Subject + make / see + Object + Base Verb (V1)`\r\n  * *Passive:* `Subject (Patient) + be + made / seen + to-Infinitive`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The insurgent was made confess his treasonous operations.*\r\n  * ✔️ *The insurgent was made **to confess** his treasonous operations.*\r\n  * ❌ *The suspect was seen enter the abandoned warehouse.*\r\n  * ✔️ *The suspect was seen **to enter** the abandoned warehouse.*\r\n\r\n---\r\n\r\n#### Rule 7: Passive Imperatives ('Let + Object + Be + V3')\r\n* **Principle:** Direct imperatives transformed into formal passive commands require the formula *Let + Object + be + Past Participle*, or *Subject + should be + Past Participle* when conveying advice or moral obligation.\r\n* **Formula:**\r\n  * *Command:* `Let + Direct Object + be + Past Participle (V3)`\r\n  * *Negative Command:* `Let + Direct Object + not + be + Past Participle (V3)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Let the confidential report be not disclosed to the press.*\r\n  * ✔️ *Let the confidential report **not be disclosed** to the press.*\r\n  * ✔️ * **Let the orders be carried out** without delay.*\r\n\r\n---\r\n\r\n#### Rule 8: Passive Infinitives and Passive Gerunds\r\n* **Principle:** When an infinitival or gerundial action is performed *upon* the governing noun phrase rather than *by* it, the passive forms (*to be + V3* or *being + V3*) must be used.\r\n* **Formula:**\r\n  * *Passive Infinitive:* `Subject + expect / deserve + to be + Past Participle (V3)`\r\n  * *Passive Gerund:* `Subject + resent / avoid + being + Past Participle (V3)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomat expected to receive by the head of state.*\r\n  * ✔️ *The diplomat expected **to be received** by the head of state.*\r\n  * ❌ *The minister resented interrogating by the independent commission.*\r\n  * ✔️ *The minister resented **being interrogated** by the independent commission.*\r\n\r\n---\r\n\r\n#### Rule 9: Passive Meaning with Active Gerunds ('Need / Require / Want')\r\n* **Principle:** Following verbs of need or requirement (*need, require, want*), an active gerund carries an inherently passive meaning; substituting an active infinitive is ungrammatical.\r\n* **Formula:** `Inanimate Subject + need / require / want + Gerund (Active form, Passive sense)  OR  to be + V3`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The municipal water infrastructure needs to upgrade immediately.*\r\n  * ✔️ *The municipal water infrastructure **needs upgrading** immediately.*\r\n  * ✔️ *The municipal water infrastructure **needs to be upgraded** immediately.*\r\n\r\n---\r\n\r\n### Category C: Modal Semantics & Lexical Distinctions\r\n\r\n#### Rule 10: Semi-Modals 'Dare' and 'Need' (Modal Auxiliary vs. Main Lexical Verb)\r\n* **Principle:** As modal auxiliaries (in negative and interrogative sentences), *dare* and *need* lack third-person singular *-s* and take a bare infinitive without *do*-support. As main lexical verbs, they take third-person *-s*, require *do/does/did*, and govern a full to-infinitive.\r\n* **Formula:**\r\n  * *Modal Auxiliary:* `Subject + need not / dare not + Base Verb (V1)` (No '-s', No 'to', No 'do')\r\n  * *Main Lexical Verb:* `Subject + does not + need / dare + to-Infinitive`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *He needs not to file a revised tax declaration.*\r\n  * ✔️ *He **need not file** a revised tax declaration.* [Modal]\r\n  * ✔️ *He **does not need to file** a revised tax declaration.* [Main verb]\r\n  * ❌ *She dares not oppose the authoritarian regime.*\r\n  * ✔️ *She **dare not oppose** the authoritarian regime.* [Modal]\r\n\r\n---\r\n\r\n#### Rule 11: 'Needn't Have + V3' vs. 'Didn't Need To + V1'\r\n* **Principle:** *Needn't have + V3* denotes that an unnecessary action was actually performed (wasted effort); *Didn't need to + V1* denotes that an action was not necessary, and was therefore typically not performed.\r\n* **Formula:**\r\n  * *Unnecessary Action Performed:* `Subject + needn't have + Past Participle (V3)`\r\n  * *Unnecessary Action Avoided:* `Subject + didn't need to + Base Verb (V1)`\r\n* **Diagnostic Contrast:**\r\n  * ✔️ *We **needn't have brought** heavy winter coats; the weather turned out to be tropical.*  \r\n    *(Coats were brought unnecessarily)*\r\n  * ✔️ *We **didn't need to produce** passports because domestic flights were exempt.*  \r\n    *(Passports were not produced)*\r\n\r\n---\r\n\r\n#### Rule 12: Epistemic Deduction: 'Must Have + V3' vs. 'Cannot / Could Not Have + V3'\r\n* **Principle:** To express logical deduction about past events, *must have + V3* expresses high positive certainty; its negative counterpart is *cannot have + V3* or *could not have + V3*, never *must not have + V3* (which expresses prohibition or non-deductive negative inference).\r\n* **Formula:**\r\n  * *Positive Logical Deduction:* `Subject + must have + Past Participle (V3)`\r\n  * *Negative Logical Deduction:* `Subject + cannot / could not have + Past Participle (V3)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The vault was sealed from the inside; the intruder must not have entered through the doors.*\r\n  * ✔️ *The vault was sealed from the inside; the intruder **cannot have entered** through the doors.*\r\n  * ✔️ *The forensic footprints match his shoes; he **must have been** at the scene.*\r\n\r\n---\r\n\r\n#### Rule 13: Past Counterfactual Modals ('Should Have', 'Could Have', 'Might Have')\r\n* **Principle:** *Should have + V3* denotes an unfulfilled past duty or obligation; *Could have + V3* denotes an unexercised past ability or unrealized possibility; *Might have + V3* denotes a past hypothetical contingency.\r\n* **Formula:** `Subject + should have / could have / might have + Past Participle (V3)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defense minister must have warned the garrison, but he neglected his duties.*\r\n  * ✔️ *The defense minister **should have warned** the garrison, but he neglected his duties.*\r\n  * ✔️ *He **could have acquired** the controlling stake, but he declined the financing.*\r\n\r\n---\r\n\r\n#### Rule 14: Prohibition ('Must Not') vs. Lack of Obligation ('Need Not' / 'Do Not Have To')\r\n* **Principle:** *Must not* denotes absolute prohibition or illegality; *Need not* and *Do not have to* denote an absence of requirement or compulsory obligation.\r\n* **Formula:**\r\n  * *Prohibition:* `Subject + must not + Base Verb (V1)`\r\n  * *Absence of Obligation:* `Subject + need not / do not have to + Base Verb (V1)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *You must not pay for the entrance ticket if you are an accredited diplomat.*  \r\n    *(Absurdly implies it is illegal for diplomats to pay)*\r\n  * ✔️ *You **do not have to pay** for the entrance ticket if you are an accredited diplomat.*\r\n  * ✔️ *Diplomats **must not disclose** classified national security cables.*\r\n\r\n---\r\n\r\n### Category D: Modal Idioms & Subjunctive Preferences\r\n\r\n#### Rule 15: Urgent Admonition with 'Had Better'\r\n* **Principle:** *Had better* functions as a fixed idiomatic modal equivalent to \"ought to\"; it must be followed by a bare infinitive, and its negative is formed by placing *not* after *better* (never *had not better*).\r\n* **Formula:**\r\n  * *Affirmative:* `Subject + had better + Base Verb (V1)`\r\n  * *Negative:* `Subject + had better not + Base Verb (V1)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *You had better to verify the contractual clauses before signing.*\r\n  * ✔️ *You **had better verify** the contractual clauses before signing.*\r\n  * ❌ *You hadn't better confront the commanding officer directly.*\r\n  * ✔️ *You **had better not confront** the commanding officer directly.*\r\n\r\n---\r\n\r\n#### Rule 16: 'Would Rather' Complement Regimes (Same Subject vs. Shifted Subject)\r\n* **Principle:** When the subject of *would rather* is the same as the actor of the preferred action, a bare infinitive is required. When a new subject is introduced, the dependent clause requires the unreal past subjunctive (simple past for present/future reference; past perfect for past reference).\r\n* **Formula:**\r\n  * *Same Subject:* `Subject + would rather + Base Verb (V1) + than + Base Verb (V1)`\r\n  * *Shifted Subject (Present/Future):* `Subject A + would rather + Subject B + Simple Past (V2)`\r\n  * *Shifted Subject (Past):* `Subject A + would rather + Subject B + had + Past Participle (V3)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The director would rather to postpone the executive summit.*\r\n  * ✔️ *The director **would rather postpone** the executive summit.*\r\n  * ❌ *I would rather you accompany the delegation tomorrow.*\r\n  * ✔️ *I would rather you **accompanied** the delegation tomorrow.*\r\n  * ✔️ *She would rather her lawyer **had disclosed** the settlement earlier.*\r\n\r\n---\r\n\r\n#### Rule 17: Past Habitual Modals ('Used To' vs. 'Would')\r\n* **Principle:** *Would* expresses past volitional, repeated actions/habits, but cannot be used for past states or conditions; *Used to* expresses both past discontinued states and past discontinued repeated habits.\r\n* **Formula:**\r\n  * *Past Discontinued State:* `Subject + used to + Stative Verb (be / live / have / own)`\r\n  * *Past Repeated Volitional Action:* `Subject + would / used to + Action Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *During the Victorian era, London would be shrouded in perpetual coal smoke.*  \r\n    *(Stative condition: 'would' is ungrammatical)*\r\n  * ✔️ *During the Victorian era, London **used to be** shrouded in perpetual coal smoke.*\r\n  * ✔️ *Every summer, the family **would convene** at the seaside villa.* [Action: Valid]\r\n\r\n---\r\n\r\n### Category E: Ellipsis, Gapping & Pro-Form Substitution\r\n\r\n#### Rule 18: Faulty Auxiliary Ellipsis in Coordinated Clauses\r\n* **Principle:** When two coordinated clauses share a principal lexical verb but require different auxiliary forms (or different grammatical aspects/numbers), the lexical verb cannot be elided from the first clause unless its morphological form is identical to that governed by the second auxiliary.\r\n* **Formula:** `Subject + Aux A + [Past Participle] + and + Aux B + [Base Verb]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The administration has never and will never compromise national security.*  \r\n    *(Grammatical error: \"has never compromise\" is invalid)*\r\n  * ✔️ *The administration **has never compromised, and will never compromise**, national security.*\r\n\r\n---\r\n\r\n#### Rule 19: Faulty Lexical Verb Ellipsis with Dissimilar Numbers\r\n* **Principle:** In compound sentences where subjects differ in number (singular vs. plural), the copular or auxiliary verb must be stated explicitly for each subject; sharing a singular verb with a plural subject via ellipsis is ungrammatical.\r\n* **Formula:** `Subject A (Singular) + was + [Complement] , and + Subject B (Plural) + were + [Complement]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *One civilian was killed and twelve injured during the artillery strike.*  \r\n    *(Grammatically implies: \"twelve was injured\")*\r\n  * ✔️ *One civilian **was killed** and twelve **were injured** during the artillery strike.*\r\n\r\n---\r\n\r\n#### Rule 20: Dynamic Pro-Form Substitution with 'Do So'\r\n* **Principle:** The anaphoric pro-form *do so* substitutes for a dynamic action verb phrase to avoid repetition; it cannot substitute for stative verbs (*know, love, possess, seem, belong*).\r\n* **Formula:**\r\n  * *Dynamic Verb:* `Subject A + Dynamic Verb + Object, and Subject B + do so`\r\n  * *Stative Verb:* Prohibition of 'do so' $\\to$ Repeat verb or use direct pronoun\r\n* **Diagnostic Contrast:**\r\n  * ✔️ *The general resolved to retreat, and the colonels **did so** immediately.* [Dynamic act]\r\n  * ❌ *He understood quantum mechanics deeply, and his brother did so as well.*  \r\n    *(Stative cognition: 'did so' cannot substitute)*\r\n  * ✔️ *He understood quantum mechanics deeply, and his brother **did as well**.*\r\n\r\n---\r\n\r\n#### Rule 21: Gapping Punctuation in Parallel Clauses\r\n* **Principle:** When the identical lexical verb of a subsequent parallel coordinate clause is elided (verb gapping), a comma must be inserted to indicate the site of the elided verb, and the clauses must be separated by a semicolon.\r\n* **Formula:** `Subject A + Verb + Object A ; Subject B , + Object B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *France exported vintage wine, Italy artisanal leather.*  \r\n    *(Lacks boundary semicolon and gapping comma)*\r\n  * ✔️ *France exported vintage wine**; Italy, artisanal leather**.*\r\n\r\n---\r\n\r\n#### Rule 22: Elliptical Inversion with Modal Auxiliaries\r\n* **Principle:** In coordinate clauses expressing parallel agreement using *so, neither,* or *nor*, modal auxiliaries must match the modal or aspectual category of the antecedent clause.\r\n* **Formula:**\r\n  * *Positive Modal Agreement:* `Subject A + Modal + Verb , and so + Modal + Subject B`\r\n  * *Negative Modal Agreement:* `Subject A + Modal + not + Verb , and neither / nor + Modal + Subject B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomat cannot sign the treaty, and neither the minister does.*\r\n  * ✔️ *The diplomat cannot sign the treaty, and **neither can the minister**.*\r\n  * ❌ *The scientist should review the data, and so the engineer must.*\r\n  * ✔️ *The scientist should review the data, and **so should the engineer**.*\r\n\r\n# Module 10: Reported Speech, Indirect Questions & Tags\r\n**Total Micro-Rules:** 18  \r\n**Question Output Target:** 54 Questions (3 Questions per Rule: Direct Diagnostic, Embedded Distractor, Inversion/Boundary Trap)\r\n\r\n---\r\n\r\n### Category A: Sequence of Tenses & Backshifting Mechanics\r\n\r\n#### Rule 1: Canonical Backshifting Regimes\r\n* **Principle:** When a reporting verb is in the past tense (*said, stated, announced, confessed*), the tenses of verbs in direct speech shift back one step in time: Present Simple becomes Past Simple, Present Continuous becomes Past Continuous, Present Perfect and Past Simple both become Past Perfect.\r\n* **Formula:**\r\n  * `Direct: Present Simple / Past Simple ➔ Indirect: Past Simple / Past Perfect`\r\n  * `Subject + said that + Subject + had + Past Participle (V3)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The director stated that he has reviewed the quarterly audit yesterday.*\r\n  * ✔️ *The director stated that he **had reviewed** the quarterly audit the day before.*\r\n  * ❌ *She claimed that she saw the suspect enter the vault.*\r\n  * ✔️ *She claimed that she **had seen** the suspect enter the vault.*\r\n\r\n---\r\n\r\n#### Rule 2: Invariant Tense with Non-Past Reporting Verbs\r\n* **Principle:** When the reporting verb is in the present, present perfect, or future tense (*says, has stated, will declare*), no backshifting occurs in the reported clause; original grammatical tenses are strictly preserved.\r\n* **Formula:** `Subject + says / has said / will say + that + Clause (Tense remains identical to Direct Speech)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The finance minister says that inflation had subsided.*  \r\n    *(Direct speech: \"Inflation has subsided\")*\r\n  * ✔️ *The finance minister says that inflation **has subsided**.*\r\n  * ❌ *The meteorologist will announce that a storm was approaching.*\r\n  * ✔️ *The meteorologist will announce that a storm **is approaching**.*\r\n\r\n---\r\n\r\n#### Rule 3: Universal Truths, Scientific Axioms & Enduring Facts\r\n* **Principle:** Even when introduced by a past-tense reporting verb, statements expressing timeless scientific laws, mathematical truths, geographical facts, or enduring realities remain in the present simple tense; backshifting them is an error.\r\n* **Formula:** `Subject + past reporting verb + that + Clause (Present Simple for Timeless Facts)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The professor demonstrated that water expanded upon freezing.*\r\n  * ✔️ *The professor demonstrated that water **expands** upon freezing.*\r\n  * ❌ *The astronomer explained that Jupiter was the largest planet.*\r\n  * ✔️ *The astronomer explained that Jupiter **is** the largest planet.*\r\n\r\n---\r\n\r\n#### Rule 4: Historical Facts with Definite Time Anchors\r\n* **Principle:** Definite past events tied to an explicit historical calendar date or recognized historical milestone retain the simple past tense in indirect discourse and do not shift into the past perfect.\r\n* **Formula:** `Subject + past reporting verb + that + Historical Event + Simple Past (V2) + [Historical Date]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The historian stated that the Bastille had fallen in 1789.*\r\n  * ✔️ *The historian stated that the Bastille **fell** in 1789.*\r\n  * ✔️ *The lecturer noted that the treaty **was signed** at the close of the war.*\r\n\r\n---\r\n\r\n#### Rule 5: Modal Auxiliaries in Backshifted Discourse\r\n* **Principle:** In indirect speech governed by a past reporting verb, *will* shifts to *would*, *can* to *could*, and *may* to *might*; however, modals that are already past in form (*would, could, should, might, ought to, had better*) or express non-deductive past necessity (*must*) remain invariant.\r\n* **Formula:**\r\n  * `Direct: can / will / may ➔ Indirect: could / would / might`\r\n  * `Direct: should / would / might / ought to ➔ Indirect: Invariant (No change)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The ambassador assured us that he can negotiate a settlement.*\r\n  * ✔️ *The ambassador assured us that he **could** negotiate a settlement.*\r\n  * ❌ *The legal counsel noted that the board should have consulted him earlier.*  \r\n    *(Erroneous double backshift)*\r\n  * ✔️ *The legal counsel noted that the board **should have consulted** him earlier.*\r\n\r\n---\r\n\r\n### Category B: Deictic Shifts (Time, Space & Perspective)\r\n\r\n#### Rule 6: Systematic Shift of Temporal and Locative Deictic Markers\r\n* **Principle:** Adverbs and determiners denoting proximity in time or place must shift to forms denoting psychological or chronological distance when reported from a different temporal/spatial vantage point.\r\n* **Formula:**\r\n  * `now ➔ then | today ➔ that day | yesterday ➔ the previous day / the day before`\r\n  * `tomorrow ➔ the following day / the next day | ago ➔ before | here ➔ there`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *He confessed two days ago that he arrived here yesterday.*\r\n  * ✔️ *He confessed two days ago that he had arrived **there the day before**.*\r\n  * ❌ *The premier announced that the assembly would dissolve tomorrow.*\r\n  * ✔️ *The premier announced that the assembly would dissolve **the following day**.*\r\n\r\n---\r\n\r\n#### Rule 7: Unshifted Deictic Markers (Preserved Spatiotemporal Context)\r\n* **Principle:** When direct speech is reported on the very same day, in the identical location, or while the reported time frame is still current, proximal deictic markers (*today, this morning, here*) are retained to prevent temporal distortion.\r\n* **Formula:** `Speech reported same day/place ➔ Retain proximal deictic markers (today / here)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Speaking this morning, the mayor announced that public transport will be free on that day.*\r\n  * ✔️ *Speaking this morning, the mayor announced that public transport will be free **today**.*\r\n  * ✔️ *Standing right here in the capitol, he declared that the constitution was signed **here**.*\r\n\r\n---\r\n\r\n#### Rule 8: Demonstrative Determiner Shifts ('This / These' vs. 'That / Those')\r\n* **Principle:** Demonstratives *this* and *these* shift to *that* and *those* when denoting temporal or physical distance. When *this* functions as a pure definite determiner rather than a pointing pronoun, it frequently shifts into the definite article *the*.\r\n* **Formula:**\r\n  * `this [Time] ➔ that [Time] | these [Plural Noun] ➔ those [Plural Noun]`\r\n  * `this [Specific Topic] ➔ the [Topic]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The delegate maintained that he had never witnessed this maneuvers before.*\r\n  * ✔️ *The delegate maintained that he had never witnessed **those maneuvers** before.*\r\n  * ✔️ *She pointed out that she had rejected **the** proposal.* [Direct: \"this proposal\"]\r\n\r\n---\r\n\r\n### Category C: Indirect Questions & Structural Word Order\r\n\r\n#### Rule 9: Prohibition of Subject-Auxiliary Inversion in Indirect Questions\r\n* **Principle:** Indirect questions cease to function as syntactically interrogative clauses and become nominal declarative content clauses; therefore, subject-auxiliary inversion (*auxiliary + subject*) is strictly prohibited, and normal declarative order (*subject + verb*) is mandatory.\r\n* **Formula:**\r\n  * ❌ `Reporting Verb + Wh-word + Auxiliary Verb + Subject + Main Verb`\r\n  * ✔️ `Reporting Verb + Wh-word + Subject + Auxiliary Verb + Main Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The investigator inquired where had the suspect concealed the ledger.*\r\n  * ✔️ *The investigator inquired **where the suspect had concealed** the ledger.*\r\n  * ❌ *The tribunal asked what were the diplomatic consequences.*\r\n  * ✔️ *The tribunal asked **what the diplomatic consequences were**.*\r\n\r\n---\r\n\r\n#### Rule 10: Prohibition of the Pleonastic 'That' Before Interrogatives\r\n* **Principle:** The conjunction *that* cannot precede interrogative connective markers (*who, whom, whose, where, when, why, how, if, whether*); subordinating an indirect question with both *that* and a wh-word creates an ungrammatical double complementizer.\r\n* **Formula:** `Reporting Verb + [wh-word / if / whether] + Subject + Verb  (Prohibited: that + wh-word)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The magistrate inquired that why the defendant had departed the jurisdiction.*\r\n  * ✔️ *The magistrate inquired **why the defendant had departed** the jurisdiction.*\r\n  * ❌ *She asked that whether the flight had departed.*\r\n  * ✔️ *She asked **whether the flight had departed**.*\r\n\r\n---\r\n\r\n#### Rule 11: Indirect Yes/No Questions ('Whether' vs. 'If')\r\n* **Principle:** Direct questions lacking an interrogative wh-word are introduced indirectly by *whether* or *if*. In formal prescriptive grammar, *whether* is obligatory when immediately followed by *or not*, when governing a to-infinitive, or when following a preposition.\r\n* **Formula:**\r\n  * `Reporting Verb + whether / if + Subject + Verb`\r\n  * `Reporting Verb + whether or not + Clause  (Never: if or not)`\r\n  * `Reporting Verb + whether + to-Infinitive`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The board deliberated if or not to accept the hostile tender.*\r\n  * ✔️ *The board deliberated **whether or not** to accept the hostile tender.*\r\n  * ❌ *The envoy inquired if to file a formal protest.*\r\n  * ✔️ *The envoy inquired **whether to file** a formal protest.*\r\n\r\n---\r\n\r\n#### Rule 12: Transitivity and Prepositional Regimes of Reporting Verbs\r\n* **Principle:** *Tell* is strictly transitive and requires an immediate indirect nominal/pronominal object without a preposition (*told me*); *Say* is intransitive regarding person objects and requires the preposition *to* (*said to me*). Verbs of inquiry take specific regimes (*demanded of, inquired of, asked [no prep]*).\r\n* **Formula:**\r\n  * `Subject + told + Object + that-Clause  (Never: told to + Object)`\r\n  * `Subject + said to + Object + that-Clause  (Never: said + Object without 'to')`\r\n  * `Subject + asked / questioned + Object  (Never: asked to + Object)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The commander told to the soldiers that reinforcements had arrived.*\r\n  * ✔️ *The commander **told the soldiers** that reinforcements had arrived.*\r\n  * ❌ *He said me that the conference was postponed.*\r\n  * ✔️ *He **said to me** that the conference was postponed.*\r\n\r\n---\r\n\r\n### Category D: Commands, Exclamations & Indirect Subjunctives\r\n\r\n#### Rule 13: Indirect Imperatives & The 'Forbid' Negative Trap\r\n* **Principle:** Direct commands, requests, and prohibitions are reported using an infinitive complement (*ordered / commanded / urged / advised + Object + to-V1*). The reporting verb *forbid* inherently expresses negation; adding a negative particle (*not*) to its infinitive complement creates an ungrammatical double negative.\r\n* **Formula:**\r\n  * `Subject + ordered / warned + Object + not to + Base Verb (V1)`\r\n  * `Subject + forbade + Object + to + Base Verb (V1)  (No 'not')`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The officer commanded the sentry that he should not sleep.*\r\n  * ✔️ *The officer commanded the sentry **not to sleep**.*\r\n  * ❌ *The court forbade the corporation not to liquidate its assets.*\r\n  * ✔️ *The court **forbade the corporation to liquidate** its assets.*\r\n\r\n---\r\n\r\n#### Rule 14: Indirect Reporting of Exclamations & Wishes\r\n* **Principle:** Direct exclamations and optative wishes cannot be reported with the verb *said*; they must be transformed using an appropriate descriptive verb followed by a propositional *that*-clause or optative formula.\r\n* **Formula:**\r\n  * *Exclamations:* `Subject + exclaimed with sorrow / joy / regret + that + Clause`\r\n  * *Wishes / Prayers:* `Subject + wished / prayed that + Subject + might + Base Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomat said, \"Alas! The peace initiative has failed.\"* $\\to$ *The diplomat said that alas the peace initiative failed.*\r\n  * ✔️ *The diplomat **exclaimed with sorrow that the peace initiative had failed**.*\r\n  * ❌ *The elder said to him, \"May you prosper.\"* $\\to$ *The elder said that he may prosper.*\r\n  * ✔️ *The elder **prayed that he might prosper**.*\r\n\r\n---\r\n\r\n#### Rule 15: Reporting Proposals and Suggestions ('Suggest' & 'Propose')\r\n* **Principle:** The reporting verbs *suggest* and *propose* cannot take an indirect object directly followed by an infinitive; they require either a prepositional phrase with *to* plus a *that*-clause containing the mandative modal **should**, or an immediate gerund complement.\r\n* **Formula:**\r\n  * `Subject + suggested / proposed + to + Object + that + Subject + should + Base Verb`\r\n  * `Subject + suggested / proposed + Gerund (V-ing)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The prime minister suggested the cabinet to ratify the treaty.*\r\n  * ✔️ *The prime minister **suggested to the cabinet that they should ratify** the treaty.*\r\n  * ✔️ *The prime minister **suggested ratifying** the treaty.*\r\n\r\n---\r\n\r\n### Category E: Question Tag Mechanics & Polarity Concord\r\n\r\n#### Rule 16: Canonical Polarity Inversion in Question Tags\r\n* **Principle:** Canonical question tags invert the polarity of the governing declarative anchor: an affirmative stem requires a negative tag; a negative stem requires an affirmative tag. The tag consists strictly of the appropriate auxiliary verb and a matching personal pronoun.\r\n* **Formula:**\r\n  * `Affirmative Stem , + Negative Tag [Auxiliary + n't + Personal Pronoun] ?`\r\n  * `Negative Stem , + Affirmative Tag [Auxiliary + Personal Pronoun] ?`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The treaty guarantees territorial integrity, does it?*\r\n  * ✔️ *The treaty guarantees territorial integrity, **doesn't it**?*\r\n  * ❌ *The envoy has not delivered the communique, hasn't he?*\r\n  * ✔️ *The envoy has not delivered the communique, **has he**?*\r\n\r\n---\r\n\r\n#### Rule 17: Latent / Inherent Negative Adverbs in Question Tags\r\n* **Principle:** Sentences containing words with inherently negative or restrictive semantic polarity (*seldom, rarely, scarcely, hardly, barely, little, few, neither, none*) are syntactically negative and must take an **affirmative** question tag.\r\n* **Formula:** `Subject + [seldom / rarely / scarcely / hardly / barely / little] + Verb , + Affirmative Tag ?`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foreign minister rarely makes unscripted remarks, doesn't he?*\r\n  * ✔️ *The foreign minister rarely makes unscripted remarks, **does he**?*\r\n  * ❌ *Little progress was achieved during the preliminary rounds, wasn't it?*\r\n  * ✔️ *Little progress was achieved during the preliminary rounds, **was it**?*\r\n\r\n---\r\n\r\n#### Rule 18: Exceptional Question Tag Regimes ('Aren't I', Imperatives, Indefinites)\r\n* **Principle:** Specialized grammatical anchors enforce irregular tag agreements:\r\n  1. *I am* takes the anomalous tag *aren't I?* (never *amn't I?*).\r\n  2. Inclusive imperatives with *Let's* take the tag *shall we?*.\r\n  3. Ordinary imperatives take *will you?* or *won't you?*.\r\n  4. Indefinite pronouns denoting persons (*everyone, someone, nobody, each*) take the plural pronoun **they** in the tag, requiring a plural auxiliary verb.\r\n* **Formula:**\r\n  * `I am + Complement , aren't I ?`\r\n  * `Let's + Verb , shall we ?`\r\n  * `[Everyone / Somebody / Nobody] + Verb , + [Plural Auxiliary] + they ?`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *I am eligible for the diplomatic appointment, amn't I?*\r\n  * ✔️ *I am eligible for the diplomatic appointment, **aren't I**?*\r\n  * ❌ *Everyone approved the constitutional amendments, didn't he?*\r\n  * ✔️ *Everyone approved the constitutional amendments, **didn't they**?*\r\n  * ❌ *Nobody supported the resolution, did he?*\r\n  * ✔️ *Nobody supported the resolution, **did they**?*  \r\n    *(Affirmative tag because 'nobody' is inherently negative)*\r\n\r\n# Module 11: Nouns, Articles, Determiners & Structural Number\r\n**Total Micro-Rules:** 26  \r\n**Question Output Target:** 78 Questions (3 Questions per Rule: Direct Diagnostic, Embedded Distractor, Inversion/Boundary Trap)\r\n\r\n---\r\n\r\n### Category A: Noun Countability, Mass Nouns & Invariant Morphology\r\n\r\n#### Rule 1: Strictly Uncountable Mass Nouns\r\n* **Principle:** Prototypical non-count mass nouns (*furniture, information, advice, luggage, baggage, machinery, scenery, poetry, equipment, pottery, cutlery, stationery, work*) cannot take the plural suffix *-s*, cannot be directly preceded by indefinite articles (*a/an*), and require partitive classifiers (*a piece of, an item of*) for individuation.\r\n* **Formula:**\r\n  * ❌ `a / an + [Uncountable Mass Noun]  OR  [Mass Noun] + -s`\r\n  * ✔️ `a piece of / an item of + [Mass Noun] + Singular Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The department received several useful informations from the intelligence officer.*\r\n  * ✔️ *The department received several **pieces of useful information** from the intelligence officer.*\r\n  * ❌ *The historical laboratory requires new modern equipments.*\r\n  * ✔️ *The historical laboratory requires **new modern equipment**.*\r\n\r\n---\r\n\r\n#### Rule 2: Polysemous Nouns with Divergent Meanings in Singular vs. Plural\r\n* **Principle:** Certain nouns alter their semantic denotation entirely when shifted from singular (uncountable/abstract) to plural (*wood/woods, good/goods, force/forces, premise/premises, content/contents, arm/arms, custom/customs, iron/irons, respect/respects*).\r\n* **Formula:** `[Noun Root + -s] = Lexically distinct semantic entity from [Noun Root]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The timber merchant surveyed the dense woods to harvest wood.*  \r\n    *(Confusing 'woods' [forest] with 'wood' [timber])*\r\n  * ✔️ *The security detail was compelled to use **force** to disperse the crowd.* [Physical power]\r\n  * ✔️ *The sovereign deployed military **forces** across the frontier.* [Armed troops]\r\n  * ❌ *He cleared his cargo through the custom.*\r\n  * ✔️ *He cleared his cargo through the **customs**.* [Tariff border control]\r\n\r\n---\r\n\r\n#### Rule 3: Invariant Plurals Lacking Suffixal Markers\r\n* **Principle:** Unmarked collective nouns (*cattle, clergy, gentry, poultry, vermin, police, folk, people*) are grammatically plural despite lacking an inflectional *-s*; they take plural verbs and plural anaphoric reference, and cannot take the singular indefinite article *a/an*.\r\n* **Formula:** `[Cattle / Police / Clergy / Gentry / Vermin] + Plural Verb + their`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The cattle is grazing peacefully on the communal pasture.*\r\n  * ✔️ *The cattle **are grazing** peacefully on the communal pasture.*\r\n  * ❌ *A police has intercepted the armored transport.*\r\n  * ✔️ * **A police officer has** intercepted the armored transport.*  \r\n  * ✔️ *The **police have** intercepted the armored transport.*\r\n\r\n---\r\n\r\n#### Rule 4: Invariant Singular Nouns Terminating in '-s'\r\n* **Principle:** Certain nouns ending in *-s* (*news, innings, summons, series, species, barracks, headquarters*) designate singular concepts. While *series* and *species* are invariant (identical in singular and plural), *summons* is strictly singular (plural: *summonses*).\r\n* **Formula:**\r\n  * `a summons (Singular) ➔ two summonses (Plural)`\r\n  * `an innings (Singular) ➔ three innings (Plural)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The judicial magistrate issued a summon against the defendant.*\r\n  * ✔️ *The judicial magistrate issued a **summons** against the defendant.*\r\n  * ❌ *Three summons has been served by the bailiff this morning.*\r\n  * ✔️ *Three **summonses have been** served by the bailiff this morning.*\r\n\r\n---\r\n\r\n#### Rule 5: Paired Implements and Bifurcated Garments\r\n* **Principle:** Nouns designating implements or apparel consisting of two symmetrical parts (*scissors, shears, tongs, pliers, tweezers, trousers, spectacles, binoculars*) are plural and govern plural verbs, unless individualization is imposed by the classifier phrase *a pair of*.\r\n* **Formula:**\r\n  * `[Scissors / Trousers / Spectacles] + Plural Verb`\r\n  * `A pair of + [Scissors / Trousers / Spectacles] + Singular Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The surgical scissors is resting on the sterilized tray.*\r\n  * ✔️ *The surgical scissors **are resting** on the sterilized tray.*\r\n  * ✔️ *A pair of surgical scissors **is resting** on the sterilized tray.*\r\n\r\n---\r\n\r\n### Category B: Irregular & Foreign Nominal Pluralization\r\n\r\n#### Rule 6: Classical Latin and Greek Foreign Plural Inflections\r\n* **Principle:** Nouns borrowed directly from Classical Greek and Latin preserve their native inflectional morphology: *-on/-um $\\to$ -a*, *-is $\\to$ -es*, *-us $\\to$ -i*, *-a $\\to$ -ae*. Using vernacular English double plurals (*phenomenas, criterias*) is ungrammatical.\r\n* **Formula:**\r\n  * `criterion (Singular) ➔ criteria (Plural)`\r\n  * `phenomenon (Singular) ➔ phenomena (Plural)`\r\n  * `crisis / thesis / analysis (Singular) ➔ crises / theses / analyses (Plural)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The primary criteria for admission was revised by the dean.*\r\n  * ✔️ *The primary **criterion** for admission **was** revised by the dean.*\r\n  * ✔️ *The primary **criteria** for admission **were** revised by the dean.*\r\n  * ❌ *The meteorological phenomenas baffled the researchers.*\r\n  * ✔️ *The meteorological **phenomena** baffled the researchers.*\r\n\r\n---\r\n\r\n#### Rule 7: Compound Noun Pluralization (Head Noun Inflection)\r\n* **Principle:** In hyphenated compound nouns consisting of a noun and a prepositional phrase or postpositive modifier (*commander-in-chief, passer-by, looker-on, attorney-at-law, son-in-law*), the plural suffix *-s* must attach to the principal **head noun**, not to the modifying particle or terminal noun.\r\n* **Formula:** `[Head Noun + -s] + Preposition / Modifier`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *All the commander-in-chiefs convened for an emergency war council.*\r\n  * ✔️ *All the **commanders-in-chief** convened for an emergency war council.*\r\n  * ❌ *The passers-bys observed the demonstration with curiosity.*\r\n  * ✔️ *The **passers-by** observed the demonstration with curiosity.*\r\n\r\n---\r\n\r\n#### Rule 8: Compound Nouns Formed with 'Man' and 'Woman'\r\n* **Principle:** When *man* or *woman* designates the sex of a professional title (*man-servant, woman-doctor*), **both** elements undergo pluralization; when *man* functions merely as the direct object of an agentive compound (*man-eater, woman-hater*), only the terminal noun takes the plural suffix.\r\n* **Formula:**\r\n  * *Appositive Title (Both inflect):* `men-servants / women-doctors`\r\n  * *Transitive Compound (Terminal inflects):* `man-eaters / woman-haters`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The hospital employed thirty woman-doctors during the epidemic.*\r\n  * ✔️ *The hospital employed thirty **women-doctors** during the epidemic.*\r\n  * ❌ *The hunters tracked the two men-eaters through the jungle.*\r\n  * ✔️ *The hunters tracked the two **man-eaters** through the jungle.*\r\n\r\n---\r\n\r\n#### Rule 9: Hyphenated Numerical Compound Modifiers\r\n* **Principle:** When a numerical expression and a measure noun unite to form a compound attributive adjective preceding a head noun, the measure noun remains in its invariant singular base form.\r\n* **Formula:**\r\n  * *Attributive Modifying Compound:* `Determiner + [Number - Singular Measure Noun] + Head Noun`\r\n  * *Independent Predicative Measure:* `Number + Plural Measure Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The company secured a five-years contract with the municipal council.*\r\n  * ✔️ *The company secured a **five-year contract** with the municipal council.*\r\n  * ❌ *He presented a five-hundred-rupees note at the ticket counter.*\r\n  * ✔️ *He presented a **five-hundred-rupee note** at the ticket counter.*\r\n  * ✔️ *The note was worth **five hundred rupees**.*\r\n\r\n---\r\n\r\n### Category C: Determiners & Quantifier Distribution\r\n\r\n#### Rule 10: 'Few', 'A Few', and 'The Few' (Countable Distribution)\r\n* **Principle:** With plural countable nouns:\r\n  1. *Few* carries negative polarity (almost none / scarce).\r\n  2. *A few* carries affirmative polarity (a modest, positive quantity).\r\n  3. *The few* designates the totality of an existing, specific minority subset.\r\n* **Formula:** `[Few (Negative) / A few (Positive) / The few (Specific total)] + Plural Countable Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *He is a reclusive scholar who has a few friends, so he lives in total isolation.*\r\n  * ✔️ *He is a reclusive scholar who has **few friends**, so he lives in total isolation.*\r\n  * ✔️ *Although he is reserved, he has **a few close associates**.*\r\n  * ✔️ * **The few friends** he had stood by him during the trial.*\r\n\r\n---\r\n\r\n#### Rule 11: 'Little', 'A Little', and 'The Little' (Uncountable Distribution)\r\n* **Principle:** With singular uncountable/mass nouns:\r\n  1. *Little* conveys negative polarity (hardly any / virtually nil).\r\n  2. *A little* conveys positive polarity (some / a small amount).\r\n  3. *The little* denotes the whole of a specified, modest available quantity.\r\n* **Formula:** `[Little (Negative) / A little (Positive) / The little (Specific total)] + Uncountable Mass Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *There was a little hope of rescuing the miners after the shaft flooded completely.*\r\n  * ✔️ *There was **little hope** of rescuing the miners after the shaft flooded completely.*\r\n  * ✔️ * **The little water** that remained in the canteen sustained the lost patrol.*\r\n\r\n---\r\n\r\n#### Rule 12: Countable vs. Mass Quantifier Regimes ('Many' vs. 'Much')\r\n* **Principle:** *Many* qualifies plural countable nouns; *Much, a great deal of,* and *a large amount of* qualify singular uncountable nouns. Substituting *amount* or *much* for countable nouns is a structural error.\r\n* **Formula:**\r\n  * `Many / A large number of + Plural Countable Noun`\r\n  * `Much / A large amount of / A great deal of + Uncountable Mass Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *A substantial amount of delegates boycotted the plenary session.*\r\n  * ✔️ *A substantial **number of delegates** boycotted the plenary session.*\r\n  * ❌ *The project consumed too many electricity during the trial.*\r\n  * ✔️ *The project consumed **too much electricity** during the trial.*\r\n\r\n---\r\n\r\n#### Rule 13: 'Many a' Singular Concord vs. 'A Great Many' Plural Concord\r\n* **Principle:** *Many a* takes a singular noun followed by a singular verb and singular pronouns; *A great many* takes a plural noun followed by a plural verb.\r\n* **Formula:**\r\n  * `Many a + Singular Noun + Singular Verb + his / her`\r\n  * `A great many + Plural Noun + Plural Verb + their`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Many a candidate have submitted their credentials late.*\r\n  * ✔️ *Many a candidate **has submitted his or her** credentials late.*\r\n  * ✔️ *A great many candidates **have submitted their** credentials late.*\r\n\r\n---\r\n\r\n#### Rule 14: Distributive Constraints: 'Each' vs. 'Every'\r\n* **Principle:** *Each* refers to individual members of a group of **two or more** and can function as both a determiner and an independent pronoun; *Every* refers to members of a group of **three or more**, emphasizes the collective whole, and functions strictly as a determiner (never a standalone pronoun).\r\n* **Formula:**\r\n  * `Each of the two / three + Plural Noun + Singular Verb`\r\n  * `Every + Singular Noun (Requires at least three members; cannot take 'of')`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Every of the two candidates was vetted by the intelligence agency.*\r\n  * ✔️ * **Each of the two candidates was** vetted by the intelligence agency.*\r\n  * ✔️ * **Every candidate** in the auditorium was vetted.*\r\n\r\n---\r\n\r\n### Category D: Definite Article Regimes ('The')\r\n\r\n#### Rule 15: Unique Entities, Celestial Bodies & Superlative Modifiers\r\n* **Principle:** The definite article *the* is obligatory before nouns designating unique cosmic or geographical entities (*the sun, the moon, the equator, the earth*) and adjectives in the superlative degree or ordinal ranks (*the highest, the first, the sole*).\r\n* **Formula:** `the + [Unique Entity / Superlative Adjective / Ordinal Number] + Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Moon orbits earth once every twenty-seven days.*\r\n  * ✔️ * **The moon** orbits **the earth** once every twenty-seven days.*\r\n  * ❌ *He was selected as first candidate to receive grant.*\r\n  * ✔️ *He was selected as **the first candidate** to receive **the** grant.*\r\n\r\n---\r\n\r\n#### Rule 16: Toponymic and Geographical Article Distributions\r\n* **Principle:** The definite article *the* is required before rivers, seas, oceans, mountain chains, deserts, archipelagos, and political entities with plural or republic/kingdom/states designations (*the Thames, the Pacific, the Alps, the Sahara, the Maldives, the United Kingdom, the Netherlands*). Individual peaks, individual lakes, and singular nation-states take zero article (*Mount Everest, Lake Superior, France*).\r\n* **Formula:**\r\n  * `the + [Mountain Range / River / Ocean / Plural Nation]`\r\n  * `Zero Article + [Singular Peak / Singular Lake / Standard Sovereign Country]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The Mount Everest is the highest mountain peak in the Himalayas.*\r\n  * ✔️ * **Mount Everest** is the highest mountain peak in **the Himalayas**.*\r\n  * ❌ *The delegation traveled to United States via Atlantic Ocean.*\r\n  * ✔️ *The delegation traveled to **the United States** via **the Atlantic Ocean**.*\r\n\r\n---\r\n\r\n#### Rule 17: Nominalized Adjectives Denoting Generic Classes\r\n* **Principle:** When an adjective is converted into a collective plural noun to designate an entire sociological class of people (*the poor, the rich, the blind, the homeless, the deceased, the elderly*), it takes the definite article *the* and mandates a plural verb without adding an inflectional *-s*.\r\n* **Formula:** `the + [Adjective] + Plural Verb (Never add '-s' to the adjective)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The poors require access to basic financial instruments.*\r\n  * ✔️ * **The poor require** access to basic financial instruments.*\r\n  * ❌ *The elderly is particularly vulnerable to respiratory infections.*\r\n  * ✔️ * **The elderly are** particularly vulnerable to respiratory infections.*\r\n\r\n---\r\n\r\n#### Rule 18: Institutional Nouns: Primary Purpose vs. Secondary Visit\r\n* **Principle:** Nouns designating institutions (*school, college, university, church, bed, hospital, prison, market*) take zero article when visited for their intrinsic primary purpose (e.g., studying, worshiping, being incarcerated, receiving medical treatment); they mandate *the* when visited for a secondary, specific purpose or as an architectural building.\r\n* **Formula:**\r\n  * *Primary Inherent Function:* `Verb [go / send / put] + to + [school / prison / hospital / church] (Zero Article)`\r\n  * *Secondary Specific Location:* `Verb + to + the + [school / hospital / prison]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The criminal was sentenced and sent to the prison for five years.*\r\n  * ✔️ *The criminal was sentenced and sent to **prison** for five years.* [Incarceration]\r\n  * ✔️ *The architect walked to **the prison** to inspect the structural masonry.* [Secondary visit]\r\n\r\n---\r\n\r\n#### Rule 19: Musical Instruments vs. Competitive Sports and Games\r\n* **Principle:** Verbs of playing require the definite article *the* before musical instruments (*play the piano, the violin, the flute*), but take the zero article before names of sports, games, and leisure activities (*play football, cricket, chess, tennis*).\r\n* **Formula:**\r\n  * `play + the + Musical Instrument`\r\n  * `play + Zero Article + Sport / Board Game`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The child learned to play piano while practicing cricket on weekends.*\r\n  * ✔️ *The child learned to play **the piano** while practicing **cricket** on weekends.*\r\n\r\n---\r\n\r\n#### Rule 20: Parallel Definite Articles in Correlative Comparative Proportions\r\n* **Principle:** In correlative comparative clauses expressing reciprocal development (*The... the...*), the definite article *the* is obligatory before both comparative elements.\r\n* **Formula:** `The + Comparative Degree + Clause, the + Comparative Degree + Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *More severe the sanctions became, more resistant the regime grew.*\r\n  * ✔️ * **The more severe** the sanctions became, **the more resistant** the regime grew.*\r\n\r\n---\r\n\r\n### Category E: Indefinite & Zero Article Mechanics\r\n\r\n#### Rule 21: Phonetic Distribution of 'A' vs. 'An'\r\n* **Principle:** The choice between *a* and *an* is governed strictly by the initial **sound (phoneme)** of the following word, not by orthographic lettering. Words opening with a vowel sound take *an* (*an hour, an heir, an honest man, an MBA, an MP*); words opening with a consonant sound (including glide consonants /j/ and /w/) take *a* (*a European, a university, a unique specimen, a one-rupee note*).\r\n* **Formula:**\r\n  * `an + [Vowel Sound: /æ/, /e/, /ɪ/, /ɒ/, /ʌ/, silent 'h']`\r\n  * `a + [Consonant Sound: including /juː/ and /wʌ/]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The university appointed an European scholar to chair the council.*\r\n  * ✔️ *The university appointed **a European scholar** to chair the council.*\r\n  * ❌ *He proved to be a honest mediator during the negotiations.*\r\n  * ✔️ *He proved to be **an honest mediator** during the negotiations.*\r\n\r\n---\r\n\r\n#### Rule 22: Zero Article with Abstract and Material Nouns in Generic Sense\r\n* **Principle:** Abstract nouns (*honesty, courage, truth*) and material mass nouns (*gold, water, wheat*) take the zero article when used in a broad, generic sense. They take *the* only when post-modified and restricted by an *of*-phrase or relative clause.\r\n* **Formula:**\r\n  * *Generic:* `Zero Article + [Abstract / Material Noun]`\r\n  * *Restricted / Specific:* `the + [Abstract / Material Noun] + of + Noun Phrase`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The honesty is the greatest virtue a magistrate can possess.*\r\n  * ✔️ * **Honesty** is the greatest virtue a magistrate can possess.*\r\n  * ❌ *Honesty of the witness impressed the presiding judge.*\r\n  * ✔️ * **The honesty of the witness** impressed the presiding judge.*\r\n\r\n---\r\n\r\n#### Rule 23: Zero Article with Meals, Academic Subjects, Languages & Diseases\r\n* **Principle:** Names of meals (*breakfast, lunch, dinner*), languages (*English, French, Hindi*), academic disciplines (*chemistry, philosophy*), and most diseases take zero article. When a language name is preceded by *the*, it designates the collective people or nationality (*the English = English people*).\r\n* **Formula:**\r\n  * *Language alone:* `Zero Article + English / French`\r\n  * *Nationality class:* `the + English / French`\r\n  * *Direct modifier:* `the + English language`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *He is fluent in the German, but struggles with the conversational syntax.*\r\n  * ✔️ *He is fluent in **German**, but struggles with conversational syntax.*\r\n  * ✔️ * **The German delegation** arrived on time.*\r\n\r\n---\r\n\r\n#### Rule 24: Predicative Nouns of Unique Office or Appointed Rank\r\n* **Principle:** Nouns designating a singular, unique post, office, or public rank (*president, chairman, director, captain*) take zero article when functioning as object complements following verbs of election, appointment, or declaration (*elect, appoint, make, choose, crown*).\r\n* **Formula:** `Subject + elect / appoint / crown + Object + Zero Article + [Unique Title]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The board of trustees elected him as the chairman of the executive council.*\r\n  * ✔️ *The board of trustees elected him **chairman** of the executive council.*\r\n  * ❌ *They crowned him as a king after the abdication.*\r\n  * ✔️ *They crowned him **king** after the abdication.*\r\n\r\n---\r\n\r\n#### Rule 25: Omission of Articles After Taxonomic Expressions\r\n* **Principle:** Singular nouns following taxonomic classifying phrases (*type of, kind of, sort of, species of, variety of*) take zero article in formal prescriptive English.\r\n* **Formula:** `[kind / sort / type / variety] + of + Zero Article + Singular Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *What kind of a person would compromise national defense?*\r\n  * ✔️ *What kind of **person** would compromise national defense?*\r\n  * ❌ *This is a rare species of a bird endemic to the archipelago.*\r\n  * ✔️ *This is a rare species of **bird** endemic to the archipelago.*\r\n\r\n---\r\n\r\n#### Rule 26: Article Positioning with Exclamative and Degree Intensifiers\r\n* **Principle:** In structures with *such, what, many,* and *quite*, the indefinite article *a/an* follows the intensifier (*such a catastrophe, what a victory*). In constructions with *so, too, as,* and *how*, the adjective precedes the indefinite article (*so catastrophic a failure, too heavy a burden*).\r\n* **Formula:**\r\n  * `such / what / quite + a / an + Adjective + Singular Noun`\r\n  * `so / too / as / how + Adjective + a / an + Singular Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sovereign faced a too heavy burden to manage alone.*\r\n  * ✔️ *The sovereign faced **too heavy a burden** to manage alone.*\r\n  * ❌ *It was a so catastrophic event that markets collapsed.*\r\n  * ✔️ *It was **so catastrophic an event that** markets collapsed.*\r\n  * ✔️ *It was **such a catastrophic event that** markets collapsed.*\r\n\r\n# Module 12: Fixed Prepositions & Prepositional Collocations\r\n**Curated Selection:** 25 of 200 Core Collocations  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category A: Adherence, Compliance & Institutional Agreement\r\n\r\n#### Item 1: 'Abide By' (Institutional Adherence)\r\n* **Principle:** The verb *abide* governs the preposition **by** when meaning to conform to, accept, or submit to a rule, decision, or contractual obligation; pairing it with *with* or *to* is ungrammatical.\r\n* **Formula:** `Subject + abide + by + [Decision / Law / Rule / Treaty]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Both sovereign nations agreed to abide to the arbitral tribunal's verdict.*\r\n  * ✔️ *Both sovereign nations agreed to **abide by** the arbitral tribunal's verdict.*\r\n\r\n---\r\n\r\n#### Item 2: 'Accede To' (Formal Assent)\r\n* **Principle:** *Accede* takes the preposition **to** when expressing formal agreement to a demand, treaty, or accession to high office; it never takes *with* or *for*.\r\n* **Formula:** `Subject + accede + to + [Request / Demand / Treaty / Throne]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The ministry refused to accede with the demands of the trade union.*\r\n  * ✔️ *The ministry refused to **accede to** the demands of the trade union.*\r\n\r\n---\r\n\r\n#### Item 3: 'Adhere To' (Literal & Metaphorical Fidelity)\r\n* **Principle:** *Adhere* governs **to** both in physical contexts (sticking to a surface) and figurative contexts (following principles, doctrines, or schedules).\r\n* **Formula:** `Subject + adhere + to + [Guideline / Principle / Protocol]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The laboratory staff must adhere with the strict biosecurity protocols.*\r\n  * ✔️ *The laboratory staff must **adhere to** the strict biosecurity protocols.*\r\n\r\n---\r\n\r\n#### Item 4: 'Comply With' (Regulatory Conformity)\r\n* **Principle:** The verb *comply* mandates the preposition **with**; substituting *to* (often influenced by confusion with *conform to*) is a standard diagnostic error.\r\n* **Formula:** `Subject + comply + with + [Regulations / Demands / Mandates]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *All offshore financial entities must comply to the new anti-money-laundering directive.*\r\n  * ✔️ *All offshore financial entities must **comply with** the new anti-money-laundering directive.*\r\n\r\n---\r\n\r\n#### Item 5: 'Concur With' [Person] vs. 'Concur In' [Decision]\r\n* **Principle:** *Concur* takes **with** when agreeing with an agent or person, but takes **in** when agreeing with an opinion, judgment, or formal finding.\r\n* **Formula:**\r\n  * `Subject + concur + with + [Person]`\r\n  * `Subject + concur + in + [Opinion / Finding / Verdict]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Justice Harlan concurred with the majority's written opinion.*\r\n  * ✔️ *Justice Harlan **concurred in** the majority's written opinion.*\r\n  * ✔️ *Justice Harlan **concurred with** his judicial colleagues.*\r\n\r\n---\r\n\r\n### Category B: Proportion, Equivalence & Disposition\r\n\r\n#### Item 6: 'Commensurate With' (Proportional Balance)\r\n* **Principle:** The adjective *commensurate* governs **with** to denote being corresponding in size, degree, or proportion; pairing it with *to* or *for* is an error.\r\n* **Formula:** `Subject + be + commensurate + with + [Effort / Scale / Risk]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The remuneration offered was not commensurate to the executive's responsibilities.*\r\n  * ✔️ *The remuneration offered was not **commensurate with** the executive's responsibilities.*\r\n\r\n---\r\n\r\n#### Item 7: 'Conducive To' (Fostering Outcomes)\r\n* **Principle:** *Conducive* takes the preposition **to** (meaning making a certain situation or outcome likely or possible); it never takes *for*.\r\n* **Formula:** `Subject + be + conducive + to + [Noun Phrase / Gerund]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Hyperinflation is not conducive for sustainable industrial growth.*\r\n  * ✔️ *Hyperinflation is not **conducive to** sustainable industrial growth.*\r\n\r\n---\r\n\r\n#### Item 8: 'Akin To' (Analogous Nature)\r\n* **Principle:** The predicative adjective *akin* requires **to** when indicating similarity of character or essence; it strictly prohibits *with*.\r\n* **Formula:** `Subject + be + akin + to + [Noun Phrase / Gerund]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *His unilateral political decree was akin with an unconstitutional coup.*\r\n  * ✔️ *His unilateral political decree was **akin to** an unconstitutional coup.*\r\n\r\n---\r\n\r\n#### Item 9: 'Averse To' (Psychological Reluctance + Gerund)\r\n* **Principle:** *Averse* mandates the preposition **to** (never *from* or *against*). Because *to* is a genuine preposition here, it must be followed by a noun or gerund (*V-ing*).\r\n* **Formula:** `Subject + be + averse + to + [Noun Phrase / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The conservative investor is averse from risk.*\r\n  * ✔️ *The conservative investor is **averse to risk**.*\r\n  * ❌ *He is averse to take speculative positions in foreign exchange.*\r\n  * ✔️ *He is **averse to taking** speculative positions in foreign exchange.*\r\n\r\n---\r\n\r\n#### Item 10: 'Subservient To' (Subordination)\r\n* **Principle:** *Subservient* governs **to** when denoting complete subordination or excessive deference; pairing it with *under* or *with* violates standard collocation.\r\n* **Formula:** `Subject + be + subservient + to + [Authority / Master / Institution]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The administrative judiciary cannot be subservient under the executive branch.*\r\n  * ✔️ *The administrative judiciary cannot be **subservient to** the executive branch.*\r\n\r\n---\r\n\r\n### Category C: Affliction, Deprivation & Saturation\r\n\r\n#### Item 11: 'Afflicted With' vs. 'Inflicted On'\r\n* **Principle:** A living patient/subject is *afflicted* **with** a disease or burden; an external injury, penalty, or blow is *inflicted* **on / upon** a recipient.\r\n* **Formula:**\r\n  * `Subject (Sufferer) + be + afflicted + with + [Disease / Misfortune]`\r\n  * `Agent + inflict + [Pain / Penalty] + on / upon + Victim`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The civilian population was inflicted with severe famine.*\r\n  * ✔️ *The civilian population was **afflicted with** severe famine.*\r\n  * ✔️ *The invader **inflicted heavy casualties on** the defenders.*\r\n\r\n---\r\n\r\n#### Item 12: 'Bereft Of' (Total Deprivation)\r\n* **Principle:** The archaic past participle *bereft* (functioning as an adjective meaning deprived of or entirely lacking) takes **of**, never *from* or *with*.\r\n* **Formula:** `Subject + be + bereft + of + [Hope / Reason / Resources]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The ruined citadel was entirely bereft from human life.*\r\n  * ✔️ *The ruined citadel was entirely **bereft of** human life.*\r\n\r\n---\r\n\r\n#### Item 13: 'Fraught With' (Pervasive Threat)\r\n* **Principle:** *Fraught* takes **with** when expressing that a situation or journey is filled or charged with undesirable elements (perils, risks, complexities).\r\n* **Formula:** `Subject + be + fraught + with + [Danger / Risk / Complications]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomatic negotiation was fraught by procedural pitfalls.*\r\n  * ✔️ *The diplomatic negotiation was **fraught with** procedural pitfalls.*\r\n\r\n---\r\n\r\n#### Item 14: 'Infested With' (Parasitic Proliferation)\r\n* **Principle:** The verb or participle *infest* governs **with** to denote being overrun by pests, vermin, or parasites; using *by* or *of* is ungrammatical.\r\n* **Formula:** `Place / Subject + be + infested + with + [Parasites / Pests / Vermin]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The marshland warehouse was infested by disease-carrying rodents.*\r\n  * ✔️ *The marshland warehouse was **infested with** disease-carrying rodents.*\r\n\r\n---\r\n\r\n#### Item 15: 'Deprive Of' (Stripping of Possessions)\r\n* **Principle:** The transitive verb *deprive* governs the direct object followed strictly by the preposition **of**; substituting *from* is an erroneous literalism.\r\n* **Formula:** `Subject + deprive + Direct Object + of + [Rights / Property / Liberty]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The authoritarian decree deprived the citizens from their civil liberties.*\r\n  * ✔️ *The authoritarian decree deprived the citizens **of** their civil liberties.*\r\n\r\n---\r\n\r\n### Category D: Awareness, Access & Receptivity\r\n\r\n#### Item 16: 'Privy To' (Confidential Access)\r\n* **Principle:** The adjective *privy* (sharing in the knowledge of something secret or private) obligatorily requires the preposition **to**, never *with* or *of*.\r\n* **Formula:** `Subject + be + privy + to + [Confidential Information / Secrets / Plans]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Only three senior generals were privy with the invasion timetable.*\r\n  * ✔️ *Only three senior generals were **privy to** the invasion timetable.*\r\n\r\n---\r\n\r\n#### Item 17: 'Oblivious Of / To' (Unawareness)\r\n* **Principle:** *Oblivious* (unaware or unconscious of one's surroundings or impending facts) takes **of** in strict formal English, though **to** is fully acceptable; it never takes *about* or *from*.\r\n* **Formula:** `Subject + be + oblivious + of / to + [Surroundings / Danger / Facts]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sentry remained oblivious about the enemy advancing through the mist.*\r\n  * ✔️ *The sentry remained **oblivious of** the enemy advancing through the mist.*\r\n  * ✔️ *The sentry remained **oblivious to** the impending danger.*\r\n\r\n---\r\n\r\n#### Item 18: 'Impervious To' (Inability to be Affected)\r\n* **Principle:** *Impervious* (incapable of being penetrated, influenced, or affected) governs **to**; it strictly excludes *against* or *from*.\r\n* **Formula:** `Subject + be + impervious + to + [Criticism / Pain / Penetration]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The dictator was entirely impervious against international public condemnation.*\r\n  * ✔️ *The dictator was entirely **impervious to** international public condemnation.*\r\n\r\n---\r\n\r\n#### Item 19: 'Indifferent To' (Apathetic Detachment)\r\n* **Principle:** The adjective *indifferent* (having no interest, sympathy, or concern) takes **to**; using *towards*, *about*, or *for* is an error.\r\n* **Formula:** `Subject + be + indifferent + to + [Suffering / Plight / Outcome]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The magistrate was completely indifferent towards the plight of the refugees.*\r\n  * ✔️ *The magistrate was completely **indifferent to** the plight of the refugees.*\r\n\r\n---\r\n\r\n#### Item 20: 'Adept In / At' (Proficiency Regimes)\r\n* **Principle:** *Adept* governs **in** (when referring to an art, field of study, or science) or **at** (when referring to a specific mechanical skill or action followed by a gerund); it never takes *with*.\r\n* **Formula:**\r\n  * `Subject + be + adept + in + [Discipline / Field]`\r\n  * `Subject + be + adept + at + [Gerund / Specific Action]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomat was adept with defusing hostile cross-examinations.*\r\n  * ✔️ *The diplomat was **adept at defusing** hostile cross-examinations.*\r\n  * ✔️ *She is **adept in** constitutional jurisprudence.*\r\n\r\n---\r\n\r\n### Category E: Dual Preposition Alternations (Person vs. Entity)\r\n\r\n#### Item 21: 'Dispense With' (Renouncing Need)\r\n* **Principle:** *Dispense* governs **with** when meaning to manage without, get rid of, or forego something (*dispense with pleasantries*); *dispense* without *with* is transitive and means to distribute (*dispense justice / medicine*). *Dispense of* is ungrammatical.\r\n* **Formula:** `Subject + dispense + with + [Formalities / Services / Requirements]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The tribunal resolved to dispense of the redundant evidentiary hearings.*\r\n  * ✔️ *The tribunal resolved to **dispense with** the redundant evidentiary hearings.*\r\n  * ✔️ *The Red Cross **dispensed medicine** to the victims.* [Transitive: distribute]\r\n\r\n---\r\n\r\n#### Item 22: 'Part With' [Thing] vs. 'Part From' [Person]\r\n* **Principle:** One *parts* **with** an object, heirloom, property, or money (relinquishing possession); one *parts* **from** a human companion or person (separation of company).\r\n* **Formula:**\r\n  * `Subject + part + with + [Inanimate Possession / Money]`\r\n  * `Subject + part + from + [Person / Associate]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The collector refused to part from the rare Shakespearean folio.*\r\n  * ✔️ *The collector refused to **part with** the rare Shakespearean folio.*\r\n  * ❌ *Tears flowed as the soldier parted with his family at the rail platform.*\r\n  * ✔️ *Tears flowed as the soldier **parted from** his family at the rail platform.*\r\n\r\n---\r\n\r\n#### Item 23: 'Agree With' [Person] vs. 'Agree To' [Proposal]\r\n* **Principle:** One *agrees* **with** a person (or with an opinion/analysis); one *agrees* **to** an action, proposal, condition, or t
