hey require semantically descriptive verbs ('exclaimed with sorrow', 'prayed that... might') — examinees use generic 'said' for all forms of reported utterance.","doubt":false},"m10_15":{"s":"learning","diff":"moderate","imp":"medium","n":"'Suggest/propose' cannot directly take a person object + infinitive ('suggested the cabinet to ratify'); they require 'to + person + that + should + V1' or a gerund complement — examinees pattern them on 'advise/urge + object + to-infinitive'.","doubt":false},"m10_16":{"s":"learning","diff":"easy","imp":"high","n":"Canonical question tags invert polarity (affirmative stem → negative tag; negative stem → positive tag); examinees write same-polarity tags ('guarantees... does it?') or wrong auxiliary, particularly when the main verb is not a standard auxiliary.","doubt":false},"m10_17":{"s":"learning","diff":"tough","imp":"high","n":"Inherently negative adverbs (rarely, hardly, scarcely, little) make a clause semantically negative, requiring an affirmative tag ('rarely... does he?'); examinees use a negative tag by responding to surface form, ignoring the covert polarity.","doubt":false},"m10_18":{"s":"learning","diff":"tough","imp":"high","n":"Exceptional tag regimes include: 'I am → aren't I?' (not 'amn't I?'), 'Let's → shall we?', imperatives → 'will you?', and indefinites (everyone, nobody) → 'didn't they?' — examinees apply regular tag rules to these exceptional anchors.","doubt":false},"m11_1":{"s":"learning","diff":"easy","imp":"high","n":"Mass nouns (furniture, information, advice, luggage, equipment) never take '-s' or 'a/an'; examinees pluralize them ('informations', 'equipments') by direct translation from L1 languages where these nouns are countable.","doubt":false},"m11_2":{"s":"learning","diff":"tough","imp":"medium","n":"Polysemous nouns (wood/woods, force/forces, custom/customs, arm/arms) shift meaning entirely from singular to plural; examinees use the singular form where the plural is semantically required ('cleared through custom' vs. 'customs').","doubt":false},"m11_3":{"s":"learning","diff":"easy","imp":"high","n":"Unmarked collective nouns (police, cattle, clergy, poultry) are inherently plural despite lacking '-s'; examinees write 'police has' or 'a police' — a consistent SSC CGL trap exposed by the SVA section.","doubt":false},"m11_4":{"s":"learning","diff":"moderate","imp":"medium","n":"'Summons' is singular (plural: 'summonses'); examinees drop the '-s' to form 'a summon' (non-existent), or write 'summons' as a plural (grammatically wrong without '-es'), confusing invariant -s endings with singular summons.","doubt":false},"m11_5":{"s":"learning","diff":"easy","imp":"high","n":"Paired garments/implements (scissors, trousers, spectacles) take plural verbs alone but singular after 'a pair of'; examinees use singular verb with the standalone plural noun ('scissors is'), a very common SVA trap in SSC.","doubt":false},"m11_6":{"s":"learning","diff":"tough","imp":"high","n":"Latin/Greek plurals (criterion→criteria, phenomenon→phenomena, crisis→crises, thesis→theses) are treated as singular by examinees who write 'the criteria was' or as a different word entirely ('phenomenas') — a high-frequency CAT vocab-grammar trap.","doubt":false},"m11_7":{"s":"learning","diff":"tough","imp":"medium","n":"In hyphenated compounds (commander-in-chief, passers-by), the plural '-s' attaches to the head noun only, not the preposition or terminal noun; examinees pluralize the last word ('commander-in-chiefs') by default.","doubt":false},"m11_8":{"s":"learning","diff":"tough","imp":"medium","n":"Man/woman appositive compounds ('women-doctors') pluralize both elements; transitive compounds ('man-eaters') pluralize only the terminal noun; examinees apply one rule to all compound types, producing wrong plurals.","doubt":false},"m11_9":{"s":"learning","diff":"easy","imp":"high","n":"Attributive compound adjectives ('five-year contract') use singular invariant measure nouns with hyphens; examinees pluralize ('five-years contract') or omit hyphens, confusing the compound modifier with the predicative measure phrase.","doubt":false},"m11_10":{"s":"learning","diff":"moderate","imp":"high","n":"'Few' (scarce/negative) vs. 'a few' (modest/positive) vs. 'the few' (specific subset total) — using 'a few' in a context that requires the negative 'few' reverses the intended meaning, a semantic polarity trap in SSC CGL.","doubt":false},"m11_11":{"s":"learning","diff":"moderate","imp":"high","n":"'Little' (hardly any/negative) vs. 'a little' (some/positive) vs. 'the little' (all of a small amount) — examinees use 'a little hope' in a hopeless scenario, reversing the negative polarity and distorting the contextual logic.","doubt":false},"m11_12":{"s":"learning","diff":"moderate","imp":"high","n":"'Amount of' governs mass/uncountable nouns; 'number of' governs plural countables — examinees write 'a substantial amount of delegates', replacing 'number' with 'amount' for any quantity expression regardless of countability.","doubt":false},"m11_13":{"s":"learning","diff":"moderate","imp":"high","n":"'Many a + singular noun + singular verb' ('many a candidate has') vs. 'a great many + plural noun + plural verb' ('a great many candidates have') — examinees use plural verb after 'many a', confusing it with 'many'.","doubt":false},"m11_14":{"s":"learning","diff":"moderate","imp":"high","n":"'Each' can precede two or more items and function as pronoun ('each of the two'); 'every' requires three or more and cannot take 'of' — examinees use 'every of the two', attaching 'of' to 'every' in an ungrammatical partitive.","doubt":false},"m11_15":{"s":"learning","diff":"easy","imp":"high","n":"Unique cosmic/geographical entities (the sun, the moon, the earth) and superlatives/ordinals take 'the'; examinees omit the article ('Moon orbits earth') by treating unique entities as proper nouns that require zero article.","doubt":false},"m11_16":{"s":"learning","diff":"moderate","imp":"high","n":"Mountain ranges take 'the' (the Himalayas), individual peaks take zero article (Mount Everest); plural nations take 'the' (the United States), standard countries take zero article (France) — examinees reverse these distributions.","doubt":false},"m11_17":{"s":"learning","diff":"moderate","imp":"medium","n":"Nominalized collective adjectives ('the poor', 'the elderly', 'the blind') take 'the' + plural verb without '-s' on the adjective; examinees add '-s' ('the poors require') or use singular verb ('the elderly is'), committing two errors.","doubt":false},"m11_18":{"s":"learning","diff":"tough","imp":"high","n":"Institutional nouns (school, prison, hospital, church) take zero article for their primary function ('sent to prison') but 'the' for secondary specific-building visits ('went to the prison to inspect') — a context-sensitive article trap.","doubt":false},"m11_19":{"s":"learning","diff":"easy","imp":"high","n":"Musical instruments take 'the' after 'play' ('play the piano'); sports and games take zero article ('play cricket', 'play chess') — examinees omit 'the' before instruments or add it before sports, reversing the distribution.","doubt":false},"m11_20":{"s":"learning","diff":"moderate","imp":"high","n":"Proportional 'the...the' constructions ('the more...the more') require 'the' before both comparatives; examinees omit 'the' from one or both positions ('Higher the altitude, colder the climate'), breaking the correlative structure.","doubt":false},"m11_21":{"s":"learning","diff":"moderate","imp":"high","n":"'A/an' is determined by the initial sound, not letter: 'a European' (/j/ sound → consonant → 'a'); 'an honest' (silent 'h' → vowel sound → 'an') — examinees follow spelling, writing 'an European' or 'a hour'.","doubt":false},"m11_22":{"s":"learning","diff":"moderate","imp":"high","n":"Abstract and material nouns take zero article in generic sense ('Honesty is a virtue') but 'the' when restricted ('the honesty of the witness') — examinees add 'the' before abstract nouns in generic use, making them specific.","doubt":false},"m11_23":{"s":"learning","diff":"moderate","imp":"medium","n":"Language names take zero article ('fluent in German'); 'the + language name' means the nationality/people ('the Germans'); examinees add 'the' before languages by treating them as specific entities rather than generic labels.","doubt":false},"m11_24":{"s":"learning","diff":"moderate","imp":"high","n":"Unique office nouns after appointment/election verbs take zero article ('elected him chairman'); examinees add 'the' or 'a' ('elected him as the chairman'), imposing an article on a zero-article predicative title complement.","doubt":false},"m11_25":{"s":"learning","diff":"moderate","imp":"medium","n":"After 'kind/type/sort/species of', the following noun takes zero article ('kind of person', 'species of bird'); examinees insert 'a' ('kind of a person', 'species of a bird'), adding a spurious indefinite article after the taxonomic classifier.","doubt":false},"m11_26":{"s":"learning","diff":"tough","imp":"high","n":"Article positioning differs with intensifiers: 'such/what/quite + a/an + adj + noun' vs. 'so/too/as/how + adj + a/an + noun'; examinees use one pattern for all ('a so catastrophic event', 'too heavy a burden' treated as 'a too heavy burden').","doubt":false},"m12_1":{"s":"learning","diff":"easy","imp":"high","n":"Examinees erroneously substitute 'with' for 'By' after 'Abide' due to colloquial habits or false analogy with semantic synonyms.","doubt":false},"m12_2":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees erroneously substitute 'with' for 'To' after 'Accede' due to colloquial habits or false analogy with semantic synonyms.","doubt":false},"m12_3":{"s":"learning","diff":"easy","imp":"high","n":"Examinees fail to supply the obligatory preposition 'To' required by 'Adhere', incorrectly omitting it or substituting non-standard particles.","doubt":false},"m12_4":{"s":"learning","diff":"easy","imp":"high","n":"Examinees erroneously substitute 'to' for 'With' after 'Comply' due to colloquial habits or false analogy with semantic synonyms.","doubt":false},"m12_5":{"s":"learning","diff":"tough","imp":"medium","n":"Examinees confuse the semantic conditions of 'Concur With' [Person] vs. 'Concur In' [Decision]', failing to pair the correct particle depending on whether the object is an agent, entity, or abstract outcome.","doubt":false},"m12_6":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees erroneously substitute 'to' for 'With' after 'Commensurate' due to colloquial habits or false analogy with semantic synonyms.","doubt":false},"m12_7":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees erroneously substitute 'for' for 'To' after 'Conducive' due to colloquial habits or false analogy with semantic synonyms.","doubt":false},"m12_8":{"s":"learning","diff":"moderate","imp":"low","n":"Examinees fail to supply the obligatory preposition 'To' required by 'Akin', incorrectly omitting it or substituting non-standard particles.","doubt":false},"m12_9":{"s":"learning","diff":"tough","imp":"medium","n":"Examinees fail to supply the obligatory preposition 'To' required by 'Averse', incorrectly omitting it or substituting non-standard particles.","doubt":false},"m12_10":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees erroneously substitute 'under' for 'To' after 'Subservient' due to colloquial habits or false analogy with semantic synonyms.","doubt":false},"m12_11":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees confuse the semantic conditions of 'Afflicted With' vs. 'Inflicted On', failing to pair the correct particle depending on whether the object is an agent, entity, or abstract outcome.","doubt":false},"m12_12":{"s":"learning","diff":"moderate","imp":"low","n":"Examinees fail to supply the obligatory preposition 'Of' required by 'Bereft', incorrectly omitting it or substituting non-standard particles.","doubt":false},"m12_13":{"s":"learnin uire the to-infinitive (*was made to sign*), attempting to force *to* onto the passive of *let*.","doubt":false},"m16_93":{"s":"learning","diff":"easy","imp":"low","n":"Students encounter *Having concluded his testimony, the witness stepped down* and attempt to reduce it to a simple present participle (*Concluding his testimony.","doubt":false},"m16_94":{"s":"learning","diff":"tough","imp":"medium","n":"Students treat *except* or *but* (meaning \"other than\") as conjunctions, attempting to follow them with subjective pronouns (*except he and I*).","doubt":false},"m16_95":{"s":"learning","diff":"tough","imp":"high","n":"Students view the phrase *do so* as vague or redundant wordiness, attempting to repeat the entire complex verb phrase.","doubt":false},"m16_96":{"s":"learning","diff":"moderate","imp":"low","n":"Students see the complementizer *that* repeated in a compound sentence (*.","doubt":false},"m16_97":{"s":"learning","diff":"tough","imp":"medium","n":"Students expect standard auxiliary tags (*don't we?.","doubt":false},"m16_98":{"s":"learning","diff":"tough","imp":"medium","n":"Students know *I am* takes singular *am*, so they view the negative tag *aren't I?.","doubt":false},"m16_99":{"s":"learning","diff":"tough","imp":"low","n":"Students apply full verb inversion mechanically (*Down came the rain*) and attempt to invert clauses where the subject is a personal pronoun (*Down came he*).","doubt":false},"m16_100":{"s":"learning","diff":"tough","imp":"high","n":"In long, complex academic sentences, students look at the plural nouns sitting directly beside the predicate verb and match the verb to them via false proximity.","doubt":false}};
    /* ============================================================= */

    let parsedModules = {};
    let viewMode = 'all';
    let activeModalModId = 1;
    let activeModalRuleIndex = 0;
    let progressData = {};
    let searchQuery = '';

    // Active Global Filters
    let activeFilters = {
        status: 'all',
        diff: 'all',
        imp: 'all',
        doubtOnly: false,
        bmOnly: false,
        edOnly: false
    };

    /* ⭐ BOOKMARK (bm) & ✏️ EDITED (ed) FLAGS + ✏️ EDITED BOX (edit text + eimgs)
       Stored on the same per-rule record as status / difficulty / priority / notes,
       so they ride along in every localStorage save, backup and restore. */
    function ruleKey(modId, num) {
        return `m${modId}_${num}`;
    }

    function currentRuleKey() {
        const mod = parsedModules[activeModalModId];
        if (!mod) return null;
        const item = mod.items[activeModalRuleIndex];
        if (!item) return null;
        return ruleKey(mod.id, item.num);
    }

    function defaultRuleRecord() {
        return { s: 'learning', n: '', edit: '', diff: '', imp: '', doubt: false, bm: false, ed: false };
    }

    /* Read-only view: never creates records (safe inside render loops). */
    function readRuleData(key) {
        const rec = progressData[key];
        if (!rec) return defaultRuleRecord();
        if (rec.bm === undefined) rec.bm = false;
        if (rec.ed === undefined) rec.ed = false;
        if (rec.edit === undefined) rec.edit = '';
        return rec;
    }

    /* Writable view: creates the record if this rule has none yet. */
    function getRuleRecord(key) {
        if (!progressData[key]) progressData[key] = defaultRuleRecord();
        return readRuleData(key);
    }

    const birdsEyeGrid = document.getElementById('birdsEyeGrid');
    const modulesGrid = document.getElementById('modulesGrid');
    const workspaceTitle = document.getElementById('workspaceTitle');
    const workspaceMeta = document.getElementById('workspaceMeta');
    const btnViewAll = document.getElementById('btnViewAll');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalModTag = document.getElementById('modalModTag');
    const modalBody = document.getElementById('modalBody');
    const editInput = document.getElementById('qEdit');
    const editImages = document.getElementById('qEditImages');
    const imgLightbox = document.getElementById('imgLightbox');
    const imgLightboxPic = document.getElementById('imgLightboxPic');
    const statusDiv = document.getElementById('status');
    const cacheText = document.getElementById('cacheText');
    const undoBtn = document.getElementById('undoBtn');

    /* 🛡️ STORAGE & CACHE SAFETY HELPERS */
    function safeStorageSet(key, value) {
        try {
            localStorage.setItem(key, value);
            updateCacheBadge(true);
            return true;
        } catch (e) {
            console.error("Storage error:", e);
            if (e.name === 'QuotaExceededError') {
                alert("⚠️ Local Storage limit reached! Please use 'Export Backup' to save your progress externally.");
            }
            updateCacheBadge(false);
            return false;
        }
    }

    function updateCacheBadge(isSaved) {
        if (isSaved) {
            cacheText.innerText = "Safe & Synced";
            document.getElementById('cacheBadge').classList.add('active');
        } else {
            cacheText.innerText = "Sync Warning";
            document.getElementById('cacheBadge').classList.remove('active');
        }
    }

    function loadProgress() {
        const saved = localStorage.getItem(STORAGE_KEY);
        const isFreshInstall = saved === null;
        try {
            progressData = JSON.parse(saved) || {};
        } catch (e) {
            console.error("Corrupt progress JSON detected, initializing fresh", e);
            progressData = {};
        }
        if (isFreshInstall) seedEmbeddedProgress();
        checkSafetySnapshotState();
    }

    /* On the very first run, load the embedded tags. Once anything is stored —
       including the empty object written by "Clear All Progress" — the saved
       state always wins so the embedded defaults never come back to life. */
    function seedEmbeddedProgress() {
        if (typeof EMBEDDED_PROGRESS !== 'object' || !EMBEDDED_PROGRESS) return;
        for (const key in EMBEDDED_PROGRESS) {
            progressData[key] = { ...EMBEDDED_PROGRESS[key] };
        }
    }

    function saveToLocalStorage() {
        safeStorageSet(STORAGE_KEY, JSON.stringify(progressData));
        renderBirdsEyeCards();
        renderDenseModulesGrid();
        updateGlobalCounters();
    }

    function checkSafetySnapshotState() {
        if (localStorage.getItem(SNAPSHOT_KEY)) {
            undoBtn.style.display = 'inline-block';
        } else {
            undoBtn.style.display = 'none';
        }
    }

    /* 💾 EXPORT BACKUP */
    function exportDataBackup() {
        const backupPayload = {
            appName: "ZeroGap_English_Master",
            version: "5.6",
            exportDate: new Date().toISOString(),
            progressData: progressData,
            statsSummary: {
                totalMarked: Object.keys(progressData).length
            }
        };

        const jsonStr = JSON.stringify(backupPayload, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        const timestamp = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `GrammarMaster_Backup_${timestamp}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        statusDiv.innerHTML = `💾 <b>Backup exported successfully!</b> File downloaded to your device.`;
        statusDiv.style.color = "var(--color-mastered)";
    }

    /* 📥 RESTORE BACKUP */
    function importDataBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                const importedData = parsed.progressData || parsed; // Handles both wrapped payload and raw json

                if (!importedData || typeof importedData !== 'object') {
                    throw new Error("Invalid backup format");
                }

                const action = confirm(
                    "📥 Backup file verified!\n\nClick [OK] to MERGE with current progress.\nClick [Cancel] to OVERWRITE current progress completely."
                );

                if (action) {
                    // Merge
                    progressData = { ...progressData, ...importedData };
                } else {
                    // Overwrite
                    progressData = importedData;
                }

                saveToLocalStorage();
                alert("✅ Backup successfully restored!");
                statusDiv.innerHTML = `✅ Backup restored successfully from <b>${escapeHtml(file.name)}</b>!`;
                statusDiv.style.color = "var(--color-mastered)";
            } catch (err) {
                alert("❌ Error: Invalid or corrupt JSON backup file!");
                console.error(err);
            }
        };
        reader.readAsText(file);
        event.target.value = ''; // Reset input
    }

    /* ↩️ RESTORE ACCIDENTAL RESET SNAPSHOT */
    function restoreSafetySnapshot() {
        const snapshot = localStorage.getItem(SNAPSHOT_KEY);
        if (!snapshot) return;

        if (confirm("Restore the previous progress that was wiped before reset?")) {
            progressData = JSON.parse(snapshot);
            localStorage.removeItem(SNAPSHOT_KEY);
            saveToLocalStorage();
            undoBtn.style.display = 'none';
            alert("✅ Previous progress restored from safety snapshot!");
        }
    }

    /* 📂 MARKDOWN PARSING & AUTO-PERSISTENCE */
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const rawContent = event.target.result;
            // Cache the document so user never has to re-upload upon refresh
            safeStorageSet(CACHE_DOC_KEY, rawContent);
            parseCombinedMarkdown(rawContent);
        };
        reader.readAsText(file);
    });

    function parseCombinedMarkdown(text) {
        parsedModules = {};
        MODULE_DEFS.forEach(d => {
            parsedModules[d.id] = { id: d.id, name: d.name, short: d.short, items: [] };
        });

        const moduleBlocks = text.split(/(?=# Module\s+\d+:)/i);
        let globalTotal = 0;

        moduleBlocks.forEach(block => {
            const modMatch = block.match(/# Module\s+(\d+):\s*([^\n\r]+)/i);
            if (!modMatch) return;

            const modId = parseInt(modMatch[1]);
            if (!parsedModules[modId]) {
                parsedModules[modId] = { id: modId, name: modMatch[2].trim(), short: `Module ${modId}`, items: [] };
            }

            const segments = block.split(/(?=###\s+Category|####\s+(?:Rule|Item)\s+\d+:)/i);
            let currentCategory = "Category A: General Fundamentals";

            segments.forEach(seg => {
                const trimmed = seg.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('### Category') || trimmed.startsWith('###Category')) {
                    const firstLine = trimmed.split(/\r?\n/)[0];
                    currentCategory = firstLine.replace(/^###\s*/, '').trim();
                    return;
                }

                const headerMatch = trimmed.match(/^####\s+(Rule|Item)\s+(\d+):\s*([^\n\r]+)/i);
                if (!headerMatch) return;

                const itemType = headerMatch[1];
                const itemNum = parseInt(headerMatch[2]);
                const itemTitle = headerMatch[3].trim();

                const principleMatch = trimmed.match(/\*\s+\*\*Principle:\*\*\s*([\s\S]*?)(?=\*\s+\*\*Formula:\*\*|\*\s+\*\*Diagnostic Contrast:\*\*|####|$)/i);
                const formulaMatch = trimmed.match(/\*\s+\*\*Formula:\*\*\s*([\s\S]*?)(?=\*\s+\*\*Diagnostic Contrast:\*\*|####|$)/i);
                const contrastMatch = trimmed.match(/\*\s+\*\*Diagnostic Contrast:\*\*([\s\S]*?)(?=(?:####|### Category|# Category|---|$))/i);
                const trapMatch = trimmed.match(/\*\s+\*\*The Intuition Trap:\*\*\s*([\s\S]*?)(?=\*\s+\*\*Underlying Grammatical Principle:\*\*|####|$)/i);
                const realityMatch = trimmed.match(/\*\s+\*\*(?:Underlying Grammatical Principle|Grammatical Reality):\*\*\s*([\s\S]*?)(?=\*\s+\*\*Formula:\*\*|####|$)/i);

                parsedModules[modId].items.push({
                    modId: modId,
                    category: currentCategory,
                    type: itemType,
                    num: itemNum,
                    title: itemTitle,
                    principle: principleMatch ? principleMatch[1].trim() : (realityMatch ? realityMatch[1].trim() : ''),
                    trap: trapMatch ? trapMatch[1].trim() : '',
                    formula: formulaMatch ? formulaMatch[1].trim() : '',
                    contrast: contrastMatch ? contrastMatch[1].trim() : ''
                });
                globalTotal++;
            });
        });

        renderBirdsEyeCards();
        renderDenseModulesGrid();
        updateGlobalCounters();

        statusDiv.innerHTML = `✅ <b>Active & Persisted:</b> 16 Modules (${globalTotal} Rules/Items) cached locally.`;
        statusDiv.style.color = "var(--color-mastered)";
    }

    /* AUTO-LOAD ON STARTUP: user cache first, then the embedded document */
    function checkAndRestoreCachedDocument() {
        const cachedDoc = localStorage.getItem(CACHE_DOC_KEY);
        if (cachedDoc && cachedDoc.length > 500) {
            parseCombinedMarkdown(cachedDoc);
            statusDiv.innerHTML = `📂 <b>Session Restored:</b> Loaded automatically from browser cache.`;
            statusDiv.style.color = "var(--color-mastered)";
        } else if (EMBEDDED_DOC && EMBEDDED_DOC.length > 500) {
            parseCombinedMarkdown(EMBEDDED_DOC);
            statusDiv.innerHTML = `✅ <b>Standalone build:</b> All 16 modules loaded from embedded data — no file upload needed.`;
            statusDiv.style.color = "var(--color-mastered)";
        } else {
            statusDiv.innerHTML = `Please load your <code>combined.md</code> file once to populate and cache rules.`;
            statusDiv.style.color = "#64748b";
        }
    }

    function renderBirdsEyeCards() {
        birdsEyeGrid.innerHTML = '';

        MODULE_DEFS.forEach(def => {
            const mod = parsedModules[def.id] || { items: [] };
            const total = mod.items.length;
            let weak = 0, mastered = 0, bm = 0;

            mod.items.forEach(it => {
                const key = `m${def.id}_${it.num}`;
                const st = progressData[key] ? progressData[key].s : 'learning';
                if (st === 'weak') weak++;
                if (st === 'mastered') mastered++;
                if (progressData[key] && progressData[key].bm) bm++;
            });
            const learning = total - weak - mastered;

            const card = document.createElement('div');
            card.className = 'mod-card' + (viewMode === def.id ? ' active' : '');
            card.onclick = () => setViewMode(def.id);

            const weakPct = total ? (weak / total) * 100 : 0;
            const masteredPct = total ? (mastered / total) * 100 : 0;
            const learnPct = total ? (learning / total) * 100 : 0;

            card.innerHTML = `
                <div class="mod-card-top">
                    <span class="mod-card-badge">M${def.id}</span>
                    <span class="mod-card-count">${total} items</span>
                </div>
                <div class="mod-card-name" title="${def.name}">${def.short}</div>
                <div class="mod-card-progress">
                    <div class="progress-seg weak" style="width: ${weakPct}%"></div>
                    <div class="progress-seg mastered" style="width: ${masteredPct}%"></div>
                    <div class="progress-seg learning" style="width: ${learnPct}%"></div>
                </div>
                <div class="mod-card-stats">
                    <span style="color:var(--color-weak);">🔴 ${weak}</span>
                    <span style="color:var(--color-learning);">⚪ ${learning}</span>
                    <span style="color:var(--color-mastered);">✅ ${mastered}</span>
                    <span style="color:#a16207;" title="Bookmarked rules in this module">⭐ ${bm}</span>
                </div>
            `;
            birdsEyeGrid.appendChild(card);
        });
    }

    function setViewMode(mode) {
        viewMode = mode;
        btnViewAll.classList.toggle('active', mode === 'all');
        renderBirdsEyeCards();
        renderDenseModulesGrid();
    }

    // --- Filter Management ---
    function toggleFilter(type, val) {
        if (activeFilters[type] === val) {
            activeFilters[type] = 'all';
        } else {
            activeFilters[type] = val;
        }
        updateFilterUI();
        renderDenseModulesGrid();
    }

    function setFilter(type, val) {
        activeFilters[type] = val;
        updateFilterUI();
        renderDenseModulesGrid();
    }

    function toggleDoubtFilter() {
        activeFilters.doubtOnly = !activeFilters.doubtOnly;
        updateFilterUI();
        renderDenseModulesGrid();
    }

    /* ⭐ / ✏️ flag filters (bm = bookmark, ed = edited) */
    function toggleFlagFilter(flag) {
        if (flag === 'bm') activeFilters.bmOnly = !activeFilters.bmOnly;
        else activeFilters.edOnly = !activeFilters.edOnly;
        updateFilterUI();
        renderDenseModulesGrid();
    }

    function clearAllFilters() {
        activeFilters = { status: 'all', diff: 'all', imp: 'all', doubtOnly: false, bmOnly: false, edOnly: false };
        updateFilterUI();
        renderDenseModulesGrid();
    }

    function updateFilterUI() {
        // Status pills
        ['weak', 'learning', 'mastered'].forEach(s => {
            const el = document.getElementById('flt-status-' + s);
            if (el) el.classList.toggle('active', activeFilters.status === s);
        });

        // Difficulty pills
        ['easy', 'moderate', 'tough'].forEach(d => {
            const el = document.getElementById('flt-diff-' + d);
            if (el) el.classList.toggle('active', activeFilters.diff === d);
        });

        // Priority pills
        ['high', 'medium', 'low'].forEach(i => {
            const el = document.getElementById('flt-imp-' + i);
            if (el) el.classList.toggle('active', activeFilters.imp === i);
        });

        // Doubt pill
        const doubtEl = document.getElementById('flt-doubt');
        if (doubtEl) doubtEl.classList.toggle('active', !!activeFilters.doubtOnly);

        // ⭐ Bookmark / ✏️ Edited pills
        const bmEl = document.getElementById('flt-bookmark');
        if (bmEl) bmEl.classList.toggle('active', !!activeFilters.bmOnly);

        const edEl = document.getElementById('flt-edited');
        if (edEl) edEl.classList.toggle('active', !!activeFilters.edOnly);

        // Reset button visibility
        const isAnyFilterActive = (
            activeFilters.status !== 'all' ||
            activeFilters.diff !== 'all' ||
            activeFilters.imp !== 'all' ||
            activeFilters.doubtOnly ||
            activeFilters.bmOnly ||
            activeFilters.edOnly
        );
        const resetBtn = document.getElementById('flt-clear-btn');
        if (resetBtn) {
            resetBtn.style.display = isAnyFilterActive ? 'inline-flex' : 'none';
        }
    }

    function matchesFilters(it) {
        const data = readRuleData(ruleKey(it.modId, it.num));

        if (activeFilters.status !== 'all' && (data.s || 'learning') !== activeFilters.status) return false;
        if (activeFilters.diff !== 'all' && data.diff !== activeFilters.diff) return false;
        if (activeFilters.imp !== 'all' && data.imp !== activeFilters.imp) return false;
        if (activeFilters.doubtOnly && !data.doubt) return false;
        if (activeFilters.bmOnly && !data.bm) return false;
        if (activeFilters.edOnly && !data.ed) return false;

        return true;
    }

    function renderDenseModulesGrid() {
        modulesGrid.innerHTML = '';
        const isSearch = searchQuery.trim().length > 0;
        let totalMatched = 0;

        if (viewMode === 'all' && !isSearch) {
            workspaceTitle.innerText = "Bird's-Eye View: All Modules";

            MODULE_DEFS.forEach(def => {
                const mod = parsedModules[def.id];
                if (!mod || mod.items.length === 0) return;

                const filteredItems = mod.items.filter(it => matchesFilters(it));
                totalMatched += filteredItems.length;

                if (filteredItems.length > 0) {
                    modulesGrid.appendChild(createModuleColumnElement({ ...mod, items: filteredItems }));
                }
            });

            workspaceMeta.innerText = `Displaying ${totalMatched} rules matching current filters across modules`;
        } else if (isSearch) {
            workspaceTitle.innerText = `Search Results for "${searchQuery}"`;

            MODULE_DEFS.forEach(def => {
                const mod = parsedModules[def.id];
                if (!mod) return;
                const filtered = mod.items.filter(it => {
                    const textMatch = (
                        it.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        it.principle.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        it.formula.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        it.category.toLowerCase().includes(searchQuery.toLowerCase())
                    );
                    return textMatch && matchesFilters(it);
                });

                if (filtered.length > 0) {
                    modulesGrid.appendChild(createModuleColumnElement({ ...mod, items: filtered }));
                    totalMatched += filtered.length;
                }
            });
            workspaceMeta.innerText = `Found ${totalMatched} rules matching both search & filters`;
        } else {
            const def = MODULE_DEFS.find(d => d.id === viewMode);
            const mod = parsedModules[viewMode] || { items: [] };
            const filteredItems = mod.items.filter(it => matchesFilters(it));

            workspaceTitle.innerText = `Module ${def.id}: ${def.name}`;
            workspaceMeta.innerText = `Displaying ${filteredItems.length} of ${mod.items.length} items (Filtered)`;

            renderSingleModuleDenseColumns({ ...mod, items: filteredItems });
        }

        // Keep the modal's Navigation Deck hints in sync when filters/search change
        if (modalOverlay.classList.contains('show')) updateNavHints();
    }

    /* ✏️ EDITED BOX — your corrected version of the rule, text plus pasted screenshots.
       Images are downscaled + re-encoded to JPEG so several still fit in localStorage. */
    const EDIT_IMG_MAX_DIM = 1280;   // longest side kept when compressing pasted images
    const EDIT_IMG_QUALITY = 0.8;    // JPEG quality used after compression

    function getEditImages(key) {
        const rec = key ? progressData[key] : null;
        return (rec && Array.isArray(rec.eimgs)) ? rec.eimgs : [];
    }

    function ensureRuleRecord(key) {
        const rec = getRuleRecord(key);
        if (!Array.isArray(rec.eimgs)) rec.eimgs = [];
        return rec;
    }

    function saveEditedText() {
        getRuleRecord(currentRuleKey()).edit = editInput.value;
        saveToLocalStorage();
    }

    /* Downscale + re-encode so a few screenshots still fit inside localStorage. */
    function compressImageFile(file, callback) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            const img = new Image();
            img.onload = () => {
                try {
                    const scale = Math.min(1, EDIT_IMG_MAX_DIM / Math.max(img.width, img.height));
                    const w = Math.max(1, Math.round(img.width * scale));
                    const h = Math.max(1, Math.round(img.height * scale));
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';          // flatten transparency for JPEG
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    const out = canvas.toDataURL('image/jpeg', EDIT_IMG_QUALITY);
                    callback(out && out.length > 32 ? out : dataUrl);
                } catch (e) {
                    callback(dataUrl);
                }
            };
            img.onerror = () => callback(dataUrl);
            img.src = dataUrl;
        };
        reader.readAsDataURL(file);
    }

    /* Ctrl+V inside the edited box: keep any plain text, attach every pasted image. */
    function handleEditPaste(e) {
        const items = (e.clipboardData && e.clipboardData.items) ? e.clipboardData.items : [];
        const files = [];
        for (let i = 0; i < items.length; i++) {
            if (items[i].kind === 'file' && items[i].type && items[i].type.indexOf('image') === 0) {
                const f = items[i].getAsFile();
                if (f) files.push(f);
            }
        }
        if (files.length === 0) return;   // plain text paste keeps default behaviour

        e.preventDefault();

        const pastedText = e.clipboardData.getData('text/plain');
        if (pastedText) {
            const start = editInput.selectionStart || 0;
            const end = editInput.selectionEnd || 0;
            editInput.value = editInput.value.slice(0, start) + pastedText + editInput.value.slice(end);
            editInput.selectionStart = editInput.selectionEnd = start + pastedText.length;
        }

        const rec = ensureRuleRecord(currentRuleKey());
        let pending = files.length;
        files.forEach(f => {
            compressImageFile(f, (dataUrl) => {
                rec.eimgs.push(dataUrl);
                pending--;
                if (pending <= 0) {
                    renderEditImages();
                    saveEditedText();
                }
            });
        });
    }

    function renderEditImages() {
        if (!editImages) return;
        const imgs = getEditImages(currentRuleKey());
        editImages.innerHTML = '';
        editImages.classList.toggle('has-images', imgs.length > 0);

        imgs.forEach((src, idx) => {
            const thumb = document.createElement('div');
            thumb.className = 'note-thumb';

            const img = document.createElement('img');

            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'thumb-del';
            del.innerHTML = '&times;';
            del.title = 'Remove image';
            del.onclick = (ev) => {

                removeEditImage(idx);

            thumb.onclick = () => openImageLightbox(src);
            thumb.appendChild(img);
            thumb.appendChild(del);
            editImages.appendChild(thumb);
        });
    }

    function removeEditImage(idx) {
        const imgs = getEditImages(currentRuleKey());
        if (idx < 0 || idx >= imgs.length) return;
        imgs.splice(idx, 1);
        renderEditImages();

    function formatInlineMarkdown(str) {
        if (!str) return '';
        return str
            .replace(/\$\s*(?:\\to|\\rightarrow)\s*\$|\\to\b|\\rightarrow\b/gi, '→')
            .replace(/\$\s*(?:\\gets|\\leftarrow)\s*\$|\\gets\b|\\leftarrow\b/gi, '←')
            .replace(/\$\s*(?:\\leftrightarrow)\s*\$|\\leftrightarrow\b/gi, '↔')
            .replace(/\$([^\$]+)\$/g, '$1')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<span class="doc-formula-code">$1</span>');
    }

    function formatFormulaInline(raw) {
        if (!raw) return '';
        raw = raw.replace(/\$\s*(?:\\to|\\rightarrow)\s*\$|\\to\b|\\rightarrow\b/gi, '→');
        const codeMatches = raw.match(/`([^`]+)`/g);
        if (codeMatches && codeMatches.length > 0) {
            return codeMatches.map(c => `<span class="doc-formula-code">${formatInlineMarkdown(c.replace(/`/g, ''))}</span>`).join(' ');
        }
        const cleaned = raw.replace(/^\s*[\*\-]\s*/, '').replace(/\*+$/, '').trim();
        return `<span class="doc-formula-code">${formatInlineMarkdown(cleaned)}</span>`;
    }

    function formatContrastList(raw) {
        if (!raw) return '';
        const lines = raw.split('\n');
        let html = '';

        lines.forEach(line => {
            let trimmed = line.trim();
            if (!trimmed) return;

            trimmed = trimmed.replace(/^[\s\*\-]+/, '').replace(/\*+$/, '').trim();

            if (trimmed.startsWith('❌')) {
                let text = trimmed.substring(2).trim();
                text = text.replace(/^\*+/, '').replace(/\*+([.,;:]?)$/, '$1').replace(/\*+$/, '').trim();
                html += `
                <div class="contrast-line">
                    <span class="sub-bullet">•</span>
                    <span class="contrast-icon">❌</span>
                    <span class="contrast-text">${formatInlineMarkdown(text)}</span>
                </div>`;
            } else if (trimmed.startsWith('✔️')) {
                let text = trimmed.substring(2).trim();
                text = text.replace(/^\*+/, '').replace(/\*+([.,;:]?)$/, '$1').replace(/\*+$/, '').trim();
                html += `
                <div class="contrast-line">
                    <span class="sub-bullet">•</span>
                    <span class="contrast-icon">✔️</span>
                    <span class="contrast-text">${formatInlineMarkdown(text)}</span>
                </div>`;
            } else if (trimmed.length > 0) {
                trimmed = trimmed.replace(/^\*+/, '').replace(/\*+([.,;:]?)$/, '$1').replace(/\*+$/, '').trim();
                html += `
                <div class="contrast-line" style="margin-left: 20px; font-size: 13.5px; color: #64748b;">
                    <span>${formatInlineMarkdown(trimmed)}</span>
                </div>`;
            }
        });

        return html;
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /* 🧭 FILTER-AWARE NAVIGATION DECK
       The modal's Previous/Next arrows walk through exactly the rules that are
       visible on screen right now. That deck is built from:
         • the active view mode  (🦅 View All Modules  vs  a single module card)
         • the live search query (if any)
         • every ACTIVE toolbar filter button — i.e. whichever of
           Weak / Learning / Mastered  •  Easy / Mod / Tough  •  High / Med / Low  •  Doubt
           is currently highlighted (.active) decides the sequence.
       With no filter active and a single module open, the deck is that module's
       full item list (the original behaviour). */
    function getActiveSequence() {
        const seq = [];
        const isSearch = searchQuery.trim().length > 0;
        const q = searchQuery.trim().toLowerCase();

        const collect = (modId, items) => {
            items.forEach(it => seq.push({ modId: Number(modId), num: it.num }));
        };

        if (isSearch) {
            MODULE_DEFS.forEach(def => {
                const mod = parsedModules[def.id];
                if (!mod) return;
                const filtered = mod.items.filter(it => {
                    const textMatch = (
                        it.title.toLowerCase().includes(q) ||
                        it.principle.toLowerCase().includes(q) ||
                        it.formula.toLowerCase().includes(q) ||
                        it.category.toLowerCase().includes(q)
                    );
                    return textMatch && matchesFilters(it);
                });
                if (filtered.length) collect(def.id, filtered);
            });
        } else if (viewMode === 'all') {
            MODULE_DEFS.forEach(def => {
                const mod = parsedModules[def.id];
                if (!mod || mod.items.length === 0) return;
                collect(def.id, mod.items.filter(it => matchesFilters(it)));
            });
        } else {
            const mod = parsedModules[viewMode];
            if (mod) collect(viewMode, mod.items.filter(it => matchesFilters(it)));
        }

        return seq;
    }

    function describeActiveFilter() {
        if (searchQuery.trim()) return `search "${searchQuery.trim()}"`;
        const parts = [];
        if (activeFilters.status !== 'all') parts.push(activeFilters.status);
        if (activeFilters.diff !== 'all') parts.push(activeFilters.diff);
        if (activeFilters.imp !== 'all') parts.push(activeFilters.imp + ' priority');
        if (activeFilters.doubtOnly) parts.push('doubt');
        return parts.length ? parts.join(' + ') : 'all rules';
    }

    function updateNavHints() {
        const seq = getActiveSequence();
        const currentItem = (parsedModules[activeModalModId] || { items: [] }).items[activeModalRuleIndex];
        const currentNum = currentItem ? currentItem.num : null;
        const pos = seq.findIndex(s => s.modId === activeModalModId && s.num === currentNum);

        const scope = describeActiveFilter();
        const position = pos === -1
            ? 'outside current filter'
            : `${pos + 1} of ${seq.length}`;
        const suffix = `Deck: ${scope} • ${position}`;

        const prevBtn = document.getElementById('navPrevBtn');
        const nextBtn = document.getElementById('navNextBtn');
        if (prevBtn) prevBtn.title = `Previous Rule (Left Arrow) — ${suffix}`;
        if (nextBtn) nextBtn.title = `Next Rule (Right Arrow) — ${suffix}`;
    }

    function navigateRule(offset) {
        const seq = getActiveSequence();
        if (!seq.length) return;

        const currentItem = (parsedModules[activeModalModId] || { items: [] }).items[activeModalRuleIndex];
        const currentNum = currentItem ? currentItem.num : null;

        let curIdx = seq.findIndex(s => s.modId === activeModalModId && s.num === currentNum);
        if (curIdx === -1) {
            // The open rule is not part of the filtered deck (e.g. a filter was
            // switched on while the modal stayed open): Next jumps to the first
            // visible rule, Previous to the last visible rule.
            curIdx = offset > 0 ? -1 : 0;
        }

        const nextIdx = ((curIdx + offset) % seq.length + seq.length) % seq.length;
        openModal(seq[nextIdx].modId, seq[nextIdx].num);
    }

    function updateGlobalCounters() {
        let total = 0, weak = 0, mastered = 0, doubt = 0;
        let easy = 0, modCnt = 0, tough = 0;
        let high = 0, med = 0, low = 0, bookmarked = 0, edited = 0;

        for (let modId in parsedModules) {
            parsedModules[modId].items.forEach(it => {
                total++;
                const data = readRuleData(ruleKey(modId, it.num));

                if (data.s === 'weak') weak++;
                if (data.s === 'mastered') mastered++;
                if (data.doubt) doubt++;
                if (data.bm) bookmarked++;
                if (data.ed) edited++;

                if (data.diff === 'easy') easy++;
                if (data.diff === 'moderate') modCnt++;
                if (data.diff === 'tough') tough++;

                if (data.imp === 'high') high++;
                if (data.imp === 'medium') med++;
                if (data.imp === 'low') low++;
            });
        }

        const learning = total - weak - mastered;
        const cntAll = document.getElementById('cnt-all');
        if (cntAll) cntAll.innerText = total;
        const cntWeak = document.getElementById('cnt-weak');
        if (cntWeak) cntWeak.innerText = weak;
        const cntLearning = document.getElementById('cnt-learning');
        if (cntLearning) cntLearning.innerText = learning;
        const cntMastered = document.getElementById('cnt-mastered');
        if (cntMastered) cntMastered.innerText = mastered;
        const cntDoubt = document.getElementById('cnt-doubt');
        if (cntDoubt) cntDoubt.innerText = doubt;

        // Toolbar Chip live counters & tooltips
        const countMap = {
            'cnt-flt-weak': weak,
            'cnt-flt-learning': learning,
            'cnt-flt-mastered': mastered,
            'cnt-flt-easy': easy,
            'cnt-flt-mod': modCnt,
            'cnt-flt-tough': tough,
            'cnt-flt-high': high,
            'cnt-flt-med': med,
            'cnt-flt-low': low,
            'cnt-flt-doubt': doubt,
            'cnt-flt-bm': bookmarked,
            'cnt-flt-ed': edited
        };

        for (let id in countMap) {
            const el = document.getElementById(id);
            if (el) el.innerText = `(${countMap[id]})`;
        }

        // Informative tooltips on filter buttons
        const tooltips = {
            'flt-diff-easy': `Filter: Easy (${easy} rules)`,
            'flt-diff-moderate': `Filter: Moderate (${modCnt} rules)`,
            'flt-diff-tough': `Filter: Tough (${tough} rules)`,
            'flt-imp-high': `Filter: High Priority (${high} rules)`,
            'flt-imp-medium': `Filter: Medium Priority (${med} rules)`,
            'flt-imp-low': `Filter: Low Priority (${low} rules)`,
            'flt-doubt': `Filter: Doubt Flagged (${doubt} rules)`,
            'flt-bookmark': `Filter: Bookmarked (${bookmarked} rules)`,
            'flt-edited': `Filter: Edited (${edited} rules)`,
            'flt-status-weak': `Filter: Weak (${weak} rules)`,
            'flt-status-learning': `Filter: Learning (${learning} rules)`,
            'flt-status-mastered': `Filter: Mastered (${mastered} rules)`
        };

        for (let btnId in tooltips) {
            const btn = document.getElementById(btnId);
            if (btn) btn.title = tooltips[btnId];
        }
    }

    function resetProgress() {
        if (confirm("⚠️ Are you sure you want to clear all progress?\n\n(A safety snapshot will be kept so you can undo if clicked accidentally).")) {
            // Save emergency undo snapshot before wiping
            safeStorageSet(SNAPSHOT_KEY, JSON.stringify(progressData));
            progressData = {};
            localStorage.removeItem(STORAGE_KEY);
            saveToLocalStorage();
            checkSafetySnapshotState();
            alert("Progress cleared. If this was a mistake, click '↩️ Undo Last Clear' at the top bar.");
        }
    }

    function closeModal() {
        closeImageLightbox();
        modalOverlay.classList.remove('show');
    }

    document.getElementById('closeBtn').onclick = closeModal;
    modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };
    document.addEventListener('keydown', (e) => {
        const lightboxOpen = imgLightbox && imgLightbox.classList.contains('show');
        if (e.key === "Escape") {
            if (lightboxOpen) { closeImageLightbox(); return; }
            closeModal();
            return;
        }
        if (lightboxOpen) return;   // don't change the rule behind the enlarged image
        if (modalOverlay.classList.contains('show')) {
            if (e.key === "ArrowLeft") navigateRule(-1);
            if (e.key === "ArrowRight") navigateRule(1);
            // Flag shortcuts (ignored while typing in the edited box)
            const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
            if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                const k = (e.key || '').toLowerCase();
                if (k === 'b') toggleRuleFlag('bm');
                if (k === 'e') toggleRuleFlag('ed');
            }
        }
    });

    // Start-up sequence
    loadProgress();
    checkAndRestoreCachedDocument();
    updateGlobalCounters();
</script>

</body>
</html>
