the grammatical subject of the governing main clause; if the subject cannot perform the participial action, the participle is unattached (\"dangling\").\r\n* **Formula:** `[Participial Phrase], Head Subject (Logical Agent) + Predicate`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Walking down the cobblestone boulevard, the ancient spires came into view.*  \r\n    *(Grammatically implies the spires were walking down the street)*\r\n  * ✔️ *Walking down the cobblestone boulevard, **the traveler saw** the ancient spires come into view.*\r\n\r\n---\r\n\r\n#### Rule 26: Misplaced Participial Modifiers\r\n* **Principle:** A participial phrase must be placed as close as possible to the nominal head it modifies; separating them creates syntactic confusion and modifies the wrong noun.\r\n* **Formula:** `Subject + [Participial Modifier directly adjacent] + Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The officer inspected the damaged aircraft wearing protective goggles.*  \r\n    *(Grammatically implies the aircraft was wearing protective goggles)*\r\n  * ✔️ *Wearing protective goggles, **the officer inspected** the damaged aircraft.*\r\n\r\n---\r\n\r\n#### Rule 27: The Absolute Nominative Construction\r\n* **Principle:** An absolute participle construction possesses its own grammatically independent noun subject, completely separate from the subject of the main clause, requiring no conjunction to link the ideas.\r\n* **Formula:** `Independent Subject + Participle (V-ing / V3), Main Subject + Predicate`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The weather being inclement, the flight was cancelled by us.*  \r\n    *(Incorrectly analyzed as dangling if weather is mistaken for the agent of flight)*\r\n  * ✔️ * **The weather being inclement**, the airport authorities cancelled the flight.*  \r\n    *(Valid Absolute: 'The weather' is the independent subject of 'being')*\r\n\r\n---\r\n\r\n#### Rule 28: Idiomatically Unattached Participles (Disjunct Sentence Adverbs)\r\n* **Principle:** Certain established participial forms (*generally speaking, considering, judging by, strictly speaking, taking everything into account, provided*) function idiomatically as sentence adverbs (disjuncts) and do not dangle, even without a shared subject in the main clause.\r\n* **Formula:** `[Established Idiomatic Participial Disjunct], Main Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Judging by the latest figures, an error was made by him.*  \r\n    *(Often wrongly corrected by purists as dangling)*\r\n  * ✔️ * **Judging by** the latest figures, the fiscal year has been an unprecedented success.* [Grammatically valid exception]\r\n\r\n---\r\n\r\n### Category G: Ellipsis & Structural Defects in Non-Finites\r\n\r\n#### Rule 29: The Stranded Infinitive Particle (Infinitive Ellipsis)\r\n* **Principle:** To avoid redundancy, the verbal complement of a to-infinitive may be elided, leaving the particle *to* stranded; however, the infinitive particle *to* itself must not be omitted if the sentence implies an infinitival complement.\r\n* **Formula:** `Subject + Verb + [Context], but Subject + Verb + to [elided verb phrase]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *She urged him to file a formal complaint, but he refused.* [Ambiguous/Abrupt]\r\n  * ✔️ *She urged him to file a formal complaint, but he refused **to**.*\r\n  * ❌ *He had intended to cross-examine the witness, but was unable.*\r\n  * ✔️ *He had intended to cross-examine the witness, but was unable **to**.*\r\n\r\n---\r\n\r\n#### Rule 30: Faulty Non-Finite Parallelism\r\n* **Principle:** In coordinated series, comparisons, or correlative constructions, non-finite forms must remain structurally symmetrical; an author must not coordinate an infinitive directly with a gerund.\r\n* **Formula:**\r\n  * `to-Infinitive + and + [to-]Infinitive`\r\n  * `Gerund (V-ing) + and + Gerund (V-ing)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *His responsibilities include compiling market intelligence and to draft legal briefs.*\r\n  * ✔️ *His responsibilities include **compiling** market intelligence and **drafting** legal briefs.*\r\n  * ✔️ *He prefers **to read** classical literature rather than **to write** popular fiction.*\r\n\r\n# Module 4: Modifiers, Degree & Inversion (Adjectives & Adverbs)\r\n**Total Micro-Rules:** 28  \r\n**Question Output Target:** 84 Questions (3 Questions per Rule: Direct Diagnostic, Embedded Distractor, Inversion/Boundary Trap)\r\n\r\n---\r\n\r\n### Category A: Adjective vs. Adverb Distinctions & Predicative Constraints\r\n\r\n#### Rule 1: Linking (Copular) Verbs vs. Action Verbs\r\n* **Principle:** Verbs of state, sensory perception, and transition (*seem, appear, look, sound, smell, taste, feel, remain, become, stay, turn*) link the subject to a subject complement and must be qualified by predicate adjectives, not adverbs of manner.\r\n* **Formula:** `Subject + Copular Verb + Predicate Adjective`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The executive appeared calmly despite the hostile inquiries.*\r\n  * ✔️ *The executive appeared **calm** despite the hostile inquiries.*\r\n  * ❌ *The food in the cafeteria smelled deliciously.*\r\n  * ✔️ *The food in the cafeteria smelled **delicious**.*\r\n\r\n---\r\n\r\n#### Rule 2: Dual Action/Copular Verbs (Functional Semantic Shifts)\r\n* **Principle:** When sensory verbs (*feel, look, smell, taste*) denote a deliberate, dynamic physical action rather than a passive sensation or state, they function as action verbs and must take an adverb of manner.\r\n* **Formula:**\r\n  * *Perceptual Quality (State):* `Subject + Verb + Adjective`\r\n  * *Dynamic Execution (Action):* `Subject + Verb + Object + Adverb of Manner`\r\n* **Diagnostic Contrast:**\r\n  * ✔️ *The physician **felt gentle**.* [Passive property: the physician was soft to the touch]\r\n  * ✔️ *The physician **felt the wound gently**.* [Active physical touch]\r\n  * ✔️ *The soup **tastes salty**.* vs. *The chef **tasted the soup cautiously**.*\r\n\r\n---\r\n\r\n#### Rule 3: Predicative-Only Adjectives ('A-Adjectives')\r\n* **Principle:** Adjectives beginning with the prefix *a-* (*afraid, asleep, alive, alone, ashamed, aware, alight, akin, afloat*) can function only predicatively (following a linking verb); they strictly cannot appear attributively before a noun.\r\n* **Formula:**\r\n  * *Predicative:* `Subject + Linking Verb + [afraid / asleep / alive / aware]`\r\n  * *Attributive Equivalent:* `[frightened / sleeping / living / conscious] + Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The alive passengers were evacuated from the fuselage.*\r\n  * ✔️ *The **living** passengers were evacuated from the fuselage.*\r\n  * ✔️ *The passengers who were **alive** were evacuated from the fuselage.*\r\n\r\n---\r\n\r\n#### Rule 4: Attributive-Only Adjectives\r\n* **Principle:** Certain classifying or emphasizing adjectives (*drunken, elder, former, latter, sheer, utter, mere, lone*) can only be used attributively directly preceding a noun, never predicatively following a linking verb.\r\n* **Formula:** `Determiner + [sheer / utter / drunken / elder] + Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The destruction caused by the landslide was sheer.*\r\n  * ✔️ *The destruction caused by the landslide was **sheer ruin**.*\r\n  * ❌ *The sailor was drunken.*\r\n  * ✔️ *The **drunken sailor** was escorted back to the ship.*\r\n\r\n---\r\n\r\n#### Rule 5: Compound Adjective Hyphenation & Invariant Measure Nouns\r\n* **Principle:** When an expression of measurement, duration, or value modifies an ensuing noun as a compound attributive adjective, the measure noun is singular and must be hyphenated; when used predicatively, it drops hyphens and takes standard pluralization.\r\n* **Formula:**\r\n  * *Attributive Compound:* `Determiner + [Number - Singular Measure Noun] + Head Noun`\r\n  * *Predicative Measure:* `Subject + Linking Verb + Number + Plural Measure Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The company signed a ten-years lease on the corporate headquarters.*\r\n  * ✔️ *The company signed a **ten-year lease** on the corporate headquarters.*\r\n  * ✔️ *The lease on the corporate headquarters is for **ten years**.*\r\n\r\n---\r\n\r\n### Category B: Adverbial Morphology & Polysemy\r\n\r\n#### Rule 6: Dual-Form Adverbs with Semantic Divergence\r\n* **Principle:** Several adverbs exist in two distinct forms—one identical to the adjective and one terminating in *-ly*—with completely different lexical meanings (*hard/hardly, late/lately, near/nearly, high/highly, deep/deeply, free/freely*).\r\n* **Formula:**\r\n  * `hard (with effort) / hardly (barely / scarcely)`\r\n  * `late (after due time) / lately (recently)`\r\n  * `high (elevation) / highly (greatly / favourably)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The candidate worked hardly to secure the endorsement.*\r\n  * ✔️ *The candidate worked **hard** to secure the endorsement.*\r\n  * ❌ *The envoy has not delivered any communiqués late.*\r\n  * ✔️ *The envoy has not delivered any communiqués **lately**.*\r\n\r\n---\r\n\r\n#### Rule 7: Flat Adverbs (Morphologically Invariant)\r\n* **Principle:** \"Flat adverbs\" share the exact morphological form of their corresponding adjectives without adding *-ly* (*fast, hard, straight, early, daily, wrong, right*); adding a spurious *-ly* creates an ungrammatical form (*fastly* does not exist).\r\n* **Formula:** `Subject + Verb + [fast / straight / early] (No suffix)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The emergency vehicle drove fastly through the intersection.*\r\n  * ✔️ *The emergency vehicle drove **fast** through the intersection.*\r\n  * ❌ *Walk straightly down the corridor to reach the chamber.*\r\n  * ✔️ *Walk **straight** down the corridor to reach the chamber.*\r\n\r\n---\r\n\r\n#### Rule 8: Adjectives Ending in '-ly' Requiring Phrasal Conversion\r\n* **Principle:** Words ending in *-ly* that are fundamentally adjectives (*friendly, lovely, lonely, silly, cowardly, brotherly, orderly, motherly*) cannot directly function as adverbs; they must be embedded in a prepositional phrase of manner.\r\n* **Formula:** `Subject + Verb + in a / an + [friendly / cowardly / orderly] + manner / fashion / way`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomat received the hostile delegation friendlily.*\r\n  * ✔️ *The diplomat received the hostile delegation **in a friendly manner**.*\r\n  * ❌ *The deserter behaved cowardly during the ambush.*\r\n  * ✔️ *The deserter behaved **in a cowardly fashion**.*\r\n\r\n---\r\n\r\n#### Rule 9: 'Very' vs. 'Much' Distribution with Participles & Degrees\r\n* **Principle:** *Very* modifies adjectives in the positive degree and present participles (*-ing*); *Much* modifies adjectives in the comparative degree and past participles (*-ed/-en*).\r\n* **Formula:**\r\n  * `very + Positive Adjective / Present Participle (V-ing)`\r\n  * `much + Comparative Adjective / Past Participle (V3)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The ambassador was very alarmed by the geopolitical developments.*\r\n  * ✔️ *The ambassador was **much alarmed** by the geopolitical developments.*  \r\n    *(Exception: lexicalized past participles take 'very': very pleased, very tired)*\r\n  * ❌ *This methodology is very superior to the previous trial.*\r\n  * ✔️ *This methodology is **much superior** to the previous trial.*\r\n\r\n---\r\n\r\n### Category C: Modifier Placement & Structural Ambiguity\r\n\r\n#### Rule 10: Limiting Modifiers Placement ('Only', 'Just', 'Merely')\r\n* **Principle:** Limiting adverbs (*only, just, merely, almost, nearly, barely*) must be positioned immediately adjacent to the specific syntactic constituent they modify; displacing them alters or distorts the semantic meaning of the proposition.\r\n* **Formula:** `Subject + [only] + Focus Constituent + Predicate`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The board only approved the budget for the transport division.*  \r\n    *(Syntactically implies they did nothing else except approve it)*\r\n  * ✔️ *The board approved the budget **only for the transport division**.*  \r\n    *(Accurately limits the division affected)*\r\n\r\n---\r\n\r\n#### Rule 11: The Squinting (Two-Way) Modifier\r\n* **Principle:** A modifier placed ambiguously between two sentence elements such that it could qualify either the preceding or the following constituent is a squinting modifier and must be repositioned to ensure unambiguous attribution.\r\n* **Formula:**\r\n  * *Ambiguous:* `Clause 1 + [Adverb] + Clause 2`\r\n  * *Unambiguous:* `[Adverb] + Clause 1 + Clause 2  OR  Clause 1 + Clause 2 + [Adverb]`\r\n* **Diagnostic Contrast:**\r\n  * ⚠️ *Students who practice diligently succeed in their examinations.*  \r\n    *(Does \"diligently\" modify practice or succeed?)*\r\n  * ✔️ *Students who **diligently practice** succeed in their examinations.*\r\n  * ✔️ *Students who practice **succeed inevitably** in their examinations.*\r\n\r\n---\r\n\r\n#### Rule 12: Misplaced Adverbial Prepositional Modifiers\r\n* **Principle:** Adverbial phrases indicating time, place, or manner must be situated adjacent to the predicate they qualify; positioning them next to a nominal element mistakenly attaches them as adjectival modifiers.\r\n* **Formula:** `[Adverbial Phrase of Time/Place], Subject + Verb + Direct Object`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The detective found the stolen paintings walking through the park.*  \r\n    *(Absurdly implies the paintings were walking through the park)*\r\n  * ✔️ * **Walking through the park**, the detective found the stolen paintings.*\r\n\r\n---\r\n\r\n#### Rule 13: Hierarchical Order of Adjectives (OSASCOMP)\r\n* **Principle:** Multiple cumulative adjectives preceding a noun must observe a strict cognitive hierarchy: **O**pinion $\\to$ **S**ize $\\to$ **A**ge $\\to$ **S**hape $\\to$ **C**olor $\\to$ **O**rigin $\\to$ **M**aterial $\\to$ **P**urpose.\r\n* **Formula:** `Determiner + Opinion + Size + Age + Shape + Color + Origin + Material + Purpose + Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *She purchased a woolen beautiful antique French rug.*\r\n  * ✔️ *She purchased a **beautiful** (Opinion) **antique** (Age) **French** (Origin) **woolen** (Material) rug.*\r\n\r\n---\r\n\r\n### Category D: Adverb Placement in Predicates\r\n\r\n#### Rule 14: Mid-Position Frequency Adverbs\r\n* **Principle:** Adverbs of indefinite frequency (*always, never, seldom, usually, frequently, often, rarely*) take mid-position: preceding simple main verbs, following copular/auxiliary verbs *be*, and between the auxiliary and main verb in compound verbal groups.\r\n* **Formula:**\r\n  * `Subject + [Frequency Adverb] + Main Verb`\r\n  * `Subject + Auxiliary Verb + [Frequency Adverb] + Main Verb`\r\n  * `Subject + be + [Frequency Adverb]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The director has presented never such a pessimistic forecast.*\r\n  * ✔️ *The director has **never presented** such a pessimistic forecast.*\r\n  * ❌ *He attends regularly the committee sessions.*\r\n  * ✔️ *He **regularly attends** the committee sessions.*\r\n\r\n---\r\n\r\n#### Rule 15: Positioning of Degree Adverb 'Enough'\r\n* **Principle:** Unlike standard degree adverbs (*too, so, quite, very*) which precede the words they modify, *enough* must be placed **after** adjectives and adverbs, but **before** nouns.\r\n* **Formula:**\r\n  * `Adjective / Adverb + enough + to-Infinitive`\r\n  * `enough + Noun + to-Infinitive`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The applicant was enough qualified to secure the post.*\r\n  * ✔️ *The applicant was **qualified enough** to secure the post.*\r\n  * ✔️ *The administration possessed **enough resources** to stabilize the economy.*\r\n\r\n---\r\n\r\n#### Rule 16: The Order of Adverbials in Predicates (MPT Rule)\r\n* **Principle:** When multiple adverbials modify the same finite verb, standard syntax requires them to follow the sequence: **M**anner $\\to$ **P**lace $\\to$ **T**ime.\r\n* **Formula:** `Subject + Verb + [Manner] + [Place] + [Time]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The orchestra played yesterday brilliantly in the auditorium.*\r\n  * ✔️ *The orchestra played **brilliantly** (Manner) **in the auditorium** (Place) **yesterday** (Time).*\r\n\r\n---\r\n\r\n### Category E: Negative & Restrictive Inversion\r\n\r\n#### Rule 17: Fronted Negative & Restrictive Adverbs\r\n* **Principle:** When negative or restrictive adverbs (*never, seldom, rarely, little, barely, scarcely*) are fronted for rhetorical emphasis, subject-auxiliary inversion is mandatory.\r\n* **Formula:** `Negative / Restrictive Adverb + Auxiliary Verb + Subject + Main Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Seldom the regulatory commission has intervened in market operations.*\r\n  * ✔️ *Seldom **has the regulatory commission intervened** in market operations.*\r\n  * ❌ *Little he knew about the impending corporate takeover.*\r\n  * ✔️ *Little **did he know** about the impending corporate takeover.*\r\n\r\n---\r\n\r\n#### Rule 18: Negative Correlatives with Inversion ('No sooner', 'Hardly')\r\n* **Principle:** Fronted correlatives denoting immediate succession mandate subject-auxiliary inversion in the main clause, paired with their respective correlative conjunctions.\r\n* **Formula:**\r\n  * `No sooner + had / did + Subject + V3 / V1 + than + Clause`\r\n  * `Hardly / Scarcely + had + Subject + V3 + when + Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *No sooner the whistle had blown than the spectators stormed the pitch.*\r\n  * ✔️ *No sooner **had the whistle blown than** the spectators stormed the pitch.*\r\n\r\n---\r\n\r\n#### Rule 19: Fronted 'Only' Adverbial Clause Inversion\r\n* **Principle:** When *only* modifies a fronted prepositional phrase or subordinate time clause (*only when, only after, only by, only then*), the inversion occurs in the **main governing clause**, not inside the subordinate clause itself.\r\n* **Formula:** `Only + [Prepositional Phrase / Subordinate Time Clause] + Auxiliary Verb + Subject + Main Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Only after the audit was concluded, the CFO submitted his defense.*\r\n  * ✔️ *Only after the audit was concluded **did the CFO submit** his defense.*\r\n  * ❌ *Only when did the alarms sound, the staff evacuated.*\r\n  * ✔️ *Only when the alarms sounded **did the staff evacuate**.*\r\n\r\n---\r\n\r\n#### Rule 20: Fronted Prepositional Negations\r\n* **Principle:** Prepositional phrases expressing absolute negation (*under no circumstances, on no account, in no way, at no time, to no degree*) placed at the head of a sentence trigger full subject-auxiliary inversion.\r\n* **Formula:** `[Prepositional Negation] + Auxiliary Verb + Subject + Main Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Under no circumstances employees may disclose proprietary algorithms.*\r\n  * ✔️ *Under no circumstances **may employees disclose** proprietary algorithms.*\r\n  * ❌ *At no point the security protocols were breached.*\r\n  * ✔️ *At no point **were the security protocols** breached.*\r\n\r\n---\r\n\r\n#### Rule 21: Fronted 'Not Only' Clause Inversion\r\n* **Principle:** When *not only* introduces the initial coordinate clause of a correlative pair, that first clause must undergo subject-auxiliary inversion.\r\n* **Formula:** `Not only + Auxiliary Verb + Subject + Main Verb + but [Subject] + also + Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Not only the council rejected the proposal, but they also fined the developer.*\r\n  * ✔️ *Not only **did the council reject** the proposal, but they also fined the developer.*\r\n\r\n---\r\n\r\n### Category F: Locative, Directional & Predicate Inversion\r\n\r\n#### Rule 22: Locative Prepositional Phrase Fronting (Full Inversion)\r\n* **Principle:** When an emphatic locative prepositional phrase is fronted, full inversion occurs—the full lexical verb precedes the noun subject without an auxiliary verb; however, if the subject is a personal pronoun, inversion is prohibited.\r\n* **Formula:**\r\n  * *Noun Subject:* `[Locative Prepositional Phrase] + Lexical Verb + Noun Subject`\r\n  * *Pronoun Subject:* `[Locative Prepositional Phrase] + Pronoun Subject + Lexical Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *On the summit of the mountain a solitary watchtower stood.*\r\n  * ✔️ *On the summit of the mountain **stood a solitary watchtower**.*\r\n  * ❌ *Here comes he.*\r\n  * ✔️ *Here **he comes**.*\r\n\r\n---\r\n\r\n#### Rule 23: Fronted Directional Particles\r\n* **Principle:** Directional adverbial particles (*down, up, away, off, in, out*) fronted for vivid narration require full verb inversion with substantive nouns, but maintain regular subject-verb order with personal pronouns.\r\n* **Formula:**\r\n  * *Noun Subject:* `[Directional Particle] + Lexical Verb + Noun Subject`\r\n  * *Pronoun Subject:* `[Directional Particle] + Pronoun Subject + Lexical Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Down the rain came, and away ran the soldiers.*\r\n  * ✔️ *Down **came the rain**, and away **ran the soldiers**.*\r\n  * ✔️ *Down **it came**, and away **they ran**.* [Pronoun: No Inversion]\r\n\r\n---\r\n\r\n#### Rule 24: Predicative Adjective & Participle Fronting\r\n* **Principle:** When a predicate adjective or participle phrase is shifted to the sentence head for stylistic balance, the linking copula directly precedes the noun subject.\r\n* **Formula:** `[Predicate Adjective / Participle Phrase] + Copular Verb + Subject`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Especially notable among the architectural features the vaulted arches are.*\r\n  * ✔️ *Especially notable among the architectural features **are the vaulted arches**.*\r\n  * ✔️ * **Standing by the perimeter was** an armed sentinel.*\r\n\r\n---\r\n\r\n#### Rule 25: Elliptical Inversion with 'So', 'Neither', and 'Nor'\r\n* **Principle:** Elliptical coordinate clauses expressing agreement with a preceding positive or negative statement require fronted *so, neither,* or *nor* followed by subject-auxiliary inversion.\r\n* **Formula:**\r\n  * *Positive Agreement:* `So + Auxiliary Verb + Subject`\r\n  * *Negative Agreement:* `Neither / Nor + Auxiliary Verb + Subject`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomat opposed the sanctions, and so the prime minister did.*\r\n  * ✔️ *The diplomat opposed the sanctions, and **so did the prime minister**.*\r\n  * ❌ *He cannot attend the briefing, and neither I can.*\r\n  * ✔️ *He cannot attend the briefing, and **neither can I**.*\r\n\r\n---\r\n\r\n### Category G: Result, Concessive & Comparative Inversion\r\n\r\n#### Rule 26: Result Clause Inversion with 'So' and 'Such'\r\n* **Principle:** When degree intensifiers *so + adjective/adverb* or *such + be* are fronted to emphasize intensity, the governing clause undergoes subject-auxiliary inversion prior to the *that*-clause.\r\n* **Formula:**\r\n  * `So + [Adjective / Adverb] + Auxiliary Verb + Subject + that-Clause`\r\n  * `Such + be + Subject + that-Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *So severe the financial distress was that the firm declared insolvency.*\r\n  * ✔️ *So severe **was the financial distress that** the firm declared insolvency.*\r\n  * ❌ *Such his influence was that all delegates concurred.*\r\n  * ✔️ *Such **was his influence that** all delegates concurred.*\r\n\r\n---\r\n\r\n#### Rule 27: Concessive Fronting with 'As' and 'Though'\r\n* **Principle:** In concessive clauses introduced by *as* or *though*, an adjective, adverb, or bare nominal complement is fronted to the clause head before the subject-verb sequence.\r\n* **Formula:** `[Adjective / Adverb / Bare Noun] + as / though + Subject + Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Though he was tired, he completed the legal review.* [Standard non-inverted]\r\n  * ✔️ * **Tired though he was**, he completed the legal review.* [Concessive fronting]\r\n  * ❌ *Though he was a king, he lived modestly.*\r\n  * ✔️ * **King though he was**, he lived modestly.* [Bare noun: No article]\r\n\r\n---\r\n\r\n#### Rule 28: Comparative Elliptical Inversion\r\n* **Principle:** In formal comparisons using *than* or *as*, optional subject-auxiliary inversion may occur after the comparative conjunction, provided the subject is a noun phrase (not a pronoun) to avoid dangling ambiguity.\r\n* **Formula:** `Main Clause + [Comparative] + than / as + Auxiliary Verb + Noun Subject`\r\n* **Diagnostic Contrast:**\r\n  * ✔️ *The urban centers generate more tax revenue **than do the agrarian districts**.*\r\n  * ✔️ *The urban centers generate more tax revenue **than the agrarian districts do**.*\r\n  * ❌ *She studies harder than does she.* [Ungrammatical with personal pronoun]\r\n  * ✔️ *She studies harder than **she does**.*\r\n  * \r\n\r\n# Module 5: Logical Comparisons & Symmetries\r\n**Total Micro-Rules:** 20  \r\n**Question Output Target:** 60 Questions (3 Questions per Rule: Direct Diagnostic, Embedded Distractor, Inversion/Boundary Trap)\r\n\r\n---\r\n\r\n### Category A: Logical Entity Matching & Illogical Comparison Traps\r\n\r\n#### Rule 1: The Singular Illogical Comparison Trap ('That of')\r\n* **Principle:** Comparisons must link grammatically and conceptually parallel entities. Comparing an attribute of an entity directly to another entity itself (an \"apples-to-oranges\" fallacy) is ungrammatical; the pro-form *that of* must substitute for the singular head noun.\r\n* **Formula:** `Attribute of Entity A + is [Comparative] + than that of + Entity B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The GDP growth of India is faster than China.*  \r\n    *(Illogically compares economic growth directly to a country)*\r\n  * ✔️ *The GDP growth of India is faster than **that of** China.*\r\n\r\n---\r\n\r\n#### Rule 2: The Plural Illogical Comparison Trap ('Those of')\r\n* **Principle:** When comparing plural attributes, characteristics, or constituents between two entities, the plural demonstrative pro-form *those of* must be deployed to preserve syntactic symmetry.\r\n* **Formula:** `Plural Attributes of Entity A + are [Comparative] + than those of + Entity B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The labor regulations in Germany are stricter than the United States.*\r\n  * ✔️ *The labor regulations in Germany are stricter than **those of** the United States.*\r\n\r\n---\r\n\r\n#### Rule 3: Omission of Comparison Markers with Possessive Nouns\r\n* **Principle:** Instead of using *that of* or *those of*, a comparison between attributes may be balanced using a possessive noun phrase or possessive pronoun, provided both terms are syntactically symmetrical.\r\n* **Formula:** `[Noun A's + Attribute] + is [Comparative] + than + [Noun B's (Attribute elided)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Shakespeare’s vocabulary was broader than John Milton.*\r\n  * ✔️ *Shakespeare’s vocabulary was broader than **John Milton's**.*\r\n  * ✔️ *Shakespeare’s vocabulary was broader than **that of John Milton**.*\r\n\r\n---\r\n\r\n#### Rule 4: Ambiguous Ellipsis in Comparative Clauses (Subjective vs. Objective Case)\r\n* **Principle:** In elliptical comparative constructions following *than* or *as*, the case of the pronoun determines whether the comparison is between subjects or objects; choosing the incorrect pronoun distorts the semantic relationship.\r\n* **Formula:**\r\n  * *Subject Comparison:* `Subject A + Verb + Object + than + Subject Pronoun + [Auxiliary Verb]`\r\n  * *Object Comparison:* `Subject + Verb + Object A + than + Object Pronoun`\r\n* **Diagnostic Contrast:**\r\n  * ⚠️ *The director respects the senior analyst more than me.*  \r\n    *(Ambiguous: Does the director respect the analyst more than he respects me, or more than I respect the analyst?)*\r\n  * ✔️ *The director respects the senior analyst more than **I do**.* [Subjective comparison]\r\n  * ✔️ *The director respects the senior analyst more than **me**.* [Objective comparison: more than he respects me]\r\n\r\n---\r\n\r\n### Category B: Exclusion Traps & Group Membership\r\n\r\n#### Rule 5: The 'Any Other' Exclusion Trap in Comparative Degree\r\n* **Principle:** When an entity is compared to other members of the **same** group or class using the comparative degree, the subject entity must be logically excluded from the group using *other* or *else*; failing to do so creates the absurdity of an entity being superior to itself.\r\n* **Formula:** `Subject Entity + is [Comparative] + than any other + Singular Noun (Same Category)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Iron is more useful than any metal.*  \r\n    *(Illogical: Iron is a metal; it cannot be more useful than itself)*\r\n  * ✔️ *Iron is more useful than **any other metal**.*\r\n\r\n---\r\n\r\n#### Rule 6: Prohibition of 'Other' Across Disjoint Categories\r\n* **Principle:** When comparing an entity with members of a completely **different** taxonomic class or category, inserting *other* is ungrammatical because the subject is not a member of the group from which it is being excluded.\r\n* **Formula:** `Subject (Category A) + is [Comparative] + than any + Noun (Category B)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The elephant is larger than any other carnivore.*  \r\n    *(Illogical: The elephant is an herbivore, not a carnivore; 'other' cannot exclude it)*\r\n  * ✔️ *The elephant is larger than **any carnivore**.*\r\n\r\n---\r\n\r\n#### Rule 7: Superlative Degree Class Membership & The 'Other' Prohibition\r\n* **Principle:** The superlative degree identifies the supreme member *within* a defined group and therefore requires total inclusion; including *other* or *else* in a superlative phrase is ungrammatical because it contradicts inclusion.\r\n* **Formula:** `Subject + is the + Superlative + of / among + all the + Plural Noun (No 'other')`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Mount Everest is the highest of all other peaks in the Himalayas.*\r\n  * ✔️ *Mount Everest is the highest of **all the peaks** in the Himalayas.*\r\n\r\n---\r\n\r\n#### Rule 8: The Dual-Entity Constraint (Comparative vs. Superlative)\r\n* **Principle:** When comparing exactly two entities, the comparative degree preceded by the definite article (*the better, the older, the more efficient*) must be used; the superlative degree is reserved exclusively for comparisons among three or more entities.\r\n* **Formula:**\r\n  * `Of the two + Plural Nouns, Subject + is the + Comparative Degree`\r\n  * `Of the three or more + Plural Nouns, Subject + is the + Superlative Degree`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Of the two diplomatic proposals, the second is the most feasible.*\r\n  * ✔️ *Of the two diplomatic proposals, the second is **the more feasible**.*\r\n  * ✔️ *Of the three diplomatic proposals, the third is **the most feasible**.*\r\n\r\n---\r\n\r\n### Category C: Double Comparatives, Absolute Adjectives & Latin Forms\r\n\r\n#### Rule 9: Double Comparatives and Superlatives\r\n* **Principle:** Combining an inflectional comparative/superlative suffix (*-er / -est*) with an analytical degree adverb (*more / most*) is pleonastic and strictly ungrammatical.\r\n* **Formula:** `[Base + -er]  OR  [more + Multi-syllabic Adjective] (Never combine both)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The revised treaty is more preferable than the original draft.*\r\n  * ✔️ *The revised treaty is **preferable to** the original draft.*\r\n  * ❌ *This is the most simplest explanation available.*\r\n  * ✔️ *This is the **simplest** explanation available.*\r\n\r\n---\r\n\r\n#### Rule 10: Absolute (Non-Gradable) Adjectives\r\n* **Principle:** Adjectives denoting absolute, binary, or non-gradable qualities (*unique, perfect, complete, round, square, dead, fatal, universal, unanimous, eternal, infinite*) cannot take degrees of comparison (*more/most*) or qualifying intensifiers (*very*); qualifying adverbs such as *nearly* or *almost* may be used instead.\r\n* **Formula:** `[almost / nearly] + [Absolute Adjective] (Prohibited: more / most / very + Absolute)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The committee reached a very unanimous consensus.*\r\n  * ✔️ *The committee reached a **unanimous** consensus.*\r\n  * ❌ *This archaeological artifact is more unique than that one.*\r\n  * ✔️ *This archaeological artifact is **unique**.*  \r\n    *(Or: ...is **more unusual** than that one.)*\r\n\r\n---\r\n\r\n#### Rule 11: Latin Comparatives Ending in '-ior'\r\n* **Principle:** Comparative adjectives derived from Latin terminating in *-ior* (*superior, inferior, senior, junior, prior, anterior, posterior*) govern the preposition **to**, never the comparative conjunction **than**.\r\n* **Formula:** `Subject + Linking Verb + [superior / inferior / senior / prior] + to + Object`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The domestic manufacturing quality is superior than imported alternatives.*\r\n  * ✔️ *The domestic manufacturing quality is superior **to** imported alternatives.*\r\n  * ❌ *This treaty was drafted prior than the armistice.*\r\n  * ✔️ *This treaty was drafted prior **to** the armistice.*\r\n\r\n---\r\n\r\n#### Rule 12: Governing Regimes for 'Prefer' and 'Preferable'\r\n* **Principle:** The adjective *preferable* and the verb *prefer* govern the preposition *to* (or the correlative *rather than* for non-finites); they cannot be modified by *more* or followed by *than*.\r\n* **Formula:**\r\n  * `Subject + prefer + Noun / Gerund + to + Noun / Gerund`\r\n  * `Subject + prefer + to-Infinitive + rather than + [Bare] Infinitive`\r\n  * `Subject + is preferable to + Object`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *A diplomatic solution is more preferable than open hostility.*\r\n  * ✔️ *A diplomatic solution is **preferable to** open hostility.*\r\n  * ❌ *He prefers reading historical monographs than watching documentaries.*\r\n  * ✔️ *He prefers reading historical monographs **to** watching documentaries.*\r\n\r\n---\r\n\r\n### Category D: Equative & Correlative Comparative Architecture\r\n\r\n#### Rule 13: Positive Equatives vs. Negative Polarity ('As... As' vs. 'So... As')\r\n* **Principle:** The equative correlative *as... as* is valid in both affirmative and negative propositions; the correlative *so... as* is restricted to negative propositions to denote inequality.\r\n* **Formula:**\r\n  * *Affirmative:* `Subject + Verb + as + Positive Degree + as + Object`\r\n  * *Negative:* `Subject + Verb [Negated] + as / so + Positive Degree + as + Object`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The new engine is so fuel-efficient as the older model.* [Affirmative constraint]\r\n  * ✔️ *The new engine is **as fuel-efficient as** the older model.*\r\n  * ✔️ *The new engine is **not so fuel-efficient as** the older model.* [Valid Negative]\r\n\r\n---\r\n\r\n#### Rule 14: The Incomplete Equative Conjoined Comparison Trap\r\n* **Principle:** When an equative phrase (*as... as*) is joined to a comparative phrase (*better than / faster than*), the first equative structure must be grammatically complete; dropping the second *as* leaves the comparison syntactically broken.\r\n* **Formula:** `as + Positive Adjective + as, if not + Comparative + than + Object`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Her analytical work is as thorough, if not more thorough than, his.*\r\n  * ✔️ *Her analytical work is **as thorough as**, if not more thorough than, his.*\r\n\r\n---\r\n\r\n#### Rule 15: Proportional / Parallel Development ('The... The...')\r\n* **Principle:** Correlative comparative structures expressing reciprocal proportionality require the definite article *the* preceding both comparative clauses, accompanied by parallel syntactic word order.\r\n* **Formula:** `The + Comparative + Subject + Verb, the + Comparative + Subject + Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Higher the altitude becomes, colder the climate gets.*\r\n  * ✔️ * **The higher** the altitude becomes, **the colder** the climate gets.*\r\n  * ❌ *The more you practice, you become better.*\r\n  * ✔️ *The more you practice, **the better you become**.*\r\n\r\n---\r\n\r\n#### Rule 16: Degree of Result with 'So / Such... That'\r\n* **Principle:** To express extreme degree producing an outcome, *so* modifies bare adjectives or adverbs, while *such* modifies noun phrases; neither can be substituted with comparative markers or coupled with *as* when denoting a clausal result.\r\n* **Formula:**\r\n  * `so + Adjective / Adverb + that-Clause (Result)`\r\n  * `such + (a / an) + [Adjective] + Noun + that-Clause (Result)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The deficit was such severe that the treasury depleted its reserves.*\r\n  * ✔️ *The deficit was **so severe that** the treasury depleted its reserves.*\r\n  * ✔️ *It was **such a severe deficit that** the treasury depleted its reserves.*\r\n\r\n---\r\n\r\n### Category E: Quantifiers & Internal Qualitative Comparisons\r\n\r\n#### Rule 17: Countable vs. Uncountable Quantifier Degrees ('Fewer' vs. 'Less')\r\n* **Principle:** *Fewer* modifies plural countable nouns; *Less* modifies singular uncountable/mass nouns (with idiomatic exceptions for singular collective measurements of time, money, and distance).\r\n* **Formula:**\r\n  * `fewer + Plural Countable Noun + than`\r\n  * `less + Uncountable / Mass Noun + than`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The revised protocol requires less personnel to execute.*\r\n  * ✔️ *The revised protocol requires **fewer personnel** to execute.*\r\n  * ❌ *The turbine generated fewer electricity during peak hours.*\r\n  * ✔️ *The turbine generated **less electricity** during peak hours.*\r\n\r\n---\r\n\r\n#### Rule 18: Intra-Subject Comparison of Two Qualities ('More... Than')\r\n* **Principle:** When comparing two distinct qualities, traits, or attributes within the **same** person or entity, the comparative suffix *-er* is prohibited; the analytical comparative *more + positive degree* must be used for both adjectives.\r\n* **Formula:** `Subject + is + more + Positive Adjective A + than + Positive Adjective B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The field commander was braver than prudent during the assault.*\r\n  * ✔️ *The field commander was **more brave than prudent** during the assault.*\r\n  * ❌ *She is wiser than clever.*\r\n  * ✔️ *She is **more wise than clever**.*\r\n\r\n---\r\n\r\n#### Rule 19: Multiplicative Comparisons ('Times as much / many as')\r\n* **Principle:** In multiplicative comparisons (*twice, three times, four times*), standard usage pairs the multiplier with an equative structure (*times as [much/many] as*); pairing a multiplier directly with a comparative (*times more than*) introduces mathematical and stylistic ambiguity.\r\n* **Formula:** `Multiplier [three times / four times] + as + many / much + [Noun] + as`\r\n* **Diagnostic Contrast:**\r\n  * ⚠️ *The new server processes three times more requests than the old one.*\r\n  * ✔️ *The new server processes **three times as many requests as** the old one.*  \r\n    *(Note: 'Twice' cannot precede 'as many/much as' with 'times': use 'twice as many', not 'two times as many')*\r\n\r\n---\r\n\r\n#### Rule 20: Gradual Cumulative Progression ('Comparative and Comparative')\r\n* **Principle:** To indicate an ongoing, gradual increase or decrease in quality or degree, identical comparative adjectives/adverbs must be coordinated using *and*; combining non-comparatives or divergent degrees violates structural parallelism.\r\n* **Formula:** `Subject + Verb + [Comparative Degree] + and + [Comparative Degree]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The geopolitical landscape is becoming more and more dark.*\r\n  * ✔️ *The geopolitical landscape is becoming **darker and darker**.*\r\n  * ✔️ *The technology is becoming **more and more sophisticated**.*\r\n\r\n# Module 6: Pronouns, Case & Antecedent Reference\r\n**Total Micro-Rules:** 24  \r\n**Question Output Target:** 72 Questions (3 Questions per Rule: Direct Diagnostic, Embedded Distractor, Inversion/Boundary Trap)\r\n\r\n---\r\n\r\n### Category A: Case Dynamics & Prepositional/Elliptical Traps\r\n\r\n#### Rule 1: Case Following Prepositions ('Between You and Me')\r\n* **Principle:** Prepositions govern the objective case (*me, him, her, us, them, whom*); pairing a preposition with a compound pronoun phrase that includes a subjective pronoun violates governing case mechanics.\r\n* **Formula:** `Preposition [between / except / but / with / for] + Objective Pronoun A + and + Objective Pronoun B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Between you and I, the audit reveals serious fiscal irregularities.*\r\n  * ✔️ *Between you and **me**, the audit reveals serious fiscal irregularities.*\r\n  * ❌ *All the delegates signed the petition except he and she.*\r\n  * ✔️ *All the delegates signed the petition except **him and her**.*\r\n\r\n---\r\n\r\n#### Rule 2: Case in Elliptical Comparisons with 'Than' and 'As'\r\n* **Principle:** In elliptical comparative structures following *than* or *as*, the case of the pronoun is governed by its syntactic role in the unstated, omitted clause (subjective case if completing a subjective predicate; objective case if acting as the object of comparison).\r\n* **Formula:**\r\n  * *Subject Comparison:* `Subject A + Verb + than / as + Subjective Pronoun + [Auxiliary Verb elided]`\r\n  * *Object Comparison:* `Subject + Verb + Object A + than / as + Objective Pronoun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The senior analyst has accumulated far more field experience than him.*\r\n  * ✔️ *The senior analyst has accumulated far more field experience than **he** [has].*\r\n  * ✔️ *The manager commended the junior analyst more than **him**.* [More than she commended him]\r\n\r\n---\r\n\r\n#### Rule 3: The Predicate Nominative with Copular 'Be'\r\n* **Principle:** In formal prescriptive grammar, copular verbs (*be, was, were, been, is, are*) equate the subject with a subject complement; therefore, pronouns following *be* must stand in the nominative (subjective) case.\r\n* **Formula:** `It + is / was / were + Subjective Pronoun [I / he / she / they / we] + who / that`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *If anyone is to be held accountable, it was him.*\r\n  * ✔️ *If anyone is to be held accountable, it was **he**.*\r\n  * ❌ *It is me who drafted the constitutional amendments.*\r\n  * ✔️ *It is **I** who drafted the constitutional amendments.*\r\n\r\n---\r\n\r\n#### Rule 4: Case of Compound Grammatical Objects\r\n* **Principle:** In compound objects (direct objects, indirect objects, or objects of prepositions), both coordinated nominal elements must maintain the objective case; removing the first noun reveals the required pronoun form.\r\n* **Formula:** `Subject + Verb + [Noun / Proper Noun] + and + Objective Pronoun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The board invited the chief architect and he to the plenary session.*  \r\n    *(Diagnostic: The board invited \"he\" is ungrammatical)*\r\n  * ✔️ *The board invited the chief architect and **him** to the plenary session.*\r\n\r\n---\r\n\r\n#### Rule 5: Possessive Pronoun Determination Before Gerund Complements\r\n* **Principle:** When a gerund functions as the core nominal activity being discussed, the pronoun identifying the agent of that action must be in the possessive case (*my, your, his, her, its, our, their*); an objective pronoun creates a case error.\r\n* **Formula:** `Subject + Verb + Possessive Pronoun + Gerund (V-ing)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The committee was taken aback by them resigning without notice.*\r\n  * ✔️ *The committee was taken aback by **their resigning** without notice.*\r\n  * ❌ *He objected to me inspecting the ledger books.*\r\n  * ✔️ *He objected to **my inspecting** the ledger books.*\r\n\r\n---\r\n\r\n### Category B: Reflexive & Intensive Pronoun Syntax\r\n\r\n#### Rule 6: Prohibition of Reflexive Pronouns as Standalone Subjects\r\n* **Principle:** Reflexive pronouns (*myself, himself, herself, ourselves, themselves*) require an explicit antecedent within the same clause to reflect back upon; they cannot function as standalone or compound subjects.\r\n* **Formula:** `Subject Noun + and + Subjective Pronoun + Predicate (Never: and + Reflexive)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The department head and myself will review the confidential dossiers.*\r\n  * ✔️ *The department head and **I** will review the confidential dossiers.*\r\n  * ❌ *Myself was selected to lead the expedition.*\r\n  * ✔️ * **I** was selected to lead the expedition.*\r\n\r\n---\r\n\r\n#### Rule 7: Verbs Requiring Mandatory Reflexive Objects\r\n* **Principle:** Certain transitive verbs (*avail, adapt, acclimatize, reconcile, exert, resign, pride, enjoy*) mandate a reflexive object when used reflexively without an explicit direct nominal object.\r\n* **Formula:** `Subject + [avail / adapt / reconcile / exert / pride] + Reflexive Pronoun + Prepositional Complement`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The student failed to avail of the research opportunity.*\r\n  * ✔️ *The student failed to **avail himself of** the research opportunity.*\r\n  * ❌ *During the crisis, the envoy resigned to his fate.*\r\n  * ✔️ *During the crisis, the envoy **resigned himself to** his fate.*\r\n\r\n---\r\n\r\n#### Rule 8: Verbs Prohibiting Reflexive Objects\r\n* **Principle:** Verbs that are inherently intransitive or denote customary bodily actions (*keep, break, turn, bathe, stop, qualify, rest, hide*) do not accept reflexive pronouns in standard English.\r\n* **Formula:** `Subject + [qualify / hide / bath / keep / rest] + Predicate (No Reflexive Pronoun)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *He qualified himself for the post after years of rigorous training.*\r\n  * ✔️ *He **qualified** for the post after years of rigorous training.*\r\n  * ❌ *The dissident hid himself inside the monastery.*\r\n  * ✔️ *The dissident **hid** inside the monastery.*\r\n\r\n---\r\n\r\n#### Rule 9: Intensive (Emphatic) Pronouns Placement and Number Concord\r\n* **Principle:** Intensive pronouns emphasize an already explicit noun/pronoun and must strictly agree in person, number, and gender with their antecedent; their omission does not compromise grammatical completeness.\r\n* **Formula:** `Head Noun + [Intensive Pronoun matching Gender/Number] + Verb  OR  Head Noun + Verb + [Intensive]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The cabinet ministers itself signed the decree.*\r\n  * ✔️ *The cabinet ministers **themselves** signed the decree.*\r\n  * ✔️ *The chancellor drafted the policy **himself**.*\r\n\r\n---\r\n\r\n### Category C: Relative Pronouns & Restrictive Reference\r\n\r\n#### Rule 10: 'Who' vs. 'Whom' Diagnostic\r\n* **Principle:** *Who* functions as a subjective relative pronoun (the grammatical subject of a finite verb); *Whom* functions as an objective relative pronoun (the object of a verb or preposition).\r\n* **Formula:**\r\n  * *Subjective Test (he/she/they):* `...who + [Finite Verb]`\r\n  * *Objective Test (him/her/them):* `...whom + [Subject + Finite Verb]  OR  Preposition + whom`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomat whom negotiated the peace accord was awarded a medal.*  \r\n    *(Test: \"He negotiated the accord\" $\\to$ Subjective: who)*\r\n  * ✔️ *The diplomat **who** negotiated the peace accord was awarded a medal.*\r\n  * ❌ *The witness who the prosecutor interrogated refused to testify.*  \r\n    *(Test: \"Interrogated him\" $\\to$ Objective: whom)*\r\n  * ✔️ *The witness **whom** the prosecutor interrogated refused to testify.*\r\n\r\n---\r\n\r\n#### Rule 11: Restrictive 'That' vs. Non-Restrictive 'Which'\r\n* **Principle:** Restrictive clauses (essential to identifying the noun) take *that* without commas; non-restrictive clauses (providing supplementary, non-essential detail) take *which* preceded by a comma.\r\n* **Formula:**\r\n  * *Restrictive:* `Noun + that + Defining Clause (No commas)`\r\n  * *Non-Restrictive:* `Noun + , which + Supplementary Clause , + Main Predicate`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The legislation, that limits industrial emissions, was repealed.*\r\n  * ✔️ *The legislation **that limits industrial emissions** was repealed.* [Restrictive: specifies which law]\r\n  * ✔️ *The legislation, **which limits industrial emissions**, was repealed.* [Non-restrictive: describes an already identified law]\r\n\r\n---\r\n\r\n#### Rule 12: Invariable Relative 'That' Constraints\r\n* **Principle:** The relative pronoun *that* must be used instead of *who* or *which* when the antecedent is qualified by superlatives, or follows indefinite quantifiers and absolute restrictors (*all, any, none, nothing, only, the same, little*).\r\n* **Formula:** `[All / None / Nothing / Superlative / The only] + that + Dependent Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *This is the most compelling argument which I have ever encountered.*\r\n  * ✔️ *This is the most compelling argument **that** I have ever encountered.*\r\n  * ❌ *All which glitters is not gold.*\r\n  * ✔️ *All **that** glitters is not gold.*\r\n  * ❌ *He is the only scholar who can translate this hieroglyph.*\r\n  * ✔️ *He is the only scholar **that** can translate this hieroglyph.*\r\n\r\n---\r\n\r\n#### Rule 13: Possessive Relative 'Whose' with Inanimate Entities\r\n* **Principle:** While traditionally restricted to persons, *whose* is fully standard for inanimate nouns to avoid awkward phrasing (*of which*); however, if *of which* is used, the definite article *the* must precede the possessed noun.\r\n* **Formula:**\r\n  * `Inanimate Noun + whose + Possessed Noun`\r\n  * `Inanimate Noun + the + Possessed Noun + of which`\r\n* **Diagnostic Contrast:**\r\n  * ✔️ *The corporation **whose assets** were frozen filed for bankruptcy.*\r\n  * ✔️ *The corporation **the assets of which** were frozen filed for bankruptcy.*\r\n  * ❌ *The corporation assets of which were frozen filed for bankruptcy.*\r\n\r\n---\r\n\r\n#### Rule 14: Prepositional Fronting (\"Pied-Piping\") vs. Stranding\r\n* **Principle:** In formal syntax, when a relative clause is governed by a preposition, the preposition fronts before *whom* or *which*; the pronoun *that* strictly prohibits prepositional fronting.\r\n* **Formula:**\r\n  * `Preposition + whom / which (Grammatical Fronting)`\r\n  * `...that + [Clause] + Preposition (Fronting prohibited with 'that')`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The platform on that the prime minister stood was unstable.*\r\n  * ✔️ *The platform **on which** the prime minister stood was unstable.*\r\n  * ✔️ *The platform **that** the prime minister stood **on** was unstable.*\r\n\r\n---\r\n\r\n### Category D: Indefinite, Reciprocal & Demonstrative Pronouns\r\n\r\n#### Rule 15: The Impersonal Pronoun 'One' Internal Concord\r\n* **Principle:** When the generic impersonal pronoun *one* is used as a subject, all subsequent anaphoric pronouns and possessive determiners referring back to it must consistently remain forms of *one* (*one's, oneself*); shifting to *he, him, his, or they* is ungrammatical.\r\n* **Formula:** `One + Verb + one's + Noun + oneself`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *One must fulfill his obligations toward his country.*\r\n  * ✔️ *One must fulfill **one's** obligations toward **one's** country.*\r\n  * ❌ *One should protect himself from public scrutiny.*\r\n  * ✔️ *One should protect **oneself** from public scrutiny.*\r\n\r\n---\r\n\r\n#### Rule 16: Indefinite Pronoun Anaphoric Agreement in Formal Register\r\n* **Principle:** Singular distributive and indefinite pronouns (*everyone, everybody, someone, nobody, each, either*) grammatically govern singular anaphoric possessives (*his or her*, or generically *his*) in formal prescriptive grammar.\r\n* **Formula:** `[Everyone / Each / Nobody] + of + Plural Noun + Verb (Singular) + his / her + Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Every diplomat submitted their credentials to the foreign ministry.* [Colloquial]\r\n  * ✔️ *Every diplomat submitted **his or her** credentials to the foreign ministry.* [Formal prescriptive]\r\n\r\n---\r\n\r\n#### Rule 17: Reciprocal Pronouns ('Each other' vs. 'One another')\r\n* **Principle:** The reciprocal pronoun *each other* is used for interactions between exactly **two** entities; *one another* is reserved for interactions among **three or more** entities.\r\n* **Formula:**\r\n  * *Two Entities:* `Entity A + and + Entity B + Verb + each other`\r\n  * *Three or More:* `Entities (Three+) + Verb + one another`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The two rival generals respected one another deeply.*\r\n  * ✔️ *The two rival generals respected **each other** deeply.*\r\n  * ❌ *All five permanent council members consulted each other before the vote.*\r\n  * ✔️ *All five permanent council members consulted **one another** before the vote.*\r\n\r\n---\r\n\r\n#### Rule 18: Demonstrative Sequence ('The Former' vs. 'The Latter')\r\n* **Principle:** *The former* and *the latter* refer strictly to **two** previously mentioned entities; when referring to three or more entities, *the first / the last* (or *the first-mentioned / the last-mentioned*) must be used.\r\n* **Formula:**\r\n  * *Two Referents:* `Entity A (former) ... Entity B (latter)`\r\n  * *Three+ Referents:* `Entity A (first) ... Entity B ... Entity C (last)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *France, Germany, and Italy joined; the latter was the most vocal.*\r\n  * ✔️ *France, Germany, and Italy joined; **the last** was the most vocal.*\r\n  * ✔️ *Of oil and coal, **the former** is more easily transported.*\r\n\r\n---\r\n\r\n#### Rule 19: Distributive 'Each' Combined with Prepositional Antecedents\r\n* **Principle:** When *each* functions as a distributive pronoun preceding an *of*-phrase, it takes a singular verb and singular anaphoric reference; when it is placed in an appositive position after a plural subject, reference becomes plural.\r\n* **Formula:**\r\n  * *Preceding:* `Each of + Plural Noun + Singular Verb + his / her / its`\r\n  * *Appositive:* `Plural Noun + each + Plural Verb + their`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Each of the delegates voiced their reservations.*\r\n  * ✔️ *Each of the delegates voiced **his or her** reservations.*\r\n  * ✔️ *The delegates **each voiced their** reservations.*\r\n\r\n---\r\n\r\n### Category E: Antecedent Clarity, Person Ordering & Structural Ambiguity\r\n\r\n#### Rule 20: Polite Person Ordering (The '231' vs. '123' Rule)\r\n* **Principle:** In compound pronoun phrases denoting neutral or positive actions, polite syntax mandates the order: **Second Person (2) $\\to$ Third Person (3) $\\to$ First Person (1)**. When admitting fault, confessing guilt, or when all pronouns are plural, the sequence reverses to: **First Person (1) $\\to$ Second Person (2) $\\to$ Third Person (3)**.\r\n* **Formula:**\r\n  * *Standard / Positive (2-3-1):* `You, he, and I + Plural Verb`\r\n  * *Blame / Confession (1-2-3):* `I, you, and he + Plural Verb [confess / are at fault]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *I, you, and he have been awarded the research fellowship.*\r\n  * ✔️ * **You, he, and I** have been awarded the research fellowship.*\r\n  * ❌ *You, he, and I must accept the blame for the catastrophic error.*\r\n  * ✔️ * **I, you, and he** must accept the blame for the catastrophic error.*\r\n\r\n---\r\n\r\n#### Rule 21: Ambiguous Antecedent Reference\r\n* **Principle:** A third-person pronoun (*he, she, it, they*) must refer unambiguously to a single antecedent noun; if two preceding nouns can plausibly claim the pronoun, the sentence is syntactically defective.\r\n* **Formula:** `Noun A + Verb + Noun B, and [Pronoun without distinct reference]` $\\to$ *Restructure sentence*\r\n* **Diagnostic Contrast:**\r\n  * ⚠️ *The supervisor told the intern that he was not eligible for the grant.*  \r\n    *(Ambiguous: Does \"he\" refer to the supervisor or the intern?)*\r\n  * ✔️ *The supervisor informed the intern that **the intern** was not eligible for the grant.*\r\n  * ✔️ *The supervisor said to the intern, \"You are not eligible for the grant.\"*\r\n\r\n---\r\n\r\n#### Rule 22: The Missing / Implied Antecedent Trap\r\n* **Principle:** A pronoun cannot refer back to an unstated noun, a possessive adjective, or an action implied by an adjective; an explicit, independent grammatical substantive noun must serve as its antecedent.\r\n* **Formula:** `Possessive Noun / Adjective + Noun ... Pronoun (Pronoun cannot refer to the possessive modifier)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *In Shakespeare’s Hamlet, he explores the burden of revenge.*  \r\n    *(Grammatically defective: \"he\" has no noun antecedent; \"Shakespeare's\" is an adjectival possessive)*\r\n  * ✔️ *In *Hamlet*, **Shakespeare** explores the burden of revenge.*\r\n\r\n---\r\n\r\n#### Rule 23: Vague Broad Reference with Relative 'Which'\r\n* **Principle:** The relative pronoun *which* must refer to a specific noun or nominal phrase, not loosely to an entire preceding independent clause or generic thought in formal academic syntax.\r\n* **Formula:** `Clause + , which + Verb` $\\to$ *Restructure using a summarizing noun phrase or participle*\r\n* **Diagnostic Contrast:**\r\n  * ⚠️ *The treasury abruptly escalated interest rates, which angered investors.*\r\n  * ✔️ *The treasury abruptly escalated interest rates, **a decision that** angered investors.*\r\n  * ✔️ *The treasury abruptly escalated interest rates, **thereby angering** investors.*\r\n\r\n---\r\n\r\n#### Rule 24: Compound Anaphoric Agreement with Gender-Mixed Antecedents\r\n* **Principle:** When two singular antecedents of differing genders are joined by *or* or *nor*, the pronoun must agree with the nearer antecedent in accordance with the rule of proximity.\r\n* **Formula:** `Either + Male Noun + or + Female Noun + Verb + her + Noun`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Neither the boy nor the girl completed his homework.*\r\n  * ✔️ *Neither the boy nor the girl completed **her** homework.*\r\n  * ✔️ *Neither the girl nor the boy completed **his** homework.*\r\n\r\n# Module 7: Conjunctions, Connectors & Parallelism\r\n**Total Micro-Rules:** 22  \r\n**Question Output Target:** 66 Questions (3 Questions per Rule: Direct Diagnostic, Embedded Distractor, Inversion/Boundary Trap)\r\n\r\n---\r\n\r\n### Category A: Correlative Conjunction Pairing & Strict Symmetrical Alignment\r\n\r\n#### Rule 1: Symmetrical Placement of 'Not Only... But Also'\r\n* **Principle:** The correlative pair *not only... but also* must be placed immediately before identical syntactic constituents (e.g., Verb with Verb, Prepositional Phrase with Prepositional Phrase, Direct Object with Direct Object). Misplacing the first marker creates asymmetric parallelism.\r\n* **Formula:**\r\n  * *Verbal Parallelism:* `Subject + not only + [Verb Phrase A] + but also + [Verb Phrase B]`\r\n  * *Nominal Parallelism:* `Subject + Verb + not only + [Noun Phrase A] + but also + [Noun Phrase B]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The administration not only proposed a corporate tariff, but also a wealth tax.*  \r\n    *(Asymmetric: \"not only\" precedes a verb; \"but also\" precedes a noun)*\r\n  * ✔️ *The administration proposed **not only a corporate tariff but also a wealth tax**.*\r\n  * ✔️ *The administration **not only proposed** a corporate tariff **but also enacted** a wealth tax.*\r\n\r\n---\r\n\r\n#### Rule 2: Invariable Correlative Lexical Pairings\r\n* **Principle:** Correlative conjunctions possess fixed idiomatic counterparts; cross-pairing or blending elements from different correlatives violates prescriptive syntax.\r\n* **Formula:**\r\n  * `Neither... nor` *(never: neither... or)*\r\n  * `Either... or` *(never: either... nor)*\r\n  * `Both... and` *(never: both... as well as / along with)*\r\n  * `Whether... or` *(never: whether... and)*\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Both the managing director as well as the board chairman attended the summit.*\r\n  * ✔️ * **Both** the managing director **and** the board chairman attended the summit.*\r\n  * ❌ *Neither the sovereign debt was repaid, or the interest was forgiven.*\r\n  * ✔️ * **Neither** was the sovereign debt repaid, **nor** was the interest forgiven.*\r\n\r\n---\r\n\r\n#### Rule 3: Syntactic Alignment of 'Either... Or' and 'Neither... Nor'\r\n* **Principle:** The structural constituents following *either* and *or* (or *neither* and *nor*) must mirror each other in syntactic rank and grammatical category.\r\n* **Formula:** `Subject + Verb + either + [Prepositional Phrase A] + or + [Prepositional Phrase B]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *You may either travel by continental rail or take an overnight flight.*  \r\n    *(Asymmetric: \"either\" precedes a prepositional phrase; \"or\" precedes a verb phrase)*\r\n  * ✔️ *You may **either travel by continental rail or take an overnight flight**.*\r\n  * ✔️ *You may travel **either by continental rail or by overnight flight**.*\r\n\r\n---\r\n\r\n#### Rule 4: Structural Pairing of 'Between... And' vs. 'From... To'\r\n* **Principle:** The preposition *between* must strictly correlate with the conjunction *and*; the preposition *from* must correlate with *to*. Blending these pairs (*between... to*, *from... and*) is ungrammatical.\r\n* **Formula:**\r\n  * `between + [Coordinate A] + and + [Coordinate B]`\r\n  * `from + [Point A] + to + [Point B]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The public consultations are scheduled between 2:00 PM to 5:00 PM.*\r\n  * ✔️ *The public consultations are scheduled **between 2:00 PM and 5:00 PM**.*\r\n  * ✔️ *The public consultations are scheduled **from 2:00 PM to 5:00 PM**.*\r\n\r\n---\r\n\r\n#### Rule 5: Immediate Precedence Correlatives ('No Sooner... Than' vs. 'Hardly... When')\r\n* **Principle:** Temporal correlatives of immediate precedence require specific lexical pairings: *No sooner* mandates *than*; *Hardly* and *Scarcely* mandate *when* (or occasionally *before*). Cross-pairing *hardly... than* or *no sooner... when* is invalid.\r\n* **Formula:**\r\n  * `No sooner + [had + Subject + V3] + than + [Simple Past Clause]`\r\n  * `Hardly / Scarcely + [had + Subject + V3] + when + [Simple Past Clause]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Hardly had the decree been announced than riots erupted in the capital.*\r\n  * ✔️ *Hardly had the decree been announced **when** riots erupted in the capital.*\r\n  * ❌ *No sooner had the market opened when panic selling began.*\r\n  * ✔️ *No sooner had the market opened **than** panic selling began.*\r\n\r\n---\r\n\r\n### Category B: Subordinating vs. Prepositional Connectors\r\n\r\n#### Rule 6: Concessive Connectors ('Although' vs. 'Despite' / 'In Spite Of')\r\n* **Principle:** *Although, even though,* and *though* are subordinating conjunctions requiring a full finite clause (`Subject + Finite Verb`); *Despite* and *In spite of* are prepositions requiring a noun phrase or gerund. The form *despite of* is ungrammatical.\r\n* **Formula:**\r\n  * `Although / Even though + [Subject + Verb], Main Clause`\r\n  * `Despite / In spite of + [Noun Phrase / Gerund], Main Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Despite of the inclement weather, the maritime fleet set sail.*\r\n  * ❌ *Despite the weather was inclement, the maritime fleet set sail.*\r\n  * ✔️ * **Despite the inclement weather**, the maritime fleet set sail.*\r\n  * ✔️ * **Although the weather was inclement**, the maritime fleet set sail.*\r\n\r\n---\r\n\r\n#### Rule 7: Causal Connectors ('Because' vs. 'Because of' / 'Due to')\r\n* **Principle:** *Because, since,* and *as* introduce subordinate causal clauses containing a subject and a verb; *Because of, due to,* and *owing to* function as prepositional phrases that modify noun phrases or serve as adjectival complements.\r\n* **Formula:**\r\n  * `Because / Since + [Subject + Verb], Main Clause`\r\n  * `Because of / Due to + [Noun Phrase / Gerund], Main Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The factory suspended operations because of the raw material supplies ceased.*\r\n  * ✔️ *The factory suspended operations **because** the raw material supplies ceased.*\r\n  * ✔️ *The factory suspended operations **because of the cessation of** raw material supplies.*\r\n\r\n---\r\n\r\n#### Rule 8: Temporal Connectors ('While' vs. 'During')\r\n* **Principle:** *While* is a conjunction introducing a clause of simultaneous duration or an abridged participial clause; *During* is a preposition that must be followed by a noun phrase denoting a time period, never a finite clause.\r\n* **Formula:**\r\n  * `While + [Subject + Verb / Present Participle], Main Clause`\r\n  * `During + [Noun Phrase], Main Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *During the delegates deliberated, protestors gathered outside.*\r\n  * ✔️ * **While the delegates deliberated**, protestors gathered outside.*\r\n  * ✔️ * **During the deliberations**, protestors gathered outside.*\r\n\r\n---\r\n\r\n#### Rule 9: Purposive Connectors ('So that' vs. 'In order to')\r\n* **Principle:** *So that* and *in order that* introduce subordinate clauses containing an explicit modal verb (*can, could, may, might*); *In order to* and *so as to* govern a non-finite base infinitive without an explicit subject.\r\n* **Formula:**\r\n  * `Main Clause + so that / in order that + [Subject + Modal Auxiliary + Base Verb]`\r\n  * `Main Clause + in order to / so as to + Base Verb (V1)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The government deployed troops in order that to restore civil order.*\r\n  * ✔️ *The government deployed troops **in order to restore** civil order.*\r\n  * ✔️ *The government deployed troops **so that they might restore** civil order.*\r\n\r\n---\r\n\r\n### Category C: Redundant & Double Connective Traps\r\n\r\n#### Rule 10: Prohibition of Double Conjunctions ('Although... But')\r\n* **Principle:** Subordinating conjunctions (*Although, Though, Since, As, Because*) subordinate a clause, leaving the main clause to complete the thought. Introducing a coordinating conjunction (*but, yet, so, therefore*) to connect the main clause creates a redundant double connection.\r\n* **Formula:** `Although / Though + Clause A, Clause B  (Never: Clause A, but Clause B)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Although the evidence was overwhelming, but the jury acquitted the defendant.*\r\n  * ✔️ * **Although the evidence was overwhelming**, the jury acquitted the defendant.*\r\n  * ❌ *Because the shipment arrived late, therefore the assembly line stalled.*\r\n  * ✔️ * **Because the shipment arrived late**, the assembly line stalled.*\r\n\r\n---\r\n\r\n#### Rule 11: The 'Lest' Negative Redundancy & Mood Regime\r\n* **Principle:** The conjunction *lest* inherently conveys a negative purpose meaning \"for fear that\" or \"in order that... not.\" It strictly prohibits negative words (*not, never*) within its clause and governs either the modal auxiliary **should** or a bare mandative subjunctive base verb.\r\n* **Formula:** `Subject + Verb + lest + Subject + [should + Base Verb / Base Verb (Subjunctive)] (No 'not')`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Walk cautiously lest you should not stumble.*\r\n  * ✔️ *Walk cautiously **lest you should stumble**.*\r\n  * ✔️ *Walk cautiously **lest you stumble**.*\r\n\r\n---\r\n\r\n#### Rule 12: Inherent Negative Polarity of 'Unless' and 'Until'\r\n* **Principle:** *Unless* (conditional: \"if not\") and *Until* (temporal: \"up to the point when not\") possess inherent negative polarity. Subordinate clauses governed by *unless* or *until* cannot contain negative adverbs (*not, no, never*).\r\n* **Formula:** `unless / until + [Subject + Affirmative Verb], Main Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The policy cannot be enacted unless the council does not ratify it.*\r\n  * ✔️ *The policy cannot be enacted **unless the council ratifies it**.*\r\n  * ❌ *Wait inside the compound until the security escort does not arrive.*\r\n  * ✔️ *Wait inside the compound **until the security escort arrives**.*\r\n\r\n---\r\n\r\n#### Rule 13: Redundant Nominal Causal Connectors ('The reason why... is that')\r\n* **Principle:** The phrase *The reason why...* establishes causality as a noun concept. Completing the predicate with *because, due to,* or *on account of* is a tautology; the complement clause must be introduced by the conjunction **that**.\r\n* **Formula:** `The reason (why) + Clause + is that + Clause  (Never: is because)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The reason why the merger collapsed was because regulatory approvals were withheld.*\r\n  * ✔️ *The reason why the merger collapsed was **that regulatory approvals were withheld**.*\r\n\r\n---\r\n\r\n### Category D: Structural Parallelism in Coordinate Series & Lists\r\n\r\n#### Rule 14: Morphological Parallelism in Coordinated Lists\r\n* **Principle:** All grammatical elements joined in a series by coordinating conjunctions (*and, or, nor*) must share the exact same morphological class and grammatical structure (e.g., all Gerunds, all Infinitives, all Abstract Nouns, or all Adjectives).\r\n* **Formula:** `Verb + [Gerund A], [Gerund B], and [Gerund C]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The new director prioritizes reducing waste, optimizing logistics, and to cut overhead costs.*\r\n  * ✔️ *The new director prioritizes **reducing waste**, **optimizing logistics**, and **cutting overhead costs**.*\r\n\r\n---\r\n\r\n#### Rule 15: Parallel Prepositional Governing Distribution\r\n* **Principle:** When multiple coordinated phrases require different governing prepositions, each unique preposition must be stated explicitly; sharing a single preposition across nouns requiring distinct regimes breaks grammatical syntax.\r\n* **Formula:** `Subject + Verb + [Adjective A + Preposition A] + and + [Adjective B + Preposition B]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The ambassador expressed keen interest and dedication to the peace initiative.*  \r\n    *(Error: One is \"interested in\", not \"interested to\")*\r\n  * ✔️ *The ambassador expressed keen **interest in** and **dedication to** the peace initiative.*\r\n\r\n---\r\n\r\n#### Rule 16: Parallelism in Infinitive Complements\r\n* **Principle:** In a coordinate series of to-infinitives, the particle *to* must either be repeated before every coordinated verb for deliberate emphasis, or stated once before the initial verb and elided before the remaining verbs. Arbitrary, inconsistent omission is an error.\r\n* **Formula:**\r\n  * `to + Verb A, Verb B, and Verb C`  *(Shared single 'to')*\r\n  * `to + Verb A, to + Verb B, and to + Verb C`  *(Fully repeated 'to')*\r\n* **Diagnostic Contrast:**\r\n  * ❌ *He resolved to study the dossiers, to cross-examine the witnesses, and evaluate the physical evidence.*\r\n  * ✔️ *He resolved **to study** the dossiers, **to cross-examine** the witnesses, and **to evaluate** the physical evidence.*\r\n  * ✔️ *He resolved **to study** the dossiers, **cross-examine** the witnesses, and **evaluate** the physical evidence.*\r\n\r\n---\r\n\r\n#### Rule 17: Clausal Parallelism with Relative Pronouns\r\n* **Principle:** Coordinate clauses modifying the same noun head must share the same relative structural form; coordinating a relative clause with an independent main clause or a participial phrase breaks clausal balance.\r\n* **Formula:** `Head Noun + [Relative Clause A] + and + [Relative Clause B]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *We require an analyst who possesses mathematical rigor and having experience in financial forensics.*\r\n  * ✔️ *We require an analyst **who possesses mathematical rigor** and **who has experience in financial forensics**.*\r\n\r\n---\r\n\r\n### Category E: Nuanced Discourse Markers & Semantic Connectors\r\n\r\n#### Rule 18: Structural Non-Coordinating Status of 'As well as'\r\n* **Principle:** *As well as* is a parenthetical quasi-coordinator, not a coordinating conjunction like *and*. When followed directly by a non-finite verbal complement, standard syntax mandates a gerund (*V-ing*), not a bare or full infinitive.\r\n* **Formula:** `Subject + Verb + Object + as well as + Gerund (V-ing)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The scholarship covers tuition fees as well as provide a monthly stipend.*\r\n  * ✔️ *The scholarship covers tuition fees **as well as providing a monthly stipend**.*\r\n\r\n---\r\n\r\n#### Rule 19: The 'As... So' Analogous Correlative Architecture\r\n* **Principle:** To express an explicit parallel analogy between two distinct actions or propositions, the correlative construction *As... so* is required, with the *so*-clause frequently employing inverted syntax.\r\n* **Formula:** `As + [Clause A], so + [Clause B / Auxiliary Verb + Subject]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Like you sow, you will reap.*\r\n  * ✔️ * **As you sow, so shall you reap**.*\r\n  * ✔️ * **As the sun warms the earth, so does knowledge illuminate the mind**.*\r\n\r\n---\r\n\r\n#### Rule 20: 'Whether... Or' vs. 'If' in Nominal Clauses\r\n* **Principle:** In formal syntax, *whether* is obligatory instead of *if* when: (1) followed directly by *or not*, (2) introducing a subject clause, (3) following a preposition, or (4) introducing a to-infinitive complement.\r\n* **Formula:**\r\n  * *After Preposition:* `Preposition + whether + Clause`\r\n  * *Before Infinitive:* `whether + to-Infinitive`\r\n  * *Immediate 'or not':* `whether or not + Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The success of the mission depends on if the weather clears.*\r\n  * ✔️ *The success of the mission depends on **whether the weather clears**.*\r\n  * ❌ *The committee debated if to endorse the nominee.*\r\n  * ✔️ *The committee debated **whether to endorse the nominee**.*\r\n\r\n---\r\n\r\n#### Rule 21: Coordinating Conjunctions vs. Conjunctive Adverbs (Punctuation Boundaries)\r\n* **Principle:** Coordinating conjunctions (*and, but, for, nor, or, so, yet*) connect independent clauses using a comma; conjunctive adverbs (*however, therefore, moreover, nevertheless, consequently*) cannot join two independent clauses with only a comma (avoiding comma splices).\r\n* **Formula:**\r\n  * `Independent Clause , + [and / but / yet] + Independent Clause`\r\n  * `Independent Clause ; + however / therefore , + Independent Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The treasury exhausted its reserves, however the currency continued to fall.*  \r\n    *(Comma splice)*\r\n  * ✔️ *The treasury exhausted its reserves, **yet the currency continued to fall**.*\r\n  * ✔️ *The treasury exhausted its reserves**; however, the currency continued to fall**.*\r\n\r\n---\r\n\r\n#### Rule 22: 'Doubt That' vs. 'Doubt Whether / If' Polarity\r\n* **Principle:** In affirmative declarative statements where genuine uncertainty exists, the verb *doubt* and adjective *doubtful* govern **whether** or **if**; in negative or interrogative clauses where no real uncertainty exists, they mandate **that**.\r\n* **Formula:**\r\n  * *Affirmative (Uncertainty):* `Subject + doubt(s) / is doubtful + whether / if + Clause`\r\n  * *Negative / Question (Certainty):* `Subject + do not doubt / No doubt + that + Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *I doubt that the peace accord will hold through the winter.*\r\n  * ✔️ *I **doubt whether the peace accord will hold** through the winter.*\r\n  * ❌ *There is no doubt whether the macroeconomic reforms were necessary.*\r\n  * ✔️ *There is **no doubt that the macroeconomic reforms were necessary**.*\r\n\r\n# Module 8: Sentence Boundaries, Fragments & Punctuation-Driven Syntax\r\n**Total Micro-Rules:** 18  \r\n**Question Output Target:** 54 Questions (3 Questions per Rule: Direct Diagnostic, Embedded Distractor, Inversion/Boundary Trap)\r\n\r\n---\r\n\r\n### Category A: Clause Boundaries, Splices & Sentence Fragments\r\n\r\n#### Rule 1: The Comma Splice Trap\r\n* **Principle:** Two independent clauses (clauses that can stand alone as complete sentences) cannot be joined solely by a comma; doing so creates a \"comma splice.\" They must be separated by a period, linked by a semicolon, or joined by a coordinating conjunction (FANBOYS) preceded by a comma.\r\n* **Formula:**\r\n  * ❌ `Independent Clause , Independent Clause`\r\n  * ✔️ `Independent Clause . Independent Clause`\r\n  * ✔️ `Independent Clause ; Independent Clause`\r\n  * ✔️ `Independent Clause , + [for / and / nor / but / or / yet / so] + Independent Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The central bank raised benchmark interest rates, commercial lenders did not follow suit.*\r\n  * ✔️ *The central bank raised benchmark interest rates**;** commercial lenders did not follow suit.*\r\n  * ✔️ *The central bank raised benchmark interest rates**, but** commercial lenders did not follow suit.*\r\n\r\n---\r\n\r\n#### Rule 2: Fused (Run-On) Sentences\r\n* **Principle:** Connecting two independent clauses with no punctuation mark or coordinating conjunction whatsoever produces a fused or run-on sentence, obscuring syntactic boundaries.\r\n* **Formula:** `Independent Clause + [Boundary Marker: . / ; / , + FANBOYS] + Independent Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The forensic audit revealed widespread embezzlement the board of directors resigned immediately.*\r\n  * ✔️ *The forensic audit revealed widespread embezzlement**;** the board of directors resigned immediately.*\r\n  * ✔️ *The forensic audit revealed widespread embezzlement**, so** the board of directors resigned immediately.*\r\n\r\n---\r\n\r\n#### Rule 3: Dependent (Subordinate) Clause Fragments\r\n* **Principle:** A clause initiated by a subordinating conjunction (*because, although, since, while, unless, whereas*) contains a subject and a verb but cannot stand alone as a grammatical sentence. Punctuation terminating it as an independent sentence creates a fragment.\r\n* **Formula:** `Subordinate Conjunction + Subject + Verb , + Independent Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Although the pharmaceutical trial yielded unprecedented clinical efficacy. The regulator withheld final market authorization.*\r\n  * ✔️ *Although the pharmaceutical trial yielded unprecedented clinical efficacy**,** the regulator withheld final market authorization.*\r\n\r\n---\r\n\r\n#### Rule 4: Participial and Prepositional Phrase Fragments\r\n* **Principle:** A participial phrase (*V-ing / V3*) or an extended prepositional phrase lacks a finite verb and a governing subject; it cannot be punctuated as a standalone orthographic sentence.\r\n* **Formula:** `Independent Clause + , + [Participial Modifier Phrase]`  \r\n*(or invert with participial phrase leading)*\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The treaty negotiations collapsed late Tuesday evening. Leaving the diplomatic corps without a framework for peace.*\r\n  * ✔️ *The treaty negotiations collapsed late Tuesday evening**, leaving the diplomatic corps without a framework for peace.*\r\n\r\n---\r\n\r\n#### Rule 5: Compound Predicates vs. Compound Sentences (Spurious FANBOYS Comma)\r\n* **Principle:** A coordinating conjunction connecting two verbs that share the same single subject (a compound predicate) must not be separated by a comma; a comma is reserved for connecting two full independent clauses with distinct subjects.\r\n* **Formula:**\r\n  * *Compound Predicate:* `Subject + Verb Phrase A + [and / but] + Verb Phrase B (No comma)`\r\n  * *Compound Sentence:* `Subject A + Verb A + , + [and / but] + Subject B + Verb B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The prime minister addressed the emergency plenary session, and outlined the fiscal defense measures.*\r\n  * ✔️ *The prime minister addressed the emergency plenary session **and outlined** the fiscal defense measures.*\r\n  * ✔️ *The prime minister addressed the emergency plenary session**, and he outlined** the fiscal defense measures.*\r\n\r\n---\r\n\r\n### Category B: Major Punctuation Marks as Structural Connectors\r\n\r\n#### Rule
