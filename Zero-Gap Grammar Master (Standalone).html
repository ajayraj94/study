erm (consenting).\r\n* **Formula:**\r\n  * `Subject + agree + with + [Person / Viewpoint]`\r\n  * `Subject + agree + to + [Terms / Proposal / Plan / Demand]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The board agreed with the acquisition terms proposed by the rival firm.*\r\n  * ✔️ *The board **agreed to** the acquisition terms proposed by the rival firm.*\r\n  * ✔️ *The board **agreed with** the chief financial officer.*\r\n\r\n---\r\n\r\n#### Item 24: 'Vexed With' [Person] vs. 'Vexed At' [Issue/Action]\r\n* **Principle:** An agent is *vexed* (annoyed/irritated) **with** a person for their conduct; an agent is *vexed* **at** or **by** an impersonal occurrence, delay, or circumstance.\r\n* **Formula:**\r\n  * `Subject + be + vexed + with + [Person]`\r\n  * `Subject + be + vexed + at / by + [Delay / Outcome / Insolence]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The chancellor was vexed at the recalcitrant ambassador.*\r\n  * ✔️ *The chancellor was **vexed with** the recalcitrant ambassador.*\r\n  * ✔️ *The chancellor was **vexed at the procedural delay**.*\r\n\r\n---\r\n\r\n#### Item 25: 'Acquaint With' (Familiarity Induction)\r\n* **Principle:** The reflexive or passive verb *acquaint* obligatorily takes the preposition **with**; pairing it with *to* or *about* is ungrammatical.\r\n* **Formula:** `Subject + acquaint + [Oneself / Object] + with + [Facts / Dossier / Situation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The incoming defense secretary must acquaint himself to the military command structure.*\r\n  * ✔️ *The incoming defense secretary must **acquaint himself with** the military command structure.*\r\n# Module 12: Fixed Prepositions & Prepositional Collocations\r\n**Curated Selection:** Items 26 to 50 of 200 Core Collocations  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category F: Vulnerability, Immunity & Resistance\r\n\r\n#### Item 26: 'Susceptible To' (Inherent Vulnerability)\r\n* **Principle:** The adjective *susceptible* takes the preposition **to** when expressing vulnerability to an illness, influence, or deception; it never takes *of* or *for* in this sense. (It takes *of* only in the rare archaic sense of admitting proof: *susceptible of proof*).\r\n* **Formula:** `Subject + be + susceptible + to + [Infection / Influence / Flattery]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Infants and the elderly are especially susceptible for respiratory ailments.*\r\n  * ✔️ *Infants and the elderly are especially **susceptible to** respiratory ailments.*\r\n\r\n---\r\n\r\n#### Item 27: 'Vulnerable To' (Exposure to Attack or Harm)\r\n* **Principle:** *Vulnerable* mandates the preposition **to**; substituting *against* (due to conceptual confusion with *defend against*) is a standard diagnostic error.\r\n* **Formula:** `Subject + be + vulnerable + to + [Attack / Exploitation / Disease]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The coastal garrison remained highly vulnerable against naval bombardment.*\r\n  * ✔️ *The coastal garrison remained highly **vulnerable to** naval bombardment.*\r\n\r\n---\r\n\r\n#### Item 28: 'Immune To' [Biological/Psychological] vs. 'Immune From' [Legal/Financial]\r\n* **Principle:** One is *immune* **to** a physiological disease, toxin, or verbal criticism (incapable of being affected); one is *immune* **from** prosecution, taxation, arrest, or legal penalty (exempt from a systemic obligation).\r\n* **Formula:**\r\n  * `Subject + be + immune + to + [Pathogen / Poison / Criticism]`\r\n  * `Subject + be + immune + from + [Prosecution / Arrest / Taxation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Accredited ambassadors are immune to criminal prosecution in host states.*\r\n  * ✔️ *Accredited ambassadors are **immune from** criminal prosecution in host states.*\r\n  * ✔️ *The inoculated subjects were **immune to** the virulent strain.*\r\n\r\n---\r\n\r\n#### Item 29: 'Antipathy To / Towards' (Deep-Seated Aversion)\r\n* **Principle:** The noun *antipathy* takes **to** or **towards** when denoting settled hostility or aversion directed at an entity or practice; using *against* is non-standard.\r\n* **Formula:** `Subject + have / express + antipathy + to / towards + [Entity / Practice]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The conservative electorate harbored a deep antipathy against foreign interventions.*\r\n  * ✔️ *The conservative electorate harbored a deep **antipathy to** foreign interventions.*\r\n  * ✔️ *She showed an instinctive **antipathy towards** bureaucratic excess.*\r\n\r\n---\r\n\r\n#### Item 30: 'Hostile To' (Opposition in Principle)\r\n* **Principle:** *Hostile* governs the preposition **to** when indicating intellectual or institutional opposition to a proposal, regime, or innovation; pairing it with *against* is ungrammatical.\r\n* **Formula:** `Subject + be + hostile + to + [Reform / Innovation / Proposal]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The entrenched bureaucracy remained fiercely hostile against the digitisation bill.*\r\n  * ✔️ *The entrenched bureaucracy remained fiercely **hostile to** the digitisation bill.*\r\n\r\n---\r\n\r\n### Category G: Accountability, Duty & Allegiance\r\n\r\n#### Item 31: 'Answerable To' [Authority] vs. 'Answerable For' [Action]\r\n* **Principle:** An agent is *answerable* **to** a superior authority or governing body (hierarchy); that same agent is *answerable* **for** an outcome, misconduct, or duty (responsibility).\r\n* **Formula:** `Subject + be + answerable + to + [Authority] + for + [Actions / Decisions]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The executive directors are answerable for the shareholders to the insolvency.*\r\n  * ✔️ *The executive directors are **answerable to the shareholders for the insolvency**.*\r\n\r\n---\r\n\r\n#### Item 32: 'Liable For' [Damages] vs. 'Liable To' [Consequence/Action]\r\n* **Principle:** One is *liable* **for** a financial debt, legal damages, or restitution; one is *liable* **to** a penalty, fine, disease, or error (prone to experiencing an undesirable outcome).\r\n* **Formula:**\r\n  * `Subject + be + liable + for + [Damages / Debts / Costs]`\r\n  * `Subject + be + liable + to + [Penalty / Fine / Sickness / Misinterpretation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The shipping conglomerate was held legally liable to the environmental cleanup costs.*\r\n  * ✔️ *The shipping conglomerate was held legally **liable for** the environmental cleanup costs.*\r\n  * ✔️ *Transgressors are **liable to** a summary fine.*\r\n\r\n---\r\n\r\n#### Item 33: 'Incumbent On / Upon' (Binding Duty)\r\n* **Principle:** When an ethical, constitutional, or professional duty is mandatory for an agent, it is *incumbent* **on** or **upon** them; using *for* or *over* is incorrect.\r\n* **Formula:** `It + is + incumbent + on / upon + [Agent] + to-Infinitive`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *It is incumbent for every magistrate to uphold the integrity of the bench.*\r\n  * ✔️ *It is **incumbent on** every magistrate to uphold the integrity of the bench.*\r\n\r\n---\r\n\r\n#### Item 34: 'Devoted To' (+ Gerund / Noun)\r\n* **Principle:** The participle/adjective *devoted* takes the preposition **to**; because *to* is a true preposition here, any ensuing verbal complement must be a gerund (*V-ing*), not a base infinitive.\r\n* **Formula:** `Subject + be + devoted + to + [Noun Phrase / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foundation is devoted to preserve ancient architectural monuments.*\r\n  * ✔️ *The foundation is devoted to **preserving** ancient architectural monuments.*\r\n  * ❌ *He was devoted toward his research.*\r\n  * ✔️ *He was **devoted to** his research.*\r\n\r\n---\r\n\r\n#### Item 35: 'Allegiance To' (Fealty and Loyalty)\r\n* **Principle:** The noun *allegiance* governs the preposition **to**; pairing it with *with* or *towards* is ungrammatical.\r\n* **Formula:** `Subject + swear / pledge / owe + allegiance + to + [Sovereign / Constitution / State]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The officers pledged unconditional allegiance with the newly formed republic.*\r\n  * ✔️ *The officers pledged unconditional **allegiance to** the newly formed republic.*\r\n\r\n---\r\n\r\n### Category H: Compatibility, Harmony & Discord\r\n\r\n#### Item 36: 'Derogatory To' (Disparagement of Status)\r\n* **Principle:** The adjective *derogatory* (detracting from or disparaging dignity, authority, or reputation) governs **to** in formal prescriptive English; using *of* or *for* is an error.\r\n* **Formula:** `Subject + be + derogatory + to + [Dignity / Honor / Authority]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Such unverified accusations are derogatory of the high office of the chancellor.*\r\n  * ✔️ *Such unverified accusations are **derogatory to** the high office of the chancellor.*\r\n\r\n---\r\n\r\n#### Item 37: 'Compatible With' (Mutual Consistency)\r\n* **Principle:** The adjective *compatible* mandates **with**; substituting *to* is an erroneous intrusion from *similar to* or *adapted to*.\r\n* **Formula:** `Subject A + be + compatible + with + Subject B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Autocratic censorship is not compatible to the principles of open democracy.*\r\n  * ✔️ *Autocratic censorship is not **compatible with** the principles of open democracy.*\r\n\r\n---\r\n\r\n#### Item 38: 'At Variance With' (State of Conflict)\r\n* **Principle:** The idiomatic phrase *at variance* (meaning in sharp disagreement or contradiction) strictly takes **with**, never *from* or *against*.\r\n* **Formula:** `Subject A + be + at variance + with + Subject B / [Document / Policy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The minister's private testimony was at variance from his public declarations.*\r\n  * ✔️ *The minister's private testimony was **at variance with** his public declarations.*\r\n\r\n---\r\n\r\n#### Item 39: 'Repugnant To' (Fundamental Incompatibility)\r\n* **Principle:** The formal adjective *repugnant* (extremely distasteful, or completely contradictory and incompatible in law) governs the preposition **to**, not *with* or *from*.\r\n* **Formula:** `Subject + be + repugnant + to + [Reason / Justice / Conscience / Law]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Arbitrary detention without trial is repugnant with the rule of law.*\r\n  * ✔️ *Arbitrary detention without trial is **repugnant to** the rule of law.*\r\n\r\n---\r\n\r\n#### Item 40: 'Conform To' [Standards] vs. 'Conform With' [Views]\r\n* **Principle:** One *conforms* **to** rules, regulations, patterns, or specifications (compliance with an objective standard); one *conforms* **with** subjective opinions, desires, or traits (being in agreement).\r\n* **Formula:**\r\n  * `Subject + conform + to + [Specifications / Rules / Customs]`\r\n  * `Subject + conform + with + [Views / Desires / Intentions]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The structural engineering must conform with all local seismic building codes.*\r\n  * ✔️ *The structural engineering must **conform to** all local seismic building codes.*\r\n  * ✔️ *His findings **conformed with** the hypotheses of his predecessors.*\r\n\r\n---\r\n\r\n### Category I: Judicial Indictment, Absolution & Deprivation\r\n\r\n#### Item 41: 'Acquit Of' (Judicial Exoneration)\r\n* **Principle:** The verb *acquit* governs the direct nominal object followed strictly by the preposition **of**; substituting *from* is an erroneous literalism.\r\n* **Formula:** `Court / Jury + acquit + Accused + of + [Crime / Charge / Treason]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The appellate tribunal acquitted the general from all charges of treason.*\r\n  * ✔️ *The appellate tribunal acquitted the general **of** all charges of treason.*\r\n\r\n---\r\n\r\n#### Item 42: 'Absolve From / Of' (Release from Guilt or Obligation)\r\n* **Principle:** One is *absolved* **from** a binding duty, contract, or oath (release from obligation); one is *absolved* **of** (or *from*) personal guilt, sin, or blame.\r\n* **Formula:**\r\n  * `Subject + be + absolved + from + [Duty / Oath / Liability]`\r\n  * `Subject + be + absolved + of + [Guilt / Sin / Blame]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The armistice absolved the state of its treaty obligations.*\r\n  * ✔️ *The armistice absolved the state **from** its treaty obligations.*\r\n  * ✔️ *The priest **absolved him of his sins**.*\r\n\r\n---\r\n\r\n#### Item 43: 'Exonerate From' (Vindication from Blame)\r\n* **Principle:** The verb *exonerate* governs the preposition **from** (rarely *of*) when denoting formal absolution from blame, an accusation, or a crime.\r\n* **Formula:** `Subject + be + exonerated + from + [Blame / Accusation / Allegation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The internal investigative inquiry completely exonerated the pilot with the crash.*\r\n  * ✔️ *The internal investigative inquiry completely exonerated the pilot **from all blame for the crash**.*\r\n\r\n---\r\n\r\n#### Item 44: 'Indict For' (Formal Legal Arraignment)\r\n* **Principle:** A grand jury or state prosecutor *indicts* a defendant **for** a specific offense, crime, or misdemeanor; pairing it with *with* or *of* violates legal syntax.\r\n* **Formula:** `Grand Jury + indict + Defendant + for + [Crime / Fraud / Conspiracy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The chief financial officer was indicted with wire fraud and corporate embezzlement.*\r\n  * ✔️ *The chief financial officer was **indicted for** wire fraud and corporate embezzlement.*\r\n\r\n---\r\n\r\n#### Item 45: 'Divest Of' (Stripping of Power or Assets)\r\n* **Principle:** *Divest* is transitive and governs the object followed by **of** (meaning to deprive or strip someone of rank, power, clothing, or financial assets); using *from* is incorrect.\r\n* **Formula:** `Authority + divest + Subject + of + [Power / Assets / Authority / Rank]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The military tribunal divested the mutinous admiral from his rank and decorations.*\r\n  * ✔️ *The military tribunal divested the mutinous admiral **of** his rank and decorations.*\r\n\r\n---\r\n\r\n### Category J: Core Differential Verb & Adjective Collocations\r\n\r\n#### Item 46: 'Blind To' [Metaphorical] vs. 'Blind In' [Physical]\r\n* **Principle:** One is physically *blind* **in** one eye (or *with* blindness); one is figuratively or morally *blind* **to** defects, reality, or a child's faults.\r\n* **Formula:**\r\n  * *Physical Defect:* `Subject + be + blind + in + the left / right eye`\r\n  * *Moral / Mental Blindness:* `Subject + be + blind + to + [Faults / Reality / Danger]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The doting father was completely blind in his son’s reckless corruption.*\r\n  * ✔️ *The doting father was completely **blind to** his son’s reckless corruption.*\r\n  * ❌ *The veteran was blind of his left eye following the explosion.*\r\n  * ✔️ *The veteran was **blind in** his left eye following the explosion.*\r\n\r\n---\r\n\r\n#### Item 47: 'Compensate For' (Restitution for Loss)\r\n* **Principle:** The verb *compensate* takes a direct personal object without a preposition (*compensate someone*), but mandates the preposition **for** when linking the loss, injury, or service being redressed.\r\n* **Formula:** `Subject + compensate + [Person] + for + [Loss / Injury / Damage]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The insurer refused to compensate the homeowner against the flood damage.*\r\n  * ✔️ *The insurer refused to compensate the homeowner **for** the flood damage.*\r\n\r\n---\r\n\r\n#### Item 48: 'Confer On / Upon' [Honor] vs. 'Confer With' [Person]\r\n* **Principle:** An institution *confers* an award, title, or degree **on** or **upon** a recipient; an agent *confers* **with** a person (discusses/consults).\r\n* **Formula:**\r\n  * *Bestow Honor:* `Authority + confer + [Honor / Degree / Title] + on / upon + Recipient`\r\n  * *Deliberate / Consult:* `Subject + confer + with + [Colleague / Ally]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The university conferred an honorary doctorate with the foreign dignitary.*\r\n  * ✔️ *The university conferred an honorary doctorate **on** the foreign dignitary.*\r\n  * ✔️ *The prime minister **conferred with** his national security advisors.*\r\n\r\n---\r\n\r\n#### Item 49: 'Deal In' [Commerce] vs. 'Deal With' [Subject / Conduct]\r\n* **Principle:** An enterprise or merchant *deals* **in** commodities (trades or conducts commerce in goods); an agent *deals* **with** a person, problem, or subject (manages, handles, or treats).\r\n* **Formula:**\r\n  * *Commercial Trade:* `Subject + deal + in + [Commodity / Goods / Equities]`\r\n  * *Management / Subject:* `Subject + deal + with + [Problem / Individual / Theme]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *That multinational merchant bank deals with precious metals and rare currencies.*\r\n  * ✔️ *That multinational merchant bank **deals in** precious metals and rare currencies.*\r\n  * ❌ *The thesis deals in the socio-economic causes of the French Revolution.*\r\n  * ✔️ *The thesis **deals with** the socio-economic causes of the French Revolution.*\r\n\r\n---\r\n\r\n#### Item 50: 'Die Of' [Disease] vs. 'Die From' [Indirect Cause] vs. 'Die For' [Cause]\r\n* **Principle:**\r\n  1. *Die* **of** a specific illness, disease, starvation, thirst, or shame (internal or direct cause).\r\n  2. *Die* **from** an external injury, wound, overwork, poison, or exposure (indirect consequence).\r\n  3. *Die* **for** a noble principle, nation, or martyr's cause (sacrificial devotion).\r\n* **Formula:**\r\n  * `Subject + die + of + [Cholera / Cancer / Starvation / Thirst]`\r\n  * `Subject + die + from + [A wound / Exhaustion / Snakebite / Overwork]`\r\n  * `Subject + die + for + [One's Country / Freedom / Faith]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The medieval villagers died from the bubonic plague by the thousands.*\r\n  * ✔️ *The medieval villagers **died of** the bubonic plague by the thousands.*\r\n  * ❌ *The courier died of loss of blood after the ambush.*\r\n  * ✔️ *The courier **died from** loss of blood after the ambush.*\r\n  * ✔️ *The patriot was proud to **die for** his country.*\r\n# Module 12: Fixed Prepositions & Prepositional Collocations\r\n**Curated Selection:** Items 51 to 75 of 200 Core Collocations  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category K: Encroachment, Interference & Imposition\r\n\r\n#### Item 51: 'Encroach On / Upon' (Territorial or Rights Incursion)\r\n* **Principle:** The verb *encroach* takes the preposition **on** or **upon** when expressing gradual intrusion into another's territory, rights, or jurisdiction; using *into* or *to* is ungrammatical.\r\n* **Formula:** `Subject + encroach + on / upon + [Territory / Sovereignty / Rights]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The executive decree encroached into the constitutional domain of the legislature.*\r\n  * ✔️ *The executive decree **encroached on** the constitutional domain of the legislature.*\r\n\r\n---\r\n\r\n#### Item 52: 'Infringe On / Upon' (Violation of Rights or Patents)\r\n* **Principle:** When used intransitively, *infringe* governs **on** or **upon** to denote trespass on a patent, copyright, or personal liberty. (Note: *infringe* can also be directly transitive without a preposition: *infringe a law*).\r\n* **Formula:** `Subject + infringe + on / upon + [Patent / Liberty / Copyright]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The surveillance apparatus infringes to the fundamental right to privacy.*\r\n  * ✔️ *The surveillance apparatus **infringes on** the fundamental right to privacy.*\r\n  * ✔️ *The corporation **infringed the copyright**.* [Direct Transitive]\r\n\r\n---\r\n\r\n#### Item 53: 'Meddle In' [Affairs] vs. 'Meddle With' [Mechanisms/Objects]\r\n* **Principle:** One *meddles* **in** other people’s private affairs, politics, or internal disputes (unwarranted social interference); one *meddles* **with** physical machinery, documents, or legal evidence (illicit tampering or altering).\r\n* **Formula:**\r\n  * `Subject + meddle + in + [Affairs / Politics / Disputes]`\r\n  * `Subject + meddle + with + [Machinery / Evidence / Locks / Wiring]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Foreign intelligence agencies attempted to meddle with the democratic election.*\r\n  * ✔️ *Foreign intelligence agencies attempted to **meddle in** the democratic election.*\r\n  * ❌ *The saboteur meddled in the aircraft's emergency hydraulics.*\r\n  * ✔️ *The saboteur **meddled with** the aircraft's emergency hydraulics.*\r\n\r\n---\r\n\r\n#### Item 54: 'Impose On / Upon' (Inflicting Burden or Presuming)\r\n* **Principle:** *Impose* takes **on** or **upon** both when placing a tax, penalty, or burden upon a populace, and when taking unfair advantage of someone's hospitality (*impose on a friend*); it never takes *over*.\r\n* **Formula:** `Authority + impose + [Tax / Tariff / Will] + on / upon + [Citizens / Subjects]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The central bank imposed severe restrictions over retail lending.*\r\n  * ✔️ *The central bank imposed severe restrictions **on** retail lending.*\r\n\r\n---\r\n\r\n#### Item 55: 'Intrude On / Upon' [Privacy] vs. 'Intrude Into' [Space]\r\n* **Principle:** An agent *intrudes* **on** or **upon** intangible domains such as privacy, grief, or personal solitude; an agent *intrudes* **into** a concrete physical room, chamber, or territory without invitation.\r\n* **Formula:**\r\n  * `Subject + intrude + on / upon + [Privacy / Grief / Solitude]`\r\n  * `Subject + intrude + into + [Chamber / Sanctuary / Territory]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The journalists intruded into the family’s private grief.*\r\n  * ✔️ *The journalists **intruded on** the family’s private grief.*\r\n  * ✔️ *The trespasser **intruded into** the sovereign's private chambers.*\r\n\r\n---\r\n\r\n### Category L: Longing, Yearning, Striving & Ambition\r\n\r\n#### Item 56: 'Aspire To' (Aiming for High Rank or Ideals)\r\n* **Principle:** The verb *aspire* governs **to** when indicating ambition directed toward a status, goal, or ideal; pairing it with *for* or *after* violates formal collocation.\r\n* **Formula:** `Subject + aspire + to + [High Office / Excellence / Leadership]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The young diplomat aspired for the office of Secretary-General.*\r\n  * ✔️ *The young diplomat **aspired to** the office of Secretary-General.*\r\n\r\n---\r\n\r\n#### Item 57: 'Crave For' [Noun] vs. Transitive 'Crave'\r\n* **Principle:** When followed by a prepositional object, *crave* requires **for** (*crave for recognition*); however, *crave* is frequently used as a direct transitive verb without any preposition (*crave recognition*). Pairing it with *to* or *after* is incorrect.\r\n* **Formula:**\r\n  * `Subject + crave + for + [Noun Phrase]`\r\n  * `Subject + crave + [Direct Object]  (No preposition)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The deposed monarch craved after political vengeance.*\r\n  * ✔️ *The deposed monarch **craved for** political vengeance.*\r\n  * ✔️ *The prisoner **craved mercy**.* [Transitive]\r\n\r\n---\r\n\r\n#### Item 58: 'Yearn For / After' (Intense Nostalgic Longing)\r\n* **Principle:** *Yearn* governs **for** (or **after**) when expressing a deep, tender, or painful longing for home, peace, or a lost companion; pairing it with *towards* is non-standard.\r\n* **Formula:** `Subject + yearn + for / after + [Home / Peace / Solace]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The exiled dissidents yearned towards their homeland.*\r\n  * ✔️ *The exiled dissidents **yearned for** their homeland.*\r\n\r\n---\r\n\r\n#### Item 59: 'Strive For' [Goal] vs. 'Strive With / Against' [Adversity]\r\n* **Principle:** An agent *strives* **for** an ideal, victory, or goal (ambition); an agent *strives* **against** an obstacle or tyranny (resistance); an agent *strives* **with** a competitor or peer (rivalry or mutual struggle).\r\n* **Formula:**\r\n  * `Subject + strive + for + [Excellence / Justice / Perfection]`\r\n  * `Subject + strive + against + [Oppression / Adversity / Injustice]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The reformist coalition strove against the achievement of constitutional parity.*  \r\n    *(Confuses the goal with the obstacle)*\r\n  * ✔️ *The reformist coalition **strove for** the achievement of constitutional parity.*\r\n  * ✔️ *They **strove against** institutional corruption.*\r\n\r\n---\r\n\r\n#### Item 60: 'Pine For' (Languishing with Desire)\r\n* **Principle:** The verb *pine* (to suffer a mental or physical decline through intense grief or unfulfilled desire) governs **for**, not *after* or *to*.\r\n* **Formula:** `Subject + pine + for + [Absence / Home / Lost companion]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The imprisoned rebel pined after freedom throughout his incarceration.*\r\n  * ✔️ *The imprisoned rebel **pined for** freedom throughout his incarceration.*\r\n\r\n---\r\n\r\n### Category M: Familiarity, Preponderance & Equivalence\r\n\r\n#### Item 61: 'Familiar With' [Knowledge] vs. 'Familiar To' [Recognition]\r\n* **Principle:** A person/agent is *familiar* **with** a subject, language, person, or technical dossier (possessing knowledge); a subject, voice, or face is *familiar* **to** a person (recognized by them).\r\n* **Formula:**\r\n  * `Person (Agent) + be + familiar + with + [Subject / System / Language]`\r\n  * `Entity (Stimulus) + be + familiar + to + Person (Experiencer)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The legal scholar is thoroughly familiar to maritime jurisprudence.*\r\n  * ✔️ *The legal scholar is thoroughly **familiar with** maritime jurisprudence.*\r\n  * ❌ *His face was familiar with every border agent.*\r\n  * ✔️ *His face was **familiar to** every border agent.*\r\n\r\n---\r\n\r\n#### Item 62: 'Prevail On / Upon' [Persuade] vs. 'Prevail Over' [Triumph]\r\n* **Principle:** One *prevails* **on** or **upon** an individual (persuades or successfully induces them to do something); one *prevails* **over** or **against** an enemy, adversary, or obstacle (conquers or triumphs).\r\n* **Formula:**\r\n  * *Persuasion:* `Subject + prevail + on / upon + [Person] + to-Infinitive`\r\n  * *Triumph:* `Subject + prevail + over / against + [Adversary / Darkness / Odds]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The prime minister prevailed over the reluctant envoy to accept the posting.*\r\n  * ✔️ *The prime minister **prevailed upon the reluctant envoy to accept** the posting.*\r\n  * ✔️ *Justice will ultimately **prevail over** tyranny.*\r\n\r\n---\r\n\r\n#### Item 63: 'Connive At' [Misconduct] vs. 'Connive With' [Accomplice]\r\n* **Principle:** An authority *connives* **at** an act of corruption, crime, or treason (secretly ignores or tacitly tolerates wrongdoing); an agent *connives* **with** another person (conspires or plots in secret).\r\n* **Formula:**\r\n  * `Authority + connive + at + [Corruption / Treason / Theft]`\r\n  * `Agent A + connive + with + Agent B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The port inspectors connived with the unlawful importation of contraband.*  \r\n    *(Grammatically implies the inspectors conspired with the cargo itself)*\r\n  * ✔️ *The port inspectors **connived at** the unlawful importation of contraband.*\r\n  * ✔️ *The corrupt mayor **connived with** the cartel bosses.*\r\n\r\n---\r\n\r\n#### Item 64: 'Indulge In' [Activity/Vice] vs. 'Indulge With' [Reward]\r\n* **Principle:** An agent *indulges* **in** a habit, vice, speculation, or luxury (partakes freely); an agent *indulges* oneself or someone else **with** a specific treat, gift, or delicacy.\r\n* **Formula:**\r\n  * `Subject + indulge + in + [Speculation / Gambling / Reverie]`\r\n  * `Subject + indulge + [Person / Oneself] + with + [Gift / Treat / Luxury]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The board members indulged with dangerous speculative trading.*\r\n  * ✔️ *The board members **indulged in** dangerous speculative trading.*\r\n  * ✔️ *The host **indulged his guests with** vintage wine.*\r\n\r\n---\r\n\r\n#### Item 65: 'Tantamount To' (Functional Equivalence)\r\n* **Principle:** The predicative adjective *tantamount* (equivalent in seriousness or effect) governs the preposition **to**; it strictly excludes *with* and *as*. Because *to* is a preposition, any following verb must be a gerund (*V-ing*).\r\n* **Formula:** `Subject + be + tantamount + to + [Noun Phrase / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Surrendering the sovereign border posts is tantamount with high treason.*\r\n  * ✔️ *Surrendering the sovereign border posts is **tantamount to** high treason.*\r\n  * ❌ *His prolonged silence was tantamount to admit culpability.*\r\n  * ✔️ *His prolonged silence was **tantamount to admitting** culpability.*\r\n\r\n---\r\n\r\n### Category N: Exclusion, Exemption, Prohibition & Restraint\r\n\r\n#### Item 66: 'Abstain From' vs. 'Refrain From'\r\n* **Principle:** *Abstain* governs **from** when deliberately renouncing a consumable substance (alcohol, meat) or a formal civic action (voting); *Refrain* governs **from** when holding back from a momentary, transient physical action or utterance. Both mandate a gerund (*V-ing*).\r\n* **Formula:**\r\n  * `Subject + abstain + from + [Alcohol / Voting / Meat / Gerund]`\r\n  * `Subject + refrain + from + [Interrupting / Commenting / Gerund]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Three permanent delegates abstained of voting on the resolution.*\r\n  * ✔️ *Three permanent delegates **abstained from voting** on the resolution.*\r\n  * ❌ *Please refrain to speak while the court is in session.*\r\n  * ✔️ *Please **refrain from speaking** while the court is in session.*\r\n\r\n---\r\n\r\n#### Item 67: 'Debar From' (Official Legal Prohibition)\r\n* **Principle:** The verb *debar* (to exclude officially or legally from a privilege, office, or contest) governs the preposition **from** followed by a gerund or noun phrase; it never takes *to*.\r\n* **Formula:** `Authority + debar + Person + from + [Gerund (V-ing) / Office / Contest]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The electoral tribunal debarred the politician to contest the elections.*\r\n  * ✔️ *The electoral tribunal **debarred the politician from contesting** the elections.*\r\n\r\n---\r\n\r\n#### Item 68: 'Deter From' (Prevention through Discouragement)\r\n* **Principle:** *Deter* requires a personal object followed by the preposition **from** and a gerund (*V-ing*); substituting *to* + infinitive is a standard diagnostic error.\r\n* **Formula:** `Subject + deter + Object + from + Gerund (V-ing)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The severe penalties failed to deter rogue firms to pollute the estuary.*\r\n  * ✔️ *The severe penalties failed to **deter rogue firms from polluting** the estuary.*\r\n\r\n---\r\n\r\n#### Item 69: 'Desist From' (Voluntary Cessation)\r\n* **Principle:** The intransitive verb *desist* (to cease or discontinue an action) governs **from** and mandates a gerund complement; using *of* or *to* is incorrect.\r\n* **Formula:** `Subject + desist + from + [Hostilities / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The commander ordered the artillery units to desist of firing.*\r\n  * ✔️ *The commander ordered the artillery units to **desist from firing**.*\r\n\r\n---\r\n\r\n#### Item 70: 'Exempt From' (Immunity from Obligation)\r\n* **Principle:** The verb or adjective *exempt* requires the preposition **from** when freeing someone from a liability, military service, examination, or tax; it never takes *of*.\r\n* **Formula:** `Subject + be + exempt + from + [Taxation / Duty / Military Service]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Non-profit charitable foundations are exempt of federal revenue tariffs.*\r\n  * ✔️ *Non-profit charitable foundations are **exempt from** federal revenue tariffs.*\r\n\r\n---\r\n\r\n### Category O: Person vs. Matter / Differential Cognitive Verbs\r\n\r\n#### Item 71: 'Differ With' [Person] vs. 'Differ From' [Entity/Quality]\r\n* **Principle:** One *differs* **with** a person regarding an opinion, doctrine, or policy (holding contrary viewpoints); an entity *differs* **from** another entity in size, character, or appearance (being dissimilar).\r\n* **Formula:**\r\n  * *Disagreement:* `Person A + differ + with + Person B + [on / about / over + Matter]`\r\n  * *Dissimilarity:* `Entity A + differ + from + Entity B + [in + Trait]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The chief architect differed from the lead engineer over structural integrity.*\r\n  * ✔️ *The chief architect **differed with** the lead engineer over structural integrity.*\r\n  * ❌ *This constitutional model differs with all European precedents.*\r\n  * ✔️ *This constitutional model **differs from** all European precedents.*\r\n\r\n---\r\n\r\n#### Item 72: 'Remonstrate With' [Person] Against [Grievance]\r\n* **Principle:** The formal verb *remonstrate* (to make a forcefully reproachful protest) takes **with** the person addressed and **against** the measure, policy, or grievance being protested.\r\n* **Formula:** `Subject + remonstrate + with + [Person / Authority] + against + [Policy / Measure]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foreign minister remonstrated against the ambassador with the trade embargo.*  \r\n    *(Inverted prepositional distribution)*\r\n  * ✔️ *The foreign minister **remonstrated with the ambassador against the trade embargo**.*\r\n\r\n---\r\n\r\n#### Item 73: 'Reconcile To' [Fate] vs. 'Reconcile With' [Person/Ledger]\r\n* **Principle:** One *reconciles oneself* **to** an inevitable, unpleasant condition, hardship, or fate (resignation); one *reconciles* **with** an estranged colleague (restoring harmony) or *reconciles* one set of balance sheets **with** another (establishing consistency).\r\n* **Formula:**\r\n  * *Accept Fate:* `Subject + reconcile + oneself + to + [Defeat / Hardship / Fate]`\r\n  * *Restore Harmony / Match Data:* `Subject + reconcile + with + [Person / Figures]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defeated general could not reconcile himself with the loss of the province.*\r\n  * ✔️ *The defeated general could not **reconcile himself to** the loss of the province.*\r\n  * ✔️ *The diplomat finally **reconciled with** his former political rival.*\r\n  * ✔️ *The auditor **reconciled the bank statements with** the cash journal.*\r\n\r\n---\r\n\r\n#### Item 74: 'Expostulate With' [Person] On / About [Conduct]\r\n* **Principle:** *Expostulate* (to express strong disapproval or disagreement) governs **with** the individual being reasoned with, and **on** or **about** their erroneous conduct.\r\n* **Formula:** `Subject + expostulate + with + [Person] + on / about / regarding + [Conduct]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The magistrate expostulated against the delinquent officer for his negligence.*\r\n  * ✔️ *The magistrate **expostulated with the delinquent officer on his negligence**.*\r\n\r\n---\r\n\r\n#### Item 75: 'Impart To' (Bestowing Knowledge or Properties)\r\n* **Principle:** The transitive verb *impart* (to communicate knowledge, or bestow a physical quality like flavor or color) takes the direct object followed strictly by **to**; pairing it with *with* is an error.\r\n* **Formula:** `Subject + impart + [Knowledge / Wisdom / Flavor] + to + [Recipient / Substance]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The philosopher sought to impart his ethical doctrines with his disciples.*\r\n  * ✔️ *The philosopher sought to **impart his ethical doctrines to** his disciples.*\r\n# Module 12: Fixed Prepositions & Prepositional Collocations\r\n**Curated Selection:** Items 76 to 100 of 200 Core Collocations  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category P: Accusation, Culpability & Judicial Suspicion\r\n\r\n#### Item 76: 'Accused Of' vs. 'Charged With'\r\n* **Principle:** The verb or passive participle *accused* strictly takes the preposition **of**; conversely, *charged* mandates the preposition **with**. Cross-pairing these (*accused with* or *charged of*) is a standard diagnostic error.\r\n* **Formula:**\r\n  * `Subject + be + accused + of + [Crime / Malpractice]`\r\n  * `Subject + be + charged + with + [Crime / Treason / Felony]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The managing director was accused with fraudulent insider trading.*\r\n  * ✔️ *The managing director was **accused of** fraudulent insider trading.*\r\n  * ❌ *The defendant was charged of high treason against the realm.*\r\n  * ✔️ *The defendant was **charged with** high treason against the realm.*\r\n\r\n---\r\n\r\n#### Item 77: 'Complicity In' (Involvement in Wrongdoing)\r\n* **Principle:** The noun *complicity* (the state of being an accomplice in an unlawful act) governs **in**, never *with* or *of*.\r\n* **Formula:** `Subject + show / prove + complicity + in + [Conspiracy / Crime / Fraud]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The investigation exposed his complicity with the assassination plot.*\r\n  * ✔️ *The investigation exposed his **complicity in** the assassination plot.*\r\n\r\n---\r\n\r\n#### Item 78: 'Guilty Of' (Moral or Legal Culpability)\r\n* **Principle:** The adjective *guilty* takes the preposition **of** when identifying the specific transgression or offense; using *for* or *with* violates formal syntax.\r\n* **Formula:** `Subject + be + found / plead + guilty + of + [Crime / Misconduct]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The military tribunal found the sentry guilty for dereliction of duty.*\r\n  * ✔️ *The military tribunal found the sentry **guilty of** dereliction of duty.*\r\n\r\n---\r\n\r\n#### Item 79: 'Convicted Of' (Judicial Determination of Guilt)\r\n* **Principle:** *Convicted* governs the preposition **of** (identifying the crime); pairing it with *for* (often confused with *punished for*) is ungrammatical.\r\n* **Formula:** `Subject + be + convicted + of + [Felony / Perjury / Treason]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The rogue financier was convicted for grand larceny and wire fraud.*\r\n  * ✔️ *The rogue financier was **convicted of** grand larceny and wire fraud.*\r\n\r\n---\r\n\r\n#### Item 80: 'Suspicious Of' (Mistrustful Apprehension)\r\n* **Principle:** The adjective *suspicious* governs **of** when denoting distrust toward a person, action, or motive; it never takes *about* or *with* in standard formal usage.\r\n* **Formula:** `Subject + be + suspicious + of + [Motive / Person / Activity]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The counter-intelligence bureau was suspicious about the diplomat's movements.*\r\n  * ✔️ *The counter-intelligence bureau was **suspicious of** the diplomat's movements.*\r\n\r\n---\r\n\r\n### Category Q: Aptitude, Harm & Distinctive Quality\r\n\r\n#### Item 81: 'Eligible For' [Noun] vs. 'Eligible To' [Infinitive]\r\n* **Principle:** *Eligible* takes **for** before a noun phrase denoting an office, prize, or benefit; it governs a full to-infinitive (**to + V1**) when expressing the action authorized.\r\n* **Formula:**\r\n  * `Subject + be + eligible + for + [Promotion / Pension / Grant / Post]`\r\n  * `Subject + be + eligible + to-Infinitive [vote / contest / apply]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Only tenured faculty members are eligible to the research fellowship.*\r\n  * ✔️ *Only tenured faculty members are **eligible for** the research fellowship.*\r\n  * ✔️ *Naturalized citizens are **eligible to vote** in federal elections.*\r\n\r\n---\r\n\r\n#### Item 82: 'Equipped With' (Outfitted with Resources)\r\n* **Principle:** The participle or verb *equipped* mandates the preposition **with**; substituting *of* or *by* is non-standard.\r\n* **Formula:** `Subject + be + equipped + with + [Instruments / Defenses / Gear]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The deep-sea submersible was equipped of advanced sonar arrays.*\r\n  * ✔️ *The deep-sea submersible was **equipped with** advanced sonar arrays.*\r\n\r\n---\r\n\r\n#### Item 83: 'Disqualified From' (+ Gerund / Noun)\r\n* **Principle:** The verb *disqualify* requires the preposition **from** followed by a gerund (*V-ing*) or a noun phrase; pairing it with an infinitive (*to + V1*) or *for* is an error.\r\n* **Formula:** `Authority + disqualify + Subject + from + [Gerund (V-ing) / Contest]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The commission disqualified the athlete to participate in the trials.*\r\n  * ✔️ *The commission disqualified the athlete **from participating** in the trials.*\r\n\r\n---\r\n\r\n#### Item 84: 'Detrimental To' (Causative Harm)\r\n* **Principle:** The formal adjective *detrimental* (tending to cause harm or damage) takes the preposition **to**; using *for* is a common colloquial error.\r\n* **Formula:** `Subject + be + detrimental + to + [Health / Security / Progress]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Unilateral currency devaluation is detrimental for domestic manufacturing.*\r\n  * ✔️ *Unilateral currency devaluation is **detrimental to** domestic manufacturing.*\r\n\r\n---\r\n\r\n#### Item 85: 'Peculiar To' (Exclusive Characteristic)\r\n* **Principle:** When *peculiar* means distinctive, unique, or belonging exclusively to a specific class, region, or species, it governs **to**; it never takes *with* or *for*.\r\n* **Formula:** `Trait / Custom + be + peculiar + to + [Species / Region / Culture]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *This architectural motif is peculiar with the Byzantine period.*\r\n  * ✔️ *This architectural motif is **peculiar to** the Byzantine period.*\r\n\r\n---\r\n\r\n### Category R: Alignment, Collusion & Estrangement\r\n\r\n#### Item 86: 'Alien To' (Incompatible with Nature or Principles)\r\n* **Principle:** When meaning foreign, incongruous, or contrary to one's character, nature, or values, *alien* governs the preposition **to**, not *from*.\r\n* **Formula:** `Trait / Concept + be + alien + to + [Nature / Character / Principles]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Deception and administrative duplicity were alien from his moral code.*\r\n  * ✔️ *Deception and administrative duplicity were **alien to** his moral code.*\r\n\r\n---\r\n\r\n#### Item 87: 'Allied With' [Entity] vs. 'Allied To' [Concept]\r\n* **Principle:** A nation, political faction, or belligerent is *allied* **with** another partner or sovereign state (coalition); a quality, discipline, or phenomenon is *allied* **to** a related concept (close resemblance or kinship).\r\n* **Formula:**\r\n  * `State A + be + allied + with + State B`\r\n  * `Discipline A + be + allied + to + Discipline B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The monarch was allied to the northern duchies during the civil war.*\r\n  * ✔️ *The monarch was **allied with** the northern duchies during the civil war.*\r\n  * ✔️ *Linguistics is closely **allied to** cognitive psychology.*\r\n\r\n---\r\n\r\n#### Item 88: 'Collude With' [Person] In [Action]\r\n* **Principle:** *Collude* takes **with** before the conspirator or accomplice, and **in** before the corrupt or illegal activity.\r\n* **Formula:** `Agent A + collude + with + Agent B + in + [Fraud / Crime / Conspiracy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The regional governor colluded to the cartel bosses in extortion.*\r\n  * ✔️ *The regional governor **colluded with the cartel bosses in extortion**.*\r\n\r\n---\r\n\r\n#### Item 89: 'Estranged From' (Severing of Ties)\r\n* **Principle:** The adjective or participle *estranged* (alienated or separated in affection or communication) takes **from**; using *with* or *to* is incorrect.\r\n* **Formula:** `Subject + be + estranged + from + [Family / Allies / Associates]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defecting diplomat remained estranged with his former colleagues.*\r\n  * ✔️ *The defecting diplomat remained **estranged from** his former colleagues.*\r\n\r\n---\r\n\r\n#### Item 90: 'Coincide With' (Simultaneous Occurrence or Agreement)\r\n* **Principle:** The verb *coincide* takes the preposition **with** both temporally (occurring at the same time) and conceptually (agreeing in opinion); it never takes *to*.\r\n* **Formula:** `Event / View A + coincide + with + Event / View B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The state visit was planned to coincide to the national holiday.*\r\n  * ✔️ *The state visit was planned to **coincide with** the national holiday.*\r\n\r\n---\r\n\r\n### Category S: Cognitive Focus, Absorption & Reflection\r\n\r\n#### Item 91: 'Absorbed In' (Deep Preoccupation)\r\n* **Principle:** When meaning fully engaged, deeply engrossed, or immersed in thought, work, or study, *absorbed* governs **in**; substituting *with* or *at* is an error.\r\n* **Formula:** `Subject + be + absorbed + in + [Study / Thought / Contemplation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The chief cryptographer was completely absorbed with the cipher.*\r\n  * ✔️ *The chief cryptographer was completely **absorbed in** the cipher.*\r\n\r\n---\r\n\r\n#### Item 92: 'Brood Over / On' (Morbid Rumination)\r\n* **Principle:** The verb *brood* (to dwell unhappily on something) takes the preposition **over** or **on**; pairing it with *about* is non-standard in formal prose.\r\n* **Formula:** `Subject + brood + over / on + [Misfortunes / Insults / Failures]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *It is counterproductive to brood about past diplomatic failures.*\r\n  * ✔️ *It is counterproductive to **brood over** past diplomatic failures.*\r\n\r\n---\r\n\r\n#### Item 93: 'Ponder On / Over' vs. Transitive 'Ponder'\r\n* **Principle:** When used intransitively, *ponder* governs **on** or **over**; however, it frequently acts as a direct transitive verb without any preposition (*ponder the question*). It strictly excludes *about*.\r\n* **Formula:**\r\n  * `Subject + ponder + on / over + [Dilemma / Situation]`\r\n  * `Subject + ponder + [Direct Object]  (No preposition)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The council convened to ponder about the socioeconomic crisis.*\r\n  * ✔️ *The council convened to **ponder over** the socioeconomic crisis.*\r\n  * ✔️ *The council convened to **ponder the socioeconomic crisis**.* [Transitive]\r\n\r\n---\r\n\r\n#### Item 94: 'Muse On / Upon' (Reflective Meditation)\r\n* **Principle:** *Muse* (to be absorbed in deep contemplation or meditation) governs **on** or **upon**; pairing it with *at* or *to* is incorrect.\r\n* **Formula:** `Subject + muse + on / upon + [Memories / Past / Philosophy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The retired statesman mused at the turbulent events of his youth.*\r\n  * ✔️ *The retired statesman **mused on** the turbulent events of his youth.*\r\n\r\n---\r\n\r\n#### Item 95: 'Ruminate On / Over' (Prolonged Deliberation)\r\n* **Principle:** The verb *ruminate* (to chew over mentally or turn over repeatedly in the mind) takes **on** or **over**, never *about*.\r\n* **Formula:** `Subject + ruminate + on / over + [Decision / Policy / Past]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The committee ruminated about the proposed constitutional amendments.*\r\n  * ✔️ *The committee **ruminated on** the proposed constitutional amendments.*\r\n\r\n---\r\n\r\n### Category T: Differential Verb & Interaction Collocations\r\n\r\n#### Item 96: 'Inquire Of' [Person] vs. 'Inquire Into' [Issue] vs. 'Inquire After' [Health]\r\n* **Principle:**\r\n  1. *Inquire* **of** a person (ask a question of them).\r\n  2. *Inquire* **into** a matter, incident, or crime (investigate).\r\n  3. *Inquire* **after** a person's health, well-being, or state.\r\n* **Formula:**\r\n  * `Subject + inquire + of + [Person] + about + [Matter]`\r\n  * `Subject + inquire + into + [Scandal / Allegation / Murder]`\r\n  * `Subject + inquire + after + [Person's Health / Welfare]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *A judicial commission was appointed to inquire about the riots.*\r\n  * ✔️ *A judicial commission was appointed to **inquire into** the riots.* [Investigate]\r\n  * ❌ *The ambassador inquired of my mother's health.*\r\n  * ✔️ *The ambassador **inquired after** my mother's health.*\r\n\r\n---\r\n\r\n#### Item 97: 'Wait On / Upon' [Serve] vs. 'Wait For' [Await]\r\n* **Principle:** *Wait* **on** or **upon** means to serve, attend to the needs of, or pay formal court to an individual; *Wait* **for** means to anticipate or await the arrival or occurrence of something.\r\n* **Formula:**\r\n  * `Subject + wait + on / upon + [Sovereign / Guest / Patient]  (Serve)`\r\n  * `Subject + wait + for + [Train / Arrival / Verdict]  (Await)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Two liveried stewards were commanded to wait for the visiting emperor.*  \r\n    *(Grammatically implies they sat awaiting his arrival rather than serving him)*\r\n  * ✔️ *Two liveried stewards were commanded to **wait on the visiting emperor**.*\r\n  * ✔️ *The defense counsel **waited for the jury's verdict**.*\r\n\r\n---\r\n\r\n#### Item 98: 'Tired Of' [Weariness/Disgust] vs. 'Tired With' [Physical Exhaustion]\r\n* **Principle:** One is *tired* **of** a repeated nuisance, delay, excuse, or routine (mental satiation, impatience, or boredom); one is *tired* **with** (or *from*) arduous manual labor, a long journey, or physical exertion (physical fatigue).\r\n* **Formula:**\r\n  * *Boredom / Disgust:* `Subject + be + tired + of + [Excuses / Hypocrisy / Waiting]`\r\n  * *Physical Fatigue:* `Subject + be + tired + with / from + [Exertion / The march]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The electorate is completely tired with empty political manifestos.*\r\n  * ✔️ *The electorate is completely **tired of** empty political manifestos.*\r\n  * ✔️ *The couriers were **tired with the forced march** across the mountains.*\r\n\r\n---\r\n\r\n#### Item 99: 'Look To' (Relying upon for Direction or Aid)\r\n* **Principle:** When *look* means to turn to someone for guidance, expect assistance, or depend upon an entity, it governs the preposition **to**; pairing it with *towards* distorts the idiomatic dependency.\r\n* **Formula:** `Subject + look + to + [Person / Institution] + for + [Guidance / Succor]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Developing economies look towards international lending agencies for relief.*\r\n  * ✔️ *Developing economies **look to** international lending agencies for relief.*\r\n\r\n---\r\n\r\n#### Item 100: 'Correspond With' [Person] vs. 'Correspond To' [Counterpart/Match]\r\n* **Principle:** One *corresponds* **with** a correspondent (communicates via letters or messages); an item, record, or datum *corresponds* **to** (or *with*) a counterpart, standard, or parallel entity (matches, agrees, or conforms).\r\n* **Formula:**\r\n  * *Communication:* `Person A + correspond + with + Person B`\r\n  * *Equivalence / Match:* `Entity A + correspond + to + Entity B  (Equal / Analogous)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foreign minister corresponded to the dissident through encrypted channels.*\r\n  * ✔️ *The foreign minister **corresponded with** the dissident through encrypted channels.*\r\n  * ❌ *The serial numbers on the chassis do not correspond with the registry.*\r\n  * ✔️ *The serial numbers on the chassis do not **correspond to** the registry.*\r\n# Module 12: Fixed Prepositions & Prepositional Collocations\r\n**Curated Selection:** Items 101 to 125 of 200 Core Collocations  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category U: Expiation, Retribution & Penalties\r\n\r\n#### Item 101: 'Atone For' (Reparation for Wrongdoing)\r\n* **Principle:** The intransitive verb *atone* (to make amends or reparation for an offense, crime, or deficiency) obligatorily governs the preposition **for**; using *to* or *from* is ungrammatical.\r\n* **Formula:** `Subject + atone + for + [Sin / Crime / Negligence / Error]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The traitor sought to atone to his acts of betrayal against the realm.*\r\n  * ✔️ *The traitor sought to **atone for his acts of betrayal** against the realm.*\r\n\r\n---\r\n\r\n#### Item 102: 'Revenge Oneself On' [Person] For [Injury] vs. Transitive 'Avenge'\r\n* **Principle:** *Revenge* is typically reflexive and governs **on** or **upon** the person targeted and **for** the wrong suffered; *Avenge* is direct and transitive without a preposition (*avenge an injury / avenge a father*).\r\n* **Formula:**\r\n  * `Subject + revenge + oneself + on / upon + [Enemy] + for + [Injury]`\r\n  * `Subject + avenge + [Murder / Defeat / Person]  (Direct Transitive)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The warlord vowed to revenge his brother's execution.*\r\n  * ✔️ *The warlord vowed to **avenge his brother's execution**.*\r\n  * ✔️ *The prince resolved to **revenge himself on the conspirators for the coup**.*\r\n\r\n---\r\n\r\n#### Item 103: 'Mulct Of' (Depriving of Money by Fine or Fraud)\r\n* **Principle:** The archaic or legalistic verb *mulct* (to extract money from someone by fine, forfeiture, or fraudulent deception) governs the direct victim followed by the preposition **of**; pairing it with *from* is non-standard.\r\n* **Formula:** `Authority / Swindler + mulct + Victim + of + [Money / Property / Estate]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The predatory syndicate mulcted the investors from their retirement savings.*\r\n  * ✔️ *The predatory syndicate **mulcted the investors of** their retirement savings.*\r\n\r\n---\r\n\r\n#### Item 104: 'Penalize For' (Imposing Sanctions)\r\n* **Principle:** The transitive verb *penalize* governs the recipient/agent followed by **for** to mark the violation or infraction; using *with* or *to* violates standard collocation.\r\n* **Formula:** `Authority + penalize + Agent + for + [Infraction / Delay / Misconduct]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The regulatory commission penalized the firm with breaching emissions caps.*\r\n  * ✔️ *The regulatory commission **penalized the firm for breaching** emissions caps.*\r\n\r\n---\r\n\r\n#### Item 105: 'Retaliate Against' [Person] vs. 'Retaliate With' [Means]\r\n* **Principle:** A belligerent *retaliates* **against** an enemy, adversary, or state (direction of reaction); the belligerent *retaliates* **with** or **by** an attack, strike, or countermeasure (instrument).\r\n* **Formula:** `Subject + retaliate + against + [Aggressor] + with / by + [Counter-measure]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The allied forces retaliated to the insurgent stronghold with artillery strikes.*\r\n  * ✔️ *The allied forces **retaliated against the insurgent stronghold with** artillery strikes.*\r\n\r\n---\r\n\r\n### Category V: Origin, Descent, Emanation & Derivation\r\n\r\n#### Item 106: 'Originate In' [Medium/Place] vs. 'Originate With' [Initiator]\r\n* **Principle:** A phenomenon, rumor, or custom *originates* **in** a geographic location, period, or physical medium; a proposal, invention, or idea *originates* **with** an individual, pioneer, or governing council.\r\n* **Formula:**\r\n  * *Place / Medium:* `Subject + originate + in + [City / Century / Culture]`\r\n  * *Author / Source:* `Concept + originate + with + [Pioneer / Person / Council]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The theoretical model originated with the laboratories of Cambridge.*\r\n  * ✔️ *The theoretical model **originated in the laboratories** of Cambridge.*\r\n  * ✔️ *The revolutionary legislative proposal **originated with the prime minister**.*\r\n\r\n---\r\n\r\n#### Item 107: 'Emanate From' (Outflowing from a Central Source)\r\n* **Principle:** The verb *emanate* (to issue or spread outward from a source) takes **from**; using *of* or *out of* is an error.\r\n* **Formula:** `Radiation / Authority / Sound + emanate + from + [Source / Center]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Absolute sovereign authority emanates of the fundamental constitution.*\r\n  * ✔️ *Absolute sovereign authority **emanates from the fundamental constitution**.*\r\n\r\n---\r\n\r\n#### Item 108: 'Born Of' [Parents] vs. 'Born In' [Location/Condition]\r\n* **Principle:** One is *born* **of** specific parents (or *born of* a certain stock, lineage, or philosophy); one is *born* **in** a geographic town/nation, or into an socioeconomic state (*born in poverty / born in wedlock*).\r\n* **Formula:**\r\n  * `Subject + be + born + of + [Parents / Noble Lineage]`\r\n  * `Subject + be + born + in + [City / Poverty / Wedlock]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The revolutionary hero was born from aristocratic parents.*\r\n  * ✔️ *The revolutionary hero was **born of aristocratic parents**.*\r\n  * ✔️ *He was **born in a remote frontier province**.*\r\n\r\n---\r\n\r\n#### Item 109: 'Descended From' (Genealogical Lineage)\r\n* **Principle:** The adjective or participle *descended* takes **from** to mark genealogical ancestry; substituting *of* (often confused with *born of*) is non-standard.\r\n* **Formula:** `Subject + be + descended + from + [Ancestor / Lineage / Dynasty]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The reigning monarch claims to be descended of the ancient warlords.*\r\n  * ✔️ *The reigning monarch claims to be **descended from the ancient warlords**.*\r\n\r\n---\r\n\r\n#### Item 110: 'Stem From' (Causal Root Derivation)\r\n* **Principle:** The phrasal/prepositional verb *stem from* (to originate or have as an underlying cause) obligatorily takes **from**; pairing it with *out of* or *off* is ungrammatical.\r\n* **Formula:** `Consequence / Crisis + stem + from + [Root Cause / Deficiency]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sudden banking insolvency stemmed out of reckless derivative exposure.*\r\n  * ✔️ *The sudden banking insolvency **stemmed from reckless derivative exposure**.*\r\n\r\n---\r\n\r\n### Category W: Trust, Reliance & Cognitive Presumption\r\n\r\n#### Item 111: 'Confide In' [Trust Fully] vs. 'Confide To' [Entrust Secrets]\r\n* **Principle:** One *confides* **in** a trusted friend or confidant (places faith and trust); one *confides* a secret, task, or information **to** an individual (imparts or entrusts).\r\n* **Formula:**\r\n  * *Trust:* `Subject + confide + in + [Person / Associate]`\r\n  * *Entrust Secrets:* `Subject + confide + [Secret / Mission] + to + [Person]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The prime minister confides his deepest anxieties with his chief advisor.*\r\n  * ✔️ *The prime minister **confides in his chief advisor**.*\r\n  * ✔️ *The prime minister **confided the classified plans to his foreign minister**.*\r\n\r\n---\r\n\r\n#### Item 112: 'Reckon With' [Obstacle] vs. 'Reckon On' [Expectation]\r\n* **Principle:** To *reckon* **with** means to confront, take into account, or deal with a formidable power or difficulty; to *reckon* **on** (or *upon*) means to rely on, depend upon, or expect an outcome.\r\n* **Formula:**\r\n  * *Confront / Account for:* `Subject + reckon + with + [Adversary / Consequence]`\r\n  * *Rely upon / Anticipate:* `Subject + reckon + on / upon + [Support / Outcome]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The invading division did not reckon on the harsh sub-zero winter.*\r\n  * ✔️ *The invading division did not **reckon with the harsh sub-zero winter**.*\r\n  * ✔️ *We **reckoned on your continued financial backing** for the expedition.*\r\n\r\n---\r\n\r\n#### Item 113: 'Bank On / Count On' (Unconditional Reliance)\r\n* **Principle:** *Bank* and *count* govern **on** or **upon** when denoting reliance on a future contingency; substituting *with* or *at* is a colloquial error.\r\n* **Formula:** `Subject + bank / count + on / upon + [Contingency / Assistance]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The treasury cannot bank with an immediate rebound in tax revenues.*\r\n  * ✔️ *The treasury cannot **bank on an immediate rebound** in tax revenues.*\r\n\r\n---\r\n\r\n#### Item 114: 'Repose In' [Trust] vs. 'Repose On / Upon' [Physical Rest]\r\n* **Principle:** One *reposes* (places or vests) trust, confidence, or faith **in** an institution or leader; an object or body *reposes* (rests or reclines) **on** or **upon** a physical surface.\r\n* **Formula:**\r\n  * *Vest Trust:* `Subject + repose + [Trust / Faith / Confidence] + in + [Leader / System]`\r\n  * *Physical Rest:* `Subject + repose + on / upon + [Couch / Foundation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The citizens reposed their democratic trust upon the judicial bench.*\r\n  * ✔️ *The citizens **reposed their democratic trust in the judicial bench**.*\r\n\r\n---\r\n\r\n#### Item 115: 'Independent Of' (Autonomy from External Influence)\r\n* **Principle:** The formal adjective *independent* takes the preposition **of** when denoting freedom from external determination, funding, or control; substituting *from* (influenced by *free from*) is an error.\r\n* **Formula:** `Subject + be + independent + of + [External Control / Funding / Advice]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The central bank's rate decisions must remain strictly independent from political pressure.*\r\n  * ✔️ *The central bank's rate decisions must remain strictly **independent of political pressure**.*\r\n\r\n---\r\n\r\n### Category X: Comparative Juxtaposition & Differentiation\r\n\r\n#### Item 116: 'Distinguish Between' vs. 'Distinguish A From B'\r\n* **Principle:** Use *distinguish* **between** when evaluating two entities coordinated by *and*; use *distinguish* followed by direct object **from** when evaluating the difference separating entity A away from entity B.\r\n* **Formula:**\r\n  * `Subject + distinguish + between + [Entity A] + and + [Entity B]`\r\n  * `Subject + distinguish + [Entity A] + from + [Entity B]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The tribunal must distinguish between legitimate dissent from treason.*\r\n  * ✔️ *The tribunal must **distinguish between legitimate dissent and treason**.*\r\n  * ✔️ *The tribunal must **distinguish legitimate dissent from treason**.*\r\n\r\n---\r\n\r\n#### Item 117: 'Discriminate Against' [Prejudice] vs. 'Discriminate Between' [Perception]\r\n* **Principle:** To *discriminate* **against** an agent denotes acting with social prejudice or systemic bias; to *discriminate* **between** two items denotes the intellectual ability to perceive nuanced differences.\r\n* **Formula:**\r\n  * *Social Bias:* `Authority + discriminate + against + [Group / Minority]`\r\n  * *Intellectual Perception:* `Subject + discriminate + between + [Option A] + and + [Option B]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The statute prohibits employers to discriminate on minority applicants.*\r\n  * ✔️ *The statute prohibits employers to **discriminate against minority applicants**.*\r\n  * ✔️ *A trained ear can easily **discriminate between subtle dialectal accents**.*\r\n\r\n#### Item 118: 'Compare To' [Metaphorical Analogy] vs. 'Compare With' [Systematic Analysis]\r\n* **Principle:** One *compares* an entity **to** an entirely different class of object to illustrate a figurative or poetic likeness (e.g., comparing human life to a candle); one *compares* an entity **with** another of the same category to analyze concrete similarities and differences.\r\n* **Formula:**\r\n  * *Metaphorical Analogy (Different classes):* `Subject + compare + A + to + B`\r\n  * *Analytical Juxtaposition (Same class):* `Subject + compare + A + with + B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defense analyst compared the fighter aircraft to the rival nation's interceptor.*  \r\n    *(Literal technical analysis requires 'with')*\r\n  * ✔️ *The defense analyst **compared the fighter aircraft with the rival nation's interceptor**.*\r\n  * ✔️ *The poet famously **compared human life to a fleeting shadow**.*\r\n\r\n---\r\n\r\n#### Item 119: 'Contrast With' [Finite Verb] vs. 'In Contrast To' [Prepositional Complex]\r\n* **Principle:** As a finite transitive or intransitive verb, *contrast* governs the preposition **with**; when deployed as an introductory compound preposition, the established idiomatic form is **in contrast to** (or *by contrast with*).\r\n* **Formula:**\r\n  * *Verb:* `Subject A + contrast + with + Subject B`\r\n  * *Prepositional Marker:* `In contrast + to + [Noun Phrase], Main Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The minister's lavish lifestyle contrasts to his austere political rhetoric.*\r\n  * ✔️ *The minister's lavish lifestyle **contrasts with his austere political rhetoric**.*\r\n  * ✔️ * **In contrast to his predecessor**, the new director prioritized fiscal caution.*\r\n\r\n---\r\n\r\n#### Item 120: 'Parallel To' (Geometric & Figurative Alignment)\r\n* **Principle:** The adjective *parallel* takes the preposition **to** both in physical geometry and in figurative contexts denoting ideological alignment; using *with* as an adjective is non-standard. (Note: the noun can take *with*: *draw a parallel with*).\r\n* **Formula:** `Subject + be + parallel + to + [Trajectory / Principle / Line]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The new constitutional framework is entirely parallel with the Roman civil code.*\r\n  * ✔️ *The new constitutional framework is entirely **parallel to the Roman civil code**.*\r\n\r\n---\r\n\r\n### Category Y: Submission, Acquiescence & Capitulation\r\n\r\n#### Item 121: 'Succumb To' (Surrendering to Disease, Force or Flattery)\r\n* **Principle:** The intransitive verb *succumb* (to fail to resist pressure, temptation, or fatal disease) strictly governs the preposition **to**; pairing it with *under* or *from* is an error.\r\n* **Formula:** `Subject + succumb + to + [Injuries / Pressure / Disease / Temptation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The wounded explorer finally succumbed under the severe frostbite.*\r\n  * ✔️ *The wounded explorer finally **succumbed to the severe frostbite**.*\r\n\r\n---\r\n\r\n#### Item 122: 'Acquiesce In' (Passive Assent to Decisions)\r\n* **Principle:** The formal verb *acquiesce* (to accept something reluctantly but without protest) obligatorily requires the preposition **in**; substituting *to* or *with* is a widespread error.\r\n* **Formula:** `Subject + acquiesce + in + [Decision / Policy / Resolution / Plan]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The minority faction eventually acquiesced to the controversial party platform.*\r\n  * ✔️ *The minority faction eventually **acquiesced in the controversial party platform**.*\r\n\r\n---\r\n\r\n#### Item 123: 'Capitulate To' (Conditional Surrender)\r\n* **Principle:** *Capitulate* (to cease resisting an opponent and submit to their demands) takes the preposition **to**; pairing it with *before* or *with* violates standard usage.\r\n* **Formula:** `Subject + capitulate + to + [Demands / Ultimatum / Conqueror]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The besieged garrison refused to capitulate before the enemy commander's terms.*\r\n  * ✔️ *The besieged garrison refused to **capitulate to the enemy commander's terms**.*\r\n\r\n---\r\n\r\n#### Item 124: 'Yield To' (Giving Way to Superior Weight or Force)\r\n* **Principle:** The verb *yield* takes **to** when expressing physical collapse, surrendering to force, or granting precedence to an adversary; it never takes *before* or *against*.\r\n* **Formula:** `Subject + yield + to + [Pressure / Superior Force / Temptation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The bridge's central span yielded before the tremendous weight of the floodwaters.*\r\n  * ✔️ *The bridge's central span **yielded to the tremendous weight** of the floodwaters.*\r\n\r\n---\r\n\r\n#### Item 125: 'Deference To' (Respectful Regard for Rank or Wisdom)\r\n* **Principle:** The noun *deference* (polite submission and respect) mandates the preposition **to**; using *for* or *towards* is incorrect in the established idiom *in deference to*.\r\n* **Formula:** `Subject + act / yield + in deference + to + [Seniority / Wishes / Authority]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The junior officers spoke quietly in deference for the commanding general.*\r\n  * ✔️ *The junior officers spoke quietly **in deference to the commanding general**.*\r\n# Module 12: Fixed Prepositions & Prepositional Collocations\r\n**Curated Selection:** Items 126 to 150 of 200 Core Collocations  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category Z: Indignation, Mockery & Scorn\r\n\r\n#### Item 126: 'Indignant At' [Action/Slur] vs. 'Indignant With' [Person]\r\n* **Principle:** An agent is *indignant* (justifiably angry or resentful) **with** a person who caused offense; an agent is *indignant* **at** an unfair treatment, policy, insult, or remark.\r\n* **Formula:**\r\n  * `Subject + be + indignant + with + [Person]`\r\n  * `Subject + be + indignant + at + [Insult / Injustice / Treatment]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foreign minister was indignant at the ambassador personally.*\r\n  * ✔️ *The foreign minister was **indignant with the ambassador personally**.*\r\n  * ❌ *The delegates were indignant with the sudden suspension of talks.*\r\n  * ✔️ *The delegates were **indignant at the sudden suspension of talks**.*\r\n\r\n---\r\n\r\n#### Item 127: 'Resentful Of' (Bitterness Toward Treatment)\r\n* **Principle:** The adjective *resentful* (feeling bitterness or indignation at having been treated unfairly) strictly governs **of**, never *against* or *to*.\r\n* **Formula:** `Subject + be + resentful + of + [Interference / Privilege / Oversight]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The junior officers were deeply resentful against the commander's favoritism.*\r\n  * ✔️ *The junior officers were deeply **resentful of the commander's favoritism**.*\r\n\r\n---\r\n\r\n#### Item 128: 'Scoff At' (Derisive Mockery)\r\n* **Principle:** The verb *scoff* (to speak about someone or something in a scornfully derisive manner) takes the preposition **at**; using *on* or *to* violates standard usage.\r\n* **Formula:** `Subject + scoff + at + [Warnings / Ideas / Predictions / Tradition]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The military junta scoffed on the threat of international trade sanctions.*\r\n  * ✔️ *The military junta **scoffed at the threat of international trade sanctions**.*\r\n\r\n---\r\n\r\n#### Item 129: 'Contempt For' (Scornful Disregard)\r\n* **Principle:** The noun *contempt* (the feeling that a person or a thing is beneath consideration or worthless) takes the preposition **for**; pairing it with *to* or *towards* is non-standard.\r\n* **Formula:** `Subject + show / hold + contempt + for + [Law / Court / Adversary]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The rogue executive acted with total contempt towards the regulatory statutes.*\r\n  * ✔️ *The rogue executive acted with total **contempt for the regulatory statutes**.*\r\n\r\n---\r\n\r\n#### Item 130: 'Piqued At / By' (Irritated by a Slight)\r\n* **Principle:** The participle or adjective *piqued* (irritated, resentful, or wounded in pride) governs **at** or **by** an perceived slight, remark, or failure to acknowledge rank.\r\n* **Formula:** `Subject + be + piqued + at / by + [Slight / Omission / Rebuff]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The ambassador was noticeably piqued with not being seated beside the premier.*\r\n  * ✔️ *The ambassador was noticeably **piqued at not being seated beside the premier**.*\r\n\r\n---\r\n\r\n### Category AA: Bestowal, Endowment & Implantation\r\n\r\n#### Item 131: 'Bestow On / Upon' (Conferring Honors or Gifts)\r\n* **Principle:** The verb *bestow* (to confer an honor, gift, or right) governs the direct object followed strictly by **on** or **upon**; substituting *to* (by false analogy with *give to*) is a standard diagnostic error.\r\n* **Formula:** `Authority + bestow + [Honor / Title / Favor] + on / upon + [Recipient]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sovereign bestowed the highest military decoration to the field marshal.*\r\n  * ✔️ *The sovereign **bestowed the highest military decoration on the field marshal**.*\r\n\r\n---\r\n\r\n#### Item 132: 'Lavish On / Upon' (Extravagant Bestowal)\r\n* **Principle:** As a verb, *lavish* (to bestow something in generous or extravagant quantities) takes **on** or **upon**; it never takes *to* or *for*.\r\n* **Formula:** `Subject + lavish + [Praise / Money / Care] + on / upon + [Recipient]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The domestic press lavished unconditional praise to the returning expedition.*\r\n  * ✔️ *The domestic press **lavished unconditional praise on the returning expedition**.*\r\n\r\n---\r\n\r\n#### Item 133: 'Infuse With' [Entity] vs. 'Instill In / Into' [Mind]\r\n* **Principle:** One *infuses* an entity, institution, or troop **with** a quality, courage, or energy (saturating the recipient); one *instills* a virtue, doctrine, or habit **in** or **into** the mind of an agent (implanting the idea).\r\n* **Formula:**\r\n  * `Subject + infuse + [Recipient] + with + [Courage / Vitality / Zeal]`\r\n  * `Subject + instill + [Virtue / Discipline] + in / into + [Agent]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The general instilled his troops with absolute fearlessness before the assault.*\r\n  * ✔️ *The general **infused his troops with absolute fearlessness** before the assault.*\r\n  * ✔️ *The academy **instilled rigorous discipline into the cadets**.*\r\n\r\n---\r\n\r\n#### Item 134: 'Inculcate In / Into' (Persistent Teaching)\r\n* **Principle:** The verb *inculcate* (to instill an attitude, idea, or habit by persistent instruction) governs the preposition **in** or **into**; pairing it with *to* is incorrect.\r\n* **Formula:** `Teacher / State + inculcate + [Principles / Values] + in / into + [Citizens / Youth]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The instructors sought to inculcate civic responsibility to the pupils.*\r\n  * ✔️ *The instructors sought to **inculcate civic responsibility in the pupils**.*\r\n\r\n---\r\n\r\n#### Item 135: 'Endowed With' (Possession of Inherent Talents or Resources)\r\n* **Principle:** The verb or passive participle *endowed* (provided naturally with a feature, talent, or asset) obligatorily governs **with**; using *of* or *by* is ungrammatical.\r\n* **Formula:** `Subject + be + endowed + with + [Talent / Wealth / Intellect]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The natural philosopher was endowed of an astonishing mathematical intellect.*\r\n  * ✔️ *The natural philosopher was **endowed with an astonishing mathematical intellect**.*\r\n\r\n---\r\n\r\n### Category BB: Sympathy, Condolence & Bereavement\r\n\r\n#### Item 136: 'Sympathize With' (Shared Sorrow or Solidarity)\r\n* **Principle:** The verb *sympathize* governs the preposition **with** before a suffering agent or community; pairing it with *for* (often confused with the noun *sympathy for*) is an error.\r\n* **Formula:**\r\n  * *Verb:* `Subject + sympathize + with + [Suffering Agent]`\r\n  * *Noun:* `Subject + have / express + sympathy + for + [Suffering Agent]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foreign ministry officially sympathized for the victims of the seismic disaster.*\r\n  * ✔️ *The foreign ministry officially **sympathized with the victims of the seismic disaster**.*\r\n  * ✔️ *The citizens expressed profound **sympathy for the victims**.*\r\n\r\n---\r\n\r\n#### Item 137: 'Condole With' [Person] On [Loss]\r\n* **Principle:** The formal verb *condole* (to express sympathy with someone on the occasion of their sorrow) takes **with** before the bereaved person and **on** or **upon** before the death or misfortune.\r\n* **Formula:** `Subject + condole + with + [Bereaved Person] + on / upon + [Loss / Bereavement]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The ambassador condoled the widow for the sudden demise of the premier.*\r\n  * ✔️ *The ambassador **condoled with the widow on the sudden demise of the premier**.*\r\n\r\n---\r\n\r\n#### Item 138: 'Grieve For' [Person] vs. 'Grieve At / Over' [Event]\r\n* **Principle:** An agent *grieves* **for** a lost or deceased loved one (mourning a person); an agent *grieves* **at** or **over** a tragic occurrence, disaster, or defeat (mourning an event).\r\n* **Formula:**\r\n  * `Subject + grieve + for + [Deceased Person]`\r\n  * `Subject + grieve + at / over + [Tragedy / Defeat / Calamity]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The nation grieved over the fallen soldiers who perished in the defense.*\r\n  * ✔️ *The nation **grieved for the fallen soldiers** who perished in the defense.*\r\n  * ✔️ *The citizens **grieved at the destruction** of their historic library.*\r\n\r\n---\r\n\r\n#### Item 139: 'Commiserate With' [Person] On / Over [Misfortune]\r\n* **Principle:** The verb *commiserate* (to express or feel sympathy or pity) takes **with** before the person and **on** or **over** before their misfortune; it cannot be used transitively without a preposition in this sense.\r\n* **Formula:** `Subject + commiserate + with + [Person] + on / over + [Misfortune / Defeat]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defeated delegates commiserated their mutual losses late into the night.*\r\n  * ✔️ *The defeated delegates **commiserated with each other on their mutual losses**.*\r\n\r\n---\r\n\r\n#### Item 140: 'Have Pity On / Take Pity On' (Merciful Compassion)\r\n* **Principle:** In the established idioms *have pity on* and *take pity on*, the governing preposition is **on** or **upon**, not *for* or *over*.\r\n* **Formula:** `Subject + have / take + pity + on / upon + [Victim / Accused]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The presiding magistrate took pity for the destitute defendant.*\r\n  * ✔️ *The presiding magistrate **took pity on the destitute defendant**.*\r\n\r\n---\r\n\r\n### Category CC: Adjacency, Proximity & Natural Affinity\r\n\r\n#### Item 141: 'Adjacent To' (Contiguous Physical Positioning)\r\n* **Principle:** The adjective *adjacent* (next to or adjoining something else) governs the preposition **to**; using *with* is a common error.\r\n* **Formula:** `Entity A + be + adjacent + to + Entity B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The administrative archive was constructed adjacent with the supreme courthouse.*\r\n  * ✔️ *The administrative archive was constructed **adjacent to the supreme courthouse**.*\r\n\r\n---\r\n\r\n#### Item 142: 'Contiguous To / With' (Shared Continuous Border)\r\n* **Principle:** *Contiguous* (sharing a common border or touching along an unbroken boundary) takes **to** or **with**; pairing it with *from* or *against* is incorrect.\r\n* **Formula:** `Territory A + be + contiguous + to / with + Territory B`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The disputed neutral zone was contiguous from the sovereign republic.*\r\n  * ✔️ *The disputed neutral zone was **contiguous to the sovereign republic**.*\r\n\r\n---\r\n\r\n#### Item 143: 'Proximity To' (Physical or Chronological Nearness)\r\n* **Principle:** The noun *proximity* (nearness in space, time, or relationship) governs the preposition **to**; pairing it with *with* or *from* violates standard syntax.\r\n* **Formula:** `Proximity + to + [Border / Center / Danger / Settlement]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The fortress derived its tactical value from its proximity with the mountain pass.*\r\n  * ✔️ *The fortress derived its tactical value from its **proximity to the mountain pass**.*\r\n\r\n---\r\n\r\n#### Item 144: 'Affinity With' [Structural Kinship] vs. 'Affinity For' [Natural Liking]\r\n* **Principle:** An entity shares an *affinity* **with** or **between** another entity when they possess structural or genetic similarities (kinship); an agent has an *affinity* **for** an art, science, or pursuit (a natural liking or attraction).\r\n* **Formula:**\r\n  * *Structural Kinship:* `Entity A + have + an affinity + with + Entity B`\r\n  * *Inherent Attraction:* `Subject + have + an affinity + for + [Discipline / Art / Science]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The pol
