ymath exhibited an instinctive affinity with theoretical mathematics.*\r\n  * ✔️ *The polymath exhibited an instinctive **affinity for theoretical mathematics**.*\r\n  * ✔️ *Old Norse exhibits a close **affinity with Old English**.*\r\n\r\n---\r\n\r\n#### Item 145: 'Congruent With' (Geometric & Ideological Concord)\r\n* **Principle:** The formal adjective *congruent* (in agreement or harmony, or geometrically identical) mandates **with**; substituting *to* is non-standard.\r\n* **Formula:** `Subject + be + congruent + with + [Findings / Ideals / Measurements]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The new environmental treaty is fully congruent to our constitutional principles.*\r\n  * ✔️ *The new environmental treaty is fully **congruent with our constitutional principles**.*\r\n\r\n---\r\n\r\n### Category DD: Differential Interaction & Scrutiny\r\n\r\n#### Item 146: 'Complain Of' [Symptom] vs. 'Complain To / About' [Protest]\r\n* **Principle:** A patient *complains* **of** a bodily illness, pain, or medical symptom; a citizen *complains* **to** an authority **about** or **against** an administrative injustice.\r\n* **Formula:**\r\n  * *Medical Symptom:* `Patient + complain + of + [Headache / Chest Pain / Dizziness]`\r\n  * *Formal Grievance:* `Citizen + complain + to + [Authority] + about / against + [Injustice]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The diplomat was admitted to the hospital complaining about severe vertigo.*\r\n  * ✔️ *The diplomat was admitted to the hospital **complaining of severe vertigo**.*\r\n  * ✔️ *The residents **complained to the municipal council about the water contamination**.*\r\n\r\n---\r\n\r\n#### Item 147: 'Grapple With' (Physical or Intellectual Struggle)\r\n* **Principle:** The verb *grapple* (to engage in a close fight, or to struggle to solve a complex dilemma) governs the preposition **with**; pairing it with *against* or *to* is incorrect.\r\n* **Formula:** `Subject + grapple + with + [Adversary / Dilemma / Inflation / Problem]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The cabinet has been grappling against double-digit inflation for months.*\r\n  * ✔️ *The cabinet has been **grappling with double-digit inflation** for months.*\r\n\r\n---\r\n\r\n#### Item 148: 'Tamper With' (Illicit Alteration or Sabotage)\r\n* **Principle:** The verb *tamper* (to interfere with something in an unauthorized, clandestine, or harmful manner) obligatorily governs **with**; using *on* or *in* is a diagnostic error.\r\n* **Formula:** `Subject + tamper + with + [Evidence / Documents / Wiring / Ballots]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defense argued that the forensic evidence had been tampered on.*\r\n  * ✔️ *The defense argued that the forensic evidence had been **tampered with**.*\r\n\r\n---\r\n\r\n#### Item 149: 'Cling To' (Steadfast Adherence)\r\n* **Principle:** The verb *cling* (to hold on tightly physically, or to remain stubbornly devoted to an obsolete belief) takes **to**; using *with* or *at* violates standard syntax.\r\n* **Formula:** `Subject + cling + to + [Hope / Belief / Tradition / Surface]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The conservative faction clung with outdated monetary doctrines.*\r\n  * ✔️ *The conservative faction **clung to outdated monetary doctrines**.*\r\n\r\n---\r\n\r\n#### Item 150: 'Fawn On / Upon' (Servile Flattery)\r\n* **Principle:** The verb *fawn* (to display exaggerated flattery or affection toward someone of higher status) governs **on** or **upon**; substituting *over* or *at* is non-standard in formal English.\r\n* **Formula:** `Courtier + fawn + on / upon + [Monarch / Patron / Superior]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sycophantic courtiers fawned over the authoritarian regent to secure promotions.*\r\n  * ✔️ *The sycophantic courtiers **fawned on the authoritarian regent** to secure promotions.*\r\n# Module 12: Fixed Prepositions & Prepositional Collocations\r\n**Curated Selection:** Items 151 to 175 of 200 Core Collocations  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category EE: Zeal, Passion, Fondness & Appetite\r\n\r\n#### Item 151: 'Zeal For' [Noun] vs. 'Zealous In' [Adjective]\r\n* **Principle:** The noun *zeal* (great energy or enthusiasm in pursuit of a cause) takes the preposition **for**; the adjective *zealous* takes **in** when describing dedication to an activity or defense.\r\n* **Formula:**\r\n  * *Noun:* `Subject + have / display + zeal + for + [Cause / Reform / Justice]`\r\n  * *Adjective:* `Subject + be + zealous + in + [Defense / Execution / Pursuit]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The reformer displayed an unyielding zeal to constitutional liberty.*\r\n  * ✔️ *The reformer displayed an unyielding **zeal for constitutional liberty**.*\r\n  * ❌ *The prosecutor was zealous for the cross-examination of the witness.*\r\n  * ✔️ *The prosecutor was **zealous in the cross-examination of the witness**.*\r\n\r\n---\r\n\r\n#### Item 152: 'Appetite For' (Desire or Propensity)\r\n* **Principle:** The noun *appetite* (metaphorically denoting an inclination or craving for risk, power, or conflict) mandates the preposition **for**; substituting *of* or *to* is non-standard.\r\n* **Formula:** `Subject + have + an appetite + for + [Risk / Power / Conflict / Reform]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The investment committee demonstrated little appetite to speculative ventures.*\r\n  * ✔️ *The investment committee demonstrated little **appetite for speculative ventures**.*\r\n\r\n---\r\n\r\n#### Item 153: 'Passion For' (Intense Enthusiasm)\r\n* **Principle:** The noun *passion* governs the preposition **for** when identifying a field, art, or ideal pursued with intense devotion; pairing it with *of* is a diagnostic error.\r\n* **Formula:** `Subject + have / show + a passion + for + [Art / Archaeology / Justice]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *From his early youth, he possessed a passion of classical archaeology.*\r\n  * ✔️ *From his early youth, he possessed a **passion for classical archaeology**.*\r\n\r\n---\r\n\r\n#### Item 154: 'Fond Of' [Adjective] vs. 'Fondness For' [Noun]\r\n* **Principle:** The predicative adjective *fond* strictly governs **of**; the abstract noun *fondness* mandates the preposition **for**. Cross-pairing these (*fond for* or *fondness of*) violates idiomatic usage.\r\n* **Formula:**\r\n  * *Adjective:* `Subject + be + fond + of + [Noun Phrase / Gerund (V-ing)]`\r\n  * *Noun:* `Subject + have / develop + a fondness + for + [Person / Pursuit]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The chancellor was exceptionally fond for diplomatic ceremony.*\r\n  * ✔️ *The chancellor was exceptionally **fond of diplomatic ceremony**.*\r\n  * ❌ *He retained a persistent fondness of classical literature.*\r\n  * ✔️ *He retained a persistent **fondness for classical literature**.*\r\n\r\n---\r\n\r\n#### Item 155: 'Penchant For' (Habitual Predilection)\r\n* **Principle:** The noun *penchant* (a strong or continued inclination or taste) obligatorily governs **for**; pairing it with *to* or *of* is ungrammatical.\r\n* **Formula:** `Subject + have + a penchant + for + [Secrecy / Extravagance / Drama]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The reclusive diplomat had a well-known penchant to unilateral decisions.*\r\n  * ✔️ *The reclusive diplomat had a well-known **penchant for unilateral decisions**.*\r\n\r\n---\r\n\r\n### Category FF: Boasting, Triumph & Gloating\r\n\r\n#### Item 156: 'Boast Of / About' vs. 'Pride Oneself On'\r\n* **Principle:** The verb *boast* takes the preposition **of** or **about**; the reflexive construction *pride oneself* strictly mandates the preposition **on** or **upon**.\r\n* **Formula:**\r\n  * `Subject + boast + of / about + [Achievements / Wealth / Lineage]`\r\n  * `Subject + pride + oneself + on / upon + [Integrity / Record / Skill]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The general boasted for having never lost a border skirmish.*\r\n  * ✔️ *The general **boasted of having never lost a border skirmish**.*\r\n  * ❌ *The minister prided himself for his spotless administrative career.*\r\n  * ✔️ *The minister **prided himself on his spotless administrative career**.*\r\n\r\n---\r\n\r\n#### Item 157: 'Glory In' (Exulting in an Attribute or Feat)\r\n* **Principle:** The intransitive verb *glory* (to take supreme pride, delight, or triumph in something) governs the preposition **in**; using *of* or *with* is an error.\r\n* **Formula:** `Subject + glory + in + [Defiance / Triumph / Independence]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The revolutionary faction gloried of their refusal to surrender the capital.*\r\n  * ✔️ *The revolutionary faction **gloried in their refusal to surrender the capital**.*\r\n\r\n---\r\n\r\n#### Item 158: 'Exult At / In' [Success] vs. 'Exult Over' [Defeated Foe]\r\n* **Principle:** One *exults* (rejoices exceedingly) **at** or **in** a triumph, victory, or windfall; one *exults* **over** a fallen rival, adversary, or defeated nation (gloating).\r\n* **Formula:**\r\n  * *Triumph / Good News:* `Subject + exult + at / in + [Victory / Success]`\r\n  * *Fallen Adversary:* `Subject + exult + over + [Defeated Rival / Enemy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The partisan crowds exulted over the signing of the peace accord.*\r\n  * ✔️ *The partisan crowds **exulted at the signing of the peace accord**.*\r\n  * ✔️ *The conqueror was warned not to **exult over his fallen enemies**.*\r\n\r\n---\r\n\r\n#### Item 159: 'Gloat Over' (Malicious Satisfaction)\r\n* **Principle:** The verb *gloat* (to dwell on one's own success or another's misfortune with smug or malicious pleasure) governs the preposition **over**; pairing it with *on* or *at* is non-standard.\r\n* **Formula:** `Subject + gloat + over + [Misfortune / Rival's Defeat / Trophies]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *It is dishonorable for a magistrate to gloat on a convict's sentencing.*\r\n  * ✔️ *It is dishonorable for a magistrate to **gloat over a convict's sentencing**.*\r\n\r\n---\r\n\r\n#### Item 160: 'Triumph Over' (Mastery and Conquest)\r\n* **Principle:** The verb *triumph* governs **over** when denoting victory against an adversary, obstacle, or moral vice; using *against* or *upon* violates standard usage.\r\n* **Formula:** `Subject + triumph + over + [Adversity / Tyranny / Foe]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The constitutional assembly eventually triumphed against political inertia.*\r\n  * ✔️ *The constitutional assembly eventually **triumphed over political inertia**.*\r\n\r\n---\r\n\r\n### Category GG: Hindrance, Barriers & Inhibitions\r\n\r\n#### Item 161: 'Obstacle To' (+ Gerund / Noun)\r\n* **Principle:** The noun *obstacle* takes the preposition **to**; because *to* is a genuine preposition here, any following verbal complement must be a gerund (*V-ing*), not a bare or full infinitive. Using *for* or *against* is an error.\r\n* **Formula:** `Subject + be + an obstacle + to + [Progress / Settlement / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Bureaucratic corruption remains a major obstacle for economic recovery.*\r\n  * ✔️ *Bureaucratic corruption remains a major **obstacle to economic recovery**.*\r\n  * ❌ *His lack of credentials was an obstacle to secure the appointment.*\r\n  * ✔️ *His lack of credentials was an **obstacle to securing the appointment**.*\r\n\r\n---\r\n\r\n#### Item 162: 'Bar To' (+ Gerund / Noun)\r\n* **Principle:** When *bar* means an obstacle, impediment, or legal barrier, it mandates the preposition **to** followed by a noun or gerund; pairing it with *for* or *against* is ungrammatical.\r\n* **Formula:** `Subject + be + a bar + to + [Advancement / Peace / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The past felony conviction was a legal bar for entering public office.*\r\n  * ✔️ *The past felony conviction was a legal **bar to entering public office**.*\r\n\r\n---\r\n\r\n#### Item 163: 'Impediment To' (Structural Obstruction)\r\n* **Principle:** The noun *impediment* (a hindrance or obstruction in doing something) requires the preposition **to**; substituting *of* or *against* is incorrect.\r\n* **Formula:** `Subject + be + an impediment + to + [Reforms / Growth / Unity]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Tariff barriers serve as an impediment of cross-border commerce.*\r\n  * ✔️ *Tariff barriers serve as an **impediment to cross-border commerce**.*\r\n\r\n---\r\n\r\n#### Item 164: 'Deterrent To' (Discouragement of Action)\r\n* **Principle:** The noun *deterrent* (a thing that discourages or is intended to discourage someone from doing something) takes the preposition **to**; pairing it with *against* or *for* is non-standard in formal syntax.\r\n* **Formula:** `Subject + act as / be + a deterrent + to + [Aggression / Crime / Defection]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The coastal minefields were a potent deterrent against naval incursions.*\r\n  * ✔️ *The coastal minefields were a potent **deterrent to naval incursions**.*\r\n\r\n---\r\n\r\n#### Item 165: 'Incentive To' (+ Gerund / Noun)\r\n* **Principle:** When the noun *incentive* is followed by a prepositional phrase with a nominal/gerund complement, it governs **to** (denoting the direction of encouragement); when followed by a verb of action directly, it takes a to-infinitive. Using *for* with actions is non-standard.\r\n* **Formula:**\r\n  * `Incentive + to + [Innovation / Effort / Gerund (V-ing)]`\r\n  * `Incentive + to-Infinitive [invest / produce / expand]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The tax abatement offered a substantial incentive for investing in green power.*\r\n  * ✔️ *The tax abatement offered a substantial **incentive to investing in green power**.*\r\n  * ✔️ *The tax abatement offered a substantial **incentive to invest in green power**.*\r\n\r\n---\r\n\r\n### Category HH: Vesting, Prerogative & Inherent Qualities\r\n\r\n#### Item 166: 'Vested In' [Institution/Office] vs. 'Vested With' [Person]\r\n* **Principle:** Legal authority or power is *vested* **in** an office, court, or corporate body (location of power); a person, officer, or magistrate is *vested* **with** that authority or power (endowed agent).\r\n* **Formula:**\r\n  * *Power Located:* `Authority / Power + be + vested + in + [The Senate / The Court]`\r\n  * *Person Endowed:* `Person / Official + be + vested + with + [Power / Authority]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Executive authority is vested with the office of the President.*\r\n  * ✔️ *Executive authority is **vested in the office of the President**.*\r\n  * ❌ *The magistrate was vested in summary judicial powers.*\r\n  * ✔️ *The magistrate was **vested with summary judicial powers**.*\r\n\r\n---\r\n\r\n#### Item 167: 'Privilege Of' [Noun] vs. 'Privileged To' [Adjective + Infinitive]\r\n* **Principle:** The noun *privilege* takes the preposition **of** followed by a gerund or noun (*the privilege of speaking*); the predicative adjective *privileged* governs a to-infinitive (*privileged to speak*).\r\n* **Formula:**\r\n  * *Noun Phrase:* `have + the privilege + of + [Noun Phrase / Gerund (V-ing)]`\r\n  * *Adjective Phrase:* `Subject + be + privileged + to-Infinitive`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The visiting envoy had the privilege to address the joint assembly.*\r\n  * ✔️ *The visiting envoy had the **privilege of addressing the joint assembly**.*\r\n  * ✔️ *The visiting envoy was **privileged to address the joint assembly**.*\r\n\r\n---\r\n\r\n#### Item 168: 'Prerogative Of' (Exclusive Institutional Right)\r\n* **Principle:** The noun *prerogative* (a right or privilege exclusive to a particular individual or class) governs the preposition **of**; pairing it with *for* or *to* violates legal and administrative usage.\r\n* **Formula:** `It + is + the prerogative + of + [The Crown / The Executive / The Judge]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Granting executive clemency is the constitutional prerogative to the governor.*\r\n  * ✔️ *Granting executive clemency is the constitutional **prerogative of the governor**.*\r\n\r\n---\r\n\r\n#### Item 169: 'Inherent In' (Permanent Essential Attribute)\r\n* **Principle:** The adjective *inherent* (existing in something as a permanent, essential, or characteristic attribute) mandates the preposition **in**; substituting *to* or *with* is an error.\r\n* **Formula:** `Trait / Risk + be + inherent + in + [System / Nature / Venture]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Severe market volatility is a risk inherent to speculative trading.*\r\n  * ✔️ *Severe market volatility is a risk **inherent in speculative trading**.*\r\n\r\n---\r\n\r\n#### Item 170: 'Intrinsic To' (Belonging Naturally by Essence)\r\n* **Principle:** Unlike *inherent in*, the formal adjective *intrinsic* (belonging naturally; essential to the constitution of something) standardly governs **to** in contemporary academic syntax.\r\n* **Formula:** `Quality + be + intrinsic + to + [Subject / System / Philosophy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The pursuit of verifiable evidence is intrinsic in scientific inquiry.*\r\n  * ✔️ *The pursuit of verifiable evidence is **intrinsic to scientific inquiry**.*\r\n\r\n---\r\n\r\n### Category II: Commercial Exchange, Encroachment & Tension\r\n\r\n#### Item 171: 'Bargain With' [Party] For [Commodity]\r\n* **Principle:** An agent *bargains* **with** a counterpart, merchant, or rival (the negotiation partner); that agent *bargains* **for** goods, concessions, or terms (the object sought).\r\n* **Formula:** `Subject + bargain + with + [Merchant / Party] + for + [Goods / Concessions]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The union representatives bargained to the management about higher wages.*\r\n  * ✔️ *The union representatives **bargained with the management for higher wages**.*\r\n\r\n---\r\n\r\n#### Item 172: 'Earmark For' (Designating Resources for a Specific Purpose)\r\n* **Principle:** The transitive verb *earmark* (to designate funds or resources for a specific objective) takes the direct nominal object followed strictly by **for**; using *to* is a diagnostic error.\r\n* **Formula:** `Authority + earmark + [Funds / Revenue] + for + [Project / Defense / Purpose]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The legislature earmarked fifty million dollars to municipal healthcare overhaul.*\r\n  * ✔️ *The legislature **earmarked fifty million dollars for municipal healthcare overhaul**.*\r\n\r\n---\r\n\r\n#### Item 173: 'Wrest From' (Forcible Extraction)\r\n* **Principle:** The verb *wrest* (to forcibly pull something from someone's grasp, or extract power through strenuous effort) takes the preposition **from**; pairing it with *of* or *away* is non-standard.\r\n* **Formula:** `Subject + wrest + [Power / Weapon / Control] + from + [Adversary / Grasp]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The insurgent generals wrested the executive power of the civilian council.*\r\n  * ✔️ *The insurgent generals **wrested executive power from the civilian council**.*\r\n\r\n---\r\n\r\n#### Item 174: 'Hover Over' (Looming Suspense or Threat)\r\n* **Principle:** The verb *hover* takes **over** both in physical suspension (a bird or craft poised in the air) and metaphorical contexts denoting a lingering threat, specter, or suspicion; substituting *on* or *above* violates established idiom.\r\n* **Formula:** `Specter / Threat / Craft + hover + over + [City / Population / Proceeding]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The specter of sovereign default hovered above the national economy.*\r\n  * ✔️ *The specter of sovereign default **hovered over the national economy**.*\r\n\r\n---\r\n\r\n#### Item 175: 'Trench On / Upon' (Trespass on Rights or Jurisdictions)\r\n* **Principle:** The formal verb *trench* (when meaning to encroach, infringe, or border dangerously upon another's rights, time, or territory) governs the preposition **on** or **upon**; using *into* or *to* is incorrect.\r\n* **Formula:** `Subject + trench + on / upon + [Prerogatives / Liberties / Time]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Such emergency surveillance measures trench into the civil liberties of citizens.*\r\n  * ✔️ *Such emergency surveillance measures **trench on the civil liberties of citizens**.*\r\n# Module 12: Fixed Prepositions & Prepositional Collocations\r\n**Curated Selection:** Items 176 to 200 of 200 Core Collocations *(Final Series)*  \r\n**Question Output Target:** 25 Diagnostic Questions (Completing 200 Diagnostic Questions for Module 12)\r\n\r\n---\r\n\r\n### Category JJ: Taste, Appetite, Craving & Disgust\r\n\r\n#### Item 176: 'Taste For' [Appetite/Desire] vs. 'Taste In' [Aesthetic Judgment]\r\n* **Principle:** One has a *taste* **for** an activity, consumable item, or lifestyle (denoting a personal appetite or liking); one exhibits good or poor *taste* **in** music, literature, art, or apparel (denoting critical aesthetic judgment).\r\n* **Formula:**\r\n  * *Appetite / Liking:* `Subject + have + a taste + for + [Luxury / Adventure / Wine]`\r\n  * *Aesthetic Judgment:* `Subject + have / display + [good / poor] taste + in + [Art / Fashion / Prose]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The young aristocrat had developed an insatiable taste in equestrian sports.*\r\n  * ✔️ *The young aristocrat had developed an insatiable **taste for equestrian sports**.*\r\n  * ❌ *The architect was renowned for his refined taste for neoclassical masonry.*\r\n  * ✔️ *The architect was renowned for his refined **taste in neoclassical masonry**.*\r\n\r\n---\r\n\r\n#### Item 177: 'Relish For' (Capacity for Enjoyment)\r\n* **Principle:** The noun *relish* (enjoyment of or delight in an activity or challenge) takes the preposition **for**; using *of* or *to* violates standard idiomatic collocation.\r\n* **Formula:** `Subject + have / show + no / little + relish + for + [Conflict / Task / Drama]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The veteran diplomat had little relish to protracted parliamentary debate.*\r\n  * ✔️ *The veteran diplomat had little **relish for protracted parliamentary debate**.*\r\n\r\n---\r\n\r\n#### Item 178: 'Distaste For' (Aversion and Dislike)\r\n* **Principle:** The noun *distaste* (a mild dislike or aversion) obligatorily governs **for**; substituting *to*, *towards*, or *of* is non-standard.\r\n* **Formula:** `Subject + have / feel + a distaste + for + [Flattery / Intrigue / Politics]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The jurist maintained an outspoken distaste towards sensationalist journalism.*\r\n  * ✔️ *The jurist maintained an outspoken **distaste for sensationalist journalism**.*\r\n\r\n---\r\n\r\n#### Item 179: 'Thirst For' (Insatiable Ambition)\r\n* **Principle:** Used figuratively to denote an ardent or insatiable desire for knowledge, glory, power, or revenge, *thirst* governs **for**; pairing it with *of* or *after* is non-standard.\r\n* **Formula:** `Subject + have + a thirst + for + [Knowledge / Power / Conquest / Revenge]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The tyrant possessed an unquenchable thirst of territorial conquest.*\r\n  * ✔️ *The tyrant possessed an unquenchable **thirst for territorial conquest**.*\r\n\r\n---\r\n\r\n#### Item 180: 'Disgusted With' [Person] vs. 'Disgusted At / By' [Conduct]\r\n* **Principle:** An agent is *disgusted* **with** a person because of their character or failure; an agent is *disgusted* **at** or **by** an atrocious spectacle, behavior, or corrupt act.\r\n* **Formula:**\r\n  * `Subject + be + disgusted + with + [Person]`\r\n  * `Subject + be + disgusted + at / by + [Conduct / Atrocity / Spectacle]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The electorate was disgusted at the corrupt prime minister himself.*\r\n  * ✔️ *The electorate was **disgusted with the corrupt prime minister himself**.*\r\n  * ✔️ *The electorate was **disgusted at the bribery scandal**.*\r\n\r\n---\r\n\r\n### Category KK: Congratulation, Compliments & Commendation\r\n\r\n#### Item 181: 'Congratulate On / Upon' (Celebration of Success)\r\n* **Principle:** The verb *congratulate* governs the personal object followed strictly by **on** or **upon**; substituting *for* (by false analogy with *praise for*) is one of the most frequently tested diagnostic errors in formal English exams.\r\n* **Formula:** `Subject + congratulate + Person + on / upon + [Success / Feat / Appointment]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The prime minister congratulated the research team for their breakthrough.*\r\n  * ✔️ *The prime minister **congratulated the research team on their breakthrough**.*\r\n\r\n---\r\n\r\n#### Item 182: 'Compliment On' (Praise for Attributes or Attire)\r\n* **Principle:** The verb *compliment* governs the personal object followed strictly by **on**; using *for* is an error.\r\n* **Formula:** `Subject + compliment + Person + on + [Elegance / Speech / Conduct]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foreign minister complimented the envoy for his masterful negotiation.*\r\n  * ✔️ *The foreign minister **complimented the envoy on his masterful negotiation**.*\r\n\r\n---\r\n\r\n#### Item 183: 'Commend For' [Action] vs. 'Commend To' [Care/Favor]\r\n* **Principle:** An agent is *commended* **for** bravery, diligence, or exemplary service; an agent or ward is *commended* **to** the care, protection, or favor of another.\r\n* **Formula:**\r\n  * *Praise for Merit:* `Subject + commend + Person + for + [Bravery / Service]`\r\n  * *Entrusting Care:* `Subject + commend + Person / Soul + to + [Care / Mercy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sentinel was commended to his alertness during the border breach.*\r\n  * ✔️ *The sentinel was **commended for his alertness** during the border breach.*\r\n  * ✔️ *The dying king **commended his heir to the protection of the regent**.*\r\n\r\n---\r\n\r\n#### Item 184: 'Applaud For' (Public Praise of Conduct)\r\n* **Principle:** The verb *applaud* takes the preposition **for** when identifying the specific ethical stand, courageous action, or decision for which someone is celebrated.\r\n* **Formula:** `Public / Assembly + applaud + Person + for + [Courage / Decision / Stand]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The citizens applauded the magistrate on his refusal to accept bribes.*\r\n  * ✔️ *The citizens **applauded the magistrate for his refusal to accept bribes**.*\r\n\r\n---\r\n\r\n#### Item 185: 'Acclaim As' (Public Proclamation of Role)\r\n* **Principle:** The verb *acclaim* takes the preposition **as** when designating the title, status, or identity universally bestowed upon an individual.\r\n* **Formula:** `Subject + be + acclaimed + as + [Hero / Pioneer / Sovereign]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The victorious general was acclaimed like the savior of the republic.*\r\n  * ✔️ *The victorious general was **acclaimed as the savior of the republic**.*\r\n\r\n---\r\n\r\n### Category LL: Subservience, Subjection & Indebtedness\r\n\r\n#### Item 186: 'Subject To' [Adjective + Gerund / Noun]\r\n* **Principle:** The predicative adjective *subject* takes the preposition **to** when meaning conditional upon, exposed to, or prone to; because *to* is a true preposition here, any following verb must be a gerund (*V-ing*).\r\n* **Formula:** `Subject + be + subject + to + [Approval / Inspection / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The commercial treaty is subject for parliamentary ratification.*\r\n  * ✔️ *The commercial treaty is **subject to parliamentary ratification**.*\r\n  * ❌ *The draft regulations are subject to amend without prior notice.*\r\n  * ✔️ *The draft regulations are **subject to amending without prior notice**.*\r\n\r\n---\r\n\r\n#### Item 187: 'Subordinate To' (Lower Hierarchical Rank)\r\n* **Principle:** The adjective or verb *subordinate* mandates the preposition **to**; pairing it with *under* or *with* violates standard grammar.\r\n* **Formula:** `Subject + be + subordinate + to + [Authority / Higher Rank / Strategy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Tactical deployment must always be subordinate under grand strategy.*\r\n  * ✔️ *Tactical deployment must always be **subordinate to grand strategy**.*\r\n\r\n---\r\n\r\n#### Item 188: 'Tributary To' (Feudal or Hydrological Dependence)\r\n* **Principle:** The adjective *tributary* (paying tribute to a conqueror, or a river flowing into a larger body) takes the preposition **to**, not *of*.\r\n* **Formula:** `State / River + be + tributary + to + [Empire / Main River]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The Missouri River is tributary of the Mississippi River.*\r\n  * ✔️ *The Missouri River is **tributary to the Mississippi River**.*\r\n\r\n---\r\n\r\n#### Item 189: 'Beholden To' (Moral Obligation)\r\n* **Principle:** The adjective *beholden* (owing thanks or having a duty to someone in return for aid or service) governs **to**; pairing it with *with* or *for* is incorrect.\r\n* **Formula:** `Subject + be + beholden + to + [Benefactor / Patron / Creditor]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The newly appointed premier was beholden with corporate financiers.*\r\n  * ✔️ *The newly appointed premier was **beholden to corporate financiers**.*\r\n\r\n---\r\n\r\n#### Item 190: 'Indebted To' [Creditor/Benefactor] For [Favor]\r\n* **Principle:** One is *indebted* **to** a person or benefactor (recipient of gratitude); one is *indebted* **for** their assistance, benevolence, or guidance (the cause).\r\n* **Formula:** `Subject + be + indebted + to + [Person] + for + [Kindness / Service]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *We are deeply indebted for the field surgeon to his life-saving surgery.*\r\n  * ✔️ *We are deeply **indebted to the field surgeon for his life-saving surgery**.*\r\n\r\n---\r\n\r\n### Category MM: Satiation, Surfeit & Weariness\r\n\r\n#### Item 191: 'Weary Of' (+ Gerund / Noun)\r\n* **Principle:** The adjective *weary* takes **of** when denoting mental exhaustion, boredom, or impatience with an ongoing state; pairing it with *with* or *from* in this mental sense is an error.\r\n* **Formula:** `Subject + be / grow + weary + of + [Excuses / Waiting / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The electorate has grown weary with hearing unfulfilled campaign pledges.*\r\n  * ✔️ *The electorate has grown **weary of hearing unfulfilled campaign pledges**.*\r\n\r\n---\r\n\r\n#### Item 192: 'Satiated With' (Full Beyond Capacity)\r\n* **Principle:** The participle or adjective *satiated* (satisfied fully, often to excess) governs the preposition **with**; using *of* or *by* is non-standard.\r\n* **Formula:** `Subject + be + satiated + with + [Pleasures / Food / Flattery]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The decadent court was satiated of endless frivolous banquets.*\r\n  * ✔️ *The decadent court was **satiated with endless frivolous banquets**.*\r\n\r\n---\r\n\r\n#### Item 193: 'Replete With' (Abundantly Supplied)\r\n* **Principle:** The adjective *replete* (filled or well-supplied with something) obligatorily requires the preposition **with**; using *of* (by false analogy with *full of*) is a standard diagnostic trap.\r\n* **Formula:** `Subject + be + replete + with + [Artifacts / Contradictions / Resources]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The intelligence dossier was replete of glaring chronological errors.*\r\n  * ✔️ *The intelligence dossier was **replete with glaring chronological errors**.*\r\n\r\n---\r\n\r\n#### Item 194: 'Glutted With' (Excessive Flooding of Supply)\r\n* **Principle:** The verb or passive participle *glutted* (supplied or fed to excess) takes **with**; substituting *by* or *of* is incorrect.\r\n* **Formula:** `Market / Entity + be + glutted + with + [Goods / Imports / Commodities]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The domestic wholesale market was glutted of imported electronics.*\r\n  * ✔️ *The domestic wholesale market was **glutted with imported electronics**.*\r\n\r\n---\r\n\r\n#### Item 195: 'Sick Of' (Impatience and Disgust)\r\n* **Principle:** In the idiomatic sense of being thoroughly weary, exasperated, or disgusted with something, *sick* governs **of**; pairing it with *from* or *with* distorts the meaning to physiological disease.\r\n* **Formula:** `Subject + be + sick + of + [Pretenses / Delay / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The commander was sick with the relentless political interference from the capital.*\r\n  * ✔️ *The commander was **sick of the relentless political interference** from the capital.*\r\n\r\n---\r\n\r\n### Category NN: Concluding High-Yield Collocational Traps\r\n\r\n#### Item 196: 'Remiss In' (Negligent of Duty)\r\n* **Principle:** The formal adjective *remiss* (lacking care or attention to duty; negligent) governs the preposition **in**; using *of* or *about* is ungrammatical.\r\n* **Formula:** `Subject + be + remiss + in + [Duty / Obligations / Attention]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The presiding officer was remiss of his constitutional obligations.*\r\n  * ✔️ *The presiding officer was **remiss in his constitutional obligations**.*\r\n\r\n---\r\n\r\n#### Item 197: 'Pertain To' (Direct Relevance or Connection)\r\n* **Principle:** The intransitive verb *pertain* (to be appropriate, related, or applicable to) obligatorily governs **to**; it strictly excludes *with*, *for*, or *about*.\r\n* **Formula:** `Subject + pertain + to + [Jurisdiction / Matter / Question]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *These confidential documents pertain with the bilateral trade negotiations.*\r\n  * ✔️ *These confidential documents **pertain to the bilateral trade negotiations**.*\r\n\r\n---\r\n\r\n#### Item 198: 'Desirous Of' [Adjective] vs. 'Desire For' [Noun]\r\n* **Principle:** The formal adjective *desirous* governs the preposition **of**; the noun *desire* takes the preposition **for**. Substituting *for* after the adjective *desirous* is a frequent error.\r\n* **Formula:**\r\n  * *Adjective:* `Subject + be + desirous + of + [Peace / Reconciliation / Gerund (V-ing)]`\r\n  * *Noun:* `Subject + have + a desire + for + [Vindication / Power]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The belligerent factions were desirous for reaching a ceasefire.*\r\n  * ✔️ *The belligerent factions were **desirous of reaching a ceasefire**.*\r\n  * ✔️ *The populace expressed a strong **desire for peace**.*\r\n\r\n---\r\n\r\n#### Item 199: 'Jealous Of' / 'Envious Of' (Suspicious Vigilance or Envy)\r\n* **Principle:** Both *jealous* and *envious* govern the preposition **of** when denoting resentment toward another’s success, possessions, or status, or when fiercely guarding one’s own prerogatives (*jealous of one’s reputation*); using *with* or *for* is an error.\r\n* **Formula:** `Subject + be + jealous / envious + of + [Rival / Success / Reputation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The regional powers were fiercely jealous with their territorial waters.*\r\n  * ✔️ *The regional powers were fiercely **jealous of their territorial waters**.*\r\n  * ❌ *The junior diplomat was envious for his colleague's rapid promotion.*\r\n  * ✔️ *The junior diplomat was **envious of his colleague's rapid promotion**.*\r\n\r\n---\r\n\r\n#### Item 200: 'Bow To' (Submission to Authority or Inevitability)\r\n* **Principle:** The verb *bow* takes the preposition **to** when indicating submission, surrender, or deference to an authority, public opinion, or inevitable pressure; pairing it with *before* or *against* is non-standard.\r\n* **Formula:** `Subject + bow + to + [Public Pressure / Inevitability / The Crown]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The prime minister refused to bow before the demands of the opposition.*\r\n  * ✔️ *The prime minister refused to **bow to the demands of the opposition**.*\r\n\r\n# Module 13: Phrasal Verbs & Verbal Particles\r\n**Curated Selection:** Items 1 to 25 of 150 Key Phrasal Verbs  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category A: The 'Bring' Family (Particle Switching Traps)\r\n\r\n#### Item 1: 'Bring About' (Causative Execution)\r\n* **Principle:** *Bring about* is a transitive phrasal verb meaning to cause something to happen or effect a fundamental change; substituting *round* or *up* alters the meaning entirely.\r\n* **Formula:** `Subject + bring about + [Reform / Revolution / Collapse / Change]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The deregulation of commercial banking brought round an unprecedented financial panic.*\r\n  * ✔️ *The deregulation of commercial banking **brought about** an unprecedented financial panic.*\r\n\r\n---\r\n\r\n#### Item 2: 'Bring Off' (Successful Realization of a Feat)\r\n* **Principle:** *Bring off* means to achieve or accomplish something unexpectedly difficult against steep odds; it is separable when governing a nominal object.\r\n* **Formula:** `Subject + bring off + [Triumph / Coup / Deal / Victory]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Against all projections, the junior diplomat brought down a delicate peace accord.*  \r\n    *(Confusing 'bring down' [overthrow] with 'bring off' [achieve])*\r\n  * ✔️ *Against all projections, the junior diplomat **brought off** a delicate peace accord.*\r\n\r\n---\r\n\r\n#### Item 3: 'Bring Round / Around' [Consciousness] vs. [Persuasion]\r\n* **Principle:** *Bring round* functions in two distinct contexts: (1) restoring a person to physical consciousness, and (2) persuading a reluctant person to accept an opinion or proposal.\r\n* **Formula:**\r\n  * *Medical:* `Subject + bring + [Fainted Person] + round / around`\r\n  * *Persuasion:* `Subject + bring + [Opponent] + round / around + to + [Viewpoint]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The field medic used smelling salts to bring up the unconscious sentry.*\r\n  * ✔️ *The field medic used smelling salts to **bring round** the unconscious sentry.*\r\n  * ✔️ *After hours of debate, the minister **brought the committee round** to his fiscal policy.*\r\n\r\n---\r\n\r\n#### Item 4: 'Bring Up' [Pedagogy / Raising] vs. [Topic Introduction]\r\n* **Principle:** *Bring up* means (1) to rear and educate a child from infancy to adulthood, or (2) to mention or introduce a delicate matter for formal discussion.\r\n* **Formula:**\r\n  * *Nurture:* `Subject + bring up + [Child / Ward]`\r\n  * *Introduce Discourse:* `Subject + bring up + [Subject / Grievance / Motion]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The delegate brought about the contentious border dispute during the opening session.*\r\n  * ✔️ *The delegate **brought up** the contentious border dispute during the opening session.*\r\n  * ✔️ *The orphans were **brought up** in a remote rural monastery.*\r\n\r\n---\r\n\r\n#### Item 5: 'Bring Down' (Overthrow, Demolition or Reduction)\r\n* **Principle:** *Bring down* means (1) to overthrow or cause the fall of a government/regime, (2) to reduce prices, tariffs, or rates, or (3) to shoot down an aircraft.\r\n* **Formula:** `Subject + bring down + [Government / Regime / Prices / Inflation]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Widespread labor strikes eventually brought off the authoritarian administration.*\r\n  * ✔️ *Widespread labor strikes eventually **brought down** the authoritarian administration.*\r\n\r\n---\r\n\r\n### Category B: The 'Break' Family (Structural & Societal Rupture)\r\n\r\n#### Item 6: 'Break Out' (Spontaneous Eruption or Escape)\r\n* **Principle:** *Break out* is an intransitive phrasal verb meaning (1) to start suddenly and violently (used for war, epidemics, fires, or riots), or (2) to escape from detention (*break out of*).\r\n* **Formula:**\r\n  * `[War / Epidemic / Cholera / Riot / Fire] + break out`\r\n  * `Subject + break out + of + [Prison / Citadel]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *A catastrophic fire broke down in the historic library late last night.*\r\n  * ✔️ *A catastrophic fire **broke out** in the historic library late last night.*\r\n\r\n---\r\n\r\n#### Item 7: 'Break Down' (Mechanical, Emotional or Analytical Failure)\r\n* **Principle:** *Break down* signifies: (1) mechanical failure of vehicles or engines (intransitive), (2) emotional collapse involving weeping (intransitive), or (3) dividing data/costs into constituent parts for analysis (transitive).\r\n* **Formula:**\r\n  * *Mechanical / Emotional:* `[Machine / Person] + break down`\r\n  * *Analysis:* `Subject + break down + [Expenditure / Data / Complex Problem]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The ambassador broke off and wept during his testimony on the war.*\r\n  * ✔️ *The ambassador **broke down** and wept during his testimony on the war.*\r\n  * ✔️ *The treasury analyst **broke down the budgetary estimates** into discrete items.*\r\n\r\n---\r\n\r\n#### Item 8: 'Break Into' [Forcible Entry] vs. 'Break In' [Interruption]\r\n* **Principle:** *Break into* is transitive and takes a direct object denoting forcible, illegal entry into a structure; *Break in* is intransitive when denoting burglary without an explicit object, and means to interrupt when modifying speech.\r\n* **Formula:**\r\n  * *Forcible Entry:* `Burglar / Invader + break into + [Premises / Vault / Compound]`\r\n  * *Conversational Interruption:* `Subject + break in + [with a remark]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The saboteurs broke in the munitions depot under cover of darkness.*\r\n  * ✔️ *The saboteurs **broke into** the munitions depot under cover of darkness.*\r\n  * ✔️ *The junior counsel **broke in** to correct a procedural error.*\r\n\r\n---\r\n\r\n#### Item 9: 'Break Off' (Abrupt Termination of Ties)\r\n* **Principle:** *Break off* means to terminate negotiations, diplomatic relations, an engagement, or an utterance suddenly and definitively.\r\n* **Formula:** `Subject + break off + [Negotiations / Relations / Engagement / Speech]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Following the naval clash, both sovereign states broke with diplomatic talks.*\r\n  * ✔️ *Following the naval clash, both sovereign states **broke off** diplomatic talks.*\r\n\r\n---\r\n\r\n#### Item 10: 'Break With' (Severing Historical Ties or Tradition)\r\n* **Principle:** *Break with* governs a person, political party, established tradition, or historical convention when an individual repudiates or severs ties with that legacy.\r\n* **Formula:** `Subject + break with + [Tradition / Party / Past / Associates]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The radical philosopher broke off ancient scholastic dogma in his final treatise.*\r\n  * ✔️ *The radical philosopher **broke with** ancient scholastic dogma in his final treatise.*\r\n\r\n---\r\n\r\n### Category C: The 'Come' Family (Encounter, Occurrence & Recovery)\r\n\r\n#### Item 11: 'Come Across' (Unexpected Encounter + The Redundancy Trap)\r\n* **Principle:** *Come across* means to meet or discover by chance. Because unexpectedness is inherent to the verb, pairing *come across* with adverbs like *suddenly* or the preposition *with* creates an ungrammatical redundancy.\r\n* **Formula:** `Subject + come across + [Person / Manuscript / Artifact]  (Prohibited: suddenly / with)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *While cataloging the archive, I suddenly came across with a rare parchment.*  \r\n    *(Double error: 'suddenly' is redundant; 'with' is ungrammatical)*\r\n  * ✔️ *While cataloging the archive, I **came across a rare parchment**.*\r\n\r\n---\r\n\r\n#### Item 12: 'Come By' (Acquisition through Effort or Chance)\r\n* **Principle:** The transitive phrasal verb *come by* means to obtain, acquire, or get possession of something, especially something rare or difficult to procure.\r\n* **Formula:** `Subject + come by + [Wealth / Information / Rare Folio / Post]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *In wartime conditions, clean medical supplies are nearly impossible to come off.*\r\n  * ✔️ *In wartime conditions, clean medical supplies are nearly impossible to **come by**.*\r\n\r\n---\r\n\r\n#### Item 13: 'Come About' (Spontaneous Occurrence)\r\n* **Principle:** *Come about* is an intransitive phrasal verb meaning to happen, occur, or take place, particularly in response to an unexplained cause or sequence of events.\r\n* **Formula:** `How / Why + did + [Event / Crisis / Misfortune] + come about ?`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The inquiry sought to determine how such a security breach came through.*\r\n  * ✔️ *The inquiry sought to determine how such a security breach **came about**.*\r\n\r\n---\r\n\r\n#### Item 14: 'Come Off' (Successful Consummation vs. Detachment)\r\n* **Principle:** *Come off* means: (1) to take place successfully as planned (intransitive), or (2) to become detached or separated from a larger body.\r\n* **Formula:**\r\n  * *Success:* `[Scheme / Enterprise / Coup] + come off`\r\n  * *Detachment:* `[Button / Wheel / Hasp] + come off`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Despite months of logistical preparation, the daring breakout failed to come by.*\r\n  * ✔️ *Despite months of logistical preparation, the daring breakout failed to **come off**.*\r\n\r\n---\r\n\r\n#### Item 15: 'Come Through' (Survival of Peril or Fulfillment of Pledges)\r\n* **Principle:** *Come through* means (1) to survive a severe illness, battle, or crisis successfully, or (2) to deliver a promised resource in a time of acute need.\r\n* **Formula:**\r\n  * `Subject + come through + [Crisis / War / Surgery]`\r\n  * `Subject + come through + [with Financial Aid / Supplies]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The besieged garrison came about the winter without surrendering.*\r\n  * ✔️ *The besieged garrison **came through** the winter without surrendering.*\r\n\r\n---\r\n\r\n### Category D: The 'Call' Family (Demands, Summons & Cancellations)\r\n\r\n#### Item 16: 'Call Off' (Definitive Cancellation)\r\n* **Principle:** *Call off* means to cancel an event, strike, search, or planned military operation that has not yet concluded or begun; pairing it with *away* or *out* alters its meaning.\r\n* **Formula:** `Subject + call off + [Strike / Search / Summit / Campaign]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The trade union leadership agreed to call out the general strike after negotiations.*\r\n  * ✔️ *The trade union leadership agreed to **call off** the general strike after negotiations.*\r\n\r\n---\r\n\r\n#### Item 17: 'Call For' (Demanding or Warranting Action)\r\n* **Principle:** *Call for* means (1) to publicly demand or insist upon a response/investigation, or (2) to require or necessitate a specific trait (e.g., courage, precision).\r\n* **Formula:**\r\n  * *Demand:* `Public / Opposition + call for + [Resignation / Inquiry / Overhaul]`\r\n  * *Warrant:* `Situation + call for + [Extreme Caution / Bold Measures]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The escalating sovereign debt calls to an immediate budgetary emergency.*\r\n  * ✔️ *The escalating sovereign debt **calls for** an immediate budgetary emergency.*\r\n\r\n---\r\n\r\n#### Item 18: 'Call On / Upon' (Formal Invocation or Summons)\r\n* **Principle:** *Call on* or *call upon* means to make a formal, authoritative request or appeal to an individual or nation to perform a specific duty or speech.\r\n* **Formula:** `Subject + call upon / on + Person / State + to-Infinitive`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The President called for the assembly to ratify the defense pact without delay.*\r\n  * ✔️ *The President **called upon the assembly to ratify** the defense pact without delay.*\r\n\r\n---\r\n\r\n#### Item 19: 'Call At' [Location] vs. 'Call On' [Person]\r\n* **Principle:** A ship, train, or traveler *calls* **at** a port, station, or residence (a brief physical stop); a visitor *calls* **on** a person (a brief personal social visit).\r\n* **Formula:**\r\n  * *Location:* `Vessel / Person + call at + [Port / Station / House]`\r\n  * *Person:* `Subject + call on + [Person / Associate]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The merchant freighter will call on four Mediterranean ports during the voyage.*\r\n  * ✔️ *The merchant freighter will **call at** four Mediterranean ports during the voyage.*\r\n  * ❌ *I intend to call at the ambassador during my stay in the capital.*\r\n  * ✔️ *I intend to **call on** the ambassador during my stay in the capital.*\r\n\r\n---\r\n\r\n#### Item 20: 'Call Up' (Military Mobilization or Recollection)\r\n* **Principle:** *Call up* signifies: (1) summoning conscripts or reservists into active military service, or (2) bringing past memories into conscious recollection.\r\n* **Formula:** `Authority + call up + [Reservists / Conscripts / Troops]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *In response to the border incursion, the republic called out fifty thousand reservists.*\r\n  * ✔️ *In response to the border incursion, the republic **called up** fifty thousand reservists.*\r\n\r\n---\r\n\r\n### Category E: Three-Word Inseparable Phrasal Verbs\r\n\r\n#### Item 21: 'Catch Up With' (Closing a Distance or Past Consequence)\r\n* **Principle:** The three-part phrasal verb *catch up with* means (1) to reach the same level, speed, or quality as someone ahead, or (2) when past misdeeds finally overtake and affect someone negatively. It is strictly inseparable.\r\n* **Formula:** `Subject + catch up with + [Leader / Competitor / Past Transgressions]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *His financial malfeasance eventually caught with him after the federal audit.*\r\n  * ✔️ *His financial malfeasance eventually **caught up with him** after the federal audit.*\r\n\r\n---\r\n\r\n#### Item 22: 'Come Down With' (Contracting an Illness)\r\n* **Principle:** *Come down with* means to begin suffering from an infectious disease, fever, or physical ailment; it cannot be passivized or separated.\r\n* **Formula:** `Subject + come down with + [Influenza / Pneumonia / Malaria]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Half the diplomatic staff came down from a severe respiratory virus.*\r\n  * ✔️ *Half the diplomatic staff **came down with** a severe respiratory virus.*\r\n\r\n---\r\n\r\n#### Item 23: 'Cut Down On' (Reduction in Consumption or Expenditure)\r\n* **Principle:** *Cut down on* means to reduce the quantity, volume, or frequency of something consumed, spent, or used; it is an inseparable three-word phrasal verb.\r\n* **Formula:** `Subject + cut down on + [Expenditure / Tobacco / Luxury / Imports]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The austerity measures mandated that the department cut on its administrative overhead.*\r\n  * ✔️ *The austerity measures mandated that the department **cut down on** its administrative overhead.*\r\n\r\n---\r\n\r\n#### Item 24: 'Look Down On / Upon' (Contemptuous Disdain)\r\n* **Principle:** *Look down on* (or *upon*) means to regard a person, sociological group, or standard with condescension, arrogance, or contempt; it is strictly inseparable.\r\n* **Formula:** `Subject + look down on / upon + [Rival / Impoverished Class / Work]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The aristocratic elite looked down at the emerging merchant class.*\r\n  * ✔️ *The aristocratic elite **looked down on** the emerging merchant class.*\r\n\r\n---\r\n\r\n#### Item 25: 'Run Out Of' (Depletion of Supply)\r\n* **Principle:** *Run out of* means to exhaust completely one's existing supply of a vital provision, ammunition, time, or patience. The construction is strictly inseparable.\r\n* **Formula:** `Subject + run out of + [Ammunition / Rations / Time / Reserves]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defenders were forced to abandon the outpost when they ran out with artillery shells.*\r\n  * ✔️ *The defenders were forced to abandon the outpost when they **ran out of** artillery shells.*\r\n# Module 13: Phrasal Verbs & Verbal Particles\r\n**Curated Selection:** Items 26 to 50 of 150 Key Phrasal Verbs  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category F: The 'Put' Family (Postponement, Endurance & Extinguishment)\r\n\r\n#### Item 26: 'Put Off' (Postponement or Disgust)\r\n* **Principle:** *Put off* means: (1) to postpone or defer an engagement/action to a later date (transitive and separable), or (2) to repel or discourage someone by unpleasant behavior.\r\n* **Formula:** `Subject + put off + [Meeting / Trial / Decision / Inquirer]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The judicial magistrate decided to put away the trial until next term.*  \r\n    *(Confusing 'put away' [confine/store] with 'put off' [postpone])*\r\n  * ✔️ *The judicial magistrate decided to **put off the trial** until next term.*\r\n\r\n---\r\n\r\n#### Item 27: 'Put Out' (Extinguishing Combustion or Light)\r\n* **Principle:** *Put out* means to extinguish a fire, flame, candle, or cigarette; substituting *blow off* or *turn out* for open flames is non-standard.\r\n* **Formula:** `Subject + put out + [Fire / Blaze / Candle / Lantern]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The municipal firefighters labored for eight hours to put off the warehouse blaze.*\r\n  * ✔️ *The municipal firefighters labored for eight hours to **put out the warehouse blaze**.*\r\n\r\n---\r\n\r\n#### Item 28: 'Put Up With' (Toleration of Adversity or Insolence)\r\n* **Principle:** *Put up with* is a three-word inseparable phrasal verb meaning to tolerate, endure, or bear an unpleasant circumstance or difficult person without complaint.\r\n* **Formula:** `Subject + put up with + [Insolence / Delay / Hardship / Tyranny]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The presiding officer refused to put up to such insolence inside the chamber.*\r\n  * ✔️ *The presiding officer refused to **put up with such insolence** inside the chamber.*\r\n\r\n---\r\n\r\n#### Item 29: 'Put By / Away' (Frugal Financial Accumulation)\r\n* **Principle:** *Put by* (or *put away*) means to reserve, save, or set aside money, grain, or supplies systematically for future contingencies.\r\n* **Formula:** `Subject + put by / away + [Money / Grain / Rations] + for + [Future / Adversity]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Prudent households put out a fraction of their income for unforeseen emergencies.*\r\n  * ✔️ *Prudent households **put by a fraction of their income** for unforeseen emergencies.*\r\n\r\n---\r\n\r\n#### Item 30: 'Put Across / Over' (Lucid Articulation of Concepts)\r\n* **Principle:** *Put across* (or *put over*) means to convey, express, or communicate complex ideas, arguments, or policy objectives clearly and persuasively.\r\n* **Formula:** `Speaker + put across / over + [Argument / Ideas / Policy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The lecturer struggled to put down his revolutionary thesis to the pupils.*  \r\n    *(Confusing 'put down' [suppress/record] with 'put across' [communicate])*\r\n  * ✔️ *The lecturer struggled to **put across his revolutionary thesis** to the pupils.*\r\n\r\n---\r\n\r\n### Category G: The 'Look' Family (Investigation, Scrutiny & Vigilance)\r\n\r\n#### Item 31: 'Look Into' (Formal Investigation)\r\n* **Principle:** *Look into* is an inseparable transitive phrasal verb meaning to investigate, probe, or officially examine the facts of a crime, complaint, or crisis.\r\n* **Formula:** `Authority + look into + [Allegations / Corruption / Crisis / Crime]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *A high-level parliamentary committee was constituted to look for the security lapse.*\r\n  * ✔️ *A high-level parliamentary committee was constituted to **look into the security lapse**.*\r\n\r\n---\r\n\r\n#### Item 32: 'Look Out' (Urgent Vigilance against Imminent Peril)\r\n* **Principle:** *Look out* is an intransitive phrasal verb used imperatively to warn of immediate physical danger, or followed by *for* to denote watchful vigilance.\r\n* **Formula:**\r\n  * *Warning:* `Look out ! + [Imminent Danger]`\r\n  * *Vigilance:* `Subject + look out for + [Snipers / Traps / Opportunities]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sentries were ordered to look over snipers concealed in the tree line.*\r\n  * ✔️ *The sentries were ordered to **look out for snipers** concealed in the tree line.*\r\n\r\n---\r\n\r\n#### Item 33: 'Look Over' [Inspection] vs. 'Look Through' [Perusal]\r\n* **Principle:** *Look over* means to inspect, examine, or check something quickly; *Look through* implies reading, perusing, or scrutinizing documents from beginning to end.\r\n* **Formula:**\r\n  * `Subject + look over + [Draft / Aircraft / Premises]  (Quick Inspection)`\r\n  * `Subject + look through + [Dossier / Accounts / Ledgers]  (Perusal)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The attorney looked into the briefs while riding in the carriage.*\r\n  * ✔️ *The attorney **looked over the briefs** while riding in the carriage.*\r\n  * ✔️ *The forensic auditor **looked through the company ledgers** for discrepancies.*\r\n\r\n---\r\n\r\n#### Item 34: 'Look Up' (Reference Consultation vs. Improvement)\r\n* **Principle:** *Look up* means: (1) to search for specific reference data (words, figures, addresses) in a dictionary, catalog, or index (separable), or (2) when conditions/prospects are improving (intransitive).\r\n* **Formula:** `Subject + look up + [Word / Data / Coordinates] + in + [Reference Text]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The translator looked for the obscure idiom inside the Latin glossary.*\r\n  * ✔️ *The translator **looked up the obscure idiom** in the Latin glossary.*\r\n  * ✔️ *After the armistice was ratified, industrial prospects began to **look up**.*\r\n\r\n---\r\n\r\n#### Item 35: 'Look Up To' (Veneration and Respect)\r\n* **Principle:** *Look up to* is an inseparable three-word phrasal verb meaning to revere, admire, or hold someone in deep esteem as a role model.\r\n* **Formula:** `Subject + look up to + [Mentor / Leader / Predecessor]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The cadets look down upon the field marshal as their tactical exemplar.*  \r\n    *(Antonym error: 'look down on' denotes contempt)*\r\n  * ✔️ *The cadets **look up to the field marshal** as their tactical exemplar.*\r\n\r\n---\r\n\r\n### Category H: The 'Get' Family (Progression, Recovery & Evasion)\r\n\r\n#### Item 36: 'Get Along / On With' (Harmonious Social Relations)\r\n* **Principle:** *Get along with* (or *get on with*) means to exist in friendly, harmonious accord with colleagues or neighbors; it also means to continue making progress on a task.\r\n* **Formula:** `Subject + get along / on + with + [Colleagues / Neighbors / Task]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The prime minister found it impossible to get by his coalition partners.*\r\n  * ✔️ *The prime minister found it impossible to **get along with his coalition partners**.*\r\n\r\n---\r\n\r\n#### Item 37: 'Get Over' (Recovery from Shock, Loss or Illness)\r\n* **Principle:** *Get over* is an inseparable phrasal verb meaning to recover from an infectious disease, severe trauma, bereavement, or psychological shock.\r\n* **Formula:** `Subject + get over + [Illness / Bereavement / Shock / Setback]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The republic took a decade to get through the catastrophic civil war.*  \r\n    *(Confusing 'get through' [survive/finish] with 'get over' [recover from])*\r\n  * ✔️ *The republic took a decade to **get over the catastrophic civil war**.*\r\n\r\n---\r\n\r\n#### Item 38: 'Get By' (Subsistence on Limited Resources)\r\n* **Principle:** *Get by* is an intransitive phrasal verb meaning to manage, survive, or cope with minimal financial, material, or linguistic resources.\r\n* **Formula:** `Subject + get by + on / with + [Minimal Wage / Basic Supplies / Rations]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *During the economic depression, families struggled to get over on a single wage.*\r\n  * ✔️ *During the economic depression, families struggled to **get by on a single wage**.*\r\n\r\n---\r\n\r\n#### Item 39: 'Get Away With' (Escaping Retribution for Transgression)\r\n* **Principle:** The inseparable phrasal verb *get away with* means to escape detection, reprimand, or legal punishment for an illegal or improper action.\r\n* **Formula:** `Transgressor + get away with + [Fraud / Crime / Misconduct]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The corrupt magistrate believed he could get off with grand embezzlement.*\r\n  * ✔️ *The corrupt magistrate believed he could **get away with grand embezzlement**.*\r\n\r\n---\r\n\r\n#### Item 40: 'Get Round / Around' (Circumventing Legal Obstacles)\r\n* **Principle:** *Get round* (or *around*) means to find a clever, evasive, or indirect method of circumventing a statute, regulation, embargo, or logistical obstacle.\r\n* **Formula:** `Subject + get round / around + [Law / Sanctions / Obstacle / Tax]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The smuggling cartel devised an ingenious method to get by the maritime embargo.*\r\n  * ✔️ *The smuggling cartel devised an ingenious method to **get round the maritime embargo**.*\r\n\r\n---\r\n\r\n### Category I: The 'Pass' Family (Deception, Transition & Demise)\r\n\r\n#### Item 41: 'Pass Away' (Euphemistic Demise)\r\n* **Principle:** *Pass away* is an intransitive euphemistic phrasal verb meaning to die; substituting *pass by* or *pass off* is an error.\r\n* **Formula:** `Subject + pass away + [Peacefully / at an advanced age]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The revered statesman passed off surrounded by his immediate family.*\r\n  * ✔️ *The revered statesman **passed away surrounded by his immediate family**.*\r\n\r\n---\r\n\r\n#### Item 42: 'Pass Off As' (Fraudulent Impersonation)\r\n* **Principle:** *Pass off as* means to misrepresent deceptively an impostor, forgery, or inferior product as genuine; *Pass off* alone without *as* means to take place and conclude (*the ceremony passed off smoothly*).\r\n* **Formula:**\r\n  * `Swindler + pass off + Counterfeit / Impostor + as + Genuine Article`\r\n  * `Event + pass off + [Smoothly / Without incident]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The rogue dealer attempted to pass on the brass coin for pure gold.*\r\n  * ✔️ *The rogue dealer attempted to **pass off the brass coin as pure gold**.*\r\n  * ✔️ *The military parade **passed off without any procedural disruptions**.*\r\n\r\n---\r\n\r\n#### Item 43: 'Pass Out' (Loss of Consciousness vs. Distribution)\r\n* **Principle:** *Pass out* means: (1) to faint or lose physical consciousness (intransitive), or (2) to distribute rations, leaflets, or examinations (transitive).\r\n* **Formula:**\r\n  * *Faint:* `Subject + pass out + [from Heat / Shock / Dehydration]`\r\n  * *Distribute:* `Subject + pass out + [Rations / Ballots / Orders]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Overcome by the desert heat, the lead scout passed over.*\r\n  * ✔️ *Overcome by the desert heat, the lead scout **passed out**.*\r\n  * ✔️ *The clerk **passed out the revised agenda** to all delegates.*\r\n\r\n---\r\n\r\n#### Item 44: 'Pass By' (Overlooking or Physical Transit)\r\n* **Principle:** *Pass by* means (1) to traverse past a location without stopping, or (2) to ignore, disregard, or overlook someone for promotion or recognition.\r\n* **Formula:** `Authority + pass by + Candidate / Merit  (Overlook)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The veteran officer felt deeply aggrieved when he was passed out for promotion.*\r\n  * ✔️ *The veteran officer felt deeply aggrieved when he was **passed by for promotion**.*  \r\n    *(Or: **passed over for promotion**)*\r\n\r\n---\r\n\r\n#### Item 45: 'Pass Up' (Voluntary Forfeiture of Opportunity)\r\n* **Principle:** The transitive phrasal verb *pass up* means to decline, forego, or fail to exploit a rare advantage, offer, or opportunity.\r\n* **Formula:** `Subject + pass up + [Opportunity / Offer / Chance / Promotion]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The ambitious diplomat refused to pass off such a prestigious ambassadorship.*\r\n  * ✔️ *The ambitious diplomat refused to **pass up such a prestigious ambassadorship**.*\r\n\r\n---\r\n\r\n### Category J: The 'Fall' Family (Discord, Collapse & Deception)\r\n\r\n#### Item 46: 'Fall Out With' (Rupture of Friendship)\r\n* **Principle:** *Fall out with* means to quarrel, dispute, or sever harmonious relations with a companion or political ally; substituting *fall down with* is ungrammatical.\r\n* **Formula:** `Subject A + fall out + with + Subject B + [over / about + Issue]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The two founding partners fell off over the division of intellectual property.*\r\n  * ✔️ *The two founding partners **fell out over the division of intellectual property**.*\r\n\r\n---\r\n\r\n#### Item 47: 'Fall Through' (Abortive Failure of Plans)\r\n* **Principle:** *Fall through* is an intransitive phrasal verb used for schemes, negotiations, deals, or transactions that collapse and fail to be realized.\r\n* **Formula:** `[Deal / Merger / Enterprise / Treaty] + fall through`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *When credit dried up, the cross-border corporate acquisition fell down.*\r\n  * ✔️ *When credit dried up, the cross-border corporate acquisition **fell through**.*\r\n\r\n---\r\n\r\n#### Item 48: 'Fall Back On / Upon' (Emergency Recourse)\r\n* **Principle:** *Fall back on* (or *upon*) is an inseparable three-word phrasal verb meaning to resort to a secondary reserve, alternative scheme, or emergency financial cache when primary assets fail.\r\n* **Formula:** `Subject + fall back on / upon + [Reserves / Plan B / Family Wealth]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Having exhausted its foreign reserves, the state fell over emergency loans.*\r\n  * ✔️ *Having exhausted its foreign reserves, the state **fell back on emergency loans**.*\r\n\r\n---\r\n\r\n#### Item 49: 'Fall In With' (Concurrence with Ideas or Association with Factions)\r\n* **Principle:** *Fall in with* means: (1) to agree with, concur with, or accept someone else's views or plans, or (2) to fall into association with undesirable companions.\r\n* **Formula:** `Subject + fall in with + [Proposal / Strategy / Disreputable Associates]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foreign minister eventually fell out to the chancellor’s territorial proposal.*  \r\n    *(Confusing disagreement with concurrence)*\r\n  * ✔️ *The foreign minister eventually **fell in with the chancellor’s territorial proposal**.*\r\n\r\n---\r\n\r\n#### Item 50: 'Fall For' (Deception by Trickery vs. Romantic Infatuation)\r\n* **Principle:** The transitive phrasal verb *fall for* means: (1) to be duped, deceived, or taken in by a deception, ruse, or swindle, or (2) to experience intense romantic infatuation.\r\n* **Formula:**\r\n  * *Duped:* `Subject + fall for + [Ruse / Trick / Disinformation / Hoax]`\r\n  * *Infatuation:* `Subject + fall for + [Person]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The seasoned intelligence analyst fell into the adversary's crude deception.*\r\n  * ✔️ *The seasoned intelligence analyst **fell for the adversary's crude deception**.*\r\n  * ✔️ *He **fell for her charm** the moment they met at the summit.*\r\n# Module 13: Phrasal Verbs & Verbal Particles\r\n**Curated Selection:** Items 51 to 75 of 150 Key Phrasal Verbs  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category K: The 'Turn' Family (Rejection, Manifestation & Attendance)\r\n\r\n#### Item 51: 'Turn Down' (Rejection of Overtures or Proposals)\r\n* **Principle:** *Turn down* is a transitive separable phrasal verb meaning: (1) to reject, decline, or refuse a request, applicant, offer, or treaty proposal, or (2) to reduce volume, heat, or illumination.\r\n* **Formula:** `Subject + turn down + [Offer / Treaty / Nomination / Volume]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The senate turned away the peace treaty proposed by the envoy.*  \r\n    *(Confusing 'turn away' [refuse entry] with 'turn down' [reject an offer])*\r\n  * ✔️ *The senate **turned down the peace treaty** proposed by the envoy.*\r\n\r\n---\r\n\r\n#### Item 52: 'Turn Out' (Eventual Manifestation vs. Industrial Production)\r\n* **Principle:** *Turn out* signifies: (1) to prove to be in the eventual result (intransitive linking construction), (2) to manufacture or produce commodities in volume, or (3) to assemble in public for an event.\r\n* **Formula:**\r\n  * *Result:* `Subject + turn out + to be + Complement / [that-clause]`\r\n  * *Production:* `Factory + turn out + [Munitions / Vehicles / Goods]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The intercepted telegram turned off to be a deliberate fabrication.*\r\n  * ✔️ *The intercepted telegram **turned out to be** a deliberate fabrication.*\r\n  * ✔️ *The naval shipyard **turned out three destroyers** in six months.*\r\n\r\n---\r\n\r\n#### Item 53: 'Turn Up' (Unexpected Arrival or Discovery)\r\n* **Principle:** *Turn up* means: (1) to arrive or appear unexpectedly without prior notice (intransitive), or (2) to be discovered or recovered by chance after being lost.\r\n* **Formula:** `[Missing Person / Document / Emissary] + turn up + [unexpectedly]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The key witness turned out at the tribunal just as proceedings concluded.*\r\n  * ✔️ *The key witness **turned up at the tribunal** just as proceedings concluded.*\r\n\r\n---\r\n\r\n#### Item 54: 'Turn Away' (Refusal of Entry or Admission)\r\n* **Principle:** *Turn away* means to deny admittance, refuge, or physical entry to applicants, refugees, or spectators at an entrance or border checkpoint.\r\n* **Formula:** `Guards / Authority + turn away + [Refugees / Visitors / Applicants]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Border garrisons were commanded to turn down all undocumented migrants.*\r\n  * ✔️ *Border garrisons were commanded to **turn away all undocumented migrants**.*\r\n\r\n---\r\n\r\n#### Item 55: 'Turn Over' (Custodial Transfer or Revenue Velocity)\r\n* **Principle:** *Turn over* means: (1) to surrender or transfer custody of a captive, document, or suspect to official authorities, or (2) to generate an aggregate volume of business or gross commercial revenue.\r\n* **Formula:**\r\n  * *Custody:* `Authority + turn over + [Suspect / Evidence] + to + [Tribunal]`\r\n  * *Revenue:* `Enterprise + turn over + [Sum of Money] + annually`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The military police turned in the insurgent commander to the civilian magistrates.*\r\n  * ✔️ *The military police **turned over the insurgent commander** to the civilian magistrates.*\r\n\r\n---\r\n\r\n### Category L: The 'Hold' Family (Restraint, Delay & Resistance)\r\n\r\n#### Item 56: 'Hold Back' (Restraint of Force or Withholding Facts)\r\n* **Principle:** *Hold back* means: (1) to restrain physical advance, tears, or emotional outrage, or (2) to conceal or intentionally withhold vital evidence or intelligence.\r\n* **Formula:** `Subject + hold back + [Tears / Troops / Truth / Vital Intelligence]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defense witness was accused of holding off critical forensic evidence.*\r\n  * ✔️ *The defense witness was accused of **holding back critical forensic evidence**.*\r\n\r\n---\r\n\r\n#### Item 57: 'Hold Off' (Deferral of Attack or Resisting an Adversary)\r\n* **Principle:** *Hold off* means: (1) to postpone, delay, or wait before taking action, or (2) to successfully keep an attacking adversary or tempest at bay.\r\n* **Formula:**\r\n  * *Delay Action:* `Subject + hold off + [on Decision / from Attacking]`\r\n  * *Repel:* `Defenders + hold off + [Assailants / Invaders]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The vanguard company held out the enemy assault for three days until relief arrived.*  \r\n    *(Confusing intransitive 'hold out' with transitive 'hold off')*\r\n  * ✔️ *The vanguard company **held off the enemy assault** for three days until relief arrived.*\r\n\r\n---\r\n\r\n#### Item 58: 'Hold On' (Tenacious Endurance or Brief Pause)\r\n* **Principle:** *Hold on* is an intransitive phrasal verb meaning: (1) to wait a short duration, or (2) to maintain a tenacious physical or moral grip during extreme adversity.\r\n* **Formula:** `Subject + hold on + [despite heavy bombardment / in crisis]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The communications officer urged the remote outpost to hold up until dawn.*\r\n  * ✔️ *The communications officer urged the remote outpost to **hold on until dawn**.*\r\n\r\n---\r\n\r\n#### Item 59: 'Hold Out' (Enduring a Siege vs. Proffering Terms)\r\n* **Principle:** *Hold out* means: (1) to resist compromise or endure stubbornly against siege and starvation (intransitive), or (2) to offer or proffer hope, terms, or reconciliation (transitive).\r\n* **Formula:**\r\n  * *Siege Resistance:* `Garrison + hold out + [against Siege / Starvation]`\r\n  * *Offer:* `Subject + hold out + [Hope / Hand of Reconciliation / Terms]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The encircled citadel held up for seven months without freshwater.*\r\n  * ✔️ *The encircled citadel **held out for seven months** without freshwater.*\r\n  * ✔️ *The prime minister **held out an olive branch** to the secessionist leaders.*\r\n\r\n---\r\n\r\n#### Item 60: 'Hold Up' (Transit Detention vs. Armed Robbery)\r\n* **Principle:** *Hold up* signifies: (1) to delay, impede, or halt transit or progress (passive: *be held up*), or (2) to rob a bank, transport, or person using armed threats.\r\n* **Formula:**\r\n  * *Transit Delay:* `Storm / Accident + hold up + [Traffic / Convoy / Supply Train]`\r\n  * *Armed Robbery:* `Bandits + hold up + [Bank / Armored Carriage]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The medical supply convoy was held off for twelve hours at the mountain pass.*\r\n  * ✔️ *The medical supply convoy was **held up for twelve hours** at the mountain pass.*\r\n\r\n---\r\n\r\n### Category M: The 'Run' Family (Depletion, Collisions & Disparagement)\r\n\r\n#### Item 61: 'Run Down' (Systemic Disparagement vs. Vehicular Collision)\r\n* **Principle:** *Run down* means: (1) to criticize, disparage, or belittle someone persistently, (2) to strike down with a vehicle, or (3) when a battery or spring loses stored power.\r\n* **Formula:**\r\n  * *Belittle:* `Subject + run down + [Rival / Reputation / Institutions]`\r\n  * *Depletion:* `Battery / Clockwork + run down`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The editorial persistently ran off the credibility of the supreme bench.*\r\n  * ✔️ *The editorial persistently **ran down the credibility** of the supreme bench.*\r\n\r\n---\r\n\r\n#### Item 62: 'Run Into' (Fortuitous Encounters or Collision with Obstacles)\r\n* **Principle:** *Run into* is an inseparable transitive phrasal verb meaning: (1) to meet someone unexpectedly by chance, or (2) to collide physically with an obstacle or incur debts/difficulties.\r\n* **Formula:**\r\n  * *Chance Meeting:* `Subject + run into + [Old Associate / Diplomat]`\r\n  * *Incur Trouble:* `Subject + run into + [Heavy Debt / Obstacles / Turbulence]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The transport aircraft ran over severe atmospheric turbulence over the mountain range.*\r\n  * ✔️ *The transport aircraft **ran into severe atmospheric turbulence** over the mountain range.*\r\n\r\n---\r\n\r\n#### Item 63: 'Run Over' (Vehicular Crushing or Boundary Exceedance)\r\n* **Principle:** *Run over* means: (1) to drive a vehicle over a pedestrian or object, or (2) to exceed an allotted time limit, schedule, or physical container capacity.\r\n* **Formula:**\r\n  * *Vehicle:* `Vehicle / Driver + run over + [Pedestrian / Obstacle]`\r\n  * *Exceed Limit:* `Meeting / Speaker + run over + [Allotted Time / Schedule]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The opening keynote address ran down by twenty-five minutes.*\r\n  * ✔️ *The opening keynote address **ran over by twenty-five minutes**.*\r\n\r\n---\r\n\r\n#### Item 64: 'Run Through' (Rapid Rehearsal or Reckless Dissipation)\r\n* **Principle:** *Run through* means: (1) to examine, read, or rehearse a sequence rapidly, or (2) to squander, consume, or exhaust an inheritance or treasury recklessly.\r\n* **Formula:**\r\n  * *Rehearse:* `Commander + run through + [Operational Checklist / Plan]`\r\n  * *Squander:* `Heir + run through + [Fortune / Inheritance / Treasury]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The profligate monarch ran over his sovereign treasury in three years of war.*\r\n  * ✔️ *The profligate monarch **ran through his sovereign treasury** in three years of war.*\r\n\r\n---\r\n\r\n#### Item 65: 'Run Away With' (Loss of Emotional Control or Decisive Victory)\r\n* **Principle:** *Run away with* means: (1) to let imagination, emotion, or prejudice overpower rational judgment, or (2) to win a contest or election decisively with ease.\r\n* **Formula:** `Prejudice / Emotions + run away with + [Person]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *A prudent judge never permits his private prejudices to run away for his judgment.*\r\n  * ✔️ *A prudent judge never permits his private prejudices to **run away with his judgment**.*\r\n\r\n---\r\n\r\n### Category N: The 'Take' Family (Resemblance, Deception & Assumption)\r\n\r\n#### Item 66: 'Take After' (Hereditary Resemblance in Character or Form)\r\n* **Principle:** The inseparable phrasal verb *take after* means to resemble an older biological relative (parent or ancestor) in physical appearance, temperament, or intellect. It never takes *with*.\r\n* **Formula:** `Child / Offspring + take after + [Father / Mother / Ancestor]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *In her decisive judicial temperament, the young magistrate takes from her father.*\r\n  * ✔️ *In her decisive judicial temperament, the young magistrate **takes after her father**.*\r\n\r\n---\r\n\r\n#### Item 67: 'Take In' (Fraudulent Deception vs. Intellectual Comprehension)\r\n* **Principle:** *Take in* means: (1) to deceive, cheat, or dupe someone (often in passive: *be taken in*), or (2) to fully comprehend, absorb, and digest complex concepts.\r\n* **Formula:**\r\n  * *Deception:* `Swindler + take in + Victim  (Passive: be taken in by + Ruse)`\r\n  * *Comprehension:* `Subject + take in + [Lecture / Significance / Data]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The experienced treasury auditor was completely taken out by the counterfeit vouchers.*\r\n  * ✔️ *The experienced treasury auditor was completely **taken in by the counterfeit vouchers**.*\r\n\r\n---\r\n\r\n#### Item 68: 'Take Off' (Aviation Departure, Rapid Success & Removal)\r\n* **Principle:** *Take off* signifies: (1) an aircraft becoming airborne (intransitive), (2) a business enterprise, career, or idea achieving sudden exponential success, or (3) removing garments.\r\n* **Formula:**\r\n  * *Aeronautics:* `Aircraft + take off`\r\n  * *Rapid Success:* `Venture / Career / Economy + take off`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Following the tariff reductions, domestic manufacturing took up dramatically.*\r\n  * ✔️ *Following the tariff reductions, domestic manufacturing **took off dramatically**.*\r\n\r\n---\r\n\r\n#### Item 69: 'Take To' (Instinctive Affinity or Habitual Recourse)\r\n* **Principle:** *Take to* means: (1) to develop an immediate instinctive liking for an associate or setting, or (2) to adopt a habit, vice, or refuge (followed by a noun or gerund: *take to gambling*).\r\n* **Formula:** `Subject + take to + [Person / Setting / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Following his military retirement, the veteran took into organic farming.*\r\n  * ✔️ *Following his military retirement, the veteran **took to organic farming**.*\r\n\r\n---\r\n\r\n#### Item 70: 'Take Over' (Assumption of Control or Enterprise)\r\n* **Principle:** *Take over* means to assume control, governance, management, or ownership of a sovereign state, military command, or corporate enterprise.\r\n* **Formula:** `Subject + take over + [Command / Corporation / Governme
