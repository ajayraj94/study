nt / Duties]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The military junta took up the executive offices following the coup.*\r\n  * ✔️ *The military junta **took over the executive offices** following the coup.*\r\n\r\n---\r\n\r\n### Category O: The 'Set' Family (Initiation, Outset & Demarcation)\r\n\r\n#### Item 71: 'Set In' (Arrival of Protracted Seasons or Decay)\r\n* **Principle:** *Set in* is an intransitive phrasal verb meaning to begin and become firmly established (used specifically for seasons, weather, rot, infections, darkness, or economic depression).\r\n* **Formula:** `[Winter / Monsoon / Gangrene / Rot / Depression] + set in`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Before proper fortifications could be erected, the harsh Siberian winter set out.*\r\n  * ✔️ *Before proper fortifications could be erected, the harsh Siberian winter **set in**.*\r\n\r\n---\r\n\r\n#### Item 72: 'Set Off' (Detonation, Catalysis & Departure)\r\n* **Principle:** *Set off* means: (1) to detonate an explosive device, (2) to initiate or ignite a cascade of geopolitical or financial events, or (3) to commence a journey (*set off on a journey*).\r\n* **Formula:**\r\n  * *Explosion / Catalysis:* `Incident + set off + [Explosion / Panic / Riots / Chain Reaction]`\r\n  * *Journey:* `Travelers + set off + [for / on + Destination / Journey]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The unexpected assassination set up an irreversible chain of global alliances.*\r\n  * ✔️ *The unexpected assassination **set off an irreversible chain of global alliances**.*\r\n\r\n---\r\n\r\n#### Item 73: 'Set Out' (Undertaking an Enterprise with Specific Intent)\r\n* **Principle:** *Set out* means: (1) to embark on a long expedition or journey, or (2) to initiate a plan with an explicit objective (governing a to-infinitive: *set out to prove*).\r\n* **Formula:**\r\n  * *Journey:* `Expedition + set out + [for / on + Mission]`\r\n  * *Purpose:* `Subject + set out + to-Infinitive [reform / establish / prove]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The commission set in to draft a comprehensive civil code.*\r\n  * ✔️ *The commission **set out to draft a comprehensive civil code**.*\r\n\r\n---\r\n\r\n#### Item 74: 'Set Back' (Programmatic Retardation or Financial Cost)\r\n* **Principle:** *Set back* means: (1) to delay or impede the progress of an architectural, scientific, or political venture, or (2) colloquially, to cost an individual or treasury a substantial sum of money.\r\n* **Formula:** `Setback / Disaster + set back + [Schedule / Project / Reforms] + by + [Time Frame]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sudden destruction of the wind tunnel set off the aerospace program by three years.*\r\n  * ✔️ *The sudden destruction of the wind tunnel **set back the aerospace program by three years**.*\r\n\r\n---\r\n\r\n#### Item 75: 'Set Apart' (Distinctive Demarcation or Special Dedication)\r\n* **Principle:** *Set apart* means: (1) to distinguish, render unique, or mark as superior from peers (governing *from*), or (2) to reserve or consecrate funds/items for a specialized purpose.\r\n* **Formula:** `Trait / Quality + set + Subject + apart + from + [Peers / Contemporaries]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *His forensic precision sets him away from ordinary criminal investigators.*\r\n  * ✔️ *His forensic precision **sets him apart from ordinary criminal investigators**.*\r\n# Module 13: Phrasal Verbs & Verbal Particles\r\n**Curated Selection:** Items 76 to 100 of 150 Key Phrasal Verbs  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category P: The 'Bear' Family (Corroboration, Endurance & Relevance)\r\n\r\n#### Item 76: 'Bear Out' (Substantiation and Corroboration)\r\n* **Principle:** *Bear out* is a transitive separable phrasal verb meaning to confirm, substantiate, or verify the truth of an assertion, hypothesis, or alibi.\r\n* **Formula:** `Evidence / Data / Witness + bear out + [Hypothesis / Claim / Testimony]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The recovered satellite telemetry bore off the pilot’s version of the incident.*  \r\n    *(Confusing 'bear off' [win/carry away] with 'bear out' [corroborate])*\r\n  * ✔️ *The recovered satellite telemetry **bore out the pilot’s version** of the incident.*\r\n\r\n---\r\n\r\n#### Item 77: 'Bear With' (Patient Forbearance)\r\n* **Principle:** *Bear with* is an inseparable transitive phrasal verb meaning to be patient with someone during a delay, difficulty, or prolonged explanation.\r\n* **Formula:** `Subject + bear with + [Speaker / Delay / Inconvenience]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The magistrate asked the gallery to bear up him while he summarized the verdict.*\r\n  * ✔️ *The magistrate asked the gallery to **bear with him** while he summarized the verdict.*\r\n\r\n---\r\n\r\n#### Item 78: 'Bear Up' (Maintaining Fortitude in Adversity)\r\n* **Principle:** *Bear up* is an intransitive phrasal verb meaning to remain courageous, resilient, and cheerful under the pressure of severe bereavement, hardship, or illness.\r\n* **Formula:** `Subject + bear up + [under / against + Misfortune / Tragedy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Despite the devastating loss of the flagship, the admiral bore out remarkably well.*\r\n  * ✔️ *Despite the devastating loss of the flagship, the admiral **bore up remarkably well**.*\r\n\r\n---\r\n\r\n#### Item 79: 'Bear On / Upon' (Direct Relevance or Connection)\r\n* **Principle:** *Bear on* (or *upon*) is an inseparable phrasal verb meaning to have direct relevance, bearing, or significance to a specific question, policy, or case.\r\n* **Formula:** `Document / Fact + bear on / upon + [Investigation / Case / Question]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *These confidential cables do not bear to the charges brought before the tribunal.*\r\n  * ✔️ *These confidential cables do not **bear on the charges** brought before the tribunal.*\r\n\r\n---\r\n\r\n#### Item 80: 'Bear Away / Off' (Winning Honors or Trophies)\r\n* **Principle:** *Bear away* (or *bear off*) means to carry off as a winner, secure, or capture prizes, honors, or laurels in a contest or military engagement.\r\n* **Formula:** `Champion / Fleet + bear away / off + [Prize / Laurels / Trophies / Victory]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The veteran debater bore out all three gold medals at the forensic championship.*\r\n  * ✔️ *The veteran debater **bore away all three gold medals** at the forensic championship.*\r\n\r\n---\r\n\r\n### Category Q: The 'Carry' & 'Cast' Families (Execution, Momentum & Discard)\r\n\r\n#### Item 81: 'Carry Out' (Execution of Commands or Inquiries)\r\n* **Principle:** *Carry out* means to execute, fulfill, or perform a specific order, duty, forensic experiment, or operational mandate; substituting *carry on* distorts the meaning to mere continuation.\r\n* **Formula:** `Subject + carry out + [Orders / Investigation / Experiments / Threat]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The intelligence team was mandated to carry on a clandestine audit of the bank.*\r\n  * ✔️ *The intelligence team was mandated to **carry out a clandestine audit** of the bank.*\r\n\r\n---\r\n\r\n#### Item 82: 'Carry On' (Perseverance or Unchecked Behavior)\r\n* **Principle:** *Carry on* means: (1) to continue an activity or trade without interruption, or (2) to behave in an agitated, undisciplined, or foolish manner.\r\n* **Formula:** `Subject + carry on + [Business / Work / with Task]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Despite intense artillery fire, the telegraph unit carried off its transmissions.*\r\n  * ✔️ *Despite intense artillery fire, the telegraph unit **carried on its transmissions**.*\r\n\r\n---\r\n\r\n#### Item 83: 'Carry Away' (Overwhelmed by Intense Emotion)\r\n* **Principle:** *Carry away* means to deprive of self-control or fill with overwhelming enthusiasm or rage (predominantly in the passive: *be carried away*).\r\n* **Formula:** `Subject + be carried away + by + [Excitement / Anger / Passion]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The young orator was carried through by the cheering of the crowd and made reckless promises.*\r\n  * ✔️ *The young orator was **carried away by the cheering of the crowd** and made reckless promises.*\r\n\r\n---\r\n\r\n#### Item 84: 'Cast Aside / Away' (Repudiation of Principles or Allegiances)\r\n* **Principle:** *Cast aside* (or *cast away*) means to abandon, discard, or dismiss associates, scruples, or treaties as useless or inconvenient.\r\n* **Formula:** `Subject + cast aside / away + [Principles / Prejudices / Treaties / Allies]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *In his ruthless ascent to supreme power, the dictator cast down all constitutional restraints.*  \r\n    *(Confusing 'cast down' [depress] with 'cast aside' [discard])*\r\n  * ✔️ *In his ruthless ascent to supreme power, the dictator **cast aside all constitutional restraints**.*\r\n\r\n---\r\n\r\n#### Item 85: 'Cast Down' (Psychological Dejection)\r\n* **Principle:** *Cast down* means to depress, dispirit, or deject an individual (most frequently functioning predicatively as a participle: *downcast* or *cast down*).\r\n* **Formula:** `Subject + be / feel + cast down + by + [Failure / Bereavement / Defeat]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The envoy was deeply cast off by the rejection of his peace overtures.*\r\n  * ✔️ *The envoy was deeply **cast down by the rejection** of his peace overtures.*\r\n\r\n---\r\n\r\n### Category R: The 'Draw' Family (Drafting, Prolongation & Recourse)\r\n\r\n#### Item 86: 'Draw Up' (Formal Drafting vs. Vehicular Halt)\r\n* **Principle:** *Draw up* means: (1) to compose, formulate, and write out a formal legal contract, treaty, or battle plan, or (2) when a vehicle halts at a specific spot.\r\n* **Formula:**\r\n  * *Drafting:* `Subject + draw up + [Contract / Treaty / Protocol / Blueprint]`\r\n  * *Vehicular Halt:* `Vehicle + draw up + [at the curb / before the gates]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The plenipotentiaries drew out an interim armistice agreement late Tuesday evening.*  \r\n    *(Confusing 'draw out' [prolong] with 'draw up' [draft])*\r\n  * ✔️ *The plenipotentiaries **drew up an interim armistice agreement** late Tuesday evening.*\r\n\r\n---\r\n\r\n#### Item 87: 'Draw Out' (Protraction vs. Eliciting Confidence)\r\n* **Principle:** *Draw out* means: (1) to prolong or lengthen a debate, proceeding, or process unnecessarily, or (2) to encourage a timid, reserved person to speak openly.\r\n* **Formula:**\r\n  * *Prolong:* `Subject + draw out + [Proceedings / Debate / Agony]`\r\n  * *Encourage:* `Mentor + draw out + [Timid Youth / Witness]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The opposition filibuster drew up the budgetary deliberations for three weeks.*\r\n  * ✔️ *The opposition filibuster **drew out the budgetary deliberations** for three weeks.*\r\n\r\n---\r\n\r\n#### Item 88: 'Draw On / Upon' (Exploitation of Accumulated Reserves)\r\n* **Principle:** *Draw on* (or *upon*) is an inseparable phrasal verb meaning to utilize, tap, or exploit an accumulated reserve of wealth, knowledge, memory, or fortitude.\r\n* **Formula:** `Subject + draw on / upon + [Reserves / Experience / Knowledge / Credit]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *In formulating the defense strategy, the marshal drew in his thirty years of border warfare.*\r\n  * ✔️ *In formulating the defense strategy, the marshal **drew on his thirty years of border warfare**.*\r\n\r\n---\r\n\r\n#### Item 89: 'Draw In' (Seasonal Shortening vs. Entrapment)\r\n* **Principle:** *Draw in* means: (1) when daylight hours become progressively shorter in autumn/winter (intransitive), or (2) to entice or lure someone into an intrigue or trap.\r\n* **Formula:**\r\n  * *Seasonal:* `The days / daylight + draw in`\r\n  * *Entrap:* `Conspirators + draw + Victim + in / into + [Intrigue / Scheme]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *As midwinter approached, the nights drew out dramatically across the northern plains.*  \r\n    *(Antonym error: 'draw out' means to lengthen, as in spring)*\r\n  * ✔️ *As midwinter approached, the days **drew in dramatically** across the northern plains.*\r\n\r\n---\r\n\r\n#### Item 90: 'Draw Back' (Tactical Retreat or Disavowal)\r\n* **Principle:** *Draw back* is an intransitive phrasal verb meaning to retreat, recoil in horror, or withdraw from an agreement, undertaking, or battle line.\r\n* **Formula:** `Subject + draw back + [from Abyss / Undertaking / Advance]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Having pledged sovereign military aid, the empire could not draw off without disgrace.*\r\n  * ✔️ *Having pledged sovereign military aid, the empire could not **draw back without disgrace**.*\r\n\r\n---\r\n\r\n### Category S: The 'Give' Family (Capitulation, Emission & Depletion)\r\n\r\n#### Item 91: 'Give In' (Capitulation under Relentless Pressure)\r\n* **Principle:** *Give in* is an intransitive phrasal verb meaning to surrender, yield, or submit to unrelenting pressure, siege, or superior demands; substituting *give up* (which is transitive) without an object is often colloquial.\r\n* **Formula:** `Subject + give in + [to Demands / to Adversary]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *After twelve days of strikes, the municipal council finally gave out to union demands.*  \r\n    *(Confusing 'give out' [deplete/distribute] with 'give in' [capitulate])*\r\n  * ✔️ *After twelve days of strikes, the municipal council finally **gave in to union demands**.*\r\n\r\n---\r\n\r\n#### Item 92: 'Give Up' (Abandonment of Habits, Hope or Pursuit)\r\n* **Principle:** *Give up* is a transitive separable phrasal verb meaning to cease, renounce, or abandon an effort, vice, claim, or pursuit (followed by a noun or gerund: *give up smoking*).\r\n* **Formula:** `Subject + give up + [Hope / Struggle / Habit / Claim / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The search and rescue teams refused to give in all hope of finding survivors.*\r\n  * ✔️ *The search and rescue teams refused to **give up all hope** of finding survivors.*\r\n\r\n---\r\n\r\n#### Item 93: 'Give Off' (Emission of Gas, Odor or Radiation)\r\n* **Principle:** *Give off* means to emit, discharge, or send out gas, vapor, heat, light, radiation, or noxious odors; substituting *give away* or *give out* in this physiological/chemical sense is an error.\r\n* **Formula:** `Substance + give off + [Fumes / Radiation / Scent / Heat]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The decomposing cargo gave away a nauseating chemical stench.*\r\n  * ✔️ *The decomposing cargo **gave off a nauseating chemical stench**.*\r\n\r\n---\r\n\r\n#### Item 94: 'Give Away' (Inadvertent Betrayal vs. Gratuities)\r\n* **Principle:** *Give away* means: (1) to betray a secret, identity, or classified location unintentionally, or (2) to present prizes or distribute gifts gratuitously.\r\n* **Formula:**\r\n  * *Betray:* `Subject / Clue + give away + [Secret / Position / Identity]`\r\n  * *Present:* `Authority + give away + [Medals / Prizes / Wealth]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *A muffled cough from the dark corridor gave out the sentry's position to the enemy.*\r\n  * ✔️ *A muffled cough from the dark corridor **gave away the sentry's position** to the enemy.*\r\n\r\n---\r\n\r\n#### Item 95: 'Give Out' (Physical Exhaustion vs. Official Distribution)\r\n* **Principle:** *Give out* means: (1) to become completely exhausted, depleted, or broken down (intransitive: used for fuel, patience, knees, or hearts), or (2) to distribute circulars or reports to a populace (transitive).\r\n* **Formula:**\r\n  * *Depletion:* `[Ammunition / Fuel / Strength / Patience] + give out`\r\n  * *Distribution:* `Subject + give out + [Rations / Manifestos / Ballots]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *On the tenth day of the trek across the dunes, their freshwater supplies gave up.*\r\n  * ✔️ *On the tenth day of the trek across the dunes, their freshwater supplies **gave out**.*\r\n\r\n---\r\n\r\n### Category T: The 'Go' Family (Scrutiny, Explosion & Repudiation)\r\n\r\n#### Item 96: 'Go Through' (Enduring Hardship vs. Legislative Passage)\r\n* **Principle:** *Go through* means: (1) to experience, suffer, or endure profound hardships/trauma, (2) to search or examine a bag/ledger minutely, or (3) when a bill/treaty is formally approved by a legislature.\r\n* **Formula:**\r\n  * *Endurance:* `Subject + go through + [Ordeal / War / Crisis]`\r\n  * *Legislative Passage:* `[Bill / Treaty / Budget] + go through`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The civilian populace went over unspeakable horrors during the aerial siege.*\r\n  * ✔️ *The civilian populace **went through unspeakable horrors** during the aerial siege.*\r\n\r\n---\r\n\r\n#### Item 97: 'Go Over' (Systematic Revision and Inspection)\r\n* **Principle:** *Go over* is an inseparable phrasal verb meaning to inspect, examine, study, or review written documents, calculations, or details carefully.\r\n* **Formula:** `Auditor / Lawyer + go over + [Dossier / Accounts / Clauses]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The chief prosecutor went across the deposition to identify inconsistencies.*\r\n  * ✔️ *The chief prosecutor **went over the deposition** to identify inconsistencies.*\r\n\r\n---\r\n\r\n#### Item 98: 'Go Off' (Detonation, Alarms & Spoilage)\r\n* **Principle:** *Go off* signifies: (1) an explosive device detonating (intransitive), (2) an alarm or siren sounding loudly, or (3) food/milk spoiling or decomposing.\r\n* **Formula:** `[Bomb / Mine / Alarm / Milk] + go off`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The anti-tank mine went out the instant the tread crossed the perimeter.*\r\n  * ✔️ *The anti-tank mine **went off the instant the tread crossed** the perimeter.*\r\n\r\n---\r\n\r\n#### Item 99: 'Go Back On' (Renege on Oaths or Pledges)\r\n* **Principle:** *Go back on* is a three-word inseparable phrasal verb meaning to fail to keep, break, or renege on a solemn promise, pledge, contract, or word of honor.\r\n* **Formula:** `Subject + go back on + [Word / Pledge / Treaty / Promise]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The regent was condemned for going away from his constitutional oath.*\r\n  * ✔️ *The regent was condemned for **going back on his constitutional oath**.*\r\n\r\n---\r\n\r\n#### Item 100: 'Go Along With' (Concurrence with Policies or Proposals)\r\n* **Principle:** *Go along with* is a three-word inseparable phrasal verb meaning to agree with, concur with, or acquiesce in a consensus, policy, or recommendation.\r\n* **Formula:** `Subject + go along with + [Decision / Policy / Recommendation / Colleague]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The finance minister refused to go down with the emergency borrowing plan.*\r\n  * ✔️ *The finance minister refused to **go along with the emergency borrowing plan**.*\r\n# Module 13: Phrasal Verbs & Verbal Particles\r\n**Curated Selection:** Items 101 to 125 of 150 Key Phrasal Verbs  \r\n**Question Output Target:** 25 Diagnostic Questions (1:1 High-Density Testing)\r\n\r\n---\r\n\r\n### Category U: The 'Stand' Family (Loyalty, Representation & Defiance)\r\n\r\n#### Item 101: 'Stand By' (Steadfast Loyalty vs. Inactive Readiness)\r\n* **Principle:** *Stand by* means: (1) to support, remain loyal to, or defend someone during acute adversity, (2) to adhere faithfully to an earlier verdict or promise, or (3) to remain in a state of alert readiness without intervening directly.\r\n* **Formula:**\r\n  * *Loyalty:* `Subject + stand by + [Associate / Ally / Principle / Decision]`\r\n  * *Readiness:* `Subject + stand by + [to assist / to intervene]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The prime minister refused to stand for his disgraced cabinet colleague.*  \r\n    *(Confusing 'stand for' [represent/tolerate] with 'stand by' [support])*\r\n  * ✔️ *The prime minister refused to **stand by his disgraced cabinet colleague**.*\r\n  * ✔️ *The armored divisions were ordered to **stand by** along the frontier.*\r\n\r\n---\r\n\r\n#### Item 102: 'Stand For' (Symbolic Representation vs. Toleration)\r\n* **Principle:** *Stand for* means: (1) to symbolize, denote, or represent an idea or acronym, or (2) in negative declarative constructions, to endure or tolerate insolence or misconduct (*will not stand for*).\r\n* **Formula:**\r\n  * *Symbolize:* `Abbreviation / Emblem + stand for + [Concept / Organization]`\r\n  * *Tolerate:* `Subject + will not + stand for + [Insolence / Disobedience / Fraud]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The presiding magistrate warned that he would not stand by such contempt in his court.*\r\n  * ✔️ *The presiding magistrate warned that he would not **stand for such contempt** in his court.*\r\n  * ✔️ *The balance scales in the mural **stand for impartial justice**.*\r\n\r\n---\r\n\r\n#### Item 103: 'Stand Out' (Conspicuous Prominence)\r\n* **Principle:** *Stand out* is an intransitive phrasal verb meaning to be distinctly conspicuous, prominent, or clearly superior in quality compared to contemporaries or surroundings.\r\n* **Formula:** `Subject + stand out + [from Peers / against Background / in Talent]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Her analytical acumen stood up from among the junior research fellows.*\r\n  * ✔️ *Her analytical acumen **stood out from among the junior research fellows**.*\r\n\r\n---\r\n\r\n#### Item 104: 'Stand Up To' (Courageous Confrontation)\r\n* **Principle:** The three-word inseparable phrasal verb *stand up to* means: (1) to confront or resist an aggressor, bully, or tyrant boldly without capitulating, or (2) when materials withstand harsh physical conditions.\r\n* **Formula:** `Subject + stand up to + [Aggressor / Tyrant / Scrutiny / Wear and Tear]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Small sovereign nations must stand up with imperial expansionism.*\r\n  * ✔️ *Small sovereign nations must **stand up to imperial expansionism**.*\r\n\r\n---\r\n\r\n#### Item 105: 'Stand In For' (Temporary Deputization)\r\n* **Principle:** *Stand in for* is a three-word inseparable phrasal verb meaning to act as a temporary proxy, deputy, or substitute for someone during their absence.\r\n* **Formula:** `Deputy + stand in for + [Superior / Colleague / Representative]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The vice-chancellor was summoned to stand for the rector during the convocation.*\r\n  * ✔️ *The vice-chancellor was summoned to **stand in for the rector** during the convocation.*\r\n\r\n---\r\n\r\n### Category V: The 'Keep' Family (Adherence, Restraint & Pacing)\r\n\r\n#### Item 106: 'Keep Up With' (Maintaining Symmetrical Pace)\r\n* **Principle:** *Keep up with* is an inseparable three-word phrasal verb meaning to move at the same speed, maintain the same level of progress, or remain abreast of fast-moving events.\r\n* **Formula:** `Subject + keep up with + [Leader / Developments / Inflation / Pace]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The legacy manufacturer struggled to keep with technological innovations.*\r\n  * ✔️ *The legacy manufacturer struggled to **keep up with technological innovations**.*\r\n\r\n---\r\n\r\n#### Item 107: 'Keep Back' (Concealment of Intelligence or Restraint)\r\n* **Principle:** *Keep back* means: (1) to withhold, reserve, or conceal vital information, or (2) to physically restrain a crowd from advancing beyond a perimeter.\r\n* **Formula:** `Subject + keep back + [Information / Evidence / Truth / Crowds]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defector kept down vital operational details during the debriefing.*\r\n  * ✔️ *The defector **kept back vital operational details** during the debriefing.*\r\n\r\n---\r\n\r\n#### Item 108: 'Keep To' (Strict Adherence to Paths or Pledges)\r\n* **Principle:** *Keep to* means to adhere strictly to a schedule, path, topic, speed limit, or promise without deviating.\r\n* **Formula:** `Subject + keep to + [Schedule / Agreement / Topic / Path]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defense counsel urged the witness to keep on the immediate facts.*  \r\n    *(Confusing 'keep on' [continue] with 'keep to' [restrict oneself to])*\r\n  * ✔️ *The defense counsel urged the witness to **keep to the immediate facts**.*\r\n\r\n---\r\n\r\n#### Item 109: 'Keep Off' (Avoidance of Physical Intrusion)\r\n* **Principle:** *Keep off* means to stay at a distance from a physical surface or subject, or to prevent an element (such as rain, heat, or enemies) from touching or encroaching.\r\n* **Formula:**\r\n  * `Subject + keep off + [Grass / Property / Subject]`\r\n  * `Tarp / Cloak + keep off + [Rain / Elements]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sentries posted placards warning trespassers to keep away the perimeter.*\r\n  * ✔️ *The sentries posted placards warning trespassers to **keep off the perimeter**.*\r\n\r\n---\r\n\r\n#### Item 110: 'Keep At' (Persistent Application to Arduous Tasks)\r\n* **Principle:** The transitive phrasal verb *keep at* means to persevere tenaciously with an arduous task or difficult intellectual problem without relenting.\r\n* **Formula:** `Subject + keep at + [Problem / Studies / Task / Labors]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *If you keep up the mathematical cipher long enough, you will decode it.*\r\n  * ✔️ *If you **keep at the mathematical cipher** long enough, you will decode it.*\r\n\r\n---\r\n\r\n### Category W: The 'See' Family (Discernment, Execution & Farewell)\r\n\r\n#### Item 111: 'See Through' (Penetrating Deception vs. Sustaining to Completion)\r\n* **Principle:** *See through* means: (1) to discern the true deceptive nature of an impostor, ruse, or hypocrisy (inseparable), or (2) to provide resources/courage sufficient to support someone until the end of an ordeal (separable).\r\n* **Formula:**\r\n  * *Penetrate Deception:* `Subject + see through + [Deception / Guise / Falsehood]`\r\n  * *Sustain to the End:* `Resource / Courage + see + Person + through + [Crisis]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The seasoned diplomat failed to see across the enemy's duplicitous overtures.*\r\n  * ✔️ *The seasoned diplomat failed to **see through the enemy's duplicitous overtures**.*\r\n  * ✔️ *His emergency savings **saw him through the prolonged financial crisis**.*\r\n\r\n---\r\n\r\n#### Item 112: 'See To' (Assuming Operational Responsibility)\r\n* **Principle:** *See to* is an inseparable transitive phrasal verb meaning to attend to, arrange for, or take personal responsibility for executing a task.\r\n* **Formula:** `Subject + see to + [Arrangements / Repairs / Logistics / Matter]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The quartermaster promised to see for the supply requisitions before dusk.*\r\n  * ✔️ *The quartermaster promised to **see to the supply requisitions** before dusk.*\r\n\r\n---\r\n\r\n#### Item 113: 'See Off' (Escorting at Departure vs. Repelling Adversaries)\r\n* **Principle:** *See off* means: (1) to accompany a departing guest or traveler to an airport, station, or port to bid farewell, or (2) to defeat, repel, or outlast a challenger or invader.\r\n* **Formula:**\r\n  * *Farewell:* `Host + see + Traveler + off + [at the station]`\r\n  * *Repel:* `Defenders + see off + [Invaders / Rivals / Challengers]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The garrison successfully saw out the marauding cavalry.*\r\n  * ✔️ *The garrison successfully **saw off the marauding cavalry**.*\r\n  * ✔️ *The delegation went to the rail terminal to **see the foreign envoy off**.*\r\n\r\n---\r\n\r\n#### Item 114: 'Look Back On / Upon' (Retrospective Reflection)\r\n* **Principle:** *Look back on* (or *upon*) is an inseparable three-word phrasal verb meaning to reflect retrospectively upon past historical periods, memories, or actions.\r\n* **Formula:** `Subject + look back on / upon + [Past / Career / Youth / History]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *In his memoirs, the field marshal looked back at his early campaigns with pride.*\r\n  * ✔️ *In his memoirs, the field marshal **looked back on his early campaigns** with pride.*\r\n\r\n---\r\n\r\n#### Item 115: 'Look Out For' (Protective Vigilance)\r\n* **Principle:** *Look out for* means: (1) to maintain protective vigilance over someone's welfare and interests, or (2) to watch actively for the appearance of someone or something.\r\n* **Formula:** `Subject + look out for + [Comrade / Pitfalls / Signs]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *A senior diplomat must always look over the career interests of his staff.*\r\n  * ✔️ *A senior diplomat must always **look out for the career interests of his staff**.*\r\n\r\n---\r\n\r\n### Category X: The 'Lay' Family (Confinement, Redundancy & Blueprinting)\r\n\r\n#### Item 116: 'Lay Off' (Economic Termination vs. Cessation of Nuisance)\r\n* **Principle:** *Lay off* means: (1) to terminate the employment of workers due to lack of production or industrial recession (separable), or (2) colloquially/informally, to cease harassing someone.\r\n* **Formula:** `Enterprise + lay off + [Workers / Factory Hands / Staff]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Due to supply chain disruptions, the shipyard laid out twelve hundred welders.*  \r\n    *(Confusing 'lay out' [spend/arrange] with 'lay off' [terminate employment])*\r\n  * ✔️ *Due to supply chain disruptions, the shipyard **laid off twelve hundred welders**.*\r\n\r\n---\r\n\r\n#### Item 117: 'Lay Down' (Surrendering Arms vs. Prescribing Statutes)\r\n* **Principle:** *Lay down* means: (1) to surrender weapons or arms officially, (2) to formulate, establish, or prescribe formal regulations or principles, or (3) to sacrifice one's life.\r\n* **Formula:**\r\n  * *Surrender:* `Soldiers / Insurgents + lay down + [Arms / Weapons]`\r\n  * *Prescribe:* `Charter / Law + lay down + [Rules / Principles / Conditions]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defeated garrison agreed to lay away their arms at noon.*\r\n  * ✔️ *The defeated garrison agreed to **lay down their arms** at noon.*\r\n  * ✔️ *The Geneva Conventions **lay down the minimum standards** for humane treatment.*\r\n\r\n---\r\n\r\n#### Item 118: 'Lay Up' (Medical Confinement or Vessel Decommissioning)\r\n* **Principle:** *Lay up* means: (1) to confine someone to bed or inactivity through illness or injury (predominantly passive: *be laid up*), or (2) to take a ship or aircraft out of active service for dry-docking or storage.\r\n* **Formula:** `Subject + be laid up + with + [Influenza / Gout / Injury]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The chief engineer was laid off with severe bronchial pneumonia.*  \r\n    *(Grammatically implies he was fired for having pneumonia)*\r\n  * ✔️ *The chief engineer was **laid up with severe bronchial pneumonia**.*\r\n\r\n---\r\n\r\n#### Item 119: 'Lay Out' (Lavish Expenditure vs. Structural Arrangement)\r\n* **Principle:** *Lay out* means: (1) to expend or disburse large sums of capital/money, or (2) to arrange, design, or blueprint a city, garden, or thesis systematically.\r\n* **Formula:**\r\n  * *Expenditure:* `Subject + lay out + [Vast Sums / Fortunes] + on + [Venture]`\r\n  * *Design:* `Architect + lay out + [City / Blueprint / Argument]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The municipal authorities laid down millions on the construction of the viaduct.*\r\n  * ✔️ *The municipal authorities **laid out millions on the construction** of the viaduct.*\r\n  * ✔️ *The urban planner **laid out the civic district** on a strict grid.*\r\n\r\n---\r\n\r\n#### Item 120: 'Lay By' (Prudent Accumulation for Contingencies)\r\n* **Principle:** The formal or literary phrasal verb *lay by* means to save, store, or amass supplies or funds systematically for future necessity.\r\n* **Formula:** `Subject + lay by + [Grain / Provisions / Capital] + for + [Contingency]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *During the harvest, the farmers laid up a portion of the grain for famine years.*\r\n  * ✔️ *During the harvest, the farmers **laid by a portion of the grain** for famine years.*\r\n\r\n---\r\n\r\n### Category Y: The 'Make' Family (Decipherment, Compensation & Usurpation)\r\n\r\n#### Item 121: 'Make Out' (Deciphering Ambiguity or False Pretense)\r\n* **Principle:** *Make out* means: (1) to manage with difficulty to see, hear, or decipher something faint, indistinct, or encrypted, or (2) to write out a bank check or official voucher.\r\n* **Formula:** `Subject + cannot + make out + [Cipher / Handwriting / Silhouette / Meaning]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *In the heavy coastal fog, the sentry could not make up the approaching dreadnought.*\r\n  * ✔️ *In the heavy coastal fog, the sentry could not **make out the approaching dreadnought**.*\r\n\r\n---\r\n\r\n#### Item 122: 'Make Up For' (Restitution for Loss or Deficiency)\r\n* **Principle:** *Make up for* is a three-word inseparable phrasal verb meaning to compensate for, atone for, or balance out an injury, delay, deficiency, or lost opportunity.\r\n* **Formula:** `Subject + make up for + [Lost Time / Negligence / Shortfall / Deficit]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Unprecedented agricultural yields made over for the manufacturing slump.*\r\n  * ✔️ *Unprecedented agricultural yields **made up for the manufacturing slump**.*\r\n\r\n---\r\n\r\n#### Item 123: 'Make Away / Off With' (Larcenous Flight)\r\n* **Principle:** *Make away with* (or *make off with*) is a three-word inseparable phrasal verb meaning to steal, purloin, and abscond with property, treasury assets, or documents.\r\n* **Formula:** `Thief / Conspirator + make away / off with + [Treasury / Plunder / Secrets]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The renegade clerk made up with the sovereign's private cipher books.*\r\n  * ✔️ *The renegade clerk **made away with the sovereign's private cipher books**.*\r\n\r\n---\r\n\r\n#### Item 124: 'Make Over' (Formal Legal Conveyance or Total Renovation)\r\n* **Principle:** *Make over* means: (1) to legally transfer title, estate, or property to another individual (*make over to*), or (2) to remodel, renovate, or radically transform the appearance of an entity.\r\n* **Formula:** `Subject + make over + [Estate / Property / Assets] + to + [Heir / Trustee]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The industrialist made out his entire landed estate to the municipal university.*  \r\n    *(Confusing 'make out' [write a check/discern] with 'make over' [legally convey])*\r\n  * ✔️ *The industrialist **made over his entire landed estate** to the municipal university.*\r\n\r\n---\r\n\r\n#### Item 125: 'Make Up' (Fabrication, Reconciliation & Composition)\r\n* **Principle:** *Make up* signifies: (1) to invent an untruth or fiction, (2) to reconcile differences following an altercation, or (3) to constitute or comprise a fraction of an aggregate whole (passive: *be made up of*).\r\n* **Formula:**\r\n  * *Fabrication:* `Subject + make up + [Alibi / Story / Lie]`\r\n  * *Reconciliation:* `Parties + make up + [after a quarrel]`\r\n  * *Composition:* `Elements + make up + [Whole]  (Passive: be made up of)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The captured spy made out an elaborate alibi to mislead interrogators.*\r\n  * ✔️ *The captured spy **made up an elaborate alibi** to mislead interrogators.*\r\n  * ✔️ *Foreign nationals **make up fifteen percent of the defense corps**.*\r\n# Module 13: Phrasal Verbs & Verbal Particles\r\n**Curated Selection:** Items 126 to 150 of 150 Key Phrasal Verbs *(Final Series)*  \r\n**Question Output Target:** 25 Diagnostic Questions (Completing 150 Diagnostic Questions for Module 13)\r\n\r\n---\r\n\r\n### Category Z: The 'Do' & Military Formations Families\r\n\r\n#### Item 126: 'Do Away With' (Systemic Abolition or Liquidation)\r\n* **Principle:** *Do away with* is a three-word inseparable phrasal verb meaning to abolish, eliminate, repeal, or eradicate an obsolete law, custom, privilege, or corrupt practice.\r\n* **Formula:** `Authority / Reformer + do away with + [Taxes / Monarchy / Privileges / Practice]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The constitutional assembly resolved to do out with hereditary titles.*\r\n  * ✔️ *The constitutional assembly resolved to **do away with hereditary titles**.*\r\n\r\n---\r\n\r\n#### Item 127: 'Do Without' (Managing in the Absence of Necessities)\r\n* **Principle:** *Do without* means to manage, survive, or function in the complete absence of a person, resource, luxury, or necessity (inseparable).\r\n* **Formula:** `Subject + do without + [Luxuries / Foreign Subsidies / Escort]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *In times of naval blockade, the island garrison had to do away freshwater reserves.*  \r\n    *(Confusing 'do away with' [abolish] with 'do without' [manage in absence of])*\r\n  * ✔️ *In times of naval blockade, the island garrison had to **do without freshwater reserves**.*\r\n\r\n---\r\n\r\n#### Item 128: 'Fall Back' (Tactical Military Retreat)\r\n* **Principle:** *Fall back* is an intransitive phrasal verb denoting an orderly, planned withdrawal or tactical retreat by armed forces when confronted by overwhelming numbers. (Distinct from the three-word *fall back on*, which means resorting to an emergency reserve).\r\n* **Formula:** `Forces / Division + fall back + [to Defensive Positions / across the River]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Under intense artillery fire, the infantry was ordered to fall down to the second ridge.*\r\n  * ✔️ *Under intense artillery fire, the infantry was ordered to **fall back to the second ridge**.*\r\n\r\n---\r\n\r\n#### Item 129: 'Fall In' (Military Muster into Ranks)\r\n* **Principle:** *Fall in* is an intransitive phrasal verb meaning to take one's proper place in a military line, formation, or ceremonial inspection rank.\r\n* **Formula:** `Troops / Sentries + fall in + [at the Bugle Call / on Parade]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The commanding officer commanded the honor guard to fall up.*\r\n  * ✔️ *The commanding officer commanded the honor guard to **fall in**.*\r\n\r\n---\r\n\r\n#### Item 130: 'Hold With' (Intellectual or Moral Endorsement)\r\n* **Principle:** *Hold with* is an inseparable phrasal verb meaning to subscribe to, approve of, or endorse an opinion, theory, or practice (predominantly in negative declarative sentences: *do not hold with*).\r\n* **Formula:** `Subject + do not + hold with + [Modern Theories / Violence / Censorship]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The conservative magistrate did not hold to summary capital sentencing.*\r\n  * ✔️ *The conservative magistrate did not **hold with summary capital sentencing**.*\r\n\r\n---\r\n\r\n### Category AA: The 'Blow' & 'Strike' Families (Detonation, Invalidation & Dissipation)\r\n\r\n#### Item 131: 'Blow Over' (Dissipation of Tempest or Scandal)\r\n* **Principle:** *Blow over* is an intransitive phrasal verb used for a violent tempest, public scandal, or diplomatic crisis that subsides, passes away, and is forgotten without producing fatal consequences.\r\n* **Formula:** `[Scandal / Crisis / Storm / Controversy] + blow over`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The minister calculated that the procurement scandal would blow away in a week.*\r\n  * ✔️ *The minister calculated that the procurement scandal would **blow over in a week**.*\r\n\r\n---\r\n\r\n#### Item 132: 'Blow Up' (Explosion, Enragement & Magnification)\r\n* **Principle:** *Blow up* signifies: (1) an explosive device detonating or destroying a bridge/fortress (transitive/intransitive), (2) losing emotional control in explosive fury, or (3) enlarging a photographic negative.\r\n* **Formula:**\r\n  * *Explosion:* `Saboteurs + blow up + [Bridge / Train / Depot]`\r\n  * *Rage:* `Subject + blow up + [at Incompetence / under Pressure]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The retreat was secured when engineers blew down the stone viaduct.*\r\n  * ✔️ *The retreat was secured when engineers **blew up the stone viaduct**.*\r\n\r\n---\r\n\r\n#### Item 133: 'Strike Down' (Judicial Invalidation or Lethal Affliction)\r\n* **Principle:** *Strike down* means: (1) when a constitutional or appellate bench invalidates or nullifies an unconstitutional statute, or (2) when a pestilence or assassin fells someone fatally.\r\n* **Formula:**\r\n  * *Judicial Veto:* `Supreme Court + strike down + [Statute / Clause / Amendment]`\r\n  * *Lethal Stroke:* `Disease / Assassin + strike down + [Monarch / Population]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The constitutional bench struck off the arbitrary surveillance decree as unconstitutional.*  \r\n    *(Confusing 'strike off' [remove from list] with 'strike down' [nullify a law])*\r\n  * ✔️ *The constitutional bench **struck down the arbitrary surveillance decree** as unconstitutional.*\r\n\r\n---\r\n\r\n#### Item 134: 'Strike Off / Out' (Expulsion from Rolls or Erasure)\r\n* **Principle:** *Strike off* (or *strike out*) means to delete, erase, or officially remove a name or credential from a bar roll, medical register, ledger, or official membership roster.\r\n* **Formula:** `Bar Association + strike + Lawyer + off + the Roll / Register`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *For professional misconduct, the barrister was struck away from the legal roll.*\r\n  * ✔️ *For professional misconduct, the barrister was **struck off the legal roll**.*\r\n\r\n---\r\n\r\n#### Item 135: 'Strike Up' (Commencing Acquaintance or Music)\r\n* **Principle:** *Strike up* means: (1) to initiate an informal conversation or diplomatic acquaintance unexpectedly, or (2) when an orchestra or military band begins playing music.\r\n* **Formula:**\r\n  * *Acquaintance:* `Subject + strike up + [Conversation / Acquaintance / Friendship]`\r\n  * *Orchestra:* `Band + strike up + [Anthem / March]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foreign envoy struck off an informal dialogue with the prime minister.*\r\n  * ✔️ *The foreign envoy **struck up an informal dialogue** with the prime minister.*\r\n\r\n---\r\n\r\n### Category BB: Negotiations, Gradual Evolution & Backing\r\n\r\n#### Item 136: 'Back Out Of' (Renege on Commitments)\r\n* **Principle:** *Back out of* is a three-word inseparable phrasal verb meaning to withdraw, renege on, or fail to honor an agreement, promised funding, or formal treaty commitment.\r\n* **Formula:** `Signatory / Investor + back out of + [Treaty / Contract / Deal / Venture]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *When geopolitical tensions escalated, the allied power backed away from the coalition pact.*  \r\n    *(Less idiomatic than the established 'back out of')*\r\n  * ✔️ *When geopolitical tensions escalated, the allied power **backed out of the coalition pact**.*\r\n\r\n---\r\n\r\n#### Item 137: 'Back Up' (Corroboration, Defensive Support & Congestion)\r\n* **Principle:** *Back up* means: (1) to provide military, financial, or evidentiary support to substantiate an ally or claim (separable), or (2) when vehicular traffic forms a congested queue.\r\n* **Formula:** `Subject + back up + [Claims with Data / Ally with Armor]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The prosecutor failed to back out his assertions with documentary evidence.*\r\n  * ✔️ *The prosecutor failed to **back up his assertions with documentary evidence**.*\r\n\r\n---\r\n\r\n#### Item 138: 'Iron Out' (Diplomatic Resolution of Nuances)\r\n* **Principle:** *Iron out* is a transitive phrasal verb meaning to resolve, eliminate, smooth over, or settle minor discrepancies, difficulties, or contentious clauses through patient negotiation.\r\n* **Formula:** `Plenipotentiaries + iron out + [Discrepancies / Differences / Clauses]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Both delegations convened in Geneva to smooth down the border discrepancies.*\r\n  * ✔️ *Both delegations convened in Geneva to **iron out the border discrepancies**.*\r\n\r\n---\r\n\r\n#### Item 139: 'Cave In To' (Capitulation Under Intense Duress)\r\n* **Principle:** *Cave in to* means: (1) to collapse inward physically (roof/tunnel), or (2) to surrender, submit, or capitulate completely to unrelenting political or economic pressure.\r\n* **Formula:** `Government / Board + cave in to + [Demands / Ultimatum / Strike]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The municipal council caved up to the demands of the rioting factions.*\r\n  * ✔️ *The municipal council **caved in to the demands** of the rioting factions.*\r\n\r\n---\r\n\r\n#### Item 140: 'Phase Out' (Systematic Progressive Decommissioning)\r\n* **Principle:** *Phase out* means to discontinue, withdraw, or decommission obsolete armaments, subsidies, or chemicals gradually in scheduled stages rather than all at once.\r\n* **Formula:** `Ministry + phase out + [Subsidies / Coal Plants / Obsolete Weapons]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The international protocol requires signatories to phase down all toxic chlorofluorocarbons.*\r\n  * ✔️ *The international protocol requires signatories to **phase out all toxic chlorofluorocarbons**.*\r\n\r\n---\r\n\r\n### Category CC: The 'Wear', 'Wipe', & 'Water' Families (Erosion & Dilution)\r\n\r\n#### Item 141: 'Wear Out' (Complete Exhaustion or Friction Damage)\r\n* **Principle:** *Wear out* means: (1) to exhaust someone’s physical or mental strength completely (often passive: *worn out*), or (2) when machinery or garments become unserviceable through prolonged friction.\r\n* **Formula:**\r\n  * *Fatigue:* `Exertion + wear out + Person  (Passive: be worn out)`\r\n  * *Apparel / Mechanism:* `Gears / Boots + wear out`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The infantry companies were thoroughly worn down after the ninety-mile forced march.*  \r\n    *(Confusing 'wear down' [erode resistance] with 'wear out' [physically exhaust])*\r\n  * ✔️ *The infantry companies were thoroughly **worn out after the ninety-mile forced march**.*\r\n\r\n---\r\n\r\n#### Item 142: 'Wear Off' (Gradual Subsidence of Sensation or Effect)\r\n* **Principle:** *Wear off* is an intransitive phrasal verb used for anesthesia, narcotics, euphoria, pain, or novelty that gradually loses its physiological or psychological intensity over time.\r\n* **Formula:** `[Anesthesia / Euphoria / Novelty / Pain] + wear off`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *As the local anesthetic wore away, the wounded soldier felt excruciating pain.*\r\n  * ✔️ *As the local anesthetic **wore off, the wounded soldier felt excruciating pain**.*\r\n\r\n---\r\n\r\n#### Item 143: 'Wipe Out' (Total Annihilation or Erasure)\r\n* **Principle:** *Wipe out* means to eradicate, exterminate, or destroy completely an entire garrison, species, financial asset, or debt (separable).\r\n* **Formula:** `Subject + wipe out + [Garrison / Population / Debt / Species]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *An unexpected ambush in the defile wiped down the entire vanguard battalion.*\r\n  * ✔️ *An unexpected ambush in the defile **wiped out the entire vanguard battalion**.*\r\n\r\n---\r\n\r\n#### Item 144: 'Wash Away' (Hydrological Destruction)\r\n* **Principle:** *Wash away* means when floodwaters, waves, or torrential rain completely carry away, dislodge, or destroy physical infrastructure, roads, or topsoil.\r\n* **Formula:** `Floodwaters / Storm + wash away + [Bridge / Topsoil / Settlements]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The seasonal monsoons washed out the coastal suspension viaduct.*\r\n  * ✔️ *The seasonal monsoons **washed away the coastal suspension viaduct**.*\r\n\r\n---\r\n\r\n#### Item 145: 'Water Down' (Dilution of Legislative or Ideological Rigor)\r\n* **Principle:** *Water down* means: (1) to dilute a chemical or potable liquid with water, or (2) to weaken the ethical, punitive, or ideological force of a legislative bill, policy, or compromise.\r\n* **Formula:** `Legislature / Lobbyists + water down + [Sanctions / Reform Bill / Statute]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Corporate lobbyists managed to dilute down the antitrust regulations.*\r\n  * ✔️ *Corporate lobbyists managed to **water down the antitrust regulations**.*\r\n\r\n---\r\n\r\n### Category DD: Final Three-Word Diagnostic Anchors\r\n\r\n#### Item 146: 'Face Up To' (Confronting Unpleasant Realities)\r\n* **Principle:** *Face up to* is a three-word inseparable phrasal verb meaning to acknowledge, accept, and confront courageously an unpleasant, difficult truth or irreversible crisis.\r\n* **Formula:** `Subject + face up to + [Reality / Responsibility / Facts / Defeat]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The administration must face out to the stark reality of economic stagflation.*\r\n  * ✔️ *The administration must **face up to the stark reality of economic stagflation**.*\r\n\r\n---\r\n\r\n#### Item 147: 'Live Up To' (Matching Elevated Standards or Pedigree)\r\n* **Principle:** *Live up to* is a three-word inseparable phrasal verb meaning to meet, satisfy, or fulfill an elevated reputation, ancestral pedigree, or high moral expectations.\r\n* **Formula:** `Subject + live up to + [Reputation / Expectations / Ideals / Name]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The newly appointed justice struggled to live to the reputation of his predecessor.*\r\n  * ✔️ *The newly appointed justice struggled to **live up to the reputation of his predecessor**.*\r\n\r\n---\r\n\r\n#### Item 148: 'Look Forward To' (+ Gerund / Noun Trap)\r\n* **Principle:** *Look forward to* is an inseparable three-word phrasal verb meaning to anticipate with positive pleasure; because the terminal *to* is a true preposition, any ensuing verbal complement must be a **gerund** (*V-ing*), never a bare infinitive.\r\n* **Formula:** `Subject + look forward to + [Noun Phrase / Gerund (V-ing)]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The foreign minister looks forward to meet his counterparts at the plenary summit.*\r\n  * ✔️ *The foreign minister **looks forward to meeting his counterparts** at the plenary summit.*\r\n\r\n---\r\n\r\n#### Item 149: 'Stand Up For' (Championing Rights or Vulnerable Allies)\r\n* **Principle:** *Stand up for* is a three-word inseparable phrasal verb meaning to defend, support, or champion the rights, dignity, or sovereignty of a vulnerable person or nation under attack.\r\n* **Formula:** `Subject + stand up for + [Rights / Sovereignty / Oppressed / Principles]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Few allied powers dared to stand by for the sovereign neutrality of the small republic.*\r\n  * ✔️ *Few allied powers dared to **stand up for the sovereign neutrality** of the small republic.*\r\n\r\n---\r\n\r\n#### Item 150: 'Come Up Against' (Confronting Formidable Resistance)\r\n* **Principle:** *Come up against* is an inseparable three-word phrasal verb meaning to be faced with, encounter, or run headlong into fierce opposition, entrenched resistance, or insurmountable structural obstacles.\r\n* **Formula:** `Subject + come up against + [Fierce Opposition / Resistance / Obstacles]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The constitutional reform bill came up with entrenched parliamentary resistance.*\r\n  * ✔️ *The constitutional reform bill **came up against entrenched parliamentary resistance**.*\r\n\r\n# Module 14: Confusing Diction, False Friends & Pure Idiomatic Expressions\r\n**Curated Selection:** Items 1 to 25 of 100 Key Lexical & Idiomatic Sets  \r\n**Question Output Target:** 30 Diagnostic Questions (High-Yield Contrast & Usage Traps)\r\n\r\n---\r\n\r\n### Category A: High-Yield Paronymous Word Pairs\r\n\r\n#### Item 1: 'Affect' vs. 'Effect'\r\n* **Principle:** *Affect* is primarily a verb meaning to influence, alter, or act upon (or to put on a false pretense); *Effect* is primarily a noun meaning an outcome or result. *Effect* functions as a verb only in the formal sense of bringing about, accomplishing, or executing a change.\r\n* **Formula:**\r\n  * *Influence (Verb):* `Subject + affect + [Outcome / Economy / Health]`\r\n  * *Result (Noun):* `The + effect + of + [Measure / Policy]`\r\n  * *Bring About (Verb):* `Subject + effect + [Reforms / Transitions / Solutions]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The abrupt currency devaluation had a profound affect on export trade.*\r\n  * ✔️ *The abrupt currency devaluation had a profound **effect on export trade**.*\r\n  * ❌ *The new chancellor was unable to affect any meaningful fiscal reforms.*  \r\n    *(Confusing 'affect' [influence] with 'effect' [bring about])*\r\n  * ✔️ *The new chancellor was unable to **effect any meaningful fiscal reforms**.*\r\n\r\n---\r\n\r\n#### Item 2: 'Appraise' vs. 'Apprise'\r\n* **Principle:** *Appraise* means to assess, evaluate, or set a monetary or qualitative value on something; *Apprise* means to inform, notify, or advise someone of a fact (always governing the preposition *of*).\r\n* **Formula:**\r\n  * *Evaluate:* `Assessor + appraise + [Value / Assets / Damage]`\r\n  * *Notify:* `Subject + apprise + Person + of + [Developments / Facts / Status]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defense secretary was immediately appraised of the border incursion.*\r\n  * ✔️ *The defense secretary was immediately **apprised of the border incursion**.*\r\n  * ❌ *Independent actuaries were summoned to apprise the market value of the estate.*\r\n  * ✔️ *Independent actuaries were summoned to **appraise the market value of the estate**.*\r\n\r\n---\r\n\r\n#### Item 3: 'Discrete' vs. 'Discreet'\r\n* **Principle:** *Discrete* (ending in *-ete*) means distinct, separate, individual, or detached into separate units; *Discreet* (ending in *-eet*) means circumspect, prudent, cautious in speech, or unobtrusive.\r\n* **Formula:**\r\n  * *Separate Units:* `Discrete + [Entities / Categories / Variables]`\r\n  * *Prudent / Circumspect:* `Discreet + [Inquiries / Conduct / Diplomat]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The intelligence operative conducted discrete inquiries into the minister’s finances.*\r\n  * ✔️ *The intelligence operative conducted **discreet inquiries** into the minister’s finances.*\r\n  * ❌ *The experimental trial was divided into four discreet observational stages.*\r\n  * ✔️ *The experimental trial was divided into four **discrete observational stages**.*\r\n\r\n---\r\n\r\n#### Item 4: 'Continual' vs. 'Continuous'\r\n* **Principle:** *Continual* denotes an action occurring repeatedly over time with brief interruptions or intervals (recurrent); *Continuous* denotes an action or state proceeding without a single pause, break, or cessation (unbroken).\r\n* **Formula:**\r\n  * *Recurrent with Breaks:* `Continual + [Complaints / Interruptions / Rainstorms]`\r\n  * *Unbroken Continuum:* `Continuous + [Flow / Spectrum / Line / Hum]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The jet engine produced a continual drone that never ceased for ten hours.*\r\n  * ✔️ *The jet engine produced a **continuous drone** that never ceased for ten hours.*\r\n  * ✔️ *The board meeting was disrupted by **continual interruptions** from the floor.*\r\n\r\n---\r\n\r\n#### Item 5: 'Complement' vs. 'Compliment'\r\n* **Principle:** *Complement* (with an *e*) means to complete, balance, or enhance something so as to make it perfect; *Compliment* (with an *i*) means an expression of praise, admiration, or congratulation.\r\n* **Formula:**\r\n  * *Complete / Enhance:* `Entity A + complement + Entity B`\r\n  * *Praise:* `Speaker + compliment + Person + on + [Feat / Appearance]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Her legal acumen compliments his administrative expertise perfectly.*\r\n  * ✔️ *Her legal acumen **complements his administrative expertise** perfectly.*\r\n  * ❌ *The ambassador paid a graceful complement to the host nation’s hospitality.*\r\n  * ✔️ *The ambassador paid a graceful **compliment to the host nation’s hospitality**.*\r\n\r\n---\r\n\r\n### Category B: Semantic False Friends & Administrative Traps\r\n\r\n#### Item 6: 'Censure' vs. 'Censor'\r\n* **Principle:** *Censure* denotes formal, severe reprimand, moral condemnation, or official legislative reproach; *Censor* denotes the official suppression or deletion of books, letters, news, or films deemed objectionable.\r\n* **Formula:**\r\n  * *Reprimand / Condemn:* `Parliament / Council + censure + [Official / Policy]`\r\n  * *Suppression of Content:* `Authority + censor + [Dispatches / Publications / Press]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The opposition tabled a motion to censor the prime minister for his misconduct.*\r\n  * ✔️ *The opposition tabled a motion to **censure the prime minister** for his misconduct.*\r\n  * ✔️ *Wartime authorities **censored all outbound diplomatic cables**.*\r\n\r\n---\r\n\r\n#### Item 7: 'Allude' vs. 'Elude'\r\n* **Principle:** *Allude* means to suggest or refer to something indirectly (governing the preposition *to*); *Elude* is transitive and means to evade, escape, or slip away from capture, comprehension, or perception.\r\n* **Formula:**\r\n  * *Indirect Reference:* `Speaker + allude + to + [Event / Scandal / Precedent]`\r\n  * *Escape Capture:* `Fugitive / Meaning + elude + [Pursuers / Comprehension]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The fugitive financier managed to allude international border checkpoints.*\r\n  * ✔️ *The fugitive financier managed to **elude international border checkpoints**.*\r\n  * ❌ *The orator eluded to the fall of the Roman Republic in his closing remarks.*\r\n  * ✔️ *The orator **alluded to the fall of the Roman Republic** in his closing remarks.*\r\n\r\n---\r\n\r\n#### Item 8: 'Elicit' vs. 'Illicit'\r\n* **Principle:** *Elicit* is a verb meaning to draw forth, evoke, or extract a response, fact, or confession; *Illicit* is an adjective meaning illegal, unlawful, or forbidden by societal rules.\r\n* **Formula:**\r\n  * *Extract (Verb):* `Interrogator + elicit + [Confession / Truth / Response]`\r\n  * *Illegal (Adjective):* `Illicit + [Trade / Narcotics / Transactions / Relations]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The tribunal’s cross-examination failed to illicit any corroborating evidence.*\r\n  * ✔️ *The tribunal’s cross-examination failed to **elicit any corroborating evidence**.*\r\n  * ❌ *The vessel was intercepted for carrying an elicit shipment of arms.*\r\n  * ✔️ *The vessel was intercepted for carrying an **illicit shipment of arms**.*\r\n\r\n---\r\n\r\n#### Item 9: 'Judicial' vs. 'Judicious'\r\n* **Principle:** *Judicial* pertains strictly to the law, the judiciary, courts, or a judge’s formal office; *Judicious* means exhibiting sound judgment, prudence, wisdom, and discretion.\r\n* **Formula:**\r\n  * *Legal / Courts:* `Judicial + [Review / Separation / Bench / Process]`\r\n  * *Wise / Prudent:* `Judicious + [Allocation / Decision / Restraint]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The central bank exercised judicial restraint in allocating foreign currency reserves.*\r\n  * ✔️ *The central bank exercised **judicious restraint** in allocating foreign currency reserves.*\r\n  * ✔️ *The legislation was subjected to **judicial review** by the Supreme Court.*\r\n\r\n---\r\n\r\n#### Item 10: 'Historic' vs. 'Historical'\r\n* **Principle:** *Historic* denotes an event, milestone, or treaty that is momentous, monumental, or famous in history; *Historical* pertains simply to anything dealing with or situated in the past.\r\n* **Formula:**\r\n  * *Momentous / Landmark:* `Historic + [Treaty / Accord / Summit / Milestone]`\r\n  * *Pertaining to Past:* `Historical + [Monograph / Novel / Archive / Context]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The signing of the armistice was a historical occasion that altered global borders.*\r\n  * ✔️ *The signing of the armistice was a **historic occasion** that altered global borders.*\r\n  * ✔️ *The professor published a **historical study** of medieval feudal tenures.*\r\n\r\n---\r\n\r\n### Category C: Nuanced Verb & Adjective Confusions\r\n\r\n#### Item 11: 'Flaunt' vs. 'Flout'\r\n* **Principle:** *Flaunt* means to display ostentatiously, show off, or parade wealth or advantages boastfully; *Flout* means to openly disregard, mock, or treat a law, treaty, or custom with contemptuous defiance.\r\n* **Formula:**\r\n  * *Ostentatious Display:* `Subject + flaunt + [Wealth / Power / Status / Diamonds]`\r\n  * *Open Defiance:* `Transgressor + flout + [Law / Sanctions / Conventions / Authority]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The rogue state openly flaunted the international nuclear non-proliferation treaty.*\r\n  * ✔️ *The rogue state openly **flouted the international nuclear non-proliferation treaty**.*\r\n  * ✔️ *The oligarch **flaunted his opulent lifestyle** before the impoverished public.*\r\n\r\n---\r\n\r\n#### Item 12: 'Ingenious' vs. 'Ingenuous'\r\n* **Principle:** *Ingenious* means clever, brilliantly inventive, or shrewdly resourceful; *Ingenuous* means naive, candid, innocent, and unworldly, often to the point of being easily deceived.\r\n* **Formula:**\r\n  * *Inventive:* `Ingenious + [Contrivance / Blueprint / Device / Strategem]`\r\n  * *Candid / Naive:* `Ingenuous + [Youth / Confession / Candor]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The engineer devised an ingenuous hydraulic bypass that averted the flood.*\r\n  * ✔️ *The engineer devised an **ingenious hydraulic bypass** that averted the flood.*\r\n  * ❌ *His ingenious nature made him an easy target for cynical political conspirators.*\r\n  * ✔️ *His **ingenuous nature** made him an easy target for cynical political conspirators.*\r\n\r\n---\r\n\r\n#### Item 13: 'Amicable' vs. 'Amiable'\r\n* **Principle:** *Amicable* refers to relationships, agreements, divorces, or proceedings characterized by friendliness and the absence of discord; *Amiable* describes an individual person whose temperament is pleasant, affable, and good-natured.\r\n* **Formula:**\r\n  * *Proceedings / Relations:* `Amicable + [Settlement / Accord / Split / Divorce]`\r\n  * *Personal Disposition:* `Amiable + [Host / Colleague / Disposition]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The border arbitration concluded in an amiable settlement between the two states.*\r\n  * ✔️ *The border arbitration concluded in an **amicable settlement** between the two states.*\r\n  * ✔️ *Despite his formidable rank, the ambassador remained an **amiable companion**.*\r\n\r\n---\r\n\r\n#### Item 14: 'Tortuous' vs. 'Torturous'\r\n* **Principle:** *Tortuous* means full of twists and turns, winding, serpentine, or excessively convoluted and devious; *Torturous* means characterized by or inflicting excruciating physical or mental pain (torture).\r\n* **Formula:**\r\n  * *Convoluted / Serpentine:* `Tortuous + [Mountain Road / Bureaucracy / Reasoning]`\r\n  * *Excruciatingly Painful:* `Torturous + [Agony / Interrogation / Death]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The supply convoys navigated a torturous alpine path with ninety hairpin turns.*\r\n  * ✔️ *The supply convoys navigated a **tortuous alpine path** with ninety hairpin turns.*\r\n  * ✔️ *The wounded soldier endured a **torturous ordeal** before the surgeons arrived.*\r\n\r\n---\r\n\r\n#### Item 15: 'Credible' vs. 'Creditable' vs. 'Credulous'\r\n* **Principle:**\r\n  1. *Credible* = believable, convincing, or worthy of confidence.\r\n  2. *Creditable* = deserving praise, honor, or esteem (worthy of credit).\r\n  3. *Credulous* = gullible, overly trusting, or disposed to believe anything on slight evidence.\r\n* **Formula:**\r\n  * `Credible + [Witness / Evidence / Explanation]`\r\n  * `Creditable + [Performance / Effort / Achievement]`\r\n  * `Credulous + [Populace / Buyer / Mind]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The forensic report offered a credulous explanation for the structural collapse.*\r\n  * ✔️ *The forensic report offered a **credible explanation** for the structural collapse.*\r\n  * ❌ *A credible attempt was made by the depleted battalion to secure the perimeter.*\r\n  * ✔️ *A **creditable attempt** was made by the depleted battalion to secure the perimeter.*\r\n  * ✔️ *A **credulous public** fell for the fraudulent claims of the syndicate.*\r\n\r\n---\r\n\r\n### Category D: Critical Binomial Idioms & Fixed Formal Pairs\r\n\r\n#### Item 16: 'Null and Void' (Legal Invalidation)\r\n* **Principle:** The fixed legal binomial idiom *null and void* denotes a contract, treaty, or election that has zero legal force, validity, or binding effect. Altering the coordinating conjunction to *or* (*null or void*) is non-standard.\r\n* **Formula:** `Document / Treaty / Statute + be + declared / rendered + null and void`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The high court ruled that the contested land patent was null or void.*\r\n  * ✔️ *The high court ruled that the contested land patent was **null and void**.*\r\n\r\n---\r\n\r\n#### Item 17: 'Pros and Cons' (Exhaustive Deliberation)\r\n* **Principle:** The Latin-derived binomial *pros and cons* signifies the arguments for and against a proposition, or the respective advantages and disadvantages of a policy.\r\n* **Formula:** `Subject + weigh / consider + the pros and cons + of + [Policy / Proposal]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The cabinet weighed the pros with cons before ratifying the defense expenditure.*\r\n  * ✔️ *The cabinet weighed the **pros and cons** before ratifying the defense expenditure.*\r\n\r\n---\r\n\r\n#### Item 18: 'Tooth and Nail' (Ferocious Exertion + Preposition Trap)\r\n* **Principle:** *Tooth and nail* is an adverbial idiom meaning with fierce determination, savagery, and every available resource. Because it functions as an inherent adverbial, inserting the preposition *with* before it (*fought with tooth and nail*) is a standard diagnostic error.\r\n* **Formula:** `Subject + fight / contest + tooth and nail  (Prohibited: with tooth and nail)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The defenders fought with tooth and nail to preserve the mountain bastion.*\r\n  * ✔️ *The defenders **fought tooth and nail** to preserve the mountain bastion.*\r\n\r\n---\r\n\r\n#### Item 19: 'Part and Parcel' (Inseparable Constitutional Component)\r\n* **Principle:** *Part and parcel* is a fixed binomial noun phrase meaning an essential, integral, and inseparable component of something; pluralizing *part* (*parts and parcel*) or substituting *or* is ungrammatical.\r\n* **Formula:** `Subject + be + part and parcel + of + [Office / Routine / Democracy]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Rigorous public scrutiny is parts and parcel of holding high political office.*\r\n  * ✔️ *Rigorous public scrutiny is **part and parcel of** holding high political office.*\r\n\r\n---\r\n\r\n#### Item 20: 'By and Large' (Holistic Appraisal)\r\n* **Principle:** The idiomatic phrase *by and large* functions as a sentence adverb meaning on the whole, considering everything, or in general terms.\r\n* **Formula:** `By and large , + Independent Clause`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *By and great, the legislative session accomplished its primary budgetary aims.*\r\n  * ✔️ * **By and large**, the legislative session accomplished its primary budgetary aims.*\r\n\r\n---\r\n\r\n### Category E: Classical Idiomatic Contrast Anchors\r\n\r\n#### Item 21: 'Hale and Hearty' (Vigorous Senescent Health)\r\n* **Principle:** *Hale and hearty* is an invariant binomial adjective phrase used specifically of elderly persons who remain healthy, robust, and vigorous; substituting *healthy and hearty* disrupts the fossilized idiom.\r\n* **Formula:** `Elderly Subject + be + hale and hearty`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *At ninety-two years of age, the veteran field marshal remained hail and hearty.*  \r\n    *(Spelling trap: 'hail' vs. 'hale')*\r\n  * ✔️ *At ninety-two years of age, the veteran field marshal remained **hale and hearty**.*\r\n\r\n---\r\n\r\n#### Item 22: 'Through Thick and Thin' (Steadfast Loyalty Amid Calamity)\r\n* **Principle:** *Through thick and thin* signifies supporting someone or persevering through all conditions, whether prosperous or calamitous, despite profound adversity.\r\n* **Formula:** `Subject + support / remain with + Person + through thick and thin`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The bodyguard stood by the exiled sovereign through thick and dark.*\r\n  * ✔️ *The bodyguard stood by the exiled sovereign **through thick and thin**.*\r\n\r\n---\r\n\r\n#### Item 23: 'Hard and Fast' (Inflexible Norms)\r\n* **Principle:** The compound adjective *hard and fast* denotes rules, standards, or boundaries that are strict, invariable, and allow for zero exceptions or discretionary compromise.\r\n* **Formula:** `There + be + no + hard and fast + [Rules / Lines / Criteria]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *There are no hard and firm rules governing diplomatic seating protocols.*\r\n  * ✔️ *There are no **hard and fast rules** governing diplomatic seating protocols.*\r\n\r\n---\r\n\r\n#### Item 24: 'Ins and Outs' (Intricate Mechanical or Procedural Details)\r\n* **Principle:** *The ins and outs* denotes all the complex, intricate details, pitfalls, and administrative mechanics of an operation, organization, or lawsuit.\r\n* **Formula:** `Subject + master / know + the ins and outs + of + [System / Law / Politics]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *A novice attorney cannot master the ups and downs of corporate tax litigation.*  \r\n    *(Confusing 'ups and downs' [fluctuations] with 'ins and outs' [intricate details])*\r\n  * ✔️ *A novice attorney cannot master the **ins and outs of corporate tax litigation**.*\r\n\r\n---\r\n\r\n#### Item 25: 'Spick and Span' (Immaculate Order and Cleanliness)\r\n* **Principle:** *Spick and span* is an invariant idiomatic predicate adjective meaning impeccably neat, spotless, clean, and perfectly ordered.\r\n* **Formula:** `Chamber / Premises + be + kept / maintained + spick and span`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The barracks were inspected by the commander and found spick and clean.*\r\n  * ✔️ *The barracks were inspected by the commander and found **spick and span**.*\r\n# Module 14: Confusing Diction, False Friends & Pure Idiomatic Expressions\r\n**Curated Selection:** Items 26 to 50 of 100 Key Lexical & Idiomatic Sets  \r\n**Question Output Target:** 30 Diagnostic Questions (High-Yield Contrast & Usage Traps)\r\n\r\n---\r\n\r\n### Category F: Classical Paronymous Word Pairs\r\n\r\n#### Item 26: 'Eminent' vs. 'Imminent' vs. 'Immanent'\r\n* **Principle:**\r\n  1. *Eminent* = distinguished, renowned, exalted in rank or merit.\r\n  2. *Imminent* = impending, about to occur immediately (often of danger or crisis).\r\n  3. *Immanent* = inherently present, indwelling, pervading the universe.\r\n* **Formula:**\r\n  * `Eminent + [Jurist / Scholar / Statesman / Historian]`\r\n  * `Imminent + [Peril / Invasion / Collapse / Disaster]`\r\n  * `Immanent + [Quality / Divinity / Presence]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The intelligence dossier warned that a full-scale border offensive was eminent.*\r\n  * ✔️ *The intelligence dossier warned that a full-scale border offensive was **imminent**.*\r\n  * ❌ *The conference was addressed by an imminent constitutional scholar.*\r\n  * ✔️ *The conference was addressed by an **eminent constitutional scholar**.*\r\n\r\n---\r\n\r\n#### Item 27: 'Complaisant' vs. 'Complacent'\r\n* **Principle:** *Complaisant* (ending in *-sant*) means excessively willing to please, obliging, or deferential to others; *Complacent* (ending in *-cent*) means smug, self-satisfied, and dangerously unconcerned with imminent risks.\r\n* **Formula:**\r\n  * *Obliging / Deferential:* `Complaisant + [Subordinate / Courtier / Disposition]`\r\n  * *Smug / Careless:* `Complacent + [Administration / Sentry / Investor]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Buoyed by record profits, the board became complaisant and ignored market competitors.*\r\n  * ✔️ *Buoyed by record profits, the board became **complacent** and ignored market competitors.*\r\n  * ❌ *The dictator surrounded himself with complacent ministers who never challenged his decrees.*\r\n  * ✔️ *The dictator surrounded himself with **complaisant ministers** who never challenged his decrees.*\r\n\r\n---\r\n\r\n#### Item 28: 'Deprecate' vs. 'Depreciate'\r\n* **Principle:** *Deprecate* means to express strong disapproval of, protest against, or belittle; *Depreciate* means to decline in economic or monetary value over time, or to lower the price/esteem of something.\r\n* **Formula:**\r\n  * *Disapprove:* `Subject + deprecate + [Violence / Measures / Extremism]`\r\n  * *Devalue:* `Asset / Currency + depreciate + [against foreign reserves]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The treasury watched the sovereign currency deprecate by twenty percent.*\r\n  * ✔️ *The treasury watched the sovereign currency **depreciate by twenty percent**.*\r\n  * ❌ *The pacifist coalition depreciated the government's bellicose rhetoric.*\r\n  * ✔️ *The pacifist coalition **deprecated the government's bellicose rhetoric**.*\r\n\r\n---\r\n\r\n#### Item 29: 'Disinterested' vs. 'Uninterested'\r\n* **Principle:** *Disinterested* means impartial, unbiased, objective, and having no personal stake or financial interest in the outcome; *Uninterested* means indifferent, bored, unconcerned, or lacking curiosity.\r\n* **Formula:**\r\n  * *Impartial / Unbiased:* `Disinterested + [Judge / Arbitrator / Observer / Inquiry]`\r\n  * *Bored / Indifferent:* `Uninterested + [Spectator / Student / Witness]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The international border dispute requires arbitration by an uninterested mediator.*  \r\n    *(Confusing boredom/indifference with legal impartiality)*\r\n  * ✔️ *The international border dispute requires arbitration by a **disinterested mediator**.*\r\n  * ✔️ *The disaffected youth was entirely **uninterested in parliamentary politics**.*\r\n\r\n---\r\n\r\n#### Item 30: 'Defective' vs. 'Deficient'\r\n* **Principle:** *Defective* means faulty, flawed, or broken (imperfect in quality or structure); *Deficient* means lacking in necessary quantity, inadequate, or incomplete relative to a standard.\r\n* **Formula:**\r\n  * *Flawed in Quality:* `Defective + [Mechanism / Circuit / Logic / Gene]`\r\n  * *Lacking in Quantity:* `Deficient + [in Nutrients / in Resources / in Numbers]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The war production was halted because the artillery shells were deficient in their detonators.*\r\n  * ✔️ *The war production was halted because the artillery shells were **defective**.*\r\n  * ❌ *The drought-stricken soil was defective in essential nitrogen compounds.*\r\n  * ✔️ *The drought-stricken soil was **deficient in essential nitrogen compounds**.*\r\n\r\n---\r\n\r\n### Category G: Legal, Political & Abstract False Friends\r\n\r\n#### Item 31: 'Perquisite' vs. 'Prerequisite'\r\n* **Principle:** *Perquisite* (often abbreviated as \"perk\") denotes an exclusive incidental privilege, benefit, or profit attached to an employment position or rank; *Prerequisite* denotes an indispensable prior condition that must be fulfilled beforehand.\r\n* **Formula:**\r\n  * *Privilege:* `Perquisite + of + [High Office / Rank / Directorship]`\r\n  * *Prior Requirement:* `Prerequisite + for / to + [Admission / Degree / Promotion]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *Passing the bar examination is an absolute perquisite to practicing maritime law.*\r\n  * ✔️ *Passing the bar examination is an absolute **prerequisite to practicing maritime law**.*\r\n  * ✔️ *A chauffeured limousine was among the customary **perquisites of the chancellorship**.*\r\n\r\n---\r\n\r\n#### Item 32: 'Prescribe' vs. 'Proscribe'\r\n* **Principle:** *Prescribe* means to lay down authoritatively as a rule, dictate a directive, or recommend a medicinal remedy; *Proscribe* means to prohibit, outlaw, ban, or condemn officially by law.\r\n* **Formula:**\r\n  * *Mandate / Direct:* `Charter / Physician + prescribe + [Rules / Protocol / Remedy]`\r\n  * *Outlaw / Ban:* `State / Law + proscribe + [Organization / Contraband / Seditious Texts]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The sovereign constitution strictly prescribed all paramilitary organizations.*  \r\n    *(Opposite meaning: 'prescribed' would mean it ordered their creation!)*\r\n  * ✔️ *The sovereign constitution strictly **proscribed all paramilitary organizations**.*\r\n  * ✔️ *The statutory code **prescribes the procedural steps** for judicial appeal.*\r\n\r\n---\r\n\r\n#### Item 33: 'Stationary' vs. 'Stationery'\r\n* **Principle:** *Stationary* (spelled with an *a*) is an adjective meaning motionless, fixed, or unmoving; *Stationery* (spelled with an *e*) is an uncountable noun denoting paper, envelopes, pens, and writing materials.\r\n* **Formula:**\r\n  * *Motionless:* `Stationary + [Vehicle / Front / Target / Satellite]`\r\n  * *Writing Materials:* `Official / Embossed + stationery`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The official diplomatic ultimatum was printed on sovereign stationers.*\r\n  * ✔️ *The official diplomatic ultimatum was printed on sovereign **stationery**.*\r\n  * ❌ *The armored division remained stationery awaiting fuel supplies.*\r\n  * ✔️ *The armored division remained **stationary** awaiting fuel supplies.*\r\n\r\n---\r\n\r\n#### Item 34: 'Venal' vs. 'Venial'\r\n* **Principle:** *Venal* describes a corrupt person, politician, or system willing to sell favors, influence, or integrity for bribes; *Venial* describes a minor, excusable, or pardonable sin, error, or fault.\r\n* **Formula:**\r\n  * *Corrupt / Bribable:* `Venal + [Judge / Politician / Regime / Practices]`\r\n  * *Pardonable / Minor:* `Venial + [Sin / Oversight / Transgression]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The imperial magistrate was impeached for his venial conduct on the bench.*  \r\n    *(Confusing a minor forgivable fault with felony corruption)*\r\n  * ✔️ *The imperial magistrate was impeached for his **venal conduct on the bench**.*\r\n  * ✔️ *A minor clerical lapse in the date is a **venial error**, not a structural defect.*\r\n\r\n---\r\n\r\n#### Item 35: 'Veracious' vs. 'Voracious'\r\n* **Principle:** *Veracious* means truthful, strictly adhering to facts, or honest; *Voracious* means possessing an insatiable appetite for food, reading, wealth, or conquest.\r\n* **Formula:**\r\n  * *Truthful:* `Veracious + [Historian / Witness / Account]`\r\n  * *Insatiably Ravenous:* `Voracious + [Appetite / Reader / Ambition]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The military tribunal relied on the voracious testimony of the chief scout.*\r\n  * ✔️ *The military tribunal relied on the **veracious testimony** of the chief scout.*\r\n  * ✔️ *The young prince was a **voracious reader of classical military history**.*\r\n\r\n---\r\n\r\n### Category H: Advanced Lexical Distinctions\r\n\r\n#### Item 36: 'Sensuous' vs. 'Sensual'\r\n* **Principle:** *Sensuous* refers to aesthetic appreciation through the senses (art, poetry, natural beauty, music) without moral degradation; *Sensual* refers to the gratification of carnal, physical, or bodily desires (often with lustful connotations).\r\n* **Formula:**\r\n  * *Aesthetic Beauty:* `Sensuous + [Poetry / Music / Imagery / Landscape]`\r\n  * *Carnal / Bodily:* `Sensual + [Indulgence / Desires / Pleasures]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *The decadent court spent treasury funds on sensuous debauchery.*\r\n  * ✔️ *The decadent court spent treasury funds on **sensual debauchery**.*\r\n  * ✔️ *Keats’s verse is celebrated for its rich and **sensuous imagery**.*\r\n\r\n---\r\n\r\n#### Item 37: 'Luxuriant' vs. 'Luxurious'\r\n* **Principle:** *Luxuriant* means rich, lush, prolific, and abundantly fertile in vegetation or hair growth; *Luxurious* means characterized by opulence, lavish wealth, comfort, and costly luxury.\r\n* **Formula:**\r\n  * *Lush Growth:* `Luxuriant + [Vegetation / Foliage / Jungle / Hair]`\r\n  * *Opulent Wealth:* `Luxurious + [Palace / Suite / Car / Lifestyle]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *
