rsion in the main clause (*Only after the audit was concluded did the board convene*) and misinterpret it as an ungrammatical question structure.\r\n* **Underlying Grammatical Principle:** When a subordinate adverbial clause introduced by *only after, only when,* or *only by* opens a sentence, the **main independent clause** undergoes mandatory subject-auxiliary inversion.\r\n* **Formula:** `Only after + [Subordinate Clause] + Auxiliary Verb + Subject + Main Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *Only after the siege was broken the civilian relief supplies arrived.*  \r\n    *(Failing to execute required inversion in the main clause)*\r\n  * ✔️ *Valid Sentence [No Error]:* **Only after the siege was broken did the civilian relief supplies arrive.**\r\n\r\n---\r\n\r\n### Category S: Advanced Non-Finite, Elliptical & Gerundial Precision\r\n\r\n#### Item 91: True Preposition 'To' Governing a Gerund in Fixed Idioms\r\n* **The Intuition Trap:** Students see *to + V-ing* (*look forward to meeting, averse to taking, with a view to drafting*) and automatically flag it as an error, believing *to* must always be followed by a base verb (*V1*).\r\n* **Underlying Grammatical Principle:** In fixed prepositional collocations ending in *to*, the word *to* is a true preposition, not an infinitive marker; its verbal complement must be a **gerund** (*V-ing*).\r\n* **Formula:** `[Fixed Collocation + Preposition 'to'] + Gerund (V-ing)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *The delegates convened with a view to drafting the treaty.* ➔ *...with a view to draft...*  \r\n    *(Over-correcting a prepositional gerund into an infinitive)*\r\n  * ✔️ *Valid Sentence [No Error]:* **The delegates convened with a view to drafting the treaty.**\r\n\r\n---\r\n\r\n#### Item 92: The Bare Infinitive Governed by Passive 'Let'\r\n* **The Intuition Trap:** Students recall that passive causatives (*made, seen, heard*) require the to-infinitive (*was made to sign*), attempting to force *to* onto the passive of *let*.\r\n* **Underlying Grammatical Principle:** The verb *let* is an exception among causatives; even in passive constructions (*be let*), it retains the **bare infinitive** without *to*.\r\n* **Formula:** `Subject + be + let + Base Verb (V1)  (No 'to')`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *The captured partisan was questioned and then let to go.*  \r\n    *(Erroneously inserting 'to' after passive 'let')*\r\n  * ✔️ *Valid Sentence [No Error]:* **The captured partisan was questioned and then let go.**\r\n\r\n---\r\n\r\n#### Item 93: Perfect Participle Phrases Marking Temporal Priority\r\n* **The Intuition Trap:** Students encounter *Having concluded his testimony, the witness stepped down* and attempt to reduce it to a simple present participle (*Concluding his testimony...*).\r\n* **Underlying Grammatical Principle:** When an introductory non-finite action is completely finished before the main clause verb begins, the **perfect participle** (*Having + V3*) explicitly marks that chronological precedence.\r\n* **Formula:** `Having + Past Participle (V3) + [Object] , Subject + Main Verb (Past)`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *Concluding his testimony, the witness stepped down from the stand.*  \r\n    *(Implies he stepped down while simultaneously speaking)*\r\n  * ✔️ *Valid Sentence [No Error]:* **Having concluded his testimony, the witness stepped down from the stand.**\r\n\r\n---\r\n\r\n#### Item 94: Objective Pronoun Case Governed by 'Except' and 'But'\r\n* **The Intuition Trap:** Students treat *except* or *but* (meaning \"other than\") as conjunctions, attempting to follow them with subjective pronouns (*except he and I*).\r\n* **Underlying Grammatical Principle:** When *except* and *but* function as prepositions of exclusion, they govern the **objective case** (*him, her, me, them*).\r\n* **Formula:** `All / Everyone + except / but + Objective Pronoun [him / her / me]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *All the regional delegates signed the declaration except he and I.*  \r\n    *(Using subjective pronouns after a preposition)*\r\n  * ✔️ *Valid Sentence [No Error]:* **All the regional delegates signed the declaration except him and me.**\r\n\r\n---\r\n\r\n#### Item 95: Dynamic Pro-Form Substitution with 'Do So'\r\n* **The Intuition Trap:** Students view the phrase *do so* as vague or redundant wordiness, attempting to repeat the entire complex verb phrase.\r\n* **Underlying Grammatical Principle:** In formal academic syntax, *do so* functions as an approved anaphoric pro-form that cleanly substitutes for a previously stated dynamic action verb phrase.\r\n* **Formula:** `Subject A + Dynamic Action Verb + Object , and Subject B + did so`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *The marshal resolved to withdraw the garrison, and his subordinates withdrew the garrison as well.*  \r\n    *(Redundant repetition)*\r\n  * ✔️ *Valid Sentence [No Error]:* **The marshal resolved to withdraw the garrison, and his subordinates did so as well.**\r\n\r\n---\r\n\r\n### Category T: Complex Multi-Clause & Syntactic Architecture\r\n\r\n#### Item 96: Coordinated Parallel Subordinate 'That'-Clauses\r\n* **The Intuition Trap:** Students see the complementizer *that* repeated in a compound sentence (*...stated that X and that Y*) and flag the second *that* as a redundant connective error.\r\n* **Underlying Grammatical Principle:** When a single reporting verb governs two coordinate dependent clauses linked by *and*, repeating *that* before the second clause maintains clausal balance and prevents boundary misreading.\r\n* **Formula:** `Subject + Verb + that + [Clause A] + and + that + [Clause B]`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *The premier announced that the budget had passed and that public tariffs would be lowered.* ➔ *...and public tariffs...*  \r\n    *(Deleting 'that' can cause the second clause to be misread as coordinated with the main subject)*\r\n  * ✔️ *Valid Sentence [No Error]:* **The premier announced that the budget had passed and that public tariffs would be lowered.**\r\n\r\n---\r\n\r\n#### Item 97: Inclusive Imperative Question Tags with 'Let's'\r\n* **The Intuition Trap:** Students expect standard auxiliary tags (*don't we?* or *will you?*) after imperative sentences, flagging *shall we?* as archaic or mismatched.\r\n* **Underlying Grammatical Principle:** First-person plural inclusive imperatives introduced by *Let's* obligatorily take the specialized question tag **shall we?**.\r\n* **Formula:** `Let's + Base Verb (V1) + [Object] , shall we ?`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *Let's review the confidential clauses once more, will you?*  \r\n    *(Mismatched tag person)*\r\n  * ✔️ *Valid Sentence [No Error]:* **Let's review the confidential clauses once more, shall we?**\r\n\r\n---\r\n\r\n#### Item 98: Anomalous Inverted Tag Concord ('Aren't I?')\r\n* **The Intuition Trap:** Students know *I am* takes singular *am*, so they view the negative tag *aren't I?* as an ungrammatical agreement error and try to substitute *amn't I?* or *am not I?*.\r\n* **Underlying Grammatical Principle:** Standard English possesses no contracted negative form for *am* in tags (*amn't* is dialectal); prescriptive standard grammar mandates the anomalous tag **aren't I?**.\r\n* **Formula:** `I am + Predicate Complement , aren't I ?`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *I am eligible for the diplomatic appointment, amn't I?*  \r\n    *(Using an unstandardized contraction)*\r\n  * ✔️ *Valid Sentence [No Error]:* **I am eligible for the diplomatic appointment, aren't I?**\r\n\r\n---\r\n\r\n#### Item 99: Directional Particle Fronting Without Pronoun Inversion\r\n* **The Intuition Trap:** Students apply full verb inversion mechanically (*Down came the rain*) and attempt to invert clauses where the subject is a personal pronoun (*Down came he*).\r\n* **Underlying Grammatical Principle:** When a directional adverbial particle opens a narrative clause, **full inversion occurs only with noun subjects**; if the subject is a personal pronoun, normal subject-verb order is maintained.\r\n* **Formula:**\r\n  * *Noun Subject (Inversion):* `[Directional Particle] + Verb + Noun Subject`\r\n  * *Pronoun Subject (No Inversion):* `[Directional Particle] + Pronoun Subject + Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *Down the avenue ran the sentry, and down came it.* ➔ *...and down it came.*  \r\n    *(Inverting a personal pronoun after a particle is ungrammatical)*\r\n  * ✔️ *Valid Sentence [No Error]:* **Down the avenue ran the sentry, and down it fell.**\r\n\r\n---\r\n\r\n#### Item 100: Remote Subject Concord Separated by Extended Intervening Clauses\r\n* **The Intuition Trap:** In long, complex academic sentences, students look at the plural nouns sitting directly beside the predicate verb and match the verb to them via false proximity.\r\n* **Underlying Grammatical Principle:** No matter how many complex prepositional phrases, appositives, or relative clauses intervene between a singular head noun and its predicate, the verb agrees exclusively with the **distant head subject**.\r\n* **Formula:** `Head Subject (Singular) + [10–20 words of intervening plural modifiers] + Singular Verb`\r\n* **Diagnostic Contrast:**\r\n  * ❌ *False Correction:* *The comprehensive statistical dossier compiled by thirty independent research teams across seven continents prove the hypothesis.*  \r\n    *(Misled by 'continents' and 'teams' into choosing plural 'prove')*\r\n  * ✔️ *Valid Sentence [No Error]:* **The comprehensive statistical dossier compiled by thirty independent research teams across seven continents proves the hypothesis.**\r\n* \r\n\r\n";

    const EMBEDDED_PROGRESS = {"m1_1":{"s":"learning","diff":"easy","imp":"high","n":"Candidates inflate the prepositional object ('communities') into a false plural subject, missing that the true head noun 'resilience' is singular.","doubt":false},"m1_2":{"s":"learning","diff":"moderate","imp":"high","n":"The trap is the surface appearance of two subjects joined by a conjunction-like phrase ('as well as'); examinees wrongly treat it as 'and' and shift to plural agreement.","doubt":false},"m1_3":{"s":"learning","diff":"moderate","imp":"medium","n":"The proximity trap: the negated noun placed just before the verb pulls agreement away from the true affirmative subject, causing plural error.","doubt":false},"m1_4":{"s":"learning","diff":"easy","imp":"high","n":"Long appositive inserts between subject and verb distract the reader into agreeing with the appositive noun instead of the head noun.","doubt":false},"m1_5":{"s":"learning","diff":"easy","imp":"high","n":"The most basic SVA rule, but tested via inserted modifiers that make examinees forget both nouns form a genuine compound plural subject.","doubt":false},"m1_6":{"s":"learning","diff":"moderate","imp":"high","n":"The cognitive trap is recognising idiomatic pairs ('bread and butter', 'slow and steady') as unified concepts requiring a singular verb, against the default 'and = plural' heuristic.","doubt":false},"m1_7":{"s":"learning","diff":"tough","imp":"high","n":"Examinees must detect whether one determiner signals a single person in dual roles (singular verb) or two determiners signal two distinct individuals (plural verb) — a subtle morpho-syntactic distinction.","doubt":false},"m1_8":{"s":"learning","diff":"moderate","imp":"high","n":"The classic exam trap is ignoring proximity and agreeing with the first-mentioned subject in 'neither...nor / either...or' constructions instead of the closest subject.","doubt":false},"m1_9":{"s":"learning","diff":"moderate","imp":"high","n":"The plural noun after 'of' in 'neither/either of + plural noun' tempts plural verb use, but prescriptive grammar mandates a singular verb for standalone distributives.","doubt":false},"m1_10":{"s":"learning","diff":"easy","imp":"high","n":"Intervening plural phrases after 'everyone/anyone/nobody' create a false plural pull; examinees must anchor agreement to the inherently singular indefinite pronoun.","doubt":false},"m1_11":{"s":"learning","diff":"tough","imp":"medium","n":"Post-positioned 'each' is a high-difficulty trap: when 'each' follows a plural subject, it does NOT make the verb singular — the exact opposite of pre-positioned 'each'.","doubt":false},"m1_12":{"s":"learning","diff":"easy","imp":"medium","n":"Candidates occasionally treat 'few' as similar to 'little' (singular) by confusion with scarcity connotation, but 'few/several/many' are always plural.","doubt":false},"m1_13":{"s":"learning","diff":"tough","imp":"high","n":"SANAM pronouns require a two-step identification: first determine countability of the 'of-phrase' noun, then assign verb number — a meta-cognitive demand that most examinees miss under time pressure.","doubt":false},"m1_14":{"s":"learning","diff":"tough","imp":"high","n":"The trap lies in distinguishing 'many a + singular noun + singular verb' from 'more + plural noun + than one + plural verb', where word-order reversal completely flips agreement.","doubt":false},"m1_15":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees must look past the fraction/percentage and check the countability of the 'of-phrase' noun to determine verb number — a two-step process easily short-circuited.","doubt":false},"m1_16":{"s":"learning","diff":"moderate","imp":"high","n":"The trap is treating 'ten million dollars' as a plural numeral phrase and selecting 'were', when the aggregate-unit interpretation demands singular 'was'.","doubt":false},"m1_17":{"s":"learning","diff":"tough","imp":"medium","n":"Rules 16 and 17 create a direct exam contrast trap: examinees must determine whether the monetary/time units act as one lump (singular) or as separately distributed units (plural).","doubt":false},"m1_18":{"s":"learning","diff":"moderate","imp":"high","n":"The article swap ('a' vs. 'the') before 'number' is the sole differentiator between plural and singular agreement — a minimal-pair distractor ideal for error-spotting sections.","doubt":false},"m1_19":{"s":"learning","diff":"moderate","imp":"medium","n":"Like Rule 15, the head noun ('majority/variety') is a red herring; the real controller is the countability of the noun in the 'of-phrase'.","doubt":false},"m1_20":{"s":"learning","diff":"tough","imp":"high","n":"Examinees instinctively agree the relative clause verb with 'one' (singular) instead of the true antecedent plural noun, making this a high-frequency CAT/SSC distractor.","doubt":false},"m1_21":{"s":"learning","diff":"tough","imp":"high","n":"The 'only' qualifier overrides the plural antecedent logic from Rule 20 and restricts agreement to the singular 'one' — a direct exception that demands rule-pair awareness.","doubt":false},"m1_22":{"s":"learning","diff":"tough","imp":"medium","n":"In cleft constructions, examinees default to 'It is I who is' by proximity to 'it', missing that the relative verb must agree with the predicative pronoun 'I' (→ 'am').","doubt":false},"m1_23":{"s":"learning","diff":"easy","imp":"high","n":"Existential 'there' is wrongly treated as the subject; examinees must locate the post-verbal noun to determine verb agreement.","doubt":false},"m1_24":{"s":"learning","diff":"moderate","imp":"medium","n":"In locative inversion, the fronted prepositional phrase conceals the true plural subject at the end, tempting agreement with the nearest preceding noun.","doubt":false},"m1_25":{"s":"learning","diff":"moderate","imp":"medium","n":"After negative adverb inversion (Seldom/Rarely/Hardly), the auxiliary is fronted before the subject, and examinees often fail to match the auxiliary's number to the delayed plural subject.","doubt":false},"m1_26":{"s":"learning","diff":"tough","imp":"medium","n":"Participial/predicative inversion makes the post-verbal noun invisible at first scan; the classic error is agreeing with the fronted participle structure rather than the delayed head noun.","doubt":false},"m1_27":{"s":"learning","diff":"moderate","imp":"high","n":"A gerund or infinitive phrase as subject is treated as plural when its embedded object is plural, but the non-finite subject itself is always grammatically singular.","doubt":false},"m1_28":{"s":"learning","diff":"tough","imp":"medium","n":"Two gerunds joined by 'and' should normally be plural, but idiomatic unitary pairs ('drinking and driving') override this to singular — requiring both structural and lexical awareness.","doubt":false},"m1_29":{"s":"learning","diff":"moderate","imp":"high","n":"A full subordinate clause as subject ('That...') is often misread as a plural list of events, but any 'that/what/how' clausal subject invariably takes a singular verb.","doubt":false},"m1_30":{"s":"learning","diff":"tough","imp":"high","n":"Collective noun agreement hinges on semantic cohesion (unitary 'its' vs. fractionated 'their') — examinees must read the context clue (verdict vs. divided opinions) to assign the correct pronoun-verb pair.","doubt":false},"m1_31":{"s":"learning","diff":"moderate","imp":"high","n":"The '-ics' plural form misleads examinees into plural verb use when the noun denotes a unified academic discipline, but the same word shifts to plural when referring to personal applied statistics or traits.","doubt":false},"m1_32":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees confuse inherently plural unmarked nouns ('police/cattle') with singular-looking nouns, and also miss that 'a pair of scissors' collapses the plural pair-noun into a singular unit.","doubt":false},"m2_1":{"s":"learning","diff":"moderate","imp":"high","n":"Stative verbs disguised in progressive sentences look fluent to non-native speakers; the trap is failing to identify inherently non-dynamic mental/possessive verbs like 'belong', 'comprise', and 'resemble'.","doubt":false},"m2_2":{"s":"learning","diff":"tough","imp":"high","n":"The dual polysemy of verbs like 'think', 'have', and 'weigh' requires semantic parsing — examinees must determine whether the verb denotes a static state (simple) or a deliberate dynamic process (continuous), a distinction frequently exploited in CAT para-jumbles.","doubt":false},"m2_3":{"s":"learning","diff":"moderate","imp":"high","n":"The presence of a definite past anchor ('ago', 'yesterday', 'in 1998') is the trigger for simple past, but examinees use present perfect by default when describing 'recent' events, making this a high-frequency SSC/Banking trap.","doubt":false},"m2_4":{"s":"learning","diff":"moderate","imp":"high","n":"Open time markers ('so far', 'hitherto', 'yet') signal present perfect, but examinees incorrectly use simple past when the sentence context sounds completed, missing the 'relevance to present' criterion.","doubt":false},"m2_5":{"s":"learning","diff":"tough","imp":"high","n":"The structural asymmetry of 'since' (main clause → present perfect; subordinate clause → simple past) is counter-intuitive because both events feel 'past'; examinees wrongly use perfect tense in the since-clause.","doubt":false},"m2_6":{"s":"learning","diff":"moderate","imp":"high","n":"Isolated past perfect without a simple past anchor is a persistent error; examinees use 'had + V3' for distant historical facts where simple past is correct, misled by the sense of 'remote past'.","doubt":false},"m2_7":{"s":"learning","diff":"moderate","imp":"high","n":"The trap is knowing which of two sequential past events gets past perfect; examinees must identify the chronologically earlier event and not default to perfect for whichever event appears first in the sentence.","doubt":false},"m2_8":{"s":"learning","diff":"tough","imp":"medium","n":"Examinees over-apply past perfect after sequential connectors ('as soon as', 'the moment'), inserting it redundantly when the conjunction itself signals unambiguous sequence and simple past suffices in both clauses.","doubt":false},"m2_9":{"s":"learning","diff":"tough","imp":"high","n":"The past perfect for unfulfilled intentions ('had hoped', 'had intended') is a high-yield CAT trap: examinees use simple past, missing the semantic signal that the projected action never actually materialized.","doubt":false},"m2_10":{"s":"learning","diff":"tough","imp":"high","n":"The dual trap here is (1) the mandatory paired conjunction ('hardly...when' vs. 'no sooner...than'), and (2) the obligatory past perfect with inversion in the first clause — cross-pairing them is a common high-stakes exam error.","doubt":false},"m2_11":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees insert 'will/shall' into subordinate time/condition clauses (if, when, until) by treating them as future-referring, missing the rule that the subordinate clause must take present simple instead.","doubt":false},"m2_12":{"s":"learning","diff":"easy","imp":"high","n":"The sequence of tenses backshift is a core rule, but examinees erroneously preserve 'will' from direct speech without shifting to 'would', especially in complex multi-clause reporting structures.","doubt":false},"m2_13":{"s":"learning","diff":"moderate","imp":"high","n":"Universal truths and scientific laws must stay in present simple even after past reporting verbs; examinees backshift them to past, violating the 'timeless truth exception' to sequence of tenses.","doubt":false},"m2_14":{"s":"learning","diff":"moderate","imp":"medium","n":"The future deadline marker 'by the time / by next year' demands 'will have + V3', but examinees use simple future 'will + V1', failing to encode the completion-before-deadline semantic.","doubt":false},"m2_15":{"s":"learning","diff":"tough","imp":"medium","n":"The 'future in the past' (was/were to, would) requires identifying a retrospective historical vantage point — a cognitively demanding task that examinees skip by defaulting to simple past.","doubt":false},"m2_16":{"s":"learning","diff":"moderate","imp":"high","n":"The confusion between 'used to + V1' (discontinued past habit) and 'be used to + V-ing' (current accustomedness) is an extremely common SSC/Banking error — the gerund vs. infinitive distinction after 'to' is the key exam trap.","doubt":false},"m2_17":{"s":"learning","diff":"moderate","imp":"high","n":"After 'It is high time', the subjunctive past is required ('reformed'), but examinees use present simple ('reforms'), not recognizing the unreal/deferred-action meaning of this idiomatic construction.","doubt":false},"m2_18":{"s":"learning","diff":"tough","imp":"high","n":"The two-tier 'wish' regime (simple past for present counterfactuals; past perfect for past regrets) is collapsed by examinees into a single form, with 'was' replacing mandatory 'were' or 'had been'.","doubt":false},"m2_19":{"s":"learning","diff":"easy","imp":"medium","n":"The zero conditional ('if + present, present') is mistakenly given a 'will' in the result clause by examinees who treat all 'if' clauses as Type 1, failing to distinguish empirical laws from contingent predictions.","doubt":false},"m2_20":{"s":"learning","diff":"easy","imp":"high","n":"The recurring trap is 'will' or 'would' in the if-clause of a first conditional — examinees must memorize that present simple governs the condition clause, not the future modal.","doubt":false},"m2_21":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees substitute 'was' for 'were' in the hypothetical if-clause of a second conditional ('If he was' vs. prescriptively correct 'If he were'), collapsing the subjunctive past into indicative past.","doubt":false},"m2_22":{"s":"learning","diff":"moderate","imp":"high","n":"Third conditional errors mix tenses: using simple past in the if-clause instead of past perfect, or 'would + V1' in the result clause instead of 'would have + V3'.","doubt":false},"m2_23":{"s":"learning","diff":"tough","imp":"high","n":"Mixed Type I conditionals require past perfect in the if-clause but simple 'would + V1 (now)' in the result — examinees incorrectly complete both halves in the third conditional pattern ('would have + V3').","doubt":false},"m2_24":{"s":"learning","diff":"tough","imp":"high","n":"Mixed Type II conditionals have past subjunctive ('were') in the if-clause but a perfect modal ('would have + V3') in the result — examinees conflate this with second conditional and omit the past outcome nuance.","doubt":false},"m2_25":{"s":"learning","diff":"tough","imp":"medium","n":"Conditional inversions ('Had he known...', 'Were she to...') are high-difficulty formal constructions; examinees retain 'if' in an inverted structure, creating a double marker that is ungrammatical.","doubt":false},"m2_26":{"s":"learning","diff":"tough","imp":"medium","n":"'But for + noun' functions as a condensed counterfactual and requires the appropriate modal result clause (present: would + V1; past: would have + V3); examinees use simple past in the result, ignoring the counterfactual meaning.","doubt":false},"m2_27":{"s":"learning","diff":"moderate","imp":"high","n":"After mandative verbs (insist, recommend, demand), the bare infinitive (base form) is required in the that-clause regardless of person; examinees add '-s' to third-person singular or insert 'should', violating mandative subjunctive.","doubt":false},"m2_28":{"s":"learning","diff":"moderate","imp":"high","n":"After impersonal mandative adjectives (it is essential/vital/imperative that), the bare infinitive is obligatory; examinees add '-s' to third-person verbs, defaulting to indicative instead of subjunctive mood.","doubt":false},"m2_29":{"s":"learning","diff":"tough","imp":"low","n":"Fossilized optative subjunctives ('Suffice it to say', 'Come what may') use invariant base forms; examinees add '-s' inflection ('Suffices it') by applying regular present tense rules to archaic frozen forms.","doubt":false},"m2_30":{"s":"learning","diff":"tough","imp":"high","n":"'As if / as though' introduces a counterfactual comparison requiring unreal past ('were') for present situations and past perfect for past situations; examinees use indicative present ('is') treating the clause as a factual comparison.","doubt":false},"m3_1":{"s":"learning","diff":"moderate","imp":"high","n":"The trap is the instinctive use of 'to' after 'make/let/have' (by analogy with 'force/compel'), when these active causatives strictly require a bare infinitive — one of the most tested non-finite rules in SSC/Banking.","doubt":false},"m3_2":{"s":"learning","diff":"tough","imp":"high","n":"The passive voice transformation resurfacing 'to' in 'was made to sign' is a high-difficulty conceptual trap: examinees omit 'to' by analogy with the active form 'made him sign', not realising passive reactivates the full infinitive.","doubt":false},"m3_3":{"s":"learning","diff":"moderate","imp":"high","n":"Examinees must determine whether the perception verb saw a complete event (bare infinitive: 'cross') or a partial observation (participle: 'crossing') — a semantic aspect distinction that is frequently blurred in multiple-choice error-spotting.","doubt":false},"m3_4":{"s":"learning","diff":"easy","imp":"high","n":"Semi-modals ('had better', 'would rather') mimic full modals but examinees insert 'to' after them, producing ungrammatical 'had better to reconsider' — a surface-level but extremely common error in SSC/IBPS PO.","doubt":false},"m3_5":{"s":"learning","diff":"tough","imp":"medium","n":"The bare vs. full infinitive after 'but/except/than' depends on whether 'do' or another verb precedes — a context-sensitive rule that examinees overgeneralize in one direction, typically defaulting to 'to'-infinitive throughout.","doubt":false},"m3_6":{"s":"learning","diff":"moderate","imp":"low","n":"Split infinitives are tolerated colloquially but penalized in formal academic and legal writing; the exam trap is knowing the prescriptive position for adverbs without causing ambiguity when reordering them.","doubt":false},"m3_7":{"s":"learning","diff":"easy","imp":"high","n":"Catentive verbs like 'refuse', 'fail', 'hesitate', and 'manage' govern only to-infinitives, but examinees substitute gerunds ('refused acknowledging'), conflating them with gerundial-regime verbs like 'avoid'.","doubt":false},"m3_8":{"s":"learning","diff":"moderate","imp":"high","n":"The perfect infinitive ('to have + V3') signals that the non-finite action preceded the main verb's time frame; examinees use simple infinitive ('claims to discover') without signaling the prior-completion aspect.","doubt":false},"m3_9":{"s":"learning","diff":"tough","imp":"medium","n":"Passive continuous infinitives ('to be hiding', 'to be implemented') require correctly combining aspect and voice within a non-finite form — examinees conflate these, using active simple infinitive where a passive or continuous form is semantically obligatory.","doubt":false},"m3_10":{"s":"learning","diff":"easy","imp":"high","n":"Pure gerundial-regime verbs ('avoid', 'deny', 'postpone', 'risk') are often confused with to-infinitive verbs; the exam specifically tests whether examinees know the correct regime for high-frequency verbs like 'avoid', 'admit', and 'consider'.","doubt":false},"m3_11":{"s":"learning","diff":"tough","imp":"high","n":"The fused participle trap requires possessive case before a gerund ('his acquiring', 'the doctor's diagnosing'); examinees use objective case ('him acquiring') because the gerund phrase sounds like a noun, blurring the agent-action boundary.","doubt":false},"m3_12":{"s":"learning","diff":"moderate","imp":"high","n":"Fixed collocations with prepositional 'to' ('look forward to', 'with a view to', 'accustomed to') require a gerund, but examinees insert a base infinitive by conflating the prepositional 'to' with the infinitive marker 'to'.","doubt":false},"m3_13":{"s":"learning","diff":"moderate","imp":"high","n":"Idiomatic expressions like 'it is no use', 'can't help', and 'be worth' are fixed gerundial frames; examinees substitute to-infinitives ('it is no use to complain'), which sound natural but violate the fossilized structure.","doubt":false},"m3_14":{"s":"learning","diff":"tough","imp":"medium","n":"Perfect and passive gerunds ('having been accused') require knowledge of the gerundial aspect and voice simultaneously; examinees default to simple active gerund ('accusing') even when the subject is the patient of the action.","doubt":false},"m3_15":{"s":"learning","diff":"moderate","imp":"high","n":"'Stop + gerund' (cessation) vs. 'stop + to-infinitive' (pause for purpose) is a high-frequency CAT/SSC semantic trap — both are grammatical but mean opposite things, and exam distractors deliberately exploit this ambiguity.","doubt":false},"m3_16":{"s":"learning","diff":"moderate","imp":"high","n":"'Remember/forget + gerund' (past event) vs. 'remember/forget + to-infinitive' (prospective duty) is another directional-time trap; the exam presents sentences where the direction (backward vs. forward) is deliberately obscured.","doubt":false},"m3_17":{"s":"learning","diff":"moderate","imp":"high","n":"'Try + to-infinitive' (strenuous effort with obstacle) vs. 'try + gerund' (experimental attempt) requires understanding the semantic nuance; examinees use whichever form sounds more 'standard', ignoring the effort-vs-experiment distinction.","doubt":false},"m3_18":{"s":"learning","diff":"moderate","imp":"medium","n":"'Regret + to-infinitive' (formal announcement of bad news) vs. 'regret + gerund' (past remorse) is a polarity-of-time trap: one looks forward to deliver news, the other looks back at a past act.","doubt":false},"m3_19":{"s":"learning","diff":"moderate","imp":"high","n":"'Need/want/require + active gerund' carries passive meaning ('the car needs washing = needs to be washed'); examinees use passive infinitive correctly but miss that active gerund is the more idiomatic and frequently-tested form.","doubt":false},"m3_20":{"s":"learning","diff":"easy","imp":"high","n":"Present participles (-ing) modify the source/cause; past participles (-ed) modify the recipient/experiencer — 'exhausting lecture' vs. 'exhausted student'; swapping them is a surface-level error highly tested in SSC Tier 2.","doubt":false},"m3_21":{"s":"learning","diff":"moderate","imp":"high","n":"A simple present participle ('Finishing...') fails to convey completed prior action; 'Having finished...' (perfect participle) must be used to signal chronological precedence, a crucial distinction in formal writing tested in UPSC CDS.","doubt":false},"m3_22":{"s":"learning","diff":"tough","imp":"medium","n":"'Having been rejected' (passive perfect participle) is required when the subject is the patient of the prior action; examinees use 'Having rejected' (active form), inverting the agent-patient relationship.","doubt":false},"m3_23":{"s":"learning","diff":"easy","imp":"medium","n":"A present participle phrase expressing simultaneous action requires the -ing form; examinees use a past participle or finite verb ('Sang softly, the archivist...') creating agreement and voice errors.","doubt":false},"m3_24":{"s":"learning","diff":"moderate","imp":"medium","n":"Motion/posture verbs (sit, stand, lie) take a present participle complement ('stood guarding'), not a to-infinitive ('stood to guard') — examinees impose the purposive 'to-infinitive' reading, changing the meaning from manner to motive.","doubt":false},"m3_25":{"s":"learning","diff":"moderate","imp":"high","n":"A dangling participle has no valid logical agent in the main clause subject position; examinees accept these sentences because they sound natural despite implying absurd agency (e.g., spires walking down streets).","doubt":false},"m3_26":{"s":"learning","diff":"moderate","imp":"high","n":"A misplaced participial phrase attaches to the wrong noun due to adjacency; examinees must identify the logical agent and relocate the phrase — tested frequently as a 'correct the sentence' item in SSC and UPSC CDS.","doubt":false},"m3_27":{"s":"learning","diff":"tough","imp":"medium","n":"Absolute nominative constructions ('The weather being inclement') have their own independent subject separate from the main clause; examinees incorrectly flag them as dangling participles, failing to recognize the distinct nominal subject.","doubt":false},"m3_28":{"s":"learning","diff":"tough","imp":"medium","n":"Idiomatic disjunct participles ('generally speaking', 'judging by', 'strictly speaking') are conventionally accepted without an explicit co-referential subject; examinees and even teachers incorrectly flag these as errors.","doubt":false},"m3_29":{"s":"learning","diff":"moderate","imp":"medium","n":"Stranded infinitive particle 'to' must be retained after ellipsis of the verb complement ('refused to'); examinees omit it ('refused'), creating an abrupt, formally incomplete structure tested in error-spotting items.","doubt":false},"m3_30":{"s":"learning","diff":"moderate","imp":"high","n":"Faulty parallelism mixing infinitives and gerunds in a coordinate series ('compiling... and to draft...') is a high-frequency parallelism trap in CAT and SSC Tier 2 — examinees must enforce uniform non-finite form throughout the series.","doubt":false},"m4_1":{"s":"learning","diff":"easy","imp":"high","n":"After copular/linking verbs (seem, appear, look, smell, feel), examinees add '-ly' to form an adverb ('appeared calmly') instead of using a predicate adjective, confusing action verb + adverb syntax with copular verb + adjective syntax.","doubt":false},"m4_2":{"s":"learning","diff":"tough","imp":"medium","n":"Dual-function sensory verbs (feel, look, smell) switch from predicate adjective (state) to adverb of manner (action) when a deliberate action is described; examinees default to one form regardless of semantic function.","doubt":false},"m4_3":{"s":"learning","diff":"moderate","imp":"medium","n":"A-adjectives (alive, asleep, afraid, aware) cannot precede nouns attributively; examinees write 'the alive passengers' without recognizing these adjectives are predicative-only, requiring substitution with 'living/sleeping/frightened'.","doubt":false},"m4_4":{"s":"learning","diff":"moderate","imp":"medium","n":"Attributive-only adjectives (sheer, utter, drunken, elder, former) cannot follow linking verbs predicatively; examinees write 'The destruction was sheer' instead of 'sheer ruin', using them predicatively by analogy with ordinary adjectives.","doubt":false},"m4_5":{"s":"learning","diff":"easy","imp":"high","n":"Compound attributive adjectives require singular measure nouns with hyphens ('ten-year lease'), but examinees pluralize ('ten-years lease') or omit hyphens, conflating the attributive and predicative forms.","doubt":false},"m4_6":{"s":"learning","diff":"tough","imp":"high","n":"Dual-form adverbs ('hard/hardly', 'late/lately', 'high/highly') have entirely different meanings; examinees use 'hardly' when they mean 'hard' (with effort) or 'lately' when they mean 'late', creating semantic inversions.","doubt":false},"m4_7":{"s":"learning","diff":"easy","imp":"high","n":"Flat adverbs (fast, straight, early, hard) have no '-ly' form; examinees invent non-existent forms ('fastly', 'straightly') by over-generalizing the -ly adverb rule to invariant adverb lexemes.","doubt":false},"m4_8":{"s":"learning","diff":"moderate","imp":"medium","n":"-ly-ending adjectives (friendly, cowardly, orderly) cannot be converted to adverbs by adding another suffix; examinees write 'friendlily' or treat them as adverbs directly, missing the 'in a friendly manner' periphrastic solution.","doubt":false},"m4_9":{"s":"learning","diff":"tough","imp":"high","n":"'Very' modifies adjectives and present participles; 'much' modifies comparatives and past participles — examinees overuse 'very' before past participles ('very alarmed', 'very superior') where 'much' is prescriptively required.","doubt":false},"m4_10":{"s":"learning","diff":"moderate","imp":"high","n":"Limiting adverbs (only, just, merely) must immediately precede the element they modify; misplacing 'only' changes what is limited, a high-stakes semantic shift frequently tested in sentence improvement items.","doubt":false},"m4_11":{"s":"learning","diff":"tough","imp":"medium","n":"A squinting modifier ('diligently' between two clauses) ambiguously modifies either the preceding or following predicate; examinees must recognize the two-way ambiguity and reposition the adverb to resolve it.","doubt":false},"m4_12":{"s":"learning","diff":"moderate","imp":"high","n":"Misplaced adverbial phrases (walking through the park) attach to the wrong noun when positioned far from their logical head — creating absurd readings ('paintings walking through the park') that examinees must identify and correct.","doubt":false},"m4_13":{"s":"learning","diff":"tough","imp":"medium","n":"The OSASCOMP adjective hierarchy (Opinion→Size→Age→Shape→Color→Origin→Material→Purpose) is rarely memorized by examinees, making reordered adjective strings a difficult rearrangement trap in CAT and SSC Tier 2.","doubt":false},"m4_14":{"s":"learning","diff":"moderate","imp":"high","n":"Frequency adverbs (always, never, often) must occupy the mid-position (before main verb; after 'be'/auxiliary); examinees displace them to sentence-initial or post-verb positions, violating canonical adverb placement.","doubt":false},"m4_15":{"s":"learning","diff":"moderate","imp":"high","n":"'Enough' post-modifies adjectives/adverbs ('qualified enough') but pre-modifies nouns ('enough resources'); examinees reverse this ('enough qualified') by analogy with other degree adverbs that uniformly precede.","doubt":false},"m4_16":{"s":"learning","diff":"moderate","imp":"medium","n":"The MPT (Manner→Place→Time) adverbial sequence is violated when examinees reorder adverbials by sentence length or emphasis, particularly displacing time adverbs to mid-position.","doubt":false},"m4_17":{"s":"learning","diff":"moderate","imp":"high","n":"Fronted negative/restrictive adverbs (seldom, never, rarely, little) mandate subject-auxiliary inversion; examinees omit the inversion ('Seldom the commission has') by treating these as ordinary sentence-initial adverbs.","doubt":false},"m4_18":{"s":"learning","diff":"tough","imp":"high","n":"Correlative inversion with 'no sooner...than' and 'hardly...when' requires both correct pairing AND inversion in the first clause; examinees frequently get the conjunction right but omit the auxiliary fronting.","doubt":false},"m4_19":{"s":"learning","diff":"tough","imp":"high","n":"'Only + adverbial phrase/clause' triggers inversion in the MAIN governing clause (not inside the subordinate clause); examinees invert inside the 'only when...' clause or fail to invert the main clause at all.","doubt":false},"m4_20":{"s":"learning","diff":"moderate","imp":"high","n":"Fronted negative prepositional phrases ('Under no circumstances', 'At no point') require full subject-auxiliary inversion; examinees omit inversion and place the subject-verb in normal declarative order.","doubt":false},"m4_21":{"s":"learning","diff":"moderate","imp":"high","n":"'Not only' fronting requires inversion in the first coordinate clause only; examinees either invert both clauses or forget to invert the first, treating 'not only' like a simple sentence-initial adverb.","doubt":false},"m4_22":{"s":"learning","diff":"tough","imp":"medium","n":"Locative fronting inverts verb and noun subject ('On the summit stood a watchtower') but prohibits inversion with pronoun subjects ('Here he comes', not 'Here comes he') — examinees apply inversion uniformly regardless of subject type.","doubt":false},"m4_23":{"s":"learning","diff":"moderate","imp":"medium","n":"Fronted directional particles (down, away, up) invert with noun subjects ('Down came the rain') but NOT with personal pronouns ('Down it came'); examinees over-invert or under-invert by not checking the pronoun-noun distinction.","doubt":false},"m4_24":{"s":"learning","diff":"moderate","imp":"medium","n":"Fronted predicate adjectives/participles invert with copula and noun subject ('Especially notable are the vaulted arches'); examinees retain the normal subject-copula-complement order, missing the balanced stylistic inversion.","doubt":false},"m4_25":{"s":"learning","diff":"easy","imp":"high","n":"Elliptical agreement with 'so/neither/nor' requires auxiliary inversion ('so did the PM', 'neither can I'); examinees preserve normal word order ('and so the PM did', 'and neither I can'), failing to apply the mandatory inversion.","doubt":false},"m4_26":{"s":"learning","diff":"tough","imp":"medium","n":"Fronted 'so + adjective/such + be' for result degree ('So severe was the distress') triggers inversion before the that-clause; examinees keep normal declarative order ('So severe the distress was'), violating the result inversion pattern.","doubt":false},"m4_27":{"s":"learning","diff":"tough","imp":"medium","n":"'Tired though he was' (concessive fronting with 'as/though') requires a bare noun or adjective at clause-head without an article; examinees either retain 'although' instead of using the inverted concessive form, or insert an article before the bare noun.","doubt":false},"m4_28":{"s":"learning","diff":"tough","imp":"low","n":"Comparative elliptical inversion ('than do the agrarian districts') is valid only with noun subjects, never pronoun subjects ('than does she' is ungrammatical); examinees ignore the pronoun restriction or treat the inversion as always optional.","doubt":false},"m5_1":{"s":"learning","diff":"moderate","imp":"high","n":"Comparing a quality ('GDP growth') directly to an entity ('China') rather than to its equivalent quality ('that of China') creates an illogical apples-to-oranges comparison — a top-priority error-spotting trap in SSC CGL and CAT.","doubt":false},"m5_2":{"s":"learning","diff":"moderate","imp":"high","n":"When plural attributes are compared across entities, 'those of' must replace the repeated plural noun; examinees omit the pro-form entirely ('stricter than the United States') producing the illogical entity-vs-attribute comparison.","doubt":false},"m5_3":{"s":"learning","diff":"easy","imp":"high","n":"Using a possessive noun phrase ('John Milton's') to balance a comparison is valid but examinees omit it ('broader than John Milton'), producing the classic name-vs-attribute illogical comparison without the 'that of' correction.","doubt":false},"m5_4":{"s":"learning","diff":"tough","imp":"high","n":"Pronoun case after 'than/as' in elliptical comparisons determines the semantic meaning: 'than he' (subject: he respects less) vs. 'than him' (object: she respects him less) — a dual-meaning trap that CAT exploits in sentence correction.","doubt":false},"m5_5":{"s":"learning","diff":"moderate","imp":"high","n":"Comparing a member of a group to the group without excluding itself ('more useful than any metal') creates a self-contradiction; inserting 'other' is mandatory to prevent the subject from being compared to itself.","doubt":false},"m5_6":{"s":"learning","diff":"tough","imp":"medium","n":"When comparing across different taxonomic categories (elephant vs. carnivores), 'other' is ungrammatical because the subject is NOT a member of the comparison group — the inverse of Rule 5, requiring examinees to track group membership.","doubt":false},"m5_7":{"s":"learning","diff":"moderate","imp":"high","n":"Superlatives include the subject within the group ('highest of all peaks'); adding 'other' is self-contradictory because it excludes the subject — examinees habitually add 'other' by overgeneralizing from the comparative degree rule.","doubt":false},"m5_8":{"s":"learning","diff":"moderate","imp":"high","n":"Only two entities being compared require comparative degree with definite article ('the more feasible of the two'); examinees incorrectly use the superlative ('the most feasible'), violating the two-entity constraint.","doubt":false},"m5_9":{"s":"learning","diff":"easy","imp":"high","n":"Combining inflectional and analytical comparison markers ('more preferable', 'most simplest') creates a double comparative; examinees overuse 'more/most' with adjectives that already carry comparison in their form or meaning.","doubt":false},"m5_10":{"s":"learning","diff":"moderate","imp":"high","n":"Absolute adjectives (unique, perfect, unanimous, fatal) are binary states that admit no degrees; examinees modify them with 'very' or 'more', treating them as gradable, which is a frequently tested error in SSC/Banking.","doubt":false},"m5_11":{"s":"learning","diff":"moderate","imp":"high","n":"Latin comparatives (superior, inferior, senior, junior, prior) govern 'to', NOT 'than'; examinees use 'than' by analogy with English comparative adjectives, making this a reliable high-frequency SSC CGL trap.","doubt":false},"m5_12":{"s":"learning","diff":"moderate","imp":"high","n":"'Prefer' and 'preferable' govern 'to' (not 'than') and cannot be amplified with 'more'; examinees write 'more preferable than', combining double comparison with wrong preposition, a compound error in SSC CGL Tier 2.","doubt":false},"m5_13":{"s":"learning","diff":"moderate","imp":"medium","n":"'So...as' is restricted to negative propositions; examinees use it affirmatively ('is so efficient as') by analogy with 'as...as', producing a polarity mismatch between the sentence type and the equative structure.","doubt":false},"m5_14":{"s":"learning","diff":"tough","imp":"medium","n":"The incomplete equative trap ('as thorough, if not more thorough than') drops the second 'as' in the equative part; examinees omit it because the sentence sounds complete, but it is grammatically fractured without the closing 'as'.","doubt":false},"m5_15":{"s":"learning","diff":"moderate","imp":"high","n":"Proportional development ('the higher... the colder') requires 'the' before each comparative; examinees omit 'the' in one or both positions, or they break parallel order by varying sentence structure between the two clauses.","doubt":false},"m5_16":{"s":"learning","diff":"moderate","imp":"high","n":"'So + adjective/adverb' vs. 'such + (a/an) + noun' is a distribution rule for degree-result constructions; examinees use 'such' with bare adjectives ('such severe') or 'so' with noun phrases, violating the adjectival vs. nominal distribution.","doubt":false},"m5_17":{"s":"learning","diff":"easy","imp":"high","n":"'Fewer' for countable plurals vs. 'less' for uncountable nouns is a core prescriptive rule; examinees overuse 'less' with plural countable nouns ('less personnel', 'less errors'), making this a top SSC/Banking trap.","doubt":false},"m5_18":{"s":"learning","diff":"tough","imp":"high","n":"Comparing two qualities within the same entity ('more brave than prudent') prohibits the inflectional '-er' suffix; examinees use 'braver than prudent', mixing morphological and analytical comparatives, violating intra-subject comparison rules.","doubt":false},"m5_19":{"s":"learning","diff":"tough","imp":"medium","n":"Multiplicative comparisons require 'times as many/much as' for unambiguous equality scaling; 'times more than' introduces mathematical ambiguity (is it 3x or 4x the original?) — examinees use the colloquial but semantically flawed form.","doubt":false},"m5_20":{"s":"learning","diff":"easy","imp":"medium","n":"Gradual progression requires 'comparative and comparative' ('darker and darker' or 'more and more sophisticated'); examinees mix forms ('more and more dark'), combining an analytical marker with a non-comparative adjective.","doubt":false},"m6_1":{"s":"learning","diff":"easy","imp":"high","n":"'Between you and I' is a hyper-correction: prepositions govern objective case, so 'me/him/her' is mandatory; examinees over-correct to subjective 'I' to sound formal, making this a classic prestige-error trap.","doubt":false},"m6_2":{"s":"learning","diff":"tough","imp":"high","n":"In elliptical comparisons, 'than he' (subject comparison) vs. 'than him' (object comparison) completely changes the meaning; examinees collapse both to 'than him' for informality, missing the prescriptive case-meaning linkage.","doubt":false},"m6_3":{"s":"learning","diff":"moderate","imp":"medium","n":"After copular 'be', formal prescriptive grammar requires nominative case ('It was he'), but examinees default to objective case ('It was him') as the pragmatically natural form, collapsing formal-register requirements.","doubt":false},"m6_4":{"s":"learning","diff":"easy","imp":"high","n":"In compound objects, both pronouns must be in objective case; the 'X and I' over-correction is exposed when the noun is removed ('invited he' is clearly wrong); examinees fail to apply this isolation test.","doubt":false},"m6_5":{"s":"learning","diff":"moderate","imp":"high","n":"Before a gerund, the possessive pronoun ('his/their resigning') identifies the agent of the action; examinees use objective case ('them resigning'), inadvertently treating the person rather than the action as the direct object.","doubt":false},"m6_6":{"s":"learning","diff":"easy","imp":"high","n":"Reflexive pronouns ('myself', 'himself') cannot serve as standalone or compound subjects; examinees use 'myself' as a polite substitute for 'I' in compound subjects, a formal-register hypercorrection tested heavily in SSC.","doubt":false},"m6_7":{"s":"learning","diff":"moderate","imp":"medium","n":"Certain verbs (avail, resign, reconcile, pride) require a mandatory reflexive object ('avail himself of', 'resigned himself to') that examinees drop, producing intransitive constructions where these verbs are not conventionally intransitive.","doubt":false},"m6_8":{"s":"learning","diff":"moderate","imp":"medium","n":"Some verbs (qualify, hide, bathe) are inherently intransitive or naturally reflexive and do NOT take an explicit reflexive object; examinees add 'himself' ('qualified himself') by false analogy with mandatory-reflexive verbs.","doubt":false},"m6_9":{"s":"learning","diff":"easy","imp":"medium","n":"Intensive pronouns must match their antecedent in number and gender; examinees use 'itself' for plural 'cabinet ministers' or misplace the intensive by putting it too far from its head noun.","doubt":false},"m6_10":{"s":"learning","diff":"moderate","imp":"high","n":"'Who' is subjective (he/she = subject); 'whom' is objective (him/her = object or prepositional object); the substitution test (replace with he/him) is the key diagnostic that examinees skip, defaulting to 'who' throughout.","doubt":false},"m6_11":{"s":"learning","diff":"moderate","imp":"high","n":"Comma presence determines the choice between restrictive 'that' (no commas, essential) and non-restrictive 'which' (commas, supplementary) — examinees use 'that' with commas or 'which' without commas, altering the logical relationship.","doubt":false},"m6_12":{"s":"learning","diff":"tough","imp":"high","n":"After superlatives, absolutes ('all', 'none', 'nothing'), and the word 'only', 'that' is obligatory in place of 'which' or 'who'; examinees use 'which' after superlatives ('most compelling argument which'), ignoring the usage-forcing context.","doubt":false},"m6_13":{"s":"learning","diff":"moderate","imp":"medium","n":"Using 'of which' for inanimate possessive relatives requires the article 'the' before the possessed noun ('the assets of which'); examinees drop 'the', creating an ungrammatical relative clause.","doubt":false},"m6_14":{"s":"learning","diff":"tough","imp":"medium","n":"Preposition fronting (pied-piping) works with 'whom/which' but is strictly prohibited with 'that'; examinees write 'on that the minister stood' by over-applying preposition fronting to 'that', producing an ungrammatical relative clause.","doubt":false},"m6_15":{"s":"learning","diff":"moderate","imp":"medium","n":"The generic 'one' must have all its anaphors as 'one's/oneself'; examinees shift to 'his/him' mid-sentence, breaking internal concord and producing a register inconsistency that is a classic UPSC/CAT formal-writing error.","doubt":false},"m6_16":{"s":"learning","diff":"moderate","imp":"medium","n":"Formal prescriptive grammar requires 'his or her' for singular indefinite pronouns (everyone, each); examinees use 'their' (now accepted in informal/descriptive grammar) — this creates a prescriptive/descriptive conflict frequently tested in UPSC CDS.","doubt":false},"m6_17":{"s":"learning","diff":"easy","imp":"medium","n":"'Each other' is for two entities; 'one another' is for three or more — a clean prescriptive rule that examinees conflate, using 'each other' for group interactions or 'one another' for dual-entity scenarios.","doubt":false},"m6_18":{"s":"learning","diff":"moderate","imp":"medium","n":"'The former/latter' work only with two referents; three or more require 'the first/the last'; examinees use 'the latter' for the third of three items, creating an unresolvable reference in the pronoun chain.","doubt":false},"m6_19":{"s":"learning","diff":"tough","imp":"medium","n":"'Each' before an of-phrase governs singular verb + his/her; 'each' appositive after plural subject governs plural verb + their — examinees conflate these two structural positions, applying the singular rule to the appositive pattern.","doubt":false},"m6_20":{"s":"learning","diff":"moderate","imp":"high","n":"Polite person ordering (2→3→1 for positive; 1→2→3 for blame) is a fixed prescriptive rule tested in SSC; examinees use 'I, you, and he' for positive contexts, inverting the politeness hierarchy.","doubt":false},"m6_21":{"s":"learning","diff":"moderate","imp":"high","n":"A pronoun with two plausible antecedents is syntactically ambiguous ('he' referring to supervisor or intern) — examinees must identify the ambiguity and reconstruct the sentence with an explicit noun, a skill tested in CAT sentence correction.","doubt":false},"m6_22":{"s":"learning","diff":"tough","imp":"high","n":"A pronoun cannot refer back to a possessive modifier ('Shakespeare's') as its antecedent — 'Shakespeare's Hamlet... he explores' has no independent noun for 'he' to refer to; examinees overlook this hidden antecedent defect.","doubt":false},"m6_23":{"s":"learning","diff":"moderate","imp":"medium","n":"Broad reference 'which' (referring to an entire preceding clause) is acceptable colloquially but formally requires a summarizing noun phrase ('a decision that', 'a move that'); tested in UPSC CDS and CAT formal writing assessment.","doubt":false},"m6_24":{"s":"learning","diff":"moderate","imp":"medium","n":"In 'neither/either A or B' structures with gendered antecedents of different genders, the pronoun agrees with the nearer antecedent by proximity; examinees default to the first-mentioned gender, ignoring the proximity rule.","doubt":false},"m7_1":{"s":"learning","diff":"tough","imp":"high","n":"'Not only... but also' must be placed immediately before structurally identical constituents; the trap is placing 'not only' before a verb but 'but also' before a noun, breaking syntactic parallelism — a top-priority SSC/CAT parallelism error.","doubt":false},"m7_2":{"s":"learning","diff":"moderate","imp":"high","n":"Fixed correlative pairs (neither...nor, both...and, whether...or) cannot be cross-contaminated; examinees write 'neither...or', 'both...as well as', or 'whether...and', mixing lexical components from different pairs.","doubt":false},"m7_3":{"s":"learning","diff":"tough","imp":"high","n":"'Either...or' and 'neither...nor' must align syntactically identical constituents; examinees place 'either' before a prepositional phrase but 'or' before a verb phrase, creating an asymmetric structure despite correct lexical pairing.","doubt":false},"m7_4":{"s":"learning","diff":"easy","imp":"high","n":"'Between' must partner with 'and'; 'from' must partner with 'to'; examinees write 'between... to' by mixing these two frameworks — an extremely common error in SSC CGL and Banking fill-in-the-blank questions.","doubt":false},"m7_5":{"s":"learning","diff":"moderate","imp":"high","n":"'No sooner' demands 'than'; 'hardly/scarcely' demand 'when'; cross-pairing ('hardly...than' or 'no sooner...when') is a classic SSC error that also requires past perfect inversion in the first clause.","doubt":false},"m7_6":{"s":"learning","diff":"moderate","imp":"high","n":"'Although/though/even though' requires a full clause; 'despite/in spite of' requires a noun/gerund — examinees write 'despite of' (ungrammatical) or 'despite + clause' (category mismatch), making this a double-trap rule.","doubt":false},"m7_7":{"s":"learning","diff":"easy","imp":"high","n":"'Because' introduces a clause; 'because of/due to/owing to' introduces a noun phrase — examinees write 'because of the supplies ceased' (mixing clause with prepositional frame), a high-frequency error in SSC CGL error-spotting.","doubt":false},"m7_8":{"s":"learning","diff":"easy","imp":"high","n":"'While' is a conjunction (clause follows); 'during' is a preposition (noun follows) — examinees write 'during the delegates deliberated' (prepositional frame with finite clause), a basic connector-category error.","doubt":false},"m7_9":{"s":"learning","diff":"moderate","imp":"medium","n":"'So that/in order that' require a modal-governed clause; 'in order to/so as to' require a bare infinitive — examinees mix these ('in order that to restore...'), combining a clause-governing connector with a non-finite complement.","doubt":false},"m7_10":{"s":"learning","diff":"easy","imp":"high","n":"'Although... but' and 'because... therefore' are redundant double conjunctions — examinees pair subordinating and coordinating conjunctions, using both to introduce the same clause-relationship, a tautological connector error.","doubt":false},"m7_11":{"s":"learning","diff":"tough","imp":"medium","n":"'Lest' already means 'for fear that... not' — adding 'not' creates a double negative; examinees write 'lest you should not stumble', and 'lest' also requires 'should + base verb' or mandative subjunctive, not indicative mood.","doubt":false},"m7_12":{"s":"learning","diff":"moderate","imp":"high","n":"'Unless' and 'until' carry inherent negative meaning; inserting 'not' inside their clauses creates double negation ('unless the council does not ratify' = 'if the council ratifies') — a high-frequency SSC logical-error trap.","doubt":false},"m7_13":{"s":"learning","diff":"moderate","imp":"high","n":"'The reason why... is because' is a tautological causal redundancy; 'because' must be replaced by 'that', since 'reason' already encodes causality — one of the most tested prescriptive redundancy rules in SSC CGL and UPSC CDS.","doubt":false},"m7_14":{"s":"learning","diff":"easy","imp":"high","n":"Morphological parallelism in coordinate series requires all elements to share the same grammatical form (all gerunds, all nouns, all infinitives); examinees mix gerunds with infinitives ('reducing... and to cut...') in the same list.","doubt":false},"m7_15":{"s":"learning","diff":"tough","imp":"high","n":"When two coordinated adjectives/verbs require different prepositions ('interested in' and 'dedicated to'), each preposition must be stated explicitly; sharing one preposition across different collocational frames creates a prepositional ellipsis error.","doubt":false},"m7_16":{"s":"learning","diff":"moderate","imp":"medium","n":"In a coordinate series of infinitives, 'to' must be either consistently shared (stated once) or consistently repeated; arbitrary omission in the middle of a list ('to study, to cross-examine, and evaluate') breaks infinitive parallelism.","doubt":false},"m7_17":{"s":"learning","diff":"moderate","imp":"medium","n":"Clausal parallelism requires coordinated relative clauses to share the same structural type; examinees mix a relative clause ('who possesses') with a participial phrase ('having experience'), breaking the head noun's modifier symmetry.","doubt":false},"m7_18":{"s":"learning","diff":"moderate","imp":"medium","n":"'As well as' functions as a quasi-coordinator, not a full conjunction; when followed by a verb complement, it requires a gerund ('providing'), not a bare or full infinitive ('provide/to provide').","doubt":false},"m7_19":{"s":"learning","diff":"tough","imp":"low","n":"The 'as... so' analogous correlative ('As you sow, so shall you reap') uses inverted syntax in the so-clause; examinees confuse 'like' with 'as' or omit the 'so', losing the formal parallel analogy structure.","doubt":false},"m7_20":{"s":"learning","diff":"moderate","imp":"high","n":"'Whether' (not 'if') is obligatory after prepositions, before 'or not', and before to-infinitives; examinees use 'if' in all these positions ('depends on if', 'if or not', 'debated if to'), replacing obligatory 'whether' with colloquial 'if'.","doubt":false},"m7_21":{"s":"learning","diff":"moderate","imp":"high","n":"Conjunctive adverbs (however, therefore, moreover) cannot join independent clauses with only a comma (comma splice); a semicolon + conjunctive adverb + comma is required, a boundary mechanic routinely confused with FANBOYS + comma usage.","doubt":false},"m7_22":{"s":"learning","diff":"tough","imp":"medium","n":"Affirmative 'I doubt whether' signals genuine uncertainty; negative 'I don't doubt that' signals certainty — examinees use 'that' in affirmative doubt ('I doubt that the accord will hold'), violating the polarity-governed complement choice.","doubt":false},"m8_1":{"s":"learning","diff":"easy","imp":"high","n":"A comma splice joins two independent clauses with only a comma — the most frequent punctuation error in SSC CGL; examinees must identify both clauses are independent and supply a coordinating conjunction or semicolon.","doubt":false},"m8_2":{"s":"learning","diff":"easy","imp":"medium","n":"A fused sentence has no boundary marker between two independent clauses; examinees miss it because rapid reading skips the absence of punctuation, making this a visual-scanning trap in error-detection sections.","doubt":false},"m8_3":{"s":"learning","diff":"moderate","imp":"high","n":"A subordinate clause (after 'although', 'because', 'since') has subject+verb but cannot stand alone; examinees punctuate it as a complete sentence because it looks syntactically complete at surface level.","doubt":false},"m8_4":{"s":"learning","diff":"moderate","imp":"medium","n":"A participial phrase fragment ('Leaving the diplomatic corps without a framework') lacks a finite verb; examinees punctuate it as an independent sentence, missing that it must attach to the preceding independent clause.","doubt":false},"m8_5":{"s":"learning","diff":"tough","imp":"high","n":"A compound predicate (two verbs sharing one subject) must not be separated by a comma before 'and'; examinees insert a comma by analogy with compound sentence structure, splitting a single predicate with an unnecessary boundary comma.","doubt":false},"m8_6":{"s":"learning","diff":"moderate","imp":"medium","n":"A semicolon connects two independent clauses; examinees use it before subordinate clauses (beginning with 'because', 'since') on the right side, forgetting that a semicolon requires two complete independent clauses.","doubt":false},"m8_7":{"s":"learning","diff":"moderate","imp":"medium","n":"Semicolons as 'super-commas' in complex lists with internal commas (city, country; city, country) prevent ambiguous boundary interpretation; examinees use regular commas throughout, creating a six-location reading where only three exist.","doubt":false},"m8_8":{"s":"learning","diff":"moderate","imp":"high","n":"A colon must follow a complete independent clause; examinees place colons directly after verbs ('include:') or prepositions, which breaks the rule that nothing grammatically essential to the main clause can precede the colon.","doubt":false},"m8_9":{"s":"learning","diff":"moderate","imp":"high","n":"A conjunctive adverb ('however', 'therefore') joining independent clauses requires a semicolon before and a comma after; examinees use only a comma before 'however', creating a comma splice that is harder to detect.","doubt":false},"m8_10":{"s":"learning","diff":"tough","imp":"high","n":"Adding or removing commas around a relative clause changes meaning from restrictive (identifies which one) to non-restrictive (adds supplementary info about an already identified noun) — a punctuation-meaning linkage frequently tested in CAT.","doubt":false},"m8_11":{"s":"learning","diff":"tough","imp":"high","n":"An interrupting parenthetical must be bounded by a pair of commas; a single comma creates an ungrammatical subject-verb barrier — the exam tests whether examinees can identify an unpaired comma within a complex noun phrase.","doubt":false},"m8_12":{"s":"learning","diff":"moderate","imp":"medium","n":"An em-dash opening a parenthetical interruption must be closed by a matching em-dash; mismatching with a comma ('assets—equities, bonds, and metals, appreciated') creates a punctuation asymmetry that examinees must detect.","doubt":false},"m8_13":{"s":"learning","diff":"moderate","imp":"medium","n":"Long introductory adverbial clauses and absolute phrases must be followed by a comma before the main clause; examinees omit the comma when the introductory modifier runs long, creating a subject-predicate parsing ambiguity.","doubt":false},"m8_14":{"s":"learning","diff":"easy","imp":"high","n":"Pre-nominal compound adjectives require hyphens ('well-constructed speech'), but post-nominal predicative compounds do not ('was well constructed'); examinees either add hyphens predicatively or omit them attributively.","doubt":false},"m8_15":{"s":"learning","diff":"easy","imp":"medium","n":"-ly adverbs + adjective/participle compounds ('highly esteemed', 'rapidly diminishing') never take hyphens because '-ly' already unambiguously marks the adverbial function; examinees add hyphens by over-applying the compound-adjective rule.","doubt":false},"m8_16":{"s":"learning","diff":"moderate","imp":"medium","n":"Joint possession uses one apostrophe-s on the last noun only ('Watson and Crick's paper'); separate possession uses apostrophe-s on each noun ('Picasso's and Dalí's styles') — examinees conflate these, misassigning possessorship.","doubt":false},"m8_17":{"s":"learning","diff":"moderate","imp":"medium","n":"Irregular plural nouns not ending in -s ('men', 'women', 'children') take apostrophe-s ('men's'); regular plurals ending in -s take only an apostrophe ('workers''); singular proper nouns ending in -s also take apostrophe-s ('Keats's').","doubt":false},"m8_18":{"s":"learning","diff":"tough","imp":"high","n":"The vocative (direct address) comma is life-altering: 'Let us execute the general' means execute him; 'Let us execute, General,' is a polite address — examinees miss the vocative comma, enabling catastrophic meaning shifts tested in error-spotting.","doubt":false},"m9_1":{"s":"learning","diff":"moderate","imp":"high","n":"Intransitive verbs (occur, happen, arrive, die) have no direct object and cannot be passivized; examinees write 'was occurred', 'was happened' by analogy with transitive passives, a basic but frequent SSC CGL error.","doubt":false},"m9_2":{"s":"learning","diff":"tough","imp":"medium","n":"Ergative verbs ('the book sells well', 'this cloth washes easily') use active form with inanimate subjects to express inherent quality; examinees impose passive morphology ('is sold well', 'is washed easily'), confusing middle-voice constructions with standard passives.","doubt":false},"m9_3":{"s":"learning","diff":"moderate","imp":"high","n":"Prepositional passives require the governing preposition to be retained after the participle ('accounted for by', 'sent for') — examinees drop the preposition in the passive voice, producing an intransitive reading of what is a prepositional-object verb.","doubt":false},"m9_4":{"s":"learning","diff":"tough","imp":"medium","n":"Ditransitive verbs permit two passive forms (recipient promoted vs. theme promoted); when the theme is promoted, the recipient must be preceded by 'to/for' — examinees omit the preposition ('was awarded the ambassador'), creating a grammatically incomplete passive.","doubt":false},"m9_5":{"s":"learning","diff":"moderate","imp":"high","n":"Coordinated clauses sharing the same logical agent must maintain consistent voice; abruptly shifting from active to passive ('secured the perimeter, and the vehicle was searched') creates an asymmetric voice mismatch tested in SSC sentence improvement.","doubt":false},"m9_6":{"s":"learning","diff":"tough","imp":"high","n":"In active causatives and perception verbs (make, see, hear), the bare infinitive resurfaces as a full to-infinitive in passive voice ('was made to confess', 'was seen to enter') — examinees retain the bare infinitive form, missing the passive-to-infinitive reactivation rule.","doubt":false},"m9_7":{"s":"learning","diff":"moderate","imp":"medium","n":"Passive imperatives ('Let it be done') place negation after 'be', not before it ('Let it not be disclosed'); examinees write 'Let it be not disclosed', misplacing the negative particle in formal command structures.","doubt":false},"m9_8":{"s":"learning","diff":"moderate","imp":"high","n":"Passive infinitives ('to be received') and passive gerunds ('being interrogated') are required when the subject is the patient of the non-finite action; examinees use active forms ('to receive', 'interrogating'), inverting the agent-patient relationship.","doubt":false},"m9_9":{"s":"learning","diff":"moderate","imp":"high","n":"After 'need/require/want', an active gerund ('needs upgrading') carries passive meaning; examinees use 'needs to upgrade' (active infinitive) which wrongly implies the infrastructure will itself carry out the upgrading action.","doubt":false},"m9_10":{"s":"learning","diff":"tough","imp":"high","n":"'Dare/need' as modal auxiliaries take bare infinitive without 'do' support ('need not file', 'dare not oppose'), but as main verbs they require 'do' + to-infinitive ('does not need to'); examinees conflate the two regimes.","doubt":false},"m9_11":{"s":"learning","diff":"tough","imp":"high","n":"'Needn't have + V3' (unnecessary action was performed) vs. 'didn't need to + V1' (unnecessary action was not performed) is a past-modal semantic contrast; examinees use either form interchangeably, missing the 'wasted effort' vs. 'saved effort' distinction.","doubt":false},"m9_12":{"s":"learning","diff":"tough","imp":"high","n":"For past epistemic deduction, 'cannot have / could not have + V3' is the negative counterpart of 'must have + V3'; examinees write 'must not have + V3', which expresses prohibition/blame rather than logical impossibility.","doubt":false},"m9_13":{"s":"learning","diff":"moderate","imp":"high","n":"'Should have + V3' (unfulfilled obligation), 'could have + V3' (unrealized ability), and 'might have + V3' (past contingency) are semantically distinct; examinees use 'must have' for obligation ('must have warned'), confusing certainty-deduction with duty.","doubt":false},"m9_14":{"s":"learning","diff":"moderate","imp":"high","n":"'Must not' = prohibition; 'need not/do not have to' = absence of obligation — examinees use 'must not' when the intended meaning is 'it is not necessary to', reversing permission into prohibition in exam scenarios.","doubt":false},"m9_15":{"s":"learning","diff":"moderate","imp":"high","n":"'Had better' takes bare infinitive (not 'to'); its negative is 'had better not' (not 'hadn't better'); examinees either add 'to' after 'better' or form the negative with 'hadn't better', violating the fixed idiomatic modal pattern.","doubt":false},"m9_16":{"s":"learning","diff":"tough","imp":"high","n":"'Would rather' with same subject → bare infinitive; with different subject → simple past subjunctive (present/future) or past perfect (past regret) — examinees add 'to' ('would rather to postpone') or fail to shift tense with a new subject.","doubt":false},"m9_17":{"s":"learning","diff":"moderate","imp":"high","n":"'Would' expresses repeated past actions but cannot express past states; 'used to' expresses both past states and past habits — examinees use 'would be' for stative conditions ('London would be shrouded'), replacing mandatory 'used to be'.","doubt":false},"m9_18":{"s":"learning","diff":"tough","imp":"medium","n":"Faulty auxiliary ellipsis ('has never and will never compromise') forces 'compromise' to serve both 'has never' (requiring V3) and 'will never' (requiring V1) simultaneously — examinees accept this because it sounds fluent despite being structurally broken.","doubt":false},"m9_19":{"s":"learning","diff":"tough","imp":"medium","n":"Ellipsis across subjects with different number ('One was killed and twelve injured') requires restoring the plural 'were' for the second clause; examinees accept the elliptical version, missing that 'twelve was' is ungrammatical.","doubt":false},"m9_20":{"s":"learning","diff":"moderate","imp":"medium","n":"'Do so' can substitute for dynamic verb phrases but not stative verbs; examinees use 'did so' after 'understood/knew/belonged' — stative verbs that resist the pro-form substitution because they denote states, not actions.","doubt":false},"m9_21":{"s":"learning","diff":"tough","imp":"low","n":"Gapping in parallel clauses requires a comma at the site of the elided verb and a semicolon between clauses ('France exported wine; Italy, leather'); examinees omit both markers, making the gapped sentence syntactically opaque.","doubt":false},"m9_22":{"s":"learning","diff":"moderate","imp":"high","n":"Elliptical modal agreement ('so did/neither can') must match the modal category of the antecedent clause; examinees mix modals ('and so the engineer must' instead of 'so should') because they focus on meaning rather than formal modal matching.","doubt":false},"m10_1":{"s":"learning","diff":"moderate","imp":"high","n":"Standard backshifting (present→past simple; past/present perfect→past perfect) is widely known but examinees fail to apply both the tense shift AND the time-adverb shift simultaneously, partially correcting the sentence.","doubt":false},"m10_2":{"s":"learning","diff":"moderate","imp":"medium","n":"When the reporting verb is present/future, no backshifting occurs; examinees erroneously backshift the reported tense ('says that inflation had subsided') by applying the past-reporting rule to a non-past reporting verb.","doubt":false},"m10_3":{"s":"learning","diff":"moderate","imp":"high","n":"Universal truths and scientific axioms resist backshifting even with past reporting verbs ('demonstrated that light travels faster than sound'); examinees shift them to past ('travelled'), incorrectly treating scientific facts as context-dependent claims.","doubt":false},"m10_4":{"s":"learning","diff":"moderate","imp":"medium","n":"Historical facts with definite calendar dates ('fell in 1789') retain simple past in indirect speech, not past perfect; examinees apply standard backshifting and convert to past perfect, but the definite date anchors the event and blocks the shift.","doubt":false},"m10_5":{"s":"learning","diff":"tough","imp":"high","n":"Modals already in past form ('should', 'would', 'might', 'could') do not backshift further; examinees try to backshift 'should have' to 'had should have', creating ungrammatical double backshifts of already-past modal forms.","doubt":false},"m10_6":{"s":"learning","diff":"moderate","imp":"high","n":"Deictic time/place markers must shift (today→that day, here→there, now→then) when the reporting context is removed in time/space; examinees retain proximal deictics in temporally displaced indirect speech, creating logical inconsistency.","doubt":false},"m10_7":{"s":"learning","diff":"tough","imp":"medium","n":"When speech is reported the same day or in the same location, proximal deictics ('today', 'here') are retained; examinees over-apply the deictic shift rule, replacing 'today' with 'that day' even when the context hasn't changed.","doubt":false},"m10_8":{"s":"learning","diff":"moderate","imp":"medium","n":"Demonstratives 'this/these' shift to 'that/those'; 'this' as a definite determiner often shifts to 'the'; examinees mechanically replace all 'this' with 'that', missing the subset that should become 'the' for specific topics.","doubt":false},"m10_9":{"s":"learning","diff":"moderate","imp":"high","n":"Indirect questions use declarative word order (subject + verb), never interrogative inversion; examinees write 'inquired where had the suspect concealed' retaining the inversion from the original direct question.","doubt":false},"m10_10":{"s":"learning","diff":"moderate","imp":"high","n":"The conjunction 'that' cannot co-occur with a wh-question word in indirect questions; examinees write 'inquired that why...', adding 'that' before wh-words by false analogy with that-clause reporting verbs.","doubt":false},"m10_11":{"s":"learning","diff":"moderate","imp":"high","n":"'Whether or not' cannot be replaced with 'if or not'; 'whether to + V1' cannot be replaced with 'if to + V1'; and 'whether' (not 'if') follows prepositions — examinees use 'if' as a universal alternative to 'whether' in all these positions.","doubt":false},"m10_12":{"s":"learning","diff":"moderate","imp":"high","n":"'Tell' directly takes a person object without 'to' ('told the soldiers'); 'say' requires 'to' before a person ('said to me'); examinees write 'told to the soldiers' or 'said me', swapping the preposition regimes of these two common reporting verbs.","doubt":false},"m10_13":{"s":"learning","diff":"tough","imp":"high","n":"'Forbid' already encodes negation; adding 'not' to its infinitive complement creates a double negative ('forbade... not to liquidate' = permitted liquidation); examinees add 'not' by analogy with 'ordered not to' and 'warned not to'.","doubt":false},"m10_14":{"s":"learning","diff":"moderate","imp":"medium","n":"Exclamations ('Alas!') and optative wishes ('May you prosper') cannot be reported with 'said'; t
